        text: "matizar"
        is_correct: true
      - position: 3
        text: "maquillar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Maquillar» es disimular algo para que parezca mejor, y en la frase el fallo de los plazos se reconoce en voz alta."
