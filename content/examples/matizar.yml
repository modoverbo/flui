    hint_general: "Acepta la crítica, pero quiere que sea más precisa y más justa."
    explanation: "Matizara: pide precisar la crítica para que sea justa. «Maquillara» sería disimularla, y «retirara» sería dejar de decirla, pero ella acepta una parte."
