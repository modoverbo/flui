confusions:
  - confused_with: "atizar"
    difference: "«Atizar» es avivar el fuego o, en sentido figurado, empeorar un conflicto; lo otro busca precisión y calma la conversación."
    memory_trick: "Precisas para aclarar; atizas para encender."
  - confused_with: "maquillar"
    difference: "«Maquillar» es disimular algo para que parezca mejor; aquí se añaden detalles verdaderos que hacen la idea más justa."
    memory_trick: "Uno aclara; maquillar tapa."
exercises:
