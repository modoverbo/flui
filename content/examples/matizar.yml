    sentence: "Inés dijo que el proyecto había sido un fracaso, pero enseguida lo quiso {{blank}}: «Fallamos en los plazos, aunque el cliente quedó contento»."
    hint_general: "Añade un detalle verdadero que hace su opinión más justa."
    explanation: "Matizar: precisa la opinión con un dato que la hace más justa. «Atizar» sería avivar un conflicto, y «maquillar» sería esconder el fallo, pero ella lo reconoce."
    options:
      - position: 1
        text: "atizar"
        is_correct: false
