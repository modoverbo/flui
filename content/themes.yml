# flui theme taxonomy — 28 themes: the 16 that launch with words of their own
# and 12 that recombine the same catalog into another situation.
#
# family: trabajo | social | publico | precision | emocion
# content_type: word_driven | expression_driven | mixed
# Copy is Spanish, brand voice (warm, direct, "tú", never school words).
#
# The offer is not the taxonomy: `status` and `published` live in
# supabase/seed_themes.sql, because they depend on how much content a theme
# has today, not on what the theme is.
schema_version: 1
themes:
  - slug: reuniones
    family: trabajo
    name: Reuniones
    tagline: Que se note que estabas ahí.
    jtbd: Quiero intervenir en una reunión y que mi idea se entienda a la primera.
    content_type: word_driven
    sort_order: 1

  - slug: presentaciones-oratoria
    family: publico
    name: Presentaciones
    tagline: Hablar delante de gente sin sonar a guion.
    jtbd: Quiero presentar mi trabajo y sonar seguro sin memorizar cada frase.
    content_type: mixed
    sort_order: 2

  - slug: entrevistas
    family: trabajo
    name: Entrevistas
    tagline: Contar lo que vales sin exagerar.
    jtbd: Quiero responder en una entrevista con ejemplos concretos y palabras justas.
    content_type: mixed
    sort_order: 3

  - slug: negociacion
    family: trabajo
    name: Negociación
    tagline: Pedir claro y quedar bien.
    jtbd: Quiero pedir un aumento o cerrar un trato sin sonar agresivo ni inseguro.
    content_type: mixed
    sort_order: 4

  - slug: liderazgo-feedback
    family: trabajo
    name: Liderazgo y feedback
    tagline: Decir lo que hay que decir sin romper nada.
    jtbd: Quiero dar feedback a mi equipo de forma que se entienda y no duela.
    content_type: word_driven
    sort_order: 5

  - slug: conflicto-desacuerdo
    family: emocion
    name: Desacuerdos
    tagline: No estar de acuerdo sin convertirlo en pelea.
    jtbd: Quiero discrepar en voz alta y que la conversación siga siendo posible.
    content_type: expression_driven
    sort_order: 6

  - slug: correos-mensajes
    family: trabajo
    name: Correos y mensajes
    tagline: Escribir corto y que no suene seco.
    jtbd: Quiero escribir un correo breve que consiga respuesta y no parezca brusco.
    content_type: expression_driven
    sort_order: 7

  - slug: redaccion-ejecutiva
    family: trabajo
    name: Escribir para que te lean
    tagline: Menos palabras, más decisión.
    jtbd: Quiero resumir un tema complejo en un párrafo que alguien ocupado entienda.
    content_type: word_driven
    sort_order: 8

  - slug: persuasion-storytelling
    family: publico
    name: Convencer y contar
    tagline: Una idea se recuerda cuando tiene forma de historia.
    jtbd: Quiero contar lo que hice de modo que la otra persona lo recuerde mañana.
    content_type: mixed
    sort_order: 9

  - slug: conversaciones-dificiles
    family: emocion
    name: Conversaciones difíciles
    tagline: Abrir el tema que llevas semanas evitando.
    jtbd: Quiero empezar una conversación incómoda sin que la otra persona se cierre.
    content_type: expression_driven
    sort_order: 10

  - slug: matices-precision
    family: precision
    name: Matices
    tagline: La diferencia entre parecido y exacto.
    jtbd: Quiero decir exactamente lo que pienso, ni más fuerte ni más flojo.
    content_type: word_driven
    sort_order: 11

  - slug: conectores-estructura
    family: precision
    name: Conectores
    tagline: Las palabras que sostienen una idea larga.
    jtbd: Quiero enlazar mis ideas para que se sigan sin perderse a la mitad.
    content_type: expression_driven
    sort_order: 12

  - slug: paronimos
    family: precision
    name: Palabras que se parecen
    tagline: Dos palabras casi iguales, dos significados distintos.
    jtbd: Quiero dejar de confundir pares que se parecen y suenan a descuido.
    content_type: word_driven
    sort_order: 13

  - slug: elogio-reconocimiento
    family: social
    name: Reconocer a otros
    tagline: Un elogio preciso vale por diez genéricos.
    jtbd: Quiero reconocer el trabajo de alguien de forma específica y creíble.
    content_type: word_driven
    sort_order: 14

  - slug: decir-que-no
    family: emocion
    name: Decir que no
    tagline: Negarte sin dar diez explicaciones.
    jtbd: Quiero rechazar una petición y mantener la relación intacta.
    content_type: expression_driven
    sort_order: 15

  - slug: conversacion-cotidiana
    family: social
    name: Conversación diaria
    tagline: Hablar del día a día con palabras que encajan.
    jtbd: Quiero contar lo que me pasa sin repetir siempre cosa, tema y hacer.
    content_type: mixed
    sort_order: 16

  # 17..28 — the situations that reuse the catalog. These mostly do not ask for
  # new lemmas: they ask for exercises and readings that put the existing words
  # in another room. supabase/seed_themes.sql keeps them `soon` and unpublished
  # until they have content, so the picker never offers an empty theme.

  - slug: ventas
    family: trabajo
    name: Ventas
    tagline: Que el valor se vea, sin inflarlo.
    jtbd: Quiero explicar lo que ofrezco con ejemplos concretos y que el precio deje de ser el único tema.
    content_type: mixed
    sort_order: 17

  - slug: networking
    family: trabajo
    name: Hacer contactos
    tagline: Que te recuerden después de treinta segundos.
    jtbd: Quiero presentarme en un evento y que después recuerden a qué me dedico.
    content_type: expression_driven
    sort_order: 18

  - slug: redes-sociales
    family: publico
    name: Redes sociales
    tagline: Un gancho que no es un cebo.
    jtbd: Quiero abrir una publicación con una frase que atrape y que el resto la sostenga.
    content_type: expression_driven
    sort_order: 19

  - slug: docencia
    family: publico
    name: Enseñar
    tagline: Lo difícil explicado como si fuera fácil.
    jtbd: Quiero explicar un tema que domino a quien parte de cero y que se quede con la idea.
    content_type: mixed
    sort_order: 20

  - slug: medios-entrevistas
    family: publico
    name: Hablar con medios
    tagline: Responder lo que preguntan y decir lo tuyo.
    jtbd: Quiero contestar una pregunta incómoda en público sin esquivarla ni regalar un titular.
    content_type: expression_driven
    sort_order: 21

  - slug: humor
    family: social
    name: Humor
    tagline: Hacer reír sin que nadie pague el chiste.
    jtbd: Quiero contar algo con gracia y que la broma no caiga sobre alguien.
    content_type: expression_driven
    sort_order: 22

  - slug: citas
    family: social
    name: Citas
    tagline: Coquetear con palabras tuyas, no con frases hechas.
    jtbd: Quiero decir lo que me atrae de alguien sin recurrir a una frase prestada.
    content_type: expression_driven
    sort_order: 23

  - slug: amistad
    family: social
    name: Amistad
    tagline: Decir lo que sientes sin taparlo con una broma.
    jtbd: Quiero decirle a un amigo lo que significa para mí sin restarle importancia.
    content_type: expression_driven
    sort_order: 24

  - slug: small-talk
    family: social
    name: Romper el hielo
    tagline: Los primeros noventa segundos.
    jtbd: Quiero empezar una conversación con alguien que acabo de conocer y que no se apague en dos frases.
    content_type: expression_driven
    sort_order: 25

  - slug: familia-crianza
    family: social
    name: Familia y crianza
    tagline: Explicar sin sermonear.
    jtbd: Quiero explicar una decisión en casa sin que suene a sermón y sin ceder en el fondo.
    content_type: expression_driven
    sort_order: 26

  - slug: empatia-escucha
    family: emocion
    name: Escuchar
    tagline: Que se note que entendiste.
    jtbd: Quiero responder a quien me cuenta algo difícil y que sienta que lo escuché de verdad.
    content_type: expression_driven
    sort_order: 27

  - slug: pedir-disculparse
    family: emocion
    name: Pedir y disculparse
    tagline: Pedir sin encogerte, disculparte sin excusas.
    jtbd: Quiero pedir lo que necesito y reconocer un fallo sin justificarme de más.
    content_type: mixed
    sort_order: 28
