# flui content authoring toolkit.
#
# The package is named `content` (not `flui_content`) on purpose: `dart run
# <package>:<script>` resolves <package> against the package name, and every
# command in the brief, in AUTHORING.md and in GATE.md is spelled
# `dart run content:<command>`. Renaming the package would break that contract
# for the authoring agents, which is the only interface that matters here.
name: content
description: >-
  Authoring toolkit for flui's Spanish learning content: YAML word files, the
  validator suite that is the whole quality system, the deterministic
  supabase/seed.sql emitter and the adversarial gate harness.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  args: ^2.7.0
  collection: ^1.19.0
  crypto: ^3.0.6
  path: ^1.9.0
  yaml: ^3.1.3

dev_dependencies:
  test: ^1.25.15
  very_good_analysis: ^9.0.0
