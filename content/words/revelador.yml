      - position: 2
        text: "revelador"
        is_correct: true
      - position: 3
        text: "bestial"
        is_correct: false
        distractor_type: "register"
        why_not: "«Bestial» es coloquial y habla del tamaño de la sorpresa, no de que el dato mostrara algo escondido."
