explanation: "Que muestra algo que no se veía y cambia la idea que tenías antes."
example_sentence: "El dato más revelador no fue la caída de ventas: fue la hora a la que la gente se iba."
register: "neutral"
pedantry_risk: 1
usage_tip: "Sirve para señalar el dato que de verdad importa dentro de una montaña de cifras correctas."
when_not_to_use: "No la uses para algo que confirma lo que ya sabías: si no cambia nada, será útil, pero no descubre nada."
collocations:
  - "un dato revelador"
  - "un detalle revelador"
  - "un silencio revelador"
replaces:
