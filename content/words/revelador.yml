    scene: "trabajo"
    conversation_type: "practica"
    title: "La hora de las siete"
    body: "El panel tenía cuarenta cifras y todas parecían iguales. Otilia señaló una: «Este es el dato revelador: a las siete de la tarde se va el 60 % de la gente sin comprar». Al mes siguiente movieron el aviso de envío a esa hora."
    before_phrase: "Aquí hay un dato que dice mucho, creo."
    after_phrase: "Este es el dato revelador."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Por qué nos mudamos"
    body: "Ivo creía saber la historia de aquella mudanza. Su madre añadió una frase: «Nos fuimos porque tu hermana necesitaba una escuela con apoyo». Fue revelador: veinte años de recuerdos se recolocaron en una tarde."
    before_phrase: "Ah, pues eso lo explica todo."
    after_phrase: "Fue revelador: cambió lo que yo recordaba."
  - position: 3
    scene: "entrevista"
    conversation_type: "practica"
    title: "La pausa antes de responder"
    body: "Ámbar preguntó cómo se tomaban las decisiones cuando había desacuerdo. Hubo una pausa larga y dos miradas cruzadas. «Esa pausa fue reveladora», contó luego: aceptó el puesto sabiendo exactamente qué tendría que arreglar."
    before_phrase: "Se notó algo raro, no sé."
    after_phrase: "Esa pausa fue reveladora."
