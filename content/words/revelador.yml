  - position: 3
    sentence: "Un detalle {{blank}} cambió la reunión entera: el cliente llamaba siempre los viernes por la tarde."
    hint_general: "Ese detalle enseñó algo que nadie había notado."
    explanation: "Revelador: el detalle enseñó algo que nadie había notado. «Relevante» diría que importa, sin decir que descubre, y «curioso» solo llamaría la atención."
    options:
