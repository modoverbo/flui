confusions:
  - confused_with: "relevante"
    difference: "«Relevante» dice que algo importa; la otra palabra dice que además enseña algo que no se veía."
    memory_trick: "Lo relevante pesa; lo otro abre una puerta."
  - confused_with: "rebelde"
    difference: "«Rebelde» describe a quien no obedece; la otra palabra describe un dato o un gesto que deja algo al descubierto."
    memory_trick: "El rebelde se planta; el otro dato destapa."
exercises:
  - position: 1
    sentence: "El dato más {{blank}} no fue la caída de ventas: fue la hora a la que la gente se iba, algo que nadie había mirado."
    hint_general: "Ese dato enseñó algo que hasta entonces nadie veía."
    explanation: "Revelador: enseñó algo que nadie había mirado. «Relevante» diría solo que importa, y «bestial» es coloquial y habla del tamaño de la sorpresa."
