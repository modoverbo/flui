register: "neutral"
pedantry_risk: 2
usage_tip: "Sirve para máquinas, materiales y también para una reunión que no arranca."
when_not_to_use: "No la uses para quien se ha quedado sin defensa ante algo; esa palabra es «inerme»."
collocations:
