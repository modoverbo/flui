confusions:
  - confused_with: "cotillear"
    difference: "«Cotillear» es hablar de la vida de otros por curiosidad; coquetear es un juego de interés directo con la persona que tienes delante."
    memory_trick: "Cotillear habla de otros; coquetear le habla a él o a ella."
  - confused_with: "ligar"
    difference: "«Ligar» es coloquial y apunta directo a buscar algo físico o una relación; coquetear es el juego previo, con o sin esa intención final."
exercises:
  - position: 1
    sentence: "En la fiesta, Nerea {{blank}} con el amigo de su hermana toda la noche, mirándolo cada vez que él contaba algo gracioso."
    hint_general: "Piensa en mostrar interés directo con miradas, no en violencia ni en hablar de alguien a terceros."
    explanation: "Coqueteó: mostró interés directo, con miradas e interés real. «Cuchicheó» es hablar en voz baja, normalmente de algo o alguien más, y aquí ella lo mira directamente a él; «cotilleó» es hablar de la vida de alguien a terceros, y aquí ella interactúa directo con él."
    options:
      - position: 1
        text: "cuchicheó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Cuchicheó» es hablar en voz baja, normalmente sobre otra cosa o persona, y aquí lo que hace Nerea es mirarlo directamente a él con interés."
        hint_specific: "Cuchichear es hablar bajito de algo. ¿Nerea habla en voz baja de otra cosa, o lo mira a él con interés?"
      - position: 2
        text: "coqueteó"
        is_correct: true
      - position: 3
        text: "cotilleó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cotilleó» es hablar de la vida de alguien a terceros, y aquí Nerea interactúa directamente con él, no habla de él con otros."
        hint_specific: "Cotillear es hablar de alguien a otros. ¿Nerea habla con él o de él con otras personas?"
  - position: 2
    sentence: "Cada vez que se cruzan en el pasillo de la oficina, Ulises y su compañera {{blank}} un rato antes de seguir con su trabajo, sin que nadie más lo note."
    hint_general: "Es un juego sutil con interés romántico de fondo, no un chiste cualquiera ni algo directo."
    explanation: "Coquetean: un juego sutil con interés romántico de fondo. «Ligan» es coloquial y directo, y no encaja con algo tan sutil como esto; «bromean» no dice que haya interés romántico, solo que se ríen juntos."
    options:
      - position: 1
        text: "ligan"
        is_correct: false
        distractor_type: "register"
        why_not: "«Ligan» es coloquial y directo, y esta escena es más sutil: un momento breve en el pasillo, no una búsqueda directa."
        hint_specific: "«Ligar» es directo y coloquial. ¿Esta escena es directa o sutil?"
      - position: 2
        text: "coquetean"
        is_correct: true
      - position: 3
        text: "bromean"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Bromean» no dice que haya interés romántico, y aquí lo que se sugiere es justo ese interés especial entre los dos."
        hint_specific: "Bromear no implica interés romántico. ¿Qué se sugiere de más en esta escena?"
  - position: 3
    sentence: "Mientras esperaban la comida, Tobías {{blank}} con comentarios sobre lo bien que le quedaba ese color, y ella le seguía el juego sin decir nada directo."
    hint_general: "Piensa en un juego mutuo sin buscar nada a cambio, no en manipular ni en una indirecta cualquiera."
    explanation: "Coqueteaba: un juego mutuo, sin buscar nada a cambio. «Engatusaba» sugiere manipular para conseguir algo, y aquí ella juega igual de puesta; «insinuaba» es más general y sirve para cualquier indirecta, no solo esta romántica."
    options:
      - position: 1
        text: "engatusaba"
        is_correct: false
        distractor_type: "register"
        why_not: "«Engatusaba» sugiere manipular a alguien para conseguir algo, y aquí ella participa del juego igual que él, sin que nadie busque nada."
        hint_specific: "Engatusar busca conseguir algo. ¿Qué busca conseguir Tobías aquí?"
      - position: 2
        text: "coqueteaba"
        is_correct: true
      - position: 3
        text: "insinuaba"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Insinuaba» es más general y sirve para cualquier indirecta, y aquí lo que hay es un juego romántico concreto en el que ella también participa."
        hint_specific: "Insinuar puede ser sobre cualquier cosa. ¿Qué tipo de juego describe la frase?"
  - position: 4
    sentence: "Vera notó que su cita no dejaba de {{blank}} con ella, alternando comentarios sobre lo bien que se llevaban con miradas que se sostenían más de lo normal."
    hint_general: "Se trata de comentarios con intención y miradas que se sostienen, más que simples cumplidos o chistes."
    explanation: "Coquetear: comentarios con intención y miradas que se sostienen. «Halagar» es solo decir cosas bonitas, y aquí hay más: miradas que se sostienen más de lo normal; «bromear» no explica esas miradas prolongadas, solo la charla."
    options:
      - position: 1
        text: "halagar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Halagar» es solo decir cosas bonitas, y aquí hay algo más: miradas que se sostienen más de lo normal."
        hint_specific: "Halagar es solo decir cumplidos. ¿Qué más describe la frase, además de los comentarios?"
      - position: 2
        text: "coquetear"
        is_correct: true
      - position: 3
        text: "bromear"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Bromear» no explica esas miradas que se sostienen más de lo normal, solo dice que hay risas o chistes."
        hint_specific: "Bromear es solo reírse juntos. ¿Qué detalle de las miradas no explica bromear?"
  - position: 5
    sentence: "«¿De qué hablaban tanto tú y el chico del bar?», le preguntó su amiga a Bárbara. «De nada en especial», respondió Bárbara, «solo {{blank}}»."
    hint_general: "Piensa en un juego romántico entre dos personas, no en hablar de otros ni en algo demasiado general."
    explanation: "Coqueteábamos: la respuesta resta importancia a un juego romántico. «Cotilleábamos» sería hablar de la vida de otros, y la pregunta es sobre lo que pasó entre ellos dos; «insinuábamos» es muy general, y aquí la coyuntura pide algo más concreto y romántico."
    options:
      - position: 1
        text: "cotilleábamos"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cotilleábamos» sería hablar de la vida de otras personas, y la pregunta de su amiga es sobre lo que pasó entre Bárbara y el chico."
        hint_specific: "Cotillear es hablar de otros. ¿La pregunta es sobre otras personas o sobre Bárbara y el chico?"
      - position: 2
        text: "coqueteábamos"
        is_correct: true
      - position: 3
        text: "insinuábamos"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Insinuábamos» es muy general y sirve para cualquier indirecta, y la respuesta resta importancia a algo más concreto y romántico."
        hint_specific: "Insinuar es muy general. ¿Qué tipo de conversación resta importancia Bárbara con esa respuesta?"
  - position: 6
    sentence: "Cada verano, en las vacaciones familiares, Fabiola {{blank}} un poco con el socorrista sin ninguna intención seria, solo por diversión."
    hint_general: "Es un juego sin intención seria, más que simples cumplidos o buscar algo serio."
    explanation: "Coquetea: un juego sin intención seria, solo por diversión. «Halaga» es solo decir cosas bonitas, y aquí hay un juego más amplio; «liga» implica buscar algo serio, y la frase aclara que no hay ninguna intención seria."
    options:
      - position: 1
        text: "halaga"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Halaga» es solo decir cosas bonitas, y aquí lo que describe la frase es un juego más amplio, sin más intención que divertirse."
        hint_specific: "Halagar es solo decir cumplidos. ¿Qué más hace Fabiola, según la frase?"
      - position: 2
        text: "coquetea"
        is_correct: true
      - position: 3
        text: "liga"
        is_correct: false
        distractor_type: "register"
        why_not: "«Liga» implica buscar algo serio o una relación, y la frase aclara que no hay ninguna intención seria, solo diversión."
        hint_specific: "Ligar busca algo serio. ¿Qué aclara la frase sobre la intención de Fabiola?"
  - position: 7
    sentence: "Gaspar y su cita llevaban una hora {{blank}} por mensaje, mandándose indirectas y emojis, sin llegar a decir nada directo."
    hint_general: "Piensa en un juego mutuo de indirectas, no en manipular a alguien ni en violencia."
    explanation: "Coqueteando: un juego mutuo de indirectas, sin buscar nada más. «Engatusando» sugiere que uno manipula al otro, y aquí los dos participan igual; «cuchicheando» es susurrar en voz baja, algo que no tiene sentido por mensaje de texto."
    options:
      - position: 1
        text: "engatusando"
        is_correct: false
        distractor_type: "register"
        why_not: "«Engatusando» sugiere que una persona manipula a la otra, y aquí los dos mandan indirectas por igual, sin que nadie manipule a nadie."
        hint_specific: "Engatusar es de una sola dirección. ¿Los dos participan igual en esta escena?"
      - position: 2
        text: "coqueteando"
        is_correct: true
      - position: 3
        text: "cuchicheando"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Cuchicheando» es susurrar en voz baja, y eso no tiene sentido para describir algo que pasa por mensaje de texto."
        hint_specific: "Cuchichear es susurrar en persona. ¿Tiene sentido susurrar por mensaje?"
  - position: 8
    sentence: "Su amiga le pidió que no {{blank}} tanto con el camarero delante de toda la mesa, que daba pena ajena."
    hint_general: "Se trata de un jugueteo romántico evidente, no de un chiste ni de algo demasiado general."
    explanation: "Coqueteara: un jugueteo romántico tan evidente que da pena ajena. «Bromeara» no explica esa pena ajena tan concreta; «insinuara» es muy general y no nombra este jugueteo romántico frente a toda la mesa."
    options:
      - position: 1
        text: "bromeara"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Bromeara» no explica por qué eso daría pena ajena a toda la mesa; bromear con el camarero no suele avergonzar a nadie."
        hint_specific: "Bromear no suele avergonzar a los demás. ¿Qué provoca esa reacción de toda la mesa?"
      - position: 2
        text: "coqueteara"
        is_correct: true
      - position: 3
        text: "insinuara"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Insinuara» es muy general y no nombra el jugueteo romántico específico que incomoda a toda la mesa."
        hint_specific: "Insinuar es muy general. ¿Qué tipo de jugueteo describe la frase?"
readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "La barra del bar"
    body: "Toda la noche, Renzo y la chica de la barra de al lado se lanzaron miradas y comentarios sueltos sobre la música, sin acercarse del todo. «Llevan una hora coqueteando», le dijo un amigo a otro, señalando disimuladamente. Al final, ella se acercó a pedirle fuego, aunque no fumaba."
    before_phrase: "Se están tirando la onda desde hace rato."
    after_phrase: "Llevan una hora coqueteando."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "El comentario de mi prima"
    body: "En la boda, la prima de Otilia le susurró: «¿Viste cómo te mira ese primo del novio? Lleva media hora coqueteando contigo». Otilia se rio, un poco colorada, y admitió que también le había devuelto un par de miradas."
    before_phrase: "Creo que me está tirando la onda ese chico."
    after_phrase: "Lleva media hora coqueteando conmigo."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El comentario en la pausa"
    body: "En la pausa del café, un compañero le dijo a Dante que llevaba semanas coqueteando con la chica de contabilidad sin darse cuenta. «¿En serio se nota?», preguntó Dante, sorprendido. «Se nota bastante», respondió su compañero, riendo."
    before_phrase: "Creo que le tiro un poco la onda sin darme cuenta."
    after_phrase: "Llevo semanas coqueteando con ella sin darme cuenta."
