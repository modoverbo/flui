readings:
  - position: 1
    scene: "familia"
    conversation_type: "emocional"
    title: "La risa de la cocina"
    body: "Mi madre tiene una risa que se reconoce a dos calles. De niña me daba vergüenza; ahora, cuando llego al portal y la oigo, subo los escalones de dos en dos. Ayer soltó una carcajada por algo que dijo mi hermano y no pudimos seguir cenando durante un minuto. Es el sonido de que estamos todos."
    before_phrase: "Se rio muy fuerte, como siempre."
    after_phrase: "Soltó una carcajada de las suyas."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "El ascensor"
    body: "Fabiola y su vecina coincidieron en el ascensor justo después de que a él se le cayera la compra. Ella apretó los labios y miró al techo. En el tercero se le escapó una carcajada y las dos acabaron riendo hasta el portal. Ahora se saludan por el nombre."
    before_phrase: "Me dio un ataque de risa."
    after_phrase: "Se me escapó una carcajada."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "La reunión del viernes"
    body: "La presentación iba tensa hasta que la diapositiva se abrió del revés. Tadeo dijo: «Así se ve mejor», y de la última fila salió una carcajada. A partir de ahí la gente preguntó sin miedo. El jefe lo comentó después: aquella risa había hecho más que media hora de introducción."
    before_phrase: "Alguien se rio muy fuerte y se relajó todo."
    after_phrase: "Una carcajada rompió la tensión."
