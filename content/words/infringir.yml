confusions:
  - confused_with: "infligir"
    difference: "«Infligir» es causar un daño o imponer un castigo a alguien; lo otro es dejar de cumplir una norma o un acuerdo."
    memory_trick: "Una se comete contra una norma; la otra se causa a una persona."
  - confused_with: "restringir"
    difference: "«Restringir» es poner límites a algo que antes era libre; no significa saltarse una regla que ya existe."
    memory_trick: "Restringir crea el límite; lo otro lo cruza."
exercises:
  - position: 1
    sentence: "Estacionar en la rampa es {{blank}} una norma básica del edificio, y el vecino ya avisó dos veces."
    hint_general: "Se trata de no cumplir una regla que obliga a todos."
    explanation: "Infringir: no cumplir una norma que obliga a todos. «Infligir» sería causar un daño a alguien, y «saltarse» es coloquial y quita peso al asunto."
    options:
      - position: 1
        text: "infligir"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Infligir» es causar un daño o un castigo a una persona, y aquí lo que se incumple es una regla del edificio."
        hint_specific: "«Infligir» siempre cae sobre alguien. ¿Quién sufre un daño al dejar el auto en la rampa?"
