schema_version: 1
slug: "accesible"
status: "draft"
lemma: "accesible"
part_of_speech: "adjetivo"
syllables:
  - "ac"
  - "ce"
  - "si"
  - "ble"
stressed_syllable: 3
ipa_latam: "[ak.seˈsi.βle]"
ipa_es: "[akθeˈsi.βle]"
explanation: "Que se deja tratar con facilidad: puedes hablarle sin pedir permiso ni preparar nada."
example_sentence: "Manda el equipo entero y es la persona más accesible del edificio."
register: "neutral"
pedantry_risk: 1
usage_tip: "Es el elogio que más se agradece en alguien con mando: dice que el cargo no levantó un muro."
when_not_to_use: "No la uses para hablar de precios ni de lo barato; aquí lo fácil es llegar a la persona."
collocations:
  - "una jefa accesible"
  - "hacerse accesible"
  - "poco accesible"
replaces:
  - before: "Con él puedes hablar sin problema"
    after: "Es muy accesible"
  - before: "No hay que pedir cita para hablarle"
    after: "Es una jefa accesible"
  - before: "A ese no hay quien lo pille"
    after: "Es poco accesible"
family:
  - "accesibilidad"
themes:
  - slug: "networking"
    relevance: 3
  - slug: "liderazgo-feedback"
    relevance: 2
tags:
  comodin:
    - "se puede hablar con él"
  funcion:
    - "elogiar"
  canal: "ambos"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "asequible"
    difference: "«Asequible» se dice de lo que se puede pagar; esta palabra se dice de quien se deja tratar."
    memory_trick: "Asequible es el precio; accesible es la persona."
  - confused_with: "amable"
    difference: "«Amable» describe el trato cuando por fin hablas; esto describe lo fácil que es llegar a hablar."
    memory_trick: "Amable es cómo te trata; accesible es si te atiende."
exercises:
  - position: 1
    sentence: "Aunque dirige el edificio entero, Nerea es la persona más {{blank}}: contesta el teléfono ella misma."
    hint_general: "Describe a quien se deja tratar sin trámites, aunque tenga mando."
    explanation: "Accesible: se deja tratar sin trámites pese al cargo. «Asequible» se dice de un precio, y «amable» hablaría del trato, no de si llegas a ella."
    options:
      - position: 1
        text: "asequible"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Asequible» se dice de lo que se puede pagar, y aquí se describe a una persona que dirige un edificio."
        hint_specific: "«Asequible» habla de precios. ¿Se pone precio a una persona?"
      - position: 2
        text: "accesible"
        is_correct: true
      - position: 3
        text: "amable"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Amable» describe cómo te trata cuando ya hablas con ella, y lo llamativo es que contesta el teléfono."
        hint_specific: "«Amable» empieza cuando ya te atienden. ¿Qué sorprende aquí, el trato o que atienda?"
  - position: 2
    sentence: "El médico nuevo del centro resultó poco {{blank}}: había que pedir tres citas para una pregunta de un minuto."
    hint_general: "Cuesta muchísimo llegar a hablar con él."
    explanation: "Accesible: cuesta llegar a hablar con él. «Campechano» es de charla informal y habla de un trato llano, y «disponible» diría que le falta tiempo libre."
    options:
      - position: 1
        text: "campechano"
        is_correct: false
        distractor_type: "register"
        why_not: "«Campechano» es de conversación informal y describe a quien trata a todos con confianza, no a quien es fácil de alcanzar."
        hint_specific: "«Campechano» va del tono del trato, en registro suelto. ¿Aquí falla el tono o el alcance?"
      - position: 2
        text: "accesible"
        is_correct: true
      - position: 3
        text: "disponible"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Disponible» diría que no tiene huecos, y el problema es el camino de citas que hay que recorrer antes."
        hint_specific: "«Disponible» mide huecos en la agenda. ¿Falla la agenda o el camino hasta él?"
  - position: 3
    sentence: "En la feria, Leandro buscó la mesa de la editora más {{blank}} y se sentó a hablar sin pedir cita."
    hint_general: "Buscó a quien se deja abordar sin trámites."
    explanation: "Accesible: se deja abordar sin trámites. «Asequible» hablaría de precios, y «abierta» diría que acepta ideas nuevas, no que se la pueda alcanzar."
    options:
      - position: 1
        text: "accesible"
        is_correct: true
      - position: 2
        text: "asequible"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Asequible» se dice de lo que se puede pagar, y en la frase nadie compra nada: alguien se sienta a hablar."
        hint_specific: "«Asequible» pone el foco en el dinero. ¿Hay dinero en esa mesa?"
      - position: 3
        text: "abierta"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Abierta» dice que acepta ideas nuevas, y alguien puede estar abierto a todo y ser imposible de alcanzar."
        hint_specific: "«Abierta» habla de aceptar ideas. ¿Qué buscaba Leandro, una mente abierta o una silla libre?"
  - position: 4
    sentence: "Mi tía fue durante años la vecina más {{blank}} del portal: su puerta estaba abierta desde las ocho."
    hint_general: "A ella se podía ir sin avisar y sin excusas."
    explanation: "Accesible: se podía ir sin avisar. «Llana» habla del tono del trato, sin decir que se la pudiera alcanzar, y «cariñosa» describiría el afecto."
    options:
      - position: 1
        text: "llana"
        is_correct: false
        distractor_type: "register"
        why_not: "«Llana» es una manera coloquial de decir que alguien trata sin ceremonias, y aquí lo que cuenta es que se podía entrar."
        hint_specific: "«Llana» describe el tono en registro de calle. ¿La frase mide el tono o la puerta?"
      - position: 2
        text: "accesible"
        is_correct: true
      - position: 3
        text: "cariñosa"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cariñosa» describe el afecto que reparte, y lo que dice la frase es que se podía llegar a su casa a cualquier hora."
        hint_specific: "«Cariñosa» mide el afecto. ¿Qué es lo que estaba abierto desde las ocho?"
  - position: 5
    sentence: "El comité pidió un responsable {{blank}} para el proyecto, alguien a quien se pudiera llamar sin escalar tres niveles."
    hint_general: "Quieren alguien al que se llegue directamente."
    explanation: "Accesible: alguien al que se llega directo. «Asequible» hablaría de precios, y «dispuesto» diría que tiene ganas de ayudar, no que sea fácil de alcanzar."
    options:
      - position: 1
        text: "dispuesto"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Dispuesto» dice que tiene ganas de ayudar, y alguien puede tener todas las ganas y estar a tres niveles de distancia."
        hint_specific: "«Dispuesto» habla de voluntad. ¿El comité duda de las ganas o de la distancia?"
      - position: 2
        text: "accesible"
        is_correct: true
      - position: 3
        text: "asequible"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Asequible» califica precios y tarifas, y aquí se busca a una persona a la que poder llamar."
        hint_specific: "«Asequible» mira lo que cuesta algo. ¿Se está poniendo precio a esa persona?"
  - position: 6
    sentence: "Tras el ascenso, Efraín se propuso seguir siendo {{blank}} y dejó dos horas abiertas sin reuniones cada semana."
    hint_general: "Quiere que sigan pudiendo hablar con él después del ascenso."
    explanation: "Accesible: sigue pudiéndose hablar con él. «Campechano» describe un trato llano en registro informal, y «humilde» hablaría de no darse importancia."
    options:
      - position: 1
        text: "humilde"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Humilde» dice que no se da importancia, y se puede ser humilde y tener la agenda cerrada a cal y canto."
        hint_specific: "«Humilde» va de no presumir. ¿Qué abren esas dos horas, el ego o la puerta?"
      - position: 2
        text: "accesible"
        is_correct: true
      - position: 3
        text: "campechano"
        is_correct: false
        distractor_type: "register"
        why_not: "«Campechano» es informal y describe a quien trata con confianza a todo el mundo, no a quien reserva huecos para que le hablen."
        hint_specific: "«Campechano» es tono de trato, en registro suelto. ¿Efraín cambia el tono o el calendario?"
  - position: 7
    sentence: "Lo que más agradecieron las familias nuevas fue tener una secretaría {{blank}}, con alguien detrás del mostrador toda la mañana."
    hint_general: "Agradecen poder llegar a alguien sin trámites."
    explanation: "Accesible: se llega a alguien sin trámites. «Asequible» hablaría de lo que cuesta, y «eficaz» diría que resuelve rápido, no que se pueda llegar."
    options:
      - position: 1
        text: "asequible"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Asequible» califica precios, y lo que agradecen las familias es encontrar a alguien al otro lado del mostrador."
        hint_specific: "«Asequible» mira el precio. ¿Las familias hablan de dinero?"
      - position: 2
        text: "accesible"
        is_correct: true
      - position: 3
        text: "eficaz"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Eficaz» dice que resuelve rápido, y una oficina puede resolver rápido y ser imposible de encontrar abierta."
        hint_specific: "«Eficaz» mide resultados. ¿Lo que agradecen es la rapidez o encontrar a alguien?"
  - position: 8
    sentence: "Julieta parecía distante en los correos y resultó ser la más {{blank}} del equipo en cuanto la llamamos."
    hint_general: "Por teléfono se dejó tratar mucho más fácil de lo que parecía."
    explanation: "Accesible: se dejó tratar en cuanto la llamaron. «Llana» habla del tono coloquial del trato, y «simpática» diría que cae bien, no que sea fácil llegar."
    options:
      - position: 1
        text: "simpática"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Simpática» dice que cae bien, y alguien puede caer estupendamente y no coger nunca el teléfono."
        hint_specific: "«Simpática» va de caer bien. ¿Qué cambió al llamarla, la gracia o el acceso?"
      - position: 2
        text: "llana"
        is_correct: false
        distractor_type: "register"
        why_not: "«Llana» es una forma coloquial de decir que alguien trata sin ceremonias, y aquí lo que sorprende es que atendiera enseguida."
        hint_specific: "«Llana» describe el tono, en registro informal. ¿La sorpresa fue el tono o la rapidez en atender?"
      - position: 3
        text: "accesible"
        is_correct: true
readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Dos horas abiertas"
    body: "Después del ascenso, Efraín bloqueó dos horas cada semana sin reuniones. Alguien le preguntó para qué. «Para seguir siendo accesible», contestó. «El cargo ya pone bastante distancia sin mi ayuda»."
    before_phrase: "Quiero que me sigan pudiendo hablar."
    after_phrase: "Quiero seguir siendo accesible."
  - position: 2
    scene: "social"
    conversation_type: "emocional"
    title: "La puerta de mi tía"
    body: "Mi tía tiene la puerta abierta desde las ocho y por su cocina pasa medio portal. El día que se mudó al tercero, una vecina lo dijo mejor que nadie: «Es la más accesible de todas nosotras». No dijo la más simpática. Dijo eso."
    before_phrase: "Con ella siempre se puede contar."
    after_phrase: "Es la más accesible de todas."
  - position: 3
    scene: "entrevista"
    conversation_type: "social"
    title: "Sin escalar niveles"
    body: "Le preguntaron a Julieta qué buscaba en un jefe. No dijo talento ni visión. «Que sea accesible», contestó. «Prefiero uno normal al que pueda llamar a uno brillante al que no llego nunca». El panel se rio y tomó nota."
    before_phrase: "Que se le pueda hablar sin tanto rodeo."
    after_phrase: "Que sea accesible."
