readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "De dónde venía el retraso"
    body: "El taller llevaba dos semanas cargando con la culpa. Herminia revisó las fechas y lo dijo en la reunión del lunes: «El retraso no vino del taller, sino del envío». Nadie se puso a la defensiva y el equipo cambió al proveedor en quince días."
    before_phrase: "No fue el taller, fue el envío, o sea, eso."
    after_phrase: "El retraso no vino del taller, sino del envío."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Lo que de verdad dolía"
    body: "Llevaban tres días sin hablarse por un plan cambiado a última hora. Casimiro dio con la frase exacta: «No me molestó el cambio, sino enterarme por tu hermana». Su pareja entendió el punto al instante. La conversación duró diez minutos y terminó bien."
    before_phrase: "No es por el plan, es que me enteré por tu hermana."
    after_phrase: "No me molestó el cambio, sino enterarme por tu hermana."
  - position: 3
    scene: "entrevista"
    conversation_type: "practica"
    title: "La pregunta del cambio"
    body: "Le preguntaron por qué dejaba un puesto tan estable. Ofelia no dio rodeos: «No me voy por el sueldo, sino por las ganas de aprender otra cosa». La respuesta cabía en una línea y sonó honesta. Le preguntaron qué quería aprender, que era justo lo que ella quería contar."
    before_phrase: "Bueno, no es por el sueldo, es por ganas de cambiar, no sé."
    after_phrase: "No me voy por el sueldo, sino por las ganas de aprender."
