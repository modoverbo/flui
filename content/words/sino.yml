confusions:
  - confused_with: "si no"
    difference: "«Si no», en dos palabras, abre una condición: «si no llueve, salimos». La otra corrige lo que se acaba de negar."
    memory_trick: "Separado plantea un supuesto; junto pone la verdad en su sitio."
  - confused_with: "sin"
    difference: "«Sin» indica falta de algo: «café sin azúcar». La otra no habla de faltas: sustituye lo negado por lo cierto."
    memory_trick: "Uno quita algo; la otra pone algo en su lugar."
exercises:
  - position: 1
    sentence: "No me fui de la empresa por el dinero, {{blank}} por las ganas de cambiar de aire."
    hint_general: "Después de negar un motivo, coloca el verdadero en su lugar."
    explanation: "Sino: sustituye el motivo negado por el real. «Si no» abriría una condición y «porque» daría una causa sin corregir lo anterior."
    options:
      - position: 1
        text: "si no"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Si no», separado, abre una condición sobre algo que podría pasar, y aquí ya está todo decidido: la marcha ocurrió."
        hint_specific: "«Si no» plantea un supuesto. ¿Queda algo por cumplirse o ya se marchó?"
      - position: 2
        text: "sino"
        is_correct: true
      - position: 3
        text: "porque"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Porque» introduce una causa y deja la negación anterior sin corregir, y la frase necesita poner el motivo verdadero en su sitio."
        hint_specific: "«Porque» explica una causa. ¿La frase explica algo o cambia un motivo por otro?"
  - position: 2
    sentence: "El problema no está en el diseño, {{blank}} en el tiempo que tardamos en decidir."
    hint_general: "Niega un culpable y pone el verdadero justo detrás."
    explanation: "Sino: sustituye el culpable negado por el real. «O sea» repetiría la idea con otras palabras y «aunque» anunciaría un obstáculo en vez de una corrección."
    options:
      - position: 1
        text: "sino"
        is_correct: true
      - position: 2
        text: "o sea"
        is_correct: false
        distractor_type: "register"
        why_not: "«O sea» es de conversación y repite la misma idea con otras palabras, cuando aquí hay que cambiar el culpable por otro distinto."
        hint_specific: "«O sea» dice lo mismo de otro modo. ¿Se repite la idea o se corrige?"
      - position: 3
        text: "aunque"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Aunque» anuncia un obstáculo, y la frase no pone pegas: cambia un culpable por otro."
        hint_specific: "«Aunque» prepara una pega. ¿Hay una pega o hay una corrección?"
  - position: 3
    sentence: "Amalia no pidió ayuda, {{blank}} una lista clara de lo que faltaba por hacer."
    hint_general: "Niega una petición y coloca a continuación la que sí hizo."
    explanation: "Sino: cambia la petición negada por la verdadera. «Si no» abriría una condición y «además» sumaría la lista a una ayuda que ella no pidió."
    options:
      - position: 1
        text: "si no"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Si no», separado, abriría una condición, y aquí nadie pone condiciones: se aclara qué pidió exactamente."
        hint_specific: "«Si no» plantea un supuesto. ¿Falta alguna condición o se corrige lo dicho?"
      - position: 2
        text: "además"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Además» sumaría la lista a una ayuda que ella nunca pidió, y la frase empieza negando justamente esa ayuda."
        hint_specific: "«Además» alarga lo pedido. ¿Pidió las dos cosas o solo una?"
      - position: 3
        text: "sino"
        is_correct: true
  - position: 4
    sentence: "La cena no salió mal por la comida, {{blank}} por la música tan alta del local."
    hint_general: "Niega una causa y pon la verdadera justo después."
    explanation: "Sino: sustituye la causa negada por la real. «Vamos» es una muletilla de conversación y «pero» opondría dos ideas en vez de corregir una."
    options:
      - position: 1
        text: "vamos"
        is_correct: false
        distractor_type: "register"
        why_not: "«Vamos» es una muletilla de conversación que suaviza lo dicho, y aquí hace falta señalar la causa verdadera sin rodeos."
        hint_specific: "«Vamos» suena a hablar sobre la marcha. ¿La frase duda o corrige con seguridad?"
      - position: 2
        text: "sino"
        is_correct: true
      - position: 3
        text: "pero"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Pero» enfrenta dos ideas que conviven, y aquí la segunda sustituye a la primera: la comida queda descartada."
        hint_specific: "«Pero» deja las dos ideas en pie. ¿Conviven las dos causas o una anula a la otra?"
  - position: 5
    sentence: "Lo que pidió Bruno no era un permiso, {{blank}} una respuesta rápida por escrito."
    hint_general: "Niega una cosa y pon en su lugar la que de verdad quería."
    explanation: "Sino: sustituye lo negado por lo cierto. «Sin» hablaría de una falta y «mejor dicho» anunciaría que quien habla se corrige a sí mismo."
    options:
      - position: 1
        text: "sin"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Sin» señala la falta de algo, y aquí no falta nada: se cambia una petición por otra distinta."
        hint_specific: "«Sin» habla de lo que no se tiene. ¿Falta algo o se corrige lo dicho?"
      - position: 2
        text: "mejor dicho"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Mejor dicho» avisa de que quien habla rectifica su propia frase, y aquí la frase corrige lo que Bruno pidió, no un desliz de quien cuenta."
