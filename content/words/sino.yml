      - position: 3
        text: "sino"
        is_correct: true
  - position: 6
    sentence: "No quiero que cambies de plan, {{blank}} que me lo cuentes antes de decidirlo."
    hint_general: "Niega una petición grande y coloca la pequeña que sí importa."
    explanation: "Sino: cambia lo negado por lo que sí se pide. «Si no» abriría una condición y «salvo» apartaría un caso en lugar de sustituirlo."
