    title: "El apodo de siempre"
    body: "En la primaria le decían «Pecas» a Fernando, y aunque ya tiene cuarenta años, sus amigos de la infancia todavía lo llaman así en cada reunión. Su hija no entendía el chiste hasta que él le explicó: «Hay cosas que perduran, aunque uno crezca»."
    before_phrase: "Ese apodo no se le va a quitar nunca."
    after_phrase: "Ese apodo le perdura desde la infancia."
