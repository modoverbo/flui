    title: "Veinte años después"
    body: "Marcos y Julián se conocieron en el colegio y hoy viven en países distintos. Se llaman por videollamada cada mes, y cuando alguno visita al otro, es como si no hubiera pasado el tiempo. «Hay amistades que perduran sin esfuerzo», dice Marcos. «La nuestra es una de ellas»."
