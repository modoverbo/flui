    conversation_type: "practica"
    title: "El negocio de los Herrera"
    body: "Cuando le preguntaron el secreto del negocio familiar, la nieta de don Herrera lo pensó un momento: «No hicimos nada extraordinario. Solo cuidamos a los clientes de siempre». Casi cien años después, ese trato sigue siendo la razón por la que el negocio perdura."
    before_phrase: "Este negocio sigue en pie después de tantos años."
    after_phrase: "Este negocio perdura después de tantos años."
