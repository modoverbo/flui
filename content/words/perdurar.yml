schema_version: 1
status: "draft"
slug: "perdurar"
lemma: "perdurar"
part_of_speech: "verbo"
syllables: ["per", "du", "rar"]
stressed_syllable: 3
ipa_latam: "[per.ðuˈrar]"
ipa_es: "[per.ðuˈrar]"
explanation: "Seguir existiendo con el paso del tiempo, sin perder fuerza ni desaparecer."
example_sentence: "Su amistad ha logrado perdurar veinte años, a pesar de la distancia y de vivir en países distintos."
register: "neutral"
pedantry_risk: 1
usage_tip: "Funciona bien para una amistad, una costumbre o un recuerdo que sigue vivo pese al paso de los años."
when_not_to_use: "No la uses para algo que ocurrió una sola vez: describe lo que resiste el tiempo, no un momento puntual."
collocations:
  - "perdurar en el tiempo"
  - "perdurar a pesar de la distancia"
  - "una amistad que perdura"
replaces:
  - before: "Esa amistad sigue igual después de tanto tiempo"
    after: "Esa amistad ha logrado perdurar"
  - before: "Ese recuerdo no se va a borrar nunca"
    after: "Ese recuerdo va a perdurar"
family: ["perdurable", "perdurabilidad"]
themes:
  - slug: "amistad"
    relevance: 3
tags:
  comodin: ["durar"]
  funcion: ["describir"]
  canal: "ambos"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "perturbar"
    difference: "«Perturbar» es alterar la calma de algo o de alguien; perdurar es seguir existiendo con el paso del tiempo, sin ninguna alteración."
    memory_trick: "Perturbar agita; perdurar sostiene."
  - confused_with: "prolongarse"
    difference: "«Prolongarse» dice que algo se extiende más de lo previsto, a veces de forma incómoda; perdurar es mantenerse fuerte con los años, no solo alargarse."
    memory_trick: "Lo que se prolonga se estira; lo que perdura resiste."
exercises:
  - position: 1
    sentence: "La amistad entre Marcos y Julián empezó en el colegio hace veinte años y, aunque hoy viven en países distintos, {{blank}}."
    hint_general: "Busca el verbo para algo que sigue fuerte con el paso de los años, sin importar la distancia."
    explanation: "Perdura: la amistad sigue firme pese a la distancia. «Perturba» es alterar la calma de algo, y aquí nada se altera. «Se prolonga» dice que algo se extiende más de lo previsto, no que resista los años."
    options:
      - position: 1
        text: "perturba"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Perturbar» es alterar la calma de algo o de alguien, y aquí nada se altera: la amistad sigue firme pese a la distancia."
        hint_specific: "«Perturbar» habla de alterar la calma de algo. ¿La frase describe una alteración o algo que sigue firme?"
