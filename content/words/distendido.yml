confusions:
  - confused_with: "distraído"
    difference: "«Distraído» describe a quien tiene la cabeza en otro sitio; la otra palabra describe un ambiente sin tensión."
    memory_trick: "El distraído no se entera; lo distendido no aprieta."
  - confused_with: "aburrido"
    difference: "«Aburrido» dice que no pasa nada que interese; aquí hay calma, y aun así la conversación funciona."
    memory_trick: "Lo aburrido no engancha; lo distendido no tensa."
exercises:
