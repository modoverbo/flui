    scene: "entrevista"
    conversation_type: "practica"
    title: "Los dos primeros minutos"
    body: "La entrevistadora empezó preguntando por el trayecto y por el café de la esquina. Cuando llegaron a las preguntas duras, Silvia ya no tenía las manos frías. «Fue todo muy distendido», contó luego en casa."
    before_phrase: "Fue todo muy relajado, no como esperaba."
    after_phrase: "Fue todo muy distendido."
