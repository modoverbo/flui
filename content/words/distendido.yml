    body: "Joaquín tenía que hablar con su padre de la casa del pueblo. Antes de entrar en materia, estuvieron veinte minutos hablando del huerto. «Prefiero empezar distendido y luego ya vamos al asunto», le dijo. Lo resolvieron sin gritos."
    before_phrase: "Prefiero empezar tranquilo y luego ya hablamos."
    after_phrase: "Prefiero empezar distendido y luego ir al asunto."
