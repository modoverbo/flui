    body: "Minutos antes de que la vocera saliera a hablar con la prensa, el equipo revisó un sondeo hecho esa misma mañana entre los vecinos afectados. «La gente pide plazos, no promesas», resumió alguien. La vocera ajustó dos frases y salió."
    before_phrase: "Averigüé rápido qué piensa la gente."
    after_phrase: "Hicimos un sondeo esta mañana."
