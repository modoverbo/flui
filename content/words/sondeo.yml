    body: "Cada Navidad terminaba en la misma discusión sobre el destino del viaje familiar. Este año, Gustavo repartió papelitos: «Hagamos un sondeo, cada uno escribe su idea y contamos». Ganó la playa, y por primera vez nadie se fue enojado de la mesa."
    before_phrase: "A ver qué dice cada uno, sin pelear."
    after_phrase: "Hagamos un sondeo, sin pelear."
