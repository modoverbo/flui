confusions:
  - confused_with: "reincidir"
    difference: "«Reincidir» es volver a cometer el mismo error o la misma falta; esta palabra es pedir con fuerza algo que te pertenece, o reclamar un mérito propio."
    memory_trick: "Quien reincide repite un error; quien hace esto reclama un derecho."
  - confused_with: "exigir"
    difference: "«Exigir» es pedir algo de un modo que no admite un no, sin importar si tienes razón; esta palabra reclama algo apoyado en un derecho o un mérito real."
    memory_trick: "Se exige aunque no haya razón; esto se hace apoyado en un derecho concreto."
exercises:
