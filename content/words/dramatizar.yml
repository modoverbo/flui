  - "zar"
stressed_syllable: 4
ipa_latam: "[dɾa.ma.tiˈsaɾ]"
ipa_es: "[dɾa.ma.tiˈθaɾ]"
explanation: "Tratar algo como si fuera mucho más grave de lo que en realidad es."
example_sentence: "Se rompió un vaso, nada más; no hace falta dramatizar."
register: "neutral"
pedantry_risk: 1
usage_tip: "Dicho de uno mismo baja la tensión al instante: «perdona, estoy dramatizando» desarma cualquier discusión."
when_not_to_use: "No se la digas a alguien que lo está pasando mal de verdad: ahí no agranda nada, le duele."
collocations:
  - "no dramatizar"
  - "sin dramatizar"
  - "dramatizar un problema"
replaces:
  - before: "No te pongas tan trágico, que se arregla"
    after: "No dramatices, que se arregla"
  - before: "Lo cuenta como si fuera el fin del mundo"
    after: "Dramatiza cualquier contratiempo"
  - before: "Se lo toma todo como una desgracia enorme"
    after: "Dramatiza todo lo que le pasa"
family:
  - "dramático"
  - "dramatización"
themes:
  - slug: "humor"
    relevance: 3
  - slug: "conversacion-cotidiana"
    relevance: 2
tags:
  comodin: ["exagerar"]
  funcion: ["suavizar", "describir"]
  canal: "hablado"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "enfatizar"
    difference: "«Enfatizar» es subrayar algo para que se note; dramatizar es tratarlo como si fuera mucho más grave de lo que es."
    memory_trick: "Enfatizas para que se oiga; dramatizas para que pese."
  - confused_with: "preocuparse"
    difference: "Quien se preocupa mide el problema y busca salida; quien dramatiza lo agranda antes de mirarlo."
    memory_trick: "El que se preocupa busca solución; el que dramatiza busca público."
exercises:
  - position: 1
    sentence: "Aitana contó lo del vaso roto sin {{blank}}: el suelo quedó limpio en un minuto y nadie se alteró."
    hint_general: "Lo contó sin tratar el asunto como si fuera una desgracia."
    explanation: "Dramatizar: tratar algo como una desgracia, y ella no lo hizo. «Enfatizar» sería subrayar un punto, y «quejarse» sería protestar, y ella no protesta por nada."
    options:
      - position: 1
        text: "enfatizar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Enfatizar» es subrayar algo para que se note, y eso no significa tratarlo como una desgracia."
        hint_specific: "«Enfatizar» sirve para destacar una idea. ¿Aquí se destaca algo o se agranda la gravedad?"
      - position: 2
        text: "dramatizar"
        is_correct: true
      - position: 3
        text: "quejarse"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Quejarse» es decir que algo te molesta, y ella no protesta: solo cuenta lo que pasó y sigue."
        hint_specific: "«Quejarse» supone molestia dicha en voz alta. ¿Aitana protesta por algo?"
  - position: 2
    sentence: "Mi hermano vuelve a {{blank}}: cuenta el retraso del autobús como si el día entero estuviera perdido."
    hint_general: "Trata un contratiempo pequeño como si fuera una catástrofe."
    explanation: "Dramatizar: trata un contratiempo pequeño como una catástrofe. «Lloriquear» es coloquial y se burla de quien llora, y «preocuparse» sería una reacción proporcionada."
    options:
      - position: 1
        text: "lloriquear"
        is_correct: false
        distractor_type: "register"
        why_not: "«Lloriquear» es coloquial y se burla de quien llora por todo, y aquí el hermano no llora: agranda la gravedad al contarlo."
        hint_specific: "«Lloriquear» habla de lágrimas. ¿Qué hace exactamente tu hermano con el retraso?"
      - position: 2
        text: "dramatizar"
        is_correct: true
      - position: 3
        text: "preocuparse"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Preocuparse» es una reacción proporcionada al tamaño del problema, y perder el día por un autobús no lo es."
        hint_specific: "«Preocuparse» guarda la proporción. ¿La reacción de tu hermano es proporcionada?"
  - position: 3
    sentence: "Antes de contar el cambio de fecha, Selene avisó: «Voy a dar la noticia sin {{blank}}, porque la boda sigue en pie»."
    hint_general: "Va a contarlo sin hacerlo más grave de lo que es."
    explanation: "Dramatizar: contarlo sin hacerlo más grave de lo que es. «Enfatizar» sería subrayar una parte, y «alarmar» sería asustar a los demás, y ella quiere justo tranquilizarlos."
    options:
      - position: 1
        text: "dramatizar"
        is_correct: true
      - position: 2
        text: "enfatizar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Enfatizar» es subrayar una parte del mensaje, y ella avisa de que no va a agrandar la gravedad."
        hint_specific: "«Enfatizar» destaca. ¿Selene promete no destacar nada o no asustar a nadie?"
      - position: 3
        text: "alarmar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Alarmar» es el efecto en los demás, y lo que ella promete controlar es su propia forma de contarlo."
        hint_specific: "«Alarmar» mira a quien escucha. ¿De qué está hablando Selene: de ellos o de sí misma?"
  - position: 4
    sentence: "Cuando el viaje se retrasó una semana, Tobías prefirió no {{blank}} y escribió un mensaje de tres líneas."
    hint_general: "Decidió no tratar el retraso como una desgracia."
    explanation: "Dramatizar: no tratar el retraso como una desgracia. «Sobreactuar» sería pasarse en la interpretación de un papel, e «insistir» sería repetir algo hasta cansar."
    options:
      - position: 1
        text: "sobreactuar"
        is_correct: false
        distractor_type: "register"
        why_not: "«Sobreactuar» es pasarse actuando un papel delante de otros, y él ni siquiera habla: escribe tres líneas."
        hint_specific: "«Sobreactuar» necesita escena y público. ¿Qué hizo Tobías exactamente?"
      - position: 2
        text: "insistir"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Insistir» es repetir algo hasta cansar, y aquí el asunto se dice una vez y en tres líneas."
        hint_specific: "«Insistir» es repetir. ¿Cuántas veces dijo Tobías lo del retraso?"
      - position: 3
        text: "dramatizar"
        is_correct: true
  - position: 5
    sentence: "En casa decimos que Malena {{blank}} un poco, aunque luego siempre es la primera en resolverlo todo."
    hint_general: "Agranda la gravedad de las cosas al contarlas, aunque después reacciona bien."
    explanation: "Dramatiza: agranda la gravedad al contarlo. «Enfatiza» sería subrayar una idea concreta, y «se queja» sería protestar, y ella acaba resolviendo en vez de protestar."
    options:
      - position: 1
        text: "enfatiza"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Enfatizar» es subrayar una idea concreta, y lo que ella hace es tratar el problema como si fuera enorme."
        hint_specific: "«Enfatizar» destaca una parte. ¿Malena destaca algo o infla la gravedad?"
      - position: 2
        text: "dramatiza"
        is_correct: true
      - position: 3
        text: "se queja"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Quejarse» es protestar por algo que molesta, y ella termina siendo la primera en arreglarlo."
        hint_specific: "«Quejarse» se queda en la protesta. ¿Qué hace Malena al final?"
  - position: 6
    sentence: "Renzo dejó de {{blank}} el día que vio a sus hijos copiando su cara de fin del mundo por una mancha en la camisa."
    hint_general: "Dejó de tratar los problemas pequeños como si fueran enormes."
    explanation: "Dramatizar: dejó de tratar lo pequeño como enorme. «Lloriquear» es coloquial y habla de llorar, y «alarmar» sería asustar a otros, y sus hijos lo imitan, no se asustan."
    options:
      - position: 1
        text: "lloriquear"
        is_correct: false
        distractor_type: "register"
        why_not: "«Lloriquear» es coloquial y habla de llorar, y lo que copian sus hijos es la cara, no las lágrimas."
        hint_specific: "«Lloriquear» son lágrimas. ¿Qué es lo que imitan los hijos de Renzo?"
      - position: 2
        text: "alarmar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Alarmar» sería asustar a los demás, y sus hijos no están asustados: lo están imitando."
        hint_specific: "«Alarmar» deja a alguien con miedo. ¿Están sus hijos asustados?"
      - position: 3
        text: "dramatizar"
        is_correct: true
  - position: 7
    sentence: "Nadie en el grupo {{blank}}: cuando algo sale mal lo dicen en una frase y se ponen a buscar la solución."
    hint_general: "Nadie agranda la gravedad de lo que pasa antes de mirarlo."
    explanation: "Dramatiza: nadie agranda la gravedad antes de mirarla. «Se preocupa» sería normal y no contradice nada, e «insiste» sería repetir, y aquí se dice una sola frase."
    options:
      - position: 1
        text: "dramatiza"
        is_correct: true
      - position: 2
        text: "se preocupa"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Preocuparse» es normal y sano, y la frase no dice que al grupo le dé igual: dice que no agranda los problemas."
        hint_specific: "«Preocuparse» no está reñido con buscar solución. ¿Qué es lo que no hace este grupo?"
      - position: 3
        text: "insiste"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Insistir» es repetir algo muchas veces, y aquí el problema se menciona en una sola frase."
        hint_specific: "«Insistir» es repetir. ¿Cuántas frases dedican al problema?"
  - position: 8
    sentence: "Otilia contó la avería del coche y, al notar que estaba a punto de {{blank}}, bajó el tono y se rio de sí misma."
    hint_general: "Se dio cuenta de que iba a tratar la avería como una tragedia."
    explanation: "Dramatizar: iba a tratar la avería como una tragedia y se frenó. «Sobreactuar» sería pasarse interpretando un papel, y «quejarse» sería protestar por el coche."
    options:
      - position: 1
        text: "sobreactuar"
        is_correct: false
        distractor_type: "register"
        why_not: "«Sobreactuar» es pasarse interpretando un papel, y lo que ella frena es la gravedad que le estaba dando al asunto."
        hint_specific: "«Sobreactuar» es cosa de actuación. ¿Otilia estaba actuando o agrandando la avería?"
      - position: 2
        text: "dramatizar"
        is_correct: true
      - position: 3
        text: "quejarse"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Quejarse» sería protestar por el coche, y ella no protesta: se frena y se ríe de sí misma."
        hint_specific: "«Quejarse» es protestar. ¿Contra quién protestaría Otilia aquí?"
readings:
  - position: 1
    scene: "familia"
    conversation_type: "emocional"
    title: "La cara de fin del mundo"
    body: "Renzo se manchó la camisa antes de salir y puso una cara que sus hijos conocían bien. Lo que no esperaba era verla copiada en los dos pequeños, delante del espejo. Se quedó parado. «Creo que dramatizo demasiado», le dijo a su pareja esa noche, y desde entonces respira antes de hablar."
    before_phrase: "Me lo tomo todo como una desgracia."
    after_phrase: "Creo que dramatizo demasiado."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "Tres líneas"
    body: "El viaje del grupo se retrasó una semana justo antes de las vacaciones. Tobías escribió tres líneas en el chat: fecha nueva, motivo y una pregunta. Nadie discutió. «Gracias por contarlo sin dramatizar», le respondió alguien, «así hasta apetece más»."
    before_phrase: "Podría haberlo contado como una tragedia."
    after_phrase: "Gracias por contarlo sin dramatizar."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "La noticia del jueves"
    body: "Selene tenía que anunciar que la entrega se movía dos semanas. Antes de abrir la boca se recordó a sí misma la regla: contar los hechos y no dramatizar. Dijo la fecha, el motivo y lo que pedía a cada uno. La reunión duró once minutos y nadie salió asustado."
    before_phrase: "Voy a contarlo como si fuera el fin del mundo."
    after_phrase: "Contar los hechos y no dramatizar."
