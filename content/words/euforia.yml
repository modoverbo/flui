    title: "El gol del último minuto"
    body: "Faltaban dos minutos y el marcador seguía en empate. Cuando el equipo local metió el gol, Darío saltó tan fuerte que golpeó a su vecino sin querer. La euforia duró horas: bocinazos, abrazos con desconocidos y una fila enorme para comprar algo de comer a medianoche."
