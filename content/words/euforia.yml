    body: "Cuando su hermana anunció que por fin había conseguido el trabajo que quería, la mesa entera estalló: gritos, aplausos y alguien que casi tira una copa. «Qué euforia», dijo la abuela riendo, tapándose los oídos. Nadie se sentó de nuevo hasta cinco minutos después."
    before_phrase: "Nos pusimos contentísimos todos a la vez y nadie se sentaba."
    after_phrase: "Fue una euforia total en la mesa."
