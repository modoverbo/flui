    title: "El anuncio del comunicado"
    body: "Leonor leyó el comunicado de la empresa dos veces: hablaba de la euforia de los empleados por el nuevo proyecto. Miró a su alrededor: nadie corría ni gritaba, solo dos personas tomando café en silencio. Se rio sola y siguió con su trabajo."
    before_phrase: "El comunicado exageró diciendo que todos estábamos contentísimos."
    after_phrase: "El comunicado exageró hablando de euforia."
