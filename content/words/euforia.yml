confusions:
  - confused_with: "eufonía"
    difference: "«Eufonía» es que algo suene bien al oído, como una frase o una melodía; esta palabra es la alegría intensa y contagiosa de un grupo, no un sonido."
    memory_trick: "La eufonía se oye; esta palabra se siente y se contagia."
  - confused_with: "histeria"
    difference: "«Histeria» es un descontrol nervioso, casi siempre por miedo o angustia; esta palabra es un descontrol de alegría, no de miedo."
    memory_trick: "La histeria asusta; esta palabra hace reír."
