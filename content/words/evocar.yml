confusions:
  - confused_with: "invocar"
    difference: "«Invocar» es llamar a alguien o apoyarse en una norma para pedir algo; la otra palabra enciende una imagen en la cabeza."
    memory_trick: "Invocas una norma para defenderte; enciendes una imagen para que te vean."
  - confused_with: "recordar"
    difference: "«Recordar» ocurre dentro de ti; la otra palabra hace que la imagen aparezca en la cabeza de quien te escucha."
    memory_trick: "Recuerdas tú; el otro verbo enciende la imagen del que escucha."
exercises:
  - position: 1
    sentence: "Con tres palabras, «olor a lluvia», Ámbar consiguió {{blank}} el patio de su infancia en la cabeza de todos."
    hint_general: "Tres palabras encienden una imagen dentro de quien escucha."
    explanation: "Evocar: tres palabras encienden una imagen ajena. «Invocar» es apoyarse en una norma o llamar a alguien, y «teletransportar» es coloquial y exagera el efecto."
    options:
      - position: 1
        text: "invocar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Invocar» es llamar a alguien o apoyarse en una norma para pedir algo, y aquí solo se enciende un recuerdo."
        hint_specific: "«Invocar» aparece con normas y llamadas. ¿Qué provocan esas tres palabras?"
      - position: 2
        text: "evocar"
        is_correct: true
      - position: 3
        text: "teletransportar"
        is_correct: false
        distractor_type: "register"
        why_not: "«Teletransportar» es coloquial y exagera, y lo que ocurre es que aparece una imagen en la cabeza."
        hint_specific: "«Teletransportar» mueve cuerpos. ¿Quién se mueve en esta frase?"
  - position: 2
    sentence: "Delia no describió la casa entera: prefirió {{blank}} la cocina con el ruido de la cafetera."
    hint_general: "Con un sonido basta para que aparezca el lugar."
    explanation: "Evocar: un sonido hace aparecer el lugar. «Provocar» sería causar una reacción, y «describir» es justo lo que la frase dice que no hizo."
    options:
      - position: 1
        text: "evocar"
        is_correct: true
      - position: 2
        text: "provocar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Provocar» es causar una reacción, y aquí lo que aparece es una imagen de la cocina."
        hint_specific: "«Provocar» empuja a una reacción. ¿Qué aparece con el ruido de la cafetera?"
      - position: 3
        text: "describir"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Describir» es lo que la frase dice que Delia no hizo: no contó la casa entera."
        hint_specific: "«Describir» detalla con palabras. ¿Qué descartó Delia al principio?"
  - position: 3
    sentence: "Una buena historia no explica el miedo a mudarse: lo {{blank}} con una caja vacía y un pasillo."
    hint_general: "Enciende la sensación con un detalle, en vez de nombrarla."
    explanation: "Evoca: enciende la sensación con un detalle. «Invoca» es apoyarse en una norma o llamar a alguien, y «resucita» es coloquial y sugiere devolver algo acabado."
    options:
      - position: 1
        text: "invoca"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Invocar» es llamar a alguien o apoyarse en una norma, y aquí una caja vacía enciende una sensación."
