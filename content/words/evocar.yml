  - position: 5
    sentence: "Si tu charla arranca con una imagen que {{blank}} algo conocido, la sala te sigue sin esfuerzo."
    hint_general: "La imagen enciende algo que el público ya tiene dentro."
    explanation: "Evoca: la imagen enciende algo que el público ya tiene. «Provoca» sería causar una reacción, y «repite» daría por dicho algo que aún no se ha contado."
    options:
