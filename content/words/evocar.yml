    explanation: "Evocó: la frase encendió un olor en quien leía. «Invocó» es apoyarse en una norma o llamar a alguien, y «describió» habría contado el olor con detalle."
    options:
      - position: 1
        text: "invocó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Invocar» es llamar a alguien o apoyarse en una norma, y aquí una frase enciende un olor."
