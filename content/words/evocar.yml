explanation: "Traer a la cabeza una imagen o un recuerdo con muy pocas palabras."
example_sentence: "Con dos palabras, «olor a lluvia», consiguió evocar el patio de su infancia."
register: "neutral"
pedantry_risk: 2
usage_tip: "Es el atajo del que cuenta historias: en vez de describir diez minutos, enciendes una imagen que ya existe."
