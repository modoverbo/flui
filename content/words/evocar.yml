      - position: 2
        text: "evocó"
        is_correct: true
      - position: 3
        text: "inventó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Inventar» supondría que ese invierno no existió, y la frase da por hecho que los dos lo vivieron."
