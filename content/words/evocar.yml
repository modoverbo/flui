  - position: 4
    sentence: "Cuando Ivo dijo «el tren de las siete», {{blank}} en su hermano un invierno entero."
    hint_general: "Una frase corta enciende un año completo en otra persona."
    explanation: "Evocó: una frase corta encendió un año entero en otro. «Convocó» es llamar a una reunión, e «inventó» supondría que ese invierno no existió."
