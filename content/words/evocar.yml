readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Olor a cartón"
    body: "Otilia tenía que explicar por qué el almacén nuevo cambiaba todo y la sala estaba dormida. Empezó así: «¿Recuerdas el olor a cartón mojado del sótano viejo?». Tres personas hicieron una mueca. Con eso evocó el problema mejor que con cualquier gráfico."
    before_phrase: "El almacén antiguo tenía humedad, ya lo sabes."
    after_phrase: "¿Recuerdas el olor a cartón mojado?"
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "El tren de las siete"
    body: "Ivo y su hermano no hablaban de aquel invierno desde hacía años. Bastó una frase en la cena: «El tren de las siete». Los dos se rieron a la vez. Evocó un año entero sin contar una sola escena."
    before_phrase: "¿Te acuerdas de aquella época, cuando íbamos en tren y tal?"
    after_phrase: "El tren de las siete: con eso lo evoco todo."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "La canción de la mesa pequeña"
    body: "En la fiesta de los diez años, Gonzalo no dio un discurso. Puso una canción de aquellos primeros meses y dijo dos frases. La sala entera sonrió a la vez: la canción evocó el local diminuto donde habían empezado."
    before_phrase: "Quería recordarte cómo empezamos, bla, bla."
    after_phrase: "Esta canción evoca la mesa donde empezamos."
