    body: "En la reunión de la comunidad se votó arreglar el patio. Hubo dos negativas y once síes, y las dos personas que dijeron que no lo explicaron en un minuto. Nadie se levantó de la silla enfadado, y la obra empezó en octubre."
    before_phrase: "Dos dijeron que no y ya está."
    after_phrase: "Hubo dos negativas, explicadas en un minuto."
  - position: 3
