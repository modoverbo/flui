confusions:
  - confused_with: "negligencia"
    difference: "«Negligencia» es el descuido de quien no hace lo que debía; la otra palabra es una respuesta clara a una petición."
    memory_trick: "La negligencia se olvida; la respuesta se dice en voz alta."
  - confused_with: "negociación"
    difference: "Una «negociación» busca un punto intermedio entre dos partes; la otra palabra cierra la puerta sin punto intermedio."
    memory_trick: "En la negociación se cede algo; en lo otro no se cede nada."
exercises:
