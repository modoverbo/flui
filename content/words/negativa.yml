    conversation_type: "practica"
    title: "La carpeta de los noes"
    body: "Nerea guarda en una carpeta todas las respuestas que le dijeron que no. La primera es de hace nueve años. «Esa negativa me dio la lista de los otros doce sitios», cuenta. Al décimo tercero le dijeron que sí, y ese correo lo tiene enmarcado."
    before_phrase: "Me dijeron que no y casi lo dejo."
    after_phrase: "Aquella negativa me dio la lista de los siguientes."
