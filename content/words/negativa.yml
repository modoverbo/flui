    title: "El espejo de Berta"
    body: "Berta decía que sí a todas las comidas de los domingos y luego pasaba la semana enfadada. Una tarde ensayó delante del espejo: «Este domingo no puedo». Sin disculparse tres veces, sin inventar médicos. Su madre contestó «vale, la próxima» y ahí se acabó el asunto."
    before_phrase: "Es que no sé decir que no sin quedar mal."
    after_phrase: "Ensayé mi negativa hasta que me salió corta."
