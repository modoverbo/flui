explanation: "Cambiar el estado o el orden de algo, casi siempre para peor."
example_sentence: "Cambiar la hora de la reunión va a alterar todo el plan del día."
register: "neutral"
pedantry_risk: 1
usage_tip: "Avisa de que el cambio tiene consecuencias; por eso funciona tan bien con «no quiero»."
when_not_to_use: "No la uses para ir turnándose entre dos cosas; eso es «alternar»."
collocations:
  - "alterar el orden"
  - "alterar una fecha"
  - "alterar los ánimos"
replaces:
