    body: "Pedían mover la reunión dos horas y parecía un detalle. Virginia lo puso sobre la mesa: «Mover esa hora altera el resto del día para cinco personas». Propuso el jueves a la misma hora y nadie perdió nada."
    before_phrase: "Es que eso nos descoloca todo el día."
    after_phrase: "Mover esa hora altera el resto del día."
