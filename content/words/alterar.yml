confusions:
  - confused_with: "alternar"
    difference: "«Alternar» es ir cambiando entre dos cosas por turnos; la otra palabra modifica algo y deja de ser lo que era."
    memory_trick: "Alternas entre dos; lo otro toca una sola y la cambia."
  - confused_with: "adulterar"
    difference: "«Adulterar» es mezclar algo con una sustancia ajena para engañar; la otra palabra no supone engaño, solo cambio."
    memory_trick: "Adulterar añade engaño; lo otro solo mueve el orden."
exercises:
  - position: 1
    sentence: "Mover la reunión a las nueve va a {{blank}} todo el plan del día."
    hint_general: "Ese cambio deja el resto del día distinto de como estaba pensado."
    explanation: "Alterar: el cambio deja el día distinto. «Alternar» sería ir turnando entre dos horarios, y «descuadrar» es coloquial y suena a cuentas que no salen."
    options:
      - position: 1
        text: "alternar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Alternar» sería ir turnando entre dos horarios distintos, y aquí se cambia uno solo y el resto se descoloca."
        hint_specific: "Alternar necesita dos opciones que se turnan. ¿Cuántos horarios hay en juego?"
      - position: 2
        text: "alterar"
        is_correct: true
      - position: 3
        text: "descuadrar"
        is_correct: false
        distractor_type: "register"
        why_not: "«Descuadrar» es coloquial y suena a cuentas que no salen, y lo que cambia aquí es la organización de un día entero."
        hint_specific: "«Descuadrar» se usa con números y cajas. ¿Se habla de cuentas o de horarios?"
  - position: 2
    sentence: "El ruido de la obra {{blank}} el sueño de medio edificio durante tres semanas."
    hint_general: "El descanso dejó de ser el que era por culpa de algo externo."
    explanation: "Alteró: el descanso dejó de ser el mismo. «Alternó» sería ir turnando entre dos cosas, y «acompañó» diría que el ruido estuvo ahí sin molestar."
    options:
      - position: 1
        text: "alternó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Alternó» sería ir turnando entre dos estados, y el ruido no se turna con nada: estropea el descanso."
        hint_specific: "Alternar va y viene entre dos cosas. ¿Con qué se turnaría ese ruido?"
      - position: 2
        text: "alteró"
        is_correct: true
      - position: 3
        text: "acompañó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Acompañó» diría que el ruido estuvo ahí sin estropear nada, y tres semanas sin dormir bien dicen lo contrario."
        hint_specific: "Acompañar no molesta. ¿Cómo durmió medio edificio esas semanas?"
  - position: 3
    sentence: "Nadie puede {{blank}} el orden de los turnos sin avisar al resto del equipo."
    hint_general: "Tocar ese orden cambia el trabajo de todos los demás."
    explanation: "Alterar: tocar ese orden cambia el de todos. «Alternar» sería turnarse entre dos listas, y «trastocar» suena rebuscado y anuncia un desbarajuste mayor."
    options:
      - position: 1
        text: "trastocar"
        is_correct: false
        distractor_type: "register"
        why_not: "«Trastocar» suena rebuscado y anuncia un desbarajuste enorme, y aquí basta con mover un turno para causar problemas."
        hint_specific: "«Trastocar» suena a caos total y a lenguaje de libro. ¿Encaja en la norma de un equipo?"
      - position: 2
        text: "alterar"
        is_correct: true
      - position: 3
        text: "alternar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Alternar» sería turnarse entre dos listas de turnos, y la frase habla de cambiar el orden que ya está fijado."
        hint_specific: "Alternar reparte entre dos. ¿Hay dos listas o solo una que se toca?"
  - position: 4
    sentence: "Ese aditivo {{blank}} el sabor del vino y los clientes se dieron cuenta enseguida."
    hint_general: "El sabor dejó de ser el que era."
    explanation: "Alteró: el sabor dejó de ser el mismo. «Adulteró» añadiría la idea de engaño deliberado, y «resaltó» diría que hizo más notable el sabor original."
    options:
      - position: 1
        text: "adulteró"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Adulteró» añadiría la idea de un engaño buscado, y la frase no dice que nadie quisiera engañar a los clientes."
        hint_specific: "Adulterar supone intención de engañar. ¿Dice la frase que hubo mala intención?"
      - position: 2
        text: "alteró"
        is_correct: true
      - position: 3
        text: "resaltó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Resaltó» diría que el sabor original se notó más, y los clientes se dieron cuenta justo de que ya no era el mismo."
        hint_specific: "Resaltar subraya lo que ya había. ¿De qué se dieron cuenta los clientes?"
  - position: 5
    sentence: "Ramiro pidió no {{blank}} ni una coma del texto sin consultarlo antes."
    hint_general: "Quiere que el texto se quede exactamente como está."
    explanation: "Alterar: que el texto se quede como está. «Alternar» sería turnar dos versiones, y «retocar» suena a mejora pequeña, que es justo lo que él no autoriza."
    options:
      - position: 1
        text: "alterar"
        is_correct: true
      - position: 2
        text: "alternar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Alternar» sería ir turnando dos versiones del texto, y Ramiro pide que no se toque ninguna coma."
        hint_specific: "Alternar necesita dos versiones. ¿Cuántos textos hay sobre la mesa?"
      - position: 3
        text: "retocar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Retocar» suena a mejora pequeña y autorizada, y él prohíbe cualquier cambio, por mínimo que sea."
        hint_specific: "Retocar suena a arreglo menor. ¿Qué margen deja «ni una coma»?"
  - position: 6
    sentence: "La noticia {{blank}} a todo el equipo justo antes de la presentación."
    hint_general: "Dejó a todos con el ánimo cambiado en el peor momento."
    explanation: "Alteró: dejó a todos con el ánimo cambiado. «Alternó» sería turnarse entre dos estados, y «revolucionó» es coloquial y sugiere entusiasmo, no nervios."
    options:
      - position: 1
        text: "alternó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Alternó» sería ir turnando entre dos ánimos, y la noticia hizo una sola cosa: poner nervioso a todo el mundo."
        hint_specific: "Alternar va y viene entre dos. ¿Qué dos estados se turnarían aquí?"
      - position: 2
        text: "alteró"
        is_correct: true
      - position: 3
        text: "revolucionó"
        is_correct: false
        distractor_type: "register"
        why_not: "«Revolucionó» es coloquial y sugiere entusiasmo y energía, y aquí lo que hay son nervios antes de salir a presentar."
        hint_specific: "«Revolucionar» suena a euforia. ¿El equipo sale animado o nervioso?"
  - position: 7
    sentence: "Un solo dato mal copiado puede {{blank}} el resultado entero del informe."
    hint_general: "Ese fallo deja el resultado distinto del verdadero."
    explanation: "Alterar: el resultado deja de ser el verdadero. «Adulterar» supondría engaño deliberado, y «retrasar» solo movería la fecha de entrega."
    options:
      - position: 1
        text: "adulterar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Adulterar» supone que alguien manipula a propósito para engañar, y aquí se habla de un dato mal copiado sin querer."
        hint_specific: "Adulterar implica intención. ¿Copiar mal un dato es a propósito?"
      - position: 2
        text: "retrasar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Retrasar» solo movería la fecha de entrega, y lo que queda tocado aquí es la cifra final del informe."
        hint_specific: "Retrasar mueve el calendario. ¿Qué queda mal por culpa de ese dato?"
      - position: 3
        text: "alterar"
        is_correct: true
  - position: 8
    sentence: "No quiero {{blank}} tus planes: dime qué día te viene bien y me organizo."
    hint_general: "No quiere que lo que el otro tenía pensado cambie por su culpa."
    explanation: "Alterar: no quiere cambiarle lo que tenía pensado. «Alternar» sería turnarse los planes, y «aplazar» solo movería la fecha a más tarde."
    options:
      - position: 1
        text: "alternar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Alternar» sería ir turnando los planes de uno y de otro, y aquí solo se quiere respetar los del otro."
        hint_specific: "Alternar reparte por turnos. ¿Se turnan aquí dos agendas?"
      - position: 2
        text: "aplazar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Aplazar» movería la cita a más tarde, y quien habla ofrece justo lo contrario: adaptarse a cualquier día."
        hint_specific: "Aplazar empuja la fecha. ¿Qué ofrece el final de la frase?"
      - position: 3
        text: "alterar"
        is_correct: true
