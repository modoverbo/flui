    title: "El día que te venga bien"
    body: "Su hermana llevaba semanas con la agenda llena. Antonio le escribió corto: «No quiero alterar tus planes. Dime qué día te viene bien y me organizo yo». Quedaron el domingo siguiente y fue la mejor comida del año."
    before_phrase: "No quiero fastidiarte lo que ya tengas."
    after_phrase: "No quiero alterar tus planes."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "Tres semanas de obra"
    body: "El martillo empezaba a las siete y el portal entero estaba de mal humor. Elisa habló con la empresa sin levantar la voz: «El horario actual altera el descanso de todo el edificio». Pasaron a empezar a las nueve."
    before_phrase: "Ese ruido no nos deja dormir a nadie."
    after_phrase: "Ese horario altera el descanso del edificio."
