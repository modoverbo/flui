readings:
  - position: 1
    scene: "familia"
    conversation_type: "emocional"
    title: "El piso de abajo"
    body: "Después de once años, se mudó al piso de abajo del mismo bloque. Nadie entendía nada. «El cariño está intacto; lo que se rompió fue la convivencia», explicó en la comida del domingo. Siguen cenando juntos los martes."
    before_phrase: "Nos queremos, pero juntos no podemos."
    after_phrase: "El cariño está intacto; se rompió la convivencia."
  - position: 2
    scene: "trabajo"
    conversation_type: "practica"
    title: "Dos mesas, una oficina"
    body: "Los socios llevaban meses hablándose por correo estando a tres metros. Un asesor externo lo nombró en la primera sesión: «Las cuentas están bien; el problema es la convivencia». Cambiaron el reparto de responsabilidades y volvieron a comer juntos."
    before_phrase: "Es que no nos soportamos y así no se puede."
    after_phrase: "Las cuentas están bien; el problema es la convivencia."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "Siete y media"
    body: "Tres personas y un baño: cada mañana era una negociación de miradas. Un domingo hicieron un cuadro con horas y duchas. «La convivencia se arregla con detalles tontos», resumió una de ellas. Nadie volvió a discutir por el agua caliente."
    before_phrase: "Es que vivir juntos es un lío constante."
    after_phrase: "La convivencia se arregla con detalles tontos."
