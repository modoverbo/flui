confusions:
  - confused_with: "aludir"
    difference: "«Aludir» es mencionar algo de pasada, aunque sea sin nombrarlo; la otra palabra significa escapar de ello."
    memory_trick: "Quien alude lo nombra; quien elude lo esquiva."
  - confused_with: "excluir"
    difference: "«Excluir» es dejar algo o a alguien fuera de un grupo; aquí nadie queda fuera, solo se escapa de un asunto."
    memory_trick: "Excluyes a quien dejas fuera; eludes lo que no quieres tocar."
