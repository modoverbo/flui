confusions:
  - confused_with: "atacar"
    difference: "«Atacar» va contra alguien o contra algo; la otra palabra frena un problema a tiempo, sin culpar a nadie."
    memory_trick: "Atacas a una persona; frenas un problema."
  - confused_with: "acallar"
    difference: "«Acallar» es hacer que alguien deje de hablar; frenar un problema a tiempo quita la causa, no la voz."
    memory_trick: "Acallar tapa la boca; frenar a tiempo quita el motivo."
exercises:
  - position: 1
    sentence: "Cuando dos clientes seguidos preguntaron por el mismo cobro raro, Camila quiso {{blank}} el fallo antes de que llegara a más facturas."
    hint_general: "Quiere cortar el fallo mientras sigue siendo pequeño, antes de que se extienda."
    explanation: "Atajar: corta el fallo antes de que se extienda. «Atascar» dejaría algo trabado, y «acallar» silenciaría a los clientes en vez de arreglar el cobro."
    options:
      - position: 1
        text: "atascar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Atascar» es dejar algo trabado y sin avanzar, y ella no quiere trabar el fallo: quiere cortarlo antes de que se extienda."
        hint_specific: "«Atascar» deja algo trabado. ¿Camila traba el fallo o lo corta?"
      - position: 2
        text: "atajar"
        is_correct: true
      - position: 3
        text: "acallar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Acallar» sería hacer callar a los clientes, y lo que se corta es el cobro mal hecho, no las preguntas."
        hint_specific: "«Acallar» apaga voces. ¿El problema son las voces o el cobro?"
  - position: 2
    sentence: "Un rumor sobre el cierre de la tienda corrió por el grupo, y Fernando lo {{blank}} con un mensaje claro esa misma tarde."
    hint_general: "Lo para el mismo día, antes de que se haga grande."
    explanation: "Atajó: lo paró el mismo día. «Atacó» iría contra una persona, y «tapó» es coloquial y sugiere esconder la verdad."
    options:
      - position: 1
        text: "atajó"
        is_correct: true
      - position: 2
        text: "atacó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Atacar» va contra alguien, y él escribe para aclarar, no para señalar a nadie."
        hint_specific: "«Atacó» apunta a una persona. ¿A quién apunta ese mensaje?"
      - position: 3
        text: "tapó"
        is_correct: false
        distractor_type: "register"
        why_not: "«Tapar» un rumor es coloquial y sugiere esconder algo, y la frase dice que el mensaje fue claro."
        hint_specific: "«Tapó» esconde. Relee el final: ¿el mensaje escondía o aclaraba?"
  - position: 3
    sentence: "Mi hermana notó que su hijo faltaba a la piscina y prefirió {{blank}} el asunto con una charla corta."
    hint_general: "Prefiere frenar el asunto mientras es pequeño, sin montar un drama."
    explanation: "Atajar: frenar el asunto mientras es pequeño. «Atacar» iría contra el niño, y «rehuir» sería apartarse del asunto."
    options:
      - position: 1
        text: "atacar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Atacar» se dirige contra alguien, y ella busca una charla corta con su hijo, no una pelea."
        hint_specific: "«Atacar» pone a alguien en el punto de mira. ¿Esa charla apunta a alguien?"
      - position: 2
        text: "rehuir"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Rehuir» es apartarse del asunto, y ella hace justo lo contrario: lo trata enseguida."
        hint_specific: "«Rehuir» se aparta. ¿Ella se aparta o se acerca?"
      - position: 3
        text: "atajar"
        is_correct: true
  - position: 4
    sentence: "En la obra apareció una grieta pequeña y el jefe decidió {{blank}} el problema antes de seguir con la planta de arriba."
    hint_general: "Para el problema mientras sigue siendo una grieta pequeña."
    explanation: "Atajar: corta el problema mientras es pequeño. «Achacar» sería echarle la culpa a alguien, y «disimular» lo taparía con pintura."
    options:
      - position: 1
        text: "atajar"
        is_correct: true
      - position: 2
        text: "achacar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Achacar» es echarle a alguien la culpa de algo, y aquí nadie busca culpables: se corta la grieta antes de que crezca."
        hint_specific: "«Achacar» reparte culpas. ¿El jefe busca un culpable o para la grieta?"
      - position: 3
        text: "disimular"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Disimular» sería taparla con pintura, y él para la obra justo para arreglarla de verdad."
        hint_specific: "«Disimular» esconde a la vista. ¿Por qué para entonces la planta de arriba?"
  - position: 5
    sentence: "Nadie quiso {{blank}} las llegadas tarde al principio, y seis meses después la reunión empezaba siempre a y cuarto."
    hint_general: "Nadie paró la costumbre cuando todavía era pequeña."
    explanation: "Atajar: parar la costumbre cuando era pequeña. «Atacar» iría contra las personas, y «premiar» sería lo contrario de corregir."
    options:
      - position: 1
        text: "atacar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Atacar» iría contra las personas que llegan tarde, y lo que faltó fue corregir la costumbre a tiempo."
        hint_specific: "«Atacar» señala culpables. ¿Qué se debería haber frenado?"
      - position: 2
        text: "atajar"
        is_correct: true
      - position: 3
        text: "premiar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Premiar» es recompensar algo, y la frase cuenta el efecto de no haber corregido nada."
        hint_specific: "«Premiar» celebra. ¿La frase celebra o lamenta?"
  - position: 6
    sentence: "Gloria vio dos correos secos entre compañeros y {{blank}} la tensión con un café de quince minutos."
    hint_general: "Frena la tensión cuando todavía cabe en un café corto."
    explanation: "Atajó: frenó la tensión cuando aún era pequeña. «Atacó» iría contra alguien, y «zurció» es coloquial y suena a costura."
    options:
      - position: 1
        text: "atacó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Atacar» va contra una persona, y ella junta a los dos compañeros para hablar."
        hint_specific: "«Atacó» busca a quién culpar. ¿Gloria culpa a alguien?"
      - position: 2
        text: "zurció"
        is_correct: false
        distractor_type: "register"
        why_not: "«Zurcir» es coser una rotura de la ropa y suena a costura; una tensión entre compañeros se habla."
        hint_specific: "«Zurció» pide aguja e hilo. ¿Qué había roto aquí?"
      - position: 3
        text: "atajó"
        is_correct: true
  - position: 7
    sentence: "En la entrevista, Ximena contó que su método es sencillo: {{blank}} los desacuerdos pequeños el mismo día."
    hint_general: "Para los desacuerdos el mismo día, cuando aún son pequeños."
    explanation: "Atajar: parar los desacuerdos el mismo día. «Atacar» iría contra las personas, y «aguantar» sería dejarlos crecer en silencio."
    options:
      - position: 1
        text: "atajar"
        is_correct: true
      - position: 2
        text: "atacar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Atacar» va contra las personas, y su método trata sobre los desacuerdos, no sobre la gente."
        hint_specific: "«Atacar» elige un blanco humano. ¿Su método apunta a personas?"
      - position: 3
        text: "aguantar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Aguantar» es soportarlos en silencio, y ella habla de resolverlos el mismo día."
        hint_specific: "«Aguantar» deja pasar el tiempo. ¿Cuánto tiempo deja pasar Ximena?"
  - position: 8
    sentence: "La fuga del grifo goteaba desde el martes; Samuel la {{blank}} el sábado y se ahorró un suelo nuevo."
    hint_general: "La para cuando todavía es un goteo y no una inundación."
    explanation: "Atajó: la paró cuando era un goteo. «Atacó» iría contra alguien, y «denunció» llevaría el asunto a otra instancia."
    options:
      - position: 1
        text: "denunció"
        is_correct: false
        distractor_type: "register"
        why_not: "«Denunciar» lleva el asunto a una oficina o a un juzgado, y él simplemente arregló el grifo el sábado."
        hint_specific: "«Denunció» abre un expediente. ¿Eso seca un grifo?"
      - position: 2
        text: "atajó"
        is_correct: true
      - position: 3
        text: "atacó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Atacar» va contra alguien o contra algo con fuerza, y una fuga se repara con una llave inglesa."
        hint_specific: "«Atacó» suena a combate. ¿Hay combate con un grifo?"
