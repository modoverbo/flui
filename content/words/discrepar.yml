confusions:
  - confused_with: "discriminar"
    difference: "«Discriminar» es separar una cosa de otra por sus diferencias; aquí no se separa nada, se dice que no se comparte una idea."
    memory_trick: "Discriminas separando; discrepas opinando."
  - confused_with: "discutir"
    difference: "«Discutir» es entrar en una pelea de argumentos; lo otro cabe en una sola frase y sin subir el tono."
    memory_trick: "Discutir alarga; discrepar nombra."
exercises:
  - position: 1
    sentence: "Marina escuchó la propuesta entera y luego dijo que {{blank}} en dos puntos concretos."
    hint_general: "Dijo que no estaba de acuerdo en dos puntos."
    explanation: "Discrepaba: dijo que no estaba de acuerdo en dos puntos. «Discriminaba» sería separar cosas por sus diferencias, y «dudaba» diría que no lo tenía claro."
    options:
      - position: 1
        text: "discriminaba"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Discriminar» es separar unas cosas de otras por sus diferencias; Marina no separa nada, marca dónde no coincide."
        hint_specific: "Discriminar separa cosas. ¿Marina separa algo o marca su postura?"
      - position: 2
        text: "discrepaba"
        is_correct: true
      - position: 3
        text: "dudaba"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Dudar» es no tenerlo claro; Marina lo tiene clarísimo, y por eso señala dos puntos exactos."
        hint_specific: "Dudar es no tenerlo claro. ¿Marina duda o sabe en qué no coincide?"
  - position: 2
    sentence: "Puedes {{blank}} en una reunión sin convertirla en una pelea: basta con decir de qué y por qué."
    hint_general: "Se puede decir que no compartes algo sin pelear."
    explanation: "Discrepar: decir que no compartes algo sin pelear. «Discernir» es distinguir entre dos cosas, y «disentir» dice lo mismo con tono de acta parlamentaria."
    options:
      - position: 1
        text: "discernir"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Discernir» es distinguir una cosa de otra con criterio; en la frase no se distingue nada, se marca una postura."
        hint_specific: "Discernir distingue entre cosas. ¿Qué se hace aquí en la reunión?"
      - position: 2
        text: "disentir"
        is_correct: false
        distractor_type: "register"
        why_not: "«Disentir» significa algo parecido, pero suena a acta parlamentaria; en una reunión normal resulta solemne."
        hint_specific: "«Disentir» suena a acta oficial. ¿Encaja en una reunión de equipo?"
      - position: 3
        text: "discrepar"
        is_correct: true
  - position: 3
    sentence: "Si {{blank}} del plan, dilo hoy y no dentro de tres semanas en el pasillo."
    hint_general: "Di hoy que no estás de acuerdo, no en el pasillo."
    explanation: "Discrepas: dices hoy que no estás de acuerdo. «Discurres» significa pensar o pasear una idea, y «refunfuñas» describe quejarse por lo bajo."
    options:
      - position: 1
        text: "discrepas"
        is_correct: true
      - position: 2
        text: "discurres"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Discurrir» es pensar o dejar correr una idea; la frase pide decir algo en voz alta, no pensarlo."
        hint_specific: "Discurrir se hace por dentro. ¿Qué pide la frase, pensar o hablar?"
      - position: 3
        text: "refunfuñas"
        is_correct: false
        distractor_type: "register"
        why_not: "«Refunfuñar» es coloquial y describe quejarse por lo bajo, justo lo que la frase quiere evitar."
        hint_specific: "«Refunfuñar» es quejarse entre dientes. ¿Eso es lo que la frase pide?"
  - position: 4
    sentence: "Mi hermana {{blank}} de la idea del viaje, y aun así acabó viniendo y pasándolo bien."
    hint_general: "No estaba de acuerdo con el viaje, y aun así fue."
    explanation: "Discrepó: no compartía la idea del viaje. «Discriminó» sería separar cosas por sus diferencias, y «aceptó» diría que estaba conforme desde el principio."
    options:
      - position: 1
        text: "discriminó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Discriminar» es separar unas cosas de otras; ella no separa nada, simplemente no comparte la idea."
        hint_specific: "Discriminar separa. ¿Qué hace tu hermana con la idea del viaje?"
      - position: 2
        text: "aceptó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Aceptar» diría que estaba conforme; el «aun así» de la frase anuncia justo lo contrario."
        hint_specific: "Aceptar supone conformidad. ¿Qué anuncia el «aun así»?"
      - position: 3
        text: "discrepó"
        is_correct: true
  - position: 5
    sentence: "Nadie {{blank}} en voz alta, y el proyecto salió adelante con dudas de todos."
    hint_general: "Nadie dijo en voz alta que no lo compartía."
    explanation: "Discrepó: nadie dijo en voz alta que no lo compartía. «Discernió» sería distinguir entre opciones, y «calló» chocaría con el propio «en voz alta»."
    options:
      - position: 1
        text: "discernió"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Discernir» es distinguir entre dos opciones con criterio; aquí el problema no es distinguir, es que nadie habló."
        hint_specific: "Discernir distingue opciones. ¿Qué faltó en esa sala?"
