    after: "Discrepo de lo que propones"
  - before: "Yo lo veo de otra manera"
    after: "Discrepo, y te digo por qué"
  - before: "A mí no me parece bien eso"
    after: "Discrepo de ese punto"
family: ["discrepancia"]
