        text: "calló"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Callar» choca con el propio «en voz alta» de la frase: nadie calla en voz alta."
        hint_specific: "Fíjate en «en voz alta». ¿Se puede callar en voz alta?"
  - position: 6
    sentence: "El comité aprobó el cambio con dos personas que {{blank}}, y sus razones quedaron por escrito."
    hint_general: "Dos personas dijeron que no lo compartían, con sus razones."
    explanation: "Discrepaban: dos personas no compartían el cambio. «Discriminaban» sería separar cosas por sus diferencias, y «preguntaban» diría que solo tenían dudas."
    options:
      - position: 1
        text: "preguntaban"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Preguntar» es pedir información; la frase dice que dejaron razones por escrito, no preguntas."
        hint_specific: "Preguntar pide información. ¿Qué dejaron esas dos personas por escrito?"
      - position: 2
        text: "discriminaban"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Discriminar» es separar unas cosas de otras; en un comité lo que se hace es votar y dar razones."
        hint_specific: "Discriminar separa cosas. ¿Qué hacen dos personas en un comité?"
      - position: 3
        text: "discrepaban"
        is_correct: true
  - position: 7
    sentence: "Antes de firmar, Ernesto quiso {{blank}} del cálculo de horas sin poner en duda el resto del acuerdo."
    hint_general: "Quiere marcar su desacuerdo solo con el cálculo de horas."
    explanation: "Discrepar: marca su desacuerdo solo en ese punto. «Discernir» sería distinguir entre opciones, y «criticar» sonaría a juicio sobre el trabajo ajeno."
    options:
      - position: 1
        text: "discernir"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Discernir» es distinguir con criterio entre dos cosas; Ernesto no distingue, señala el punto que no comparte."
        hint_specific: "Discernir distingue. ¿Ernesto distingue o señala?"
      - position: 2
        text: "discrepar"
        is_correct: true
      - position: 3
        text: "criticar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Criticar» suena a juicio sobre el trabajo de otro; la frase subraya que respeta el resto del acuerdo."
        hint_specific: "Criticar juzga el trabajo ajeno. ¿Qué respeta Ernesto del acuerdo?"
  - position: 8
    sentence: "Puedo {{blank}} de ti y seguir pensando que sabes de esto mucho más que yo."
    hint_general: "Se puede no estar de acuerdo y respetar a la otra persona."
    explanation: "Discrepar: no compartir una idea sin dejar de respetar a la persona. «Discriminar» sería separar por diferencias, y «desconfiar» pondría en duda su honestidad."
    options:
      - position: 1
        text: "discriminar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Discriminar» es separar unas cosas de otras por sus diferencias; la frase habla de compartir o no una idea."
        hint_specific: "Discriminar separa cosas. ¿De qué habla la frase?"
      - position: 2
        text: "desconfiar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Desconfiar» pondría en duda su honestidad; la segunda mitad de la frase dice justo lo contrario."
        hint_specific: "Desconfiar duda de la persona. ¿Qué dice la segunda mitad de la frase?"
      - position: 3
        text: "discrepar"
        is_correct: true
