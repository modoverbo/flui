ipa_latam: "[dis.kɾeˈpaɾ]"
ipa_es: "[dis.kɾeˈpaɾ]"
explanation: "Decir que no estás de acuerdo con alguien, con calma y sin romper la conversación."
example_sentence: "Escuché la propuesta entera y luego dije que discrepaba en dos puntos concretos."
register: "neutral"
pedantry_risk: 1
usage_tip: "Suena mejor que «no estoy de acuerdo»: nombra la postura y deja a la persona fuera del golpe."
when_not_to_use: "No la uses para una diferencia mínima: si el desacuerdo es de matiz, basta con precisar el punto."
collocations:
  - "discrepar de una idea"
  - "discrepar en público"
  - "discrepar con respeto"
replaces:
