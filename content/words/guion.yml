readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "En el bolso, sin abrir"
    body: "Casandra escribió las frases de su presentación una a una y las repitió dos noches seguidas. El día señalado dejó los folios en el bolso y no los sacó. «Escribir el guion es lo que me lo deja en la cabeza», le contó después a su equipo. «Llevarlo encima ya es de más»."
    before_phrase: "Llevaba todo apuntado por si acaso."
    after_phrase: "Escribí el guion y luego no lo necesité."
  - position: 2
    scene: "entrevista"
    conversation_type: "practica"
    title: "Los dos primeros minutos"
    body: "Ovidio llegaba a las entrevistas con todo aprendido palabra por palabra y salía con la boca seca. Cambió el método: guion cerrado para los dos primeros minutos y cuatro puntos para el resto. «Así arranco firme y después ya converso», explicó. En la tercera le dijeron que sí."
    before_phrase: "Me lo aprendo entero y ojalá no se me olvide."
    after_phrase: "Llevo guion solo para los dos primeros minutos."
  - position: 3
    scene: "social"
    conversation_type: "emocional"
    title: "La llamada difícil"
    body: "Ágata tenía que decirle a su casero que se mudaba y llevaba tres días posponiéndolo. Se escribió un guion de seis líneas y lo dejó al lado del teléfono. No lo leyó, pero llamó. Colgó a los cuatro minutos, aliviada."
    before_phrase: "No sé ni cómo empezar esa llamada."
    after_phrase: "Me escribí un guion de seis líneas y llamé."
