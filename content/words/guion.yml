confusions:
  - confused_with: "guiño"
    difference: "Un «guiño» es cerrar un ojo para decir algo sin palabras; la otra palabra es el texto entero que llevas preparado."
    memory_trick: "El guiño se hace con el ojo; el texto se escribe con la mano."
  - confused_with: "guía"
    difference: "Una «guía» explica cómo hacer algo paso a paso, o es la persona que te acompaña; la otra palabra recoge tus frases tal cual las vas a decir."
    memory_trick: "La guía enseña el camino; el texto dicta las palabras."
