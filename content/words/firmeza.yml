    body: "Le pidieron por cuarta vez que se apuntara al viaje de agosto. Amparo contestó lo mismo que la primera: «No voy, y no es por el dinero». Lo dijo con firmeza y sin enfadarse. Su cuñado insistió una vez más y luego cambió de tema, y la comida siguió tranquila."
