    conversation_type: "social"
    title: "El barrio nuevo"
    body: "Le pregunté a Olivia si estaba contenta con la mudanza. «El piso es parecido», contestó, «pero el cambio sustancial es que ahora bajo andando al trabajo». Tardó dos frases en explicar algo que llevaba meses sin poder nombrar."
    before_phrase: "Cambió un montón, no sé cómo decirlo."
    after_phrase: "El cambio sustancial es otro."
  - position: 3
