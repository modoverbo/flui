        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Visible» dice que el ahorro se ve, y un truco de la letra pequeña también puede verse."
        hint_specific: "«Visible» es que se ve. ¿Ver algo garantiza que sea de fondo?"
  - position: 4
    sentence: "La revisión del contrato trajo un solo cambio {{blank}}: quién paga el transporte si hay un retraso."
    hint_general: "Un único punto que cambia el fondo del acuerdo."
    explanation: "Sustancial: un punto que cambia el fondo del acuerdo. «Descomunal» exagera el tamaño con un tono grandilocuente, y «notorio» solo diría que se ve."
    options:
      - position: 1
        text: "descomunal"
