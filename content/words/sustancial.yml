        distractor_type: "paronym"
        why_not: "«Circunstancial» diría que la caída dependió de un momento suelto, y se mantuvo doce meses."
        hint_specific: "«Circunstancial» depende del momento. ¿Cuánto duró esa caída de quejas?"
  - position: 7
    sentence: "Para mi hermano, mudarse de barrio supuso un cambio {{blank}} en cómo organiza sus semanas."
    hint_general: "El cambio tocó el fondo de su rutina, no un detalle suelto."
    explanation: "Sustancial: tocó el fondo de su rutina. «Descomunal» exagera el tamaño con tono grandilocuente, y «visible» solo diría que se nota desde fuera."
    options:
      - position: 1
        text: "visible"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Visible» dice que el cambio se nota desde fuera, y lo que cuenta la frase es cómo reorganizó su semana."
        hint_specific: "«Visible» es que se ve desde fuera. ¿Lo importante es que se vea o que cambie su rutina?"
      - position: 2
        text: "descomunal"
        is_correct: false
        distractor_type: "register"
        why_not: "«Descomunal» es una palabra de mucho énfasis sobre el tamaño, y aquí se habla de una rutina, no de una magnitud."
        hint_specific: "«Descomunal» agranda el tamaño con énfasis. ¿La frase mide tamaño o mide rutina?"
      - position: 3
        text: "sustancial"
        is_correct: true
  - position: 8
    sentence: "Karla aceptó la oferta nueva porque el salto {{blank}} estaba en las tardes libres, no en el sueldo."
    hint_general: "Lo que cambia el fondo de su vida no es el dinero."
    explanation: "Sustancial: el fondo del cambio son las tardes libres. «Circunstancial» diría que el salto depende del momento, y «puntual» que ocurre una vez."
    options:
      - position: 1
        text: "puntual"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Puntual» diría que el salto pasa una sola vez, y tener las tardes libres le cambia todas las semanas."
        hint_specific: "«Puntual» es algo que pasa una vez. ¿Cuántas tardes libres tendrá Karla?"
      - position: 2
        text: "sustancial"
        is_correct: true
      - position: 3
        text: "circunstancial"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Circunstancial» diría que el salto depende del momento, y ella acepta por algo que se repite cada semana."
