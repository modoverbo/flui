  - position: 5
    sentence: "Rosalía pidió que el informe distinguiera la parte {{blank}} del texto de los comentarios de estilo."
    hint_general: "Separa lo que afecta al fondo de lo que solo afecta a la forma."
    explanation: "Sustancial: la parte que afecta al fondo, frente al estilo. «Sustanciosa» hablaría de un texto denso, y «parcial» diría que cubre solo un trozo."
    options:
      - position: 1
        text: "sustanciosa"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Sustanciosa» diría que el texto viene cargado de contenido, y aquí se separa el fondo de la forma."
        hint_specific: "«Sustanciosa» habla de cuánto llena un texto. ¿Rosalía mide densidad o separa fondo y forma?"
      - position: 2
        text: "sustancial"
        is_correct: true
      - position: 3
        text: "parcial"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Parcial» dice que algo cubre solo un trozo, y lo que ella separa es lo que toca el fondo."
        hint_specific: "«Parcial» es cubrir una parte. ¿Se habla de cuánto abarca o de qué afecta?"
  - position: 6
    sentence: "Tras el cambio de proveedor, la caída de quejas fue {{blank}} y se mantuvo durante todo el año."
    hint_general: "La caída afectó al fondo del servicio y se sostuvo en el tiempo."
    explanation: "Sustancial: la caída afectó al fondo y se sostuvo. «Brutal» es coloquial y exagera, y «circunstancial» diría que dependía de un momento suelto."
    options:
      - position: 1
        text: "sustancial"
        is_correct: true
      - position: 2
        text: "brutal"
        is_correct: false
        distractor_type: "register"
        why_not: "«Brutal» es lenguaje de charla suelta y exagera el efecto, y aquí se informa de un año entero de datos."
