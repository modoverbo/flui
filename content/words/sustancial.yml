    conversation_type: "practica"
    title: "El único punto"
    body: "En la revisión del contrato, Efraín marcó un solo párrafo. «Lo demás es estilo; esto es sustancial: decide quién paga el transporte», explicó. Corrigieron ese párrafo y firmaron el resto sin tocarlo."
    before_phrase: "Este punto me parece importante."
    after_phrase: "Este punto es sustancial."
