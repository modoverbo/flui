        distractor_type: "register"
        why_not: "«Descomunal» es una palabra grandilocuente sobre el tamaño, y aquí se describe un punto preciso de un contrato."
        hint_specific: "«Descomunal» agranda el tamaño con mucho énfasis. ¿Un punto de contrato se mide por tamaño?"
      - position: 2
        text: "sustancial"
        is_correct: true
      - position: 3
        text: "notorio"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Notorio» dice que el cambio salta a la vista, y lo que importa es que decide quién paga."
