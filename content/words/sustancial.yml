confusions:
  - confused_with: "sustancioso"
    difference: "«Sustancioso» se dice de lo que alimenta o de un texto con mucho contenido; el otro mide cuánto pesa un cambio."
    memory_trick: "Sustancioso llena el plato; sustancial cambia el fondo."
  - confused_with: "circunstancial"
    difference: "«Circunstancial» dice que algo depende del momento y puede desaparecer; lo sustancial afecta al fondo y se queda."
    memory_trick: "Lo circunstancial pasa; lo sustancial queda."
exercises:
  - position: 1
    sentence: "Entre la primera versión y la de ahora hay una diferencia {{blank}}: el pedido llega en tres días y no en quince."
    hint_general: "La diferencia toca el fondo del asunto, no un adorno."
    explanation: "Sustancial: doce días menos cambian el fondo del servicio. «Sustanciosa» se dice de lo que alimenta o de un texto denso, y «notoria» solo diría que se ve."
    options:
      - position: 1
        text: "sustanciosa"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Sustanciosa» se usa para una comida que alimenta o para un texto lleno de contenido, no para medir un plazo."
        hint_specific: "«Sustanciosa» habla de lo que alimenta o llena. ¿Eso encaja con contar días de entrega?"
      - position: 2
        text: "sustancial"
        is_correct: true
      - position: 3
        text: "notoria"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Notoria» dice que la diferencia se ve a simple vista, y aquí lo que importa es que cambia el servicio entero."
        hint_specific: "«Notoria» es que algo se nota. ¿Basta con notarlo o cambia el fondo del servicio?"
  - position: 2
    sentence: "El comité aprobó el plan porque la mejora en seguridad era {{blank}} y no dependía de la suerte del mes."
    hint_general: "La mejora toca el fondo y no depende de un buen mes."
    explanation: "Sustancial: toca el fondo y no depende del mes. «Brutal» es de charla informal y exagera, y «puntual» diría que ocurre una sola vez."
    options:
      - position: 1
        text: "brutal"
        is_correct: false
        distractor_type: "register"
        why_not: "«Brutal» es de conversación muy informal y exagera; un comité que aprueba un plan no escribe así."
        hint_specific: "«Brutal» suena a charla entre amigos y a exageración. ¿Va con el acta de un comité?"
      - position: 2
        text: "puntual"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Puntual» diría que la mejora ocurre una sola vez, y la frase subraya que no depende del mes."
        hint_specific: "«Puntual» es que pasa una vez y ya. Relee el final: ¿es pasajera o se sostiene?"
      - position: 3
        text: "sustancial"
        is_correct: true
  - position: 3
    sentence: "Al comparar los dos presupuestos, Yago vio que el ahorro era {{blank}} y no un truco de la letra pequeña."
    hint_general: "El ahorro está en el fondo del presupuesto, no en un detalle escondido."
    explanation: "Sustancial: el ahorro está en el fondo y no en la letra pequeña. «Circunstancial» diría que depende del momento, y «visible» solo diría que se ve."
    options:
      - position: 1
        text: "sustancial"
        is_correct: true
      - position: 2
        text: "circunstancial"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Circunstancial» diría que el ahorro depende del momento y puede desaparecer, y la frase afirma lo contrario."
        hint_specific: "«Circunstancial» es depender del momento. ¿El ahorro de Yago se mantiene o se evapora?"
      - position: 3
