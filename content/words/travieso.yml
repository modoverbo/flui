    after_phrase: "Es travieso, no maleducado."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "El juego de mesa"
    body: "El grupo de los martes se transforma cuando alguien saca un tablero: bromas, cartas escondidas y risas hasta tarde. Un recién llegado preguntó si siempre era así. «Somos traviesos, no tramposos», le contestaron, y le enseñaron dónde estaban sus cartas."
    before_phrase: "Aquí todos son unos liantes."
    after_phrase: "Somos traviesos, no tramposos."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "La broma del lunes"
    body: "Alguien cambió los nombres de las carpetas compartidas y se pasó la mañana riéndose solo. El responsable lo reconduce sin drama: «Esto es travieso, pero hoy no toca; devuélvelo todo antes de las doce». A las once y media estaba en su sitio."
    before_phrase: "Aquí hay alguien que no tiene nada que hacer."
    after_phrase: "Esto es travieso, pero hoy no toca."
