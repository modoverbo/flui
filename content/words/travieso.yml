    title: "Los mandos escondidos"
    body: "Su sobrino escondía los mandos y esperaba en el pasillo a que alguien los buscara. Su hermana estaba a punto de castigarlo cuando Aitana lo dijo en voz alta: «Es travieso, no maleducado». Cambiaron el castigo por un juego de pistas."
