readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "El mensaje de las tres de la mañana"
    body: "A las tres de la mañana, Marina escribió un mensaje que llevaba semanas guardándose. A la mañana siguiente lo leyó y sintió vergüenza. «Fue un arrebato», le contó a su amiga, «pero no me arrepiento de nada de lo que dije»."
    before_phrase: "Me dio por escribirle sin pensarlo."
    after_phrase: "Tuve un arrebato y le escribí."
  - position: 2
    scene: "trabajo"
    conversation_type: "emocional"
    title: "Los pasajes sin consultar"
    body: "Rubén contó en la oficina que había comprado dos pasajes para el fin de semana sin avisarle a su pareja. «Fue un arrebato total», admitió entre risas, «espero que le guste la sorpresa, porque ya no hay vuelta atrás»."
    before_phrase: "Me dio por comprarlos sin pensarlo mucho."
    after_phrase: "Fue un arrebato total."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "La confesión que llevaba meses callada"
    body: "En la cena familiar, su hermano soltó de golpe algo que había callado por años. «Perdón por el arrebato», dijo después, algo avergonzado, «pero llevaba mucho tiempo con esto guardado»."
    before_phrase: "Perdón por soltarlo así de repente."
    after_phrase: "Perdón por el arrebato."
