explanation: "Impulso fuerte que te lleva a decir o hacer algo de pronto, sin pensar."
example_sentence: "Se lo dijo en un arrebato, sin pensarlo dos veces, y no se arrepiente."
register: "neutral"
pedantry_risk: 1
usage_tip: "Sirve para contar algo que dijiste o hiciste de golpe, sin cálculo, y que no lamentas."
when_not_to_use: "No la uses para un enfado pasajero ni para algo bien pensado: aquí el impulso lleva a un gesto de cariño, no a una queja."
