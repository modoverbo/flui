schema_version: 1
slug: "arrebato"
status: "draft"
lemma: "arrebato"
part_of_speech: "sustantivo"
syllables: ["a", "rre", "ba", "to"]
stressed_syllable: 3
ipa_latam: "[a.reˈβa.to]"
ipa_es: "[a.reˈβa.to]"
explanation: "Impulso de golpe y fuerte que hace actuar sin pensarlo mucho, movido por una emoción."
example_sentence: "En un arrebato, Marina le escribió un mensaje larguísimo a las tres de la mañana."
register: "neutral"
pedantry_risk: 1
usage_tip: "Úsalo para explicar una acción hecha sin planearla, movida por una emoción fuerte del momento."
when_not_to_use: "No lo uses para algo que planeaste con tiempo: el arrebato es siempre repentino, no calculado."
collocations:
  - "un arrebato de"
  - "en un arrebato"
  - "tener un arrebato"
family: []
themes:
  - slug: "citas"
    relevance: 3
tags:
