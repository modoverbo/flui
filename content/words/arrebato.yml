confusions:
  - confused_with: "capricho"
    difference: "«Capricho» es un antojo pasajero que se puede resistir; el arrebato es un impulso que ya se dijo o se hizo."
    memory_trick: "El capricho se piensa y se resiste; el arrebato ya pasó."
  - confused_with: "berrinche"
    difference: "«Berrinche» es una rabieta infantil por enojo; el arrebato puede nacer de cariño, no de rabia."
exercises:
  - position: 1
    sentence: "Cuando el camarero dejó caer la bandeja, el susto duró apenas un segundo; ya con el restaurante en calma de nuevo, a Emilio le dio un {{blank}} y le dijo a Renata lo que llevaba meses callando."
    hint_general: "Piensa en un impulso que viene de dentro, no en una alarma o un alboroto que ya había terminado."
    explanation: "Arrebato: un impulso interno, no la señal de alarma que ya había pasado. «Rebato» es una señal de alarma o un alboroto repentino, y la frase aclara que el restaurante ya estaba en calma cuando él habló; «capricho» es un antojo que se puede resistir, y aquí la confesión se le escapó sin pensarlo."
    options:
      - position: 1
        text: "rebato"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Rebato» es una señal de alarma o un alboroto repentino, y la frase aclara que el restaurante ya estaba en calma cuando Emilio habló, no en medio de ningún alboroto."
        hint_specific: "Un rebato es un alboroto que ya había pasado aquí. ¿El restaurante estaba en calma o en alboroto cuando Emilio habló?"
      - position: 2
        text: "arrebato"
        is_correct: true
      - position: 3
        text: "capricho"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Un «capricho» es un antojo que se puede resistir, y a Emilio la confesión se le escapó sin poder evitarlo."
        hint_specific: "El capricho se puede aguantar. ¿Emilio pudo aguantarse las ganas de decirlo?"
  - position: 2
    sentence: "A Vera, que ya había sentido antes las ganas de decírselo y se había aguantado sin problema, esa noche en plena cena le dio un {{blank}} tan fuerte que no pudo aguantarse y le confesó a su cita que llevaba semanas queriendo escribirle."
    hint_general: "Piensa en un impulso tan fuerte que no se puede controlar, distinto a las ganas que normalmente se resisten."
    explanation: "Arrebato: un impulso tan fuerte que no se puede controlar, distinto a las ganas normales. «Pronto» es coloquial y suele ser un golpe de mal genio, y en esta cena lo que hubo fue cariño, no enojo; «impulso» es más leve y se puede aguantar, y la frase aclara que esta vez Vera no pudo aguantarse, a diferencia de otras veces."
    options:
      - position: 1
        text: "pronto"
        is_correct: false
        distractor_type: "register"
        why_not: "«Pronto» es coloquial y suele describir un golpe de mal genio, y en esta cena lo que hubo fue cariño, no enfado."
        hint_specific: "Un pronto suele ser de mal humor. ¿Vera está enojada en esta cena?"
      - position: 2
        text: "impulso"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Impulso» es más leve y se puede aguantar, como Vera hacía otras veces, y la frase aclara que esta vez no pudo aguantarse."
        hint_specific: "Un impulso se puede aguantar. ¿Qué dice la frase sobre otras veces que Vera sintió esto?"
      - position: 3
        text: "arrebato"
        is_correct: true
  - position: 3
    sentence: "«¿Por qué se lo dijiste justo delante de todos?», le preguntó su amigo a Abel después de que le confesara a Fabiola que le gustaba. «No lo sé, fue un {{blank}}», respondió, todavía sorprendido de sí mismo."
    hint_general: "Piensa en lo que explica que alguien diga algo sin haberlo planeado y se sorprenda de sí mismo."
    explanation: "Arrebato: ni él mismo esperaba decirlo. «Berrinche» es una rabieta infantil por enojo, y aquí no hay ningún enojo, solo sorpresa por lo que dijo; «enfado» también es solo enojo, y lo que sintió Abel fue cariño, no rabia."
    options:
      - position: 1
        text: "berrinche"
        is_correct: false
        distractor_type: "register"
        why_not: "«Berrinche» es una rabieta infantil por enojo, y aquí lo que hubo fue una confesión de cariño, sin ninguna rabia."
        hint_specific: "Un berrinche es una rabieta de enojo. ¿Abel está enojado con alguien?"
      - position: 2
        text: "enfado"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Enfado» es solo enojo, y lo que sintió Abel antes de hablar fue cariño, no rabia."
        hint_specific: "El enfado es solo enojo. ¿Qué siente Abel por Fabiola?"
      - position: 3
        text: "arrebato"
        is_correct: true
  - position: 4
    sentence: "Jimena volvió a subir al escenario del karaoke solo para decirle a Tobías, frente a todos, que le encantaba cómo cantaba: aquello fue {{blank}}, y a los dos segundos se moría de vergüenza de lo que acababa de hacer."
    hint_general: "Piensa en algo que se hace de golpe y que después sorprende a quien lo hizo."
    explanation: "Arrebato: algo que se hace de golpe y sorprende a quien lo hizo. «Decisión» implica pensarlo antes, y aquí ella misma se sorprende de lo que hizo; «locura» describe algo realmente arriesgado, y decirle un cumplido a alguien en un karaoke no lo es."
    options:
      - position: 1
        text: "decisión"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Decisión» implica pensarlo antes, y aquí Jimena se sorprende de lo que acaba de hacer, señal de que no lo pensó."
        hint_specific: "Una decisión no sorprende a quien la toma. ¿Jimena se sorprende de lo que hizo?"
      - position: 2
        text: "arrebato"
        is_correct: true
      - position: 3
        text: "locura"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Locura» describe algo realmente arriesgado, y decirle un cumplido en un karaoke no pone nada en juego."
        hint_specific: "La locura implica un riesgo grande. ¿Qué arriesga Jimena al decir eso?"
  - position: 5
    sentence: "Herminia le mandó un audio de dos minutos contándole con detalle todo lo que le gustaba de él: fue {{blank}}, y después se arrepintió de haber hablado tanto."
    hint_general: "Busca la palabra para un impulso que se sale de control y que después se lamenta."
    explanation: "Arrebato: un impulso que se sale de control y después se lamenta. «Efusión» es un estilo cálido y expresivo que no se suele lamentar; «explosión» sugiere algo violento o muy intenso, y un audio cariñoso de dos minutos no lo es."
    options:
      - position: 1
        text: "efusión"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Efusión» es un estilo cálido de expresarse que la gente no suele lamentar, y aquí Herminia se arrepiente de haber hablado tanto."
        hint_specific: "La efusión no suele arrepentir a nadie. ¿Qué sintió Herminia después del audio?"
      - position: 2
        text: "arrebato"
        is_correct: true
      - position: 3
        text: "explosión"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Explosión» sugiere algo violento o muy intenso, y un audio cariñoso de dos minutos no tiene esa fuerza."
        hint_specific: "Una explosión es intensa y fuerte. ¿Qué tan fuerte fue este audio, según la frase?"
  - position: 6
    sentence: "A Baltasar le dio un {{blank}} de esos que no se explican, y le escribió al chico que conoció en la fiesta apenas veinte minutos después de despedirse."
    hint_general: "Piensa en un impulso inexplicable que lleva a actuar después de que ya pasó el momento."
    explanation: "Arrebato: un impulso inexplicable que lo hizo actuar después del momento. «Chispazo» es un destello que ocurre durante la charla misma, no una acción veinte minutos después; «capricho» tiene un motivo claro, aunque sea trivial, y aquí Baltasar no puede explicarlo."
    options:
      - position: 1
        text: "chispazo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Chispazo» describe un destello que pasa durante la charla misma, y aquí la acción llegó veinte minutos después de despedirse."
        hint_specific: "El chispazo ocurre en el momento. ¿Cuándo le escribió Baltasar, según la frase?"
      - position: 2
        text: "arrebato"
        is_correct: true
      - position: 3
        text: "capricho"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Un «capricho» tiene un motivo claro, aunque sea pequeño, y la frase dice que ni él mismo puede explicar por qué lo hizo."
        hint_specific: "El capricho se explica fácil. ¿Baltasar puede explicar por qué lo hizo?"
  - position: 7
    sentence: "Rosario había sentido antes las ganas de acercarse, pero siempre las dejaba pasar; esa noche, sin poder contenerse, cruzó todo el bar a los gritos para decirle que le encantaba su forma de contar historias: puro {{blank}}."
    hint_general: "Se trata de un impulso tan fuerte que no se puede contener, distinto a las ganas que antes siempre dejaba pasar."
    explanation: "Arrebato: un impulso tan fuerte que no se pudo contener, distinto a las ganas que solía dejar pasar. «Impulso» es más leve y se puede resistir, como ella hacía antes; «enfado» es solo enojo, y aquí lo que sintió fue admiración, no rabia."
    options:
      - position: 1
        text: "impulso"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Impulso» es más leve y se puede resistir, como Rosario hacía antes, y la frase aclara que esta vez no pudo contenerse."
        hint_specific: "Un impulso se puede resistir. ¿Qué dice la frase sobre las veces anteriores de Rosario?"
      - position: 2
        text: "arrebato"
        is_correct: true
      - position: 3
        text: "enfado"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Enfado» es solo enojo, y lo que sintió Rosario por esa forma de contar historias fue admiración, no rabia."
        hint_specific: "El enfado es enojo. ¿Rosario está enojada con esa persona?"
  - position: 8
    sentence: "Al colgar, Ulises se dio cuenta de que llamarla a las dos de la mañana solo para decirle que la extrañaba había sido {{blank}}: no lo dudó ni un segundo antes de marcar."
    hint_general: "Piensa en algo que se hace sin dudarlo ni un segundo antes de actuar."
    explanation: "Arrebato: no lo dudó ni un segundo antes de actuar. «Decisión» implica pensarlo bien, y aquí no hubo ni un segundo de duda; «locura» exagera el riesgo de una llamada cariñosa a las dos de la mañana."
    options:
      - position: 1
        text: "decisión"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Decisión» implica pensarlo bien antes, y la frase dice que Ulises no lo dudó ni un segundo."
        hint_specific: "Una decisión se piensa. ¿Cuánto lo dudó Ulises antes de llamar?"
      - position: 2
        text: "arrebato"
        is_correct: true
      - position: 3
        text: "locura"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Locura» exagera el riesgo de una llamada cariñosa, que no pone nada en juego de verdad."
        hint_specific: "La locura implica un riesgo serio. ¿Qué arriesga Ulises con esa llamada?"
readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "La confesión en la fiesta"
    body: "En medio de la fiesta de cumpleaños de un amigo en común, Marina se acercó a Facundo y le dijo, sin que nadie se lo preguntara, que llevaba toda la noche buscando una excusa para hablarle. Él se quedó callado un segundo y después se rio. «Qué arrebato tan bonito», le dijo, y le pidió el número antes de que ella se arrepintiera."
    before_phrase: "Se lo dije de golpe, sin pensarlo."
    after_phrase: "Qué arrebato tan bonito."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La llamada de medianoche"
    body: "Adriana le contó a su hermana que había llamado a alguien a la una de la mañana solo para decirle que pensaba en él. «Fue un arrebato total», admitió, todavía nerviosa. Su hermana se rio: «Los arrebatos así son los que se recuerdan; no todo tiene que estar calculado»."
    before_phrase: "Lo llamé de repente, sin pensarlo dos veces."
    after_phrase: "Fue un arrebato total, y no me arrepiento."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El comentario del pasillo"
    body: "Damián le contó a su compañero de oficina que, al cruzarse con alguien en el ascensor, le había dicho de pronto que le encantaba su risa. «Fue un arrebato, ni yo sé de dónde salió», le explicó, todavía sorprendido de sí mismo. Su compañero solo levantó las cejas y sonrió."
    before_phrase: "Se lo dije sin querer, me salió solo."
    after_phrase: "Fue un arrebato; ni yo sé de dónde salió."
