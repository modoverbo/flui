  funcion: ["describir impulso"]
  canal: "ambos"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "arrebol"
    difference: "El arrebol es el color rojizo que toma el cielo al amanecer o atardecer; el arrebato es un impulso emocional repentino."
    memory_trick: "El arrebol tiñe el cielo; el arrebato enciende el pecho."
replaces:
  - before: "Le dio por escribirle sin pensarlo"
    after: "Tuvo un arrebato y le escribió"
  - before: "De repente hizo algo sin planearlo, movido por la emoción"
    after: "Tuvo un arrebato y actuó sin planearlo"
