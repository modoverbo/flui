  - "ciar"
stressed_syllable: 3
ipa_latam: "[pro.piˈsjaɾ]"
ipa_es: "[pro.piˈθjaɾ]"
explanation: "Poner las cosas de modo que algo pueda pasar, sin obligar a nadie."
example_sentence: "Cambiamos las mesas de sitio para propiciar que la gente hablara entre sí."
register: "neutral"
pedantry_risk: 2
usage_tip: "Es la palabra para cuando armas el escenario y dejas que los demás decidan: se nota menos y funciona más."
when_not_to_use: "No la uses si empujaste el resultado tú mismo; esto describe crear la ocasión, no provocarla."
collocations:
  - "propiciar un encuentro"
  - "propiciar el diálogo"
  - "propiciar un clima de confianza"
replaces:
  - before: "Hice que se conocieran, como quien no quiere la cosa"
    after: "Propicié que se conocieran"
  - before: "Puse las condiciones para que hablaran"
    after: "Propicié que hablaran"
  - before: "Buscamos que el ambiente ayudara"
    after: "Quisimos propiciar un buen ambiente"
family:
  - "propicio"
themes:
  - slug: "networking"
    relevance: 3
  - slug: "liderazgo-feedback"
    relevance: 2
tags:
  comodin:
    - "hacer que pase"
  funcion:
    - "precisar"
  canal: "ambos"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "propinar"
    difference: "«Propinar» se usa para golpes o reproches que alguien descarga; lo otro crea la ocasión de que algo bueno ocurra."
    memory_trick: "Se propina un golpe; se propicia un encuentro."
  - confused_with: "provocar"
    difference: "«Provocar» empuja el resultado directamente; esta palabra solo prepara las condiciones."
    memory_trick: "Provocas el choque; propicias la ocasión."
exercises:
  - position: 1
    sentence: "Al cambiar las mesas largas por mesas de cuatro, la organizadora {{blank}} que la gente se hablara sin que nadie lo pidiera."
    hint_general: "Preparó las condiciones y dejó que el resto pasara solo."
    explanation: "Propició: preparó las condiciones y dejó que pasara. «Propinó» se usa para golpes o reproches, y «obligó» diría que no hubo elección."
    options:
      - position: 1
        text: "propinó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Propinó» se usa para golpes o reproches que alguien descarga, y aquí solo se cambiaron unas mesas."
        hint_specific: "«Propinó» acompaña a golpes y broncas. ¿Alguien recibe un golpe en esta escena?"
      - position: 2
        text: "propició"
        is_correct: true
      - position: 3
        text: "obligó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Obligó» diría que la gente no tuvo elección, y la frase subraya que nadie pidió nada."
        hint_specific: "«Obligó» quita la elección. Relee el final: ¿alguien pidió algo a la gente?"
  - position: 2
    sentence: "Poner el café antes de la sesión y no después {{blank}} conversaciones que luego se notaron en las preguntas."
    hint_general: "Un cambio pequeño abrió la puerta a algo que pasó solo."
    explanation: "Propició: un cambio pequeño abrió la puerta. «Orquestó» daría a entender que alguien lo dirigió todo, y «permitió» solo diría que no lo impidió."
    options:
      - position: 1
        text: "orquestó"
        is_correct: false
        distractor_type: "register"
        why_not: "«Orquestó» es palabra de gran escenario y pinta a alguien dirigiéndolo todo, y aquí solo se movió el café de hora."
        hint_specific: "«Orquestó» suena a dirección grandiosa. ¿Alguien dirigió esas conversaciones?"
      - position: 2
        text: "propició"
        is_correct: true
      - position: 3
        text: "permitió"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Permitió» dice que no se prohibió, y aquí alguien movió una hora a conciencia para que pasara."
        hint_specific: "«Permitió» es no poner trabas. ¿Hubo un cambio hecho a conciencia o solo ausencia de trabas?"
  - position: 3
    sentence: "Sentar juntos a los dos equipos {{blank}} un acuerdo que llevaba meses parado en el correo."
    hint_general: "Un gesto sencillo creó la ocasión de cerrar algo parado."
    explanation: "Propició: el gesto creó la ocasión del acuerdo. «Propagó» sería extender algo, y «provocó» diría que alguien empujó el resultado."
    options:
      - position: 1
        text: "propició"
        is_correct: true
      - position: 2
        text: "propagó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Propagó» es extender algo hasta que llega a mucha gente, y aquí lo que pasa es que se cierra un acuerdo."
        hint_specific: "«Propagó» va de extenderse. ¿El acuerdo se extendió o se cerró?"
      - position: 3
        text: "provocó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Provocó» diría que alguien empujó el resultado, y la frase cuenta que se limitaron a sentarlos juntos."
        hint_specific: "«Provocó» empuja el resultado. ¿Alguien empujó o solo creó la ocasión?"
  - position: 4
    sentence: "Nerea cuida que en cada reunión hable primero quien menos cargo tiene: así {{blank}} que se digan cosas incómodas a tiempo."
    hint_general: "Ordena el turno de palabra y con eso abre la puerta a la franqueza."
    explanation: "Propicia: ordena el turno y abre la puerta. «Monta» es de charla informal y suena a preparar un montaje, y «exige» quitaría la libertad de callarse."
    options:
      - position: 1
        text: "monta"
        is_correct: false
        distractor_type: "register"
        why_not: "«Monta» es de conversación muy suelta y sugiere preparar un montaje; aquí solo se ordena el turno de palabra."
        hint_specific: "«Monta» suena a armar algo artificial, en tono informal. ¿Nerea arma un montaje o abre espacio?"
      - position: 2
        text: "propicia"
        is_correct: true
      - position: 3
        text: "exige"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Exige» obliga a hablar, y la frase deja que cada persona decida qué dice y qué calla."
        hint_specific: "«Exige» no deja opción. ¿Alguien está obligado a hablar en esas reuniones?"
  - position: 5
    sentence: "La feria del pueblo {{blank}} encuentros que ningún correo habría conseguido en un año entero."
    hint_general: "El sitio y el momento hicieron posible lo que un mensaje no logra."
    explanation: "Propició: el sitio hizo posibles esos encuentros. «Propinó» se usa para golpes, y «organizó» diría que alguien los citó uno a uno."
    options:
      - position: 1
        text: "organizó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Organizó» supone que alguien citó a cada persona, y lo que hubo fue una feria donde la gente coincidió."
        hint_specific: "«Organizó» implica una lista de citas. ¿Alguien citó a esas personas una por una?"
      - position: 2
        text: "propinó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Propinó» acompaña a golpes y castigos, y en una feria lo que ocurre es que la gente se encuentra."
        hint_specific: "«Propinó» va con golpes. ¿Qué reparte una feria de pueblo?"
      - position: 3
        text: "propició"
        is_correct: true
  - position: 6
    sentence: "Contar primero un fallo suyo {{blank}} que los demás soltaran los suyos y la reunión dejara de ser un desfile."
    hint_general: "Al abrirse primero, deja espacio para que los otros se abran."
    explanation: "Propició: al abrirse primero dejó espacio. «Orquestó» pintaría una puesta en escena dirigida, y «buscó» solo contaría la intención."
    options:
      - position: 1
        text: "propició"
        is_correct: true
      - position: 2
        text: "orquestó"
        is_correct: false
        distractor_type: "register"
        why_not: "«Orquestó» es palabra de puesta en escena y da a entender que todo estaba dirigido de antemano."
        hint_specific: "«Orquestó» sugiere una dirección estudiada. ¿Los demás hablan por guion o por confianza?"
      - position: 3
        text: "buscó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Buscó» se queda en la intención, y la frase cuenta que los demás efectivamente hablaron."
        hint_specific: "«Buscó» no dice si salió. ¿La frase cuenta la intención o el resultado?"
  - position: 7
    sentence: "Llevar a mi padre a la peluquería de siempre {{blank}} que volviera a ver a dos amigos del barrio."
    hint_general: "El lugar de siempre abrió la puerta a un reencuentro."
    explanation: "Propició: el lugar abrió la puerta al reencuentro. «Propagó» sería extender algo, y «provocó» diría que alguien forzó ese encuentro."
    options:
      - position: 1
        text: "provocó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Provocó» diría que alguien empujó ese reencuentro, y la frase cuenta que ocurrió al ir al sitio de siempre."
        hint_specific: "«Provocó» empuja el resultado. ¿Alguien planeó ese reencuentro?"
      - position: 2
        text: "propició"
        is_correct: true
      - position: 3
        text: "propagó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Propagó» es hacer que algo se extienda a mucha gente, y aquí se reencuentran tres personas conocidas."
        hint_specific: "«Propagó» va de extenderse a muchos. ¿Cuánta gente hay en esa peluquería?"
  - position: 8
    sentence: "Dejar dos sillas libres en cada mesa {{blank}} que los recién llegados se sentaran con alguien y no en un rincón."
    hint_general: "Guardar sitio hace posible que nadie acabe solo."
    explanation: "Propició: guardar sitio hizo posible que se sentaran acompañados. «Montó» es coloquial y suena a montaje preparado, y «obligó» quitaría la elección."
    options:
      - position: 1
        text: "obligó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Obligó» diría que no podían elegir, y dejar sillas libres no obliga a nadie a sentarse ahí."
        hint_specific: "«Obligó» quita la opción. ¿Una silla libre obliga a alguien?"
      - position: 2
        text: "montó"
        is_correct: false
        distractor_type: "register"
        why_not: "«Montó» es de charla informal y sugiere un montaje armado a propósito, y aquí solo se dejó sitio."
        hint_specific: "«Montó» suena a preparar un armazón, en tono suelto. ¿Se armó algo o se dejó espacio?"
      - position: 3
        text: "propició"
        is_correct: true
readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Mesas de cuatro"
    body: "El encuentro anterior había sido un desastre: mesas largas y nadie hablando. Zoe cambió una sola cosa. «Mesas de cuatro y el café antes, no después», dijo. «Con eso propiciamos que se hablen». Esta vez hubo que echar a la gente a las nueve."
    before_phrase: "A ver si esta vez la gente se habla."
    after_phrase: "Con esto propiciamos que se hablen."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "La peluquería de siempre"
    body: "Mi padre salía poco desde la mudanza. En vez de insistir, empecé a llevarlo a su peluquería de siempre los jueves. Al tercer jueves ya tenía con quién quedarse charlando. «No lo empujé», le conté a mi hermana, «solo lo propicié»."
    before_phrase: "Hice que volviera a verlos, más o menos."
    after_phrase: "No lo empujé: lo propicié."
  - position: 3
    scene: "entrevista"
    conversation_type: "practica"
    title: "Quien menos cargo tiene"
    body: "Le preguntaron a Nerea cómo conseguía que su equipo dijera lo incómodo. «Hablan en orden, del cargo más bajo al más alto», contestó. «Eso propicia que lo difícil salga a tiempo». Le pidieron que lo explicara dos veces."
    before_phrase: "Intento que se sientan cómodos para hablar."
    after_phrase: "Ese orden propicia que lo difícil salga a tiempo."
