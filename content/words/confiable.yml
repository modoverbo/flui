schema_version: 1
slug: "confiable"
status: "approved"
lemma: "confiable"
part_of_speech: "adjetivo"
syllables:
  - "con"
  - "fia"
  - "ble"
stressed_syllable: 2
ipa_latam: "[konˈfja.βle]"
ipa_es: "[konˈfja.βle]"
explanation: "Que cumple lo que promete, así que los demás pueden contar con esa persona sin dudar."
example_sentence: "Contraté a ese encargado porque me pareció una persona confiable, de las que cumplen lo que prometen."
register: "neutral"
pedantry_risk: 1
usage_tip: "Úsala para elogiar a una persona que cumple lo que promete, no para un producto o un dato."
when_not_to_use: "No la uses para hablar de un aparato o un servicio; para eso se usa «fiable»."
collocations:
  - "persona confiable"
  - "amigo confiable"
  - "ser confiable"
replaces:
  - before: "Es alguien con quien se puede contar"
    after: "Es una persona confiable"
  - before: "Cumple siempre lo que promete"
    after: "Es muy confiable"
family:
  - "confianza"
  - "confiar"
themes:
  - slug: "amistad"
    relevance: 3
tags:
  comodin:
    - "de fiar"
    - "buena persona"
  funcion:
    - "elogiar"
  canal: "ambos"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "fiable"
    difference: "«Fiable» se usa para cosas, datos o servicios que funcionan bien; «confiable» se usa para una persona en la que puedes apoyarte."
    memory_trick: "Lo fiable no falla; el confiable no te falla a ti."
  - confused_with: "creíble"
    difference: "«Creíble» dice que algo o alguien resulta fácil de creer en el momento; «confiable» dice que esa persona cumple con lo que promete a lo largo del tiempo."
    memory_trick: "Lo creíble convence una vez; lo confiable cumple siempre."
  - confused_with: "cercanía"
    difference: "«Cercanía» es que el trato se sienta cálido y natural, sin decir si esa persona cumple lo que promete; ser confiable es cumplir con lo que dices, más allá de si el trato es cercano."
    memory_trick: "La cercanía se siente en el trato; la confianza se gana con hechos."
  - confused_with: "complicidad"
    difference: "La «complicidad» es entenderse con alguien sin palabras, con gestos o miradas; ser confiable es que esa persona cumpla lo que promete, aunque no haya esa conexión especial."
    memory_trick: "La complicidad se nota en un gesto; la confianza se gana con hechos."
exercises:
  - position: 1
    sentence: "Marina le prestó las llaves de su casa a Diego sin dudarlo ni un segundo: sabe que es {{blank}}, siempre cumple lo que promete."
    hint_general: "Busca la palabra para alguien en quien se puede apoyar porque siempre cumple lo que dice."
    explanation: "Confiable: cumple siempre lo que promete. «Confiado» describe a quien confía fácilmente en otros, no a quien merece la confianza, y «sincero» solo dice que no miente."
    options:
      - position: 1
        text: "confiado"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Confiado» describe a quien confía fácilmente en los demás, no a quien merece la confianza de otros; aquí se habla de Diego."
        hint_specific: "«Confiado» describe a quien confía en otros. ¿La frase habla de Diego confiando, o de Marina confiando en él?"
      - position: 2
        text: "sincero"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sincero» dice que alguien no miente, pero no que cumpla lo que promete con el tiempo."
        hint_specific: "«Sincero» es sobre decir la verdad. ¿La frase habla de decir la verdad o de cumplir promesas?"
      - position: 3
        text: "confiable"
        is_correct: true
  - position: 2
    sentence: "Cuando Camila necesitó que alguien cuidara a su hijo un fin de semana entero, pensó primero en Tomás, porque es {{blank}}."
    hint_general: "Es la palabra para alguien que cumple, así que puedes apoyarte en él sin preocuparte."
    explanation: "Confiable: se puede apoyar en él sin preocuparse. «Solvente» se usa para temas de dinero, y «puntual» solo habla de llegar a tiempo, no de cumplir en general."
    options:
      - position: 1
        text: "solvente"
        is_correct: false
        distractor_type: "register"
        why_not: "«Solvente» se usa para hablar de dinero o finanzas; aquí se trata de confiar el cuidado de un hijo, no un tema económico."
        hint_specific: "«Solvente» es un término de dinero. ¿Cuidar a un hijo es un tema económico?"
      - position: 2
        text: "puntual"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Puntual» solo dice que llega a tiempo, y aquí lo que importa es que se puede contar con él en general."
        hint_specific: "«Puntual» solo habla de llegar a tiempo. ¿La frase pide solo eso, o algo más general?"
      - position: 3
        text: "confiable"
        is_correct: true
  - position: 3
    sentence: "En la carta de recomendación, su antigua jefa escribió que Valentina era una profesional {{blank}}, capaz de cumplir cada plazo sin supervisión."
    hint_general: "Busca la palabra formal para alguien que cumple siempre, sin que nadie tenga que vigilarla."
    explanation: "Confiable: cumple siempre, sin que nadie la vigile. «De fiar» es demasiado coloquial para una carta formal, y «creíble» solo dice que algo suena verosímil en el momento."
    options:
      - position: 1
        text: "de fiar"
        is_correct: false
        distractor_type: "register"
        why_not: "«De fiar» es una expresión coloquial; una carta de recomendación pide una palabra más formal."
        hint_specific: "Piensa en el tono de una carta formal. ¿«De fiar» encaja ahí?"
      - position: 2
        text: "creíble"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Creíble» dice que algo resulta fácil de creer en el momento, no que cumpla los plazos con el tiempo."
        hint_specific: "«Creíble» habla de algo que se cree en el momento. ¿La frase habla de un momento o de cumplir plazos con el tiempo?"
      - position: 3
        text: "confiable"
        is_correct: true
  - position: 4
    sentence: "El nuevo gerente eligió a Julio para manejar la caja del evento porque en cinco años nunca faltó un centavo: es un empleado {{blank}}."
    hint_general: "Es la palabra para alguien que demuestra, con hechos, que merece que dependan de él."
    explanation: "Confiable: demuestra con hechos que se puede confiar en él. «Confiado» describe a quien confía fácilmente, no a quien es digno de confianza, y «sincero» solo habla de no mentir."
    options:
      - position: 1
        text: "confiado"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Confiado» describiría a alguien que confía fácilmente, no a quien demuestra que se puede confiar en él con el dinero."
        hint_specific: "«Confiado» describe a quien confía en otros. ¿La frase habla de Julio confiando, o de que confían en Julio?"
      - position: 2
        text: "sincero"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sincero» dice que alguien no miente, pero no explica por qué nunca faltó dinero en cinco años."
        hint_specific: "«Sincero» es sobre decir la verdad. ¿Cinco años sin faltar un centavo hablan de decir la verdad o de cumplir?"
      - position: 3
        text: "confiable"
        is_correct: true
  - position: 5
    sentence: "Cuando Noelia promete ayudar con algo, lo hace sin que nadie tenga que recordárselo: sus amigos saben que es {{blank}}."
    hint_general: "Busca la palabra para quien cumple lo que promete, sin que haya que recordárselo."
    explanation: "Confiable: cumple lo que promete sin que haya que recordárselo. «Creíble» solo dice que algo suena verosímil en el momento, y «sincera» solo habla de no mentir."
    options:
      - position: 1
        text: "creíble"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Creíble» dice que algo suena verosímil en el momento en que se dice, no que la persona cumpla después, como muestra la frase."
        hint_specific: "«Creíble» habla del momento en que se dice algo. ¿La frase habla del momento o de lo que pasa después?"
      - position: 2
        text: "sincera"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sincera» dice que no miente, pero la frase habla de que cumple lo que promete, no solo de que diga la verdad."
        hint_specific: "«Sincera» es sobre decir la verdad. ¿La frase habla de decir la verdad o de cumplir promesas?"
      - position: 3
        text: "confiable"
        is_correct: true
  - position: 6
    sentence: "El equipo asignó el proyecto más delicado a Marcos porque, en diez años, jamás dejó a nadie esperando una respuesta: es el más {{blank}} del grupo."
    hint_general: "Es la palabra para quien, con los años, demuestra que se puede depender de él."
    explanation: "Confiable: demuestra con los años que se puede depender de él. «Puntual» solo habla de llegar a tiempo a citas, y «solvente» se usa para temas de dinero."
    options:
      - position: 1
        text: "puntual"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Puntual» solo dice que llega a tiempo a las citas, y la frase habla de su forma de trabajar en general durante diez años."
        hint_specific: "«Puntual» solo habla de horarios. ¿Diez años sin dejar a nadie esperando hablan solo de horarios?"
      - position: 2
        text: "solvente"
        is_correct: false
        distractor_type: "register"
        why_not: "«Solvente» se usa para temas de dinero, y aquí se está hablando de la manera de trabajar de Marcos, no de sus finanzas."
        hint_specific: "«Solvente» es un término de dinero. ¿La frase habla de finanzas?"
      - position: 3
        text: "confiable"
        is_correct: true
readings:
  - position: 1
    scene: "entrevista"
    conversation_type: "practica"
    title: "La pregunta sobre el equipo anterior"
    body: "El entrevistador le preguntó a Marcos por qué su antigua jefa le había delegado el manejo de la caja chica. «Porque en tres años nunca hubo un solo error», respondió. «Ella sabía que era confiable, y yo no quise decepcionarla»."
    before_phrase: "Soy alguien en quien se puede confiar."
    after_phrase: "Soy una persona confiable."
  - position: 2
    scene: "trabajo"
    conversation_type: "emocional"
    title: "La llave de repuesto"
    body: "Antes de irse de vacaciones, Elena le dejó la llave de su casa a su compañero Diego para que regara las plantas y recogiera el correo. Cuando volvió, todo estaba en orden, hasta una nota: «Todo bien por acá». Elena pensó que pocas personas son tan confiables como él."
    before_phrase: "Sé que puedo contar con él para lo que sea."
    after_phrase: "Es una persona muy confiable."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "El amigo que no falla"
    body: "Entre risas, Sofía les contaba a sus amigas que Iván era el único que siempre aparecía cuando alguien lo necesitaba, sin excusas ni retrasos. «Con los demás nunca se sabe», dijo, «pero con Iván, siempre se puede contar»."
    before_phrase: "Con él siempre se puede contar."
    after_phrase: "Es el amigo más confiable que tengo."
