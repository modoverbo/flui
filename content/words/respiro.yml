confusions:
  - confused_with: "suspiro"
    difference: "Un «suspiro» es el soplo que sueltas cuando algo te alivia o te pesa; la otra palabra es un rato entero de calma."
    memory_trick: "El suspiro dura un segundo; lo otro dura una tarde."
  - confused_with: "retiro"
    difference: "Un «retiro» es apartarse del mundo durante un tiempo largo; la otra palabra es una pausa corta sin irse a ninguna parte."
    memory_trick: "En el retiro te vas; en lo otro solo paras."
