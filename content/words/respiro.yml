readings:
  - position: 1
    scene: "familia"
    conversation_type: "emocional"
    title: "Tres fines de semana"
    body: "A Gaspar le pidieron ayuda para la tercera mudanza seguida. Estuvo a punto de decir que sí y luego se oyó a sí mismo suspirar. «Este no puedo; necesito un respiro». Su primo contestó con un audio de cuatro segundos: «Claro, hombre». Nadie se enfadó y el domingo durmió hasta las diez."
    before_phrase: "Es que estoy reventado, pero bueno, voy."
    after_phrase: "Este no puedo: necesito un respiro."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "La lluvia de octubre"
    body: "En el pueblo llevaban todo el verano hablando del agua. Cuando por fin llovió tres días seguidos, el vecino del huerto lo resumió en la puerta del bar: «Esto es un respiro, no la solución». Nadie discutió, pero esa tarde se quedaron todos mirando el cielo con mejor cara."
    before_phrase: "Menos mal que por fin ha caído algo."
    after_phrase: "Esto es un respiro, no la solución."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "Dos semanas y vuelvo"
    body: "Perla llevaba once meses sin una semana entera libre y empezaba a equivocarse en cosas tontas. Lo dijo así: «Pido un respiro de dos semanas y vuelvo». Su jefa movió una entrega y aceptó. Volvió el quince, con la cabeza clara y una lista de tres cosas que había que cambiar."
    before_phrase: "No sé si aguanto mucho más así."
    after_phrase: "Pido un respiro de dos semanas y vuelvo."
