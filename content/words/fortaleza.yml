readings:
  - position: 1
    scene: "entrevista"
    conversation_type: "practica"
    title: "Dos frases y un lío"
    body: "A Sonia le preguntaron por su mayor fortaleza y no dijo «trabajar en equipo». Dijo: «Ordenar un lío que ya empezó», y contó el mes en que se cayó un proveedor a tres semanas de la entrega. La entrevistadora dejó de mirar el papel y le preguntó cómo lo hizo."
    before_phrase: "Pues se me dan bien bastantes cosas, la verdad."
    after_phrase: "Mi mayor fortaleza es ordenar un lío que ya empezó."
  - position: 2
    scene: "trabajo"
    conversation_type: "practica"
    title: "El reparto de octubre"
    body: "En octubre el equipo repartió el trabajo de otra manera: cada uno apuntó dos fortalezas suyas en la pizarra y eligieron por ahí. Nadie acabó con lo mismo que el año anterior. Iris se quedó con la parte que exigía paciencia, y fue la única que no se quejó."
    before_phrase: "Que cada uno coja lo que se le dé bien."
    after_phrase: "Repartimos según las fortalezas de cada uno."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "Lo que dijo su hija"
    body: "Lola se quejaba en la cena de que no tenía nada que contar en una entrevista. Su hija, de quince años, lo dijo sin levantar la vista del plato: «Tu fortaleza es que la gente te cuenta cosas». Lola lo apuntó en el móvil y lo usó dos días después."
    before_phrase: "Yo es que no destaco en nada, hija."
    after_phrase: "Tu fortaleza es que la gente te cuenta cosas."
