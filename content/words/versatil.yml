    title: "Dos ejemplos, no una etiqueta"
    body: "Samuel podía decir que se adapta a todo, pero eligió probarlo. «Soy versátil, y lo digo con dos casos: llevé compras seis meses y monté el inventario del almacén después». Le preguntaron por el inventario durante diez minutos."
    before_phrase: "Yo hago un poco de todo, la verdad."
    after_phrase: "Soy versátil, y lo digo con dos casos."
