    scene: "familia"
    conversation_type: "social"
    title: "La mesa de la cocina"
    body: "En casa de mis padres hay una mesa plegable que ha visto de todo: comidas de doce, deberes, una máquina de coser y dos mudanzas. Mi madre la defiende siempre: «Es la más versátil que hemos tenido». Nadie se atreve a tirarla."
    before_phrase: "Esa mesa sirve para todo."
    after_phrase: "Es la más versátil que hemos tenido."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "Equipo de cuatro"
    body: "Con cuatro personas no se puede tener un especialista por área. Al abrir el puesto, Héctor lo escribió sin rodeos: «Buscamos un perfil versátil, no el mayor experto del mundo en una sola cosa». Llegaron el doble de solicitudes que otras veces."
    before_phrase: "Buscamos a alguien que sepa hacer de todo un poco."
    after_phrase: "Buscamos un perfil versátil."
