    difference: "«Acatar» es obedecer una orden aunque no te guste; lo otro es recoger una señal o atraer a alguien."
    memory_trick: "Acatas una orden; captas una indirecta."
  - confused_with: "adaptar"
    difference: "«Adaptar» es cambiar algo para que encaje; aquí nada cambia, solo se recoge lo que llega."
    memory_trick: "Adaptas lo que haces; captas lo que llega."
exercises:
  - position: 1
    sentence: "Con una sola frase bien puesta, Elvira {{blank}} a tres clientes que llevaban meses dudando."
    hint_general: "Consiguió atraer a gente que todavía no era suya."
    explanation: "Captó: atrajo a clientes que aún no eran suyos. «Acató» sería obedecer una orden, y «retuvo» diría que ya los tenía y evitó que se fueran."
    options:
      - position: 1
        text: "acató"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Acató» es obedecer una orden de alguien con más mando, y aquí nadie da órdenes: se atrae a clientes."
        hint_specific: "«Acató» va de obedecer. ¿Elvira obedece a alguien o consigue clientes?"
      - position: 2
        text: "captó"
        is_correct: true
      - position: 3
        text: "retuvo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Retuvo» se dice de quien ya tenía a esos clientes y evitó que se marcharan, y aquí llegaron por primera vez."
        hint_specific: "«Retuvo» supone que ya eran suyos. ¿Esos tres clientes venían de antes?"
  - position: 2
    sentence: "Nadie se lo explicó, pero Fermín {{blank}} el mensaje solo por el tono con que arrancó la reunión."
    hint_general: "Entendió lo que nadie dijo con palabras, por cómo sonaba todo."
    explanation: "Captó: entendió el mensaje por el tono. «Cazó» es de charla informal y suena a perseguir una presa, y «adaptó» diría que cambió el mensaje para que encajara."
    options:
      - position: 1
        text: "cazó"
        is_correct: false
        distractor_type: "register"
        why_not: "«Cazó» es de conversación muy suelta y pinta una persecución; aquí el mensaje llega solo, por el tono."
        hint_specific: "«Cazó» suena a salir a perseguir algo. ¿Fermín persiguió el mensaje o le llegó?"
      - position: 2
        text: "adaptó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Adaptó» sería cambiar el mensaje para que encajara en otro sitio, y él solo se dio cuenta de lo que había."
        hint_specific: "«Adaptó» es modificar algo. ¿Fermín cambió el mensaje o lo entendió?"
      - position: 3
        text: "captó"
        is_correct: true
  - position: 3
    sentence: "La campaña del mercado de barrio {{blank}} a doscientos socios nuevos en un mes, más que todo el año anterior."
    hint_general: "Atrajo gente nueva hacia el proyecto en poco tiempo."
    explanation: "Captó: atrajo socios nuevos. «Acató» sería obedecer una norma, y «buscó» diría que salió a intentarlo, sin contar si lo consiguió."
    options:
      - position: 1
        text: "captó"
        is_correct: true
      - position: 2
        text: "acató"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Acató» es obedecer lo que otro manda, y una campaña no obedece: consigue gente."
        hint_specific: "«Acató» es cumplir una orden. ¿La campaña obedece o atrae?"
      - position: 3
        text: "buscó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Buscó» dice que salió a intentarlo y no dice si llegaron, y la frase cuenta que fueron doscientos."
        hint_specific: "«Buscó» no promete resultado. ¿La frase cuenta el intento o el resultado?"
  - position: 4
    sentence: "En mitad de la charla, Dalia {{blank}} una idea suelta de la última fila y la anotó antes de que se le fuera."
    hint_general: "Recogió al vuelo algo que alguien dijo de pasada."
    explanation: "Captó: recogió al vuelo una idea que pasaba. «Pescó» es coloquial y suena a golpe de suerte, y «acumuló» diría que juntó muchas."
    options:
      - position: 1
        text: "pescó"
        is_correct: false
        distractor_type: "register"
        why_not: "«Pescó» es de charla informal y sugiere un golpe de suerte; aquí ella estaba atenta y anotó enseguida."
        hint_specific: "«Pescó» suena a suerte de conversación suelta. ¿Fue casualidad o estaba atenta?"
      - position: 2
        text: "acumuló"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Acumuló» dice que juntó muchas cosas, y la frase habla de una sola idea anotada al vuelo."
        hint_specific: "«Acumuló» habla de juntar mucho. ¿Cuántas ideas anotó Dalia?"
      - position: 3
        text: "captó"
        is_correct: true
  - position: 5
    sentence: "Rodrigo {{blank}} enseguida la intención del comentario y respondió con una broma para bajar la tensión."
    hint_general: "Se dio cuenta de lo que había detrás de una frase y actuó."
    explanation: "Captó: entendió lo que había detrás del comentario. «Adaptó» sería cambiar la intención ajena, que no se puede, y «retuvo» diría que se la guardó sin responder."
    options:
      - position: 1
        text: "adaptó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Adaptó» es modificar algo para que encaje, y la intención del otro no se modifica: se entiende o no."
        hint_specific: "«Adaptó» es cambiar algo. ¿Rodrigo cambió la intención ajena o la entendió?"
      - position: 2
        text: "captó"
        is_correct: true
      - position: 3
        text: "retuvo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Retuvo» diría que se la guardó para sí, y él responde en el momento con una broma."
        hint_specific: "«Retuvo» es guardarse algo. ¿Rodrigo se calló o contestó?"
  - position: 6
    sentence: "La tienda de la esquina {{blank}} a la clientela del barrio con un cartel escrito a mano y café gratis los lunes."
    hint_general: "Atrajo a la gente del barrio con dos gestos pequeños."
    explanation: "Captó: atrajo a la gente del barrio. «Cazó» es coloquial y trata a las personas como presas, y «buscó» solo diría que lo intentó."
    options:
      - position: 1
        text: "buscó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Buscó» cuenta el intento y no el resultado, y la frase dice que la gente acabó entrando."
        hint_specific: "«Buscó» se queda en intentarlo. ¿La tienda lo intentó o lo consiguió?"
      - position: 2
        text: "captó"
        is_correct: true
      - position: 3
        text: "cazó"
        is_correct: false
        distractor_type: "register"
        why_not: "«Cazó» es lenguaje muy informal y convierte a los vecinos en presas; aquí llegaron por gusto."
        hint_specific: "«Cazó» trata a la gente como presa. ¿Los vecinos entran obligados o por gusto?"
  - position: 7
    sentence: "Nadie se lo contó, pero Valentina {{blank}} el ambiente del equipo en su primera semana y supo con quién hablar."
    hint_general: "Leyó cómo estaba el grupo sin que nadie se lo explicara."
    explanation: "Captó: leyó el ambiente sin que se lo contaran. «Adaptó» sería cambiar ese ambiente, y «acumuló» hablaría de juntar cosas."
    options:
      - position: 1
        text: "acumuló"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Acumuló» es ir juntando cosas una tras otra, y aquí se entiende una situación completa de golpe."
        hint_specific: "«Acumuló» es ir amontonando. ¿Valentina juntó cosas o entendió una situación?"
      - position: 2
        text: "adaptó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Adaptó» sería cambiar el ambiente del equipo, y en su primera semana ella solo lo entendió."
        hint_specific: "«Adaptó» es modificar algo. ¿Cambió el ambiente o lo leyó?"
      - position: 3
        text: "captó"
        is_correct: true
  - position: 8
    sentence: "Le dije tres veces que estaba cansada y mi cuñado no {{blank}} ninguna: siguió proponiendo planes para el domingo."
    hint_general: "No recogió una señal que se repitió tres veces."
    explanation: "Captó: no recogió la señal repetida. «Pescó» es coloquial y suena a suerte, y «acató» sería desobedecer una orden, que nadie dio."
    options:
      - position: 1
        text: "captó"
        is_correct: true
      - position: 2
        text: "pescó"
        is_correct: false
        distractor_type: "register"
        why_not: "«Pescó» es de conversación muy suelta y sugiere dar con algo por suerte, y aquí la señal se repitió tres veces."
        hint_specific: "«Pescó» suena a golpe de suerte informal. ¿Hacía falta suerte con tres avisos?"
      - position: 3
        text: "acató"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Acató» sería cumplir una orden, y decir que estás cansada no es dar una orden a nadie."
        hint_specific: "«Acató» es obedecer. ¿Hubo una orden en esa conversación?"
readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "El cartel escrito a mano"
    body: "La tienda llevaba meses vacía. Nadia cambió el cartel luminoso por uno escrito a mano y puso café los lunes. «No hace falta gritar para captar gente», dijo cuando le preguntamos. En dos meses los lunes eran el mejor día."
    before_phrase: "A ver si conseguimos más gente."
    after_phrase: "No hace falta gritar para captar gente."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Tres veces"
    body: "Le dije tres veces que estaba cansada y mi cuñado siguió proponiendo planes. Al cuarto intento se lo dije de frente: «No captaste ninguna de las tres». Se quedó callado y luego se rio. El domingo lo pasamos en casa."
    before_phrase: "No pillaste nada de lo que te dije."
    after_phrase: "No captaste ninguna de las tres."
  - position: 3
    scene: "entrevista"
    conversation_type: "social"
    title: "La primera semana"
    body: "Le preguntaron a Valentina qué haría en su primera semana. No prometió resultados. «Escuchar y captar cómo funciona el equipo de verdad», contestó. «Lo demás lo propongo la segunda». La contrataron por esa respuesta."
    before_phrase: "Me iría enterando de cómo va todo."
    after_phrase: "Quiero captar cómo funciona el equipo."
