confusions:
  - confused_with: "exhibir"
    difference: "«Exhibir» es mostrar algo a la vista de todos; la otra palabra hace lo contrario: lo retiene antes de que salga."
    memory_trick: "Exhibir saca; lo otro guarda."
  - confused_with: "prohibir"
    difference: "«Prohibir» es negar el permiso con una orden; la otra palabra no ordena nada: frena por el ambiente o por decisión propia."
    memory_trick: "Prohibir manda; lo otro frena sin orden."
