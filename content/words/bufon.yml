readings:
  - position: 1
    scene: "familia"
    conversation_type: "emocional"
    title: "El primo de los tropiezos"
    body: "Nico tiene seis años y ya sabe cuándo caerse «sin querer» para hacer reír a los mayores. En la última comida familiar, se tropezó con una silla vacía tres veces seguidas, cada una más exagerada que la anterior. «Este niño ya es el bufón de la familia», dijo su abuela, limpiándose las lágrimas de tanto reír."
    before_phrase: "Se hace el tonto a propósito para que nos riamos."
    after_phrase: "Ya es el bufón de la familia."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "El brindis que no fue serio"
    body: "Martín subió al escenario con una hoja de papel y una cara muy solemne. Empezó a leer un discurso sobre el amor eterno, tropezándose con cada palabra difícil a propósito. La sala entera se reía cuando terminó con una reverencia exagerada. «Gracias por hacer de bufón en mi boda», le dijo su hermana, abrazándolo."
    before_phrase: "Hizo el tonto a propósito en el brindis y todos se rieron con él."
    after_phrase: "Hizo de bufón en el brindis, y todos se rieron con él."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El chiste justo a tiempo"
    body: "La reunión llevaba cuarenta minutos y nadie decía nada. Rosendo levantó la mano: «Perdón, ¿esto es una reunión o un concurso de silencio?». Todos se rieron, incluido su jefe, y la conversación volvió a fluir. «Gracias por hacer de bufón», le dijo después una compañera. «Alguien tenía que romper el hielo»."
    before_phrase: "Solté un chiste malo para romper el hielo en la reunión."
    after_phrase: "Hice de bufón para romper el hielo en la reunión."
