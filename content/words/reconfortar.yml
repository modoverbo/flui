schema_version: 1
slug: "reconfortar"
status: "draft"
lemma: "reconfortar"
part_of_speech: "verbo"
syllables: ["re", "con", "for", "tar"]
stressed_syllable: 4
ipa_latam: "[re.kon.foɾˈtaɾ]"
ipa_es: "[re.kon.foɾˈtaɾ]"
explanation: "Dar calma o apoyo a alguien que está pasando un mal momento, con palabras o con presencia."
example_sentence: "No hizo falta que dijera una palabra: su sola presencia ya reconfortaba a quien estuviera cerca."
register: "neutral"
pedantry_risk: 1
usage_tip: "Úsalo para un gesto o unas palabras que alivian a alguien triste, sin necesidad de resolverle el problema."
when_not_to_use: "No lo uses para dar un consejo práctico o una solución: reconfortar es acompañar, no resolver."
collocations:
  - "reconfortar a alguien"
  - "unas palabras que reconfortan"
  - "su presencia reconforta"
family: []
themes:
  - slug: "empatia-escucha"
    relevance: 3
tags:
  comodin: ["dar ánimo", "acompañar en un mal momento"]
  funcion: ["consolar"]
  canal: "ambos"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "aliviar"
    difference: "Aliviar se usa más para un dolor físico o un síntoma concreto; reconfortar es dar calma o apoyo emocional con palabras o presencia."
    memory_trick: "Alivias un dolor de cabeza; reconfortas a una persona triste."
replaces:
  - before: "Le dio apoyo sin decir mucho, solo con estar ahí"
    after: "Lo reconfortó sin decir mucho, solo con estar ahí"
  - before: "Esas palabras le dieron calma en un momento difícil"
    after: "Esas palabras la reconfortaron en un momento difícil"
exercises:
  - position: 1
    sentence: "Sin decir mucho, Pablo se sentó al lado de su amigo, y eso solo ya pareció {{blank}}."
    hint_general: "Dar calma o apoyo a alguien que está pasando un mal momento."
    explanation: "Reconfortarlo: darle calma o apoyo en un mal momento. «Aliviarlo» se usa más para un dolor físico, y «distraerlo» implica apartar la atención del problema, no acompañarlo con calma."
    options:
      - position: 1
        text: "reconfortarlo"
        is_correct: true
      - position: 2
        text: "aliviarlo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Aliviar» se usa más para un dolor físico o un síntoma concreto, y aquí Pablo solo acompaña a su amigo en silencio."
        hint_specific: "Aliviar se usa para un dolor concreto. ¿La frase habla de un dolor físico o de compañía?"
      - position: 3
        text: "distraerlo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Distraer» implica apartar la atención del problema, y aquí Pablo solo está presente, sin buscar cambiar de tema."
        hint_specific: "Distraer cambia el foco de atención. ¿Pablo cambia el tema o solo está presente?"
  - position: 2
    sentence: "Las palabras de su hermana lograron {{blank}} a Camila, aunque el problema seguía sin resolverse."
    hint_general: "Dar calma emocional a alguien, aunque el problema en sí no se solucione todavía."
    explanation: "Reconfortar: dar calma emocional a alguien, aunque el problema no se solucione. «Resolver» implicaría solucionar el problema, y «reconfrontar» implicaría enfrentamiento; ninguno describe esa calma."
    options:
      - position: 1
        text: "reconfortar"
        is_correct: true
      - position: 2
        text: "resolver"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Resolver» implicaría solucionar el problema en sí, y la frase dice que el problema seguía sin resolverse, aunque Camila se sintiera mejor."
        hint_specific: "Resolver soluciona el problema. ¿La frase dice que el problema se solucionó?"
      - position: 3
        text: "reconfrontar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Reconfrontar» implicaría volver a enfrentar algo con oposición, y aquí las palabras de su hermana solo daban calma, sin ningún enfrentamiento."
        hint_specific: "Reconfrontar implica enfrentamiento. ¿Las palabras de su hermana enfrentan algo o dan calma?"
  - position: 3
    sentence: "Después del accidente, el equipo médico se turnaba para {{blank}} a la familia en la sala de espera."
    hint_general: "Dar calma o compañía a alguien que está pasando por un momento muy difícil."
    explanation: "Reconfortar: dar calma o compañía en un momento difícil. «Operar» describe una intervención médica concreta, y «reconfrontar» implica enfrentamiento, sin relación con acompañar a una familia."
    options:
      - position: 1
        text: "reconfortar"
        is_correct: true
      - position: 2
        text: "operar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Operar» describe una intervención médica concreta, y la frase habla de acompañar a la familia en la sala de espera, no de un procedimiento."
        hint_specific: "Operar es un procedimiento médico. ¿El equipo opera a la familia o la acompaña?"
      - position: 3
        text: "reconfrontar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Reconfrontar» implicaría volver a enfrentar algo con oposición, y aquí el equipo solo acompaña a la familia con calma."
        hint_specific: "Reconfrontar implica enfrentamiento. ¿El equipo enfrenta a la familia o la acompaña?"
  - position: 4
    sentence: "Diego no sabía qué decir, pero se quedó al teléfono con su amigo para {{blank}}, aunque fuera en silencio."
    hint_general: "Dar apoyo emocional a alguien, aunque sea sin muchas palabras."
    explanation: "Reconfortarlo: darle apoyo emocional, aunque sea sin muchas palabras. «Sermonearlo» es coloquial y sugiere consejos no pedidos, y «reconfrontarlo» implica enfrentamiento; ninguno describe ese silencio."
    options:
      - position: 1
        text: "reconfortarlo"
        is_correct: true
      - position: 2
        text: "sermonearlo"
        is_correct: false
        distractor_type: "register"
        why_not: "«Sermonear» es coloquial y sugiere dar consejos no pedidos, y la frase dice que Diego solo se quedó en silencio, sin dar ningún consejo."
        hint_specific: "Sermonear implica dar consejos no pedidos. ¿Diego da consejos o solo acompaña en silencio?"
      - position: 3
        text: "reconfrontarlo"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Reconfrontar» implicaría volver a enfrentar algo con oposición, y Diego solo busca acompañar a su amigo con calma."
        hint_specific: "Reconfrontar implica enfrentamiento. ¿Diego enfrenta a su amigo o lo acompaña?"
  - position: 5
    sentence: "La canción que su madre le cantaba de chica todavía la {{blank}} en los días difíciles."
    hint_general: "Dar calma a alguien, incluso años después, con algo que asocia a un buen recuerdo."
    explanation: "Reconforta: da calma a alguien, incluso años después. «Aburre» describiría falta de interés, justo lo contrario, y «reconfronta» implicaría enfrentamiento, sin relación con una canción de la infancia."
    options:
      - position: 1
        text: "reconforta"
        is_correct: true
      - position: 2
        text: "aburre"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Aburrir» describiría falta de interés, y la frase dice que esa canción le da calma en los días difíciles, justo lo contrario."
        hint_specific: "Aburrir es falta de interés. ¿La canción aburre o da calma?"
      - position: 3
        text: "reconfronta"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Reconfrontar» implicaría volver a enfrentar algo con oposición, y aquí la canción solo trae calma, sin ningún enfrentamiento."
        hint_specific: "Reconfrontar implica enfrentamiento. ¿La canción enfrenta algo o da calma?"
  - position: 6
    sentence: "El entrenador se acercó al jugador que había fallado el penal, solo para {{blank}} antes de que empezara el próximo partido."
    hint_general: "Dar ánimo a alguien que pasó por un mal momento, antes de que siga con lo que tiene por delante."
    explanation: "Reconfortarlo: darle ánimo antes de que siga adelante. «Regañarlo» implicaría reprocharle el error, y «reconfrontarlo» implicaría enfrentamiento, ninguno describe acercarse a darle ánimo."
    options:
      - position: 1
        text: "reconfortarlo"
        is_correct: true
      - position: 2
        text: "regañarlo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Regañar» implicaría reprocharle el error, y la frase dice que el entrenador se acercó para darle ánimo, no para reprocharle nada."
        hint_specific: "Regañar es reprochar un error. ¿El entrenador reprocha o da ánimo?"
      - position: 3
        text: "reconfrontarlo"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Reconfrontar» implicaría volver a enfrentar algo con oposición, y el entrenador solo busca dar ánimo antes del próximo partido."
        hint_specific: "Reconfrontar implica enfrentamiento. ¿El entrenador enfrenta al jugador o lo anima?"
  - position: 7
    sentence: "Después de la mala noticia, sus amigas se turnaron para llamarla y {{blank}} durante toda la semana."
    hint_general: "Dar apoyo emocional a alguien durante un período difícil, de forma constante."
    explanation: "Reconfortarla: darle apoyo emocional de forma constante. «Presionarla» implicaría exigirle algo, justo lo contrario de acompañar con calma, y «reconfrontarla» implicaría enfrentamiento."
    options:
      - position: 1
        text: "reconfortarla"
        is_correct: true
      - position: 2
        text: "presionarla"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Presionar» implicaría exigirle algo, y sus amigas solo buscaban acompañarla con calma durante la semana difícil."
        hint_specific: "Presionar es exigir algo. ¿Sus amigas exigen algo o dan calma?"
      - position: 3
        text: "reconfrontarla"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Reconfrontar» implicaría volver a enfrentar algo con oposición, y sus amigas solo buscaban acompañarla con calma."
        hint_specific: "Reconfrontar implica enfrentamiento. ¿Sus amigas la enfrentan o la acompañan?"
  - position: 8
    sentence: "El mensaje de su viejo compañero de equipo la {{blank}} justo el día que más lo necesitaba."
    hint_general: "Dar calma a alguien en el momento exacto en que más lo necesita."
    explanation: "Reconfortó: dio calma en el momento exacto en que se necesitaba. «Sorprendió» describe otra reacción, sin implicar calma, y «reconfrontó» implicaría enfrentamiento, sin relación con un mensaje de apoyo."
    options:
      - position: 1
        text: "reconfortó"
        is_correct: true
      - position: 2
        text: "sorprendió"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sorprender» describe otra reacción, sin implicar calma, y la frase se enfoca en que el mensaje le dio apoyo justo cuando lo necesitaba."
        hint_specific: "Sorprender no implica calma. ¿El mensaje solo la sorprendió o también le dio apoyo?"
      - position: 3
        text: "reconfrontó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Reconfrontar» implicaría volver a enfrentar algo con oposición, y el mensaje de su compañero solo buscaba darle apoyo."
        hint_specific: "Reconfrontar implica enfrentamiento. ¿El mensaje la enfrenta a algo o le da apoyo?"
readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "El silencio que ayudó"
    body: "Pablo no encontraba las palabras justas, así que simplemente se sentó al lado de su amigo. Después de un rato, su amigo le dijo: «Gracias por reconfortarme, no necesitaba que dijeras nada». Se quedaron así un buen rato más."
    before_phrase: "Gracias por acompañarme, no necesitaba que dijeras nada."
    after_phrase: "Gracias por reconfortarme, no necesitaba que dijeras nada."
  - position: 2
    scene: "trabajo"
    conversation_type: "emocional"
    title: "El error del penal"
    body: "El entrenador se acercó al jugador que había fallado, sin decir nada sobre la jugada. «Vengo a reconfortarte, no a explicarte lo que ya sabes que hiciste mal», le dijo, y el jugador respiró más tranquilo antes de volver a la cancha."
    before_phrase: "Vengo a darte ánimo, no a explicarte lo que ya sabes."
    after_phrase: "Vengo a reconfortarte, no a explicarte lo que ya sabes."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "Las llamadas de toda la semana"
    body: "Después de la mala noticia, sus amigas se turnaban para llamarla cada noche. «Solo quiero reconfortarte, no necesito que me cuentes todo», le dijo una de ellas, y esa frase la ayudó más que cualquier consejo."
    before_phrase: "Solo quiero acompañarte, no necesito que me cuentes todo."
    after_phrase: "Solo quiero reconfortarte, no necesito que me cuentes todo."
