    title: "El audio de los viernes"
    body: "Mientras Iker estuvo de baja, el equipo le mandó un audio cada viernes con lo que había pasado. Nadie le pedía nada. Al volver lo dijo en la primera reunión: «Esos audios me reconfortaron; volví sabiendo que seguía siendo de aquí»."
    before_phrase: "Me vino muy bien tener noticias cada viernes."
    after_phrase: "Esos audios me reconfortaron de verdad."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "La mano encima"
    body: "En el grupo, Elsa casi no habla. Se sienta al lado de quien llega peor, escucha y pone la mano en el brazo. Alguien lo comentó al salir: «No aconseja, reconforta, y eso es más difícil». Todos asintieron."
    before_phrase: "No dice nada, pero se le agradece mucho."
    after_phrase: "No aconseja, reconforta, y eso es más difícil."
