    title: "Un plato caliente"
    body: "Vera llegó a casa después del peor día del año y su compañero de piso no preguntó nada. Puso sopa en la mesa y encendió la luz pequeña. «Esto me reconforta más que hablar», dijo ella. Cenaron sin decir casi nada."
