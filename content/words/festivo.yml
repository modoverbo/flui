readings:
  - position: 1
    scene: "familia"
    conversation_type: "emocional"
    title: "El almuerzo de los domingos"
    body: "La prima de Rodrigo llegó por primera vez a un almuerzo familiar, un poco nerviosa por no conocer a nadie. El tono festivo de la mesa —bromas, anécdotas, risas cruzadas— la hizo sentirse parte del grupo antes del postre. «Siempre es así», le explicó Rodrigo. «Nadie se lo toma tan en serio»."
    before_phrase: "Aquí nadie se pone serio, todo es en broma."
    after_phrase: "Aquí el tono siempre es festivo."
  - position: 2
    scene: "trabajo"
    conversation_type: "practica"
    title: "El cierre que nadie quería que terminara"
    body: "Fabián temía que el cierre del proyecto fuera aburrido, como los anteriores. Cambió el formato: menos diapositivas, más anécdotas del equipo. El tono festivo que logró hizo que el cierre se alargara media hora más de lo previsto, y varios pidieron repetir el formato en el siguiente trimestre."
    before_phrase: "Hicimos el cierre relajado, sin ponernos serios."
    after_phrase: "Hicimos el cierre con un tono festivo."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "El mensaje antes del vuelo"
    body: "El grupo del viaje estaba nervioso por la salida temprana. Luciana mandó un mensaje con un tono tan festivo —comparando la maleta de uno con una mudanza completa— que todos llegaron al aeropuerto riendo en vez de bostezando."
    before_phrase: "Mandé un mensaje relajado para bajar los nervios."
    after_phrase: "Mandé un mensaje con un tono festivo para bajar los nervios."
