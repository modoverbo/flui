confusions:
  - confused_with: "jocoso"
    difference: "«Jocoso» apunta directo a hacer bromas o chistes; «festivo» es más amplio: un tono alegre y ligero, con o sin chistes de por medio."
    memory_trick: "Lo jocoso siempre bromea; lo festivo solo aligera el ambiente."
  - confused_with: "feriado"
    difference: "«Feriado» es un día no laborable, un descanso marcado en el calendario; «festivo», en este sentido, describe el tono alegre de una charla, no una fecha."
    memory_trick: "El feriado se marca en el calendario; el tono festivo se nota en cómo hablas."
exercises:
  - position: 1
    sentence: "El correo que mandó Ester los viernes tenía un tono tan {{blank}} que hasta los clientes más serios respondían con algún emoji."
    hint_general: "Busca la palabra para un tono alegre y ligero, sin ponerse serio."
    explanation: "Festivo: el tono alegre del correo de Ester hacía responder hasta a los clientes más serios. «Efusivo» describe una emoción exagerada, y «extenso» solo habla de longitud, ninguna explica el tono del correo."
    options:
      - position: 1
        text: "efusivo"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Efusivo» describe una emoción exagerada o muy entusiasta, y el correo de Ester no exageraba nada: solo tenía un tono ligero y divertido."
        hint_specific: "«Efusivo» habla de mostrar mucho entusiasmo. ¿El correo exageraba emociones o solo sonaba ligero?"
      - position: 2
        text: "festivo"
        is_correct: true
      - position: 3
        text: "extenso"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Extenso» solo habla de longitud, y lo que hacía responder con emojis a los clientes era el tono del correo, no cuánto medía."
        hint_specific: "«Extenso» habla de longitud. ¿Los clientes respondían por el tamaño del correo o por su tono?"
