explanation: "Que tiene un estilo ligero e informal, sin buscar conflicto y sin darle mucha importancia a las cosas."
example_sentence: "El correo del viernes tenía un tono tan festivo que hasta el cliente más exigente respondió con un emoji de risa."
register: "neutral"
pedantry_risk: 1
usage_tip: "Describe el tono de una conversación, un mensaje o un evento; no lo confundas con «día festivo», que es un día no laborable."
when_not_to_use: "No la uses para un tema que pide seriedad real, como una mala noticia; ahí un tono festivo suena fuera de lugar."
collocations:
