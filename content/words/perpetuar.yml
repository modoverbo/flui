confusions:
  - confused_with: "perpetrar"
    difference: "«Perpetrar» es llevar a cabo algo muy criticable en un momento concreto; la otra palabra hace que algo dure y se repita durante años."
    memory_trick: "Una ocurre una vez; la otra no termina nunca."
  - confused_with: "perturbar"
    difference: "«Perturbar» es alterar la calma de algo o de alguien; la otra palabra no altera nada: mantiene las cosas como están."
    memory_trick: "Perturbar mueve; lo otro congela."
