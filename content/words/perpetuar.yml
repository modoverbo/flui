readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "La reunión de los lunes"
    body: "Llevaban dos años con la misma reunión y el mismo punto sin resolver. Gloria lo dijo con calma: «Esta reunión no arregla nada, perpetúa el problema». La cambiaron por una nota escrita y un café mensual."
    before_phrase: "Esto no sirve, el problema sigue ahí siempre."
    after_phrase: "Esta reunión perpetúa el problema."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La placa del portal"
    body: "Al reformar la entrada, alguien propuso quitar la placa antigua. Su nieta pidió la palabra en la junta: «Esa placa perpetúa el nombre de quien empezó todo esto». La dejaron, limpia y en el mismo sitio."
    before_phrase: "Esa placa está ahí para que no se olvide."
    after_phrase: "Esa placa perpetúa el nombre de quien empezó todo."
  - position: 3
    scene: "entrevista"
    conversation_type: "practica"
    title: "Qué no vas a repetir"
    body: "Le preguntaron a Lucas qué clase de jefe quería ser. Respondió corto: «No quiero perpetuar el estilo de mando que me tocó de joven. Prefiero preguntar antes de decidir». Le pidieron un ejemplo y lo dio."
    before_phrase: "No quiero acabar mandando como mandaban conmigo."
    after_phrase: "No quiero perpetuar ese estilo de mando."
