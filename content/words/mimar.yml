readings:
  - position: 1
    scene: "familia"
    conversation_type: "emocional"
    title: "La mochila"
    body: "Fabián preparaba la mochila de su hija cada noche sin pensarlo. Su pareja se lo dijo sin reproche: «La mimas y ya tiene quince años». Costó tres semanas, pero ahora la prepara ella y él duerme media hora más."
    before_phrase: "Es que no quiero que se le olvide nada."
    after_phrase: "La estoy mimando y ya tiene quince años."
  - position: 2
    scene: "trabajo"
    conversation_type: "practica"
    title: "La nota a mano"
    body: "Las entregas del equipo salían con tres revisiones y una nota escrita a mano. Al cliente le pareció exagerado el primer mes y esencial el tercero. «Aquí se miman los envíos», dijo en una reunión, y renovó el contrato."
    before_phrase: "Aquí lo hacemos todo con mucho cariño."
    after_phrase: "Aquí se miman los envíos."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "El pan del sábado"
    body: "El restaurante de la esquina no tiene carta larga ni manteles bonitos. Trae el pan caliente, cortado a mano, con aceite del bueno. «Miman el pan», dice la gente del barrio, y por eso hay cola los sábados."
    before_phrase: "Aquí cuidan mucho las cosas pequeñas."
    after_phrase: "Aquí miman el pan."
