schema_version: 1
sort_order: 8201
slug: "lealtad"
status: "draft"
lemma: "lealtad"
part_of_speech: "sustantivo"
syllables:
  - "le"
  - "al"
  - "tad"
stressed_syllable: 3
ipa_latam: "[le.alˈtad]"
ipa_es: "[le.alˈtad]"
explanation: "Sentimiento de apoyar a alguien siempre, incluso cuando cuesta o nadie más lo nota."
example_sentence: "Se quedó a ayudarme sin que nadie se lo pidiera: ahí vi su lealtad."
register: "neutral"
pedantry_risk: 1
usage_tip: "Suena bien para hablar de un amigo o para agradecer que alguien se quedó cuando podía haberse ido."
when_not_to_use: "No la uses para quien obedece sin pensar, ni para hablar de cumplir la ley o las normas."
collocations:
  - "lealtad a un amigo"
  - "por lealtad"
  - "una prueba de lealtad"
replaces:
  - before: "Es un amigo que nunca te falla"
    after: "Es un amigo de mucha lealtad"
  - before: "Se quedó con él aunque todos lo criticaran"
    after: "Le mostró lealtad aunque todos lo criticaran"
  - before: "Nunca me deja solo, pase lo que pase"
    after: "Tiene una lealtad que nunca falla"
family:
  - "leal"
  - "lealmente"
themes:
  - slug: "amistad"
    relevance: 3
  - slug: "conversaciones-dificiles"
    relevance: 2
tags:
  comodin: ["fiel"]
  funcion: ["elogiar", "valorar"]
  canal: "hablado"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "legalidad"
    difference: "«Legalidad» es cumplir la ley; la lealtad es no abandonar a alguien aunque nadie te vigile."
    memory_trick: "La legalidad se cumple; la lealtad se demuestra."
  - confused_with: "fidelidad"
    difference: "«Fidelidad» suele hablar de no engañar en una pareja; la lealtad es no abandonar a un amigo cuando las cosas se complican."
exercises:
  - position: 1
    sentence: "La {{blank}} de Tadeo quedó clara cuando acompañó a su amigo a arreglar el papeleo del club, un domingo que podía haber usado para descansar."
    hint_general: "Es notarse en las acciones de alguien que ayuda a un amigo sin que se lo pidan."
    explanation: "Lealtad: se nota en las acciones, como acompañar a un amigo sin que se lo pidan. «Legalidad» es cumplir la ley, y aquí no hay ninguna norma de por medio; «fidelidad» se usa más para una pareja, no para esta amistad."
    options:
      - position: 1
        text: "legalidad"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Legalidad» es cumplir con la ley, y aquí Tadeo solo acompaña a su amigo, sin que ninguna norma lo exija."
        hint_specific: "«Legalidad» habla de cumplir normas. ¿Qué ley obliga a Tadeo a acompañar a su amigo?"
      - position: 2
        text: "lealtad"
        is_correct: true
      - position: 3
        text: "fidelidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Fidelidad» se usa sobre todo para no engañar en una pareja, y aquí se trata de una amistad, no de una relación de pareja."
        hint_specific: "«Fidelidad» suena a pareja. ¿Qué tipo de relación tienen Tadeo y su amigo?"
  - position: 2
    sentence: "Ulises no estaba de acuerdo con cambiar la fecha de la boda, pero decidió ayudar con cada detalle por {{blank}} a sus amigos."
    hint_general: "Es apoyar a alguien por decisión propia, incluso cuando no piensas igual que esa persona."
    explanation: "Lealtad: decide ayudar por su cuenta, aunque no está de acuerdo. «Obediencia» supone que alguien le dio una orden, y aquí nadie se la dio; «sumisión» es ceder la voluntad propia, y él actúa por decisión propia."
    options:
      - position: 1
        text: "obediencia"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Obediencia» supone seguir una orden de alguien, y aquí nadie le pidió nada: decidió ayudar él solo."
        hint_specific: "«Obediencia» necesita que alguien mande. ¿Quién le da una orden a Ulises?"
      - position: 2
        text: "sumisión"
        is_correct: false
        distractor_type: "register"
        why_not: "«Sumisión» es ceder la voluntad sin más, y Ulises actúa por decisión propia, no porque no pueda decir que no."
        hint_specific: "«Sumisión» implica no tener voluntad propia. ¿Ulises pudo elegir no ayudar?"
      - position: 3
        text: "lealtad"
        is_correct: true
  - position: 3
    sentence: "Bautista ha estado en cada mudanza, cada cumpleaños y cada mal momento de Selene durante quince años: eso es {{blank}}, no una simple costumbre."
    hint_general: "Es mantener un vínculo cercano con la misma persona durante mucho tiempo, no solo repetir una costumbre."
    explanation: "Lealtad: sostener el vínculo con la misma persona durante mucho tiempo. «Perseverancia» solo describe la repetición, sin hablar del vínculo, y «solidaridad» suele ser ayuda puntual en un apuro, no quince años junto a alguien."
    options:
      - position: 1
        text: "perseverancia"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Perseverancia» describe algo que se repite en el tiempo, sin decir que ese vínculo sea con una persona en concreto."
        hint_specific: "«Perseverancia» solo describe la repetición. ¿Qué es más importante en la frase: repetir algo o estar con Selene?"
      - position: 2
        text: "solidaridad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Solidaridad» es ayudar a alguien en un apuro puntual, y aquí se habla de quince años junto a la misma persona."
        hint_specific: "«Solidaridad» suele ser puntual, para un apuro. ¿Cuánto tiempo lleva Bautista ahí?"
      - position: 3
        text: "lealtad"
        is_correct: true
  - position: 4
    sentence: "Cuando el resto del grupo empezó a criticar a Gaspar a sus espaldas, Vera cambió de tema enseguida por {{blank}} hacia su amigo, aunque eso la dejara fuera de la conversación."
    hint_general: "Es defender a un amigo aunque eso te cueste algo frente a los demás."
    explanation: "Lealtad: proteger a un amigo aunque cueste algo social. «Legalidad» no tiene nada que ver con defender a alguien en una charla, y «adhesión» describe apoyar una idea o un grupo, no defender a una persona en concreto."
    options:
      - position: 1
        text: "legalidad"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Legalidad» es cumplir la ley, y en esa charla no hay ninguna norma de por medio."
        hint_specific: "«Legalidad» habla de normas. ¿Qué ley aparece en esa conversación?"
      - position: 2
        text: "lealtad"
        is_correct: true
      - position: 3
        text: "adhesión"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Adhesión» es apoyar una idea, un partido o una causa, y aquí Vera defiende a una persona concreta."
        hint_specific: "«Adhesión» se da a una idea o a un grupo. ¿A quién defiende Vera aquí?"
  - position: 5
    sentence: "«¿Por qué te metiste en esa discusión que no era tuya?», le preguntaron a Mirta. «Por {{blank}}», contestó, «Renzo es mi amigo desde la escuela»."
    hint_general: "Es ponerte de parte de un amigo de toda la vida, aunque tengas que enfrentarte a alguien."
    explanation: "Lealtad: ponerse de parte de un amigo de toda la vida. «Subordinación» es obedecer a alguien de mayor rango, y aquí ella se mete en la discusión por su cuenta; «fidelidad» se usa más para una pareja, no para esta amistad de la escuela."
    options:
      - position: 1
        text: "subordinación"
        is_correct: false
        distractor_type: "register"
        why_not: "«Subordinación» es obedecer a alguien con más rango, y Mirta actúa aquí por su cuenta, sin que nadie se lo mande."
        hint_specific: "«Subordinación» es obedecer a un superior. ¿Mirta obedece a alguien en esa discusión o actúa por su cuenta?"
      - position: 2
        text: "fidelidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Fidelidad» se usa sobre todo para no engañar en una pareja, y aquí se trata de una amistad desde la escuela."
        hint_specific: "«Fidelidad» suena a pareja. ¿Qué tipo de relación tienen Mirta y Renzo?"
      - position: 3
        text: "lealtad"
        is_correct: true
  - position: 6
    sentence: "Leandro guardó el secreto de su amigo durante años, aunque toda la familia insistía en preguntarle: eso fue {{blank}}, no solo terquedad."
    hint_general: "Es proteger a alguien cercano incluso cuando te presionan para que hables."
    explanation: "Lealtad: proteger a un amigo aunque insistan mucho. «Perseverancia» solo diría que insistió en algo con el tiempo, sin hablar de proteger a alguien, y «obediencia» supondría que alguien le ordenó callar, cuando fue decisión suya."
    options:
      - position: 1
        text: "perseverancia"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Perseverancia» habla de mantener algo en el tiempo, pero no dice que sea para proteger a un amigo."
        hint_specific: "«Perseverancia» no explica a quién protege. ¿Qué protege Leandro con su silencio?"
      - position: 2
        text: "obediencia"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Obediencia» supondría que alguien le ordenó callar, y aquí Leandro decidió guardar el secreto por su cuenta."
        hint_specific: "«Obediencia» necesita una orden. ¿Quién le pidió a Leandro que se callara?"
      - position: 3
        text: "lealtad"
        is_correct: true
  - position: 7
    sentence: "Cuando a Bárbara le cancelaron el contrato, Ismael fue el único que la llamó cada semana; ahí se vio su {{blank}} de siempre."
    hint_general: "Es seguir cerca de alguien en un momento difícil, no solo por un rato."
    explanation: "Lealtad: mantenerse cerca de alguien en un momento difícil, no solo por compasión pasajera. «Solidaridad» sería ayudar en ese apuro puntual sin más historia detrás, y «adhesión» hablaría de apoyar una causa o un grupo, no llamar cada semana a una amiga."
    options:
      - position: 1
        text: "solidaridad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Solidaridad» describe ayudar en un apuro puntual, y aquí Ismael la llamó cada semana, con una amistad de fondo."
        hint_specific: "«Solidaridad» suele durar lo que dura el apuro. ¿Cuánto duró la llamada de Ismael?"
      - position: 2
        text: "adhesión"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Adhesión» es apoyar una idea o una causa, y aquí Ismael apoya a una persona concreta, no una causa."
        hint_specific: "«Adhesión» va con una idea o un grupo. ¿A qué se adhiere Ismael aquí?"
      - position: 3
        text: "lealtad"
        is_correct: true
  - position: 8
    sentence: "Cuando le ofrecieron el puesto que dejaba libre su amiga, Wanda dijo que no en la misma reunión: fue una muestra clara de {{blank}} hacia ella."
    hint_general: "Es elegir no beneficiarte a costa de un amigo, y decirlo sin esconder nada."
    explanation: "Lealtad: elegir no beneficiarte a costa de una amiga, y decirlo abiertamente. «Legalidad» no tiene sentido en esta decisión personal, y «subordinación» sería obedecer a alguien con más poder, cuando aquí ella decide por su cuenta, sin que nadie se lo pida."
    options:
      - position: 1
        text: "legalidad"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Legalidad» es cumplir la ley, y aquí no hay ninguna norma de por medio: es una decisión personal frente a su amiga."
        hint_specific: "«Legalidad» habla de normas. ¿Qué norma decide cumplir Wanda aquí?"
      - position: 2
        text: "subordinación"
        is_correct: false
        distractor_type: "register"
        why_not: "«Subordinación» sería obedecer a alguien con más poder, y Wanda toma esta decisión por su cuenta, delante de todos."
        hint_specific: "«Subordinación» es obedecer a un superior. ¿Wanda obedece a alguien o decide sola?"
      - position: 3
        text: "lealtad"
        is_correct: true
readings:
  - position: 1
    scene: "familia"
    conversation_type: "emocional"
    title: "El compañero de siempre"
    body: "En la cena de cumpleaños, la abuela de Jonás preguntó por su amigo Tobías: «¿Sigue viniendo a verte cada domingo?». Jonás sonrió: «Desde que perdí el trabajo, no ha faltado ni un domingo». Su abuela asintió: «Eso sí que es lealtad»."
    before_phrase: "Es un amigo que nunca falla."
    after_phrase: "Eso sí que es lealtad."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "La mesa que se quedó callada"
    body: "Alguien empezó a hablar mal de Rita en la sobremesa, y Fabiola cambió de tema sin pensarlo dos veces. Más tarde, Rita se enteró y le escribió: «Gracias por no seguirles la corriente». Fabiola respondió: «Para eso están las amigas»."
    before_phrase: "No la dejé sola aunque los demás siguieran hablando."
    after_phrase: "Le mostré lealtad y ya está."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El turno cubierto"
    body: "Norma llegó tarde a la reunión más importante del mes, y fue Cayetano quien avisó que había surgido un problema técnico, sin mencionar el motivo real. Al salir, Norma le susurró: «Te debo una». Cayetano solo dijo: «Entre amigos no se cobran los favores»."
    before_phrase: "Cubrió mi error sin decir nada."
    after_phrase: "Me mostró lealtad cuando más lo necesitaba."
