confusions:
  - confused_with: "ironía"
    difference: "«Ironía» dice lo contrario para hacer gracia sin dejar a nadie mal; esta palabra dice lo contrario para herir o dejar en evidencia a alguien."
    memory_trick: "La ironía guiña; esta palabra pincha."
  - confused_with: "cinismo"
    difference: "«Cinismo» es actuar sin vergüenza ante algo que se sabe mal; esta palabra es un modo de hablar irónico y duro, no una forma de actuar."
    memory_trick: "El cinismo se comporta sin vergüenza; esta palabra se dice con dureza."
exercises:
  - position: 1
    sentence: "Cuando el proyecto se retrasó otra vez, Renata soltó un comentario cargado de {{blank}}: «Qué sorpresa, otra vez a tiempo»."
    hint_general: "Habla con dureza y dice lo contrario de lo que piensa, para dejar claro que algo salió mal."
    explanation: "Sarcasmo: dice lo contrario de lo que piensa, con dureza, para criticar. «Espasmo» es una contracción muscular y no tiene nada que ver con hablar, y «ironía» no busca herir, y aquí Renata sí busca señalar el fallo con mala leche."
    options:
      - position: 1
        text: "espasmo"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Espasmo» es una contracción muscular repentina, y aquí no hay ningún movimiento del cuerpo: hay una frase que dice lo contrario de lo que se piensa, para criticar."
        hint_specific: "«Espasmo» es del cuerpo, no de las palabras. ¿Qué suelta Renata: un movimiento o un comentario?"
      - position: 2
        text: "sarcasmo"
        is_correct: true
      - position: 3
        text: "ironía"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Ironía» dice lo contrario sin buscar herir, y aquí el tono de Renata busca justo señalar el fallo con mala leche."
        hint_specific: "«Ironía» no busca doler. ¿El comentario de Renata suena amable o cargado de mala leche?"
