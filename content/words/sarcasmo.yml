    sentence: "Con {{blank}}, mi tío Rogelio comentó que su compañero de trabajo por fin había hecho algo útil, después de meses sin hacer nada."
    hint_general: "Dice lo contrario de lo que piensa, con dureza, para señalar que algo tardó demasiado."
