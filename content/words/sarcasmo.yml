    sentence: "Ante la cámara, el candidato Julio respondió con tanto {{blank}} a la pregunta que hasta sus propios asesores se incomodaron."
    hint_general: "Responde diciendo lo contrario de lo que piensa, con un tono cortante que incomoda."
    explanation: "Sarcasmo: dice lo contrario de lo que piensa, con un tono cortante. «Mofa» sería una burla más directa y abierta, y aquí el tono es cortante pero no una burla abierta, y «reproche» sería una queja de frente, no una frase irónica."
    options:
      - position: 1
        text: "mofa"
        is_correct: false
        distractor_type: "register"
        why_not: "«Mofa» es una burla más cruda y directa, y aquí lo que incomoda es un tono irónico y cortante, no una burla abierta."
        hint_specific: "«Mofa» es una burla más directa. ¿La respuesta del candidato fue una burla abierta o un tono cortante?"
      - position: 2
        text: "sarcasmo"
        is_correct: true
      - position: 3
        text: "reproche"
        is_correct: false
        distractor_type: "near_synonym"
