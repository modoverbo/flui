schema_version: 1
sort_order: 8105
slug: "intriga"
status: "draft"
lemma: "intriga"
part_of_speech: "sustantivo"
syllables:
  - "in"
  - "tri"
  - "ga"
stressed_syllable: 2
ipa_latam: "[inˈtɾi.ɣa]"
ipa_es: "[inˈtɾi.ɣa]"
explanation: "Ganas de saber más sobre alguien o algo que te resulta curioso y difícil de explicar."
example_sentence: "Le entró tanta intriga por el mensaje sin firma que no pudo dejar de pensar en quién lo mandó."
register: "neutral"
pedantry_risk: 1
usage_tip: "Sirve para contar las ganas de entender a alguien que no se deja leer fácil."
when_not_to_use: "No la uses para simple curiosidad sobre cualquier cosa ni para desconfiar de alguien: aquí hay ganas de descubrir, no sospecha."
collocations:
  - "dar intriga"
  - "con intriga"
  - "una intriga que no se resuelve"
replaces:
  - before: "Me dio curiosidad esa persona, no sé por qué"
    after: "Me dio intriga esa persona, no sé por qué"
  - before: "Quiero saber más de él, hay algo raro"
    after: "Me da intriga: hay algo en él que no logro descifrar"
  - before: "No dejo de pensar en lo que dijo, qué raro"
    after: "Me dejó con tanta intriga lo que dijo"
family:
  - "intrigante"
themes:
  - slug: "citas"
    relevance: 3
  - slug: "small-talk"
    relevance: 2
tags:
  comodin: ["curiosidad"]
  funcion: ["describir"]
  canal: "ambos"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "desconfianza"
    difference: "«Desconfianza» es no creer en alguien; la intriga es querer descubrir más sobre alguien que te llama la atención."
    memory_trick: "La desconfianza aleja; la intriga acerca."
  - confused_with: "chisme"
    difference: "«Chisme» es contar la vida de otros a terceros; la intriga es lo que sientes tú por descubrir algo, sin necesidad de contarlo."
exercises:
  - position: 1
    sentence: "El mensaje sin firma que le llegó a Tadeo despertó tal {{blank}} que revisó el remitente cinco veces buscando pistas."
    hint_general: "Piensa en las ganas de saber más que sintió Tadeo, no en cómo era el mensaje en sí."
    explanation: "Intriga: la ganas de saber más que sintió Tadeo. «Fatiga» es cansancio, y aquí lo que hizo fue revisarlo con interés, no cansarse; «misterio» describe lo desconocido del mensaje, no lo que sintió él por dentro."
    options:
      - position: 1
        text: "fatiga"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Fatiga» es cansancio, y Tadeo revisó el mensaje cinco veces con interés, no porque estuviera cansado."
        hint_specific: "La fatiga es cansancio. ¿Tadeo se cansa o se interesa más con cada revisión?"
      - position: 2
        text: "intriga"
        is_correct: true
      - position: 3
        text: "misterio"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Misterio» describe lo desconocido del mensaje en sí, y la frase cuenta lo que sintió Tadeo por dentro, no cómo era el mensaje."
        hint_specific: "El misterio describe la situación. ¿La frase habla de la situación o de lo que sintió Tadeo?"
  - position: 2
    sentence: "A Dante le dio {{blank}} el chico nuevo del gimnasio, tan callado que nadie sabía nada de él."
    hint_general: "Es lo que provoca alguien callado del que no sabes nada, no una historia que le cuentas a otros."
    explanation: "Intriga: lo que provoca alguien callado del que no sabes nada. «Chisme» es contar la vida de otros a terceros, y aquí Dante no le ha contado nada a nadie; «curiosidad» es más genérica y sirve para cualquier cosa, no solo para alguien que te llama la atención así."
    options:
      - position: 1
        text: "chisme"
        is_correct: false
        distractor_type: "register"
        why_not: "«Chisme» es contar la vida de otra persona a terceros, y aquí Dante no le ha contado nada a nadie, solo se pregunta por él."
        hint_specific: "El chisme se cuenta a otros. ¿Dante le ha contado esto a alguien?"
      - position: 2
        text: "intriga"
        is_correct: true
      - position: 3
        text: "curiosidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Curiosidad» es más genérica y sirve para cualquier cosa, y aquí lo que pasa es más concreto: alguien callado le llama la atención."
        hint_specific: "La curiosidad puede ser sobre cualquier cosa. ¿Qué tiene de especial este chico nuevo?"
  - position: 3
    sentence: "«¿Por qué sigues mirando su perfil si ya lo bloqueaste?», le preguntó su amiga a Aitana. «No sé, me da {{blank}}: dice que vive aquí pero nunca lo he visto», respondió, sin dejar de mirar la pantalla."
    hint_general: "Piensa en las ganas de entender algo que no cuadra, con interés real, no en desconfiar."
    explanation: "Intriga: las ganas de entender algo que no cuadra, con interés real. «Cuchicheo» es un cotilleo en voz baja entre personas, y aquí Aitana solo habla de lo que siente ella; «desconfianza» es solo desconfiar, y aquí ella sigue mirando con curiosidad, no evitándolo."
    options:
      - position: 1
        text: "cuchicheo"
        is_correct: false
        distractor_type: "register"
        why_not: "«Cuchicheo» es un cotilleo dicho en voz baja entre personas, y aquí Aitana solo cuenta lo que siente ella por dentro."
        hint_specific: "El cuchicheo se dice entre personas. ¿Aitana está cotilleando con alguien o contando lo que siente?"
      - position: 2
        text: "desconfianza"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Desconfianza» es solo desconfiar, y la frase dice que ella sigue mirando el perfil con interés, no evitándolo."
        hint_specific: "La desconfianza hace que evites algo. ¿Aitana evita el perfil o lo sigue mirando?"
      - position: 3
        text: "intriga"
        is_correct: true
  - position: 4
    sentence: "Bárbara sintió tanta {{blank}} por el chico que solo hablaba de su trabajo y nunca de su vida fuera de la oficina, que empezó a hacerle preguntas cada vez más específicas."
    hint_general: "Piensa en las ganas de descubrir más sobre alguien que no se abre del todo."
    explanation: "Intriga: las ganas de descubrir más sobre alguien que no se abre del todo. «Duda» es no saber algo concreto, no un interés por alguien; «sospecha» supondría que cree que oculta algo malo, y aquí lo que hay es curiosidad, no una acusación."
    options:
      - position: 1
        text: "duda"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Duda» es no saber algo concreto, y aquí lo que tiene Bárbara es interés por conocer más a esa persona, no una duda puntual."
        hint_specific: "La duda es sobre un dato concreto. ¿Qué quiere Bárbara: resolver un dato o conocer más a esa persona?"
      - position: 2
        text: "sospecha"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sospecha» supondría que cree que oculta algo malo, y la frase solo cuenta que quiere saber más de él, sin acusarlo de nada."
        hint_specific: "La sospecha acusa de algo malo. ¿Bárbara acusa a esa persona de algo?"
      - position: 3
        text: "intriga"
        is_correct: true
  - position: 5
    sentence: "Fabiola no podía dejar de pensar en su cita, llena de {{blank}} por lo distinto que era en persona comparado con sus mensajes."
    hint_general: "Es la sensación personal de querer entender algo, no lo desconocido de la situación en sí."
    explanation: "Intriga: la sensación personal de querer entender algo que no cuadra. «Enigma» nombra lo desconocido en sí, no algo de lo que uno esté lleno; «misterio» describiría a la persona o la situación, no lo que sintió Fabiola por dentro."
    options:
      - position: 1
        text: "enigma"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Enigma» nombra lo desconocido en sí mismo, y no es algo de lo que una persona esté llena; aquí se describe lo que sintió Fabiola."
        hint_specific: "El enigma es la cosa desconocida. ¿La frase describe una cosa o lo que sintió Fabiola?"
      - position: 2
        text: "intriga"
        is_correct: true
      - position: 3
        text: "misterio"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Misterio» describiría a la persona o la situación como misteriosa, y la frase cuenta lo que sintió Fabiola por dentro, no cómo era él."
        hint_specific: "El misterio describe algo o a alguien. ¿La frase habla de él o de lo que sintió ella?"
  - position: 6
    sentence: "Malena sintió tanta {{blank}} por el vecino nuevo, que solo saluda y nunca se queda a hablar, que empezó a inventar excusas para cruzárselo en el pasillo."
    hint_general: "Piensa en las ganas de acercarte a alguien que no se abre del todo, no en evitarlo."
    explanation: "Intriga: las ganas de acercarte a alguien que no se abre del todo. «Curiosidad» es más genérica y no explica que invente excusas para verlo; «desconfianza» haría que lo evitara, y aquí ella busca cruzárselo."
    options:
      - position: 1
        text: "curiosidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Curiosidad» es más genérica, y aquí lo que hace Malena, inventar excusas para verlo, muestra algo más concreto."
        hint_specific: "La curiosidad puede ser sobre cualquier cosa. ¿Qué hace Malena para verlo, según la frase?"
      - position: 2
        text: "intriga"
        is_correct: true
      - position: 3
        text: "desconfianza"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Desconfianza» haría que Malena evitara a esa persona, y la frase dice que ella busca cruzárselo en el pasillo."
        hint_specific: "La desconfianza aleja a la gente. ¿Malena evita al vecino o busca verlo?"
  - position: 7
    sentence: "Nerea leyó el mensaje de su cita tres veces, con {{blank}}: decía que tenía una sorpresa preparada, pero no daba ninguna pista."
    hint_general: "Piensa en leer algo con ganas de adivinar qué esconde, sin desconfiar de nada."
    explanation: "Intriga: leer algo tres veces con ganas de adivinar qué esconde. «Duda» sería no saber qué decisión tomar, y aquí no hay ninguna decisión pendiente; «sospecha» supondría desconfiar de sus intenciones, y aquí la sorpresa suena a algo bueno."
    options:
      - position: 1
        text: "duda"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Duda» sería no saber qué decisión tomar, y aquí no hay ninguna decisión pendiente, solo ganas de saber qué es la sorpresa."
        hint_specific: "La duda es sobre una decisión. ¿Qué decisión tiene que tomar Nerea?"
      - position: 2
        text: "sospecha"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sospecha» supondría desconfiar de las intenciones de esa persona, y la sorpresa que promete suena a algo bueno, no a un engaño."
        hint_specific: "La sospecha desconfía de las intenciones. ¿La sorpresa suena a algo malo o bueno?"
      - position: 3
        text: "intriga"
        is_correct: true
  - position: 8
    sentence: "Ulises se quedó pensando en el comentario de su cita, con {{blank}} por saber qué había querido decir en realidad."
    hint_general: "Es la sensación personal de querer descifrar algo, no cómo habló la otra persona."
    explanation: "Intriga: las ganas personales de descifrar lo que quiso decir. «Enigma» nombra lo desconocido en sí, no una sensación personal; «misterio» describiría cómo habló ella, no lo que sintió él después."
    options:
      - position: 1
        text: "enigma"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Enigma» nombra lo desconocido en sí mismo, y aquí la frase describe lo que sintió Ulises, no la frase de su cita."
        hint_specific: "El enigma es la cosa desconocida. ¿La frase describe el comentario o lo que sintió Ulises?"
      - position: 2
        text: "intriga"
        is_correct: true
      - position: 3
        text: "misterio"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Misterio» describiría cómo habló ella, de forma misteriosa, y la frase cuenta lo que sintió él después, no cómo habló ella."
        hint_specific: "El misterio describe una forma de hablar. ¿La frase habla de cómo habló ella o de lo que sintió él?"
readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "El perfil sin fotos"
    body: "En la fiesta, alguien le mencionó a Tadeo que había un chico nuevo con un perfil sin ninguna foto y solo una frase: «Pregúntame en persona». Tadeo se pasó la noche buscando una excusa para acercarse. «Me da tanta intriga esa frase», le confesó a su amigo, sin dejar de mirar hacia la puerta."
    before_phrase: "Qué curiosidad me da esa persona, no sé por qué."
    after_phrase: "Me da tanta intriga esa frase."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "El comentario de mi hermana"
    body: "Dante le contó a su hermana que su cita había mencionado una ciudad donde vivió, sin decir por qué se fue. «Eso me da intriga», le dijo, «pero no quiero preguntar directo y que se sienta interrogado». Su hermana se rio: «Pregúntale con calma, no es un interrogatorio»."
    before_phrase: "Tengo mucha curiosidad, pero no quiero preguntar directo."
    after_phrase: "Eso me da intriga, pero no quiero que se sienta interrogado."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "La pausa del café"
    body: "En la pausa del café, Aitana le contó a un compañero que su cita del fin de semana casi nunca hablaba de su familia. «Me da intriga por qué evita el tema», comentó, todavía pensando en ello. Su compañero solo levantó una ceja: «A lo mejor simplemente no le gusta hablar de eso»."
    before_phrase: "Me da curiosidad por qué nunca habla de su familia."
    after_phrase: "Me da intriga por qué evita el tema."
