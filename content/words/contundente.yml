confusions:
  - confused_with: "condescendiente"
    difference: "«Condescendiente» describe a quien trata a los demás con aire de superioridad. «Contundente» describe algo claro y firme."
    memory_trick: "Lo contundente convence; lo condescendiente ofende."
  - confused_with: "convincente"
    difference: "«Convincente» es lo que logra convencer. «Contundente» añade firmeza: además de convencer, no deja lugar a dudas."
    memory_trick: "Lo convincente te persuade; lo contundente te deja sin réplica."
exercises:
