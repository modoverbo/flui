    title: "Los números hablan"
    body: "Nadie creía que el nuevo horario funcionara. Camila no discutió: presentó una tabla con tres meses de datos. Las quejas habían bajado un 40 %. Su jefe cerró el tema: «Los resultados son contundentes; lo mantenemos»."
    before_phrase: "Los resultados son súper claros."
    after_phrase: "Los resultados son contundentes."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Un no con cariño"
    body: "Su hija adolescente insistía en volver a casa a las tres de la mañana. Andrea la escuchó hasta el final y respondió, tranquila y contundente: «Entiendo que quieras quedarte más. La respuesta es no: a la una paso a buscarte»."
    before_phrase: "Que no y punto, porque lo digo yo."
    after_phrase: "Fue una respuesta tranquila y contundente."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "Fin del rumor"
    body: "En el grupo de amigos corría el rumor de que Diego se iba de la ciudad. Él escribió un mensaje breve y contundente: «No me mudo. Cambio de trabajo, pero sigo aquí». Nadie volvió a preguntar."
    before_phrase: "Que no, que no es así, de verdad."
    after_phrase: "Un mensaje breve y contundente."
