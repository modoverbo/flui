    position: 1
    sentence: "Cuando le preguntaron si el proyecto seguiría adelante, la directora dio una respuesta {{blank}}: «Sí, sin cambios y con el mismo equipo»."
    hint_general: "La respuesta es tan firme y clara que no deja ninguna duda."
    explanation: "Contundente: una respuesta firme que no deja dudas. «Condescendiente» sería hablar con superioridad, y «contenciosa» se refiere a disputas o juicios; la directora solo fue clara."
