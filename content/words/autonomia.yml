    body: "Su hijo pedía libertad y su madre oía descontrol. Cambiaron la palabra y se entendieron: «No quiero menos normas; quiero autonomía para organizar mi sábado y aviso siempre». Funcionó dos meses seguidos y nadie volvió a discutir en la puerta."
