readings:
  - position: 1
    scene: "entrevista"
    conversation_type: "practica"
    title: "Con un ejemplo detrás"
    body: "Álex pidió autonomía en la entrevista y le preguntaron qué entendía por eso. En vez de dar una definición, contó el mes en que cambió el proveedor de embalajes sin consultar y ahorró un doce por ciento. «Avisé el mismo día», añadió. Le dieron el puesto y el margen que pedía."
    before_phrase: "Me gusta que no me estén encima."
    after_phrase: "Trabajo bien con autonomía, y te cuento un caso."
  - position: 2
    scene: "trabajo"
    conversation_type: "practica"
    title: "Menos seguimiento"
    body: "Raquel pidió dos cosas a la vez: más autonomía y menos reuniones de seguimiento. Su responsable aceptó con una condición: un aviso corto cuando algo se torciera. En seis meses hubo dos avisos y ninguna reunión de urgencia."
    before_phrase: "¿Podemos quitar alguna reunión de estas?"
    after_phrase: "Quiero más autonomía y menos seguimiento."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "Cinco años sin jefe"
    body: "Noa trabaja por su cuenta desde hace cinco años. En la comida del domingo su hermano le dijo que qué suerte, que nadie le manda. Ella lo matizó: «La autonomía está muy bien, pero decidirlo todo sola cansa; el que no tiene jefe también tiene semanas malas»."
    before_phrase: "Qué suerte, nadie te dice lo que tienes que hacer."
    after_phrase: "La autonomía está bien, pero también cansa."
