    title: "El fontanero"
    body: "Aitor llevaba tres semanas viviendo solo cuando reventó un tubo debajo del fregadero. Llamó a su padre y su padre le dio un número de teléfono. «Bienvenido a la autonomía», le dijo riéndose. Aitor llamó, negoció el precio y lo contó en el grupo."
