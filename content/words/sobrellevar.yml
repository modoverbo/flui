    body: "Nadia lleva cuatro años cuidando de su madre y la gente le pregunta si está bien. Un día contestó de otra manera: «No estoy bien ni mal; lo sobrellevo, que ya es bastante». Su prima dejó de preguntar y empezó a ir los jueves."
    before_phrase: "Voy tirando, ya sabes cómo es esto."
    after_phrase: "Lo sobrellevo, que ya es bastante."
