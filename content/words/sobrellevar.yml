confusions:
  - confused_with: "conllevar"
    difference: "«Conllevar» es que una cosa traiga consigo otra, como un cargo que trae obligaciones; la otra palabra la hace una persona con lo que le pesa."
    memory_trick: "Un puesto conlleva obligaciones; una persona carga con ellas."
  - confused_with: "superar"
    difference: "«Superar» supone dejar algo atrás y salir de ello; la otra palabra sigue con la carga puesta."
    memory_trick: "Superas lo que termina; lo otro sigue encima."
exercises:
  - position: 1
    sentence: "Nadia cuida de su madre desde hace cuatro años y {{blank}} el cansancio sin que le amargue el día a día."
    hint_general: "Carga con el cansancio durante años y aun así su vida sigue siendo su vida."
    explanation: "Sobrelleva: carga con el cansancio y sigue con su vida. «Conlleva» diría que algo trae consigo otra cosa, y «aguanta» sugiere apretar los dientes."
