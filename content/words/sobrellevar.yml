    body: "La obra empezó en enero y el ruido entraba por la ventana desde las ocho. En la reunión de equipo, Damián lo dijo sin drama: «Lo sobrellevamos hasta junio y punto». Compraron auriculares y movieron las llamadas a la tarde."
    before_phrase: "Habrá que aguantarse hasta que terminen."
    after_phrase: "Lo sobrellevamos hasta junio y punto."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "La temporada rara"
    body: "El grupo de los martes pasó un otoño raro: dos se mudaron y otro cambió de turno. Alguien lo puso en palabras: «No hay que arreglarlo; hay que sobrellevar la temporada». Siguieron quedando, con menos gente y la misma hora."
    before_phrase: "A ver si pasa esto pronto y volvemos a lo de antes."
    after_phrase: "Hay que sobrellevar la temporada, nada más."
