confusions:
  - confused_with: "antídoto"
    difference: "«Antídoto» es lo que corta el efecto de algo malo; la otra palabra es una historia corta que de verdad ocurrió."
    memory_trick: "El antídoto cura; la anécdota se cuenta."
  - confused_with: "chiste"
    difference: "«Chiste» es inventado y busca la risa; aquí la historia pasó de verdad, aunque además haga gracia."
    memory_trick: "El chiste se inventa; la anécdota se vivió."
