readings:
  - position: 1
    scene: "entrevista"
    conversation_type: "practica"
    title: "El turno de mañana"
    body: "Olga llevaba un mes enviando el currículo a ciegas sin respuesta. Cambió el correo: «Escribo por la vacante del turno de mañana; trabajé cinco años en un turno igual». Le contestaron ese mismo día y la citaron el jueves."
    before_phrase: "Le mando mi currículo por si hubiera algo."
    after_phrase: "Escribo por la vacante del turno de mañana."
  - position: 2
    scene: "trabajo"
    conversation_type: "practica"
    title: "Preguntar dentro primero"
    body: "Nerea tenía el anuncio escrito y el dinero aprobado, pero antes de publicarlo preguntó dentro de casa. Dos personas levantaron la mano y una encajaba mejor que cualquier currículo de fuera. La vacante se cubrió en una semana y el anuncio nunca llegó a salir."
    before_phrase: "Voy a sacar el anuncio a ver quién aparece."
    after_phrase: "Antes de publicar la vacante, pregunto dentro."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "La vecina del cuarto"
    body: "Diego se enteró por la vecina del cuarto de que en su empresa había una vacante en el almacén. No había anuncio en ninguna parte. Escribió esa noche nombrando el puesto y el turno, y entró en marzo. Ahora es él quien avisa a los del portal."
    before_phrase: "Dicen que en tu empresa buscan a alguien."
    after_phrase: "Me dijeron que había una vacante en el almacén."
