readings:
  - position: 1
    scene: "familia"
    conversation_type: "emocional"
    title: "Las macetas del portal"
    body: "El jardín del patio llevaba veinte años impecable y nadie había dicho nunca nada. En su cumpleaños, su hija lo puso en palabras: «Esto no es suerte: es tu desvelo». Su madre se rio y dijo que solo eran plantas, pero guardó la tarjeta."
    before_phrase: "Mamá, lo que has trabajado con esto."
    after_phrase: "Esto no es suerte: es tu desvelo."
  - position: 2
    scene: "trabajo"
    conversation_type: "practica"
    title: "Dos inviernos"
    body: "El proyecto salió adelante con llamadas de madrugada durante dos inviernos. En la presentación final, la responsable no habló de horas extra: «Detrás de esto hay el desvelo de nueve personas». Nadie hizo un chiste; algunos tomaron nota del nombre."
    before_phrase: "Aquí ha habido un esfuerzo brutal del equipo."
    after_phrase: "Detrás de esto hay el desvelo de nueve personas."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "Cómo la nombran"
    body: "En el barrio nadie cuenta la historia entera, y aun así todos saben lo que hizo aquella mujer por sus vecinos. Se nota en cómo la nombran al cruzarla. «Su desvelo está en cómo hablan de ella», dijo su nieta, y no hizo falta explicar más."
    before_phrase: "Se ve que hizo mucho por la gente de aquí."
    after_phrase: "Su desvelo está en cómo hablan de ella."
