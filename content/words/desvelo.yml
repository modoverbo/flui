    title: "Diez años que valieron la pena"
    body: "Perla se sentó junto a la cama del hospital sin dormir, otra vez. Cuando su hijo por fin dio los primeros pasos solo por el pasillo, ella se echó a llorar de alivio. «Todos esos desvelos valieron la pena», le dijo a su marido esa noche, ya con la luz apagada."
