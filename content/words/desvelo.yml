    conversation_type: "practica"
    title: "El café de las siete"
    body: "Marisol llegó a la oficina con el segundo café antes de las ocho. «Entre entregas de trabajo y pañales, mis desvelos esta semana no se los quita nadie», le dijo a su jefe, medio en broma. Él le ofreció mover una reunión para que pudiera dormir una hora más al día siguiente."
