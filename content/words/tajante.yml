readings:
  - position: 1
    scene: "familia"
    conversation_type: "emocional"
    title: "Nunca más en agosto"
    body: "Cada año le preguntan a Jacinta si volverá al pueblo en agosto, y cada año da rodeos hasta julio. Este año fue tajante en la primera comida: «Nunca más en agosto; en septiembre, encantada». Nadie insistió, y en septiembre fue toda la familia."
    before_phrase: "Bueno, ya veremos, según cómo esté la cosa."
    after_phrase: "Fui tajante: en agosto no."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "A las once se recoge"
    body: "El local de la asociación acababa siempre a la una y media, con quejas de los vecinos. Nicanor lo puso en un cartel y lo dijo en voz alta, tajante: a las once se recoge. Hubo dos caras largas la primera semana y ninguna la segunda."
    before_phrase: "A ver si podemos ir acabando antes, por favor."
    after_phrase: "Fui tajante: a las once se recoge."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El no que se agradece"
    body: "Aitana tardaba semanas en rechazar propuestas por miedo a quedar mal. Cambió el método: respuesta tajante el mismo día, con una línea de motivo. Un proveedor le contestó que prefería ese no a los tres meses de silencio del año anterior."
    before_phrase: "Lo vemos más adelante y ya te digo algo."
    after_phrase: "Le di un no tajante el mismo día."
