    body: "Renata propuso adelantar la entrega dos días y hubo tres segundos de silencio. Entonces habló Adriana: «Secundo lo de Renata, y explico por qué: nos deja margen si falla el proveedor». La propuesta salió adelante."
    before_phrase: "Yo también estoy de acuerdo con lo que dijo."
    after_phrase: "Secundo lo de Renata, y explico por qué."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Turnos en la casa del pueblo"
    body: "Nadie quería abrir el asunto de los turnos hasta que la hermana menor propuso un calendario. Su primo levantó la mano: «Yo la secundo, y me pido agosto». Esa misma tarde hubo calendario colgado en la nevera."
    before_phrase: "A mí me parece bien lo que dice ella."
    after_phrase: "Yo la secundo, y me pido agosto."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "Asamblea del edificio"
    body: "El portero propuso cambiar la hora de la basura y nadie reaccionó. Un vecino del cuarto dijo: «Lo secundo; con mi horario me viene mejor». Otras dos manos se levantaron detrás y el cambio quedó aprobado."
    before_phrase: "Pues yo digo lo mismo que él."
    after_phrase: "Lo secundo; con mi horario me viene mejor."
