explanation: "Apoyar en voz alta la idea de otra persona delante del grupo."
example_sentence: "Basta con que alguien secunde tu idea para que la sala entera cambie de ánimo."
register: "neutral"
pedantry_risk: 2
usage_tip: "Dicho enseguida, salva ideas buenas que iban a morir en el silencio."
when_not_to_use: "No la uses si no estás de acuerdo del todo; entonces di qué parte apoyas y qué parte no."
