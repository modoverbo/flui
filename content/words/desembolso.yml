ipa_latam: "[de.semˈbol.so]"
ipa_es: "[de.semˈbol.so]"
explanation: "El dinero que sale de tu cuenta en un pago, no lo que pagas poco a poco."
example_sentence: "El curso son mil pesos, pero en tres partes: no hay un desembolso grande de golpe."
register: "neutral"
pedantry_risk: 2
usage_tip: "Sirve para separar el precio total del susto del primer pago: casi siempre lo que asusta es el segundo."
when_not_to_use: "No la uses para el precio total ni para el gasto de cada mes; esta palabra mira el momento de pagar."
collocations:
  - "un desembolso inicial"
  - "un desembolso fuerte"
  - "repartir el desembolso"
replaces:
