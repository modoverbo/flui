schema_version: 1
slug: "banal"
status: "draft"
lemma: "banal"
part_of_speech: "adjetivo"
syllables: ["ba", "nal"]
stressed_syllable: 2
ipa_latam: "[baˈnal]"
ipa_es: "[baˈnal]"
explanation: "Tan común y repetido que no aporta nada nuevo ni interesante."
example_sentence: "El comentario le pareció banal: la misma frase que ya había leído cien veces esa semana."
register: "neutral"
pedantry_risk: 1
usage_tip: "Sirve para señalar que algo es tan común y repetido que no aporta nada nuevo, aunque no sea falso ni esté mal dicho."
when_not_to_use: "No la uses para algo simplemente breve o sencillo; banal implica que ya se ha dicho tantas veces que perdió su valor."
collocations:
  - "comentario banal"
  - "frase banal"
replaces:
  - before: "Es lo mismo que dice todo el mundo"
    after: "Es un comentario banal"
  - before: "Ya lo he leído mil veces, no dice nada nuevo"
    after: "Es una frase banal que no aporta nada nuevo"
family: ["banalidad", "banalizar"]
themes:
  - slug: "redes-sociales"
    relevance: 3
tags:
  comodin: ["lo mismo de siempre"]
  funcion: ["criticar"]
  canal: "ambos"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "cabal"
    difference: "«Cabal» describe a alguien íntegro que cumple lo que promete sin fallar en nada; «banal» describe algo sin importancia ni sustancia propia."
    memory_trick: "Cabal cumple su palabra; banal no tiene peso que cumplir."
  - confused_with: "superficial"
    difference: "«Superficial» describe que algo no profundiza en un tema; «banal» describe que algo es tan común y repetido que no tiene valor propio."
exercises:
  - position: 1
    sentence: "A Ismael el comentario le pareció {{blank}}: la misma frase motivacional que ya había visto cien veces esa semana."
    hint_general: "Es algo tan repetido que ya no aporta nada nuevo."
    explanation: "Banal: la frase está tan repetida que ya no aporta nada nuevo. «Venal» habla de dejarse sobornar, y «baladí» describe un asunto sin importancia, no una frase repetida."
    options:
      - position: 1
        text: "venal"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Venal» describe a quien se deja sobornar o corromper por dinero, y aquí no hay ningún soborno: solo una frase muy repetida."
        hint_specific: "«Venal» habla de dejarse sobornar. ¿Hay algún soborno en esta escena?"
      - position: 2
        text: "baladí"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Baladí» describe un asunto sin importancia, y el problema aquí no es que el tema no importe, sino que la frase está demasiado repetida."
        hint_specific: "«Baladí» habla de un asunto sin importancia. ¿El problema es la importancia del tema o que la frase ya se repitió demasiado?"
      - position: 3
        text: "banal"
        is_correct: true
