    title: "El eslogan que ya existía"
    body: "El equipo de marketing revisó tres propuestas de eslogan. «Esta es banal», dijo Lorena, señalando la segunda: «la vi el mes pasado en otra marca, casi con las mismas palabras». Volvieron a la mesa de trabajo con una idea más propia."
    before_phrase: "Esta ya la vi en todos lados, no dice nada nuevo."
    after_phrase: "Esta es banal."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "El mismo mensaje de siempre"
    body: "Bruno le mostró a su amigo una cuenta que seguía por costumbre. «Mira, cada publicación es más banal que la anterior: siempre el mismo mensaje con otras palabras», comentó. Su amigo se rió y confesó que la había dejado de ver hacía meses."
    before_phrase: "Siempre dice lo mismo de siempre, no aporta nada."
    after_phrase: "Cada publicación es más banal que la anterior."
  - position: 3
    scene: "entrevista"
    conversation_type: "practica"
    title: "La respuesta que evitó"
    body: "«¿Por qué quieres este puesto?», preguntó la entrevistadora. Camilo dudó un segundo: «Casi respondo algo banal, como “me apasiona el trabajo en equipo”, pero prefiero contarte lo que aprendí en mi último proyecto». La entrevistadora sonrió y le pidió que continuara."
    before_phrase: "Casi digo lo mismo que dice todo el mundo."
    after_phrase: "Casi respondo algo banal."
