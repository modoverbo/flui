    explanation: "Banal: el chiste ya está tan repetido que perdió la gracia. «Manido» es una palabra muy formal para una charla entre amigas, y «vulgar» habla de mal gusto, no de repetición."
    options:
      - position: 1
        text: "manido"
        is_correct: false
        distractor_type: "register"
        why_not: "«Manido» es una palabra muy formal y literaria, y esta es una charla entre amigas, entre risas."
        hint_specific: "«Manido» suena a crítica literaria. ¿Ese tono encaja en una charla entre amigas?"
      - position: 2
        text: "vulgar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Vulgar» describe algo de mal gusto o grosero, y el problema del chiste no es que sea de mal gusto, sino que ya lo repitieron demasiado."
        hint_specific: "«Vulgar» habla de mal gusto. ¿El problema es el gusto del chiste o que ya se repitió mucho?"
