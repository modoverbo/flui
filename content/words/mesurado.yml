confusions:
  - confused_with: "medido"
    difference: "«Medido» dice que algo está calculado al detalle, como una ración o un tiempo; el otro adjetivo habla del tono al hablar."
    memory_trick: "Lo medido se calcula; lo mesurado se contiene."
  - confused_with: "moderado"
    difference: "«Moderado» habla de la postura, de no irse a los extremos; el otro habla de la manera de decirla."
    memory_trick: "Moderado es la postura; mesurado es el tono."
