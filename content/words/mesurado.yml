    scene: "trabajo"
    conversation_type: "practica"
    title: "El tercer cambio de plazo"
    body: "Era la tercera vez que movían la fecha y el equipo estaba harto. El correo de Marcos no llevaba ni una queja: fechas, horas perdidas y una propuesta. Su compañera se lo dijo al día siguiente: «Fue muy mesurado, y por eso esta vez han contestado»."
    before_phrase: "Lo dijo tranquilo, sin saltar."
    after_phrase: "Fue muy mesurado, y por eso han contestado."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La reunión de vecinos"
    body: "Casi todos llegaron a la junta con ganas de pelea. Su hermana habló la última, con datos y sin subir la voz. «Lo mesurado no es lo blando», explicó luego en casa. «Yo dije lo mismo que ellos, pero a mí me escucharon entero»."
    before_phrase: "Lo dije tranquila, sin gritar."
    after_phrase: "Lo mesurado no es lo blando."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "El grupo y la cuenta"
    body: "El chat del grupo ardía por una cuenta mal repartida. Entonces escribió Patricia: doce líneas, cero reproches, una tabla. «Qué mesurada», puso alguien. La discusión se cerró en nueve minutos y la tabla se quedó fijada arriba."
    before_phrase: "Lo escribió con calma y sin echar nada en cara."
    after_phrase: "Qué mesurada, y qué rápido se cerró."
