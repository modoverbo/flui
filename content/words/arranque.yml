readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Los tres minutos perdidos"
    body: "Elsa presentaba el proyecto por tercera vez y siempre pasaba igual: a los tres minutos la sala ya miraba el teléfono. Su compañero se lo dijo claro: «El contenido está bien; lo que falla es el arranque». Empezó por la cifra final y aquella vez nadie miró el teléfono."
    before_phrase: "No sé por qué la gente se despista al principio."
    after_phrase: "Lo que falla es el arranque."
  - position: 2
    scene: "entrevista"
    conversation_type: "practica"
    title: "Veinte segundos"
    body: "Casimiro se preparaba la respuesta larga y descuidaba la primera frase. En la sexta entrevista cambió de método: escribió un arranque de veinte segundos y lo repitió en voz alta hasta que le salió solo. «Vengo de compras y quiero llevarlo a proveedores»."
    before_phrase: "Pues bueno, no sé muy bien por dónde empezar."
    after_phrase: "Llevo el arranque preparado."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "El documental del sofá"
    body: "Marcela puso un documental sin muchas ganas y acabó viéndolo entero. «Es el arranque», le explicó luego a su vecina. «Los primeros dos minutos no te dejan levantarte». Su vecina lo puso esa misma noche y le pasó lo mismo."
    before_phrase: "El principio está muy bien hecho."
    after_phrase: "Es el arranque: no te deja levantarte."
