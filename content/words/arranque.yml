    difference: "Un «arrebato» es un impulso repentino que te hace actuar sin pensar; la otra palabra nombra el comienzo de algo."
    memory_trick: "El arrebato llega de golpe y a mitad; el comienzo va siempre delante."
  - confused_with: "portada"
    difference: "La «portada» es la primera página que alguien ve; la otra palabra es cómo suenan tus primeras frases."
    memory_trick: "La portada se mira; el comienzo se escucha."
