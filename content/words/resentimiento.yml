    title: "La broma que no fue graciosa"
    body: "En cada asado, alguien repetía la misma broma sobre el año en que Estela lloró en la boda de su prima. Ella siempre se reía también, pero un día explotó: «Llevo años con resentimiento por esa broma, y nunca dije nada»."
