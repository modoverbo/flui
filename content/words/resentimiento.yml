explanation: "Sentimiento negativo que puede quedar dentro cuando algo te hizo mal y no se dijo."
example_sentence: "Sigue sintiendo un resentimiento silencioso hacia su amigo por aquella broma que nunca se disculpó."
register: "neutral"
pedantry_risk: 1
usage_tip: "Sirve para nombrar algo que se guarda por dentro, aunque digas que ya está todo bien."
when_not_to_use: "No la uses para un enojo que se dice y se resuelve en el momento, ni para una simple molestia pasajera."
collocations:
  - "guardar resentimiento"
  - "sentir resentimiento hacia alguien"
