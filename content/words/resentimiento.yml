    title: "El regalo que nunca llegó"
    body: "Perla nunca mencionó que su hermano se olvidó de su cumpleaños hace tres años, pero cada vez que él hablaba de fechas importantes, ella cambiaba de tema. Un día se lo dijo: «Tengo un resentimiento guardado desde ese cumpleaños, y ya no quiero cargarlo»."
    before_phrase: "Todavía me duele que te hayas olvidado, aunque nunca lo dije."
    after_phrase: "Tengo un resentimiento guardado desde ese cumpleaños."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El proyecto que firmó otro"
    body: "Cuando su compañero recibió todo el crédito por un proyecto que armaron juntos, Cayetano no dijo nada en la reunión. Semanas después, se lo confesó en un café: «Tengo un resentimiento con esto que no se me pasa, y prefiero decírtelo antes de que crezca»."
    before_phrase: "Me sigue molestando que te llevaras el crédito, aunque no dije nada."
    after_phrase: "Tengo un resentimiento con esto que prefiero decirte antes de que crezca."
