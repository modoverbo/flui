    title: "Tres botones"
    body: "Cuando su abuelo se quejó de no entender el celular nuevo, Lucía se sentó con él y le mostró solo tres botones, uno por uno. Al rato, él ya mandaba mensajes de voz. «Qué sencillez, hija, así sí puedo», dijo, aliviado."
    before_phrase: "Explícamelo fácil, sin tanta vuelta."
    after_phrase: "Explícamelo con sencillez."
