    body: "Después de que tres personas nuevas preguntaran lo mismo, Bruno rehízo el instructivo de la impresora en pasos numerados y sin jerga. Esa semana, nadie volvió a pedirle ayuda. «Con esa sencillez, hasta yo lo entendí», le dijo su compañero."
    before_phrase: "Que sea fácil de seguir, sin vueltas."
    after_phrase: "Que tenga sencillez."
