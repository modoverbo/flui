    scene: "social"
    conversation_type: "social"
    title: "Reglas de una línea"
    body: "Para el cumpleaños de su hijo, Marisol armó los juegos con reglas de una sola línea cada uno. Ningún niño se quedó sin entender qué hacer. Otra mamá le preguntó cómo lo había logrado: «Todo está en la sencillez», respondió Marisol sonriendo."
    before_phrase: "Hazlo fácil, para que todos entiendan."
    after_phrase: "Hazlo con sencillez."
