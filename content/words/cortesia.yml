explanation: "Atención y cuidado que se tiene con la gente que uno no conoce."
example_sentence: "Le cedió el paso por pura cortesía, sin conocerla de nada."
register: "neutral"
pedantry_risk: 1
usage_tip: "Sirve para nombrar un gesto amable pequeño, del tipo que abre una charla sin comprometer nada."
when_not_to_use: "No la uses para hablar de seguir reglas o un protocolo estricto; cortesía es calidez en el trato, no cumplir un formulismo."
collocations:
  - "por cortesía"
