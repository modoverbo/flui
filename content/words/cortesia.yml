confusions:
  - confused_with: "cortedad"
    difference: "«Cortedad» es timidez o falta de soltura al hablar; «cortesía» es un trato amable y atento con los demás, no un rasgo tímido."
    memory_trick: "La cortedad encoge; la cortesía acerca."
  - confused_with: "formalidad"
    difference: "«Formalidad» es seguir las reglas o el protocolo de una situación; «cortesía» es la calidez del trato, tenga o no reglas de por medio."
exercises:
  - position: 1
    sentence: "Aunque Tadeo es tímido, saludó a todos en la mesa del evento con una {{blank}} que sorprendió a los que ya lo conocían."
    hint_general: "Habla de un gesto amable y atento hacia otra persona, sin ser un rasgo de carácter general."
    explanation: "Cortesía: un gesto amable y atento, puntual. «Cortedad» es timidez, y la frase dice justo lo contrario: Tadeo, siendo tímido, saludó a todos igual, y «amabilidad» describe un carácter general, no el gesto puntual de saludar a todos."
    options:
      - position: 1
        text: "cortedad"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Cortedad» es timidez o falta de soltura al hablar, y la frase dice justo lo contrario: Tadeo, siendo tímido, saludó a todos igual."
        hint_specific: "«Cortedad» es timidez. ¿Qué hizo Tadeo a pesar de ser tímido?"
      - position: 2
        text: "cortesía"
        is_correct: true
      - position: 3
        text: "amabilidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Amabilidad» describe un carácter agradable en general, y aquí lo que sorprendió fue un gesto puntual: saludar a todos en la mesa."
        hint_specific: "«Amabilidad» describe un carácter general. ¿La frase habla de su carácter o de un gesto puntual?"
  - position: 2
    sentence: "Otilia le abrió la puerta y le cedió el primer lugar en la fila del bufet a la abuela del novio, un gesto de {{blank}} que no pasó desapercibido."
    hint_general: "Se refiere a un gesto amable y atento hacia alguien, sin ninguna intención romántica ni ceremonial."
    explanation: "Cortesía: un gesto amable y atento hacia alguien. «Cortejo» habla de pretender a alguien románticamente o de un desfile, y aquí no hay nada de eso, y «formalidad» es seguir una regla, cuando fue un gesto espontáneo."
    options:
      - position: 1
        text: "cortejo"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Cortejo» habla de pretender a alguien románticamente o de un desfile ceremonial, y aquí Otilia solo ayudó a la abuela del novio, sin ninguna intención romántica."
        hint_specific: "«Cortejo» tiene que ver con pretender a alguien o con un desfile. ¿Hay algo de eso en el gesto de Otilia?"
      - position: 2
        text: "cortesía"
        is_correct: true
      - position: 3
        text: "formalidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Formalidad» es seguir una regla o un protocolo, y aquí nadie le pidió a Otilia que hiciera nada: fue un gesto espontáneo."
        hint_specific: "«Formalidad» supone seguir una regla. ¿Alguien le pidió a Otilia que cediera el lugar?"
  - position: 3
    sentence: "Abel saludó al director con la misma {{blank}} con la que saludó al chico de seguridad, sin distinguir a nadie."
    hint_general: "Apunta a un trato amable igual para cualquiera, sin buscar quedar bien con nadie en particular."
    explanation: "Cortesía: un trato amable igual para cualquiera. «Coba» es coloquial y es un halago interesado con quien tiene poder, y aquí Abel trató igual a los dos, y «atención» es cuidar necesidades, no el trato igualitario que aquí se destaca."
    options:
      - position: 1
        text: "coba"
        is_correct: false
        distractor_type: "register"
        why_not: "«Coba» es coloquial y es un halago interesado para quedar bien con alguien poderoso, y aquí Abel trató igual al director y al de seguridad, sin buscar nada de nadie."
        hint_specific: "«Coba» busca quedar bien con alguien con poder. ¿Abel trató distinto al director que al de seguridad?"
      - position: 2
        text: "cortesía"
        is_correct: true
      - position: 3
        text: "atención"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Atención» es notar y cuidar las necesidades de alguien, y lo que aquí se destaca es que trató igual a los dos, sin importar el puesto de cada uno."
        hint_specific: "«Atención» habla de cuidar necesidades. ¿Qué se destaca aquí: el cuidado o el trato igualitario?"
  - position: 4
    sentence: "En el ascensor, Fabiola saludó al vecino nuevo del piso doce con una {{blank}} sencilla, sin ningún formulario ni nada que firmar."
    hint_general: "Habla de un gesto amable simple, sin necesidad de ningún trámite ni sistema formal."
    explanation: "Cortesía: un gesto amable simple, sin trámite alguno. «Etiqueta» es un sistema formal de modales, y aquí solo hubo un saludo sencillo, y «educación» describe un rasgo general de crianza, no el gesto puntual del ascensor."
    options:
      - position: 1
        text: "etiqueta"
        is_correct: false
        distractor_type: "register"
        why_not: "«Etiqueta» es un sistema formal de modales, como el protocolo de una cena elegante, y aquí solo hubo un saludo sencillo en un ascensor."
        hint_specific: "«Etiqueta» suena a un sistema formal de modales. ¿El saludo de Fabiola necesitaba algo tan formal?"
      - position: 2
        text: "cortesía"
        is_correct: true
      - position: 3
        text: "educación"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Educación» describe la crianza y los modales de alguien en general, y la frase señala un gesto puntual: el saludo sencillo en el ascensor."
        hint_specific: "«Educación» describe un rasgo general de crianza. ¿La frase habla de su crianza o de un saludo puntual?"
  - position: 5
    sentence: "Renzo acompañó a la nueva del curso hasta la puerta correcta cuando se equivocó de salón; fue pura {{blank}}, y ella se lo agradeció todo el día."
    hint_general: "Se refiere a un gesto amable simple, sin que nadie pasara vergüenza ni diera lástima."
    explanation: "Cortesía: un gesto amable simple. «Delicadeza» pone el foco en suavizar un momento incómodo, y la frase no dice que ella pasara vergüenza, y «compasión» es sentir pena, cuando Renzo solo la acompañó."
    options:
      - position: 1
        text: "delicadeza"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Delicadeza» pone el foco en suavizar un momento incómodo o vergonzoso, y la frase solo cuenta que se equivocó de salón, sin decir que pasara vergüenza."
        hint_specific: "«Delicadeza» suaviza algo incómodo. ¿La frase dice que ella pasó vergüenza?"
      - position: 2
        text: "cortesía"
        is_correct: true
      - position: 3
        text: "compasión"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Compasión» es sentir pena por alguien, y la frase no dice que Renzo sintiera pena, solo que la acompañó hasta la puerta correcta."
        hint_specific: "«Compasión» es sentir pena. ¿La frase dice que Renzo sintió pena por ella?"
  - position: 6
    sentence: "Cuando notó que el invitado nuevo no sabía qué responder, Bárbara cambió de tema con una {{blank}} que nadie más notó."
    hint_general: "Apunta a un gesto amable que resuelve un momento incómodo sin que nadie más lo note."
    explanation: "Cortesía: un gesto amable que resolvió un momento incómodo. «Consideración» necesita decir hacia quién se tiene, algo que la frase no aclara, y «diplomacia» supone manejar un conflicto, cuando aquí no había ninguno."
    options:
      - position: 1
        text: "consideración"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Consideración» necesita decir hacia quién o hacia qué se tiene, y la frase no lo dice: solo describe el gesto en sí de cambiar de tema."
        hint_specific: "«Consideración» pide un hacia quién explícito. ¿La frase lo dice?"
      - position: 2
        text: "cortesía"
        is_correct: true
      - position: 3
        text: "diplomacia"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Diplomacia» supone manejar un conflicto o una tensión entre partes, y aquí no había ningún conflicto, solo un tema incómodo que Bárbara cambió con suavidad."
        hint_specific: "«Diplomacia» maneja conflictos. ¿Había algún conflicto en esa fiesta?"
  - position: 7
    sentence: "Que Jonás le cediera el paso a la señora de la fila fue una {{blank}} que la hizo sonreír todo el trayecto."
    hint_general: "Habla de un gesto amable hacia alguien, sin que tenga que ver con su edad o su cargo."
    explanation: "Cortesía: un gesto amable hacia alguien, sin más. «Deferencia» supone ceder por respeto a la jerarquía de alguien, y Jonás no sabía nada de esa señora, y «elegancia» describe estilo, no el gesto amable en sí."
    options:
      - position: 1
        text: "deferencia"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Deferencia» supone ceder por respeto a la autoridad o la jerarquía de alguien, y aquí Jonás no conocía a esa señora ni su posición: fue un gesto simple hacia una desconocida."
        hint_specific: "«Deferencia» respeta jerarquía. ¿Jonás sabía algo sobre la posición de esa señora?"
      - position: 2
        text: "cortesía"
        is_correct: true
      - position: 3
        text: "elegancia"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Elegancia» describe la gracia con la que se hace algo, y la frase no habla de estilo, sino del gesto amable en sí de cederle el paso."
        hint_specific: "«Elegancia» habla de estilo. ¿La frase describe estilo o un gesto amable?"
  - position: 8
    sentence: "Sin ser el dueño de la casa, Dante recibió al invitado despistado con una {{blank}} que hizo que se sintiera bienvenido enseguida."
    hint_general: "Se refiere a un gesto amable pequeño, sin que la persona sea quien recibe en su propia casa."
    explanation: "Cortesía: un gesto amable pequeño de cualquiera, no solo del dueño de casa. «Hospitalidad» la ofrece quien recibe en su propia casa, y Dante no era el dueño, y «generosidad» implica dar algo grande, cuando aquí solo hubo un gesto pequeño."
    options:
      - position: 1
        text: "hospitalidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Hospitalidad» es el trato que da quien recibe en su propia casa, y la frase aclara que Dante no era el dueño de la casa."
        hint_specific: "«Hospitalidad» la ofrece el dueño de casa. ¿Dante era el dueño de esa casa?"
      - position: 2
        text: "cortesía"
        is_correct: true
      - position: 3
        text: "generosidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Generosidad» implica dar algo de valor, tiempo o esfuerzo de más, y aquí solo hubo un gesto pequeño para que el invitado se sintiera bienvenido."
        hint_specific: "«Generosidad» implica dar algo grande. ¿Qué tan grande fue el gesto de Dante?"
readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "La silla cedida"
    body: "En la boda, un señor mayor no encontraba dónde sentarse. Vidal, sin conocerlo de nada, le cedió su silla y se quedó de pie el resto del brindis. Fue pura cortesía, y el señor no dejó de agradecérselo toda la noche."
    before_phrase: "Le hice un favor sin conocerlo."
    after_phrase: "Fue pura cortesía, y no dejó de agradecerlo."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "El yerno que ayudó sin que se lo pidieran"
    body: "En la comida familiar, el novio nuevo de mi hermana se levantó solo para ayudar a recoger los platos, sin que nadie se lo pidiera. Mi madre lo notó enseguida: «Qué cortesía la de este chico», dijo, y desde ese día lo trata como de la familia."
    before_phrase: "Qué detalle tan bonito de su parte."
    after_phrase: "Qué cortesía la de este chico."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El café que nadie pidió"
    body: "El primer día, Aitana le llevó un café a la persona nueva del equipo sin que nadie se lo indicara. Fue una cortesía pequeña, pero bastó para que él se sintiera bienvenido antes de la primera reunión."
    before_phrase: "Le hice un gesto pequeño para que se sintiera bien."
    after_phrase: "Fue una cortesía pequeña, y se sintió bienvenido."
