    title: "Dónde empieza lo mío"
    body: "El encargo ocupaba tres líneas y cada uno entendió una cosa. En la reunión del viernes alguien lo dijo sin rodeos: «No es que sea difícil, es que es difuso». Lo reescribieron entre todos y salió media página, con nombres al lado de cada punto."
    before_phrase: "No se entiende bien qué quieren, la verdad."
    after_phrase: "No es difícil, es difuso."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La foto movida"
    body: "Mi tía me preguntó por la casa del pueblo, la de antes. Tengo un recuerdo difuso: sé que había un patio y una puerta verde, y ahí se acaba. «No la has olvidado», me dijo. «La tienes como una foto movida». Buscamos fotos de verdad esa tarde."
    before_phrase: "Me acuerdo a medias, no sé."
    after_phrase: "Tengo un recuerdo difuso, como una foto movida."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "Las dos comisiones"
    body: "En la asociación había dos comisiones y ninguna sabía dónde acababa la suya. Pedían lo mismo dos veces y se molestaban por turnos. «El límite está difuso», dijo alguien por fin, y lo dibujaron en una hoja. Dejaron de pisarse ese mismo mes."
    before_phrase: "Es que nunca se sabe a quién le toca."
    after_phrase: "El límite está difuso; vamos a dibujarlo."
