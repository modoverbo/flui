    title: "El informe que sí se leyó"
    body: "El jefe pidió un resumen del trimestre y esperaba diez minutos de números. Nuria lo presentó con tanta viveza que la sala se rió dos veces antes de llegar a la última diapositiva. «Así sí se entienden las cifras», dijo alguien al salir."
    before_phrase: "Lo explica muy bien y no aburre a nadie."
    after_phrase: "Lo explica con mucha viveza."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "La historia de siempre"
    body: "Cada Navidad, el tío contaba la misma anécdota del asado quemado, y cada año sonaba distinta. La abuela decía que era su viveza la que la hacía nueva cada vez, aunque los detalles fueran los mismos de siempre. Este año, hasta el primo más pequeño se quedó a escucharla completa."
    before_phrase: "Cuenta lo mismo de siempre, pero de una forma que engancha."
    after_phrase: "Lo cuenta con una viveza que engancha."
