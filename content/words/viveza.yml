    title: "La sobremesa que no acababa"
    body: "Nadie quería levantarse de la mesa mientras Tomás seguía hablando. Contaba el viaje en tren con tanta viveza —las voces, las pausas, el final inesperado— que hasta quien ya lo había escuchado antes volvió a reírse. «Cuéntalo otra vez», le pidieron, y él no se hizo de rogar."
    before_phrase: "Cuenta las cosas muy bien, hace reír a todos."
    after_phrase: "Cuenta las cosas con mucha viveza."
  - position: 2
    scene: "trabajo"
