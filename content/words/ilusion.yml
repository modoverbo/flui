        text: "capricho"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Capricho» es un antojo pasajero y egoísta, y aquí lo que siente Bautista es algo que hacía tiempo no sentía por nadie, más profundo que un antojo."
        hint_specific: "El capricho es pasajero y egoísta. ¿Qué dice la frase sobre cuánto tiempo llevaba sin sentir esto?"
      - position: 2
