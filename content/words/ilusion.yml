        why_not: "«Emoción» nombra una reacción a algo que ya está pasando, y aquí Bautista piensa en la próxima cita, algo que todavía no ha llegado."
        hint_specific: "La emoción reacciona a algo que ya pasa. ¿En qué piensa Bautista mientras responde el mensaje?"
  - position: 7
    sentence: "«¿Por qué sonríes solo viendo el teléfono?», le preguntó su compañera de piso a Estela. «Ya quedamos para el viernes, y tengo {{blank}} pensando en eso», respondió, sin dejar de mirar la pantalla."
    hint_general: "Piensa en disfrutar de antemano un plan ya confirmado, no en esperar algo incierto."
    explanation: "Ilusión: disfrutar de antemano un plan que ya está confirmado. «Esperanza» sería esperar que algo incierto pase, y aquí ya quedaron para el viernes, no hay nada incierto; «capricho» es un antojo pasajero y trivial, y sonreír pensando en un plan ya hecho no es trivial."
    options:
