confusions:
  - confused_with: "alusión"
    difference: "«Alusión» es una referencia o mención indirecta a algo; la ilusión es la alegría y las ganas por algo que aún no pasa."
    memory_trick: "La alusión menciona; la ilusión espera."
  - confused_with: "capricho"
    difference: "«Capricho» es un antojo pasajero sin más motivo que el gusto; la ilusión es una alegría sostenida por algo que de verdad importa."
exercises:
  - position: 1
    sentence: "A Wanda le hace tanta {{blank}} la cita del sábado, ya confirmada, que lleva tres días imaginando cada detalle como si ya estuviera pasando."
    hint_general: "Piensa en disfrutar por adelantado algo que ya sabes que va a pasar, no en desear que ocurra."
    explanation: "Ilusión: disfrutar por adelantado algo que ya sabes que va a pasar. «Alusión» es una referencia a algo, no un sentimiento de ganas; «esperanza» admite que el resultado puede no darse, y no implica disfrutar ya, solo desear que ocurra, y aquí la cita ya está confirmada."
    options:
      - position: 1
        text: "alusión"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Alusión» es una referencia o mención a algo, y aquí no se menciona nada: es un sentimiento de ganas por la cita."
        hint_specific: "Una alusión menciona algo indirectamente. ¿La frase menciona algo o describe un sentimiento?"
      - position: 2
        text: "ilusión"
        is_correct: true
      - position: 3
        text: "esperanza"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Esperanza» admite que el resultado puede no darse, y aquí la cita ya está confirmada: Wanda ya disfruta por adelantado, no solo desea que pase."
        hint_specific: "La esperanza desea algo incierto, sin disfrutarlo todavía. ¿Wanda ya disfruta imaginando la cita, o solo desea que pase?"
  - position: 2
    sentence: "Gaspar llevaba dos semanas escribiéndole a alguien que conoció en una boda, y vivía todo el día con {{blank}}, esperando el mensaje siguiente."
    hint_general: "Es la alegría real de algo que sí está pasando, no algo imaginado."
    explanation: "Ilusión: la alegría real de una conversación que sí está pasando. «Ilusionismo» es el arte de la magia de escenario, y no tiene que ver con esto; «fantasía» sugiere algo imaginado que no es real, y aquí los mensajes van y vienen de verdad."
    options:
      - position: 1
        text: "ilusionismo"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Ilusionismo» es el arte de la magia de escenario, y no tiene relación con esperar un mensaje de alguien."
        hint_specific: "El ilusionismo son trucos de magia. ¿Qué tiene que ver eso con esta situación?"
      - position: 2
        text: "fantasía"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Fantasía» sugiere algo imaginado que no es real, y aquí los mensajes van y vienen de verdad entre los dos."
        hint_specific: "La fantasía es algo imaginado. ¿Los mensajes de esta historia son reales o inventados?"
      - position: 3
        text: "ilusión"
        is_correct: true
  - position: 3
    sentence: "Eso que siente Renzo en el estómago cada vez que ella contesta rápido tiene un nombre sencillo: {{blank}}."
    hint_general: "Se trata de la alegría y las ganas completas, no solo la sensación física."
    explanation: "Ilusión: nombra ese conjunto de alegría y ganas, no solo la sensación física. «Cosquilleo» es solo la sensación en el cuerpo, sin nombrar la alegría que hay detrás; «capricho» es un antojo pasajero por algo trivial, y aquí lo que siente Renzo no es trivial."
    options:
      - position: 1
        text: "cosquilleo"
        is_correct: false
        distractor_type: "register"
        why_not: "«Cosquilleo» nombra solo la sensación física en el cuerpo, sin nombrar la alegría y las ganas que hay detrás."
        hint_specific: "El cosquilleo es solo físico. ¿Qué más hay detrás de esa sensación, según la frase?"
      - position: 2
        text: "capricho"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Capricho» es un antojo pasajero por algo trivial, y lo que siente Renzo por esta persona no es nada trivial."
        hint_specific: "El capricho es por algo sin importancia. ¿Esto le importa poco o mucho a Renzo?"
      - position: 3
        text: "ilusión"
        is_correct: true
  - position: 4
    sentence: "Mirta llevaba tres días practicando frente al espejo qué decir en la cena de esta noche, mucho antes de que pasara nada, de tanta {{blank}} que le tenía."
    hint_general: "Piensa en disfrutar por adelantado algo que todavía no pasa, no en una reacción a algo que ya está pasando."
    explanation: "Ilusión: disfrutar por adelantado algo que todavía no pasa. «Manía» suele ser una aversión negativa hacia algo o alguien, lo contrario de lo que siente Mirta; «emoción» nombra una reacción a algo que ya está pasando, y aquí ella lleva tres días anticipándolo, antes de que ocurra nada."
    options:
      - position: 1
        text: "manía"
        is_correct: false
        distractor_type: "register"
        why_not: "«Manía» suele describir una aversión o un rechazo hacia algo, justo lo contrario de las ganas felices que tiene Mirta por esta cena."
        hint_specific: "La manía suele ser negativa. ¿Mirta siente algo negativo por esta cena?"
      - position: 2
        text: "emoción"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Emoción» nombra una reacción a algo que ya está pasando, y aquí Mirta lleva tres días anticipando la cena, antes de que ocurra nada."
        hint_specific: "La emoción reacciona a algo que ya pasa. ¿Cuánto antes de la cena empezó a practicar Mirta?"
      - position: 3
        text: "ilusión"
        is_correct: true
  - position: 5
    sentence: "Otilia llegó quince minutos antes a la segunda cita —ya confirmada desde el lunes—, llena de {{blank}}, disfrutando de antemano cada minuto que faltaba."
    hint_general: "Piensa en disfrutar de antemano algo real y ya confirmado, no en algo incierto o imaginado."
    explanation: "Ilusión: disfrutar de antemano algo real y ya confirmado. «Esperanza» sugiere que el resultado es incierto, y aquí la cita estaba confirmada desde el lunes, y ella ya disfrutaba antes de que pasara; «fantasía» sugiere algo imaginado, y una cita real y programada no lo es."
    options:
      - position: 1
        text: "esperanza"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Esperanza» sugiere que el resultado es incierto, y aquí la cita estaba confirmada desde el lunes: Otilia ya disfrutaba, no solo deseaba que pasara."
        hint_specific: "La esperanza duda del resultado. ¿Desde cuándo estaba confirmada esta cita?"
