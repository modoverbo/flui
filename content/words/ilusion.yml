    scene: "social"
    conversation_type: "social"
    title: "La cuenta regresiva"
    body: "Faltaban tres días para la cita y Bautista ya había revisado el menú del restaurante dos veces. Se lo contó a su compañero de piso, medio avergonzado. «No te rías, pero me hace mucha ilusión», le dijo. Su compañero sonrió: «Se nota, llevas toda la semana de buen humor»."
    before_phrase: "Estoy como loco esperando que llegue el sábado."
    after_phrase: "Me hace mucha ilusión esta cita."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La llamada a mi madre"
    body: "Jimena llamó a su madre después de la primera cita, todavía con la sonrisa puesta. «Me hizo mucha ilusión, mamá, hacía tiempo que no me pasaba», le contó. Su madre se rio: «Se te nota en la voz, hija; cuéntamelo todo»."
    before_phrase: "Estoy feliz, hacía tiempo que no me pasaba."
    after_phrase: "Me hizo mucha ilusión, hacía tiempo que no me pasaba."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El comentario en la pausa"
    body: "En la pausa del café, Damián le contó a una compañera que tenía una segunda cita esa noche. «Se me nota la ilusión, ¿verdad?», le preguntó, un poco nervioso. Ella se rio: «Un poco, sí, pero te queda bien»."
    before_phrase: "Se me nota que estoy contento, ¿no?"
    after_phrase: "Se me nota la ilusión, ¿verdad?"
