        distractor_type: "near_synonym"
        why_not: "«Capricho» es un antojo pasajero y trivial, y sonreír pensando en un plan ya confirmado con alguien que le importa no es nada trivial."
        hint_specific: "El capricho es trivial y pasajero. ¿Estela tiene ya un plan confirmado, o solo una idea pasajera?"
  - position: 8
    sentence: "Perla ya le contó a tres amigas cómo conoció a su próxima cita, contagiada de {{blank}} de solo pensar en volver a verlo, aunque todavía faltan varios días."
    hint_general: "Piensa en disfrutar por adelantado algo que todavía falta, no en una reacción a algo que ya está pasando."
