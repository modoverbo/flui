confusions:
  - confused_with: "verosímil"
    difference: "«Verosímil» dice que algo parece cierto porque encaja, aunque no esté comprobado; esto afirma que es cierto de verdad."
    memory_trick: "Lo veraz está probado; lo verosímil solo se sostiene de pie."
  - confused_with: "verificable"
    difference: "«Verificable» describe un dato que se puede comprobar; esto describe a quien dice la verdad, se compruebe o no en el momento."
    memory_trick: "Veraz es la persona; verificable es el dato."
