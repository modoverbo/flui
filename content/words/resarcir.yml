    title: "Tres semanas sin coche"
    body: "El taller tardó tres semanas en una reparación de dos días. Cuando la clienta fue a recogerlo, el encargado no se escondió: «Nos hemos pasado y queremos resarcirla: dos revisiones a nuestra cuenta». Ella volvió al año siguiente."
    before_phrase: "Le vamos a compensar de alguna manera, no se preocupe."
    after_phrase: "Nos hemos pasado y queremos resarcirla."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La firma"
    body: "Damián firmó un papel que comprometía a su hermana y tardó un año en poder arreglarlo. No le mandó regalos ni flores: le devolvió cada euro y se lo dijo de frente. «No busco que me perdones hoy; busco resarcirte». Ella tardó otro año, pero volvió."
    before_phrase: "Voy a compensarte como sea, te lo prometo."
    after_phrase: "No busco perdón hoy; busco resarcirte."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "El plantón del mes pasado"
    body: "Yago dejó tirado a su amigo en el aeropuerto y se pasó semanas disculpándose por mensaje. En la mudanza del mes siguiente apareció a las ocho de la mañana con la furgoneta. «Esto es para resarcirte», dijo. Cargaron cajas hasta las seis y quedó saldado."
    before_phrase: "Te debo una bien gorda por lo del otro día."
    after_phrase: "Esto es para resarcirte por lo del aeropuerto."
