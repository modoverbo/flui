confusions:
  - confused_with: "rescatar"
    difference: "«Rescatar» es sacar a alguien de un peligro o de un apuro; la otra palabra llega después y paga un daño ya hecho."
    memory_trick: "Rescatas durante; lo otro, después."
  - confused_with: "premiar"
    difference: "«Premiar» reconoce algo que alguien hizo bien; la otra palabra compensa algo que alguien sufrió."
    memory_trick: "El premio celebra; lo otro repara."
exercises:
