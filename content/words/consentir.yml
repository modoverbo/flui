    conversation_type: "social"
    title: "El viernes de Nadia"
    body: "Llevaba meses aguantando bromas sobre su acento y riéndose por no estropear la cena. Aquel viernes dijo una frase corta: «Esto ya no lo consiento». Hubo un silencio de tres segundos y después la conversación siguió, sin bromas."
