confusions:
  - confused_with: "caricatura"
    difference: "«Caricatura» exagera uno o dos rasgos sueltos de algo o alguien; esta palabra imita el estilo completo de una obra, con escenas y personajes."
    memory_trick: "Esta palabra imita la obra entera; la caricatura exagera un rasgo suelto."
  - confused_with: "imitación"
    difference: "«Imitación» solo copia algo, sin más intención; esta palabra copia el estilo de algo, pero exagerado y con gracia."
    memory_trick: "La imitación copia; esta palabra copia y además hace reír."
  - confused_with: "parafrasear"
    difference: "«Parafrasear» repite la idea de alguien con tus propias palabras, con respeto y para confirmar que la entendiste; una parodia imita el estilo de algo para burlarse o divertir."
    memory_trick: "Parafraseas para entender mejor; parodias para hacer reír."
  - confused_with: "ridiculizar"
    difference: "«Ridiculizar» busca dejar mal a algo o a alguien, no solo imitarlo; una parodia imita el estilo de algo para divertir, sin necesariamente atacarlo."
    memory_trick: "Ridiculizar apunta al fallo; la parodia copia el estilo."
exercises:
  - position: 1
    sentence: "El grupo de comedia de Nadia subió un video con una {{blank}} del videoclip más visto del verano, cambiando la letra por completo."
    hint_general: "Es una versión que copia el estilo del videoclip, pero cambiada por completo para dar gracia."
    explanation: "Parodia: una versión que copia el estilo, pero cambiada para dar gracia. «Paradoja» es una idea que parece contradictoria, sin relación con un video, y «imitación» copiaría el videoclip tal cual, sin cambiar la letra."
    options:
      - position: 1
        text: "paradoja"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Paradoja» es una idea que parece contradictoria pero puede ser cierta, y aquí no hay ninguna idea rara: hay un video que imita el estilo del videoclip para hacer gracia."
        hint_specific: "«Paradoja» es una idea, no un video. ¿El grupo subió una idea contradictoria o un video gracioso?"
      - position: 2
        text: "parodia"
        is_correct: true
      - position: 3
        text: "imitación"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Imitación» copiaría el videoclip tal cual, y aquí el grupo cambia la letra por completo para hacer gracia, no solo copia."
