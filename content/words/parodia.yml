readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "El video del verano"
    body: "El video de Nadia y su grupo llevaba dos días circulando: la misma coreografía del videoclip más visto del verano, pero con una letra que hablaba del tráfico y las facturas. «Es una parodia, no nos vayan a demandar», bromeó Nadia en la descripción. Ya llevaba medio millón de reproducciones."
    before_phrase: "Hicimos una versión graciosa del videoclip, cambiándole todo."
    after_phrase: "Hicimos una parodia del videoclip."
  - position: 2
    scene: "trabajo"
    conversation_type: "practica"
    title: "Los jefes en la pantalla"
    body: "El equipo de Rodrigo proyectó su corto en la fiesta de la oficina: los jefes reales, interpretados por sus asistentes, resolviendo una crisis con una calculadora rota. La sala entera se reía a carcajadas, incluidos los jefes. «Buena parodia», dijo uno de ellos al final, aplaudiendo con el resto."
    before_phrase: "Hicimos un video gracioso imitando a los jefes."
    after_phrase: "Hicimos una parodia de los jefes."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "La obra de la sobremesa"
    body: "En la sobremesa, los primos improvisaron una versión de la última pelea familiar, exagerando cada grito y cada portazo. Todos terminaron llorando de risa, incluida la tía que había protagonizado la pelea real. «Qué parodia tan buena de mi drama», dijo ella, sirviéndose más café."
    before_phrase: "Hicieron una versión graciosa y exagerada de la pelea, y me reí de mí misma."
    after_phrase: "Hicieron una parodia de mi drama, y me reí de mí misma."
