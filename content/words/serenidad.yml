readings:
  - position: 1
    scene: "entrevista"
    conversation_type: "practica"
    title: "La pregunta del día"
    body: "Le guardaron la pregunta más incómoda para el final. Casilda no subió la voz ni miró al techo: contestó despacio y con un dato. «Lo que desarmó la sala fue su serenidad», escribió alguien esa noche. Ella lo había preparado, y aun así era verdad."
    before_phrase: "No me puse nerviosa, creo."
    after_phrase: "Contesté con serenidad."
  - position: 2
    scene: "trabajo"
    conversation_type: "practica"
    title: "El turno de las quejas"
    body: "Aquel sábado llegaron once quejas seguidas. Uriel las atendió una a una, sin acelerar y sin contagiarse. Cuando terminó el turno, la encargada lo dijo delante de todos: «Lo que salvó la tarde fue tu serenidad»."
    before_phrase: "Mantuve la calma como pude."
    after_phrase: "Lo que salvó la tarde fue la serenidad."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "Una sola vez"
    body: "Mi madre perdió la serenidad una sola vez en veinte años, y fue con el susto del coche. Recuerdo esa tarde por lo rara que resultó. El resto del tiempo, cuando todo se torcía, ella bajaba el tono y ordenaba la casa."
    before_phrase: "Nunca se ponía nerviosa, casi nunca."
    after_phrase: "Perdió la serenidad una sola vez."
