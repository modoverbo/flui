    title: "Quince minutos"
    body: "La reunión estaba prevista para una hora y terminó en quince minutos. Petronila lo explicó al equipo sin presumir: «Lo habíamos hablado previamente, así que solo quedaba decidir». Desde entonces la costumbre es llamar antes y reunirse después."
    before_phrase: "Es que lo habíamos hablado antes, o sea, ya lo sabíamos."
    after_phrase: "Lo habíamos hablado previamente."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "La plaza del taller"
    body: "Dos amigas se plantaron en el taller de cerámica y se quedaron fuera. La tercera lo había leído bien: «Hay que apuntarse previamente en la web». A la semana siguiente fueron las tres, con plaza y con delantal."
    before_phrase: "Hay que apuntarse antes, creo, en la web esa."
    after_phrase: "Hay que apuntarse previamente en la web."
  - position: 3
    scene: "familia"
    conversation_type: "practica"
    title: "La masa de los domingos"
    body: "El pan le salía denso cada domingo y no entendía por qué. Su tía le dio la clave por teléfono en una frase: «La masa tiene que reposar previamente una hora en frío». El domingo siguiente el pan subió, y él llamó para contarlo."
    before_phrase: "Antes hay que dejarla reposar, primero eso."
    after_phrase: "La masa tiene que reposar previamente una hora en frío."
