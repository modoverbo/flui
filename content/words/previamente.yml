confusions:
  - confused_with: "privadamente"
    difference: "«Privadamente» indica que algo se hace en privado, sin público. La otra no habla de intimidad: habla del momento."
    memory_trick: "Una cierra la puerta; la otra mira el reloj."
  - confused_with: "previsiblemente"
    difference: "«Previsiblemente» anuncia lo que se espera que ocurra: «previsiblemente lloverá». La otra sitúa algo que ya pasó antes."
    memory_trick: "Una apuesta por el futuro; la otra ordena el pasado."
