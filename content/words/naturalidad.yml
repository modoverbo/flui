schema_version: 1
sort_order: 8309
slug: "naturalidad"
status: "approved"
lemma: "naturalidad"
part_of_speech: "sustantivo"
syllables:
  - "na"
  - "tu"
  - "ra"
  - "li"
  - "dad"
stressed_syllable: 5
ipa_latam: "[na.tu.ɾa.liˈðad]"
ipa_es: "[na.tu.ɾa.liˈðad]"
explanation: "La manera de actuar tal como uno es, sin cambiar nada por los demás."
example_sentence: "Contó la anécdota con tanta naturalidad que nadie notó lo nerviosa que estaba."
register: "neutral"
pedantry_risk: 1
usage_tip: "Es un elogio para quien no actúa un papel ni busca impresionar; funciona mejor dicho de otra persona que de uno mismo."
when_not_to_use: "No la uses para describir el mundo físico ni los rasgos de una cosa; solo describe la forma de actuar de alguien."
collocations:
  - "con naturalidad"
  - "hablar con naturalidad"
  - "la naturalidad de alguien"
replaces:
  - before: "Habla tal cual es, sin nada forzado"
    after: "Habla con naturalidad"
  - before: "No se le nota nada de nervios ni de teatro"
    after: "Actúa con total naturalidad"
  - before: "Es tal cual es, no finge nada"
    after: "Tiene una naturalidad que se nota"
family:
  - "natural"
themes:
  - slug: "small-talk"
    relevance: 3
  - slug: "elogio-reconocimiento"
    relevance: 2
tags:
  comodin:
    - "tal cual es"
  funcion:
    - "elogiar"
    - "describir"
  canal: "hablado"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "naturaleza"
    difference: "«Naturaleza» es el conjunto de rasgos de algo o del mundo natural; «naturalidad» es la forma de actuar sin fingir nada."
    memory_trick: "La naturaleza es lo que algo es; la naturalidad es cómo alguien actúa."
  - confused_with: "desparpajo"
    difference: "«Desparpajo» es una soltura algo descarada, casi sin filtro; «naturalidad» es solo actuar sin fingir, con o sin descaro."
exercises:
  - position: 1
    sentence: "Mirta es de las que se ponen nerviosísimas hablando en público, pero la {{blank}} con la que presentó su proyecto frente al equipo nuevo hizo que nadie lo notara."
    hint_general: "Habla de cómo actuó alguien en un momento puntual, no de su temperamento de fondo."
    explanation: "Naturalidad: cómo actuó esa vez en concreto. «Naturaleza» sería su temperamento de fondo, y su temperamento es ponerse nerviosísima, y «sencillez» habla de no presumir, no del contraste entre su costumbre y lo que pasó esta vez."
    options:
      - position: 1
        text: "naturaleza"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Naturaleza» sería su temperamento de fondo, y la frase ya dice que su temperamento es ponerse nerviosísima; lo que pasó esa vez fue lo contrario a su naturaleza, no un reflejo de ella."
        hint_specific: "«Naturaleza» sería su temperamento de siempre. ¿Qué dice la frase sobre el temperamento de Mirta?"
      - position: 2
        text: "naturalidad"
        is_correct: true
      - position: 3
        text: "sencillez"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sencillez» habla de no ser pretenciosa, y la frase no cuenta si Mirta se lució o no, sino el contraste entre su costumbre de ponerse nerviosa y que esta vez nadie lo notó."
        hint_specific: "«Sencillez» habla de no presumir. ¿Qué contraste marca la frase sobre Mirta?"
  - position: 2
    sentence: "Ismael improvisó el brindis sin ponerse nervioso ni un segundo, con una {{blank}} que dejó a todos tranquilos, sin sonar sobrado."
    hint_general: "Se refiere a cómo alguien manejó los nervios por dentro, no a si algo estaba planeado."
    explanation: "Naturalidad: cómo lo manejó, sin sonar sobrado. «Caradura» implica descaro sin vergüenza, y la frase aclara que no sonó sobrado, y «espontaneidad» dice si algo estaba planeado, cuando ya se sabe que improvisó."
    options:
      - position: 1
        text: "caradura"
        is_correct: false
        distractor_type: "register"
        why_not: "«Caradura» implica descaro sin ninguna vergüenza, y la frase aclara que no sonó sobrado, todo lo contrario a la caradura."
        hint_specific: "«Caradura» suena a descaro sin vergüenza. ¿La frase dice que Ismael sonó sobrado?"
      - position: 2
        text: "naturalidad"
        is_correct: true
      - position: 3
        text: "espontaneidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Espontaneidad» dice que algo no estaba planeado, y la frase ya cuenta que improvisó: lo que falta describir es cómo lo hizo, sin nervios."
        hint_specific: "«Espontaneidad» dice si algo estaba planeado. ¿Qué describe la frase: si lo planeó o cómo se le notó por dentro?"
  - position: 3
    sentence: "Cuando le preguntaron algo que no sabía, Rita respondió con tanta {{blank}} que nadie se dio cuenta de que estaba improvisando."
    hint_general: "Apunta a cómo sonó alguien al responder, sin acusarlo de pasarse de la raya."
    explanation: "Naturalidad: cómo sonó al responder. «Frescura» en tono coloquial suena a descaro, y la frase no acusa a Rita de nada, y «sinceridad» es decir la verdad, cuando en realidad estaba improvisando."
    options:
      - position: 1
        text: "frescura"
        is_correct: false
        distractor_type: "register"
        why_not: "«Frescura» en tono coloquial suena a descaro, y la frase no dice que Rita se pasara de la raya, solo que nadie notó que improvisaba."
        hint_specific: "«Frescura» coloquial suena a descaro. ¿La frase acusa a Rita de pasarse de la raya?"
      - position: 2
        text: "naturalidad"
        is_correct: true
      - position: 3
        text: "sinceridad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sinceridad» es decir la verdad, y la frase cuenta que Rita estaba improvisando, no necesariamente siendo del todo sincera sobre lo que sabía."
        hint_specific: "«Sinceridad» es decir la verdad. ¿Rita decía toda la verdad o improvisaba?"
  - position: 4
    sentence: "Cayetano bailó en la fiesta de gente que acababa de conocer exactamente igual que baila solo en su cuarto, con una {{blank}} que contagió a media fiesta."
    hint_general: "Habla de actuar igual delante de desconocidos que estando a solas, sin cambiar nada por ellos."
    explanation: "Naturalidad: bailó igual delante de desconocidos que a solas. «Encanto» es una gracia pensada para gustarle a los demás, y aquí bailó igual que solo, sin cambiar nada por el público, y «desenvoltura» no compara las dos situaciones que la frase sí compara."
    options:
      - position: 1
        text: "encanto"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Encanto» es una gracia pensada para gustarle a los demás, y la frase dice justo lo contrario: bailó igual que cuando está solo, sin cambiar nada por el público."
        hint_specific: "«Encanto» se dirige a los demás. ¿La frase dice que cambió algo por el público o que bailó igual que solo?"
      - position: 2
        text: "naturalidad"
        is_correct: true
      - position: 3
        text: "desenvoltura"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Desenvoltura» es sentirse hábil en una situación, pero no dice si actúas igual estando solo o acompañado; la frase compara justo eso: cómo baila solo y cómo baila en la fiesta."
        hint_specific: "«Desenvoltura» no compara dos situaciones. ¿Qué dos situaciones compara la frase?"
  - position: 5
    sentence: "Vidal le contó a la vecina del quinto piso, a quien acababa de conocer, exactamente lo mismo que le habría contado a su mejor amigo: que se había perdido buscando el ascensor tres veces esa semana, con una {{blank}} que la hizo reír."
    hint_general: "Se refiere a tratar igual a un desconocido que a tu mejor amigo, sin adaptar lo que cuentas."
    explanation: "Naturalidad: le contó lo mismo que a su mejor amigo. «Diplomacia» implica cuidar lo que dices según quién escucha, y aquí le contó lo mismo a los dos, y «gracia» no dice si tratarías igual a un desconocido que a tu mejor amigo."
    options:
      - position: 1
        text: "diplomacia"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Diplomacia» implica cuidar lo que dices según quién te escucha, y la frase dice justo lo contrario: le contó a la vecina lo mismo que le habría contado a su mejor amigo."
        hint_specific: "«Diplomacia» adapta el mensaje según quién escucha. ¿La frase dice que Vidal cambió algo para la vecina?"
      - position: 2
        text: "naturalidad"
        is_correct: true
      - position: 3
        text: "gracia"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Gracia» es tener chispa para hacer reír, pero no dice si contarías lo mismo a un desconocido que a tu mejor amigo; eso es justo lo que compara la frase."
        hint_specific: "«Gracia» no compara con quién hablas. ¿Qué comparación hace la frase?"
  - position: 6
    sentence: "En su primera comida con la familia de su novia, Leandro se sirvió el postre sin esperar a que se lo ofrecieran, exactamente como lo haría en su propia casa, con una {{blank}} que a todos les gustó."
    hint_general: "Habla de comportarse en casa ajena exactamente igual que en la propia."
    explanation: "Naturalidad: se comportó en casa ajena igual que en la suya. «Tranquilidad» no dice si cambias tu comportamiento en casa ajena, y «comodidad» tampoco dice si actúas igual que en la tuya."
    options:
      - position: 1
        text: "tranquilidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Tranquilidad» es solo ausencia de nervios, y alguien tranquilo puede igual comportarse distinto por estar en casa ajena; la frase dice que actuó exactamente como en la suya."
        hint_specific: "«Tranquilidad» no dice si cambias de comportamiento en casa ajena. ¿Qué dice la frase sobre cómo actuó Leandro?"
      - position: 2
        text: "naturalidad"
        is_correct: true
      - position: 3
        text: "comodidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Comodidad» es sentirse a gusto, y alguien puede sentirse a gusto y aun así comportarse distinto por estar en casa de otra familia; la frase dice que actuó exactamente igual que en la suya."
        hint_specific: "«Comodidad» no dice si cambias tu comportamiento en casa ajena. ¿Qué dice la frase sobre Leandro?"
  - position: 7
    sentence: "Cuando todos hablaban de un actor que Selene no conocía, ella preguntó quién era exactamente igual que pregunta cualquier otra cosa en el grupo, con una {{blank}} que hizo que nadie se riera."
    hint_general: "Se refiere a no tratar una pregunta distinto de cualquier otra, sin cambiar nada por si suena tonta."
    explanation: "Naturalidad: preguntó igual que siempre, sin cambiar nada. «Seguridad» no dice si cambias cómo preguntas según el tema, y «confianza» tampoco compara cómo tratas distintas preguntas."
    options:
      - position: 1
        text: "seguridad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Seguridad» mide cuán segura se siente alguien, y alguien inseguro puede igual preguntar distinto según el tema; la frase dice que preguntó exactamente igual que cualquier otra cosa, sin cambiar nada."
        hint_specific: "«Seguridad» no dice si cambias cómo preguntas según el tema. ¿Qué dice la frase sobre cómo preguntó Selene?"
      - position: 2
        text: "naturalidad"
        is_correct: true
      - position: 3
        text: "confianza"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Confianza» habla de sentirse segura, y no dice si tratas una pregunta «tonta» distinto de cualquier otra; la frase dice que la hizo exactamente igual que siempre."
        hint_specific: "«Confianza» no compara cómo tratas distintas preguntas. ¿Qué compara la frase?"
readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "El brindis sin ensayar"
    body: "En la boda, le tocó el turno a Bautista sin haberlo planeado. Se levantó, dijo tres frases sobre los novios y se sentó entre risas. Nadie notó el susto que tenía por dentro: fue pura naturalidad, y la mesa entera lo aplaudió."
    before_phrase: "Actué como si nada, aunque estaba temblando por dentro."
    after_phrase: "Actué con naturalidad, aunque temblaba por dentro."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "El postre sin permiso"
    body: "En su primera comida con la familia de su novia, Fabiola se sirvió el postre sin esperar a que se lo ofrecieran. La madre de su novio sonrió: «Me encanta tu naturalidad», le dijo, «aquí ya eres de la casa»."
    before_phrase: "Actué como si ya fuera parte de la familia."
    after_phrase: "Le gustó mi naturalidad, y ya me siento de la casa."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "La pregunta que nadie más hizo"
    body: "En la reunión, todos asentían sin entender un término nuevo. Estela preguntó qué significaba, con tanta naturalidad que dos personas más confesaron que tampoco lo sabían. Nadie se sintió mal por preguntar."
    before_phrase: "Pregunté sin miedo a sonar tonta."
    after_phrase: "Pregunté con naturalidad, y nadie se sintió mal."
