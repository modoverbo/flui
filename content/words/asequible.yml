    difference: "«Accesible» es lo fácil de alcanzar o de entender, y también la persona de trato abierto; la otra palabra habla de lo que está a tu alcance conseguir o pagar."
    memory_trick: "A lo accesible llegas; lo otro te lo puedes permitir."
  - confused_with: "apetecible"
    difference: "«Apetecible» dice que algo da ganas; la otra palabra no juzga las ganas, solo si está a tu alcance."
    memory_trick: "Lo apetecible te atrae; lo otro te cabe en el bolsillo."
