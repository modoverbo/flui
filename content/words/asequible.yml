schema_version: 1
slug: "asequible"
status: "approved"
lemma: "asequible"
part_of_speech: "adjetivo"
syllables:
  - "a"
  - "se"
  - "qui"
  - "ble"
stressed_syllable: 3
ipa_latam: "[a.seˈki.βle]"
ipa_es: "[a.seˈki.βle]"
explanation: "Que se puede pagar o conseguir sin esfuerzo, porque el precio está dentro de lo que alguien puede gastar."
example_sentence: "Diseñamos el plan más asequible para que ningún cliente se quede fuera por el precio."
register: "neutral"
pedantry_risk: 1
usage_tip: "Úsala para hablar del precio de algo frente a lo que alguien puede pagar, no de si es fácil de entender o de llegar hasta ahí."
when_not_to_use: "No la confundas con algo fácil de entender o de alcanzar físicamente: aquí el tema es el dinero."
collocations:
  - "precio asequible"
  - "plan asequible"
  - "tarifa asequible"
  - "opción asequible"
replaces:
  - before: "Es barato"
    after: "Es asequible"
  - before: "Está al alcance de casi todos"
    after: "Es asequible para casi todos"
  - before: "No es tan caro"
    after: "Es bastante asequible"
family:
  - "asequibilidad"
  - "inasequible"
themes:
  - slug: "ventas"
    relevance: 3
tags:
  comodin:
    - "barato"
    - "económico"
  funcion:
    - "valorar"
  canal: "ambos"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "accesible"
    difference: "«Accesible» dice que algo es fácil de alcanzar, entender o tratar; esta palabra habla del precio, no de si algo se entiende o se llega hasta ahí."
    memory_trick: "Accesible se entiende o se pisa; asequible se paga."
  - confused_with: "barato"
    difference: "«Barato» dice que algo cuesta poco en términos absolutos; esta palabra dice que el precio está dentro de lo que alguien puede pagar, aunque no sea el más bajo del mercado."
    memory_trick: "Barato compara precios; asequible compara con tu bolsillo."
exercises:
  - position: 1
    sentence: "Marcos armó dos planes para el gimnasio, y el básico es tan {{blank}} que hasta los estudiantes lo pagan sin problema."
    hint_general: "Busca la palabra para un precio que cabe en un presupuesto ajustado."
    explanation: "Asequible: el precio cabe en el bolsillo de un estudiante. «Accesible» hablaría de lo fácil que es llegar hasta el gimnasio, y «beneficioso» diría que trae una ventaja, sin hablar del precio."
    options:
      - position: 1
        text: "accesible"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Accesible» diría que el gimnasio es fácil de llegar o de usar, y aquí el tema es cuánto cuesta, no dónde queda."
        hint_specific: "«Accesible» habla de llegar o entender algo, no de cuánto cuesta. ¿La frase habla del camino hasta el gimnasio o del bolsillo?"
      - position: 2
        text: "asequible"
        is_correct: true
      - position: 3
        text: "beneficioso"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Beneficioso» diría que el plan trae una ventaja, sin decir nada sobre si el precio es bajo."
        hint_specific: "«Beneficioso» habla de la ventaja que da algo, no de cuánto sale. ¿La frase habla de plata o de ventajas?"
  - position: 2
    sentence: "Renata bajó la tarifa de su primer paquete para que fuera tan {{blank}} que cualquier emprendedor nuevo pudiera pagarla."
    hint_general: "Piensa en un precio que un negocio que recién empieza sí puede pagar."
    explanation: "Asequible: la tarifa queda dentro de lo que un negocio nuevo puede pagar. «Tirado» es una forma coloquial y fuera de lugar en una propuesta de trabajo, y «rentable» hablaría de la ganancia de Renata, no del gasto del cliente."
    options:
      - position: 1
        text: "tirado"
        is_correct: false
        distractor_type: "register"
        why_not: "«Tirado» es una forma coloquial y exagerada de decir que algo cuesta casi nada, y en una propuesta de trabajo suena poco profesional."
        hint_specific: "«Tirado» es una palabra muy informal para hablar de precios. ¿Encaja en una propuesta seria de trabajo?"
      - position: 2
        text: "asequible"
        is_correct: true
      - position: 3
        text: "rentable"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Rentable» diría que el paquete le deja ganancia a Renata, no que el cliente pueda pagarlo sin apuros."
        hint_specific: "«Rentable» mira lo que gana quien vende, no lo que puede pagar quien compra. ¿La frase habla de quien paga o de quien gana?"
  - position: 3
    sentence: "En la reunión, el gerente del coworking explicó que la membresía es {{blank}}: cuesta lo mismo que las otras del edificio, pero está pensada para caber en el sueldo de quien recién empieza."
    hint_general: "No compara precios entre oficinas; piensa en el sueldo de alguien que recién arranca."
    explanation: "Asequible: la membresía cabe en un sueldo ajustado, aunque cueste igual que las otras. «Razonable» diría que el precio parece justo en sí mismo, y «conveniente» diría que encaja con el momento, no con el sueldo."
    options:
      - position: 1
        text: "razonable"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Razonable» diría que el precio parece justo en sí mismo, y el gerente no habla de justicia, sino de que el monto cabe en un sueldo que recién empieza."
        hint_specific: "«Razonable» dice que un precio parece justo. ¿El gerente habla de justicia o de un sueldo concreto?"
      - position: 2
        text: "asequible"
        is_correct: true
      - position: 3
        text: "conveniente"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Conveniente» diría que la membresía encaja bien con el momento, sin hablar del sueldo de quien la paga."
        hint_specific: "«Conveniente» habla de que algo encaja con el momento, no de que el precio quepa en un sueldo. ¿De qué habla la frase?"
  - position: 4
    sentence: "Diego le explicó a la paciente que el plan de pagos era {{blank}}, con cuotas que no afectaban el resto de sus gastos del mes."
    hint_general: "Las cuotas quedan dentro de lo que la paciente puede gastar sin apretarse."
    explanation: "Asequible: las cuotas caben en el presupuesto de la paciente. «Regalado» exagera como si costara casi nada, y «convincente» hablaría de si el plan la convenció, no de las cuotas."
    options:
      - position: 1
        text: "regalado"
        is_correct: false
        distractor_type: "register"
        why_not: "«Regalado» es una exageración coloquial para decir que algo sale casi gratis, y aquí Diego habla en serio de un plan de pagos, no de una ganga."
        hint_specific: "«Regalado» suena a exageración informal. ¿Diego está exagerando o explicando en serio un plan de pagos?"
      - position: 2
        text: "asequible"
        is_correct: true
      - position: 3
        text: "convincente"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Convincente» diría que el plan logró que la paciente se decidiera, no que las cuotas quepan en su presupuesto."
        hint_specific: "«Convincente» habla de si algo logra convencer, no de si las cuotas caben en el presupuesto. ¿De qué habla la frase?"
  - position: 5
    sentence: "Paula fijó el precio de su curso pensando en que fuera {{blank}} para quien recién empieza a trabajar por su cuenta, sin cobrar de más ni de menos."
    hint_general: "El precio está pensado para alguien que todavía gana poco."
    explanation: "Asequible: el precio piensa en alguien que gana poco todavía. «Fiable» hablaría de si el curso cumple lo que promete, y «moderado» solo diría que el precio no es extremo, sin pensar en esa persona."
    options:
      - position: 1
        text: "fiable"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Fiable» diría que el curso cumple lo que promete, no que su precio sea bajo para alguien que recién empieza."
        hint_specific: "«Fiable» habla de si algo cumple lo prometido, no de su precio. ¿La frase habla de confianza o de dinero?"
      - position: 2
        text: "asequible"
        is_correct: true
      - position: 3
        text: "moderado"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Moderado» diría que el precio no es ni muy alto ni muy bajo en general, sin pensar en quién gana poco todavía."
        hint_specific: "«Moderado» compara el precio consigo mismo, no con el sueldo de una persona concreta. ¿La frase piensa en alguien en particular?"
  - position: 6
    sentence: "Antes de firmar, Fernando comparó tres seguros y eligió el más {{blank}}, porque la prima mensual no le complicaba el resto del sueldo."
    hint_general: "Elige según lo que la prima mensual le deja pagar sin apuros."
    explanation: "Asequible: la prima cabe en lo que el sueldo de Fernando permite pagar. «Barato» solo compararía precios entre los tres seguros, y «razonable» diría que el precio parece justo, sin pensar en su sueldo."
    options:
      - position: 1
        text: "barato"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Barato» compara el precio de los tres seguros entre sí, y Fernando decide según lo que su sueldo le permite pagar, no según cuál cuesta menos en total."
        hint_specific: "«Barato» compara precios entre productos. ¿Fernando compara precios o piensa en su propio sueldo?"
      - position: 2
        text: "asequible"
        is_correct: true
      - position: 3
        text: "razonable"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Razonable» diría que el precio parece justo o lógico, sin decir que encaja con lo que el sueldo de Fernando permite pagar cada mes."
        hint_specific: "«Razonable» dice que un precio parece justo, no que quepa en un sueldo concreto. ¿La frase habla de justicia o de sueldo?"
  - position: 7
    sentence: "Lucía diseñó una tarifa {{blank}} para bodas pequeñas, sin bajar la calidad de los platos ni el servicio de mesa."
    hint_general: "El precio deja espacio en el presupuesto de una boda pequeña, sin recortar calidad."
    explanation: "Asequible: la tarifa deja espacio en el presupuesto sin bajar calidad. «Accesible» hablaría de lo fácil que es contratar o entender el servicio, y «descontado» supondría una rebaja desde un precio anterior."
    options:
      - position: 1
        text: "accesible"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Accesible» diría que es fácil de contratar o de entender el menú, y aquí Lucía habla del precio frente al presupuesto de la boda."
        hint_specific: "«Accesible» habla de lo fácil que es llegar a algo o entenderlo, no del precio. ¿La frase habla del menú o del presupuesto?"
      - position: 2
        text: "asequible"
        is_correct: true
      - position: 3
        text: "descontado"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Descontado» diría que el precio bajó desde uno anterior, y aquí Lucía diseñó la tarifa así desde el principio, sin rebajar nada."
        hint_specific: "«Descontado» supone que hubo un precio anterior más alto. ¿La frase habla de una rebaja o de un precio pensado así desde el inicio?"
  - position: 8
    sentence: "Andrés le dijo al cliente que el plan mensual era {{blank}}, ideal para probar el software antes de pasarse a uno más completo."
    hint_general: "Es el plan pensado para alguien que todavía no quiere gastar mucho para probar algo."
    explanation: "Asequible: el precio es bajo para alguien que solo quiere probar. «Moderado» diría que el precio no es alto en general, y «conveniente» diría que encaja con el momento, sin hablar de cuánto cuesta."
    options:
      - position: 1
        text: "moderado"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Moderado» diría que el precio no es alto en general, sin pensar en que el cliente solo quiere probar el software antes de decidir."
        hint_specific: "«Moderado» describe un precio ni alto ni bajo en general. ¿Andrés piensa en el precio en general o en alguien que solo quiere probar?"
      - position: 2
        text: "asequible"
        is_correct: true
      - position: 3
        text: "conveniente"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Conveniente» diría que el plan encaja bien con el momento del cliente, sin hablar de que el precio sea bajo para probar."
        hint_specific: "«Conveniente» habla de que algo encaja con el momento, no del precio. ¿La frase habla de encajar o de gastar poco?"
readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "El plan que sí entra en el presupuesto"
    body: "Cuando Elena vio la primera cotización, dudó: el presupuesto del proyecto era ajustado. Su diseñador le ofreció una segunda opción, más simple pero igual de cuidada. «Es la versión asequible, para que no te quedes sin la web por el precio», le dijo. Elena aceptó enseguida."
    before_phrase: "A ver si nos alcanza para esto."
    after_phrase: "Busquemos la opción asequible."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "La recomendación de la sobremesa"
    body: "Tomás contó que había encontrado un fotógrafo para su cumpleaños. «Y lo mejor es que cobra asequible, no como los que cobran una fortuna por dos horas», dijo entre risas. Sus amigos anotaron el contacto antes de cambiar de tema."
    before_phrase: "Cobra bien, no como otros que cobran un dineral."
    after_phrase: "Cobra asequible."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "Una opción que no aprieta"
    body: "Cuando su mamá se enteró del costo de las clases de natación, puso cara de preocupación. Marta buscó otra academia y volvió con una propuesta distinta: «Encontré una asequible, cabe perfecto en lo que tenemos pensado para el mes». Su mamá respiró tranquila."
    before_phrase: "No sé si nos va a alcanzar para esto."
    after_phrase: "Encontré una opción asequible."
