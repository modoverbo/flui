    hint_general: "Dos frentes abiertos al mismo tiempo, y ninguno espera al otro."
    explanation: "Paralelamente: los dos frentes avanzan a la vez. «Parcialmente» diría que algo se hizo a medias y «posteriormente» pondría la negociación después del informe."
    options:
      - position: 1
        text: "parcialmente"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Parcialmente» dice que algo se hizo solo en parte, y aquí no se mide cuánto se hace: se cuentan dos trabajos al tiempo."
        hint_specific: "«Parcialmente» mide lo que se hizo a medias. ¿Se mide algo o se cuentan dos frentes?"
      - position: 2
        text: "paralelamente"
        is_correct: true
      - position: 3
        text: "posteriormente"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Posteriormente» pondría la negociación después del informe, y la frase dice que las dos cosas van al mismo tiempo."
        hint_specific: "«Posteriormente» encadena hacia delante. ¿Van a la vez o una detrás de otra?"
  - position: 2
    sentence: "La obra del tejado sigue su ritmo y, {{blank}}, avanzan los trámites del permiso."
    hint_general: "Dos procesos corren juntos y ninguno depende del otro."
    explanation: "Paralelamente: los dos procesos corren juntos. «De paso» sugeriría aprovechar el viaje y «por tanto» haría de los trámites una consecuencia de la obra."
