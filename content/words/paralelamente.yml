confusions:
  - confused_with: "parcialmente"
    difference: "«Parcialmente» dice que algo se hizo solo en parte: «el pedido llegó parcialmente». La otra habla de dos cosas a la vez."
    memory_trick: "Una mide cuánto se hizo; la otra, cuántas cosas a la vez."
  - confused_with: "paulatinamente"
    difference: "«Paulatinamente» describe algo que avanza poco a poco. La otra no habla de ritmo: habla de dos caminos abiertos al tiempo."
    memory_trick: "Una mira la velocidad; la otra cuenta los carriles."
exercises:
