readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Dos frentes en octubre"
    body: "El jefe creía que el equipo había parado el informe para negociar el precio. Restituto lo aclaró en dos líneas: «Preparamos el informe y, paralelamente, negociamos con el proveedor». Nadie tuvo que justificar retrasos que no existían."
    before_phrase: "Estamos con el informe y a la vez con el precio, o sea, las dos."
    after_phrase: "Preparamos el informe y, paralelamente, negociamos con el proveedor."
  - position: 2
    scene: "entrevista"
    conversation_type: "practica"
    title: "Las tardes de Gumersinda"
    body: "Le preguntaron cómo había sacado el título trabajando. Gumersinda no lo contó como un sacrificio: «Estudiaba por las tardes y, paralelamente, llevaba la contabilidad del bar». La frase explicaba dos años enteros sin una sola queja."
    before_phrase: "Estudiaba y a la vez llevaba el bar, no sé cómo."
    after_phrase: "Estudiaba por las tardes y, paralelamente, llevaba la contabilidad."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "El mes de las cajas"
    body: "En casa cundía la sensación de que nadie había hecho nada en octubre. Eustaquio puso los dos frentes encima de la mesa: «La mudanza ocupó el mes y, paralelamente, el trabajo siguió igual». Dejaron de reprocharse cosas y se repartieron noviembre."
    before_phrase: "Es que con la mudanza y el trabajo a la vez, pues eso."
    after_phrase: "La mudanza ocupó el mes y, paralelamente, el trabajo siguió igual."
