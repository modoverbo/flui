    body: "Uno hablaba portugués y el otro apenas entendía algunas palabras, pero en cuanto empezaron a tocar, algo hizo clic. «No necesitamos el mismo idioma para sintonizar», dijo uno de ellos entre risas, mientras el público aplaudía de pie."
