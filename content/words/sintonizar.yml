    body: "Llevaban años sin hablarse más que por mensajes cortos. Pero apenas se sentaron a tomar un café, algo volvió a fluir entre ellas. «Sigo sintonizando contigo como cuando éramos chicas», le dijo su hermana, sorprendida de lo fácil que había sido."
    before_phrase: "Sigo entendiéndome contigo como cuando éramos chicas."
