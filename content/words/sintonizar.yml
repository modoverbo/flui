  - "ni"
  - "zar"
stressed_syllable: 4
ipa_latam: "[sin.to.niˈsaɾ]"
ipa_es: "[sin.to.niˈθaɾ]"
explanation: "Entender de inmediato el estado de ánimo de alguien, con una conexión casi automática."
example_sentence: "Desde el primer día de trabajo juntos, Marina y su compañero sintonizaron sin necesitar explicarse mucho."
register: "neutral"
pedantry_risk: 1
usage_tip: "Úsalo para describir esa conexión rápida en la que dos personas entienden lo mismo sin mucho esfuerzo."
when_not_to_use: "No lo uses para coincidencias técnicas de horario: sintonizar, en este sentido, describe una conexión emocional."
collocations:
  - "sintonizar con alguien"
  - "sintonizar rápido"
  - "sin sintonizar"
replaces:
  - before: "Se entendieron rápido sin necesitar explicarse mucho"
    after: "Sintonizaron rápido sin necesitar explicarse mucho"
  - before: "Captó enseguida cómo se sentía, sin que ella dijera nada"
    after: "Sintonizó enseguida con cómo se sentía, sin que ella dijera nada"
family: []
themes:
