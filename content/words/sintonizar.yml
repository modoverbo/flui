confusions:
  - confused_with: "sincronizar"
    difference: "Sincronizar es hacer que dos cosas coincidan en el tiempo, como dos relojes; sintonizar es entender el ánimo de alguien de forma casi inmediata."
    memory_trick: "Sincronizas relojes; sintonizas con una persona."
  - confused_with: "sintetizar"
    difference: "«Sintetizar» reduce un texto o una idea a lo esencial; sintonizar es entender el ánimo de alguien de forma casi inmediata, sin resumir nada."
    memory_trick: "Sintetizas un texto; sintonizas con una persona."
