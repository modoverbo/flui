    body: "Mi madre y su vecina bajan juntas a por el pan desde hace veinte años. Cuando le pregunté cómo empezó, se encogió de hombros: «Sintonizamos el primer día». No hubo plan ni esfuerzo: hubo una conversación en el portal."
