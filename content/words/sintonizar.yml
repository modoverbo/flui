    hint_general: "Entender de inmediato el estado de ánimo de alguien, casi sin esfuerzo."
    explanation: "Sintonizaron: entendieron de inmediato el ánimo del otro, casi sin esfuerzo. «Sincronizaron» hace coincidir horarios o movimientos, y «discutieron» describe un desacuerdo, justo lo contrario."
