  - position: 6
    sentence: "Nerea prometió a su equipo que no iba a {{blank}} los números de la temporada, y llevó la hoja con los datos exactos."
    hint_general: "No va a contar las cifras más grandes de lo que son."
    explanation: "Exagerar: contar las cifras más grandes de lo que son. «Inflar» es coloquial y acusa de trampa, y «adornar» sería añadir detalles alrededor, no cambiar el tamaño."
    options:
