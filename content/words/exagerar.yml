  - position: 3
    sentence: "Bautista contó la caída tal cual, sin añadir nada: prefirió no {{blank}} para que su hermana pudiera reírse sin sentirse ridícula."
    hint_general: "Decidió no hacer la historia más grande de lo que fue."
    explanation: "Exagerar: hacer la historia más grande de lo que fue, y él decidió no hacerlo. «Mentir» sería inventarla entera, y «exaltar» sería encender los ánimos de alguien."
    options:
