        hint_specific: "«Resaltar» no agranda nada, solo lo destaca. ¿El discurso agranda los hechos o solo los destaca?"
      - position: 2
        text: "exageró"
        is_correct: true
      - position: 3
        text: "alabó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Alabar» es elogiar cualidades reales sin agrandarlas, y aquí las hazañas escolares se agrandan hasta hacer reír a todos."
        hint_specific: "«Alabar» elogia sin agrandar. ¿El discurso agranda los hechos o solo los elogia?"
  - position: 4
    sentence: "En el informe trimestral, Iván tendió a {{blank}} los resultados de ventas para impresionar al directorio."
    hint_general: "Se trata de presentar un resultado real de forma más favorable de lo que es."
    explanation: "Exagerar: presentar un resultado real de forma más favorable. «Inflar» es coloquial y no encaja en un informe formal, y «falsificar» implicaría inventar datos falsos, algo distinto de exagerar unos reales."
    options:
      - position: 1
        text: "inflar"
        is_correct: false
        distractor_type: "register"
        why_not: "«Inflar» los resultados es coloquial y encajaría en una charla informal, no en un informe formal ante el directorio."
        hint_specific: "«Inflar» suena a conversación informal. ¿Este texto es un chat entre amigos o un informe formal?"
      - position: 2
        text: "exagerar"
        is_correct: true
      - position: 3
        text: "falsificar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Falsificar» implica inventar datos falsos a propósito para engañar, y aquí los números son reales, solo se presentan de forma más favorable."
        hint_specific: "«Falsificar» acusa de inventar datos falsos. ¿El texto dice que los números eran falsos?"
  - position: 5
    sentence: "En la reunión con recursos humanos, Alejandro evitó {{blank}} lo que había visto esa tarde en la oficina."
    hint_general: "Busca el verbo para cuando alguien agranda lo que vio, en vez de contarlo tal cual."
    explanation: "Exagerar: agrandar lo que vio, en vez de contarlo tal cual. «Pintar» es coloquial y no encaja en una reunión formal, e «inventar» sería crear algo que nunca ocurrió."
    options:
      - position: 1
        text: "pintar"
        is_correct: false
        distractor_type: "register"
        why_not: "«Pintar» algo es coloquial y no encaja en una reunión formal con recursos humanos, donde se espera precisión."
        hint_specific: "«Pintar» sirve para el habla informal entre amigos. ¿Esto ocurre en una charla casual o en una reunión formal?"
      - position: 2
        text: "exagerar"
        is_correct: true
      - position: 3
        text: "inventar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Inventar» es crear algo que no ocurrió, y aquí Alejandro solo corre el riesgo de agrandar lo que sí vio."
        hint_specific: "«Inventar» crea un hecho desde cero. ¿Alejandro vio algo real o nada de nada?"
  - position: 6
    sentence: "En el grupo de chat, Cecilia siempre {{blank}} lo cansada que quedó después del gimnasio, y todos responden con risas."
    hint_general: "Se trata de agrandar algo real para que la historia suene más divertida en el chat."
    explanation: "Exagera: agranda lo cansada que quedó, para hacer reír al chat. «Sufre» solo describe un sentimiento real, y «detalla» sería contar con precisión, sin agrandar nada."
