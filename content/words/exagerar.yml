    difference: "Quien miente inventa algo que no pasó; aquí el hecho existió y solo se cuenta más grande de lo que fue."
    memory_trick: "El que miente inventa; el otro estira."
  - confused_with: "exasperar"
    difference: "«Exasperar» es sacar de quicio a alguien; no tiene nada que ver con agrandar una historia."
    memory_trick: "Exasperas a una persona; agrandas un relato."
exercises:
