    title: "La anécdota del lunes"
    body: "En la reunión de equipo, Tobías contó cómo casi pierde el vuelo el fin de semana, y como siempre, exageró cada detalle hasta que la sala entera terminó riendo. Su jefa sonrió: «Contigo nunca sé qué parte es verdad». Tobías guiñó un ojo: «La mitad, más o menos»."
    before_phrase: "Le pongo mucho color a mis historias para que sean más divertidas."
    after_phrase: "Las exagero un poco para que sean más divertidas."
