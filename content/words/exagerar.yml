    scene: "familia"
    conversation_type: "emocional"
    title: "El camino del abuelo"
    body: "Cada año el colegio del abuelo queda un poco más lejos. Empezó siendo un paseo y ya va por seis kilómetros cuesta arriba. Su nieta se lo dijo riendo: «Abuelo, exageras». Él levantó las cejas y contestó: «Claro que exagero, ¿y qué? El frío sí era de verdad»."
    before_phrase: "Lo cuentas más grande de lo que fue."
    after_phrase: "Abuelo, exageras."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "El aviso de la mano"
    body: "Vidal tiene una costumbre: cuando va a estirar una historia, levanta la mano como quien pide permiso. Esa noche contó lo del ascensor con la mano en alto y la mesa entera se rio. «Estoy exagerando el final», admitió. Nadie se sintió engañado y la historia se quedó para siempre."
    before_phrase: "Se me va la mano contando."
    after_phrase: "Estoy exagerando el final."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "La hoja con los datos"
    body: "Nerea llegó a la reunión con una hoja de dos columnas. «No voy a exagerar los números», dijo antes de empezar. Enseñó lo bueno y lo malo con la misma letra. Al terminar, alguien comentó que era la primera vez que se creía un resumen de temporada entero."
    before_phrase: "Voy a contarlo sin inflarlo."
    after_phrase: "No voy a exagerar los números."
