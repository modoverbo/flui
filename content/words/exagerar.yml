schema_version: 1
sort_order: 9401
slug: "exagerar"
status: "draft"
lemma: "exagerar"
part_of_speech: "verbo"
syllables: ["e", "xa", "ge", "rar"]
stressed_syllable: 4
ipa_latam: "[ek.sa.xeˈɾar]"
ipa_es: "[ek.sa.xeˈɾar]"
explanation: "Contar algo más grande, mejor o peor de lo que es, para dar risa o sorprender a la gente."
example_sentence: "En sus historias de viaje, Tobías siempre exagera un poco los peligros que vivió."
register: "neutral"
pedantry_risk: 1
usage_tip: "Funciona bien cuando cuentas una anécdota y todos saben que agrandas los hechos para divertir, sin buscar engañar a nadie."
when_not_to_use: "No la uses cuando alguien inventa datos para engañar de verdad, ni para describir un hecho contado tal cual pasó."
collocations:
  - "exagerar una anécdota"
  - "exagerar los hechos"
replaces:
  - before: "Cuenta las cosas mucho más grandes de lo que son, para que suene más gracioso"
    after: "Exagera las cosas para que suene más gracioso"
  - before: "Le pone mucho drama a la historia para hacer reír"
    after: "Exagera la historia para hacer reír"
family: ["exageración", "exagerado"]
themes:
  - slug: "humor"
    relevance: 3
tags:
  comodin: ["agrandar"]
  funcion: ["divertir"]
  canal: "hablado"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "exasperar"
    difference: "«Exasperar» es sacar de quicio a alguien con enfado; exagerar es agrandar un relato para divertir, sin enfadar a nadie."
    memory_trick: "Exagerar divierte; exasperar enfada."
  - confused_with: "mentir"
    difference: "«Mentir» es afirmar algo falso para engañar; exagerar es agrandar un hecho real, y todos saben que no es literal."
    memory_trick: "Quien exagera no engaña: solo agranda lo que sí pasó."
exercises:
  - position: 1
    sentence: "Renata contó la pesca del fin de semana y, como siempre, {{blank}} un poco el tamaño del pez para sacar risas."
    hint_general: "Busca el verbo para cuando alguien agranda un hecho real solo para divertir, sin intención de engañar."
    explanation: "Exageró: agrandó el tamaño del pez para divertir, sin intención de engañar. «Exasperó» sería sacar de quicio a alguien, y «mintió» supondría inventar algo que no pasó."
    options:
      - position: 1
        text: "exasperó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Exasperar» es sacar de quicio a alguien con enfado, y en la sobremesa todos se ríen, nadie se enoja."
        hint_specific: "«Exasperar» tiene que ver con el enojo. ¿La escena describe risas o enfado?"
      - position: 2
        text: "exageró"
        is_correct: true
      - position: 3
        text: "mintió"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Mentir» es inventar algo que no ocurrió, y aquí el pez existió: solo creció un poco al contarlo."
        hint_specific: "Quien miente inventa un hecho entero. ¿El pez existió o fue pura invención?"
  - position: 2
    sentence: "Cada Navidad, el abuelo de Simón {{blank}} la nevada de su infancia hasta convertirla en una tormenta enorme."
    hint_general: "Se trata de agrandar un recuerdo real para hacerlo más entretenido al contarlo."
    explanation: "Exagera: agranda un recuerdo real para entretener a sus nietos. «Presume» sería hacer alarde de algo propio, y «dramatiza» agrandaría el lado grave o triste, no el gracioso."
    options:
      - position: 1
        text: "presume"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Presumir» es hacer alarde de algo propio para quedar bien, y aquí el abuelo cuenta un recuerdo para entretener a sus nietos, no para lucirse."
        hint_specific: "«Presumir» busca quedar bien uno mismo. ¿El abuelo busca lucirse o hacer reír a los nietos?"
      - position: 2
        text: "exagera"
        is_correct: true
      - position: 3
        text: "dramatiza"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Dramatizar» agranda el lado grave o triste de algo, y aquí la anécdota del abuelo busca hacer reír, no alarmar."
        hint_specific: "«Dramatizar» apunta a lo grave o triste. ¿La escena busca alarmar o divertir?"
  - position: 3
    sentence: "En la boda, Daniela {{blank}} en su discurso las hazañas escolares del novio, y el salón entero soltó una carcajada."
    hint_general: "Busca el verbo para cuando un discurso agranda logros reales hasta sacar risas."
    explanation: "Exageró: agrandó las hazañas escolares del novio hasta sacar una carcajada. «Resaltó» las habría puesto en primer plano sin agrandarlas, y «alabó» solo las habría elogiado como ciertas."
