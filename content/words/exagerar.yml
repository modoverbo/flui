        distractor_type: "near_synonym"
        why_not: "«Detallar» es contar con precisión, sin agrandar nada, y el chat se ríe justo porque ella agranda su cansancio."
        hint_specific: "«Detallar» apunta a la precisión. ¿El chat se ríe de algo exacto o agrandado?"
  - position: 7
    sentence: "Durante la fiesta, Emilio {{blank}} el susto que se llevó con la araña para que la historia sonara más divertida."
