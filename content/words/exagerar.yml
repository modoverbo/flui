  - position: 2
    sentence: "Cada vez que Tobías cuenta lo del perro, el animal crece: él {{blank}} el tamaño y toda la mesa lo sabe y se ríe."
    hint_general: "Hace el hecho más grande de lo que fue, y nadie se siente engañado."
    explanation: "Exagera: hace el hecho más grande de lo que fue. «Infla» es coloquial y acusa de falsear una cifra, y «adorna» añadiría detalles bonitos en vez de agrandar el mismo dato."
