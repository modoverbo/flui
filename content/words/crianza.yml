readings:
  - position: 1
    scene: "familia"
    conversation_type: "emocional"
    title: "La misma casa, dos recuerdos"
    body: "Norma y su hermano discutían en la cocina sobre cómo habían crecido. Ella recordaba risas; él, más silencio. «Tuvimos la misma crianza», dijo ella, «pero cada uno se quedó con una parte distinta». Se quedaron un rato en silencio, y luego siguieron hablando, esta vez escuchándose de verdad."
    before_phrase: "Nos educaron igual, más o menos."
    after_phrase: "Tuvimos la misma crianza."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "Sobremesa de julio"
    body: "Elena llevaba tres platos vacíos sobre la mesa y seguía contando: los veranos en la playa, los primos que dormían en el suelo, las tías que discutían por la sandía. «Qué crianza tan bonita tuviste», le dijo alguien. Elena sonrió: «Y eso que no conté ni la mitad»."
    before_phrase: "Así me criaron a mí, con todo el mundo alrededor."
    after_phrase: "Qué crianza tan bonita tuviste."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "La charla del café"
    body: "En la máquina de café, Silvia le contó a un compañero que estaba cambiando el estilo de crianza con su segundo hijo: menos horarios, más juego libre. Él escuchó con atención y anotó una idea para probar en casa. «Gracias por contarlo», le dijo, «yo ando un poco perdido con el mío»."
    before_phrase: "Estoy probando otra forma de educar a mi hijo."
    after_phrase: "Estoy cambiando el estilo de crianza."
