        why_not: "«Vanidad» describe a quien se cree superior o presume de algo, y aquí Adrián no presume: solo resta importancia a su propio error."
        hint_specific: "«Vanidad» es presumir de algo. ¿Adrián presume o resta importancia a su error?"
      - position: 2
        text: "descaro"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Descaro» describe hacer algo sin ninguna vergüenza frente a otros, y aquí Adrián no actúa sin vergüenza: simplemente no le da importancia al error."
        hint_specific: "«Descaro» es actuar sin vergüenza. ¿Adrián actúa sin vergüenza o solo resta importancia al error?"
      - position: 3
        text: "frivolidad"
        is_correct: true
