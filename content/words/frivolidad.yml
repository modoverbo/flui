readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "El comentario que no ayudó"
    body: "Cuando el cliente escribió furioso por el error en su pedido, alguien del equipo respondió con un emoji y un «ya lo vemos». «Eso sonó a frivolidad», señaló la coordinadora en la reunión. «Vamos a responder mostrando que de verdad nos importa». Reescribieron el mensaje entre todos."
    before_phrase: "Eso sonó como que no nos importaba nada."
    after_phrase: "Eso sonó a frivolidad."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Lo que dijo de pasada"
    body: "Mi hermano contó que había perdido su trabajo como si fuera una anécdota graciosa, entre risas. «Me preocupa tu frivolidad con esto», le dije, «puedes hablarlo en serio conmigo». Se quedó callado un momento y después sí me contó cómo se sentía de verdad."
    before_phrase: "Me preocupa que te lo tomes tan a la ligera."
    after_phrase: "Me preocupa tu frivolidad con esto."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "La broma que no cayó bien"
    body: "En el grupo, alguien hizo un chiste sobre la mudanza forzada de un vecino, como si fuera cualquier cosa. «No entiendo esa frivolidad con algo que le costó tanto a esa familia», escribió Nadia, y varios le dieron la razón. El chiste se borró a los pocos minutos."
    before_phrase: "No entiendo que te lo tomes tan a la ligera."
    after_phrase: "No entiendo esa frivolidad con algo tan serio."
