confusions:
  - confused_with: "oposición"
    difference: "La «oposición» es ponerse en contra de algo; la otra palabra nombra la decisión que llega sin consultar."
    memory_trick: "La oposición responde; la otra llega antes de que respondas."
  - confused_with: "obligación"
    difference: "Una «obligación» es lo que hay que cumplir, venga de donde venga; la otra palabra señala además que nadie preguntó antes."
    memory_trick: "La obligación dice qué; la otra dice cómo llegó."
  - confused_with: "exponer"
    difference: "«Exponer» es presentar una idea para que otros la juzguen, sin forzar nada; la otra palabra es la decisión que llega sin dejar alternativa."
    memory_trick: "Exponer invita a opinar; imponer no deja opción."
