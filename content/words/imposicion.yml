    title: "El modo, no el fondo"
    body: "Los turnos nuevos aparecieron un lunes en el tablón. En la reunión, Vera lo dijo sin levantar la voz: «El horario me parece bien; lo que no me parece bien es la imposición». Al mes siguiente hubo una reunión antes de colgar nada."
    before_phrase: "Es que aquí nunca nos preguntan nada."
    after_phrase: "El horario está bien; la imposición, no."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Lo llamó consejo"
    body: "Su padre le explicó qué debía estudiar y en qué ciudad. Casandra no discutió esa tarde, pero tardó dos meses en volver a contarle nada. Al final se lo dijo: «Tú lo llamaste consejo y a mí me llegó como imposición»."
    before_phrase: "Me dijiste lo que tenía que hacer y ya."
    after_phrase: "Lo llamaste consejo; me llegó como imposición."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "El menú del domingo"
    body: "En casa de Gaspar cada uno propone un plato y se vota. Un invitado preguntó si no era mucho lío. «Prefiero el lío a la imposición», contestó él. Aquel domingo hubo dos primeros platos y nadie se levantó de la mesa."
    before_phrase: "Aquí no manda nadie con la comida."
    after_phrase: "Prefiero el lío a la imposición."
