    conversation_type: "practica"
    title: "El aplauso del final"
    body: "Le preguntaron a Nerea cómo sabía si una charla había funcionado. «Por el aplauso», contestó. «No por lo largo: por lo caluroso. Se nota si aplauden o si te acompañan». Nadie en la sala discutió la diferencia."
    before_phrase: "Se nota si aplauden con ganas."
    after_phrase: "Se nota si el aplauso es caluroso."
