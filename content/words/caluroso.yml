    body: "Nadie esperaba gran cosa del anuncio del gremio. En dos días había cuarenta inscripciones y tres locales ofrecidos. «La respuesta fue calurosa», escribió Zulema en el acta, y por una vez el acta decía la verdad."
    before_phrase: "La gente respondió muy bien."
    after_phrase: "La respuesta fue calurosa."
