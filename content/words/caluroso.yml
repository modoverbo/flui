confusions:
  - confused_with: "clamoroso"
    difference: "«Clamoroso» mide el ruido o el escándalo de algo; esta palabra mide el afecto con que se hace."
    memory_trick: "Lo clamoroso suena fuerte; lo caluroso abraza."
  - confused_with: "cariñoso"
    difference: "«Cariñoso» describe a quien quiere a alguien de cerca; lo otro describe un gesto de bienvenida, aunque sea entre desconocidos."
    memory_trick: "Cariñoso es el trato de siempre; caluroso, el gesto de ese día."
exercises:
  - position: 1
    sentence: "Cuando llegamos al pueblo, la familia de Uriel nos dio un recibimiento {{blank}}: bajaron los cuatro a buscarnos al portal."
    hint_general: "Describe una bienvenida hecha con mucho ánimo y a la vista."
    explanation: "Caluroso: la bienvenida se vio y se hizo con ánimo. «Clamoroso» mediría el ruido o el escándalo, y «cariñoso» supondría un trato de años."
    options:
      - position: 1
        text: "clamoroso"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Clamoroso» mide el ruido o el escándalo que provoca algo, y bajar al portal no es ruidoso: es atento."
        hint_specific: "«Clamoroso» va de ruido y revuelo. ¿Cuánto ruido hay en ese portal?"
      - position: 2
        text: "caluroso"
        is_correct: true
      - position: 3
        text: "cariñoso"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Cariñoso» describe a quien ya quiere a alguien, y aquí la familia recibe a gente que llega por primera vez."
        hint_specific: "«Cariñoso» supone cariño previo. ¿Se conocían ya de antes?"
  - position: 2
    sentence: "Tras la última frase, el aplauso fue tan {{blank}} que Nerea tardó un minuto en poder despedirse."
    hint_general: "El aplauso salió con ganas y duró más de la cuenta."
    explanation: "Caluroso: el aplauso salió con ganas y duró. «Efusivo» suena a exceso estudiado, y «largo» solo mediría el tiempo, no el ánimo."
    options:
      - position: 1
        text: "efusivo"
        is_correct: false
        distractor_type: "register"
        why_not: "«Efusivo» es palabra de crónica formal y sugiere una demostración algo excesiva, y aquí el público responde sin más."
        hint_specific: "«Efusivo» insinúa demostración exagerada, en tono de crónica. ¿El público exagera o responde?"
      - position: 2
        text: "caluroso"
        is_correct: true
      - position: 3
        text: "largo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Largo» solo dice cuánto duró, y un aplauso puede durar mucho por compromiso y sin ningún ánimo."
        hint_specific: "«Largo» mide el reloj. ¿Lo que sorprende es la duración o las ganas?"
  - position: 3
    sentence: "En el correo de bienvenida, Zulema escribió un saludo {{blank}} y añadió el teléfono de su casa."
    hint_general: "El saludo se escribió con ánimo y con la puerta abierta."
    explanation: "Caluroso: el saludo se escribió con ánimo y apertura. «Clamoroso» hablaría de ruido o escándalo, y «amable» se quedaría en la buena educación."
    options:
      - position: 1
        text: "caluroso"
        is_correct: true
      - position: 2
        text: "clamoroso"
        is_correct: false
        distractor_type: "paronym"
