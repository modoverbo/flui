  - position: 3
    sentence: "Sin subir la voz, mi tía {{blank}} en la sobremesa que ella también había ayudado con el traslado."
    hint_general: "Dijo lo suyo dentro de la charla, sin pedir atención."
    explanation: "Deslizó: dijo lo suyo sin pedir atención. «Deslindó» separaría con claridad lo de cada uno, e «insinuó» dejaría la idea a medias."
