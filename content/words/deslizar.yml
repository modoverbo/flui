readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Sin turno"
    body: "A Vera no le daban turno en aquella reunión larga. Cuando el jefe de obra respondió sobre el calendario, ella deslizó su idea dentro de esa respuesta, en una frase. Al día siguiente la idea estaba en el acta con su nombre."
    before_phrase: "Lo dije de pasada, aprovechando."
    after_phrase: "Deslicé la idea dentro de su respuesta."
  - position: 2
    scene: "entrevista"
    conversation_type: "practica"
    title: "El dato que quería"
    body: "Le preguntaron a Nerea por el calendario y ella contestó al calendario. Dentro de esa respuesta deslizó el dato que le importaba de verdad. Al día siguiente, el titular era ese dato y nadie pudo decir que se hubiera ido por las ramas."
    before_phrase: "Lo metí ahí a ver si lo cogían."
    after_phrase: "Deslicé el dato dentro de la respuesta."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "La sobremesa"
    body: "Durante años nadie mencionó que mi tía también había ayudado con el traslado. Un domingo lo deslizó ella misma, sin levantar la voz, entre el café y el postre. Mi madre levantó la vista y dijo: «Es verdad». Ya no hizo falta más."
    before_phrase: "Lo dije bajito, sin darle importancia."
    after_phrase: "Lo deslicé entre el café y el postre."
