      - position: 1
        text: "coló"
        is_correct: false
        distractor_type: "register"
        why_not: "«Coló» es de conversación muy suelta y acusa de meter algo con trampa, y la frase del coste era cierta y estaba escrita."
        hint_specific: "«Coló» insinúa trampa, en tono de calle. ¿Hay engaño o hay una frase escrita al final?"
      - position: 2
        text: "deslizó"
        is_correct: true
