    memory_trick: "Deslindas para separar; deslizas para colar."
  - confused_with: "insinuar"
    difference: "«Insinuar» sugiere algo sin decirlo del todo; aquí se dice entero, solo que en voz baja y de pasada."
    memory_trick: "Insinúas a medias; deslizas entero."
exercises:
  - position: 1
    sentence: "En medio de una respuesta larga sobre el calendario, Nerea {{blank}} el dato que quería que saliera en el periódico."
    hint_general: "Colocó su dato dentro de otra respuesta, sin subrayarlo."
    explanation: "Deslizó: colocó su dato dentro de otra respuesta. «Deslindó» sería separar con claridad lo de cada uno, y «gritó» diría justo lo contrario del tono."
    options:
      - position: 1
        text: "deslindó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Deslindó» es separar con claridad lo que le toca a cada uno, y aquí un dato se mete dentro de otra cosa."
        hint_specific: "«Deslindó» separa y marca límites. ¿Se separa algo o se cuela algo?"
      - position: 2
        text: "deslizó"
        is_correct: true
      - position: 3
        text: "gritó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Gritó» supone levantar la voz, y lo que describe la frase es un dato que pasa casi desapercibido."
        hint_specific: "«Gritó» hace ruido. ¿Ese dato se oyó fuerte o pasó de largo?"
  - position: 2
    sentence: "Al final del informe, Uriel {{blank}} una frase sobre el coste real que nadie leyó hasta tres meses después."
    hint_general: "Puso una frase donde pasaría sin llamar la atención."
    explanation: "Deslizó: puso la frase donde pasaría sin llamar la atención. «Coló» es de charla informal y acusa de hacer trampa, y «anunció» diría que lo puso por delante."
