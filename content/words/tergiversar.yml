stressed_syllable: 4
ipa_latam: "[teɾ.xi.βeɾˈsaɾ]"
ipa_es: "[teɾ.xi.βeɾˈsaɾ]"
explanation: "Repetir las palabras de otro con un cambio que les da otro sentido."
example_sentence: "No dije eso: estás cambiando el orden para tergiversar lo que expliqué."
register: "neutral"
pedantry_risk: 2
usage_tip: "Es la palabra exacta para defenderte sin acusar de mentir: señala el cambio, no la mala fe."
when_not_to_use: "No la uses cuando el otro simplemente entendió mal; esto supone que el cambio se hizo a propósito."
collocations:
  - "tergiversar mis palabras"
  - "tergiversar una frase"
  - "sin tergiversar nada"
replaces:
  - before: "Estás diciendo lo que no dije"
    after: "Estás tergiversando lo que dije"
  - before: "Lo contó todo al revés"
    after: "Tergiversó lo que pasó"
  - before: "Me sacaron de contexto"
    after: "Tergiversaron mi respuesta"
family:
  - "tergiversación"
themes:
  - slug: "medios-entrevistas"
    relevance: 3
  - slug: "conflicto-desacuerdo"
    relevance: 2
tags:
