      - position: 1
        text: "titubear"
        is_correct: true
      - position: 2
        text: "titular"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Titular» es poner un título, y lo que ensaya Fernando es decir la frase de corrido."
        hint_specific: "«Titular» pone nombre a algo. ¿Qué practicó Fernando tantas veces?"
      - position: 3
        text: "titilar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Titilar» es el temblor de una luz o de una estrella, y lo que ensaya Fernando es el arranque de una frase."
        hint_specific: "«Titilar» describe una luz que tiembla. ¿Qué practicó Fernando tantas veces?"
  - position: 3
    sentence: "Cuando mi sobrino me preguntó por qué nos mudábamos, {{blank}} un poco antes de contarle la verdad."
    hint_general: "Se queda un momento a medias antes de decidir qué contar."
    explanation: "Titubeé: me quedé a medias antes de decidir qué contar. «Titulé» sería poner un título, y «enmudecí» sería quedarme sin decir nada."
    options:
      - position: 1
        text: "titulé"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Titular» es poner un título a un texto, y en esa cocina no había ningún texto."
