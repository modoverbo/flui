  - position: 6
    sentence: "Renata contestó sin {{blank}}: «Sí, ese proyecto lo dirigí yo de principio a fin»."
    hint_general: "Contesta de corrido, sin un solo momento de duda."
    explanation: "Titubear: contesta de corrido, sin dudar. «Titular» sería poner un título, y «balbucear» apunta a un habla entrecortada."
    options:
      - position: 1
        text: "titubear"
        is_correct: true
      - position: 2
        text: "titular"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Titular» es poner un título o dirigir un puesto fijo, y aquí lo que se describe es cómo contesta."
        hint_specific: "«Titular» va de nombres. ¿Qué describe la frase: qué dice o cómo lo dice?"
      - position: 3
        text: "balbucear"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Balbucear» apunta a un habla entrecortada, y aquí la clave es que no hubo ni un momento de duda."
