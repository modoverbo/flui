  - position: 2
    sentence: "El vídeo salió bien porque Fernando ensayó hasta dejar de {{blank}} en la primera frase."
    hint_general: "Ensayó hasta que la primera frase le salió sin quedarse a medias."
    explanation: "Titubear: dejar de quedarse a medias al empezar. «Titular» es poner un título, y «titilar» es el temblor de una luz."
