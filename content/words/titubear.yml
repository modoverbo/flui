    hint_general: "Esa pregunta la dejó un instante sin saber cómo empezar."
    explanation: "Titubear: la dejó un instante sin saber cómo empezar. «Titular» es poner un título, y «atascarse» es coloquial y dejaría a Camila parada, que es lo que la frase niega."
    options:
      - position: 1
        text: "titubear"
        is_correct: true
      - position: 2
        text: "titular"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Titular» es poner un título o tener un puesto fijo, y aquí solo hay una pregunta incómoda."
        hint_specific: "«Titular» va de títulos y puestos. ¿Qué provoca esa pregunta?"
      - position: 3
        text: "atascarse"
        is_correct: false
        distractor_type: "register"
        why_not: "«Atascarse» es coloquial y deja a alguien parado, y la frase dice que Camila no se quedó parada en ningún momento."
