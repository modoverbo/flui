    sentence: "Durante el juicio del concurso, el jurado notó que Vicente {{blank}} solo en la parte de los números."
    hint_general: "Se quedaba a medias justo en esa parte de su explicación."
    explanation: "Titubeaba: se quedaba a medias en esa parte. «Titulaba» sería poner títulos, y «tanteaba» sería probar a propósito."
    options:
