    difference: "«Titular» es poner un título o ser quien ocupa un puesto fijo; no tiene nada que ver con dudar al hablar."
    memory_trick: "Titulas un texto; dudas delante del micrófono."
  - confused_with: "tutear"
    difference: "«Tutear» es hablarle a alguien de tú; la otra palabra describe a quien se queda a medias por la duda."
    memory_trick: "Tutear elige el trato; dudar corta la frase."
exercises:
  - position: 1
    sentence: "Le preguntaron por el presupuesto y Mariana {{blank}} dos segundos antes de dar la cifra exacta."
    hint_general: "Se queda un momento sin saber qué decir antes de contestar."
    explanation: "Titubeó: se quedó un momento sin saber qué decir. «Tituló» sería poner un título, y «tuteó» sería hablarle de tú a alguien."
    options:
