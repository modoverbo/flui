    body: "Mi abuela manda audios largos y nadie se los salta. Cuenta con un ritmo pausado, como si tuviera toda la tarde, y aun así no se le va el hilo. Mi hermano dice que los escucha mientras cocina y que le bajan las pulsaciones."
    before_phrase: "Habla despacito, pero se entiende todo."
    after_phrase: "Cuenta de un modo pausado y no se le va el hilo."
