    body: "Fabiola ensayó su intervención dos veces. La primera duró cuatro minutos y no se entendió nada. En la segunda cambió una sola cosa: un ritmo pausado, con aire entre frase y frase. Duró seis minutos y el equipo hizo tres preguntas."
