    conversation_type: "social"
    title: "La discusión que se enfrió"
    body: "En la comida de la escalera, dos vecinos empezaron a levantar la voz por el ruido del patio. Damián contestó de forma pausada, palabra por palabra, sin subir el tono ni una vez. A los dos minutos hablaban de horarios y no de culpas."
    before_phrase: "Contesté tranquilo y despacio, sin gritar."
    after_phrase: "Contesté de forma pausada."
