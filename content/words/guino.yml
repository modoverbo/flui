confusions:
  - confused_with: "guion"
    difference: "«Guion» es el texto completo que alguien prepara para decir palabra por palabra; esta palabra es una seña pequeña y cómplice, como cerrar un ojo."
    memory_trick: "El guion se escribe con la mano; esta palabra se hace con el ojo."
  - confused_with: "codazo"
    difference: "«Codazo» es un golpe suave con el codo para llamar la atención de alguien; esta palabra se hace con el ojo, no con el cuerpo entero."
    memory_trick: "El codazo se siente en el brazo; esta palabra se ve en la cara."
