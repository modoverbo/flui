schema_version: 1
slug: "resonar"
status: "draft"
lemma: "resonar"
part_of_speech: "verbo"
syllables: ["re", "so", "nar"]
stressed_syllable: 3
ipa_latam: "[re.soˈnar]"
ipa_es: "[re.soˈnar]"
explanation: "Sentir que algo dicho por otro conecta con lo que uno mismo piensa o vive."
example_sentence: "Su publicación sobre empezar de nuevo a los cuarenta resonó entre muchísima gente que estaba pasando por lo mismo."
register: "neutral"
pedantry_risk: 1
usage_tip: "Úsala cuando algo dicho por otro te hace pensar «a mí también me pasa eso», no solo cuando te gusta."
when_not_to_use: "No la uses para un simple «me gustó»: hace falta que de verdad conecte con algo tuyo."
collocations:
  - "resonar entre la gente"
  - "resonar con tu propia experiencia"
  - "una frase que resuena"
replaces:
  - before: "Mucha gente se sintió identificada"
    after: "Resonó en mucha gente"
  - before: "Eso me tocó"
    after: "Eso resonó en mí"
  - before: "Le llegó a mucha gente"
    after: "Resonó en mucha gente"
family: ["resonancia", "resonante"]
themes:
  - slug: "redes-sociales"
    relevance: 3
tags:
  comodin: ["que le llegue a la gente", "que se sienta identificado"]
  funcion: ["conectar"]
  canal: "ambos"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "reposar"
    difference: "«Reposar» es quedarse quieto o asentarse con calma; «resonar» es la reacción inmediata de reconocerse en lo que dice otra persona."
    memory_trick: "Lo que reposa se queda quieto; lo que resuena hace eco enseguida."
  - confused_with: "trascender"
    difference: "«Trascender» implica dejar una huella grande y duradera; «resonar» solo necesita que alguien reconozca algo propio, aunque sea en un grupo pequeño."
exercises:
  - position: 1
    sentence: "En cuanto Marina terminó de contar su historia en el video, decenas de mensajes decían lo mismo: esa historia {{blank}} en cada persona que la escuchó, porque a todos les había pasado algo parecido."
    hint_general: "Piensa en algo que hace que cada persona reconozca su propia experiencia en lo que cuenta otro."
    explanation: "Resonó: cada persona reconoció algo propio en la historia. «Reposó» es quedarse quieto y asentarse poco a poco, y «impactó» habla de causar una impresión fuerte, no de reconocerse en algo."
    options:
      - position: 1
        text: "reposó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Reposar» es quedarse quieto o asentarse con calma, y aquí la historia generó una reacción inmediata en decenas de personas, no un efecto lento."
        hint_specific: "«Reposar» es quedarse quieto, asentarse poco a poco. ¿Aquí la reacción fue lenta o llegaron decenas de mensajes enseguida?"
      - position: 2
        text: "resonó"
        is_correct: true
      - position: 3
        text: "impactó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Impactar» es causar una impresión fuerte, y aquí lo importante no es que sorprendiera, sino que cada persona reconoció algo propio en la historia."
        hint_specific: "«Impactar» habla de causar una impresión fuerte. ¿Aquí lo clave es sorprender o que cada quien reconociera algo suyo?"
  - position: 2
    sentence: "La idea que propuso Julián en la reunión no era la más elaborada, pero {{blank}} en varios compañeros que llevaban meses pensando lo mismo en silencio."
    hint_general: "Busca la palabra para una idea que otros ya sentían, aunque nadie la hubiera dicho antes en voz alta."
    explanation: "Resonó: la idea coincidía con lo que varios ya pensaban. «Reverberó» es un término técnico de acústica, y «tocó» habla de conmover, no de que ya pensaran lo mismo."
    options:
      - position: 1
        text: "reverberó"
        is_correct: false
        distractor_type: "register"
        why_not: "«Reverberar» es un término técnico para el sonido que rebota en un espacio, y suena extraño para hablar de una idea entre compañeros de trabajo."
        hint_specific: "«Reverberar» es un término técnico de acústica. ¿Encaja esa palabra para hablar de una idea entre compañeros?"
      - position: 2
        text: "tocó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Tocar» dice que algo conmovió a alguien, y aquí el punto no es solo la emoción, sino que varios compañeros ya pensaban lo mismo antes de que Julián lo dijera."
        hint_specific: "«Tocar» habla de conmover a alguien. ¿Aquí el punto es la emoción o que ya pensaban lo mismo?"
      - position: 3
        text: "resonó"
        is_correct: true
  - position: 3
    sentence: "La respuesta de la candidata sobre sus prioridades no fue la más pulida, pero {{blank}} en dos de los entrevistadores, que después de la reunión seguían comentándola."
    hint_general: "Se trata de que alguien reconozca algo propio en lo que dice otra persona, no de que sea perfecto."
    explanation: "Resonó: dos entrevistadores reconocieron algo en la respuesta. «Trascendió» implica dejar una huella grande y duradera, y «caló» describe un efecto lento, cuando aquí el efecto fue inmediato."
    options:
      - position: 1
        text: "trascendió"
        is_correct: false
        distractor_type: "register"
        why_not: "«Trascender» implica dejar una huella importante y duradera, y aquí solo sabemos que dos entrevistadores la comentaron un rato después, no que marcara algo grande."
        hint_specific: "«Trascender» habla de dejar una huella grande y duradera. ¿Aquí sabemos eso o solo que la comentaron un rato después?"
      - position: 2
        text: "caló"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Calar» describe algo que se mete hondo poco a poco, y aquí el efecto fue inmediato: los entrevistadores lo comentaron nada más terminar la reunión."
        hint_specific: "«Calar» describe un efecto lento y profundo. ¿Aquí el efecto fue lento o inmediato?"
      - position: 3
        text: "resonó"
        is_correct: true
  - position: 4
    sentence: "El texto que escribió Tomás sobre extrañar su ciudad no tenía nada dramático, pero {{blank}} en todos los que también habían vivido lejos de casa alguna vez."
    hint_general: "Piensa en una palabra para cuando otros reconocen su propia vida en lo que alguien cuenta."
    explanation: "Resonó: otros reconocieron su propia experiencia en el texto. «Emocionó» habla de causar una emoción fuerte, y «coincidió» habla de opinar igual, no de reconocer una experiencia."
    options:
      - position: 1
        text: "emocionó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Emocionar» dice que algo causó una emoción fuerte, y el texto de Tomás no era dramático: lo que pasó es que otros reconocieron su propia experiencia en lo que él contaba."
        hint_specific: "«Emocionar» habla de causar una emoción fuerte. ¿Aquí lo clave es la emoción o que reconocieron su propia experiencia?"
      - position: 2
        text: "coincidió"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Coincidir» dice que dos opiniones son iguales, y aquí no se trata de estar de acuerdo con Tomás, sino de que su experiencia se pareció a la de otros."
        hint_specific: "«Coincidir» habla de tener la misma opinión. ¿Aquí se trata de opinar igual o de reconocer una experiencia parecida?"
      - position: 3
        text: "resonó"
        is_correct: true
  - position: 5
    sentence: "Cuando su tía contó en la sobremesa lo difícil que fue empezar de nuevo después del divorcio, la historia {{blank}} en su prima, que estaba pasando por algo parecido y no lo había contado a nadie."
    hint_general: "Busca la palabra para cuando una historia hace que otra persona reconozca lo que también le pasa a ella."
    explanation: "Resonó: su prima reconoció su propia situación en la historia. «Convenció» es cambiar la opinión de alguien, y «sorprendió» habla de algo inesperado, no de reconocerse en algo."
    options:
      - position: 1
        text: "convenció"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Convencer» es lograr que alguien cambie de opinión, y aquí la prima no cambió de idea: reconoció su propia situación en lo que contó la tía."
        hint_specific: "«Convencer» habla de cambiar la opinión de alguien. ¿Aquí la prima cambió de opinión o reconoció su propia situación?"
      - position: 2
        text: "resonó"
        is_correct: true
      - position: 3
        text: "sorprendió"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sorprender» dice que algo fue inesperado, y aquí lo que importa no es la sorpresa, sino que su prima vivía algo muy parecido a lo que contaba la tía."
        hint_specific: "«Sorprender» habla de que algo fue inesperado. ¿Aquí lo importante es la sorpresa o que su prima vivía algo parecido?"
  - position: 6
    sentence: "El correo de despedida que escribió Renata al dejar el equipo no tenía grandes frases, pero {{blank}} en sus compañeros, que reconocían en sus palabras las mismas dudas que ellos habían tenido al llegar."
    hint_general: "Se trata de reconocer algo propio en las palabras de otra persona, más que sentir una emoción fuerte."
    explanation: "Resonó: sus compañeros reconocieron sus propias dudas. «Conmovió» habla de una emoción profunda, y «inspiró» empuja a hacer algo nuevo, cuando aquí solo reconocieron algo propio."
    options:
      - position: 1
        text: "conmovió"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Conmover» dice que algo causó una emoción profunda, y aquí el punto es que reconocieron sus propias dudas en las palabras de Renata, más que sentirse conmovidos."
        hint_specific: "«Conmover» habla de causar una emoción profunda. ¿Aquí el punto es la emoción o reconocer algo propio?"
      - position: 2
        text: "inspiró"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Inspirar» dice que algo empuja a hacer algo nuevo, y aquí sus compañeros no hicieron nada distinto: solo reconocieron sus propias dudas en lo que ella contó."
        hint_specific: "«Inspirar» habla de empujar a hacer algo nuevo. ¿Aquí sus compañeros hicieron algo nuevo o solo reconocieron algo propio?"
      - position: 3
        text: "resonó"
        is_correct: true
  - position: 7
    sentence: "La publicación de un desconocido sobre sus primeros meses sin trabajo no tenía ninguna foto llamativa, pero {{blank}} en cientos de personas que estaban viviendo lo mismo en silencio."
    hint_general: "Piensa en una publicación sencilla que hace que mucha gente reconozca su propia situación."
    explanation: "Resonó: cientos de personas reconocieron su propia situación. «Cautivó» es atrapar la atención con algo llamativo, y «interesó» solo despierta curiosidad, no reconocimiento."
    options:
      - position: 1
        text: "cautivó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cautivar» es atrapar la atención de alguien de principio a fin, y aquí la publicación no tenía nada llamativo: lo que pasó es que cientos de personas reconocieron su propia situación."
        hint_specific: "«Cautivar» habla de atrapar la atención con algo llamativo. ¿La publicación tenía algo llamativo o solo contaba una experiencia común?"
      - position: 2
        text: "interesó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Interesar» solo dice que algo llamó la curiosidad, y aquí pasó algo más fuerte: cientos de personas reconocieron su propia situación en lo que leyeron."
        hint_specific: "«Interesar» solo dice que algo despertó curiosidad. ¿Aquí solo hubo curiosidad o la gente reconoció su propia situación?"
      - position: 3
        text: "resonó"
        is_correct: true
  - position: 8
    sentence: "Nadie en el panel esperaba que la anécdota del candidato sobre un proyecto fallido fuera la parte más recordada de la entrevista, pero {{blank}} justo en los dos evaluadores que también habían vivido un fracaso parecido."
    hint_general: "Busca la palabra para cuando una anécdota hace que alguien reconozca algo que también le pasó a él."
    explanation: "Resonó: dos evaluadores reconocieron su propia experiencia. «Atrajo» habla de llamar la atención, y «persuadió» es convencer de algo, no de que alguien se reconozca en una historia."
    options:
      - position: 1
        text: "resonó"
        is_correct: true
      - position: 2
        text: "atrajo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Atraer» dice que algo llamó la atención, y aquí el punto no fue solo llamar la atención, sino que dos evaluadores reconocieron su propia experiencia en la anécdota."
        hint_specific: "«Atraer» habla de llamar la atención. ¿Aquí el punto fue llamar la atención o que reconocieran algo propio?"
      - position: 3
        text: "persuadió"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Persuadir» es convencer a alguien de algo, y aquí el candidato no buscaba convencer a nadie: los evaluadores solo reconocieron su propia experiencia en lo que contó."
        hint_specific: "«Persuadir» habla de convencer a alguien de algo. ¿Aquí el candidato buscaba convencer o solo contó su experiencia?"
readings:
  - position: 1
    scene: "social"
    conversation_type: "practica"
    title: "El post que nadie esperaba"
    body: "Iván publicó, casi sin pensarlo, un texto corto sobre lo difícil que fue pedir ayuda la primera vez que se mudó solo. No tenía fotos ni nada especial. Al día siguiente, decenas de personas le habían escrito contando algo parecido. «No sabía que esto iba a resonar tanto», le dijo a su hermana."
    before_phrase: "No sabía que le iba a llegar a tanta gente."
    after_phrase: "No sabía que esto iba a resonar tanto."
  - position: 2
    scene: "trabajo"
    conversation_type: "social"
    title: "La pregunta que se quedó"
    body: "En medio de la reunión, Paula hizo una pregunta incómoda sobre por qué el equipo siempre repetía el mismo reparto de trabajo. Nadie respondió en el momento, pero dos semanas después, tres compañeros mencionaron esa misma pregunta en privado. «Tu pregunta resonó más de lo que creías», le dijo su jefa."
    before_phrase: "Tu pregunta le llegó a más gente de la que crees."
    after_phrase: "Tu pregunta resonó más de lo que creías."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "Lo que contó el abuelo"
    body: "El abuelo contó, sin darle mucha importancia, cómo había tenido que empezar de cero dos veces en su vida. Nadie dijo nada en el momento, pero esa noche su nieto, que estaba por dejar su trabajo para intentar algo nuevo, no pudo dormir pensando en esa historia. «Eso me resonó más de lo que esperaba», le confesó después."
    before_phrase: "Eso me llegó más de lo que esperaba."
    after_phrase: "Eso me resonó más de lo que esperaba."
