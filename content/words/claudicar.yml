    title: "El tercer intento"
    body: "Le pidieron tres veces que bajara la tarifa y Aitana repitió su cálculo tres veces, sin subir el tono. Al salir se lo dijo a su socio: «No he claudicado; si dicen que no, buscamos otro cliente». Dijeron que sí al día siguiente."
