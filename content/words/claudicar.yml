  - confused_with: "abdicar"
    difference: "«Abdicar» es dejar formalmente un cargo o un derecho, como un rey su trono; la otra palabra es abandonar una postura en plena discusión."
    memory_trick: "Se abdica de un trono; lo otro pasa en una mesa de cocina."
  - confused_with: "aflojar"
    difference: "«Aflojar» es coloquial y significa bajar un poco la presión sin soltar nada; la otra palabra deja caer del todo lo que defendías."
    memory_trick: "Aflojas un poco; con lo otro sueltas la pieza entera."
