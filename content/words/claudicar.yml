    conversation_type: "emocional"
    title: "Dos horas de mesa"
    body: "La discusión sobre el viaje llevaba dos horas y Hernán acabó diciendo que sí. En el pasillo lo reconoció: «He claudicado por cansancio, no porque me convencieran». Lo volvieron a hablar el domingo, con las cartas boca arriba, y decidieron otra cosa."
    before_phrase: "Vale, vale, lo que sea, me da igual."
    after_phrase: "He claudicado por cansancio, no por convencimiento."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "Dos años de cartas"
    body: "La asociación del barrio pidió el mismo paso de peatones durante dos años. Cambiaron tres veces de interlocutor y volvieron a empezar cada vez. «No claudicamos y punto», resumía la presidenta. Lo pintaron en marzo."
    before_phrase: "Casi lo dejamos mil veces."
    after_phrase: "No claudicamos, y por eso está pintado."
