    body: "El aviso llegó en enero y decía exactamente qué pasaría en marzo. Nadie se asustó y todo el mundo se puso a trabajar. «Es una advertencia con calendario», resumió la responsable en la reunión. En marzo no pasó nada de lo anunciado."
    before_phrase: "Nos han mandado un aviso bastante serio."
    after_phrase: "Es una advertencia con calendario."
