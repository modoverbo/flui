    conversation_type: "social"
    title: "El filtro de marzo"
    body: "El técnico lo dijo mientras recogía las herramientas: sin cambiar el filtro en marzo, en junio no habría agua caliente. Nadie lo apuntó. En junio, cuando pasó, alguien lo recordó: «Aquello fue una advertencia y la dejamos pasar»."
    before_phrase: "Ya nos lo había dicho, mira tú."
    after_phrase: "Aquello fue una advertencia y la dejamos pasar."
