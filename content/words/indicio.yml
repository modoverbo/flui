    scene: "trabajo"
    conversation_type: "practica"
    title: "El ruido en frío"
    body: "El técnico no encontró la avería, pero apuntó una línea en la hoja: «El ruido solo aparece en frío». Su jefa la leyó y asintió. «Con un indicio así ya sabemos por dónde seguir», dijo. Volvieron el lunes a primera hora, con la máquina todavía fría."
    before_phrase: "Hay algo raro ahí, no sé qué es."
    after_phrase: "Tenemos un indicio: el ruido solo aparece en frío."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Tres domingos"
    body: "Mi hermana llevaba tres domingos cambiando de tema cuando alguien preguntaba por la mudanza. No dije nada, pero tomé nota. «No tengo pruebas», le comenté a mi madre, «solo un indicio». El domingo siguiente lo contó ella sola, antes del postre."
    before_phrase: "Me da la sensación de que algo le pasa."
    after_phrase: "No tengo pruebas, solo un indicio."
  - position: 3
    scene: "entrevista"
    conversation_type: "social"
    title: "Habló del suyo primero"
    body: "Rodrigo no dijo en ningún momento que hubiera llevado un equipo. Habló del suyo antes que de sí mismo, tres veces seguidas. La entrevistadora lo anotó al margen: «Un indicio de que sabe repartir el trabajo». En la segunda ronda se lo preguntó de frente."
    before_phrase: "Algo me dice que ha llevado gente."
    after_phrase: "Hay un indicio de que ha llevado gente."
