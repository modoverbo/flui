stressed_syllable: 3
ipa_latam: "[pɾjo.ɾiˈsaɾ]"
ipa_es: "[pɾjo.ɾiˈθaɾ]"
explanation: "Poner en orden lo que va primero, para que lo importante no quede al final."
example_sentence: "La lista tenía veinte puntos y una mañana, así que me senté a priorizar antes de empezar."
register: "neutral"
pedantry_risk: 2
usage_tip: "Sirve para decir que no sin decirlo: pones algo delante y lo demás queda detrás, con fecha."
when_not_to_use: "No la uses si al final vas a hacerlo todo igual: entonces no has ordenado nada, solo has hecho una lista."
collocations:
  - "priorizar una lista"
  - "priorizar el trabajo"
  - "priorizar lo importante"
replaces:
  - before: "Pon primero lo más importante"
    after: "Prioriza lo importante"
  - before: "No sé por dónde empezar con todo esto"
    after: "Todavía no he priorizado"
  - before: "Habrá que ver qué va antes y qué después"
    after: "Habrá que priorizar"
family:
  - "prioridad"
  - "prioritario"
themes:
