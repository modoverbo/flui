confusions:
  - confused_with: "reivindicar"
    difference: "«Reivindicar» es reclamar algo como propio o defender un derecho; aquí solo se repite con calma lo que ya se dijo."
    memory_trick: "Reivindicas lo que te toca; reiteras lo que ya dijiste."
  - confused_with: "insistir"
    difference: "«Insistir» empuja y suele repetirse muchas veces; lo otro dice la misma cosa una vez más y deja espacio."
    memory_trick: "Insistir empuja; repetir con calma solo recuerda."
exercises:
  - position: 1
    sentence: "Rosa escribió tres líneas para {{blank}} su petición sin que el proveedor se sintiera presionado."
    hint_general: "Vuelve a decir lo que pidió, una vez y con calma."
    explanation: "Reiterar: repite la petición con calma. «Reivindicar» es reclamar un derecho propio, y «machacar» es coloquial y sugiere justo la presión que Rosa evita."
    options:
      - position: 1
        text: "reivindicar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Reivindicar» es reclamar algo como propio o defender un derecho, y aquí solo se repite una petición ya hecha."
        hint_specific: "«Reivindicar» va de reclamar lo que te corresponde. ¿Rosa reclama un derecho o repite un pedido?"
      - position: 2
        text: "reiterar"
        is_correct: true
      - position: 3
        text: "machacar"
        is_correct: false
        distractor_type: "register"
        why_not: "«Machacar» es coloquial y sugiere repetir hasta cansar, y la frase dice que el proveedor no se sintió presionado."
        hint_specific: "«Machacar» suena a repetir hasta cansar. ¿La frase describe presión o calma?"
  - position: 2
    sentence: "Antes de colgar, Ignacio quiso {{blank}} la fecha de entrega que ya había dicho al empezar la llamada."
    hint_general: "La fecha no cambia: se dice una vez más para que quede grabada."
    explanation: "Reiterar: dice la misma fecha otra vez. «Reintegrar» es devolver un dinero, y «negociar» abriría de nuevo una fecha que ya estaba cerrada."
    options:
      - position: 1
        text: "reintegrar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Reintegrar» es devolver un dinero o volver a incorporar a alguien; una fecha no se devuelve."
        hint_specific: "«Reintegrar» aparece con devoluciones de dinero. ¿De qué habla esta llamada?"
      - position: 2
        text: "negociar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Negociar» abriría otra vez la fecha, y la frase dice que ya la había dado al empezar."
        hint_specific: "«Negociar» reabre el asunto. ¿La fecha está en discusión o ya está dicha?"
      - position: 3
        text: "reiterar"
        is_correct: true
  - position: 3
    sentence: "Cuando el cliente preguntó por tercera vez, Blanca prefirió {{blank}} las condiciones en un correo corto y amable."
    hint_general: "Las condiciones son las mismas: solo vuelven a escribirse."
    explanation: "Reiterar: escribe otra vez las mismas condiciones. «Reiniciar» sería empezar todo de cero, y «soltar» es coloquial y suena brusco justo donde la frase pide amabilidad."
    options:
      - position: 1
        text: "reiterar"
        is_correct: true
      - position: 2
        text: "reiniciar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Reiniciar» es empezar algo desde cero, y aquí las condiciones siguen siendo las mismas de siempre."
        hint_specific: "«Reiniciar» arranca de nuevo. ¿Cambian las condiciones o solo se vuelven a escribir?"
      - position: 3
        text: "soltar"
        is_correct: false
        distractor_type: "register"
        why_not: "«Soltar» es coloquial y suena a decir algo de golpe, y el correo se describe como corto y amable."
        hint_specific: "«Soltar» suena brusco. ¿Cómo describe la frase ese correo?"
  - position: 4
