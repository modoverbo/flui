  - position: 8
    sentence: "Cuando tu equipo ya conoce el objetivo, {{blank}} la idea una vez basta; repetirla cada día la desgasta."
    hint_general: "Con decirla de nuevo una sola vez ya se sostiene la idea."
    explanation: "Reiterar: decirla de nuevo una vez sostiene la idea. «Reiniciar» sería empezar de cero, e «imponer» la obligaría en vez de recordarla."
    options:
      - position: 1
        text: "reiniciar"
