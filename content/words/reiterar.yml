      - position: 1
        text: "iterar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Iterar» es repetir un paso dentro de un proceso técnico, no volver a decir algo en un mensaje."
        hint_specific: "«Iterar» pertenece al trabajo con procesos y pruebas. ¿Eso es lo que hace Julieta?"
      - position: 2
        text: "modificar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Modificar» cambiaría el plazo, y la frase deja claro que sigue siendo el mismo."
        hint_specific: "«Modificar» cambia lo acordado. ¿El plazo cambia en esta frase?"
      - position: 3
        text: "reiterar"
        is_correct: true
  - position: 6
    sentence: "Mariana no quería sonar dura, así que {{blank}} la misma frase del lunes y añadió una disculpa breve."
    hint_general: "Usa otra vez la frase de antes, sin cambiar nada."
    explanation: "Reiteró: usó otra vez la misma frase. «Reformuló» la habría cambiado, y la frase dice que era idéntica; «machacó» es coloquial y suena a la dureza que ella evitaba."
    options:
      - position: 1
        text: "reiteró"
        is_correct: true
      - position: 2
        text: "reformuló"
        is_correct: false
        distractor_type: "near_synonym"
