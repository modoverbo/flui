        distractor_type: "register"
        why_not: "«Machacar» es coloquial y suena a insistir hasta cansar, justo lo contrario de no sonar dura."
        hint_specific: "«Machacar» suena a cansar al otro. ¿Qué quería evitar Mariana?"
  - position: 7
    sentence: "Si nadie responde a tu mensaje, {{blank}} tu pedido una sola vez y después llama: el silencio no siempre es un no."
    hint_general: "Una vez más, y ya está: nada de empujar."
    explanation: "Reitera: dilo una vez más y para ahí. «Reivindica» sería reclamar un derecho, y «presiona» va contra el consejo de escribir una sola vez."
    options:
      - position: 1
        text: "presiona"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Presionar» empuja al otro, y el consejo es escribir una sola vez y luego llamar."
