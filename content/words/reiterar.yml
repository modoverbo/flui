    hint_general: "Se dice de nuevo para que no vuelva a olvidarse, sin culpar a nadie."
    explanation: "Reitero: lo digo otra vez para que no se olvide. «Reivindico» sería reclamar un derecho, y «reprocho» convierte el recordatorio en una queja que la frase descarta."
    options:
      - position: 1
        text: "reivindico"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Reivindicar» es reclamar algo como propio o defender un derecho, y aquí nadie reclama nada: se recuerda una cita."
        hint_specific: "«Reivindicar» va de derechos y reclamos. ¿Qué se está recordando en la frase?"
      - position: 2
        text: "reitero"
        is_correct: true
      - position: 3
        text: "reprocho"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Reprochar» es echar algo en cara, y la frase aclara que no hay desconfianza ni queja."
        hint_specific: "«Reprochar» echa algo en cara. ¿La frase culpa a alguien o solo recuerda?"
  - position: 5
    sentence: "Julieta cerró el mensaje con una línea para {{blank}} el plazo, aunque todavía nadie le hubiera contestado."
    hint_general: "El plazo sigue igual y ella lo escribe una vez más."
    explanation: "Reiterar: el plazo sigue igual y se escribe otra vez. «Iterar» es repetir un paso de un proceso técnico, y «modificar» cambiaría el plazo que la frase mantiene."
