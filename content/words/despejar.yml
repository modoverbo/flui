schema_version: 1
slug: "despejar"
status: "draft"
lemma: "despejar"
part_of_speech: "verbo"
syllables: ["des", "pe", "jar"]
stressed_syllable: 3
ipa_latam: "[des.peˈxar]"
ipa_es: "[des.peˈxar]"
explanation: "Resolver una duda hasta que la otra persona se quede tranquila y sin preguntas."
example_sentence: "Al final de la charla, el ingeniero despejó todas las dudas del equipo sobre el nuevo sistema."
register: "neutral"
pedantry_risk: 1
usage_tip: "Dila para cerrar una explicación: despejar dudas es la parte donde nadie se queda con nada en el aire."
when_not_to_use: "No la confundas con «desplegar»: eso es abrir o mostrar algo completo, no resolver una duda."
collocations:
  - "despejar dudas"
  - "despejar una pregunta"
replaces:
  - before: "Quiero resolver las dudas que quedaron"
    after: "Quiero despejar las dudas que quedaron"
  - before: "Que no quede ninguna pregunta sin responder"
    after: "Que quede todo despejado"
family: ["despeje", "despejado"]
themes:
  - slug: "docencia"
    relevance: 3
  - slug: "reuniones"
    relevance: 1
tags:
  comodin: ["resolver dudas"]
  funcion: ["explicar"]
  canal: "ambos"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "desplegar"
    difference: "«Desplegar» es abrir o mostrar algo por completo, como un mapa o una lista de opciones; despejar es resolver una duda hasta dejarla clara."
    memory_trick: "Despliegas un mapa; despejas una duda."
exercises:
  - position: 1
    sentence: "Antes de cerrar la reunión, Renata {{blank}} la última duda sobre el presupuesto con un ejemplo simple."
    hint_general: "Busca el verbo para dejar sin dudas a alguien sobre un tema, usando un ejemplo simple."
    explanation: "Despejó: resolvió la última duda con un ejemplo. «Desplegó» es abrir o mostrar algo por completo, y aquí no se mostró nada, y «zanjó» sirve para cerrar una discusión, cuando aquí no había ningún conflicto, solo una duda."
    options:
      - position: 1
        text: "desplegó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Desplegó» es abrir o mostrar algo por completo, como un mapa o una lista de opciones, y aquí no se mostró nada: se resolvió una duda con un ejemplo."
        hint_specific: "Ese verbo se usa para mostrar algo entero, como un mapa o una lista. ¿Aquí se mostró algo, o se resolvió una duda?"
      - position: 2
        text: "despejó"
        is_correct: true
      - position: 3
        text: "zanjó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Zanjó» sirve para terminar una discusión o una decisión pendiente, y aquí no había un conflicto que cerrar, sino una duda que aclarar con un ejemplo."
        hint_specific: "Ese verbo sirve para cerrar una discusión o una decisión pendiente. ¿Había un conflicto que cerrar, o solo una duda?"
  - position: 2
    sentence: "Antes de firmar el contrato de alquiler, Iván quiso {{blank}} cada duda de su abuela sobre las cláusulas."
    hint_general: "El verbo describe dejar sin ninguna duda a otra persona, antes de que firme algo importante."
    explanation: "Despejar: resolver cada duda antes de firmar. «Resolver» se usa más para problemas que hay que arreglar, y aquí no había ningún problema, y «solucionar» también se usa para problemas, cuando las cláusulas solo generaban dudas, no un problema."
    options:
      - position: 1
        text: "resolver"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Resolver» se usa más para problemas o conflictos que hay que arreglar, y aquí no había ningún problema, solo dudas que aclarar antes de firmar."
        hint_specific: "Ese verbo se usa más para problemas que hay que arreglar. ¿Había un problema, o solo dudas sobre las cláusulas?"
      - position: 2
        text: "despejar"
        is_correct: true
      - position: 3
        text: "solucionar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Solucionar» también se usa para problemas que hay que arreglar, y las cláusulas del contrato no eran un problema, sino algo que la abuela no entendía del todo."
        hint_specific: "Ese verbo también se usa para problemas que hay que arreglar. ¿El contrato tenía un problema, o la abuela solo tenía dudas?"
  - position: 3
    sentence: "Cada vez que alguien le pregunta algo técnico, el mecánico {{blank}} la duda con un dibujo rápido en el taller."
    hint_general: "El verbo describe dejar sin duda a alguien que preguntó algo técnico, con un dibujo rápido."
    explanation: "Despeja: resuelve la duda con un dibujo. «Despliega» es mostrar algo por completo, y aquí no se muestra nada entero, y «esclarece» se usa más para sacar a la luz algo oculto de fondo, cuando aquí solo responde una pregunta puntual."
    options:
      - position: 1
        text: "despliega"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Despliega» es abrir o mostrar algo por completo, como una herramienta o un plano, y aquí lo que hace es resolver una duda con un dibujo."
        hint_specific: "Ese verbo sirve para mostrar algo entero, como una herramienta o un plano. ¿El mecánico muestra algo, o responde una pregunta?"
      - position: 2
        text: "despeja"
        is_correct: true
      - position: 3
        text: "esclarece"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Esclarece» se usa más para sacar a la luz algo oculto o confuso de fondo, y aquí el mecánico solo responde una pregunta puntual con un dibujo."
        hint_specific: "Ese verbo se usa más para sacar a la luz algo oculto de fondo. ¿Hay algo oculto aquí, o solo una pregunta puntual?"
  - position: 4
    sentence: "Las respuestas de Marina {{blank}} cualquier duda que le quedaba al panel sobre el proyecto."
    hint_general: "El verbo describe dejar sin ninguna duda a un grupo, gracias a las respuestas dadas."
    explanation: "Despejaron: las respuestas dejaron sin dudas al panel. «Descartaron» diría que el panel rechazó una opción, y aquí entendieron mejor el proyecto, y «zanjaron» sirve para cerrar una discusión, cuando el panel no discutía nada, solo tenía dudas."
    options:
      - position: 1
        text: "descartaron"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Descartaron» diría que el panel dejó de lado una opción, y aquí lo que pasó fue que entendieron mejor el proyecto, no que rechazaran algo."
        hint_specific: "Ese verbo dice que se dejó de lado una opción. ¿El panel rechazó algo, o entendió mejor el proyecto?"
      - position: 2
        text: "despejaron"
        is_correct: true
      - position: 3
        text: "zanjaron"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Zanjaron» sirve para cerrar una discusión o una decisión pendiente, y el panel no discutía nada: solo le quedaban dudas sobre el proyecto."
        hint_specific: "Ese verbo sirve para cerrar una discusión o una decisión pendiente. ¿El panel discutía algo, o solo tenía dudas?"
  - position: 5
    sentence: "Mientras armaba el itinerario del viaje, Camila fue {{blank}} las dudas de sus amigas una por una en el chat."
    hint_general: "El verbo describe dejar sin dudas, una por una, a varias personas en un chat."
    explanation: "Despejando: resolviendo las dudas una por una. «Descifrando» sirve para resolver algo oculto o en clave, y las dudas de sus amigas eran preguntas normales, y «zanjando» sirve para cerrar una discusión, cuando en el chat no había ningún conflicto."
    options:
      - position: 1
        text: "descifrando"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Descifrando» sirve para resolver algo oculto o en clave, como un mensaje raro, y las dudas de sus amigas eran preguntas normales sobre el viaje."
        hint_specific: "Ese verbo sirve para resolver algo oculto o en clave. ¿Las preguntas de sus amigas eran un misterio, o preguntas normales?"
      - position: 2
        text: "despejando"
        is_correct: true
      - position: 3
        text: "zanjando"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Zanjando» sirve para cerrar una discusión o una decisión pendiente, y en el chat no había ningún conflicto, solo preguntas sobre el itinerario."
        hint_specific: "Ese verbo sirve para cerrar una discusión o una decisión pendiente. ¿En el chat había un conflicto, o solo preguntas sobre el viaje?"
  - position: 6
    sentence: "Cada domingo, el abuelo de Tomás {{blank}} con paciencia las dudas que le surgían sobre el celular nuevo."
    hint_general: "El verbo describe dejar sin dudas, con calma, a alguien que pregunta por un aparato nuevo."
    explanation: "Despejaba: resolvía con calma las dudas del nieto. «Dilucidaba» es un verbo muy formal, forzado para un abuelo hablando con su nieto, y «resolvía» se usa más para problemas que arreglar, cuando las dudas sobre el celular eran solo preguntas normales."
    options:
      - position: 1
        text: "dilucidaba"
        is_correct: false
        distractor_type: "register"
        why_not: "«Dilucidaba» es un verbo muy formal, propio de textos legales o académicos, y suena forzado para describir a un abuelo explicándole el celular a su nieto."
        hint_specific: "Ese verbo es muy formal, típico de textos legales. ¿Encaja para describir a un abuelo hablando con su nieto?"
      - position: 2
        text: "despejaba"
        is_correct: true
      - position: 3
        text: "resolvía"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Resolvía» se usa más para problemas que hay que arreglar, y las dudas sobre el celular no eran un problema, solo preguntas que el abuelo aclaraba con calma."
        hint_specific: "Ese verbo se usa más para problemas que hay que arreglar. ¿Las dudas sobre el celular eran un problema, o solo preguntas normales?"
  - position: 7
    sentence: "En el chat del edificio, entre todos {{blank}} las dudas sobre la obra antes de la asamblea."
    hint_general: "El verbo describe dejar sin dudas a un grupo de vecinos, antes de una reunión importante."
    explanation: "Despejamos: resolvimos juntos las dudas del grupo. «Dilucidamos» es un verbo muy formal, forzado en un chat de vecinos, y «descartamos» diría que el grupo rechazó una opción, cuando en realidad entendieron mejor la obra."
    options:
      - position: 1
        text: "dilucidamos"
        is_correct: false
        distractor_type: "register"
        why_not: "«Dilucidamos» es un verbo muy formal, típico de textos legales, y suena forzado para describir un chat de vecinos hablando de una obra."
        hint_specific: "Ese verbo es muy formal, típico de textos legales. ¿Encaja en un chat de vecinos hablando de una obra?"
      - position: 2
        text: "despejamos"
        is_correct: true
      - position: 3
        text: "descartamos"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Descartamos» diría que el grupo dejó de lado una opción, y aquí lo que pasó fue que entendieron mejor la obra, no que rechazaran algo."
        hint_specific: "Ese verbo dice que se dejó de lado una opción. ¿El grupo rechazó algo, o entendió mejor la obra?"
  - position: 8
    sentence: "El candidato dijo que, en su primer mes, {{blank}} con el equipo cualquier duda sobre el nuevo sistema antes de tocar el código."
    hint_general: "El verbo describe dejar sin dudas a un equipo sobre algo nuevo, antes de empezar a trabajar."
    explanation: "Despejaría: resolvería las dudas del equipo. «Desplegaría» es mostrar algo por completo, y aquí no se ofrecía mostrar nada, y «solucionaría» se usa más para problemas que arreglar, cuando aquí no había un problema, solo dudas sobre algo nuevo."
    options:
      - position: 1
        text: "desplegaría"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Desplegaría» es mostrar algo por completo, como un sistema o una lista de funciones, y aquí lo que ofrecía era resolver dudas del equipo, no mostrar algo."
        hint_specific: "Ese verbo sirve para mostrar algo entero, como un sistema o una lista de funciones. ¿El candidato ofrecía mostrar algo, o resolver dudas?"
      - position: 2
        text: "despejaría"
        is_correct: true
      - position: 3
        text: "solucionaría"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Solucionaría» se usa más para problemas que hay que arreglar, y aquí no describía un problema, sino dudas del equipo sobre un sistema nuevo."
        hint_specific: "Ese verbo se usa más para problemas que hay que arreglar. ¿El equipo tenía un problema, o dudas sobre algo nuevo?"
readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "La última pregunta"
    body: "Al cierre de la reunión, alguien del equipo de diseño preguntó algo que llevaba semanas rondando. Renata no lo esquivó: sacó una hoja y dibujó el flujo completo del presupuesto. Nadie volvió a preguntar lo mismo. «Por fin quedó despejado», dijo alguien al salir."
    before_phrase: "Que no quede ninguna pregunta sin responder."
    after_phrase: "Que quede todo despejado."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Las cláusulas del contrato"
    body: "La abuela de Iván no quería firmar sin entender cada línea del contrato de alquiler. Él se sentó con ella toda la tarde, cláusula por cláusula. Al final, ella firmó tranquila. «Gracias por despejarme todas las dudas, hijo», le dijo."
    before_phrase: "Explícame para que no me quede ninguna duda."
    after_phrase: "Despéjame todas las dudas."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "El chat del edificio"
    body: "Antes de la asamblea, el chat del edificio se había llenado de mensajes confusos sobre la obra. Norma se ofreció a hacer una llamada rápida con el administrador y después resumió todo en tres puntos claros. «Gracias por despejar el tema antes de la reunión», le escribió un vecino."
    before_phrase: "A ver si alguien aclara esto de una vez."
    after_phrase: "Gracias por despejar el tema."
