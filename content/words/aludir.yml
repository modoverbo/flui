stressed_syllable: 3
ipa_latam: "[a.luˈðir]"
ipa_es: "[a.luˈðir]"
explanation: "Mencionar algo o a alguien de paso, sin llegar a decir su nombre."
example_sentence: "El jefe habló de los correos de medianoche sin aludir a nadie en concreto."
register: "neutral"
pedantry_risk: 2
usage_tip: "Deja hablar del problema sin poner a nadie en el centro de la sala."
when_not_to_use: "No la uses cuando hace falta un nombre y una fecha; entonces rodear el asunto solo confunde."
collocations:
  - "aludir a alguien"
  - "aludir a un asunto"
  - "darse por aludido"
replaces:
