        hint_specific: "Un cliente compra, y a veces ni te ve. ¿Qué va a hacer esta persona?"
  - position: 7
    sentence: "Marina consiguió el puesto por una {{blank}} de dos minutos: su antigua jefa contó una sola historia."
    hint_general: "Bastaron dos minutos de alguien que respondió por ella."
    explanation: "Referencia: alguien que respondió por ella. «Reverencia» es la inclinación del cuerpo al saludar, y una «transferencia» es un envío de dinero de una cuenta a otra."
    options:
      - position: 1
        text: "transferencia"
        is_correct: false
