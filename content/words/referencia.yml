confusions:
  - confused_with: "reverencia"
    difference: "Una «reverencia» es la inclinación del cuerpo para saludar con respeto; la otra palabra es la persona que responde por tu trabajo."
    memory_trick: "La reverencia se hace con la espalda; lo otro se hace por teléfono."
  - confused_with: "preferencia"
    difference: "Una «preferencia» es lo que eliges antes que otra cosa; la otra palabra no es una elección tuya, es alguien que te avala."
    memory_trick: "La preferencia la eliges tú; lo otro habla de ti."
exercises:
  - position: 1
    sentence: "Leire dejó dos {{blank}} en el formulario y las dos cogieron el teléfono el mismo día."
    hint_general: "Puso dos personas que podían responder por su trabajo."
    explanation: "Referencias: personas que responden por su trabajo. «Reverencias» son inclinaciones del cuerpo al saludar, y «padrinos» es coloquial y sugiere enchufe."
    options:
      - position: 1
        text: "reverencias"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Las «reverencias» son inclinaciones del cuerpo para saludar con respeto, y en un formulario no caben inclinaciones."
        hint_specific: "Una reverencia se hace con la espalda. ¿Qué escribió Leire en el papel?"
      - position: 2
        text: "referencias"
        is_correct: true
      - position: 3
        text: "padrinos"
        is_correct: false
        distractor_type: "register"
        why_not: "«Padrinos» es coloquial y sugiere que alguien te coloca por favores, y estas dos personas solo cuentan lo que le han visto hacer."
        hint_specific: "Un padrino mueve hilos. ¿Qué hacen esas dos personas al coger el teléfono?"
  - position: 2
    sentence: "Antes de poner a alguien como {{blank}}, avísale: así prepara un caso concreto en vez de improvisar."
    hint_general: "Avisa a quien vaya a responder por ti para que lo prepare."
    explanation: "Referencia: quien responde por ti. «Reverencia» es la inclinación del cuerpo al saludar, y un «contacto» es cualquiera que tengas en la agenda."
    options:
      - position: 1
        text: "referencia"
        is_correct: true
      - position: 2
        text: "reverencia"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «reverencia» es la inclinación del cuerpo para saludar, y aquí se habla de una persona a la que hay que avisar."
        hint_specific: "Una reverencia se hace ante un rey o en un teatro. ¿A quién hay que avisar aquí?"
      - position: 3
        text: "contacto"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Un «contacto» es cualquiera que tengas en la agenda, y aquí hace falta alguien que haya visto cómo trabajas."
        hint_specific: "Un contacto puede no saber nada de ti. ¿Qué tiene que preparar esta persona?"
  - position: 3
    sentence: "Le pidieron una {{blank}} y solo se le ocurrió un primo que nunca la había visto trabajar."
    hint_general: "Le pidieron alguien que respondiera por su trabajo y no tenía a nadie."
    explanation: "Referencia: alguien que responda por su trabajo. «Preferencia» sería lo que ella elige antes que otra cosa, y una «amistad» no garantiza haberla visto trabajar."
    options:
      - position: 1
        text: "preferencia"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «preferencia» es lo que eliges antes que otra cosa, y aquí lo que se pide es una persona que responda por ella."
        hint_specific: "Una preferencia se elige entre opciones. ¿Qué le pidieron que aportara?"
      - position: 2
        text: "referencia"
        is_correct: true
      - position: 3
        text: "amistad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «amistad» no garantiza haber visto trabajar a nadie, y ese es justo el problema del primo."
        hint_specific: "Un amigo te quiere, pero puede no saber qué haces. ¿Qué le falta al primo?"
  - position: 4
    sentence: "La mejor {{blank}} de Orlando es una clienta a la que dejó de facturar cuando vio que no le hacía falta."
    hint_general: "Quien mejor habla de él es una clienta con un motivo concreto."
    explanation: "Referencia: quien mejor habla de su trabajo. «Diferencia» es aquello en lo que dos cosas no coinciden, y un «testimonio» es palabra de juzgado y suena a declaración formal."
    options:
      - position: 1
        text: "diferencia"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «diferencia» es aquello en lo que dos cosas no coinciden, y aquí se habla de una persona que lo recomienda."
        hint_specific: "Una diferencia se mide entre dos cosas. ¿Quién habla bien de Orlando?"
      - position: 2
        text: "testimonio"
        is_correct: false
        distractor_type: "register"
        why_not: "«Testimonio» es palabra de juzgado y suena a declaración formal ante una autoridad, y esto es una llamada sobre un trabajo."
        hint_specific: "Un testimonio se presta bajo juramento. ¿Dónde ocurre esta recomendación?"
      - position: 3
        text: "referencia"
        is_correct: true
  - position: 5
    sentence: "Delfina guarda el teléfono de cada jefe con quien acabó bien, por si algún día necesita una {{blank}}."
    hint_general: "Guarda contactos por si alguna vez necesita que respondan por ella."
    explanation: "Referencia: alguien que responda por ella. «Reverencia» es la inclinación del cuerpo al saludar, y una «opinión» la da cualquiera, la haya visto trabajar o no."
    options:
      - position: 1
        text: "referencia"
        is_correct: true
      - position: 2
        text: "reverencia"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «reverencia» es una inclinación del cuerpo para saludar, y para eso no hace falta guardar ningún teléfono."
        hint_specific: "Una reverencia se hace en persona. ¿Para qué guarda Delfina esos números?"
      - position: 3
