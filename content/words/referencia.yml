        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «opinión» la puede dar cualquiera sin haberte visto trabajar, y ella guarda justo a los jefes con quienes trabajó."
        hint_specific: "Una opinión no necesita pruebas. ¿A quién guarda ella en la agenda?"
  - position: 6
    sentence: "Poner como {{blank}} a alguien con quien discutiste el último mes es un riesgo innecesario."
    hint_general: "Es arriesgado elegir a quien acabó enfadado contigo."
    explanation: "Referencia: quien va a hablar de tu trabajo. «Preferencia» sería lo que eliges antes que otra cosa, y un «cliente» puede no haber tratado contigo directamente."
    options:
      - position: 1
        text: "preferencia"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «preferencia» es lo que eliges antes que otra cosa, y aquí lo que se elige es a quién van a llamar para preguntar por ti."
        hint_specific: "Una preferencia ordena opciones. ¿Qué papel tiene esa persona en la frase?"
