        why_not: "Una «transferencia» es un envío de dinero de una cuenta a otra, y aquí lo que se envía es una historia contada por teléfono."
        hint_specific: "Una transferencia aparece en el banco. ¿Qué duró dos minutos?"
      - position: 2
        text: "referencia"
        is_correct: true
      - position: 3
        text: "reverencia"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «reverencia» es una inclinación del cuerpo al saludar, y su antigua jefa lo que hizo fue contar una historia."
        hint_specific: "Una reverencia no lleva palabras. ¿Qué contó la antigua jefa?"
  - position: 8
    sentence: "Una buena {{blank}} cuenta un caso; una mala se limita a decir que eres buena persona."
    hint_general: "Quien responde bien por ti cuenta un caso concreto."
    explanation: "Referencia: quien responde por ti. «Diferencia» es aquello en lo que dos cosas no coinciden, y un «currículo» es el papel que escribes tú, no lo que dice otra persona."
    options:
      - position: 1
        text: "referencia"
