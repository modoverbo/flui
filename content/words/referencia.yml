        text: "diferencia"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «diferencia» es aquello en lo que dos cosas no coinciden, y aquí se comparan dos maneras de hablar de alguien."
        hint_specific: "Una diferencia no habla por teléfono. ¿Quién cuenta el caso en la frase?"
      - position: 3
        text: "currículo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Un «currículo» lo escribes tú, y la frase compara lo que dice de ti otra persona."
