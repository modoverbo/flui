readings:
  - position: 1
    scene: "entrevista"
    conversation_type: "practica"
    title: "Dos minutos que decidieron"
    body: "A Marina la llamaron el martes y el miércoles llamaron a su antigua jefa. Fueron dos minutos: contó cómo Marina resolvió una entrega en agosto con media plantilla de vacaciones. El jueves tenía el puesto. «Esa referencia valió más que mi currículo», dice."
    before_phrase: "Pueden preguntar a quien quieran de mi trabajo anterior."
    after_phrase: "Le dejo una referencia que estuvo allí en agosto."
  - position: 2
    scene: "trabajo"
    conversation_type: "practica"
    title: "Avisar antes"
    body: "Leire puso a dos personas y las avisó por mensaje el mismo día: «Te pueden llamar; si lo hacen, cuenta lo del traslado del almacén». Las dos cogieron el teléfono y las dos contaron esa historia. Quien preguntaba colgó con una idea clara, no con un elogio general."
    before_phrase: "He puesto tu nombre, espero que no te importe."
    after_phrase: "Te he puesto como referencia; te aviso por si llaman."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "La clienta de Orlando"
    body: "Orlando dejó de facturar a una clienta el mes en que vio que no le hacía falta el servicio. Ella no lo olvidó. Desde entonces es su mejor referencia en el barrio y él no ha tenido que anunciarse nunca más."
    before_phrase: "Es que ella siempre habla muy bien de mí."
    after_phrase: "Es mi mejor referencia en el barrio."
