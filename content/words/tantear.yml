    difference: "«Tentar» es despertar en alguien las ganas de algo; la otra palabra es explorar con cuidado cómo va a reaccionar."
    memory_trick: "Te tienta lo que deseas; tanteas lo que exploras."
  - confused_with: "sondear"
    difference: "«Sondear» se usa sobre todo con grupos, encuestas y cifras; lo otro cabe en una charla con una sola persona."
    memory_trick: "Sondeas a cien; tanteas a uno."
