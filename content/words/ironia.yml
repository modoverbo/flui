explanation: "Forma de hablar en la que dices lo contrario de lo que quieres decir, con gracia."
example_sentence: "Dijo «qué buen día» bajo la lluvia, y todos entendimos la ironía."
register: "neutral"
pedantry_risk: 1
usage_tip: "Funciona cuando la otra persona ve lo mismo que tú: si no comparte la escena, se entiende al revés."
when_not_to_use: "No la uses por escrito con alguien que no te conoce, ni cuando quieras que el otro se sienta pequeño."
collocations:
