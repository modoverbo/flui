        hint_specific: "Una «crítica» va de cara. ¿Tu hermana señala el desorden o lo dice al revés?"
  - position: 8
    sentence: "Tobías cuenta sus desastres de cocina con una {{blank}} que desarma: parece que se queja y en realidad se está riendo de sí mismo."
    hint_general: "Cuenta lo real al revés, y por eso suena a queja aunque no lo sea."
    explanation: "Ironía: cuenta lo real al revés y suena a queja sin serlo. Una «exageración» agrandaría el desastre, y una «broma» se prepara aparte de lo que ha pasado."
