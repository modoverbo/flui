        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «indirecta» va dirigida a alguien concreto, y la frase dice que nadie se dio por aludido."
        hint_specific: "Una «indirecta» siempre tiene destinatario. ¿Quién se sintió señalado?"
      - position: 3
        text: "ironía"
        is_correct: true
  - position: 6
    sentence: "Norma tira de {{blank}} para reírse de sus propios planes fallidos: ni una gota de amargura, y sus amigos lo agradecen."
    hint_general: "Cuenta al revés lo que le ha salido mal, y lo hace sin rencor."
    explanation: "Ironía: cuenta al revés lo que le salió mal, sin rencor. «Mofa» ridiculizaría a alguien, y «sarcasmo» traería una punta de amargura, y la frase dice que no hay ninguna."
    options:
      - position: 1
        text: "ironía"
        is_correct: true
      - position: 2
        text: "mofa"
        is_correct: false
        distractor_type: "register"
        why_not: "«Mofa» ridiculiza a alguien delante de los demás, y ella habla de sus propios planes con cariño."
        hint_specific: "«Mofa» busca poner en ridículo. ¿A quién ridiculiza Norma?"
      - position: 3
        text: "sarcasmo"
