        text: "chanza"
        is_correct: false
        distractor_type: "register"
        why_not: "«Chanza» suena antigua y nombra una broma ligera, no el hecho de afirmar lo contrario de lo que sientes."
        hint_specific: "«Chanza» es una broma cualquiera, de otra época. ¿Qué hace especial la frase de Perla?"
      - position: 2
