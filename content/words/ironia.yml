readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "Diez minutos de lluvia"
    body: "Se cortó la luz en plena cena y quedaron seis personas con dos velas. Marina levantó el vaso y dijo: «Qué acierto haber elegido el restaurante más moderno de la ciudad». Todos se rieron, incluida la dueña. La ironía sirvió de puente: en diez minutos ya nadie hablaba de la luz."
    before_phrase: "Lo dije al revés, medio en broma."
    after_phrase: "Lo dije con ironía."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "El cuarto de Tobías"
    body: "Su madre abrió la puerta, vio la ropa por el suelo y dijo: «Impecable, como siempre». Tobías se rio y empezó a recoger sin discutir. Después le contó que en el trabajo llevaba dos semanas sin dormir bien. La ironía le había ahorrado la regañina y le había abierto la conversación."
    before_phrase: "Podría haberle gritado por el desorden."
    after_phrase: "Una ironía suave y se abrió solo."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El correo que no se envía"
    body: "Norma escribió «gracias por avisar con tanto tiempo» y se quedó mirando la frase. Recordó que su compañera no conocía su tono y que, por escrito, la ironía viaja mal. Borró la línea y escribió: «Avísame antes la próxima vez, por favor». La respuesta llegó en dos minutos y con una disculpa."
    before_phrase: "Lo escribí al revés y quedó raro."
    after_phrase: "La ironía funciona hablando, no por escrito."
