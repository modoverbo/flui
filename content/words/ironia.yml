confusions:
  - confused_with: "sarcasmo"
    difference: "El «sarcasmo» dice lo contrario para herir a alguien; la ironía dice lo contrario para hacer gracia sin dejar a nadie mal."
    memory_trick: "El sarcasmo pincha; la ironía guiña."
  - confused_with: "armonía"
    difference: "«Armonía» es entenderse sin roces; la ironía es una manera de decir las cosas, no un buen ambiente."
    memory_trick: "La armonía se siente; la ironía se dice."
exercises:
  - position: 1
    sentence: "En el «qué puntual eres» que Marina soltó a las nueve y media hubo más {{blank}} que reproche, y el que llegó tarde fue el primero en reírse."
    hint_general: "Decir lo contrario de lo que se piensa, con gracia y sin intención de hacer daño."
    explanation: "Ironía: dice lo contrario de lo que piensa y hace gracia. «Armonía» sería entenderse sin roces, y «sarcasmo» buscaría herir, y el que llegó tarde se rio primero."
    options:
      - position: 1
        text: "armonía"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Armonía» es la calma de un grupo que se entiende sin roces, y aquí lo que hay es una frase que dice lo contrario de lo que se piensa."
        hint_specific: "«Armonía» describe el ambiente, no una manera de decir. ¿Qué se está señalando aquí?"
      - position: 2
        text: "ironía"
        is_correct: true
      - position: 3
        text: "sarcasmo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sarcasmo» añade la intención de herir a quien lo recibe, y la frase dice que el aludido fue el primero en reírse."
        hint_specific: "«Sarcasmo» deja escocido a alguien. ¿Cómo reaccionó el que llegó tarde?"
  - position: 2
    sentence: "Mi padre mira el cielo gris y dice «vaya día de playa»: es su {{blank}} de siempre, y en casa nadie se ofende."
    hint_general: "Es su manera habitual de decir lo contrario de lo que ve, sin molestar a nadie."
    explanation: "Ironía: dice lo contrario de lo que ve y nadie se ofende. «Mofa» ridiculizaría a alguien, y «sinceridad» sería decir exactamente lo que tiene delante."
    options:
      - position: 1
        text: "mofa"
        is_correct: false
        distractor_type: "register"
        why_not: "«Mofa» es una burla dura que deja a alguien en ridículo, y la frase dice que en casa nadie se ofende."
        hint_specific: "«Mofa» necesita alguien humillado. ¿Quién sale mal parado mirando el cielo?"
      - position: 2
        text: "ironía"
        is_correct: true
      - position: 3
        text: "sinceridad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sinceridad» sería decir el tiempo tal como es, y él afirma justo lo contrario de lo que está viendo."
        hint_specific: "«Sinceridad» describe la realidad. ¿Qué tiempo hace y qué dice tu padre?"
  - position: 3
    sentence: "Leandro contesta con {{blank}} cuando algo le incomoda: dice lo contrario de lo que siente, todos lo entienden a la primera y nadie se molesta."
    hint_general: "Una manera de decir las cosas al revés que el grupo capta enseguida."
    explanation: "Ironía: dice las cosas al revés y el grupo lo capta. «Sarcasmo» dejaría a alguien dolido, y una «indirecta» deja el mensaje a medias para que lo adivinen."
    options:
      - position: 1
        text: "sarcasmo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sarcasmo» lleva la intención de dejar dolido a alguien, y la frase aclara que nadie se molesta."
        hint_specific: "«Sarcasmo» hace daño a propósito. ¿Alguien sale herido en esa escena?"
      - position: 2
        text: "indirecta"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «indirecta» deja el mensaje a medias para que el otro lo adivine, y aquí todos lo entienden a la primera."
        hint_specific: "Una «indirecta» se queda a medio camino. ¿Cuánto tardan los demás en entenderlo?"
      - position: 3
        text: "ironía"
        is_correct: true
  - position: 4
    sentence: "Su respuesta tenía más {{blank}} que enfado, y por eso la discusión acabó en risas y no en un portazo."
    hint_general: "Respondió diciendo lo contrario de lo que sentía, y eso bajó la tensión."
    explanation: "Ironía: respondió al revés y bajó la tensión. «Armonía» describiría un ambiente sin roces, y una «exageración» agrandaría el problema en vez de darle la vuelta."
    options:
      - position: 1
        text: "exageración"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «exageración» agranda el problema, y aquí no se agranda nada: se dice lo contrario de lo que se siente."
        hint_specific: "Una «exageración» infla lo que pasa. ¿Se infla algo o se le da la vuelta?"
      - position: 2
        text: "ironía"
        is_correct: true
      - position: 3
        text: "armonía"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Armonía» nombra el buen ambiente entre personas, no una forma de responder; aquí se describe cómo contestó."
        hint_specific: "«Armonía» habla del clima entre dos. ¿La frase describe el clima o la respuesta?"
  - position: 5
    sentence: "Perla dijo «me encanta madrugar» a las seis de la mañana con tanta {{blank}} que el grupo entero se rio, y nadie se dio por aludido."
    hint_general: "Afirmó lo contrario de lo que sentía, y el grupo lo pilló al vuelo."
    explanation: "Ironía: afirmó lo contrario de lo que sentía. «Chanza» suena antigua y nombra una broma ligera, y una «indirecta» apunta a alguien concreto, y nadie se dio por aludido."
