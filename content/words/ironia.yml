        distractor_type: "near_synonym"
        why_not: "«Sarcasmo» trae siempre una punta de amargura, y la frase dice que aquí no hay ni una gota."
        hint_specific: "«Sarcasmo» deja un poso amargo. ¿Qué dice la frase sobre la amargura?"
  - position: 7
    sentence: "Cuando mi hermana dice «qué ordenada está la habitación» y hay ropa por el suelo, todos sabemos que habla con {{blank}} y que no pasa nada."
    hint_general: "Dice lo contrario de lo que tiene delante, y en casa se entiende al vuelo."
    explanation: "Ironía: dice lo contrario de lo que tiene delante. «Sinceridad» sería describir el cuarto tal cual, y una «crítica» señalaría el fallo de frente y sin darle la vuelta."
    options:
