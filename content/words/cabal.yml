readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "El cambio de más"
    body: "Modesto se dio cuenta en la puerta de que le habían devuelto doce euros de más. Volvió al mostrador y los dejó en el plato sin decir casi nada. La cajera lo contó luego en el barrio. Ahora, cuando alguien duda de con quién dejar las llaves, dicen: «Con él, que es cabal»."
    before_phrase: "Ese es buena gente de verdad."
    after_phrase: "Ese es cabal."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Las herramientas de mi abuelo"
    body: "Mi abuelo prestaba herramientas a medio pueblo y tenía una sola manera de juzgar a la gente: si volvían antes de que hicieran falta. «Ese es cabal», decía, y no había más conversación. Nunca supe si perdió alguna, porque tampoco lo habría contado."
    before_phrase: "Ese es de fiar, ya lo verás."
    after_phrase: "Ese es cabal."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "Sin papeles de por medio"
    body: "El trato se cerró con un apretón de manos y dos líneas por mensaje. No hubo contrato largo ni cláusulas. «Las dos partes son gente cabal», explicó Dolores cuando le preguntaron si no era arriesgado. Se cumplió a la fecha, y al año siguiente repitieron igual."
    before_phrase: "Nos fiamos el uno del otro y ya está."
    after_phrase: "Las dos partes son gente cabal."
