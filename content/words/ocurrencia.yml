explanation: "Idea con gracia que a alguien se le pasa por la cabeza y dice sin prepararla."
example_sentence: "Su última ocurrencia dejó a media mesa riendo durante diez minutos."
register: "neutral"
pedantry_risk: 1
usage_tip: "Sirve para celebrar la gracia de otra persona sin llamarla graciosa: elogia la idea, no el papel de payaso."
when_not_to_use: "No la uses para una broma preparada de antemano ni para un comentario que incomoda a quien lo escucha."
collocations:
