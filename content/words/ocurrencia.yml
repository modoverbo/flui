confusions:
  - confused_with: "impertinencia"
    difference: "Una «impertinencia» incomoda y está fuera de lugar; una ocurrencia hace reír sin dejar a nadie mal."
    memory_trick: "La impertinencia molesta; la ocurrencia alegra."
  - confused_with: "broma"
    difference: "Una «broma» se prepara y va dirigida a alguien; una ocurrencia sale sola, en el momento y sin destinatario."
    memory_trick: "La broma se planea; la ocurrencia se escapa."
exercises:
  - position: 1
    sentence: "Mi tía guarda en el teléfono cada {{blank}} de mi sobrino; la última, «lunes de disfraz» para el primer día de curso, se repite en casa como un clásico."
    hint_general: "Es la frase graciosa que alguien suelta sin pensarla y a los demás les encanta."
    explanation: "Ocurrencia: una frase graciosa que la familia guarda y repite. «Insolencia» sería una falta de respeto, y «bobada» es coloquial y le quitaría todo el valor."
    options:
      - position: 1
        text: "insolencia"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «insolencia» falta al respeto a alguien, y bautizar el lunes con un disfraz no ofende a nadie."
        hint_specific: "«Insolencia» supone alguien ofendido. ¿Quién se molesta en esa casa?"
      - position: 2
        text: "ocurrencia"
        is_correct: true
      - position: 3
        text: "bobada"
        is_correct: false
        distractor_type: "register"
        why_not: "«Bobada» es coloquial y despacha algo como si no valiera nada, y aquí las frases del niño se guardan y se repiten."
        hint_specific: "«Bobada» quita valor. ¿La tía tira esas frases o las colecciona?"
  - position: 2
    sentence: "Dante llegó tieso a la primera cita, pero una {{blank}} sobre el perro que dormía bajo la barra rompió el hielo antes del primer plato."
    hint_general: "Nació de lo que los dos estaban viendo y no escondía ningún mensaje."
    explanation: "Ocurrencia: nació de lo que los dos veían en ese momento. Un «chiste» se lleva aprendido, y una «indirecta» diría algo a medias para que el otro lo entienda."
    options:
      - position: 1
        text: "ocurrencia"
        is_correct: true
      - position: 2
        text: "chiste"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Un «chiste» se lleva aprendido y funciona igual en cualquier sitio; esta frase solo existe por el perro de ese bar."
        hint_specific: "Un «chiste» viaja contigo. ¿Esta frase se podía contar en otra parte?"
      - position: 3
        text: "indirecta"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «indirecta» dice algo a medias esperando que el otro lo capte, y aquí no hay mensaje escondido."
        hint_specific: "Una «indirecta» siempre esconde algo. ¿Qué mensaje oculto hay en la frase del perro?"
  - position: 3
    sentence: "Cuando Selene contó que se le había ido el tren por dos minutos, Abel respondió con una {{blank}} que la hizo reír a ella primero."
    hint_general: "Una frase graciosa sobre algo real que alivia a quien lo está contando."
    explanation: "Ocurrencia: una frase graciosa que alivia a quien cuenta el apuro. Un «invento» sería algo falso, y una «burla» se reiría de ella, y ella es la primera en reírse."
    options:
      - position: 1
        text: "invento"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Un «invento» es algo que alguien se saca de la nada y no es cierto, y aquí el tren perdido es real."
        hint_specific: "Un «invento» no ha pasado. ¿Lo del tren pasó o se lo imaginó Abel?"
      - position: 2
        text: "burla"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «burla» se ríe de alguien a su costa, y la frase dice que Selene fue la primera en reírse."
        hint_specific: "Una «burla» deja a alguien peor. ¿Quién se rio antes que nadie?"
      - position: 3
        text: "ocurrencia"
        is_correct: true
  - position: 4
    sentence: "En casa llaman {{blank}} a cada frase que suelta Bárbara, y aun así todos esperan la siguiente con ganas."
    hint_general: "Lo que sueltan sin pensar y a los demás les hace ilusión escuchar."
    explanation: "Ocurrencia: una frase graciosa que los demás esperan con ganas. «Tontería» es coloquial y la despacharía sin valor, y una «idea» puede ser seria y útil, no graciosa."
    options:
      - position: 1
        text: "tontería"
        is_correct: false
        distractor_type: "register"
        why_not: "«Tontería» es coloquial y despacha algo como si no valiera nada, y en esa casa esperan la siguiente con ganas."
        hint_specific: "«Tontería» desprecia lo dicho. ¿La familia lo desprecia o lo espera?"
      - position: 2
        text: "ocurrencia"
        is_correct: true
      - position: 3
        text: "idea"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «idea» puede ser seria, útil y nada graciosa, y lo que aquí se celebra es la gracia de lo que dice."
        hint_specific: "Una «idea» puede ser un plan de trabajo. ¿Qué esperan en esa casa: un plan o una risa?"
  - position: 5
    sentence: "Ulises soltó una {{blank}} en plena cola del cine y hasta quien cobraba las entradas se rio, sin que nadie se sintiera aludido."
    hint_general: "Una salida graciosa del momento que no incomoda a ninguno de los presentes."
    explanation: "Ocurrencia: una salida del momento que a nadie incomoda. Una «impertinencia» molestaría a quien la oye, y una «exageración» solo agrandaría un hecho."
    options:
      - position: 1
        text: "impertinencia"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «impertinencia» incomoda a quien la escucha, y aquí hasta la persona de la taquilla se rio."
        hint_specific: "Una «impertinencia» deja mal ambiente. ¿Cómo reaccionó la gente de la cola?"
      - position: 2
        text: "exageración"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «exageración» agranda un hecho hasta pasarse, y lo que hubo fue una frase graciosa sobre la espera."
        hint_specific: "Una «exageración» infla algo real. ¿Ulises infló un dato o dijo algo con gracia?"
      - position: 3
        text: "ocurrencia"
        is_correct: true
  - position: 6
    sentence: "Cada vez que el grupo se atasca eligiendo restaurante, Otilia suelta una {{blank}} propia y en dos minutos ya están decidiendo otra vez."
    hint_general: "Una frase suya, nacida ahí mismo, que descongela al grupo."
    explanation: "Ocurrencia: una frase suya, nacida ahí mismo, que descongela al grupo. Una «imitación» copiaría a alguien, y una «broma» se prepara antes y busca destinatario."
    options:
      - position: 1
        text: "imitación"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «imitación» copia la voz o los gestos de otra persona, y la frase dice que lo que suelta es suyo."
        hint_specific: "Una «imitación» necesita a quién copiar. ¿A quién copia Otilia?"
      - position: 2
        text: "ocurrencia"
        is_correct: true
      - position: 3
        text: "broma"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «broma» se prepara antes y apunta a alguien, y esto sale en el momento para desbloquear la charla."
        hint_specific: "Una «broma» se trae de casa. ¿Cuándo aparece lo que dice Otilia?"
  - position: 7
    sentence: "Nadie recuerda quién ganó la partida, pero la {{blank}} de Wanda al repartir las cartas se cuenta cada año con cariño."
    hint_general: "Una frase del momento que quedó como recuerdo bonito de esa noche."
    explanation: "Ocurrencia: una frase del momento que quedó como buen recuerdo. Un «chiste» funcionaría en cualquier sitio, y una «insolencia» habría ofendido a alguien de la mesa."
    options:
      - position: 1
        text: "chiste"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Un «chiste» se cuenta igual en cualquier sitio, y esta frase solo tiene gracia porque salió repartiendo cartas."
        hint_specific: "Un «chiste» no depende del lugar. ¿Esta frase funciona lejos de esa mesa?"
      - position: 2
        text: "insolencia"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «insolencia» ofende a quien la recibe, y esta frase se recuerda cada año con cariño."
        hint_specific: "Una «insolencia» deja a alguien dolido. ¿Con qué se recuerda esa noche?"
      - position: 3
        text: "ocurrencia"
        is_correct: true
readings:
  - position: 1
    scene: "familia"
    conversation_type: "emocional"
    title: "El cuaderno de frases"
    body: "En casa de Bárbara hay un cuaderno con las frases de los nietos. Su abuela lo empezó hace veinte años y sigue anotando. «Esta ocurrencia va a la página nueva», dice cada vez que alguien suelta algo bueno. En la última cena de fin de año lo leyeron entero y nadie se quiso ir a dormir."
    before_phrase: "Qué cosas dice, ¿no?"
    after_phrase: "Qué ocurrencia tan buena."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "La cola del cine"
    body: "La cola no avanzaba y la gente empezaba a resoplar. Ulises miró el cartel y dijo: «Si esto tarda más, vemos la película en el teléfono y les contamos el final». La pareja de delante se rio y siguió hablando con ellos hasta la sala. A veces una ocurrencia hace más por una fila que diez quejas."
    before_phrase: "Dije una tontería y funcionó."
    after_phrase: "Una ocurrencia a tiempo lo arregló."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El nombre del proyecto"
    body: "El equipo llevaba una hora buscando nombre y ninguno convencía. Wanda levantó la vista y propuso «Lunes», porque era el día en que todo se atascaba. Se rieron, y el nombre se quedó. «Fue una ocurrencia», dijo ella, «pero ahora nadie se confunde de carpeta»."
    before_phrase: "Dije lo primero que se me pasó por la cabeza."
    after_phrase: "Fue una ocurrencia, y funcionó."
