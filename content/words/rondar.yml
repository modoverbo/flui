        distractor_type: "near_synonym"
        why_not: "«Acechar» implica una intención hostil o amenazante, y la frase describe la esperanza de un encuentro, no una amenaza."
        hint_specific: "Acechar implica una intención hostil. ¿Camila tiene una intención hostil o solo espera un encuentro?"
  - position: 4
    sentence: "Antes de animarse a hablarle, Diego pasó dos semanas {{blank}} cerca del escritorio de la nueva contadora."
    hint_general: "Buscar excusas para pasar cerca de alguien que te gusta, sin todavía hablarle."
    explanation: "Rondando: buscando excusas para pasar cerca de alguien, sin todavía hablarle. «Chamuyando» es coloquial y regional, y «acechando» implica una intención hostil; ninguno describe esa timidez."
