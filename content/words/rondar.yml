        hint_specific: "Acechar implica una amenaza. ¿Hugo tenía una intención hostil o solo timidez?"
  - position: 6
    sentence: "El pretendiente {{blank}} la puerta de su edificio cada tarde, esperando encontrársela por casualidad."
