confusions:
  - confused_with: "acechar"
    difference: "Acechar implica vigilar con intención hostil o amenazante; rondar, en este sentido, es buscar con interés una oportunidad de acercarte, sin ninguna intención de dañar."
    memory_trick: "Se acecha para atacar; se ronda para acercarse."
exercises:
  - position: 1
    sentence: "Todos en la oficina notaban que Iván llevaba semanas {{blank}} a la nueva del equipo de diseño."
    hint_general: "Andar cerca de alguien que te gusta, buscando una oportunidad de acercarte."
    explanation: "Rondando: andando cerca de alguien que te gusta, buscando una oportunidad. «Acechando» implica una intención hostil, y «evitando» describe justo lo contrario de buscar cruzarse con alguien."
    options:
      - position: 1
        text: "rondando"
        is_correct: true
      - position: 2
        text: "acechando"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Acechar» implica vigilar con una intención hostil o amenazante, y la frase describe un interés cotidiano de oficina, sin ninguna amenaza."
        hint_specific: "Acechar implica una intención hostil. ¿La frase describe una amenaza o un interés cotidiano?"
      - position: 3
        text: "evitando"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Evitar» describe justo lo contrario, y la frase dice que Iván buscaba cruzarse con ella, no alejarse."
        hint_specific: "Evitar es alejarse de alguien. ¿Iván se aleja de ella o busca cruzarse?"
  - position: 2
    sentence: "Desde que la vio en la fiesta, Bruno {{blank}} el mismo café donde ella trabaja cada tarde."
    hint_general: "Andar cerca de un lugar que frecuenta alguien que te gusta, buscando cruzarte con esa persona."
    explanation: "Ronda: anda cerca de un lugar que frecuenta esa persona. «Ronca» describe el sonido de alguien durmiendo, y «acecha» implica una intención hostil; ninguno describe pasar por un café buscando a alguien."
    options:
      - position: 1
        text: "ronda"
        is_correct: true
      - position: 2
        text: "ronca"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Roncar» describe el sonido que hace alguien mientras duerme, sin relación con pasar por un café para cruzarse con ella."
        hint_specific: "Roncar es un sonido al dormir. ¿La frase habla de dormir o de pasar por un café?"
      - position: 3
        text: "acecha"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Acechar» implica una intención hostil o amenazante, y la frase describe un interés cotidiano después de conocerla en una fiesta."
        hint_specific: "Acechar implica una intención hostil. ¿La frase describe una amenaza o un interés después de una fiesta?"
  - position: 3
    sentence: "Camila lleva un mes {{blank}} la cuadra del gimnasio nuevo, con la esperanza de encontrarse con el instructor."
    hint_general: "Pasar cerca de un lugar buscando cruzarte con alguien que te interesa."
    explanation: "Rondando: pasando cerca de un lugar buscando cruzarte con alguien. «Vendiendo» describe una actividad comercial, sin relación con buscar a alguien, y «acechando» implica una intención hostil."
