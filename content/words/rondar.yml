ipa_latam: "[ronˈdaɾ]"
ipa_es: "[ronˈdaɾ]"
explanation: "Andar cerca de alguien que te gusta, buscando una oportunidad para acercarte más."
example_sentence: "Desde el asado de fin de año, ese amigo de un amigo ronda a Valentina en cada plan del grupo."
register: "neutral"
pedantry_risk: 1
usage_tip: "Úsalo para describir a alguien que busca cruzarse con otra persona, sin todavía haber dado el paso."
when_not_to_use: "No lo uses para describir a alguien que incomoda o persigue de forma insistente: eso ya no es rondar, es acosar."
collocations:
  - "rondar a alguien"
  - "andar rondando"
  - "llevar semanas rondando"
replaces:
