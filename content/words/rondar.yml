        hint_specific: "Pintar es una actividad de mantenimiento. ¿El pretendiente pinta el edificio o espera un encuentro?"
      - position: 3
        text: "acecha"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Acechar» implica una intención hostil o amenazante, y aquí el pretendiente solo espera un encuentro casual, sin ninguna amenaza."
