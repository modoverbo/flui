  - position: 7
    sentence: "Su hermana le advirtió: «Ese chico lleva todo el verano {{blank}} tu grupo de amigas, y todavía no se anima a nada»."
    hint_general: "Frecuentar el entorno de alguien, esperando el momento de acercarse."
    explanation: "Rondando: frecuentando el entorno de alguien, esperando el momento de acercarse. «Ignorando» describe justo lo contrario, y «acosando» implicaría incomodar, algo que la frase no menciona."
    options:
      - position: 1
