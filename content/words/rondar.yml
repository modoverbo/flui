readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "social"
    title: "La nueva del equipo de diseño"
    body: "Marina notó que Iván pasaba por el área de diseño más de lo normal. «Lleva semanas rondándola», le comentó a otra compañera, «a ver cuándo se anima a invitarla un café»."
    before_phrase: "Anda detrás de ella hace semanas."
    after_phrase: "Lleva semanas rondándola."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "El café de cada tarde"
    body: "Desde la fiesta, Bruno empezó a pasar por el café donde ella trabajaba, sin animarse a entrar. «¿La vas a rondar toda la semana o le vas a hablar?», le preguntó un amigo, y Bruno solo sonrió, nervioso."
    before_phrase: "¿Vas a andar detrás de ella toda la semana?"
    after_phrase: "¿La vas a rondar toda la semana?"
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "El chico del verano"
    body: "Su hermana lo notó antes que nadie: ese chico llevaba semanas apareciendo donde estaba su grupo de amigas. «Te ronda hace rato, y tú ni cuenta te das», le dijo, entre risas, mientras la ayudaba a arreglarse para salir."
    before_phrase: "Anda detrás de ti hace rato, y ni cuenta te das."
    after_phrase: "Te ronda hace rato, y ni cuenta te das."
