  - "te"
  - "men"
  - "te"
stressed_syllable: 5
ipa_latam: "[kon.se.kwen.teˈmen.te]"
ipa_es: "[kon.se.kwen.teˈmen.te]"
explanation: "Presenta lo que viene como resultado directo de lo que acabas de contar."
example_sentence: "Cerró la fábrica del valle y, consecuentemente, el pueblo perdió su autobús."
register: "neutral"
pedantry_risk: 2
usage_tip: "Marca la cadena entre dos hechos para que nadie te pregunte por qué pasó lo segundo."
when_not_to_use: "No la uses si las dos cosas solo coinciden en el tiempo; sin causa detrás suena a excusa."
collocations:
  - "consecuentemente bajó"
  - "obrar consecuentemente"
replaces:
  - before: "Y por eso se recortó el turno"
    after: "Consecuentemente se recortó el turno"
  - before: "Así que el autobús cambió de ruta"
    after: "Consecuentemente el autobús cambió de ruta"
  - before: "Y claro, la tienda se mudó"
    after: "Consecuentemente la tienda se mudó"
family:
  - "consecuente"
themes:
  - slug: "conectores-estructura"
    relevance: 3
  - slug: "redaccion-ejecutiva"
    relevance: 2
