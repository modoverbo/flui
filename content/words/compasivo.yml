  - "vo"
stressed_syllable: 3
ipa_latam: "[kom.paˈsi.βo]"
ipa_es: "[kom.paˈsi.βo]"
explanation: "Que comprende el dolor o el error de otra gente y la trata con cariño en vez de juzgarla."
example_sentence: "Ante el error de su compañero, Celina fue compasiva y prefirió ayudarlo en vez de señalarlo."
register: "neutral"
pedantry_risk: 1
usage_tip: "Funciona como elogio para quien perdona con calidez; no lo uses como excusa para dejar pasar cualquier cosa."
when_not_to_use: "No la uses para quien es blando o no pone límites: compasivo comprende el fallo, no lo ignora todo."
collocations:
  - "una mirada compasiva"
  - "un gesto compasivo"
replaces:
  - before: "Es alguien que entiende cuando te equivocas y no te trata mal por eso"
    after: "Es alguien compasivo cuando te equivocas"
  - before: "Trata con cariño a quien comete un error, sin juzgarlo"
    after: "Es compasivo con quien comete un error"
family:
  - "compasión"
  - "compasivamente"
themes:
  - slug: "pedir-disculparse"
    relevance: 3
tags:
  comodin:
