readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "La cita del notario"
    body: "El equipo llevaba media hora atascado en la ronda y nadie quería decirlo. Genaro llamó y avisó sin dramatizar: «Con este tráfico difícilmente llegamos a las ocho». El notario movió la cita veinte minutos y la firma salió igual."
    before_phrase: "No creo que lleguemos, con este tráfico, no sé."
    after_phrase: "Con este tráfico difícilmente llegamos a las ocho."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "El pan del mercado viejo"
    body: "Le preguntaron por qué cruzaba media ciudad para comprar pan. Rosenda lo dijo sin presumir: «Un pan así difícilmente se encuentra en otro sitio». Tres personas de la mesa apuntaron la dirección en el teléfono."
    before_phrase: "Es que un pan así no lo encuentras en ningún lado, o sea."
    after_phrase: "Un pan así difícilmente se encuentra en otro sitio."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "La mesa de agosto"
    body: "Nadie se atrevía a preguntar si habría comida familiar después de la bronca de mayo. Su tía lo dijo con calma y sin cerrar la puerta: «Difícilmente compartirán mesa este verano». Justo por decirlo así, en septiembre alguien se atrevió a llamar."
    before_phrase: "Ni de broma se sientan juntos, tú verás."
    after_phrase: "Difícilmente compartirán mesa este verano."
