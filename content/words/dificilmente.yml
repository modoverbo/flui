confusions:
  - confused_with: "dificultosamente"
    difference: "«Dificultosamente» describe cómo se hace algo, con esfuerzo y trabas: «subió dificultosamente». La otra habla de probabilidad."
    memory_trick: "Una cuenta el esfuerzo; la otra calcula las opciones."
  - confused_with: "deficientemente"
    difference: "«Deficientemente» dice que algo se hizo mal o a medias: «quedó deficientemente sellado». La otra no juzga la calidad: mide lo improbable."
    memory_trick: "Una suspende el resultado; la otra ni siquiera lo espera."
