explanation: "Aceptar el error de alguien y no reclamar nada, porque comprendes el motivo que lo explica."
example_sentence: "Marta decidió excusar el olvido de su amigo porque sabía que había tenido una semana difícil."
register: "neutral"
pedantry_risk: 1
usage_tip: "Sirve para dejar pasar un fallo pequeño sin reproche, cuando entiendes bien la razón detrás."
when_not_to_use: "No la uses para faltas graves que sí necesitan una disculpa formal, solo para errores pequeños y comprensibles."
collocations:
  - "excusar un retraso"
  - "excusar un olvido"
replaces:
  - before: "No pasa nada, entiendo por qué llegaste tarde"
    after: "Te excuso, entiendo por qué llegaste tarde"
  - before: "Se le puede perdonar ese descuido, tenía sus razones"
    after: "Se le puede excusar ese descuido, tenía sus razones"
