confusions:
  - confused_with: "existir"
    difference: "«Existir» es tener realidad o estar presente en algún lugar; «eximir» es liberar a alguien de una culpa o de una obligación. Solo se parecen en el sonido."
    memory_trick: "Algo existe; a alguien se le exime de algo."
exercises:
  - position: 1
    sentence: "Cuando revisaron las cámaras, el reporte {{blank}} a Bautista de cualquier responsabilidad en el faltante de caja."
    hint_general: "Busca el verbo para declarar que alguien no tuvo ninguna culpa en lo ocurrido."
    explanation: "Eximió: declaró que Bautista no tuvo ninguna culpa. «Existió» solo diría que algo es real, y «disculpó» perdonaría una falta que en realidad no ocurrió."
    options:
      - position: 1
        text: "existió"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Existir» es tener realidad o estar presente, y el reporte no habla de si Bautista existe: habla de si tuvo o no responsabilidad."
        hint_specific: "«Existir» solo dice que algo es real o está presente. ¿El reporte habla de eso, o de responsabilidad?"
      - position: 2
        text: "eximió"
        is_correct: true
      - position: 3
        text: "disculpó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Disculpar» perdona una falta que sí ocurrió, y el reporte muestra que Bautista no hizo nada malo: no hay nada que perdonar."
        hint_specific: "«Disculpar» supone que hubo una falta real. ¿El reporte encontró que Bautista hizo algo malo?"
