ipa_latam: "[ek.siˈmir]"
ipa_es: "[ek.siˈmir]"
explanation: "Decir que alguien no tiene la culpa de algo, o liberarlo de una obligación que ya no debe cumplir."
example_sentence: "El testigo declaró que Marta no estaba en el edificio esa noche, lo que la eximió de toda sospecha."
register: "neutral"
pedantry_risk: 1
usage_tip: "Funciona bien tanto en un contexto formal, como un trámite, como para aclarar que alguien no tuvo la culpa de algo."
when_not_to_use: "No la uses cuando alguien sí tiene parte de responsabilidad: eximir es liberar de toda culpa, no repartirla."
collocations:
  - "eximir de responsabilidad"
  - "eximir de culpa"
  - "eximir de un pago"
replaces:
  - before: "Al final dijeron que ella no tuvo nada que ver"
    after: "Al final la eximieron de toda culpa"
  - before: "Le dijeron que no tenía que pagar esa multa"
    after: "Lo eximieron de pagar esa multa"
  - before: "El jefe aclaró que el error no fue suyo"
    after: "El jefe lo eximió del error"
family: ["exención", "eximente"]
