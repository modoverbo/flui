readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "El verano en la playa"
    body: "Todo el grupo hablaba de lo mismo esa semana: la instructora de surf y el chico del bar no se despegaban. «Es un romance de verano», dijo alguien, «va a durar lo que dura el sol, pero mientras tanto se les ve felices»."
    before_phrase: "Tienen algo, aunque no le pongan etiqueta."
    after_phrase: "Tienen un romance de verano."
  - position: 2
    scene: "trabajo"
    conversation_type: "social"
    title: "El secreto de la oficina"
    body: "Nadie lo confirmaba, pero todos lo sabían: llevaban meses saliendo del trabajo por separado, con quince minutos de diferencia. «Ese romance de oficina no es tan secreto como creen», le dijo una colega a otra, sin poder disimular la sonrisa."
    before_phrase: "Ese rollo de oficina no es tan secreto como creen."
    after_phrase: "Ese romance de oficina no es tan secreto como creen."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "La foto que lo delató"
    body: "Nadie sabía nada hasta que Elena subió una foto sin pensarlo dos veces. Su madre la llamó esa misma tarde: «¿Me vas a contar de este romance o me entero por redes de todo?», preguntó, entre curiosa y divertida."
    before_phrase: "¿Me vas a contar de esto o me entero por redes?"
    after_phrase: "¿Me vas a contar de este romance o me entero por redes?"
