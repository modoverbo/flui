    title: "A la segunda lectura"
    body: "En la oferta de trabajo había una línea rara sobre los horarios. Ricardo la leyó dos veces. «Es un aviso sutil», comentó, «pero es un aviso». Preguntó por ella en la entrevista y la respuesta le sirvió para decidir."
