confusions:
  - confused_with: "declarar"
    difference: "«Declarar» es decir algo en voz alta y dejarlo claro ante otros; la otra palabra es no aceptar algo que te ofrecen."
    memory_trick: "Declaras lo que afirmas; declinas lo que no aceptas."
  - confused_with: "desistir"
    difference: "«Desistir» es dejar algo que ya habías empezado; aquí se dice que no antes de empezar nada."
    memory_trick: "Desistes de lo tuyo; declinas lo que te ofrecen."
