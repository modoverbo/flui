stressed_syllable: 3
ipa_latam: "[me.moˈɾa.βle]"
ipa_es: "[me.moˈɾa.βle]"
explanation: "Que la gente recuerda y vuelve a contar meses más tarde, sin ningún esfuerzo."
example_sentence: "No hizo falta un discurso largo: bastó una frase memorable."
register: "neutral"
pedantry_risk: 1
usage_tip: "Es el objetivo honesto de una presentación breve: no gustar a todos, sino quedarse en una cabeza."
when_not_to_use: "No la uses para algo que solo llamó la atención un rato; aquí hace falta que dure en el tiempo."
collocations:
  - "una frase memorable"
  - "una noche memorable"
  - "hacerlo memorable"
replaces:
  - before: "Fue una noche que no se olvida"
    after: "Fue una noche memorable"
  - before: "Dijo algo que se me quedó grabado"
    after: "Dijo algo memorable"
  - before: "Quiero que se acuerden de mí"
    after: "Quiero que mi parte sea memorable"
family: []
themes:
