    after: "Hay que abordar ese tema"
  - before: "Vamos a meternos con lo del presupuesto"
    after: "Vamos a abordar lo del presupuesto"
  - before: "Nadie quiere tocar lo de los plazos"
    after: "Nadie quiere abordar lo de los plazos"
family: ["abordaje"]
themes:
