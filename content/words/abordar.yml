schema_version: 1
sort_order: 101
slug: "abordar"
status: "draft"
lemma: "abordar"
part_of_speech: "verbo"
syllables: ["a", "bor", "dar"]
stressed_syllable: 3
ipa_latam: "[a.βorˈðar]"
ipa_es: "[a.βorˈðar]"
explanation: "Empezar a tratar un asunto difícil en lugar de dejarlo para otro momento."
example_sentence: "En la reunión decidimos abordar primero el punto que nadie quería tocar."
register: "neutral"
pedantry_risk: 1
usage_tip: "Sirve para anunciar que entras en un asunto delicado: «Quiero abordar algo antes de cerrar»."
when_not_to_use: "No la uses si solo vas a nombrar el asunto de pasada; quien lo hace se compromete a tratarlo."
collocations:
  - "abordar un tema"
  - "abordar el problema"
  - "abordar el asunto"
replaces:
