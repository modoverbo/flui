confusions:
  - confused_with: "bordear"
    difference: "«Bordear» es pasar por el borde de algo sin entrar; la otra palabra significa entrar de lleno en el asunto."
    memory_trick: "Quien bordea da la vuelta; quien aborda entra."
  - confused_with: "aportar"
    difference: "«Aportar» es dar algo útil a un grupo, como una idea o un dato; no tiene que ver con abrir una conversación."
    memory_trick: "Aportas lo que traes; abordas lo que abres."
exercises:
  - position: 1
    sentence: "Después de dos meses dándole vueltas, Camila decidió {{blank}} el asunto del alquiler con su compañera de casa."
    hint_general: "Se trata de entrar por fin en un asunto que llevaba tiempo esperando."
    explanation: "Abordar: entra por fin en el asunto. «Bordear» sería rodearlo sin tocarlo y «aplazar» sería dejarlo otra vez para después."
    options:
      - position: 1
        text: "bordear"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Bordear» es pasar por el borde sin entrar, y ella se decide justo a entrar en el asunto."
        hint_specific: "«Bordear» deja el asunto sin tocar. ¿Camila lo esquiva o se mete en él?"
      - position: 2
        text: "abordar"
        is_correct: true
      - position: 3
        text: "aplazar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Aplazar» es dejarlo para más adelante, y eso es justo lo que llevaba dos meses haciendo."
        hint_specific: "«Aplazar» retrasa. Relee el inicio: ¿qué llevaba dos meses haciendo?"
  - position: 2
    sentence: "Antes de la cena, Rodrigo pidió cinco minutos a su hermano para {{blank}} lo de la mudanza: no venía a pactar nada, solo a hablarlo."
    hint_general: "Entrar en un asunto incómodo y ponerlo sobre la mesa, sin cerrar tratos ni pasar de largo."
    explanation: "Abordar: pone el asunto sobre la mesa. «Acordar» sería cerrar un trato, y la frase lo niega; «esquivar» es apartarse de él."
    options:
      - position: 1
        text: "abordar"
        is_correct: true
      - position: 2
        text: "acordar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Acordar» es cerrar un trato entre dos, y la frase dice expresamente que no viene a pactar nada."
        hint_specific: "«Acordar» cierra un trato. Relee los dos puntos: ¿a qué dice Rodrigo que no viene?"
      - position: 3
        text: "esquivar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Esquivar» es apartarse de algo, y él busca a su hermano precisamente para hablarlo."
        hint_specific: "«Esquivar» aparta. ¿Alguien que pide cinco minutos quiere apartarse?"
  - position: 3
    sentence: "Ximena sabía que la conversación sobre los turnos iba a costar, así que la {{blank}} al principio del día, con café y sin prisa."
    hint_general: "La coloca temprano para entrar en ella con calma en vez de dejarla correr."
    explanation: "Abordó: entró en la conversación con calma. «Aportó» es dar algo útil a un grupo, y «acometió» suena solemne, como si fuera una batalla."
    options:
      - position: 1
        text: "aportó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Aportar» es dar algo útil, como una idea o un dato; una conversación no se da, se abre."
        hint_specific: "«Aportar» es traer algo al grupo. ¿La frase habla de traer o de empezar?"
      - position: 2
        text: "acometió"
        is_correct: false
        distractor_type: "register"
        why_not: "«Acometer» suena solemne y guerrero; aquí hay café, calma y una charla sobre turnos."
        hint_specific: "«Acometer» suena a lanzarse al ataque. ¿Pega con el café y la calma?"
      - position: 3
        text: "abordó"
        is_correct: true
  - position: 4
    sentence: "Bruno prefiere {{blank}} los desacuerdos el mismo día: dice que guardarlos una semana los vuelve el doble de pesados."
    hint_general: "Prefiere entrar en el desacuerdo enseguida antes de que se haga más grande."
    explanation: "Abordar: entra en el desacuerdo el mismo día. «Bordear» sería rodearlo sin entrar y «guardar» es justo lo que él evita."
    options:
      - position: 1
        text: "guardar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Guardar» los desacuerdos es lo que la frase describe como el camino que él no toma."
        hint_specific: "Relee el final: ¿qué dice que pasa cuando algo se guarda una semana?"
      - position: 2
        text: "abordar"
        is_correct: true
      - position: 3
        text: "bordear"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Bordear» es rodear algo por fuera, y él entra en el desacuerdo el mismo día."
        hint_specific: "«Bordear» va por el borde. ¿Bruno rodea el desacuerdo o se mete en él?"
  - position: 5
    sentence: "En la primera reunión con el equipo nuevo, Leonor {{blank}} el punto más incómodo y se quedó veinte minutos en él hasta dejarlo claro."
    hint_general: "Entra de lleno en el punto difícil y se queda ahí hasta aclararlo; no lo nombra de pasada."
    explanation: "Abordó: entró de lleno y se quedó en el punto. «Mencionó» solo lo nombra de pasada y «rozó» sugiere tocarlo apenas; ninguno aguanta veinte minutos."
    options:
      - position: 1
        text: "abordó"
        is_correct: true
      - position: 2
        text: "mencionó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Mencionar» es nombrar algo de pasada, y nadie se queda veinte minutos dentro de una simple mención."
        hint_specific: "«Mencionar» solo nombra. Relee el final: ¿cuánto tiempo se queda Leonor en ese punto?"
      - position: 3
        text: "rozó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Rozar» un punto es tocarlo apenas, justo lo contrario de quedarse en él hasta dejarlo claro."
        hint_specific: "«Rozar» apenas toca. ¿Se aclara algo tocándolo apenas durante veinte minutos?"
  - position: 6
    sentence: "«Quiero {{blank}} algo antes de firmar», dijo Emilio, y el silencio en la sala se volvió muy largo."
    hint_general: "Anuncia que va a entrar en un asunto pendiente justo antes de comprometerse."
    explanation: "Abordar: anuncia que va a entrar en un asunto pendiente. «Ventilar» suena coloquial, y «insinuar» sería dejarlo caer sin decirlo."
    options:
      - position: 1
        text: "insinuar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Insinuar» es dejar caer algo sin decirlo, y él anuncia en voz alta que va a hablarlo."
        hint_specific: "«Insinuar» no dice las cosas. ¿Emilio calla o avisa delante de todos?"
      - position: 2
        text: "abordar"
        is_correct: true
      - position: 3
        text: "ventilar"
        is_correct: false
        distractor_type: "register"
        why_not: "«Ventilar» es coloquial y suena a resolver algo deprisa; aquí se abre un punto serio antes de firmar."
        hint_specific: "«Ventilar» suena a salir del paso. ¿Pega en el momento de firmar?"
  - position: 7
    sentence: "Natalia lleva la lista en el bolsillo: dos asuntos que quiere {{blank}} con su padre este fin de semana."
    hint_general: "Lleva apuntado lo que quiere poner sobre la mesa con calma, no lo que quiere callar."
    explanation: "Abordar: quiere poner esos asuntos sobre la mesa. «Callar» sería lo contrario y «aportar» es dar algo útil, no abrir un tema."
    options:
      - position: 1
        text: "callar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Callar» es guardarse los asuntos, y ella los lleva apuntados para hablarlos."
        hint_specific: "«Callar» guarda. ¿Para qué llevaría una lista en el bolsillo?"
      - position: 2
        text: "aportar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Aportar» es dar algo útil a alguien; un asunto pendiente no se da, se abre."
        hint_specific: "«Aportar» es traer algo al grupo. ¿Natalia trae un regalo o un tema?"
      - position: 3
        text: "abordar"
        is_correct: true
  - position: 8
    sentence: "Cuando por fin lo {{blank}}, Gonzalo descubrió que su vecina llevaba el mismo tiempo esperando esa conversación."
    hint_general: "Solo al entrar por fin en el asunto descubre que la otra parte también lo esperaba."
    explanation: "Abordó: entró por fin en el asunto. «Bordeó» sería pasar de lado y «pospuso» sería dejarlo otra vez para más adelante."
    options:
      - position: 1
        text: "pospuso"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Posponer» es dejarlo para más adelante, y la frase dice que por fin ocurre."
        hint_specific: "«Posponer» retrasa. ¿«Por fin» encaja con volver a retrasarlo?"
      - position: 2
        text: "bordeó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Bordear» es pasar de lado sin entrar, y así nunca habría descubierto lo que pensaba su vecina."
        hint_specific: "«Bordear» pasa de largo. ¿Se descubre algo pasando de largo?"
      - position: 3
        text: "abordó"
        is_correct: true
