    title: "La pregunta que nadie esperaba"
    body: "En medio de la entrevista grupal, le pidieron a Ariana que explicara su proyecto a alguien de otra área. Bajó el ritmo, evitó la jerga y usó un ejemplo cotidiano. Al terminar, el reclutador anotó algo y dijo: «Qué claridad para explicar algo tan técnico»."
    before_phrase: "Lo expliqué para que se entendiera bien."
    after_phrase: "Lo expliqué con claridad."
