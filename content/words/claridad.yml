stressed_syllable: 3
ipa_latam: "[kla.ɾiˈðad]"
ipa_es: "[kla.ɾiˈðad]"
explanation: "Lo que se entiende bien, sin dejar dudas, cuando alguien lo dice o lo escribe."
example_sentence: "Explicó el cambio de horario con tanta claridad que nadie tuvo dudas."
register: "neutral"
pedantry_risk: 1
usage_tip: "Dila para elogiar una explicación, un mensaje o una charla que no dejó nada en el aire."
when_not_to_use: "No la uses cuando lo que admiras es que alguien diga la verdad aunque incomode; para eso está «franqueza»."
collocations:
  - "hablar con claridad"
  - "explicar con claridad"
replaces:
