    before_phrase: "Que se entienda de una vez."
    after_phrase: "Que tenga claridad."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La conversación pendiente"
    body: "Antes de contarle a su padre que se mudaba lejos, Camila ensayó las palabras varias veces. Cuando por fin habló, lo hizo despacio y sin rodeos. Su padre la escuchó entera y, al final, solo dijo: «Gracias por la claridad, hija; así sí puedo quedarme tranquilo»."
    before_phrase: "Quería que me entendieras del todo."
    after_phrase: "Quería hablarte con claridad."
