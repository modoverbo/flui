confusions:
  - confused_with: "obviedad"
    difference: "Una «obviedad» ya se sabía de antemano y no hacía falta decirla; la claridad es mérito de quien explica algo que antes no se entendía."
    memory_trick: "Lo obvio no necesitaba explicación; lo claro sí la tuvo, y buena."
  - confused_with: "franqueza"
    difference: "«Franqueza» es decir lo que piensas tal cual, aunque sea incómodo; la claridad es que se entienda lo que dices, con buenas o malas noticias."
    memory_trick: "Con franqueza dices la verdad; con claridad logras que te entiendan."
  - confused_with: "inequívoco"
    difference: "Algo «inequívoco» no admite ninguna otra interpretación posible; la claridad es que se entienda sin esfuerzo, aunque en teoría admitiera más de una lectura."
    memory_trick: "Lo inequívoco no deja dudas; lo claro se entiende sin esfuerzo."
exercises:
  - position: 1
    sentence: "Antes de la auditoría, Renata pidió que el reporte se explicara con {{blank}}, sin tecnicismos que solo entendiera el equipo de finanzas."
    hint_general: "Busca la palabra para una explicación que se entiende sin necesitar conocimientos técnicos."
    explanation: "Claridad: el reporte debía entenderse sin tecnicismos. «Clarividencia» es la capacidad de prever algo antes de que pase, no que un texto se entienda, y «transparencia» es no ocultar información, cuando aquí lo que falta es que se entienda lo que ya se dijo."
    options:
      - position: 1
        text: "clarividencia"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Clarividencia» es la capacidad de prever o intuir algo antes de que ocurra, y aquí Renata pide que el reporte se entienda, no que alguien adivine el futuro."
        hint_specific: "Esa palabra habla de anticipar cosas que aún no pasan. ¿Renata pide adivinar algo, o pide entender un reporte ya escrito?"
      - position: 2
        text: "claridad"
        is_correct: true
      - position: 3
        text: "transparencia"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Transparencia» es no ocultar información, y Renata no duda de que le digan la verdad: pide que se lo expliquen de forma que se entienda."
        hint_specific: "Esa palabra habla de no esconder datos. ¿El problema del reporte es que oculte algo, o que no se entienda?"
  - position: 2
    sentence: "Cuando su hija le preguntó por qué se mudaban de ciudad, Tomás respondió con tanta {{blank}} que la niña dejó de hacer más preguntas."
    hint_general: "La respuesta fue tan fácil de entender que no hicieron falta más preguntas."
    explanation: "Claridad: la niña entendió y dejó de preguntar. «Nitidez» se usa sobre todo para imágenes o pantallas, no para una respuesta hablada, y «sinceridad» diría que no mintió, cuando lo que detuvo las preguntas fue que ella entendiera el motivo."
    options:
      - position: 1
        text: "nitidez"
        is_correct: false
        distractor_type: "register"
        why_not: "«Nitidez» se usa sobre todo para describir imágenes o pantallas, y aquí se habla de cómo Tomás explicó algo en voz alta, no de una imagen."
        hint_specific: "Esa palabra suele describir lo nítido de una foto o una pantalla. ¿La escena habla de una imagen o de una respuesta hablada?"
      - position: 2
        text: "claridad"
        is_correct: true
      - position: 3
        text: "sinceridad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sinceridad» dice que no mintió, y la niña dejó de preguntar porque entendió la respuesta, no solo porque confiara en que era verdad."
        hint_specific: "Esa palabra habla de decir la verdad. ¿La niña dejó de preguntar por confiar, o por entender?"
  - position: 3
    sentence: "En la sobremesa, Julián explicó por qué dejó su trabajo anterior con tanta {{blank}} que nadie tuvo que pedirle más detalles."
    hint_general: "Lo que contó se entendió tan bien que nadie necesitó pedir más información."
    explanation: "Claridad: nadie pidió más detalles porque se entendió todo. «Franqueza» es decir las cosas sin filtro aunque sean incómodas, y aquí lo que se destaca es que se entendió bien, no que el tema fuera difícil de admitir, y «obviedad» diría que el motivo ya se sabía antes, cuando nadie lo sabía hasta que él lo contó."
    options:
      - position: 1
        text: "franqueza"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Franqueza» es decir las cosas sin filtro aunque sean incómodas, y aquí lo que se destaca es que se entendió bien, no que fuera un tema difícil de admitir."
        hint_specific: "Esa palabra habla de decir algo incómodo sin rodeos. ¿La escena menciona algo incómodo, o solo que se entendió el motivo?"
      - position: 2
        text: "claridad"
        is_correct: true
      - position: 3
        text: "obviedad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Obviedad» diría que el motivo ya se sabía de antemano, y en la frase nadie lo sabía hasta que Julián lo contó."
        hint_specific: "Esa palabra describe algo que ya se sabía sin que nadie lo dijera. ¿El grupo ya sabía el motivo antes de que Julián hablara?"
  - position: 4
    sentence: "Durante la cena, la abuela contó su decisión de mudarse a otra ciudad con una {{blank}} que dejó a todos tranquilos."
    hint_general: "Lo que contó se entendió tan bien que todos quedaron en paz con la decisión."
    explanation: "Claridad: la familia entendió bien la decisión y quedó tranquila. «Transparencia» diría que no escondía nada, pero lo que tranquilizó fue entender las razones, y «sinceridad» dice que no mintió, cuando lo que tranquilizó fue entender el porqué."
    options:
      - position: 1
        text: "transparencia"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Transparencia» diría que la abuela no escondía nada, pero lo que tranquilizó a la familia fue entender bien sus razones, no solo saber que eran sinceras."
        hint_specific: "Esa palabra habla de no ocultar información. ¿A la familia le preocupaba que ocultara algo, o que no entendieran el motivo?"
      - position: 2
        text: "claridad"
        is_correct: true
      - position: 3
        text: "sinceridad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sinceridad» dice que no mintió, y lo que tranquilizó a la familia fue entender el porqué, no solo confiar en que decía la verdad."
        hint_specific: "Esa palabra habla de decir la verdad. ¿La familia quedó tranquila por confiar, o por entender el motivo?"
  - position: 5
    sentence: "En el grupo del barrio, Norma explicó el cambio de horario de la reunión con tanta {{blank}} que nadie volvió a preguntar por el chat."
    hint_general: "El aviso se entendió tan bien que nadie tuvo que preguntar de nuevo."
    explanation: "Claridad: el aviso se entendió y nadie volvió a preguntar. «Franqueza» habla de decir las cosas sin filtro, y aquí no había nada incómodo que admitir, y «obviedad» diría que el horario ya se sabía, cuando el aviso fue necesario justo porque nadie lo sabía."
    options:
      - position: 1
        text: "franqueza"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Franqueza» habla de decir las cosas sin filtro, y aquí no había nada incómodo que admitir, solo un horario que explicar bien."
        hint_specific: "Esa palabra habla de decir algo incómodo sin rodeos. ¿Cambiar un horario es algo incómodo de admitir?"
      - position: 2
        text: "claridad"
        is_correct: true
      - position: 3
        text: "obviedad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Obviedad» diría que el nuevo horario ya se sabía, y el mensaje de Norma fue necesario justamente porque nadie lo sabía."
        hint_specific: "Esa palabra describe algo que ya se sabía. ¿El grupo ya conocía el nuevo horario antes del aviso?"
  - position: 6
    sentence: "El entrevistador valoró la {{blank}} con la que el candidato explicó un proyecto técnico a alguien sin ese conocimiento."
    hint_general: "Lo valorado fue que alguien sin conocimientos previos entendiera todo el proyecto."
    explanation: "Claridad: alguien sin conocimientos previos entendió todo. «Exactitud» hablaría de que los números eran correctos, no de si se entendía el proyecto, y «precisión» hablaría de datos ajustados al detalle, cuando el mérito fue que alguien sin ese conocimiento entendiera todo."
    options:
      - position: 1
        text: "exactitud"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Exactitud» hablaría de que los números eran correctos, y lo que valoró el entrevistador fue que se entendiera el proyecto, no que los datos fueran exactos."
        hint_specific: "Esa palabra habla de números correctos. ¿Lo que se valoró fueron los números, o que alguien sin ese conocimiento entendiera?"
      - position: 2
        text: "claridad"
        is_correct: true
      - position: 3
        text: "precisión"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Precisión» hablaría de datos ajustados al detalle, y el mérito aquí fue que alguien sin conocimiento técnico entendiera todo, no que los datos fueran exactos."
        hint_specific: "Esa palabra habla de ajustar los datos al detalle. ¿El mérito fue el nivel de detalle, o que alguien sin base entendiera?"
