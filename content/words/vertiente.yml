    body: "Le pidieron a Amaya un ejemplo de informe suyo. Llevaba uno impreso. «Separé la vertiente económica de la legal y dediqué un capítulo a cada una», explicó. «Así nadie discute las dos a la vez». Se lo quedaron para enseñarlo dentro."
