    hint_general: "Hoy se ofende con cualquier comentario."
    explanation: "Susceptible: hoy se ofende con cualquier comentario. «Suspicaz» sería desconfiar de las intenciones, y «nervioso» hablaría de su inquietud, no de ofenderse."
    options:
      - position: 1
        text: "suspicaz"
        is_correct: false
        distractor_type: "paronym"
