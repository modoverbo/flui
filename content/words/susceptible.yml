        text: "susceptible"
        is_correct: true
      - position: 3
        text: "nervioso"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Nervioso» habla de inquietud; alguien puede estar nerviosísimo y aceptar cualquier comentario sin ofenderse."
