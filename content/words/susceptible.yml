confusions:
  - confused_with: "suspicaz"
    difference: "«Suspicaz» describe a quien desconfía de las intenciones de los demás; el otro adjetivo describe a quien se ofende, que no es lo mismo."
    memory_trick: "El suspicaz sospecha; el susceptible se ofende."
  - confused_with: "sensible"
    difference: "«Sensible» es quien nota y siente mucho, también lo bueno; el otro adjetivo se centra en lo fácil que es herirlo."
    memory_trick: "El sensible siente; el susceptible se pica."
exercises:
