    title: "La opinión de los vecinos"
    body: "Antes de escribir la nota, el periodista se paseó por la plaza hablando con quien se cruzaba. «Estoy sondeando qué piensa la gente del cambio», les explicaba, y anotaba cada respuesta con cuidado."
    before_phrase: "Estoy preguntando de a poco qué piensa la gente."
    after_phrase: "Estoy sondeando qué piensa la gente."
