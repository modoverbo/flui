    body: "Camila no quería llegar directo a pedir el aumento con su jefa de mal humor. «Voy a sondear cómo anda antes de hablar de plata», le dijo a una compañera, y esperó hasta el mediodía para entrar a su oficina."
    before_phrase: "Voy a ver cómo anda antes de hablar de plata."
    after_phrase: "Voy a sondear cómo anda antes de hablar de plata."
