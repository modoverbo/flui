  - position: 8
    sentence: "Antes de anunciar la mudanza, sus padres {{blank}} cómo se sentiría con el cambio de colegio."
    hint_general: "Hacer preguntas suaves a alguien, para saber cómo se sentiría con un cambio importante."
    explanation: "Sondearon: hicieron preguntas suaves para saber cómo se sentiría con un cambio importante. «Decidieron» implica una resolución tomada, y «sonaron» es hacer ruido; ninguno describe esas preguntas previas."
    options:
      - position: 1
        text: "sondearon"
        is_correct: true
      - position: 2
        text: "decidieron"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Decidir» implica una resolución ya tomada, y la frase dice que esto pasó antes de anunciar la mudanza, cuando todavía preguntaban."
        hint_specific: "Decidir es una resolución tomada. ¿Sus padres ya habían decidido o todavía preguntaban?"
      - position: 3
        text: "sonaron"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Sonar» describe un ruido o una alarma, sin relación con preguntar cómo se sentiría con un cambio de colegio."
        hint_specific: "Sonar es hacer ruido. ¿La frase habla de un ruido o de preguntas sobre el cambio de colegio?"
