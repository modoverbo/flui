    body: "Elena sabía que la conversación iba a ser difícil, así que empezó despacio. «¿Cómo estuvo tu semana?», le preguntó a su hermano, sondeando su ánimo antes de contarle lo que en verdad quería decirle."
    before_phrase: "Le pregunté de a poquito cómo estaba antes de ir al tema."
