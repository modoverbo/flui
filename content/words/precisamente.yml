    sentence: "Llamó para preguntar por el plazo y {{blank}} de eso queríamos hablar con él."
    hint_general: "El tema que trae es justo el que tú tenías preparado, ni uno parecido."
    explanation: "Precisamente: el tema coincide punto por punto. «Preciosamente» hablaría de belleza y «por casualidad» presentaría la coincidencia como un azar sin importancia."
