    difference: "«Preciosamente» habla de belleza: «la mesa quedó preciosamente puesta». La otra no valora nada: señala el punto exacto."
    memory_trick: "Una admira; la otra apunta."
  - confused_with: "precipitadamente"
    difference: "«Precipitadamente» dice que algo se hizo con prisa y sin pensar. La otra no habla de velocidad: habla de puntería."
    memory_trick: "Una corre; la otra acierta."
exercises:
