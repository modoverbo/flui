    body: "Los invitados alababan el salón entero y ella sonreía sin decir nada. Cuando alguien señaló un marco pequeño del pasillo, Filomena contestó de golpe: «Ese es precisamente el que más me gusta». La conversación se fue hacia el cuadro y duró toda la sobremesa."
