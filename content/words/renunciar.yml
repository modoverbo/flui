readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Dos encargos y un calendario"
    body: "A Petra le llegó un encargo mejor pagado cuando ya tenía otro a medias. Hizo las cuentas y contestó el mismo día: «Renuncio a este porque no quiero dejar el otro a medias; en marzo hablamos». El cliente volvió en marzo y ese sí lo cogió."
    before_phrase: "A ver si me da tiempo a todo."
    after_phrase: "Renuncio a este para terminar bien el otro."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La casa de todos"
    body: "En el reparto de la herencia, mi tío dijo algo que nadie esperaba: renunciaba a su parte para que la casa no se partiera. No lo contó como un sacrificio. «Prefiero seguir yendo en agosto», dijo, y siguió yendo en agosto veinte años más."
    before_phrase: "Yo dejo mi parte y ya está, no quiero líos."
    after_phrase: "Renuncio a mi parte para que la casa siga entera."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "Los martes como uno más"
    body: "Bartolomé presidió la asociación del barrio cuatro años y renunció sin aviso dramático: una frase en el acta y un café. Desde entonces va todos los martes, coloca sillas y no da ninguna opinión hasta que se la piden. La nueva presidenta dice que eso es lo difícil."
    before_phrase: "Lo dejo, que ya le toca a otro."
    after_phrase: "Renuncio al cargo, no a venir los martes."
