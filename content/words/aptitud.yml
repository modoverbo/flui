confusions:
  - confused_with: "actitud"
    difference: "La «actitud» es cómo alguien se comporta y se toma las cosas; lo otro es lo que esa persona sabe hacer bien."
    memory_trick: "La actitud se ve en el ánimo; lo otro se ve en el resultado."
  - confused_with: "altitud"
    difference: "La «altitud» mide la altura sobre el nivel del mar; no dice nada de lo que alguien sabe hacer."
    memory_trick: "La altitud se mide en metros; lo otro, en resultados."
exercises:
  - position: 1
    sentence: "Su hijo mostró desde pequeño una {{blank}} enorme para la música, y en casa nadie toca nada."
    hint_general: "Habla de una capacidad que apareció sola, sin que nadie la enseñara."
    explanation: "Aptitud: una capacidad que apareció sola. «Actitud» sería su forma de comportarse, y «vocación» es el deseo de dedicarse a algo, no el don para hacerlo."
    options:
      - position: 1
        text: "vocación"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Vocación» es el deseo de dedicarse a algo, y la frase habla de lo que al niño le sale bien sin haberlo aprendido."
        hint_specific: "La vocación es querer dedicarse. ¿El niño quiere algo o le sale solo?"
      - position: 2
        text: "aptitud"
        is_correct: true
      - position: 3
        text: "actitud"
        is_correct: false
        distractor_type: "paronym"
        why_not: "La «actitud» describe cómo se comporta alguien, y lo llamativo aquí es que toca bien sin que nadie le enseñara."
        hint_specific: "La actitud va del comportamiento. ¿Lo raro es cómo se porta o lo que consigue?"
  - position: 2
    sentence: "Roberto pone muchas ganas, pero le falta {{blank}} para el trabajo con cifras."
    hint_general: "La frase separa las ganas que alguien pone de lo que de verdad sabe hacer."
    explanation: "Aptitud: le falta capacidad para las cifras, no ganas. «Actitud» sería su forma de comportarse, que la frase ya elogia, y «garra» es coloquial y también habla de empuje."
    options:
      - position: 1
        text: "actitud"
        is_correct: false
        distractor_type: "paronym"
        why_not: "La «actitud» es la forma de comportarse, y la frase ya dice que Roberto pone muchas ganas."
        hint_specific: "Relee el inicio: pone muchas ganas. ¿Le falta entonces disposición o capacidad?"
      - position: 2
        text: "garra"
        is_correct: false
        distractor_type: "register"
        why_not: "«Garra» es coloquial y habla de empuje, y a Roberto empuje le sobra: lo que no domina son las cifras."
        hint_specific: "«Garra» suena a arrojo de vestuario deportivo. ¿A Roberto le falta empuje?"
      - position: 3
        text: "aptitud"
        is_correct: true
  - position: 3
    sentence: "El proceso de selección mide la {{blank}} para el cálculo mental, no lo que ya has estudiado."
    hint_general: "Se mide lo que alguien es capaz de hacer, no lo que ya sabe de antes."
    explanation: "Aptitud: mide de qué eres capaz. «Actitud» sería tu forma de comportarte, y «pericia» suena a oficio ya dominado tras años de práctica."
    options:
      - position: 1
        text: "pericia"
        is_correct: false
        distractor_type: "register"
        why_not: "«Pericia» suena a oficio dominado tras años de práctica, y aquí se mide de qué es capaz alguien antes de entrenarlo."
        hint_specific: "La pericia se le supone a un veterano. ¿Se mide experiencia o capacidad de partida?"
      - position: 2
        text: "aptitud"
        is_correct: true
      - position: 3
        text: "actitud"
        is_correct: false
        distractor_type: "paronym"
        why_not: "La «actitud» es cómo te tomas la prueba, y aquí se mide si eres capaz de calcular, no cómo te sientas a hacerlo."
        hint_specific: "La actitud va del ánimo. ¿Se puntúa aquí el ánimo o la capacidad de calcular?"
  - position: 4
    sentence: "Con dos años de práctica, Rodrigo ganó una {{blank}} que antes no tenía para hablar en público."
    hint_general: "Una capacidad que no venía de fábrica y se construyó con el tiempo."
    explanation: "Aptitud: una capacidad construida con la práctica. «Altitud» mide la altura sobre el mar, y «costumbre» es algo que se repite, no algo que se domina."
    options:
      - position: 1
        text: "altitud"
        is_correct: false
        distractor_type: "paronym"
        why_not: "La «altitud» mide la altura sobre el nivel del mar, y aquí se habla de alguien que aprendió a hablar delante de gente."
        hint_specific: "La altitud se mide en metros sobre el mar. ¿Qué ganó Rodrigo en dos años?"
      - position: 2
        text: "costumbre"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Costumbre» es algo que se repite por rutina, y la frase dice que ahora lo hace bien, no solo que lo hace a menudo."
        hint_specific: "Una costumbre se repite sin más. ¿Rodrigo repite algo o lo hace mejor?"
      - position: 3
        text: "aptitud"
        is_correct: true
  - position: 5
    sentence: "La beca premia la {{blank}} y no el apellido de quien la pide."
    hint_general: "Se premia lo que alguien es capaz de hacer, sin mirar de dónde viene."
    explanation: "Aptitud: se premia de qué es capaz cada persona. «Actitud» sería su forma de comportarse, y «disposición» habla de las ganas, no de la capacidad."
    options:
      - position: 1
        text: "disposición"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Disposición» habla de las ganas de colaborar, y una beca se concede por lo que la persona es capaz de hacer."
        hint_specific: "La disposición es estar dispuesto. ¿Una beca se gana con ganas o con capacidad?"
      - position: 2
        text: "aptitud"
        is_correct: true
      - position: 3
        text: "actitud"
        is_correct: false
        distractor_type: "paronym"
        why_not: "La «actitud» describe cómo se comporta quien pide la beca, y lo que se compara aquí es su capacidad frente a su apellido."
        hint_specific: "La actitud va del comportamiento. ¿Qué se opone en la frase al apellido?"
  - position: 6
    sentence: "Tras dos semanas de prueba, la empresa confirmó su {{blank}} para el puesto."
    hint_general: "Quedó demostrado que esa persona es capaz de hacer el trabajo."
    explanation: "Aptitud: quedó demostrado que es capaz de hacer el trabajo. «Actitud» sería su forma de comportarse, y «empeño» solo dice cuánto se esforzó."
    options:
      - position: 1
        text: "actitud"
        is_correct: false
        distractor_type: "paronym"
        why_not: "La «actitud» es cómo se comportó durante esas semanas, y lo que la empresa confirma es que sabe hacer el trabajo."
        hint_specific: "La actitud se nota en el ánimo diario. ¿Qué confirma una prueba de dos semanas?"
      - position: 2
        text: "empeño"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Empeño» dice cuánto se esforzó alguien, y esforzarse mucho no demuestra todavía que el trabajo salga bien."
        hint_specific: "El empeño mide el esfuerzo. ¿Esforzarse mucho basta para confirmar a alguien?"
      - position: 3
        text: "aptitud"
        is_correct: true
