register: "neutral"
pedantry_risk: 1
usage_tip: "Combina muy bien con «para» y un verbo: dice qué sabe hacer alguien, sin adornos."
when_not_to_use: "No la uses para describir cómo se comporta alguien o cómo se toma las cosas; eso es la «actitud»."
