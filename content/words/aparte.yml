confusions:
  - confused_with: "a parte"
    difference: "«A parte», en dos palabras, aparece en frases como «llegó a parte del público»: ahí «parte» es un trozo de algo. La otra abre un asunto distinto."
    memory_trick: "Separado nombra un trozo; junto abre un tema nuevo."
  - confused_with: "apartado"
    difference: "«Apartado» es una sección de un texto o un lugar retirado: «el apartado tres». La otra no nombra nada: separa un asunto de otro."
    memory_trick: "Uno se numera; la otra solo marca la frontera."
exercises:
  - position: 1
    sentence: "Ese tema lo hablamos {{blank}}, que ahora toca cerrar el presupuesto."
    hint_general: "El asunto se saca de esta conversación y se guarda para otra."
    explanation: "Aparte: el tema se saca de esta conversación. «A parte» nombraría un trozo de algo y «encima» sonaría a queja acumulada."
    options:
      - position: 1
        text: "a parte"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«A parte», separado, señala un trozo de algo («llegó a parte del público»), y aquí no se reparte nada: se pospone un tema."
        hint_specific: "«A parte» necesita un trozo de algo. ¿Se reparte algo o se guarda un tema para luego?"
      - position: 2
        text: "aparte"
        is_correct: true
      - position: 3
        text: "encima"
        is_correct: false
        distractor_type: "register"
        why_not: "«Encima» es de conversación y carga la frase de queja, cuando aquí solo se ordena el orden del día sin enfadarse."
        hint_specific: "«Encima» acumula motivos de enfado. ¿Alguien se queja o solo reordena la reunión?"
  - position: 2
    sentence: "El alquiler se paga con la nómina; la luz y el agua van {{blank}}."
    hint_general: "Esos dos gastos viajan por su propio camino, sin juntarse con el primero."
    explanation: "Aparte: esos gastos van por su camino. «Apartado» nombraría una sección numerada e «incluso» los metería dentro del primer pago."
    options:
      - position: 1
        text: "aparte"
        is_correct: true
      - position: 2
        text: "apartado"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Apartado» nombra una sección de un texto o un sitio retirado, y aquí no se nombra nada: se separan dos pagos."
        hint_specific: "«Apartado» funciona como nombre de una sección. ¿Se nombra algo o se separa un gasto?"
      - position: 3
        text: "incluso"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Incluso» metería la luz y el agua dentro del pago de la nómina, y la frase los coloca fuera de ese pago."
        hint_specific: "«Incluso» amplía lo que entra. ¿Esos gastos entran en la nómina o salen de ella?"
  - position: 3
    sentence: "Ese asunto merece una reunión {{blank}}, no cinco minutos al final del día."
    hint_general: "Pide un espacio propio, fuera de la reunión que ya existe."
    explanation: "Aparte: el asunto pide su propio espacio. «A parte» nombraría un trozo de algo y «en cambio» opondría dos ideas que no se oponen."
    options:
      - position: 1
        text: "a parte"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«A parte», separado, señala un trozo de algo, y aquí no se reparte nada: se pide una reunión propia."
        hint_specific: "«A parte» necesita un trozo que repartir. ¿Se reparte algo o se pide otra reunión?"
      - position: 2
        text: "aparte"
        is_correct: true
      - position: 3
        text: "en cambio"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«En cambio» enfrenta dos ideas, y aquí no hay choque: un asunto pide su propio hueco en el calendario."
        hint_specific: "«En cambio» marca contraste. ¿Chocan dos ideas o se abre un espacio nuevo?"
  - position: 4
    sentence: "Cerramos el presupuesto y, {{blank}}, hay que decidir quién viaja en junio."
    hint_general: "Se abre un segundo asunto que nada tiene que ver con el primero."
    explanation: "Aparte: se abre un segundo asunto del mismo orden del día. «Cambiando de tema» anunciaría una charla informal y «es decir» repetiría la idea anterior."
    options:
      - position: 1
        text: "cambiando de tema"
        is_correct: false
        distractor_type: "register"
        why_not: "«Cambiando de tema» es de charla informal y suena a salirse del guion, cuando el viaje forma parte del mismo orden del día."
        hint_specific: "«Cambiando de tema» anuncia una salida del guion. ¿El viaje estaba previsto o se cuela?"
      - position: 2
        text: "aparte"
        is_correct: true
      - position: 3
        text: "es decir"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Es decir» repite la idea anterior con otras palabras, y decidir quién viaja no repite el cierre del presupuesto."
        hint_specific: "«Es decir» dice lo mismo de otro modo. ¿El viaje repite el presupuesto o es otro asunto?"
  - position: 5
    sentence: "Los perros duermen {{blank}}, en el cuarto pequeño, desde que llegó el bebé."
    hint_general: "Se les da un sitio propio, separado del resto de la casa."
    explanation: "Aparte: los perros tienen su propio sitio. «Apartado» nombraría una sección numerada y «sobre todo» señalaría a los perros como lo más importante."
    options:
      - position: 1
        text: "apartado"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Apartado» nombra una sección de un texto o un lugar retirado, y aquí el sitio ya se dice después: el cuarto pequeño."
        hint_specific: "«Apartado» funciona como nombre. ¿Se nombra un lugar o se separa a los perros?"
      - position: 2
        text: "aparte"
        is_correct: true
      - position: 3
        text: "sobre todo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sobre todo» pondría el foco en los perros como lo más importante, y la frase solo cuenta dónde duermen ahora."
        hint_specific: "«Sobre todo» destaca lo principal. ¿Se destaca a los perros o se dice dónde duermen?"
  - position: 6
    sentence: "Guardamos el dinero del viaje {{blank}}, para no gastarlo sin darnos cuenta."
    hint_general: "Ese dinero vive en su propio sitio, lejos del de cada día."
    explanation: "Aparte: el dinero vive en su propio sitio. «A parte» nombraría un trozo de algo y «por tanto» convertiría el ahorro en una consecuencia."
    options:
      - position: 1
        text: "aparte"
        is_correct: true
      - position: 2
        text: "a parte"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«A parte», separado, señala un trozo de algo, y aquí no se reparte el dinero: se guarda entero en otro sitio."
        hint_specific: "«A parte» necesita un trozo que señalar. ¿Se reparte el dinero o se separa entero?"
      - position: 3
        text: "por tanto"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Por tanto» anuncia una consecuencia, y guardar el dinero no se deduce de nada anterior: es la decisión misma."
        hint_specific: "«Por tanto» saca una conclusión. ¿Esto se deduce de algo o es la propia decisión?"
  - position: 7
    sentence: "La cocina quedó bien y, {{blank}}, el electricista terminó antes de lo previsto."
    hint_general: "Se añade una buena noticia que pertenece a otro capítulo de la obra."
    explanation: "Aparte: la segunda noticia pertenece a otro capítulo. «A todo esto» sonaría a inciso de conversación y «en resumen» anunciaría un cierre que no llega."
    options:
      - position: 1
        text: "a todo esto"
        is_correct: false
        distractor_type: "register"
        why_not: "«A todo esto» es de conversación y abre un inciso curioso, cuando el trabajo del electricista es parte del mismo parte de obra."
        hint_specific: "«A todo esto» introduce una curiosidad al margen. ¿Es una curiosidad o parte del mismo informe?"
      - position: 2
        text: "aparte"
        is_correct: true
      - position: 3
        text: "en resumen"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«En resumen» condensa lo ya dicho, y el plazo del electricista no resume el estado de la cocina: es otro dato."
        hint_specific: "«En resumen» cierra y condensa. ¿Esto resume lo anterior o abre otro punto?"
  - position: 8
    sentence: "Rosaura pidió que su regalo se contara {{blank}} del que hacía el resto del grupo."
    hint_general: "Quiere que su regalo tenga cuentas propias, sin sumarse al común."
    explanation: "Aparte: su regalo lleva cuentas propias. «Apartado» nombraría una sección numerada y «por encima» lo colocaría en un nivel superior al del grupo."
    options:
      - position: 1
        text: "apartado"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Apartado» nombra una sección de un texto o un lugar retirado, y aquí no se nombra nada: se separan dos cuentas."
        hint_specific: "«Apartado» funciona como nombre de sección. ¿Se nombra algo o se separan dos cuentas?"
      - position: 2
        text: "por encima"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Por encima» colocaría su regalo en un nivel superior al del grupo, y ella solo pide que se cuente por separado."
        hint_specific: "«Por encima» sitúa algo más arriba. ¿Pide más valor o pide otra cuenta?"
      - position: 3
        text: "aparte"
        is_correct: true
readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Dos temas, dos reuniones"
    body: "La reunión se iba por las ramas cada martes. Baldomero cortó el hilo con una frase corta: «Eso lo vemos aparte; ahora cerramos el presupuesto». La sala volvió al punto uno. Desde entonces el segundo tema tiene su propia media hora los jueves."
    before_phrase: "Bueno, otra cosa, que eso también hay que verlo."
    after_phrase: "Eso lo vemos aparte; ahora cerramos el presupuesto."
  - position: 2
    scene: "familia"
    conversation_type: "practica"
    title: "El sobre del viaje"
    body: "Cada verano llegaban a agosto sin dinero para el viaje. Purificación propuso algo sencillo: «Este año el dinero del viaje va aparte». Abrieron una cuenta solo para eso. En junio ya tenían los billetes comprados sin haber discutido ni una vez."
    before_phrase: "Hay que guardar para el viaje, por su lado, ya sabes."
    after_phrase: "El dinero del viaje va aparte."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "La cuenta de Rosaura"
    body: "El grupo hacía un regalo común y ella quería añadir el suyo. Lo dijo sin disculparse: «Lo mío va aparte, para que no os cuadren mal las cuentas». Nadie se lo tomó a mal y el reparto salió limpio a la primera."
    before_phrase: "Lo mío que vaya por su lado, o sea, por separado."
    after_phrase: "Lo mío va aparte."
