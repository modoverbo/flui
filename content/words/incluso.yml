schema_version: 1
slug: "incluso"
status: "draft"
lemma: "incluso"
part_of_speech: "adverbio"
syllables:
  - "in"
  - "clu"
  - "so"
stressed_syllable: 2
ipa_latam: "[inˈklu.so]"
ipa_es: "[inˈklu.so]"
explanation: "Añade el caso más difícil de creer para apoyar lo que acabas de decir."
example_sentence: "Aguantó la reunión entera de pie e incluso tomó notas al final."
register: "neutral"
pedantry_risk: 1
usage_tip: "Guarda el ejemplo más raro para el final: es el que convence de que la frase va en serio."
when_not_to_use: "No la uses si el caso añadido es el más normal de todos; entonces no sorprende a nadie."
collocations:
  - "incluso hoy"
  - "incluso ellos"
replaces:
  - before: "Vinieron todos, hasta los vecinos del cuarto"
    after: "Vinieron todos, incluso los vecinos del cuarto"
  - before: "Leyó el contrato entero y las notas pequeñas y todo"
    after: "Leyó el contrato entero, incluso las notas pequeñas"
  - before: "Abre siempre, y eso, los domingos también"
    after: "Abre siempre, incluso los domingos"
family: []
