confusions:
  - confused_with: "agitar"
    difference: "«Agitar» es mover algo con fuerza o poner nervioso a alguien; la otra palabra quita pasos para que avance antes."
    memory_trick: "Agitas un frasco; le quitas trabas a un trámite."
  - confused_with: "aligerar"
    difference: "«Aligerar» es quitar peso o cantidad; la otra palabra quita esperas y papeles, no kilos."
    memory_trick: "Aligeras la mochila; quitas pasos al proceso."
