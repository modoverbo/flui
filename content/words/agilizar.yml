    title: "De cinco días a dos"
    body: "Cuando le pidieron un ejemplo de mejora, Nuria no habló de ideas. «Agilicé el cierre mensual: quité dos revisiones repetidas y monté una plantilla. Pasamos de cinco días a dos». Le preguntaron por la plantilla el resto de la entrevista."
    before_phrase: "Hice que el cierre fuera más rápido."
    after_phrase: "Agilicé el cierre mensual."
