    body: "Mi padre odiaba las colas de las oficinas y salía de casa a las seis. Este año probó otra cosa: «Pedí cita por internet para agilizar el trámite». Entró a las diez, salió a las diez y cuarto."
    before_phrase: "A ver si así voy más rápido."
    after_phrase: "Pedí cita por internet para agilizar el trámite."
