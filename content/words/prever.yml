explanation: "Saber con tiempo lo que puede pasar y contar con ello antes de que ocurra."
example_sentence: "Antes de firmar conviene prever qué haremos si el envío llega tarde."
register: "neutral"
pedantry_risk: 1
usage_tip: "Queda muy bien al planificar: deja claro que pensaste en lo que podía salir mal."
when_not_to_use: "No la uses para entregar o suministrar algo; para eso está «proveer»."
collocations:
  - "prever un retraso"
  - "prever consecuencias"
  - "prever un escenario"
replaces:
