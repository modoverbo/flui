    title: "La cena del sábado"
    body: "Gonzalo llamó a su hermana antes de la cena familiar. «Sé que el tema de la casa va a salir. Quiero preverlo y hablarlo contigo antes, no delante de todos». Ella se quedó callada un momento y luego dijo: «Gracias por avisarme»."
    before_phrase: "Seguro que sale el tema y acabamos discutiendo."
    after_phrase: "Quiero preverlo y hablarlo antes."
  - position: 3
    scene: "entrevista"
    conversation_type: "social"
    title: "La pregunta del final"
    body: "Le preguntaron a Noelia por su peor semana en el puesto anterior. Contó el fallo del servidor y añadió: «Desde entonces preveo siempre un plan alterno para los días de cierre». La entrevistadora anotó la frase entera."
    before_phrase: "Ahora intento pensar en lo que podría fallar."
    after_phrase: "Desde entonces preveo un plan alterno."
