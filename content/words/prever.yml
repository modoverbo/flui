    body: "El calendario del proyecto estaba clavado al día. Ximena levantó la mano: «Propongo prever dos semanas de margen para el permiso del local». Nadie discutió. En marzo, el permiso tardó doce días y el equipo entregó a tiempo igual."
    before_phrase: "Por si acaso, dejemos un poquito de aire."
    after_phrase: "Propongo prever dos semanas de margen."
