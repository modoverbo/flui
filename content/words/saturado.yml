    scene: "trabajo"
    conversation_type: "practica"
    title: "Dos líneas y una fecha"
    body: "A Renato le llegó un encargo bueno en el peor momento. En vez de dar largas contestó en dos líneas: «Tengo el mes saturado; te lo miro el siete de enero». El cliente puso una nota en su calendario y volvió a escribir el siete. Empezaron en febrero."
    before_phrase: "Uf, estoy hasta arriba, ya te diré algo."
    after_phrase: "Tengo el mes saturado; te lo miro en enero."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La agenda de papel"
    body: "Marisol apunta todo en un cuaderno grande porque en la pantalla no lo ve venir. Su hijo le pidió ayuda con la mudanza y ella abrió el cuaderno: «Esa semana la tengo saturada; la siguiente entera es tuya». Se mudaron siete días después, sin prisas."
    before_phrase: "Es que esa semana la tengo fatal, hijo."
    after_phrase: "Esa semana la tengo saturada; la siguiente es tuya."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "Cola en la acera"
    body: "El comedor del barrio abrió con seis mesas y a las dos ya estaba saturado, con gente esperando fuera. Los dueños tardaron un mes en decidirse y pusieron dos turnos. Ahora nadie espera de pie y el cocinero sale a saludar entre uno y otro."
    before_phrase: "Aquí a las dos no cabe ni un alfiler."
    after_phrase: "A las dos esto está saturado."
