readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Desde marzo"
    body: "La reunión empezó discutiendo el mes de agosto. Sofía pidió el gráfico completo y lo puso encima: «No es agosto. Hay una tendencia a la baja desde marzo». Nadie volvió a hablar de agosto. Esa tarde salieron con tres cosas que probar."
    before_phrase: "Este mes ha ido flojo, ya remontará."
    after_phrase: "Hay una tendencia a la baja desde marzo."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Se cocina menos"
    body: "Mi madre dice que en casa ya nadie cocina. No es verdad del todo, pero tampoco falso. «Hay una tendencia», le dije, «cada año un poco menos». Lo aceptó mejor así que como reproche. Ahora cocinamos los domingos, las dos juntas."
    before_phrase: "Ya nadie cocina en esta casa."
    after_phrase: "Hay una tendencia: cada año un poco menos."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "Cuatro años subiendo"
    body: "En la tienda del barrio discutían si los patinetes eran cosa de un verano. Sofía sacó las ventas de cuatro años. «Esto ya no es una moda», resumió, «es una tendencia, y no depende de la estación». Pidieron el doble para la temporada siguiente."
    before_phrase: "Esto se lleva ahora, luego ya veremos."
    after_phrase: "Ya no es una moda, es una tendencia."
