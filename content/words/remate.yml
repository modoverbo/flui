readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "La frase que se escribe primero"
    body: "Noemí tenía diez minutos para presentar el plan y doce ideas que no cabían. Su compañera le dio un consejo raro: «Escribe el remate y recorta hacia atrás». Cerró con una sola línea, «esto nos devuelve dos semanas al año», y fue lo único que el comité repitió después."
    before_phrase: "Y bueno, eso sería todo por mi parte."
    after_phrase: "Cerré con un remate que se entiende sin las diapositivas."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Seis palabras en la boda"
    body: "Ismael temía el brindis desde marzo. Escribió tres folios y los tiró todos menos la última línea. «Me quedo con el remate», le dijo a su hermana la noche antes. Levantó la copa, dijo seis palabras y su tía se echó a llorar de risa."
    before_phrase: "No sé cómo terminar sin quedar raro."
    after_phrase: "Me quedo solo con el remate."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "La última curva"
    body: "En el club de lectura discutían por qué una novela buenísima les había dejado fríos. Aurora lo dijo sin rodeos: «Le falta remate; la historia se apaga en la última curva». Nadie la contradijo y la conversación siguió por ahí otra hora."
    before_phrase: "El final no me convenció, no sé por qué."
    after_phrase: "Le falta remate."
