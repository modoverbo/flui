        distractor_type: "near_synonym"
        why_not: "«Largo» solo habla de duración, y lo que generó la reacción del público fue la precisión del monólogo, no cuánto duró."
        hint_specific: "«Largo» habla de duración. ¿La reacción del público fue por la duración o por lo certero del monólogo?"
  - position: 7
    sentence: "Teo respondió con un chiste tan {{blank}} sobre el nuevo corte de pelo de su hermana que ella misma terminó riéndose del cambio."
    hint_general: "Piensa en un chiste directo que da justo en el blanco, sin llegar a molestar de verdad."
