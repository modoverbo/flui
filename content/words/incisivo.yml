schema_version: 1
sort_order: 9304
slug: "incisivo"
status: "draft"
lemma: "incisivo"
part_of_speech: "adjetivo"
syllables: ["in", "ci", "si", "vo"]
stressed_syllable: 3
ipa_latam: "[in.siˈsi.βo]"
ipa_es: "[in.θiˈsi.βo]"
explanation: "Que sirve para decir las cosas de forma directa y fuerte, y que puede molestar un poco."
example_sentence: "El crítico hizo un comentario incisivo sobre la actuación, tan certero que el actor no pudo más que reírse."
register: "neutral"
pedantry_risk: 2
usage_tip: "Funciona bien para elogiar una observación aguda; sobre una persona puede sonar a que hiere sin querer, así que conviene medir el tono."
when_not_to_use: "No la uses para un comentario cruel sin ninguna gracia; aquí el filo va acompañado de ingenio, no de mala intención."
collocations:
  - "comentario incisivo"
  - "pregunta incisiva"
replaces:
  - before: "Hizo un comentario muy directo y con filo"
    after: "Hizo un comentario incisivo"
  - before: "Su pregunta fue dura pero acertada"
    after: "Su pregunta fue incisiva"
family: ["incisión"]
themes:
  - slug: "humor"
    relevance: 3
tags:
