    scene: "social"
    conversation_type: "social"
    title: "El discurso de la despedida"
    body: "Pablo tenía tres minutos para hablar en la despedida de soltero de su mejor amigo. Preparó un discurso incisivo sobre sus manías de siempre, y el novio se rió tanto que casi no pudo brindar. «Eso sí que dio en el blanco», le dijo alguien al terminar."
    before_phrase: "Preparé algo muy directo y con filo sobre él."
    after_phrase: "Preparé un discurso incisivo sobre él."
