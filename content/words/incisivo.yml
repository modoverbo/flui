    body: "Simón llevaba meses escribiendo sobre el tráfico de la ciudad sin que nadie lo notara. Esta vez fue distinto: escribió un párrafo tan incisivo sobre la avenida principal que hasta los concejales que criticaba lo compartieron en sus redes. «Al menos leyeron hasta el final», bromeó él."
