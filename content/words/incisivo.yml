    title: "La broma que unió a los hermanos"
    body: "Débora y su hermano llevaban semanas sin hablarse por una discusión tonta. En la cena, ella soltó un comentario tan incisivo sobre sus propias manías —no las de él— que ambos terminaron riendo. La tensión se disolvió antes del postre."
    before_phrase: "Dije algo directo sobre mí misma para romper el hielo."
    after_phrase: "Dije algo incisivo sobre mí misma para romper el hielo."
