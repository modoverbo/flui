  - position: 6
    sentence: "El monólogo de Antonia sobre las citas por aplicaciones fue tan {{blank}} que varios asistentes se reconocieron entre risas incómodas."
    hint_general: "Busca la palabra para algo que describe una situación con tanta precisión que incomoda un poco."
    explanation: "Incisivo: el monólogo de Antonia describió la situación con tanta precisión que el público se reconoció. «Extraño» solo dice que algo es raro, y «largo» solo habla de duración, ninguna explica la reacción del público."
    options:
      - position: 1
        text: "extraño"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Extraño» solo dice que algo es raro, y lo que provocó la risa incómoda fue que el monólogo describió a la perfección algo muy reconocible."
        hint_specific: "«Extraño» es solo raro. ¿El público se reconoció porque era raro o porque era certero?"
      - position: 2
