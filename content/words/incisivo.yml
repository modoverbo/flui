  variedad: "panhispanico"
confusions:
  - confused_with: "decisivo"
    difference: "«Decisivo» es lo que resuelve algo de forma determinante; «incisivo» describe un comentario agudo y con filo, no algo que decide nada."
    memory_trick: "Lo decisivo resuelve; lo incisivo hiere con gracia."
  - confused_with: "excesivo"
    difference: "«Excesivo» es que algo se pasa de la medida; «incisivo» habla de precisión y filo, no de exceso."
    memory_trick: "Lo excesivo sobra; lo incisivo apunta justo al blanco."
exercises:
  - position: 1
    sentence: "La crítica que escribió Renata sobre la película fue tan {{blank}} que el director la citó en su propia rueda de prensa."
    hint_general: "Busca la palabra para un comentario agudo y con filo, capaz de dar en el blanco."
    explanation: "Incisiva: la crítica de Renata fue aguda y dio en el blanco. «Decisiva» habla de resolver algo, y «amable» describe un tono suave, ninguna encaja con un comentario con filo."
    options:
      - position: 1
        text: "decisiva"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Decisiva» describe algo que resuelve o determina un resultado, y aquí lo que impresionó fue el filo del comentario, no que decidiera nada."
        hint_specific: "«Decisiva» habla de resolver algo. ¿La crítica resolvió una decisión o mostró agudeza?"
      - position: 2
        text: "incisiva"
        is_correct: true
      - position: 3
        text: "amable"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Amable» describe un tono suave y complaciente, y lo que citó el director fue justo lo contrario: un comentario con filo."
        hint_specific: "«Amable» es un tono suave. ¿El director citó algo suave o algo con filo?"
  - position: 2
    sentence: "En la despedida de soltero, el discurso de Pablo sobre su amigo fue tan {{blank}} que el novio no paró de reír entre lágrimas."
    hint_general: "Piensa en un discurso con filo que hace reír, sin dejar mal a nadie."
    explanation: "Incisivo: el discurso de Pablo tuvo filo y arrancó risas. «Cruel» busca lastimar de verdad, y «vago» describe algo impreciso, sin acertar en ningún detalle."
    options:
      - position: 1
        text: "cruel"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cruel» describe algo hecho para lastimar de verdad, y aquí el novio se rió entre lágrimas de risa, señal de que el filo venía con cariño."
        hint_specific: "«Cruel» busca hacer daño de verdad. ¿El novio se rió o se sintió herido?"
      - position: 2
        text: "incisivo"
        is_correct: true
      - position: 3
        text: "vago"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Vago» describe algo impreciso y sin filo, y el discurso de Pablo acertó justo en los detalles que todos reconocían del novio."
        hint_specific: "«Vago» es impreciso, sin filo. ¿El discurso fue impreciso o dio justo en el blanco?"
  - position: 3
    sentence: "Durante la cena, Débora hizo un comentario tan {{blank}} sobre las manías de su hermano que toda la mesa terminó riendo, incluido él."
    hint_general: "Se trata de un comentario que da justo en un detalle muy preciso, sin dejar mal a nadie."
    explanation: "Incisivo: el comentario de Débora fue preciso y arrancó risas de todos, incluido su hermano. «Cáustico» suena más duro y menos afectuoso, y «distraído» describe justo lo contrario: no fijarse en nada."
    options:
      - position: 1
        text: "cáustico"
        is_correct: false
        distractor_type: "register"
        why_not: "«Cáustico» describe un tono duro y casi hiriente, y aquí el comentario hizo reír a todos, incluido el hermano, sin dejar a nadie mal."
        hint_specific: "«Cáustico» suena más duro y menos afectuoso. ¿El hermano se rió o se sintió atacado?"
      - position: 2
        text: "distraído"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Distraído» describe a alguien que no presta atención, y el comentario de Débora mostró justo lo contrario: se fijó en un detalle muy preciso."
        hint_specific: "«Distraído» es no fijarse en nada. ¿El comentario mostró falta de atención o mucha precisión?"
      - position: 3
        text: "incisivo"
        is_correct: true
  - position: 4
    sentence: "La periodista hizo una pregunta tan {{blank}} sobre el escándalo que el entrevistado tardó varios segundos en responder, entre risas nerviosas."
    hint_general: "Busca la palabra para una pregunta directa que deja a alguien sin palabras por un momento."
    explanation: "Incisiva: la pregunta de la periodista fue directa y dejó al entrevistado sin palabras. «Ingenua» describe una pregunta simple, y «hiriente» sugiere intención de lastimar, algo que la risa nerviosa desmiente."
    options:
      - position: 1
        text: "ingenua"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Ingenua» describe una pregunta simple, sin filo, y aquí la pregunta dejó al entrevistado sin palabras por lo directa que fue."
        hint_specific: "«Ingenua» es una pregunta simple. ¿Esta pregunta dejó sin palabras por ser simple o por ser directa?"
      - position: 2
        text: "hiriente"
        is_correct: false
        distractor_type: "register"
        why_not: "«Hiriente» sugiere una intención de lastimar, y aquí la risa nerviosa muestra sorpresa e ingenio, no una ofensa."
        hint_specific: "«Hiriente» busca lastimar. ¿La reacción fue de risa nerviosa o de ofensa?"
      - position: 3
        text: "incisiva"
        is_correct: true
  - position: 5
    sentence: "La columna que escribió Simón sobre el tráfico de la ciudad fue tan {{blank}} que la compartieron hasta los concejales que critica."
    hint_general: "Piensa en un texto con filo, capaz de incomodar a quien nombra sin dejar de ser justo."
    explanation: "Incisiva: la columna de Simón tuvo filo suficiente para que hasta los criticados la compartieran. «Extensa» solo habla de longitud, y «formal» describe un tono serio, ninguna explica por qué se compartió tanto."
    options:
      - position: 1
        text: "extensa"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Extensa» solo dice que el texto es largo, y lo que hizo que se compartiera tanto fue su filo, no su extensión."
        hint_specific: "«Extensa» habla de longitud. ¿La compartieron por ser larga o por tener filo?"
      - position: 2
