        hint_specific: "Atenerse necesita una regla previa. ¿Qué regla habría en esa comida?"
      - position: 3
        text: "se calló"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Callarse» sería no decir nada en toda la comida, y ella sigue en la mesa y hasta sirve café."
        hint_specific: "Quien se calla deja de hablar del todo. ¿De qué deja de hablar Zoraida?"
  - position: 3
    sentence: "El tribunal pidió a los familiares {{blank}} de hacer comentarios durante la lectura."
    hint_general: "Les pidieron no hacer comentarios mientras leían."
    explanation: "Abstenerse: no hacer comentarios durante la lectura. «Detenerse» sería pararse a mitad de camino, y «abdicar» es palabra de reyes y suena solemne."
