  - confused_with: "detenerse"
    difference: "«Detenerse» es parar a mitad de camino; la otra palabra es no empezar siquiera, por decisión propia."
    memory_trick: "Te detienes cuando ya ibas; lo otro es no salir."
exercises:
  - position: 1
    sentence: "En la votación de la comunidad, Amadeo prefirió {{blank}} y explicó su motivo en dos frases."
    hint_general: "No votó ni a favor ni en contra, y dijo por qué."
    explanation: "Abstenerse: no votar ni a favor ni en contra. «Atenerse» sería ajustarse a una norma, e «inhibirse» es palabra de juzgados y suena a trámite."
    options:
      - position: 1
        text: "atenerse"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Atenerse» es ajustarse a una norma ya acordada, y aquí lo que hace él es no tomar partido en una votación."
        hint_specific: "Atenerse supone seguir una regla existente. ¿Qué hace Amadeo con su voto?"
      - position: 2
        text: "abstenerse"
        is_correct: true
      - position: 3
        text: "inhibirse"
        is_correct: false
        distractor_type: "register"
        why_not: "«Inhibirse» es palabra de juzgados y significa apartarse de un caso por trámite, y esto es una reunión de vecinos."
        hint_specific: "«Inhibirse» sale en un auto judicial. ¿Dónde está Amadeo?"
  - position: 2
    sentence: "Cuando la conversación llegó a la herencia, Zoraida {{blank}} de opinar y sirvió más café."
    hint_general: "Decidió no dar su opinión en ese tema."
    explanation: "Se abstuvo: decidió no opinar. «Se atuvo» sería ajustarse a una norma, y «se calló» diría que no dijo nada en toda la comida."
    options:
      - position: 1
        text: "se abstuvo"
        is_correct: true
      - position: 2
        text: "se atuvo"
        is_correct: false
        distractor_type: "paronym"
