readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "La votación del portal"
    body: "En la reunión del portal se votaba cambiar el ascensor. Amadeo vive en el bajo y no lo usa nunca. «Me abstengo», dijo, «porque a mí no me afecta y a los demás sí». Nadie se lo tomó a mal y la obra salió adelante con diez votos."
    before_phrase: "Yo paso, que a mí me da igual."
    after_phrase: "Me abstengo, porque a mí no me afecta."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "El tema de la casa"
    body: "Cada vez que sale el tema de la casa del pueblo, Zoraida se levanta a por más café. No es que no tenga opinión: ha decidido abstenerse de darla mientras sus hermanos no se pongan de acuerdo. «Cuando se pongan de acuerdo, yo firmo lo que sea», dice."
    before_phrase: "Yo de eso mejor no digo nada."
    after_phrase: "Prefiero abstenerme mientras no haya acuerdo."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "Trabajo con las dos partes"
    body: "A Aitana la invitaron a decidir entre dos proveedores con los que trabaja a diario. Contestó antes de la reunión: «Prefiero abstenerme en esta decisión; paso los datos de los dos y que decidan ellos». Le agradecieron los datos y la dejaron fuera de la votación."
    before_phrase: "Es que yo aquí no debería opinar, ¿no?"
    after_phrase: "Prefiero abstenerme en esta decisión."
