    difference: "Un «suplicio» es un sufrimiento o un tormento; esta palabra es el pedido desesperado que haces, no el sufrimiento en sí mismo."
    memory_trick: "El suplicio se sufre; esta palabra se pide."
  - confused_with: "clamor"
    difference: "Un «clamor» es un grito colectivo y público, de mucha gente a la vez; esta palabra suele ser un pedido personal, casi siempre en privado."
    memory_trick: "El clamor suena en la plaza; esta palabra se dice de rodillas, a solas."
