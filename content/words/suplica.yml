    body: "El pedido llegaba tarde y el evento era al día siguiente. Octavio le mandó al proveedor un audio de dos minutos, sin rodeos: «Es casi una súplica: necesito el pedido mañana a primera hora». El proveedor lo llamó de vuelta en cinco minutos y lo resolvió."
