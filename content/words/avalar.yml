confusions:
  - confused_with: "alabar"
    difference: "«Alabar» es decir cosas buenas de alguien; la otra palabra aporta pruebas o pone tu nombre como garantía."
    memory_trick: "Alabas con palabras; garantizas con pruebas."
  - confused_with: "evaluar"
    difference: "«Evaluar» es juzgar desde fuera cuánto vale algo; la otra palabra es ponerse detrás para sostenerlo."
    memory_trick: "Evalúas desde fuera; sostienes desde detrás."
