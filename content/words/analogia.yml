schema_version: 1
sort_order: 7002
slug: "analogia"
status: "draft"
lemma: "analogía"
part_of_speech: "sustantivo"
syllables:
  - "a"
  - "na"
  - "lo"
  - "gí"
  - "a"
stressed_syllable: 4
ipa_latam: "[a.na.loˈxi.a]"
ipa_es: "[a.na.loˈxi.a]"
explanation: "Comparación con algo que ya conoces, puesta al lado de una idea nueva para que se vea."
example_sentence: "Explicó el ahorro con una analogía: una bañera que se llena con el tapón puesto."
register: "neutral"
pedantry_risk: 2
usage_tip: "Funciona cuando la comparación viene del día a día de quien te escucha, no del tuyo."
when_not_to_use: "No la uses para dos cosas que se parecen por casualidad; aquí la comparación se elige a propósito para explicar."
collocations:
  - "una analogía sencilla"
  - "recurrir a una analogía"
  - "la analogía se rompe"
replaces:
  - before: "Te lo comparo con algo que ya conoces"
    after: "Te lo explico con una analogía que ya conoces"
  - before: "Pongo un ejemplo parecido para que se vea"
    after: "Recurro a una analogía para que se vea"
  - before: "Eso es como cuando se te llena el buzón"
    after: "La analogía es tu buzón lleno"
semantic_set_id: "figuras-para-explicar"
family:
