    sentence: "Cada vez que se cruzaban en el pasillo, a los dos les daba el mismo {{blank}} de siempre."
    hint_general: "La misma mezcla de nervios y emoción que se repite cada vez que dos personas se encuentran."
    explanation: "Vértigo: la misma mezcla de nervios y emoción que se repite. «Aburrimiento» describiría falta de interés, y «vórtice» es un remolino físico, ninguno describe ese encuentro repetido en el pasillo."
