        why_not: "«Fastidio» describe molestia, y la frase describe una emoción fuerte, no una incomodidad por la llamada."
        hint_specific: "El fastidio es molestia. ¿Julia siente molestia o una emoción fuerte al escuchar esa voz?"
      - position: 3
        text: "vórtice"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Un «vórtice» es un remolino físico de aire o agua, sin relación con escuchar una voz por teléfono."
        hint_specific: "Un vórtice es un remolino físico. ¿La frase habla de un fenómeno físico o de una llamada?"
