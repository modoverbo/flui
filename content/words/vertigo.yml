        why_not: "«Sueño» habla de necesitar dormir, y la frase compara la sensación con subir a un escenario, no con estar cansado."
        hint_specific: "El sueño es necesitar dormir. ¿Diego compara la sensación con dormir o con subir a un escenario?"
      - position: 3
        text: "vórtice"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Un «vórtice» es un remolino físico de aire o agua, sin relación con la emoción de recibir un mensaje."
        hint_specific: "Un vórtice es un remolino físico. ¿La frase habla de un fenómeno físico o de un mensaje?"
  - position: 7
    sentence: "Julia sintió un {{blank}} apenas escuchó su voz por teléfono después de tanto tiempo sin hablar."
    hint_general: "Una emoción fuerte que aparece al reencontrarte con alguien importante, aunque sea solo por voz."
    explanation: "Vértigo: una emoción fuerte al reencontrarte con alguien importante. «Fastidio» describe molestia, y «vórtice» es un remolino físico, ninguno describe la emoción de Julia al escuchar esa voz."
    options:
