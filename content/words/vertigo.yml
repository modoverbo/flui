        hint_specific: "El alivio es calma. ¿El beso le dio calma o una emoción intensa?"
      - position: 3
        text: "vórtice"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Un «vórtice» es un remolino físico de aire o agua, sin relación con la emoción de un primer beso."
        hint_specific: "Un vórtice es un remolino físico. ¿La frase habla de un fenómeno físico o de un beso?"
