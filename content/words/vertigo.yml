readings:
  - position: 1
    scene: "social"
    conversation_type: "emocional"
    title: "El mensaje que llegó"
    body: "Cada vez que el teléfono de Camila vibraba con su nombre, algo se movía en su estómago. «Me da un vértigo raro cuando me escribe», le confesó a su amiga, «y no sé si eso es buena o mala señal»."
    before_phrase: "Me pone nervioso en el buen sentido cuando me escribe."
    after_phrase: "Me da vértigo cuando me escribe."
  - position: 2
    scene: "trabajo"
    conversation_type: "social"
    title: "La mirada desde el otro lado de la sala"
    body: "En la fiesta de la empresa, Bruno cruzó miradas con alguien del otro equipo. «Sentí un vértigo tremendo, como hacía tiempo no me pasaba», le contó después a un compañero, todavía con la sonrisa puesta."
    before_phrase: "Sentí algo fuerte en el estómago, como hacía tiempo no me pasaba."
    after_phrase: "Sentí un vértigo tremendo, como hacía tiempo no me pasaba."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "La llamada después de tanto tiempo"
    body: "Julia no esperaba escuchar esa voz después de tantos meses. «Me dio vértigo apenas contestó», le contó a su hermana, «como si el tiempo no hubiera pasado para nada entre los dos»."
    before_phrase: "Sentí algo fuerte apenas contestó."
    after_phrase: "Me dio vértigo apenas contestó."
