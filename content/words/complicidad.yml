readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "El chiste de siempre"
    body: "En la boda de un primo, Nerea y Abel se miraron cuando el DJ puso la canción que años atrás arruinó una fiesta. No dijeron nada, pero los dos se aguantaron la risa al mismo tiempo. «Siguen teniendo la misma complicidad de siempre», comentó alguien en la mesa."
    before_phrase: "Nos entendimos sin decir nada."
    after_phrase: "Seguimos teniendo la misma complicidad de siempre."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La señal de la cena"
    body: "Cada vez que un tío empezaba a contar la misma historia, Jimena y su hermana se tocaban el codo bajo la mesa. Nadie más lo notaba. Al terminar la cena, su hermana le escribió: «Gracias por aguantar la historia conmigo». Jimena respondió: «Para eso está la complicidad»."
    before_phrase: "Nos entendimos con solo mirarnos."
    after_phrase: "Para eso está la complicidad."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El código de la reunión"
    body: "Cuando una reunión se alargaba demasiado, Renzo y su compañera de equipo cruzaban una mirada que significaba «hay que cerrar esto ya». Sin decir una palabra, uno de los dos siempre encontraba la manera de terminar a tiempo. «Tenemos una complicidad que ahorra reuniones enteras», bromeó ella después."
    before_phrase: "Nos entendemos sin necesidad de hablar en las reuniones."
    after_phrase: "Tenemos una complicidad que ahorra reuniones enteras."
