    sentence: "Estela y Perla llevan diez años terminando las frases la una de la otra: eso ya es {{blank}}, no solo llevarse bien."
    hint_general: "Es entenderse tan bien que hasta se adivinan lo que el otro va a decir."
    explanation: "Complicidad: entenderse tan bien que hasta terminan las frases. «Compinche» es una palabra coloquial para un amigo travieso, no describe este tipo de conexión, y «confianza» es creer en alguien, pero no explica que se entiendan sin esfuerzo."
