        is_correct: false
        distractor_type: "paronym"
        why_not: "«Complejidad» dice que algo es difícil de entender, y aquí las dos se entendieron al instante con una mirada."
        hint_specific: "«Complejidad» habla de lo difícil de entender. ¿Les costó entenderse a Otilia y su amiga?"
