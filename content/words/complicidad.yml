    hint_general: "Es tener un código propio que solo dos personas entienden."
    explanation: "Complicidad: un código propio que nadie más entiende. «Complicación» habla de un problema añadido, no de un código compartido entre amigos, y «costumbre» solo diría que lo repiten, sin explicar por qué ese código resulta incomprensible para los demás."
