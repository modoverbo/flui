        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Costumbre» diría solo que lo repiten, pero no explica por qué ese código es incomprensible para cualquier otra persona."
        hint_specific: "«Costumbre» es algo que se repite. ¿Por qué nadie más entiende el código de Dante?"
      - position: 3
        text: "complicidad"
