confusions:
  - confused_with: "confianza"
    difference: "«Confianza» es creer en el otro; la complicidad es además entenderse sin palabras, con gestos o miradas."
    memory_trick: "La confianza se declara; la complicidad se nota en un gesto."
  - confused_with: "compinche"
    difference: "«Compinche» nombra a la persona, casi siempre para bromas o líos; la complicidad nombra el vínculo entre dos personas que se entienden."
exercises:
  - position: 1
    sentence: "Otilia y su amiga se miraron un segundo en la reunión y las dos supieron que pensaban lo mismo: años de {{blank}} hablando sin palabras."
    hint_general: "Es entenderse con alguien al instante, sin necesitar ninguna palabra."
    explanation: "Complicidad: entenderse sin decir nada, con solo una mirada. «Complejidad» habla de que algo es difícil de entender, y aquí ocurre justo lo contrario: se entienden al instante; «confianza» es creer en alguien, pero no explica por qué se entendieron sin hablar."
