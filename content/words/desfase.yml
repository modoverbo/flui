    conversation_type: "social"
    title: "Lo que se decidió en marzo"
    body: "En la asociación del barrio, lo acordado en marzo y lo que se hacía en octubre ya no se parecían. Nadie lo había dicho en voz alta. «Hay un desfase constante», comentó Rebeca en la asamblea, «y no lo ha explicado nadie». Se revisó el acta punto por punto."
