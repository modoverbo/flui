    body: "Mi madre cierra las cuentas de casa el día uno y mi padre el quince. Durante años discutieron por números que no cuadraban. «Aquí nadie se equivoca», les dije un domingo, «hay un desfase de dos semanas entre las dos cuentas». Ahora cierran los dos el mismo día."
    before_phrase: "Es que a ti siempre te sale otra cosa."
    after_phrase: "Hay un desfase de dos semanas entre las dos cuentas."
