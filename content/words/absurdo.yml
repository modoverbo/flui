    title: "La cena del revés"
    body: "El pastel salió antes que la sopa y la sopa llegó cuando ya nadie tenía hambre. Malena miró la mesa y dijo: «Esto es absurdo y me encanta». Se rieron tanto que la anfitriona dejó de disculparse. Ahora piden esa cena todos los años."
    before_phrase: "Esto no tiene ni pies ni cabeza."
    after_phrase: "Esto es absurdo y me encanta."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Los tornillos de la nevera"
    body: "Durante años nadie entendió por qué el tío Jonás guardaba los tornillos en la nevera. Un domingo su sobrina se lo preguntó en serio. «Porque así sé dónde están», contestó él. Ella se rio: «Tío, eso es absurdo». Él también se rio, y siguió guardándolos ahí."
    before_phrase: "Eso es una tontería enorme."
    after_phrase: "Tío, eso es absurdo."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El número del papel"
    body: "Le pidieron a Nerea el número que venía en el papel que aún no le habían enviado. Lo intentó tres veces con tres personas distintas. Al final escribió: «Entiendo el procedimiento, pero es absurdo: no puedo leer un papel que no tengo». Le contestaron con una excepción y el asunto se resolvió esa tarde."
    before_phrase: "Esto no puede ser, es de locos."
    after_phrase: "Entiendo el procedimiento, pero es absurdo."
