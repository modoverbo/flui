readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Las tres líneas"
    body: "Pusimos las tres líneas del catálogo en una hoja. La que más orgullo daba era la que más dinero se comía. «Solo una es rentable», dijo Bruno, «las otras dos las pagamos nosotros». Nadie se ofendió: por fin era una conversación con números."
    before_phrase: "Esa línea creo que sale a cuenta."
    after_phrase: "Solo una de las tres es rentable."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "El taller de los sábados"
    body: "Mi hermana da clases de cerámica los sábados y siempre acaba invitando el café. Le pregunté si le compensaba. «No es rentable y lo sé», contestó. «Lo hago porque el lunes trabajo mejor». Dejé de insistir."
    before_phrase: "Eso no te compensa, ¿no?"
    after_phrase: "No es rentable, y aun así lo elijo."
  - position: 3
    scene: "entrevista"
    conversation_type: "social"
    title: "La pregunta incómoda"
    body: "En la entrevista le preguntaron a Nadia por un proyecto que había cerrado. No lo maquilló. «Lo cerré porque dejó de ser rentable y tardé seis meses en aceptarlo», dijo. El entrevistador anotó, sonrió y siguió por ahí."
    before_phrase: "Lo cerramos porque ya no salía a cuenta."
    after_phrase: "Lo cerré porque dejó de ser rentable."
