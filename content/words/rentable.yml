confusions:
  - confused_with: "notable"
    difference: "«Notable» dice que algo destaca y se nota; esta palabra dice que deja más de lo que cuesta."
    memory_trick: "Lo notable llama la atención; lo rentable llena la caja."
  - confused_with: "económico"
    difference: "«Económico» dice que cuesta poco; algo puede costar mucho y aun así dejar mucho más."
    memory_trick: "Económico mira el precio; rentable mira la diferencia."
  - confused_with: "beneficioso"
    difference: "«Beneficioso» dice que algo trae una ventaja real, que puede no ser dinero: tiempo, comodidad o una mejor relación con el cliente; esta palabra mide específicamente si deja más dinero del que cuesta."
    memory_trick: "Beneficioso se mide en ventajas; rentable se mide en dinero."
exercises:
  - position: 1
    sentence: "De los tres servicios, el de mantenimiento es el más {{blank}}: cuesta poco sostenerlo y factura todos los meses."
    hint_general: "Compara lo que entra con lo que cuesta y sale ganando."
    explanation: "Rentable: entra más de lo que cuesta sostenerlo. «Notable» solo diría que destaca, y «económico» hablaría del precio, no de la diferencia."
    options:
      - position: 1
        text: "notable"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Notable» dice que algo llama la atención, y aquí lo que se compara es el dinero que entra y el que sale."
        hint_specific: "«Notable» va de destacar. ¿La frase compara fama o compara cuentas?"
      - position: 2
        text: "rentable"
        is_correct: true
      - position: 3
        text: "económico"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Económico» solo dice que cuesta poco, y la frase también cuenta lo que ese servicio factura."
        hint_specific: "«Económico» mira el precio. ¿Aquí solo importa lo que cuesta?"
  - position: 2
    sentence: "Tras dos años de pérdidas, Ulises cerró la tienda de la avenida y se quedó con la única {{blank}}."
    hint_general: "Se queda con la que deja más de lo que cuesta mantener."
    explanation: "Rentable: es la que deja más de lo que cuesta. «Redonda» es de charla informal y significa perfecta, y «productiva» hablaría de cuánto se hace, no de cuánto queda."
    options:
      - position: 1
        text: "redonda"
        is_correct: false
        distractor_type: "register"
        why_not: "«Redonda» es de conversación muy suelta y significa que algo salió perfecto, no que las cuentas cuadren."
        hint_specific: "«Redonda» suena a charla de café y habla de algo perfecto. ¿Eso es lo que se mide aquí?"
      - position: 2
        text: "rentable"
        is_correct: true
      - position: 3
        text: "productiva"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Productiva» dice cuánto se produce, y una tienda puede vender mucho y aun así perder dinero."
        hint_specific: "«Productiva» cuenta lo que sale de la tienda. ¿Eso garantiza que quede dinero?"
  - position: 3
    sentence: "El estudio salió {{blank}} desde el primer trimestre, aunque la obra del local había costado más de lo previsto."
    hint_general: "A pesar del gasto inicial, lo que entra supera lo que se puso."
    explanation: "Rentable: lo que entra supera lo que se puso. «Notable» hablaría de destacar, y «viable» solo diría que se puede sostener sin quebrar."
    options:
      - position: 1
        text: "rentable"
        is_correct: true
      - position: 2
        text: "notable"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Notable» dice que algo destaca entre los demás, y la frase compara la obra con lo que ya entró."
        hint_specific: "«Notable» es sobresalir. ¿El estudio destaca o devuelve lo invertido?"
      - position: 3
        text: "viable"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Viable» dice que algo se puede sostener, y sostenerse no es lo mismo que devolver más de lo que costó."
        hint_specific: "«Viable» es que algo aguanta en pie. ¿Aguantar es lo mismo que ganar?"
  - position: 4
    sentence: "Damián disfruta dando clases los sábados, pero admite que ese taller nunca fue {{blank}} y lo hace por gusto."
    hint_general: "Reconoce que el taller no devuelve lo que cuesta, aunque lo disfrute."
    explanation: "Rentable: no devuelve lo que cuesta. «Notable» hablaría de destacar, y «sostenible» diría que aguanta, cuando la frase admite que no se paga solo."
    options:
      - position: 1
        text: "sostenible"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sostenible» dice que algo se mantiene en el tiempo, y él lo mantiene con su gusto, no con sus cuentas."
        hint_specific: "«Sostenible» es aguantar en el tiempo. ¿Qué lo sostiene, el dinero o las ganas?"
      - position: 2
        text: "notable"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Notable» diría que el taller destaca, y la frase habla de lo que cuesta y lo que deja."
        hint_specific: "«Notable» va de sobresalir. ¿Damián habla de prestigio o de cuentas?"
      - position: 3
        text: "rentable"
        is_correct: true
  - position: 5
    sentence: "En la reunión con el banco, Amaya mostró dos años de números para probar que el proyecto era {{blank}}."
    hint_general: "Quiere probar con números que entra más de lo que sale."
    explanation: "Rentable: entra más de lo que sale. «Redondo» es de charla informal y significa perfecto, y «viable» solo diría que el proyecto puede sostenerse."
    options:
      - position: 1
        text: "rentable"
        is_correct: true
      - position: 2
        text: "redondo"
        is_correct: false
        distractor_type: "register"
        why_not: "«Redondo» es coloquial y afirma que todo salió perfecto; delante del banco se prueba otra cosa, con cifras."
        hint_specific: "«Redondo» es lenguaje de sobremesa y promete perfección. ¿Va bien con dos años de números?"
      - position: 3
        text: "viable"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Viable» dice que el proyecto puede llevarse a cabo, y el banco quiere saber qué devuelve, no si se puede."
        hint_specific: "«Viable» es que se puede hacer. ¿Eso responde a lo que pregunta un banco?"
  - position: 6
    sentence: "El puesto del mercado vendía muchísimo, aunque Gaspar calculó que apenas era {{blank}} después de pagar el alquiler."
    hint_general: "Vender mucho no basta: hay que mirar lo que queda tras pagar."
    explanation: "Rentable: apenas queda algo tras pagar el alquiler. «Jugoso» es coloquial y promete una ganancia golosa, y «productivo» solo mediría cuánto se vende."
    options:
      - position: 1
        text: "productivo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Productivo» mide cuánto se vende, y la frase dice que vendía muchísimo y aun así casi no quedaba nada."
        hint_specific: "«Productivo» cuenta lo que sale del puesto. ¿La frase duda de las ventas o de lo que sobra?"
      - position: 2
        text: "jugoso"
        is_correct: false
        distractor_type: "register"
        why_not: "«Jugoso» es informal y anuncia una ganancia golosa, justo lo contrario de lo que salió en la cuenta."
        hint_specific: "«Jugoso» promete una ganancia grande. ¿Cuánto quedó tras pagar el alquiler?"
      - position: 3
        text: "rentable"
        is_correct: true
  - position: 7
    sentence: "Mi tío repite que el huerto no es {{blank}}, y aun así cada domingo vuelve con las manos llenas de tierra."
    hint_general: "Dice que no devuelve dinero, aunque le devuelva otras cosas."
    explanation: "Rentable: no devuelve dinero, aunque él siga yendo. «Notable» hablaría de destacar, y «barato» solo diría que el huerto cuesta poco."
    options:
      - position: 1
        text: "barato"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Barato» diría que el huerto cuesta poco, y lo que él admite es que no le devuelve dinero."
        hint_specific: "«Barato» mira lo que cuesta. ¿Tu tío se queja del precio o de lo que recibe?"
      - position: 2
        text: "rentable"
        is_correct: true
      - position: 3
        text: "notable"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Notable» diría que el huerto destaca, y la frase compara el esfuerzo con el dinero que deja."
