    title: "La nota bajo la puerta"
    body: "Cuando Renzo pasaba por un momento difícil, un vecino le dejaba comida bajo la puerta sin decir nada. Meses después, Renzo tocó su puerta con una torta casera: «No sabía cómo decírtelo, así que hice esto». Su vecino sonrió: «Con esto ya me mostraste tu gratitud»."
    before_phrase: "No sé cómo decirte lo mucho que ayudó lo que hiciste."
    after_phrase: "Con esto ya te mostré mi gratitud."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El café de los viernes"
    body: "Durante meses, un compañero le trajo café a Vidal todos los viernes sin que se lo pidiera, mientras terminaba un proyecto imposible. El día que entregó el proyecto, Vidal le dejó una nota en el escritorio: «Toda mi gratitud por los viernes de café»."
    before_phrase: "No tengo cómo devolverte esto, pero quería que lo supieras."
    after_phrase: "Toda mi gratitud por los viernes de café."
