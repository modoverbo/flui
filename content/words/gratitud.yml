confusions:
  - confused_with: "gratuidad"
    difference: "«Gratuidad» dice que algo no cuesta dinero; la gratitud es un sentimiento hacia una persona que hizo algo por ti."
    memory_trick: "La gratuidad habla del precio; la gratitud habla del corazón."
  - confused_with: "deuda"
    difference: "«Deuda» es algo que hay que devolver; la gratitud es un sentimiento que se puede expresar sin devolver nada material."
