    title: "El brindis inesperado"
    body: "En su cumpleaños, Perla pidió la palabra antes del pastel: «Quiero nombrar a alguien que estuvo en cada momento difícil de este año». Todos miraron a Selene, que se puso roja. «Eso es gratitud de verdad», dijo alguien en la mesa."
    before_phrase: "Quiero decir lo mucho que significa para mí lo que hiciste."
    after_phrase: "Eso es gratitud de verdad."
