confusions:
  - confused_with: "entenderse"
    difference: "«Entenderse» es llegar a comprenderse con alguien; la otra palabra dice que ocupaste más tiempo o más espacio del previsto."
    memory_trick: "Te entiendes con alguien; lo otro lo haces tú solo y de más."
  - confused_with: "extenuarse"
    difference: "«Extenuarse» es quedarse sin fuerzas por el esfuerzo; la otra palabra no habla de cansancio, sino de duración."
    memory_trick: "Te extenúas cuando no puedes más; lo otro es cuando no paras."
exercises:
  - position: 1
    sentence: "Rebeca tenía diez minutos y {{blank}} hasta los veintidós, así que el resto del panel se quedó sin turno."
    hint_general: "Ocupó el doble de tiempo del que le tocaba."
    explanation: "Se extendió: ocupó el doble de su tiempo. «Se entendió» hablaría de comprenderse con alguien, y «peroró» es palabra culta que suena a discurso solemne."
    options:
      - position: 1
        text: "se entendió"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Entenderse» es comprenderse con otra persona, y aquí el problema es el reloj: veintidós minutos en vez de diez."
        hint_specific: "Entenderse necesita a dos. ¿Qué es lo que se pasó de la raya en esta escena?"
      - position: 2
        text: "se extendió"
        is_correct: true
      - position: 3
        text: "peroró"
        is_correct: false
        distractor_type: "register"
        why_not: "«Perorar» es palabra culta y suena a discurso solemne y hueco, y aquí se cuenta un exceso de minutos, no un tono grandilocuente."
        hint_specific: "«Perorar» pinta a alguien subido a una tarima antigua. ¿Qué mide esta frase?"
  - position: 2
    sentence: "Cada vez que le preguntan por su trabajo, Timoteo {{blank}} y pierde a media mesa."
    hint_general: "Se alarga tanto que la gente deja de seguirlo."
    explanation: "Se extiende: se alarga hasta perder a la mesa. «Se extenúa» sería quedarse sin fuerzas, y «se repite» diría que vuelve al mismo punto."
    options:
      - position: 1
        text: "se extiende"
        is_correct: true
      - position: 2
        text: "se extenúa"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Extenuarse» es quedarse sin fuerzas, y quien se queda sin energía aquí es la mesa, no él."
        hint_specific: "Extenuarse deja a alguien agotado. ¿Quién se cansa en esta escena?"
      - position: 3
        text: "se repite"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Repetirse» es volver al mismo punto una y otra vez, y la frase no dice que insista: dice que no termina."
        hint_specific: "Repetirse es dar vueltas al mismo dato. ¿La frase habla de volver atrás o de no parar?"
  - position: 3
    sentence: "El correo tenía que ser de cinco líneas, pero Yolanda {{blank}} hasta la segunda página."
    hint_general: "Escribió mucho más de lo que se había marcado."
    explanation: "Se extendió: escribió mucho más de lo previsto. «Se entendió» hablaría de comprenderse con alguien, y «se explayó» sugiere hablar a gusto y con libertad."
