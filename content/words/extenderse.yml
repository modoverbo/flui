readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Diez minutos, veintidós"
    body: "Rebeca abrió el panel con diez minutos asignados y terminó a los veintidós. Las dos personas que iban después se quedaron con tres minutos cada una. Al salir lo dijo ella misma: «Me extendí, y ese tiempo lo pagó el resto». La siguiente vez llevó un reloj delante."
    before_phrase: "Me enrollé muchísimo, perdón."
    after_phrase: "Me extendí, y el tiempo lo pagó el resto."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Las conclusiones de Consuelo"
    body: "Consuelo escribe cartas largas a su hija, que vive lejos. «Las tuyas empiezan muy bien y al final te extiendes», le contestó un día. Ahora se pone un tope: una hoja. Dice que caben las mismas cosas y que su hija las responde antes."
    before_phrase: "Ya sé que te escribo unos ladrillos."
    after_phrase: "Ya sé que al final me extiendo."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "Dos frases y un abrazo"
    body: "En la despedida de Emiliano todos esperaban el discurso. Se levantó, dijo dos frases sobre la gente que se quedaba y se sentó. «Prefiero no extenderme, que se enfría la comida». Fue la despedida que más gente recuerda de esa oficina."
    before_phrase: "No me voy a poner a hablar media hora."
    after_phrase: "Prefiero no extenderme."
