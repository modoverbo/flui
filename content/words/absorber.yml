explanation: "Meter algo dentro de uno mismo poco a poco: agua, un gasto o un equipo entero."
example_sentence: "El hotel decidió absorber la subida del gas y no tocar el precio de las noches."
register: "neutral"
pedantry_risk: 1
usage_tip: "Vale igual para un líquido y para un coste: siempre significa que algo entra y se queda dentro."
when_not_to_use: "No la uses para perdonar una falta o declarar libre a alguien; eso es «absolver»."
collocations:
