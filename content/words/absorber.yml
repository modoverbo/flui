        text: "absolvían"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Absolver» es perdonar una falta a alguien, y unas suelas no juzgan a nadie: recogen la fuerza del golpe."
        hint_specific: "«Absolver» perdona a personas. ¿A quién perdonarían unas suelas?"
      - position: 3
        text: "encajaban"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Encajar» un golpe es aguantarlo sin caerse, y las rodillas mejoraron porque el material se quedó con la fuerza."
