        text: "chupó"
        is_correct: false
        distractor_type: "register"
        why_not: "«Chupar» es coloquial y evoca una boca; para una esponja que retiene agua suena poco cuidado."
        hint_specific: "«Chupar» se hace con la boca. ¿Encaja ese verbo con un objeto de cocina?"
  - position: 2
