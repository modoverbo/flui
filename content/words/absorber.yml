    hint_general: "El coste se queda dentro de la casa en vez de pasarlo al cliente."
    explanation: "Absorber: el coste se queda en el hotel. «Resolver» sería darle una solución al aumento, y «aplazar» solo lo dejaría para más adelante."
    options:
      - position: 1
        text: "resolver"
        is_correct: false
        distractor_type: "paronym"
