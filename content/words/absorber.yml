confusions:
  - confused_with: "absolver"
    difference: "«Absolver» es perdonar una falta o declarar libre a alguien; la otra palabra hace que algo entre y se quede dentro."
    memory_trick: "Una libera a una persona; la otra retiene una cosa."
  - confused_with: "disolver"
    difference: "«Disolver» deshace algo dentro de un líquido hasta que desaparece; la otra palabra lo retiene entero."
    memory_trick: "Disolver deshace; retener guarda."
exercises:
