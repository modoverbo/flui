    sentence: "Un buen forro {{blank}} la humedad y la caja de cartón llega seca."
    hint_general: "El material se queda con el agua del aire en vez de dejarla llegar."
    explanation: "Absorbe: el forro se queda con la humedad. «Disuelve» deshace algo dentro de un líquido, y «repele» la echaría hacia fuera en lugar de retenerla."
    options:
      - position: 1
        text: "disuelve"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Disolver» deshace una sustancia dentro de un líquido, y aquí el forro no deshace nada: se queda con el agua del aire."
        hint_specific: "Disolver necesita algo sólido que deshacer. ¿Qué se deshace dentro de ese forro?"
      - position: 2
