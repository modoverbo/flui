readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "Las sillas antes de tiempo"
    body: "Media hora antes de la charla, Manuel ya tenía las sillas colocadas y dos de más al fondo. Nadie se lo había pedido. La organizadora se lo dijo delante de todos: «Se te nota el oficio, Manuel». Él contestó que llevaba veinte años montando salas y se fue a por el agua."
    before_phrase: "Se ve que lleva años en esto."
    after_phrase: "Se te nota el oficio."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Las costuras del revés"
    body: "Remedios cose desde los quince. Su nieta le llevó una chaqueta de marca y ella la giró del revés antes de mirar nada más. «Aquí está el oficio o no está», dijo, y señaló una costura torcida. La chaqueta volvió a la tienda al día siguiente."
    before_phrase: "Yo de esto sé un poco, de tantos años."
    after_phrase: "El oficio se ve en las costuras del revés."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "Mirando manos"
    body: "Rosalba entró en el taller con dos cursos hechos y un manual bajo el brazo. Al segundo día guardó el manual. Cándido no le daba explicaciones: la dejaba probar y corregía solo cuando se atascaba. «El oficio se aprende mirando manos», resumió ella meses después."
    before_phrase: "Aquí se aprende trabajando, no leyendo."
    after_phrase: "El oficio se aprende mirando manos."
