    difference: "«Lapsus» es un tropiezo puntual al hablar o escribir, casi siempre una sola palabra; esto puede ser también un comentario entero o un gesto fuera de lugar."
    memory_trick: "El lapsus cambia una palabra; el desliz cambia el momento entero."
  - confused_with: "torpeza"
    difference: "«Torpeza» describe una forma de ser poco hábil en general; esto nombra un momento puntual, no un rasgo de la persona."
    memory_trick: "La torpeza es constante; el desliz pasa una vez."
