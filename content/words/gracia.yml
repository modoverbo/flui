    body: "Nadie esperaba que Martín, tan reservado en el trabajo, tuviera tanta gracia contando historias. En la fiesta de fin de año, terminó rodeado de gente pidiéndole «una más». Su compañera de equipo lo miraba sin poder creerlo: era otra persona con un micrófono improvisado en la mano."
