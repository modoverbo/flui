    body: "Cada Año Nuevo, el tío Emilio cuenta cómo se quedó varado en la ruta con el auto humeando. La historia es la misma desde hace diez años, pero la gracia con la que la cuenta cambia cada vez un detalle, y la familia entera vuelve a reírse como la primera vez."
    before_phrase: "Cuenta lo mismo de siempre, pero suena distinto cada vez."
    after_phrase: "Lo cuenta con una gracia que nunca se gasta."
