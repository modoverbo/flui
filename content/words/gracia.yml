    title: "El aviso que nadie ignoró"
    body: "El administrador del edificio pidió cerrar bien la puerta del garaje, un aviso que normalmente nadie lee. Bruno lo redactó con tanta gracia, comparando la puerta con un portero dormido, que hasta los vecinos más quejosos lo comentaron en el chat con risas."
