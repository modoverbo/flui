readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Tres quejas, no una"
    body: "Cristóbal avisaba al equipo cada vez que llegaba una queja, y el equipo había dejado de leer sus avisos. Lo cambió sin drama: «Subo el umbral a tres quejas en la misma semana». Desde entonces, cuando escribe, todo el mundo abre el correo."
    before_phrase: "Aviso cuando ya son bastantes."
    after_phrase: "Subo el umbral a tres quejas en la misma semana."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Dos conversaciones a la vez"
    body: "En las comidas de casa se habla mucho y a la vez. «No es que seas antipático», me dijo mi prima. «Es que tienes el umbral del ruido muy bajo». Nunca lo había sabido decir así. Ahora me levanto un rato y vuelvo, y nadie se ofende."
    before_phrase: "Es que aguanto muy poco ruido."
    after_phrase: "Tengo el umbral del ruido muy bajo."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "Veinte pedidos"
    body: "La panadería del barrio quería premiar a quien pide para todo el edificio. «Fijemos un umbral», propuso Cristóbal en la reunión de vecinos, «veinte piezas». Del pedido veintiuno en adelante, el pan sale más barato. Nadie discutió la cifra."
    before_phrase: "A partir de bastantes piezas hacemos un precio."
    after_phrase: "Fijemos un umbral: veinte piezas."
