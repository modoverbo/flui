    hint_general: "Rodear a alguien con los brazos, después de un proceso largo de sanar una relación."
    explanation: "Abrazar: rodear a alguien con los brazos, tras sanar una relación. «Perdonar» describe un proceso más interno, y «abrasar» es quemar con fuego; ninguno describe ese gesto físico concreto."
