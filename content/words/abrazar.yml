readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "La cara que decía todo"
    body: "Apenas la vio entrar, Marta supo que algo andaba mal. No preguntó nada: solo la abrazó fuerte y la dejó quedarse así un buen rato. «Gracias por no preguntar nada, solo abrazarme», le dijo su amiga después."
    before_phrase: "Gracias por no preguntar nada, solo quedarte a mi lado."
    after_phrase: "Gracias por no preguntar nada, solo abrazarme."
  - position: 2
    scene: "trabajo"
    conversation_type: "emocional"
    title: "Sin importar el resultado"
    body: "El equipo había perdido la final, pero el entrenador reunió a todos igual. «Los voy a abrazar a todos, ganen o pierdan, porque el esfuerzo fue real», dijo, y uno por uno fue saliendo con la cabeza un poco más alta."
    before_phrase: "Les voy a dar un abrazo a todos, ganen o pierdan."
    after_phrase: "Los voy a abrazar a todos, ganen o pierdan."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "Sin esa distancia de siempre"
    body: "Después de meses de terapia, algo había cambiado. Cuando su padre abrió la puerta, Elena no dudó: lo abrazó como no lo había hecho en años. «Por fin puedo abrazarte sin sentir esa distancia», le dijo, con los ojos llenos de lágrimas."
    before_phrase: "Por fin puedo acercarme sin sentir esa distancia."
    after_phrase: "Por fin puedo abrazarte sin sentir esa distancia."
