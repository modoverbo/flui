        hint_specific: "Perdonar es un proceso interno. ¿La frase habla de un sentimiento interno o de un gesto físico concreto?"
      - position: 3
        text: "abrasar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Abrasar» es quemar algo con fuego o calor intenso, sin relación con sanar la relación con un padre."
