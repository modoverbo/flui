        why_not: "«Chapeaban» es coloquial y regional, y aquí se busca nombrar con precisión el gesto de los novios con cada invitado."
        hint_specific: "«Chapeaban» es una palabra muy regional. ¿El texto busca una palabra precisa o una muy coloquial?"
      - position: 3
        text: "abrasaban"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Abrasar» es quemar algo con fuego o calor intenso, sin relación con saludar con cariño a los invitados de una boda."
        hint_specific: "Abrasar quema algo con fuego. ¿Los novios quemaban algo o saludaban con cariño?"
  - position: 7
    sentence: "Antes de subir al escenario, su compañera de banda la {{blank}} fuerte para darle ánimo."
    hint_general: "Rodear a alguien con los brazos para darle ánimo antes de un momento importante."
    explanation: "Abrazó: rodeó a alguien con los brazos para darle ánimo. «Empujó» describe un gesto físico muy distinto, y «abrasó» es quemar con fuego, ninguno describe dar ánimo antes de subir al escenario."
    options:
      - position: 1
        text: "abrazó"
        is_correct: true
      - position: 2
        text: "empujó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Empujar» describe un gesto físico muy distinto, sin relación con dar ánimo a través de un gesto de cariño."
        hint_specific: "Empujar es un gesto brusco. ¿Su compañera la empujó o le dio ánimo con cariño?"
      - position: 3
        text: "abrasó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Abrasar» es quemar algo con fuego o calor intenso, sin relación con dar ánimo antes de subir al escenario."
        hint_specific: "Abrasar quema algo con fuego. ¿Su compañera quemó algo o le dio ánimo?"
  - position: 8
