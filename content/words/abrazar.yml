        hint_specific: "Felicitar usa palabras. ¿El capitán dio un discurso o hizo un gesto sin palabras?"
      - position: 3
        text: "abrasó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Abrasar» es quemar algo con fuego o calor intenso, sin relación con el gesto del capitán hacia sus compañeros."
        hint_specific: "Abrasar quema algo con fuego. ¿El capitán quemó algo o hizo un gesto de cariño?"
  - position: 6
    sentence: "Cuando terminó la ceremonia, los novios {{blank}} a cada invitado que se acercaba a saludarlos."
    hint_general: "Rodear con los brazos a cada persona que se acerca, en un momento de celebración."
    explanation: "Abrazaban: rodeaban con los brazos a cada persona que se acercaba. «Chapeaban» es coloquial y regional, y «abrasaban» es quemar con fuego, ninguno describe ese gesto cálido con los invitados."
