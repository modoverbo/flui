schema_version: 1
slug: "abrazar"
status: "approved"
lemma: "abrazar"
part_of_speech: "verbo"
syllables:
  - "a"
  - "bra"
  - "zar"
stressed_syllable: 3
ipa_latam: "[a.βɾaˈsaɾ]"
ipa_es: "[a.βɾaˈθaɾ]"
explanation: "Rodear a alguien con los brazos para mostrarle cariño o apoyo, sin necesitar palabras."
example_sentence: "Sin decir nada, Marta abrazó a su amiga apenas la vio llegar con esa cara."
register: "neutral"
pedantry_risk: 1
usage_tip: "Úsalo para ese gesto físico de cariño que a veces dice más que cualquier palabra."
when_not_to_use: "No lo uses para un saludo formal de distancia: abrazar implica un gesto cercano y cálido, no un simple saludo."
collocations:
  - "abrazar fuerte"
  - "abrazar sin decir nada"
  - "abrazar a alguien"
replaces:
  - before: "La rodeó fuerte con los brazos sin decir nada"
    after: "La abrazó fuerte sin decir nada"
  - before: "La rodeó con los brazos para consolarla"
    after: "La abrazó para consolarla"
family:
  - "abrazo"
themes:
  - slug: "empatia-escucha"
    relevance: 3
tags:
  comodin:
    - "dar un abrazo"
    - "apretar fuerte"
  funcion:
    - "consolar"
  canal: "ambos"
  formalidad: "informal"
  variedad: "panhispanico"
confusions:
  - confused_with: "abrasar"
    difference: "Abrasar es quemar algo con fuego o calor intenso; abrazar es rodear a alguien con los brazos para mostrarle cariño."
    memory_trick: "El fuego abrasa; los brazos abrazan."
exercises:
  - position: 1
    sentence: "Sin decir nada, Marta {{blank}} a su amiga apenas la vio llegar con esa cara."
    hint_general: "Rodear a alguien con los brazos para mostrarle cariño o apoyo, sin necesitar palabras."
    explanation: "Abrazó: rodeó a alguien con los brazos para mostrarle cariño. «Abrasó» es quemar con fuego, y «saludó» describe un gesto más distante, sin ese cariño físico cercano."
    options:
      - position: 1
        text: "abrazó"
        is_correct: true
      - position: 2
        text: "abrasó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Abrasar» es quemar algo con fuego o calor intenso, sin relación con mostrar cariño a una amiga que llega con mala cara."
        hint_specific: "Abrasar quema algo con fuego. ¿Marta quemó algo o mostró cariño a su amiga?"
      - position: 3
        text: "saludó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Saludar» describe un gesto más distante, y la frase describe un gesto de cariño cercano, sin decir nada, apenas la vio llegar."
        hint_specific: "Un saludo puede ser distante. ¿La frase describe un gesto distante o uno de cariño cercano?"
  - position: 2
    sentence: "El entrenador {{blank}} a cada jugador al salir de la cancha, sin importar el resultado del partido."
    hint_general: "Rodear a alguien con los brazos, sin importar cómo haya salido la situación."
    explanation: "Abrazaba: rodeaba a alguien con los brazos, sin importar el resultado. «Abrasaba» es quemar con fuego, y «criticaba» implica señalar errores, justo lo contrario de mostrar cariño."
    options:
      - position: 1
        text: "abrazaba"
        is_correct: true
      - position: 2
        text: "criticaba"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Criticar» implica señalar errores, y la frase dice que el entrenador hacía este gesto sin importar el resultado del partido, algo más cercano a apoyar que a criticar."
        hint_specific: "Criticar señala errores. ¿El entrenador criticaba o mostraba cariño sin importar el resultado?"
      - position: 3
        text: "abrasaba"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Abrasar» es quemar algo con fuego o calor intenso, sin relación con el gesto de cariño hacia cada jugador."
        hint_specific: "Abrasar quema algo con fuego. ¿El entrenador quemaba algo o mostraba cariño a los jugadores?"
  - position: 3
    sentence: "Después de la mala noticia, su hermano solo la {{blank}} fuerte, sin decir una palabra."
    hint_general: "Rodear a alguien con los brazos con fuerza, en un momento difícil, sin hablar."
    explanation: "Abrazó: rodeó a alguien con los brazos con fuerza, sin hablar. «Abrasó» es quemar con fuego, y «regañó» implica reprocharle algo, justo lo contrario de acompañarla en silencio."
    options:
      - position: 1
        text: "abrazó"
        is_correct: true
      - position: 2
        text: "regañó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Regañar» implica reprocharle algo a alguien, y la frase dice que su hermano solo la acompañó en silencio, sin decir una palabra."
        hint_specific: "Regañar es reprochar algo. ¿Su hermano la regañó o la acompañó en silencio?"
      - position: 3
        text: "abrasó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Abrasar» es quemar algo con fuego o calor intenso, sin relación con acompañar a alguien tras una mala noticia."
        hint_specific: "Abrasar quema algo con fuego. ¿Su hermano quemó algo o la acompañó en silencio?"
  - position: 4
    sentence: "Al bajar del avión después de un año afuera, Camila {{blank}} a sus padres sin poder soltarlos."
    hint_general: "Rodear a alguien con los brazos con fuerza, después de mucho tiempo sin verse."
    explanation: "Abrazó: rodeó a alguien con los brazos con fuerza, después de mucho tiempo sin verse. «Abrasó» es quemar con fuego, y «ignoró» describe justo lo contrario de no poder soltarlos."
    options:
      - position: 1
        text: "abrazó"
        is_correct: true
      - position: 2
        text: "ignoró"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Ignorar» describe justo lo contrario, y la frase dice que Camila no podía soltar a sus padres, todo lo opuesto a ignorarlos."
        hint_specific: "Ignorar es no prestar atención. ¿Camila ignoró a sus padres o no podía soltarlos?"
      - position: 3
        text: "abrasó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Abrasar» es quemar algo con fuego o calor intenso, sin relación con el reencuentro de Camila con sus padres."
        hint_specific: "Abrasar quema algo con fuego. ¿Camila quemó algo o se reencontró con sus padres?"
  - position: 5
    sentence: "En vez de dar un discurso largo, el capitán solo {{blank}} a cada uno de sus compañeros de equipo."
    hint_general: "Rodear a cada persona con los brazos, en vez de decir muchas palabras."
    explanation: "Abrazó: rodeó a cada persona con los brazos, en vez de hablar mucho. «Felicitó» implica palabras de reconocimiento, y «abrasó» es quemar con fuego; ninguno describe ese gesto sin discurso."
