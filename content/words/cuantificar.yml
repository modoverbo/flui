readings:
  - position: 1
    scene: "entrevista"
    conversation_type: "practica"
    title: "Tres días menos"
    body: "Casiano decía «mejoré el proceso» y veía cómo la entrevistadora asentía sin apuntar nada. Se preparó de otra manera: aprendió a cuantificar. «Tres días menos por pedido, sobre setenta pedidos al mes». Esa vez la entrevistadora sí escribió, y le preguntó cómo lo había conseguido."
    before_phrase: "Mejoré bastante el proceso, la verdad."
    after_phrase: "Lo puedo cuantificar: tres días menos por pedido."
  - position: 2
    scene: "trabajo"
    conversation_type: "practica"
    title: "Antes de repartir culpas"
    body: "La entrega iba tarde y la reunión empezó buscando responsables. Amaranta pidió otra cosa: cuantificar el retraso antes de discutir. Eran nueve días, no un mes, como creían todos. Con ese número la conversación cambió de tema y salió un plan en veinte minutos."
    before_phrase: "Vamos muy retrasados, esto es un desastre."
    after_phrase: "Vamos a cuantificar el retraso antes de nada."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "Ciento veinte reparaciones"
    body: "Benigno se jubila en marzo y su hija le pidió que contara lo que había hecho en el taller. Él encogió los hombros: «Arreglar cosas». Ella insistió y entre los dos lo cuantificaron: ciento veinte reparaciones al año durante treinta y un años. Ahora lo cuenta él solo, y siempre con la cifra."
    before_phrase: "Nada, yo he arreglado cosas toda la vida."
    after_phrase: "Lo cuantificamos: ciento veinte al año durante treinta y un años."
