        text: "resumió"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Resumir» se puede hacer igual sin ninguna cifra, y lo llamativo aquí es que todo el año cabe en dos números."
        hint_specific: "Un resumen puede no llevar números. ¿Qué hay en esa línea de Benigno?"
  - position: 6
    sentence: "Antes de prometer una mejora, Teo prefiere {{blank}} el punto de partida."
    hint_general: "Primero mide dónde está hoy, y luego promete."
    explanation: "Cuantificar: medir hoy el punto de partida. «Clarificar» sería explicarlo mejor, y «estimar» daría un número a ojo, sin comprobar nada."
    options:
      - position: 1
        text: "clarificar"
