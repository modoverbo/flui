  - position: 7
    sentence: "Si logras {{blank}} tu aportación, la otra persona puede repetirla en voz alta cuando tú no estés."
    hint_general: "Un número se recuerda y se repite; una frase vaga no."
    explanation: "Cuantificar: poner número a tu aportación. «Certificar» sería dar fe por escrito con un sello, y «contabilizar» suena a apuntar movimientos en un libro de cuentas."
