confusions:
  - confused_with: "certificar"
    difference: "«Certificar» es dar fe por escrito de que algo es cierto; la otra palabra solo pone números, sin sellar nada."
    memory_trick: "Certificar necesita un sello; lo otro, una cifra."
  - confused_with: "estimar"
    difference: "«Estimar» es dar un número aproximado a ojo; la otra palabra parte de datos que se pueden comprobar."
    memory_trick: "Se estima a ojo; lo otro se cuenta."
exercises:
  - position: 1
    sentence: "En la entrevista, Casiano dejó de decir «mejoré el proceso» y aprendió a {{blank}} lo que hizo."
    hint_general: "Cambió el adjetivo vago por números comprobables."
    explanation: "Cuantificar: poner números a lo que hizo. «Certificar» sería dar fe por escrito con un sello, y «contabilizar» suena a departamento de contabilidad."
    options:
      - position: 1
        text: "certificar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Certificar» es dar fe por escrito de que algo es cierto, y en una entrevista nadie sella documentos."
        hint_specific: "Certificar exige un sello y una firma. ¿Qué hace Casiano al contar su trabajo?"
      - position: 2
        text: "cuantificar"
        is_correct: true
      - position: 3
        text: "contabilizar"
        is_correct: false
        distractor_type: "register"
        why_not: "«Contabilizar» suena a departamento de contabilidad y a apuntar movimientos en un libro, y aquí se trata de explicar un logro propio."
        hint_specific: "Contabilizar pertenece a los libros de cuentas. ¿Dónde está Casiano?"
  - position: 2
    sentence: "El ahorro se pudo {{blank}} en ocho mil euros al año, y la propuesta se aprobó esa misma tarde."
    hint_general: "Se le puso una cifra exacta al ahorro y eso decidió."
    explanation: "Cuantificar: ponerle una cifra exacta al ahorro. «Clarificar» sería explicarlo mejor, y «tasar» es palabra de peritos y se usa para poner precio a un bien."
    options:
      - position: 1
        text: "cuantificar"
        is_correct: true
      - position: 2
        text: "clarificar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Clarificar» sería explicarlo mejor con palabras, y lo que convence en la frase es una cifra concreta."
        hint_specific: "Clarificar limpia una explicación. ¿Qué aparece aquí que no es una explicación?"
      - position: 3
        text: "tasar"
        is_correct: false
        distractor_type: "register"
        why_not: "«Tasar» es palabra de peritos y se usa para ponerle precio a un piso o a una joya, no a un ahorro de un proceso."
        hint_specific: "Se tasa una vivienda antes de venderla. ¿Qué se mide en esta frase?"
  - position: 3
    sentence: "Hay cosas difíciles de {{blank}}, como el ambiente de un equipo, y conviene reconocerlo."
    hint_general: "Algunas cosas no se pueden reducir a números."
    explanation: "Cuantificar: reducir algo a números. «Codificar» sería pasarlo a un código o un lenguaje, y «explicar» sí se puede hacer con el ambiente de un equipo."
    options:
      - position: 1
        text: "codificar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Codificar» es pasar algo a un código o a un lenguaje, y aquí el problema es ponerle un número al ambiente."
        hint_specific: "Codificar convierte algo en señales. ¿Qué es lo que no se le puede poner al ambiente?"
      - position: 2
        text: "explicar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Explicar» el ambiente de un equipo sí se puede hacer con palabras, y la frase señala lo que resulta imposible."
        hint_specific: "Explicar se hace hablando. ¿Qué es lo difícil según la frase?"
      - position: 3
        text: "cuantificar"
        is_correct: true
  - position: 4
    sentence: "Amaranta pidió {{blank}} el retraso antes de discutir de quién era la culpa."
    hint_general: "Quiso números del retraso antes de repartir culpas."
    explanation: "Cuantificar: poner números al retraso. «Certificar» sería dar fe por escrito con un sello, y «comparar» exigiría otro caso enfrente."
    options:
      - position: 1
        text: "cuantificar"
        is_correct: true
      - position: 2
        text: "certificar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Certificar» es dar fe por escrito con un sello, y ella solo quiere saber de qué tamaño es el retraso."
        hint_specific: "Certificar necesita una autoridad que firme. ¿Qué pide Amaranta antes de discutir?"
      - position: 3
        text: "comparar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Comparar» exigiría otro caso enfrente, y en la frase solo hay un retraso al que hay que ponerle medida."
        hint_specific: "Comparar necesita dos cosas. ¿Cuántos retrasos aparecen aquí?"

  - position: 5
    sentence: "Benigno {{blank}} su trabajo del año en una línea: ciento veinte reparaciones y once días de baja."
    hint_general: "Resumió su año con dos números."
