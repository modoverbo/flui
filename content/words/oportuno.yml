explanation: "Que llega o se dice justo cuando la situación lo pide, sin quedarse corto ni pasarse."
example_sentence: "Su pregunta fue tan oportuna que salvó la reunión justo cuando se estaba enfriando."
register: "neutral"
pedantry_risk: 1
usage_tip: "Sirve para elogiar algo dicho justo cuando hacía falta; no lo confundas con sacar ventaja de la situación."
when_not_to_use: "No la uses para quien aprovecha una situación para sacar ventaja propia; eso es aprovechado, no oportuno."
