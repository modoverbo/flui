    body: "Entrevistaron a once personas para el puesto de compras. Fernanda no tenía el currículo más largo, pero sí tres años en el mismo sector y un caso resuelto que podía contar. «Es la candidata idónea», dijo la responsable, y explicó por qué en dos frases."
    before_phrase: "Creo que es la mejor para el puesto."
    after_phrase: "Es la candidata idónea."
