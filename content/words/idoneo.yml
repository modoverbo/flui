    title: "El salón del segundo"
    body: "El taller no cabía en la sala de siempre y alguien propuso el salón del segundo piso. Buena luz, sillas que se mueven y una pared libre. «Es el espacio idóneo», resumió Héctor, y lo reservaron para los tres jueves siguientes."
    before_phrase: "Ese sitio nos viene mejor para el taller."
    after_phrase: "Es el espacio idóneo."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "El momento de cambiar"
    body: "Llevaba dos años queriendo cambiar de trabajo y siempre faltaba algo. Este otoño coincidieron las dos cosas: el contrato terminaba y había ahorro para tres meses. Se lo dijo a su madre en la cocina: «Es el momento idóneo, y no va a repetirse pronto»."
    before_phrase: "Creo que ahora es buen momento."
    after_phrase: "Es el momento idóneo."
