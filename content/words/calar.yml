readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "La frase del jueves"
    body: "Otilia presentó doce diapositivas y solo repitió una idea: «Cada correo sin contestar cuesta once minutos a otra persona». Nadie aplaudió. El martes siguiente, dos equipos habían cambiado su forma de responder. Aquella frase caló."
    before_phrase: "Creo que gustó la presentación, ¿no?"
    after_phrase: "Aquella frase caló: lo vi el martes."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Tú nunca preguntas"
    body: "La discusión con su hija duró una hora y no sirvió de nada. Lo que le caló fue una frase suelta del final: «Tú nunca preguntas». Gonzalo la recordó toda la semana, y el domingo empezó la llamada preguntando."
    before_phrase: "Se me quedó grabado lo que me dijo."
    after_phrase: "Esa frase me caló toda la semana."
  - position: 3
    scene: "entrevista"
    conversation_type: "practica"
    title: "Lo que recordaron de mí"
    body: "Ámbar contó un solo ejemplo y lo repitió al despedirse. Dos semanas después la llamaron y le dijeron: «Seguimos hablando de tu caso del almacén». Había preparado seis historias y con una que calara fue suficiente."
    before_phrase: "Conté un montón de cosas, a ver si alguna les sonó."
    after_phrase: "Con que calara una historia, bastaba."
