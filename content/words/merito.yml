    title: "Diez segundos"
    body: "El cliente felicitó al equipo por haber encontrado el fallo. Encarna esperó a que terminara el aplauso y dijo una frase: «El mérito es de Sandra, que revisó los ficheros antiguos un sábado». Sandra se puso roja, y desde entonces cuenta lo que hace sin que nadie se lo pida."
    before_phrase: "Bueno, lo hicimos entre todos."
    after_phrase: "El mérito es de Sandra, que revisó los ficheros."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "A los sesenta"
    body: "Aurelio corrió su primera carrera larga a los sesenta y dos años y llegó el penúltimo. Su nieto le enseñó el tiempo en el móvil, con cara de disculpa. Aurelio se rio: «El mérito no lo mide ese reloj». La foto de la llegada está en el pasillo de casa."
    before_phrase: "Bueno, llegar ya es algo, ¿no?"
    after_phrase: "El mérito no lo mide ese reloj."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "Entre seis"
    body: "En el portal dicen que la mudanza de Manuela la organizó ella sola. Manuela lo corrige cada vez que sale el tema: «El mérito fue de los seis que subieron cajas; yo abrí la puerta y puse café». La versión corregida ya la cuenta hasta el portero."
    before_phrase: "Qué va, yo no hice casi nada."
    after_phrase: "El mérito fue de los seis que subieron cajas."
