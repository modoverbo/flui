  - position: 7
    sentence: "El taller empezó pidiendo {{blank}} dos formas de hacer la misma receta."
    hint_general: "Se ponen las dos formas juntas para ver en qué cambian."
    explanation: "Contrastar: poner las dos formas juntas. «Constatar» sería comprobar un hecho, y «fusionar» sería mezclarlas en una sola."
    options:
      - position: 1
        text: "constatar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Constatar» es comprobar que algo es cierto, y en el taller se miran dos maneras distintas a la vez."
        hint_specific: "«Constatar» trabaja con un hecho. ¿Cuántas formas hay en el taller?"
      - position: 2
        text: "contrastar"
        is_correct: true
      - position: 3
        text: "fusionar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Fusionar» sería mezclar las dos recetas en una, y la idea es ver en qué se diferencian."
