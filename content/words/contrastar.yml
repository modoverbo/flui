confusions:
  - confused_with: "constatar"
    difference: "«Constatar» es comprobar que algo es cierto; la otra palabra pone dos cosas una al lado de la otra para ver la diferencia."
    memory_trick: "Constatas un hecho; comparas dos."
  - confused_with: "contrarrestar"
    difference: "«Contrarrestar» es compensar un efecto con otro; la otra palabra solo compara, no compensa nada."
    memory_trick: "Contrarrestar equilibra; comparar mide."
exercises:
  - position: 1
    sentence: "Antes de aprobar la cifra, Beatriz pidió {{blank}} el presupuesto con el del año pasado."
    hint_general: "Pide poner las dos cifras juntas para ver la diferencia."
    explanation: "Contrastar: poner las dos cifras juntas para ver la diferencia. «Constatar» sería comprobar un solo hecho, e «igualar» borraría justo esa diferencia."
    options:
      - position: 1
        text: "constatar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Constatar» es comprobar que algo es cierto, y aquí hacen falta dos cifras, no una sola comprobación."
        hint_specific: "«Constatar» mira un dato. ¿Cuántos datos se ponen juntos?"
      - position: 2
        text: "contrastar"
        is_correct: true
      - position: 3
        text: "igualar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Igualar» sería dejar las dos cifras iguales, y lo que ella quiere es ver en qué se diferencian antes de aprobar."
        hint_specific: "«Igualar» borra la diferencia. ¿Beatriz quiere que coincidan o quiere ver el cambio?"
  - position: 2
    sentence: "Los dos vecinos daban versiones distintas del ruido, así que la administradora quiso {{blank}}las."
    hint_general: "Quiere poner las dos versiones una junto a otra."
    explanation: "Contrastarlas: poner las dos versiones juntas. «Constatarlas» sería dar por ciertas las dos, y «zanjarlas» sería cerrar el asunto sin mirar."
    options:
      - position: 1
        text: "contrastar"
        is_correct: true
      - position: 2
        text: "constatar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Constatar» es dar por comprobado que algo es cierto, y aquí las dos versiones no pueden serlo a la vez."
        hint_specific: "«Constatar» acepta el dato. ¿Se pueden aceptar dos versiones opuestas?"
      - position: 3
        text: "zanjar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Zanjar» sería cerrar el asunto sin mirar nada, y ella quiere ver primero en qué se diferencian."
        hint_specific: "«Zanjar» pone el punto final. ¿Qué quiere hacer antes la administradora?"
  - position: 3
    sentence: "Mi padre nunca compra un electrodoméstico sin {{blank}} al menos tres precios."
    hint_general: "Pone los precios juntos para ver las diferencias."
    explanation: "Contrastar: poner los precios juntos. «Constatar» sería comprobar un hecho, y «regatear» sería discutir el precio en la tienda."
    options:
      - position: 1
        text: "constatar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Constatar» es comprobar que algo es cierto, y aquí la gracia está en poner tres precios uno al lado del otro."
        hint_specific: "«Constatar» confirma un dato. ¿Cuántos precios mira tu padre?"
      - position: 2
        text: "regatear"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Regatear» es discutir el precio con el vendedor, y él compara antes de entrar en la tienda."
        hint_specific: "«Regatear» negocia en el mostrador. ¿Cuándo hace su trabajo tu padre?"
      - position: 3
        text: "contrastar"
        is_correct: true
  - position: 4
    sentence: "La periodista {{blank}} la cifra con dos fuentes distintas antes de publicar la noticia."
    hint_general: "Pone la cifra frente a otras dos para ver si coinciden."
    explanation: "Contrastó: puso la cifra frente a dos fuentes. «Constató» sería darla por buena sin más, y «contrarrestó» sería compensar un efecto."
    options:
      - position: 1
        text: "contrastó"
        is_correct: true
      - position: 2
        text: "constató"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Constatar» es dar por comprobado un dato, y ella todavía está buscando con qué compararlo."
        hint_specific: "«Constató» ya cierra el dato. ¿Qué hace antes de publicar?"
      - position: 3
        text: "contrarrestó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Contrarrestar» es compensar un efecto con otro, y aquí no se compensa nada: se comparan cifras."
        hint_specific: "«Contrarrestó» equilibra fuerzas. ¿Hay fuerzas o cifras en la frase?"
  - position: 5
    sentence: "Si {{blank}} lo que te cuentan con lo que ves, te llevas menos sorpresas."
    hint_general: "Poner las dos cosas juntas evita sorpresas."
    explanation: "Contrastas: pones lo que te cuentan junto a lo que ves. «Constatas» sería dar algo por cierto, y «tragas» es coloquial y suena a aceptarlo sin más."
    options:
      - position: 1
        text: "constatas"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Constatar» es dar algo por comprobado, y el consejo pide comparar dos versiones antes de eso."
        hint_specific: "«Constatas» cierra el asunto. ¿Qué se junta en este consejo?"
      - position: 2
        text: "contrastas"
        is_correct: true
      - position: 3
        text: "tragas"
        is_correct: false
        distractor_type: "register"
        why_not: "«Tragar» algo es coloquial y sugiere aceptarlo sin discutir, y el consejo propone justo lo opuesto."
        hint_specific: "«Tragas» acepta sin mirar. ¿Eso evita las sorpresas?"
  - position: 6
    sentence: "En la entrevista, Samuel pidió permiso para {{blank}} los datos del puesto con lo que había leído."
    hint_general: "Quiere poner lo que le cuentan junto a lo que leyó."
    explanation: "Contrastar: poner lo que le cuentan junto a lo leído. «Constatar» sería dar algo por cierto, y «desmentir» sería decir que es falso."
    options:
      - position: 1
        text: "contrastar"
        is_correct: true
      - position: 2
        text: "constatar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Constatar» es dar algo por comprobado, y él todavía quiere poner las dos versiones juntas."
        hint_specific: "«Constatar» da el asunto por cerrado. ¿En qué momento está Samuel?"
      - position: 3
        text: "desmentir"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Desmentir» es afirmar que algo es falso, y él solo quiere comparar dos informaciones con respeto."
