explanation: "Estar o suceder justo delante de otra cosa en el tiempo o en el orden."
example_sentence: "Una reunión corta debe preceder a cualquier envío de propuesta al cliente."
register: "neutral"
pedantry_risk: 2
usage_tip: "Sirve para ordenar pasos sin sonar mandón: dice qué va antes, no quién manda."
when_not_to_use: "No la uses para actuar o para venir de un sitio; eso es «proceder»."
collocations:
