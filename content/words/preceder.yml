    scene: "trabajo"
    conversation_type: "practica"
    title: "Antes del envío"
    body: "La propuesta se había enviado sin avisar y el cliente se molestó. Julia lo dejó por escrito para la próxima: «Una llamada de diez minutos debe preceder al envío». Desde entonces no ha vuelto a haber sorpresas."
    before_phrase: "Habría que llamar antes de mandarlo, digo yo."
    after_phrase: "Una llamada de diez minutos debe preceder al envío."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La noche antes"
    body: "La casa estaba ordenada y silenciosa. Patricia miró a su hermano y sonrió: «Esta calma precede al caos, ya lo sabes». A las siete de la mañana llegó el camión y no cupo ni la mitad de las cajas."
    before_phrase: "Disfruta ahora, que mañana es una locura."
    after_phrase: "Esta calma precede al caos."
  - position: 3
    scene: "entrevista"
    conversation_type: "practica"
    title: "Orden de llegada"
    body: "Dos personas esperaban en el pasillo sin saber quién entraba primero. Lucas rompió el silencio: «Tu nombre precede al mío en la lista, pasa tú». Ella entró tranquila y él aprovechó para repasar sus notas."
    before_phrase: "Creo que tú estás antes que yo, ¿no?"
    after_phrase: "Tu nombre precede al mío en la lista."
