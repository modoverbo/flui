schema_version: 1
slug: "afinidad"
status: "approved"
lemma: "afinidad"
part_of_speech: "sustantivo"
syllables:
  - "a"
  - "fi"
  - "ni"
  - "dad"
stressed_syllable: 4
ipa_latam: "[a.fi.niˈðad]"
ipa_es: "[a.fi.niˈðad]"
explanation: "Cuando dos personas coinciden en gustos o forma de ser y conectan sin esfuerzo."
example_sentence: "Hablamos veinte minutos de música y noté una afinidad rara con alguien que acababa de conocer."
register: "neutral"
pedantry_risk: 1
usage_tip: "Úsala cuando la conexión con alguien nace de gustos o forma de ser parecidos, no de simple cortesía."
when_not_to_use: "No la uses para el trato amable de cualquier desconocido: eso es cordialidad, no afinidad."
collocations:
  - "tener afinidad con alguien"
  - "una afinidad inmediata"
  - "sentir afinidad"
replaces:
  - before: "Nos caímos superbién desde el principio"
    after: "Hubo afinidad desde el principio"
  - before: "Tenemos muchas cosas en común"
    after: "Tenemos bastante afinidad"
family: []
themes:
