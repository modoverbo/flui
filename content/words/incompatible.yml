confusions:
  - confused_with: "incomparable"
    difference: "«Incomparable» es un elogio: significa que nada se le parece; la otra palabra dice que dos cosas no caben juntas."
    memory_trick: "Lo incomparable gana; lo otro choca."
  - confused_with: "incontable"
    difference: "«Incontable» es lo que no se puede contar por lo mucho que hay; la otra palabra no habla de cantidad."
    memory_trick: "Lo incontable se desborda; lo otro no encaja."
