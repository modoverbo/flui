    title: "La tarde de los jueves"
    body: "A Valentín le ofrecieron el turno de tarde con mejor horario de entrada. Hizo las cuentas y dijo que no: «Es incompatible con recoger a la niña los jueves». Su jefa le propuso los martes y aceptó. Nadie tuvo que hablar de ganas ni de esfuerzo."
    before_phrase: "Es que no me cuadra con lo de la niña."
    after_phrase: "Es incompatible con recogerla los jueves."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "Dos citas el jueves"
    body: "Ofelia había dicho que sí a dos cosas el mismo jueves a las siete. Al darse cuenta escribió a las dos personas la misma frase: «Son incompatibles, y prefiero avisar hoy». Movió una al viernes y llegó descansada a las dos."
    before_phrase: "Uf, me he liado con las horas, qué desastre."
    after_phrase: "Las dos son incompatibles; muevo una."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "Mayo no puede ser"
    body: "Federico vio el calendario del viaje y el de la mudanza y coincidían de lleno. Lo dijo el primer día, no la víspera: «Mayo me sale incompatible; junio entero lo tengo libre». El equipo movió el viaje a junio y nadie perdió un billete."
    before_phrase: "A ver si puedo, aunque lo tengo complicado."
    after_phrase: "Mayo me sale incompatible; junio lo tengo libre."
