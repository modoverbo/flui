schema_version: 1
slug: "prescindir"
status: "draft"
lemma: "prescindir"
part_of_speech: "verbo"
syllables: ["pres", "cin", "dir"]
stressed_syllable: 3
ipa_latam: "[pɾe.sinˈdiɾ]"
ipa_es: "[pɾes.θinˈdiɾ]"
explanation: "Dejar algo fuera a propósito porque no hace falta, y seguir adelante sin ello."
example_sentence: "Cuando el texto pasó de dos páginas, decidí prescindir de la introducción entera."
register: "neutral"
pedantry_risk: 2
usage_tip: "Deja claro que la decisión es tuya y está pensada: no se te olvidó, lo dejaste fuera."
when_not_to_use: "No la uses para algo que sí hace falta y estás quitando por prisa: eso no es elegir, es recortar."
collocations:
  - "prescindir de los rodeos"
  - "prescindir de un dato"
  - "prescindir de la introducción"
replaces:
  - before: "Quita todo lo que sobre"
    after: "Prescinde de lo que sobra"
  - before: "Se puede hacer igual sin esa parte"
    after: "Se puede prescindir de esa parte"
  - before: "No hace falta que pongas eso"
    after: "Puedes prescindir de eso"
family: ["prescindible"]
themes:
