    body: "Cuando Vidal vio a su padre intentar hacer la receta de su abuela sin encontrar la parte correcta en la libreta vieja, sintió una ternura que no esperaba. Se sentó a su lado y le ayudó a descifrarla, sin decir nada más."
    before_phrase: "Me dio no sé qué verlo así, con la libreta."
    after_phrase: "Sentí una ternura que no esperaba."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El compañero nuevo"
    body: "En su primer día, el compañero nuevo no encontraba la impresora y preguntó tres veces sin atreverse a levantar la voz. A Casilda le dio tanta ternura verlo tan perdido que lo acompañó personalmente a cada rincón de la oficina."
    before_phrase: "Me dio no sé qué verlo tan perdido."
    after_phrase: "Me dio tanta ternura verlo tan perdido que lo ayudé."
