    sentence: "Lo primero que Sebastián notó de su cita no fue el restaurante que eligió, sino su {{blank}} al hablarle al mesero nuevo, que se puso nervioso y confundió el pedido: ella lo tranquilizó como si fuera un hermano pequeño."
