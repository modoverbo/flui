    body: "En medio de la primera cita, a Rita se le aguaron los ojos viendo un video que le mandó su hermana. «Perdón, me da mucha ternura cualquier cosa con animales», le dijo a su acompañante entre risas. Él solo sonrió: «No te disculpes, me parece lo más lindo que he visto en esta cita»."
