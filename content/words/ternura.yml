  - position: 2
    sentence: "Cuando su abuelo repitió la misma historia por quinta vez, Teodoro no puso los ojos en blanco: sintió tanta {{blank}} que le pidió que la contara otra vez."
    hint_general: "Es lo que sientes ante algo entrañable, no ante algo que da pena."
    explanation: "Ternura: la hizo pedirle que la contara otra vez. «Blandura» describe falta de firmeza en el carácter, no un sentimiento hacia otra persona; «lástima» es pena por el sufrimiento de alguien, y aquí no hay ningún sufrimiento, solo cariño."
