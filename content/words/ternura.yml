    sentence: "El camarero nuevo temblaba de nervios en su primer turno, y la forma en que Ariadna lo guiaba, como si fuera un hermano menor asustado, mostró tal {{blank}} que él se lo agradeció al final de la noche."
    hint_general: "Piensa en un cuidado protector hacia alguien nervioso, tratado casi como a un hermano menor."
    explanation: "Ternura: el cuidado protector hacia alguien que en ese momento parece frágil, como un hermano menor asustado. «Calidez» describe un trato general con cualquiera, sin ese matiz protector; «afecto» es una palabra más genérica y fría, y no nombra ese instinto de proteger a alguien vulnerable."
