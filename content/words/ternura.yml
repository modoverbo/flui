confusions:
  - confused_with: "lástima"
    difference: "«Lástima» es pena por el sufrimiento de alguien; la ternura es cariño por lo pequeño o lo entrañable, no por su dolor."
    memory_trick: "La lástima compadece; la ternura enternece."
  - confused_with: "terquedad"
    difference: "«Terquedad» es no ceder aunque haya razones para hacerlo; no tiene nada que ver con la dulzura de la ternura."
exercises:
  - position: 1
    sentence: "Al ver a su sobrino recién dormido, a Nadia le dio tal {{blank}} que se quedó media hora mirándolo sin hacer ruido."
    hint_general: "Piensa en lo que provoca ver a alguien pequeño y vulnerable, algo que te deja quieto mirándolo."
    explanation: "Ternura: lo que provoca ver a alguien pequeño y vulnerable. «Terquedad» es no ceder aunque haya razones, y aquí nadie discute nada; «cariño» es más general, y aquí lo que la detuvo fue justamente verlo dormido y desprotegido."
