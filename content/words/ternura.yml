    sentence: "Cuando la vio reírse como una niña pequeña al recibir la merienda de su infancia, a Osvaldo le dio {{blank}} y sintió ganas de cuidarla el resto de la noche."
    hint_general: "Piensa en un cuidado protector hacia alguien que en ese momento parece más pequeño o vulnerable."
    explanation: "Ternura: una emoción protectora hacia alguien que en ese momento parece más pequeño o vulnerable. «Dulzura» describe el carácter de una persona en general, y no explica las ganas de cuidarla; «mimo» es un gesto de cariño que se le hace a otra persona, no un sentimiento con ganas de proteger."
