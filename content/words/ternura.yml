        why_not: "«Lástima» es pena por el sufrimiento de alguien, y aquí no hay ningún sufrimiento: solo una historia que le encanta escuchar de nuevo."
        hint_specific: "La lástima nace del sufrimiento. ¿Qué sufrimiento hay en esa historia repetida?"
