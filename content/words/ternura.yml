    sentence: "«¿Por qué se te aguaron los ojos con ese video de perritos?», le preguntó su amigo a Candela. «No sé, me dio {{blank}}», respondió ella, todavía sonriendo."
    hint_general: "Busca la palabra para una reacción cálida y genuina ante algo entrañable."
    explanation: "Ternura: una reacción genuina y cálida ante algo entrañable. «Sensiblería» acusa de una emoción falsa o exagerada, y aquí ella sonríe de verdad; «compasión» es pena por el sufrimiento de alguien, y unos perritos en un video no sufren nada."
