    scene: "trabajo"
    conversation_type: "practica"
    title: "El almuerzo de disculpa"
    body: "Antonia llegó tarde por segunda vez en la semana. En vez de justificarse otra vez, propuso algo distinto: «Te invito el almuerzo como compensación, en serio». Su socia se rio: «No hace falta, pero acepto». La reunión empezó tarde, pero terminó en buenos términos."
    before_phrase: "Perdón por llegar tarde otra vez, no sé qué decir."
    after_phrase: "Te invito el almuerzo como compensación."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "El viaje que no fue"
    body: "Julieta había cancelado el viaje familiar por trabajo, y todavía se sentía mal. Semanas después, apareció con los boletos de una escapada de fin de semana: «Esto es mi compensación por lo del viaje», les dijo a sus padres. Su madre solo atinó a abrazarla."
    before_phrase: "Perdón por lo del viaje, sé que se hacían ilusión."
    after_phrase: "Esto es mi compensación por lo del viaje."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "El jarrón de la vecina"
    body: "El balón entró por la ventana y el jarrón terminó en el suelo. Álvaro tocó la puerta de inmediato: «Fue mi culpa, y quiero darte una compensación: te compro uno igual esta misma semana». Su vecina se sorprendió: pocas veces alguien reaccionaba tan rápido."
    before_phrase: "Perdón por el jarrón, fue sin querer, de verdad."
    after_phrase: "Quiero darte una compensación: te compro uno igual."
