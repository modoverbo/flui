schema_version: 1
sort_order: 9005
slug: "compensacion"
status: "draft"
lemma: "compensación"
part_of_speech: "sustantivo"
syllables: ["com", "pen", "sa", "ción"]
stressed_syllable: 4
ipa_latam: "[kom.pen.saˈsjon]"
ipa_es: "[kom.pen.saˈθjon]"
explanation: "Algo que le das a alguien para reparar un error que lo afectó."
example_sentence: "Le ofreció una compensación por las horas perdidas durante la mudanza que él mismo había retrasado."
register: "neutral"
pedantry_risk: 1
usage_tip: "Sirve cuando alguien te ofrece algo, un gesto o una acción, para equilibrar un daño o una molestia que causó."
when_not_to_use: "No la uses para un simple regalo sin motivo, ni para un pago que no tiene relación con ningún error previo."
collocations:
  - "ofrecer una compensación"
  - "una compensación justa"
  - "pedir una compensación"
replaces:
  - before: "Le di algo para que se le pasara el enojo por lo que hice"
    after: "Le ofrecí una compensación por lo que hice"
  - before: "Como llegamos tarde, les invitamos el postre"
    after: "Como llegamos tarde, les dimos una compensación con el postre"
  - before: "Le devolví el favor porque la había dejado esperando"
    after: "Le di una compensación porque la había dejado esperando"
family:
  - "compensar"
  - "compensatorio"
themes:
