    title: "Tres meses"
    body: "Llevaba tres meses durmiendo con un ojo abierto y decía que estaba bien. Una noche lo dijo de otra manera: «No necesito consejos: necesito relevo los sábados». Su hermano apareció el sábado siguiente con la bolsa hecha."
    before_phrase: "Estoy que no puedo más, de verdad."
    after_phrase: "No necesito consejos: necesito relevo."
  - position: 2
    scene: "trabajo"
    conversation_type: "practica"
    title: "La hoja de la nevera"
    body: "En el turno de noche nadie sabía cuándo entraba el siguiente y siempre había media hora de nadie. Pusieron una hoja con nombres y horas exactas. «El relevo escrito vale más que diez avisos», dijo el encargado. Se acabaron las medias horas."
    before_phrase: "Habría que organizarse mejor con los cambios."
    after_phrase: "El relevo escrito vale más que diez avisos."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "Los sábados del grupo"
    body: "El grupo del barrio acompañaba a una vecina por las tardes y siempre iban los mismos dos. Alguien propuso repartirlo: seis personas, un sábado cada una. «Con relevo aguantamos un año; sin relevo, un mes», dijo. Llevan dos años."
    before_phrase: "Es que al final siempre vamos los mismos."
    after_phrase: "Con relevo aguantamos un año."
