    title: "La masa de mi abuela"
    body: "Mi abuela corrige la masa con las manos. No mide nada, no mira el reloj: toca, aprieta y decide si le falta agua. Ese dominio no se lo enseñó nadie por escrito, y ella insiste en que no tiene mérito, que son cincuenta años haciendo pan."
    before_phrase: "Ella sabe de eso como nadie."
    after_phrase: "Tiene un dominio de la masa que no se aprende en un libro."
