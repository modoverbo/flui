    body: "Cuando algo se rompe en el sistema, todo el mundo escribe a Julio. No porque sea el jefe, sino porque tiene un dominio del programa que no tiene nadie más: mira dos pantallas y sabe dónde está el fallo. Lo que le cuesta es explicarlo, y en eso lleva un año trabajando."
