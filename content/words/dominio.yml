    body: "Iván no dijo que conocía el sector: lo demostró con tres datos que no salían en ningún informe público. La entrevistadora cerró el cuaderno y se puso a preguntar de verdad. «Ese dominio del sector es lo que buscábamos», le dijo al final."
    before_phrase: "Yo del sector sé bastante, la verdad."
    after_phrase: "Le enseño mi dominio del sector con tres datos."
