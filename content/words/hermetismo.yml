confusions:
  - confused_with: "discreción"
    difference: "«Discreción» es cuidar qué detalles se comparten, dando algo pero sin exponer lo delicado; el hermetismo es no dar ninguna información en absoluto."
    memory_trick: "La discreción mide las palabras; el hermetismo las corta todas."
  - confused_with: "mutismo"
    difference: "«Mutismo» es no hablar en general, a veces por costumbre o timidez; el hermetismo es la decisión de no dar información sobre un asunto concreto, pese a que insistan."
    memory_trick: "El mutismo calla siempre; el hermetismo calla sobre un tema."
