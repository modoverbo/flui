    scene: "trabajo"
    conversation_type: "practica"
    title: "La fecha del correo"
    body: "En la mesa redonda alguien dijo que nadie había avisado del cambio. Casilda esperó a que terminara la frase, abrió el teléfono y leyó la fecha del correo de marzo. «Replico con esto y no con mi memoria», dijo. Nadie volvió sobre el asunto."
    before_phrase: "Le contesté ahí mismo, con la fecha."
    after_phrase: "Replico con esto y no con mi memoria."
  - position: 2
    scene: "entrevista"
    conversation_type: "practica"
    title: "Un minuto"
    body: "En aquel programa había una regla: quien recibía una crítica tenía un minuto para replicar sin interrupciones. Ximena la usó entera y con dos datos. Al salir, el periodista reconoció que era la mejor regla del formato."
    before_phrase: "Déjame contestar a eso."
    after_phrase: "Tengo un minuto para replicar."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "La mesa de los domingos"
    body: "Mi hermano replica a todo lo que dice mi padre, incluso cuando piensa igual. Un domingo se lo dije sin reproche: «No es que discrepes; es que replicas siempre». Se quedó pensando y esa comida acabó tranquila."
    before_phrase: "Siempre tienes que contestar a todo."
    after_phrase: "No discrepas: replicas siempre."
