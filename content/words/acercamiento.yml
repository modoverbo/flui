explanation: "Primer paso que alguien da para tratar con otro tras un tiempo de distancia."
example_sentence: "Aquel café fue el primer acercamiento después de dos años sin hablarnos."
register: "neutral"
pedantry_risk: 2
usage_tip: "Nombrar el primer paso como tal lo hace más fácil: no pides una reconciliación, propones un café."
when_not_to_use: "No la uses para un saludo cualquiera ni para el final del conflicto; esto es el primer movimiento."
collocations:
  - "un primer acercamiento"
