confusions:
  - confused_with: "recibimiento"
    difference: "El recibimiento es cómo tratan a quien llega; el otro es el paso que da quien quiere entrar en contacto."
    memory_trick: "El recibimiento lo da el anfitrión; el acercamiento, el que viene."
  - confused_with: "reconciliación"
    difference: "La reconciliación es el final del conflicto; esta palabra nombra apenas el primer movimiento."
    memory_trick: "El acercamiento abre; la reconciliación cierra."
exercises:
  - position: 1
    sentence: "Después de dos años sin hablarse, aquel café fue el primer {{blank}} entre los dos socios."
    hint_general: "Fue el primer paso para volver a tratarse."
    explanation: "Acercamiento: el primer paso para volver a tratarse. «Recibimiento» sería cómo trata el anfitrión a quien llega, y «reconciliación» daría el conflicto por cerrado."
    options:
      - position: 1
        text: "recibimiento"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Recibimiento» es cómo trata el anfitrión a quien llega, y aquí ninguno de los dos recibe al otro en su casa."
        hint_specific: "«Recibimiento» lo hace quien espera en la puerta. ¿Alguien espera en una puerta?"
      - position: 2
        text: "acercamiento"
        is_correct: true
      - position: 3
        text: "reconciliación"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Reconciliación» daría el asunto por resuelto, y esto es apenas un café después de dos años."
        hint_specific: "«Reconciliación» cierra el conflicto. ¿Un café lo cierra o lo abre?"
  - position: 2
    sentence: "La empresa mandó un correo corto a la asociación de vecinos: un {{blank}} tras meses de cartas de abogados."
    hint_general: "Un mensaje breve que abre la puerta después de mucha tensión."
    explanation: "Acercamiento: abre la puerta después de la tensión. «Aproximación» suena a cálculo con margen de error, y «gesto» no diría que busca contacto."
    options:
      - position: 1
        text: "aproximación"
        is_correct: false
        distractor_type: "register"
        why_not: "«Aproximación» es palabra de informes técnicos y nombra un cálculo con margen de error, no un movimiento entre personas."
        hint_specific: "«Aproximación» suena a cifra aproximada de informe. ¿Se calcula algo o se busca contacto?"
      - position: 2
        text: "acercamiento"
        is_correct: true
      - position: 3
        text: "gesto"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Gesto» puede ser una cortesía sin intención de seguir, y este correo busca abrir trato."
        hint_specific: "«Gesto» puede quedarse en detalle amable. ¿Para qué manda la empresa ese correo?"
  - position: 3
    sentence: "Ximena invitó a la nueva compañera a comer el segundo día: un {{blank}} sencillo que le ahorró un mes de soledad."
    hint_general: "Un primer paso para que alguien deje de estar fuera del grupo."
    explanation: "Acercamiento: un primer paso hacia alguien nuevo. «Recibimiento» sería el trato oficial al llegar, y «saludo» no implicaría querer seguir tratándose."
    options:
      - position: 1
        text: "acercamiento"
        is_correct: true
      - position: 2
        text: "recibimiento"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Recibimiento» es el trato del primer día, cuando alguien llega, y esto pasó después y por iniciativa de otra persona."
        hint_specific: "«Recibimiento» ocurre al llegar y lo organiza la casa. ¿Quién tomó aquí la iniciativa?"
      - position: 3
        text: "saludo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Saludo» se agota en el momento, y una invitación a comer abre la puerta a seguir tratándose."
        hint_specific: "«Saludo» empieza y termina ahí. ¿Qué abre una invitación a comer?"
  - position: 4
    sentence: "Tras la discusión del domingo, mi hermano hizo un {{blank}} raro: apareció con la escalera que le había pedido en marzo."
    hint_general: "Un primer movimiento para volver a tratarse, sin decirlo."
    explanation: "Acercamiento: un primer movimiento sin decirlo. «Tanteo» sugiere probar terreno con cautela calculada, y «perdón» daría por hecho que pidió disculpas."
    options:
      - position: 1
        text: "tanteo"
        is_correct: false
        distractor_type: "register"
        why_not: "«Tanteo» es de conversación suelta y sugiere probar el terreno con cálculo, y traer la escalera es un gesto directo."
        hint_specific: "«Tanteo» suena a medir el terreno con cautela. ¿Hay cálculo o hay una escalera en la puerta?"
      - position: 2
        text: "acercamiento"
        is_correct: true
      - position: 3
        text: "perdón"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Perdón» supone que dijo que lo sentía, y la frase cuenta que no dijo nada: trajo la escalera."
        hint_specific: "«Perdón» se pronuncia. ¿Tu hermano dijo algo o trajo algo?"
  - position: 5
    sentence: "En la feria, Leandro prefiere un {{blank}} por persona y no repartir cien tarjetas en una tarde."
    hint_general: "Prefiere dar pocos primeros pasos y hacerlos bien."
    explanation: "Acercamiento: un primer paso cuidado por persona. «Ofrecimiento» pondría algo sobre la mesa desde el principio, y «encuentro» ocurriría sin que nadie lo buscara."
    options:
      - position: 1
        text: "ofrecimiento"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Ofrecimiento» supone poner algo concreto sobre la mesa, y él todavía está empezando a tratar con esa persona."
        hint_specific: "«Ofrecimiento» ya propone algo. ¿Leandro propone un trato o abre una puerta?"
      - position: 2
        text: "acercamiento"
        is_correct: true
      - position: 3
        text: "encuentro"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Encuentro» puede ocurrir por casualidad, y aquí él decide a quién dedicarle el rato."
        hint_specific: "«Encuentro» puede ser casual. ¿Lo de Leandro es casualidad o decisión?"
  - position: 6
    sentence: "El museo y la escuela del barrio empezaron con un {{blank}} pequeño: prestarse dos salas los sábados."
    hint_general: "Empezaron por un primer paso pequeño antes de nada grande."
    explanation: "Acercamiento: un primer paso pequeño entre dos partes. «Aproximación» es palabra de informe técnico, y «acuerdo» supondría algo ya cerrado."
    options:
      - position: 1
        text: "acuerdo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Acuerdo» supone algo ya cerrado y firmado, y prestarse dos salas es el comienzo de todo."
        hint_specific: "«Acuerdo» viene después. ¿Esto es el final o el principio?"
      - position: 2
        text: "acercamiento"
        is_correct: true
      - position: 3
        text: "aproximación"
        is_correct: false
        distractor_type: "register"
        why_not: "«Aproximación» pertenece a los informes técnicos y nombra un cálculo con margen, no un primer paso entre dos instituciones."
        hint_specific: "«Aproximación» habla de cifras con margen. ¿Aquí se calcula algo?"
  - position: 7
    sentence: "Hubo un {{blank}} entre las dos familias en el bautizo, aunque nadie mencionó lo del terreno."
    hint_general: "Volvieron a tratarse sin tocar el asunto que las separó."
    explanation: "Acercamiento: volvieron a tratarse sin tocar el tema. «Recibimiento» sería cómo acoge el anfitrión, y «reconciliación» exigiría hablar de lo del terreno."
    options:
      - position: 1
        text: "reconciliación"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Reconciliación» pediría hablar del terreno y cerrarlo, y la frase dice que nadie lo mencionó."
        hint_specific: "«Reconciliación» resuelve el asunto. ¿Se habló del terreno?"
      - position: 2
        text: "acercamiento"
        is_correct: true
      - position: 3
        text: "recibimiento"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Recibimiento» es cómo acoge quien organiza, y aquí las dos familias son invitadas del mismo bautizo."
        hint_specific: "«Recibimiento» lo da la casa. ¿Alguna de las dos familias organiza el bautizo?"
  - position: 8
    sentence: "Zoe respondió al {{blank}} del cliente con una llamada el mismo día, y así empezó todo."
    hint_general: "El cliente dio el primer paso y ella contestó rápido."
    explanation: "Acercamiento: el primer paso que dio el cliente. «Ofrecimiento» supondría que ya proponía un trato, y «tanteo» daría a entender un cálculo cauteloso."
    options:
      - position: 1
        text: "tanteo"
        is_correct: false
        distractor_type: "register"
        why_not: "«Tanteo» es de charla informal y sugiere medir el terreno con cálculo, y aquí el cliente se acerca de frente."
        hint_specific: "«Tanteo» suena a probar con disimulo. ¿El cliente disimula o da la cara?"
      - position: 2
        text: "ofrecimiento"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Ofrecimiento» supone que el cliente ya ponía algo concreto sobre la mesa, y la frase dice que ahí empezó todo."
        hint_specific: "«Ofrecimiento» propone algo ya. ¿Esto es el principio o una propuesta cerrada?"
      - position: 3
        text: "acercamiento"
        is_correct: true
readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Un correo corto"
    body: "Después de meses de cartas de abogados, la empresa mandó cuatro líneas a la asociación de vecinos. Zoe lo leyó dos veces y entendió qué era: «Esto es un acercamiento; contestemos hoy». La reunión fue el jueves."
    before_phrase: "Parece que quieren hablar, ¿no?"
    after_phrase: "Esto es un acercamiento: contestemos hoy."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La escalera"
    body: "Mi hermano y yo llevábamos tres semanas sin hablarnos. El sábado apareció con la escalera que le había pedido en marzo y la dejó en el patio. No dijo nada y no hizo falta: los dos sabíamos que aquello era un acercamiento."
    before_phrase: "Creo que quiere arreglarlo."
    after_phrase: "Aquello era un acercamiento."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "Cien tarjetas"
    body: "En la feria, Leandro se quedó toda la tarde en la misma mesa. «Prefiero tres acercamientos buenos que cien tarjetas», me dijo al salir. Dos de esos tres le escribieron el lunes."
    before_phrase: "Hay que hablar con toda la gente posible."
    after_phrase: "Prefiero tres acercamientos buenos."
