ipa_latam: "[kon.siˈljaɾ]"
ipa_es: "[kon.θiˈljaɾ]"
explanation: "Acercar dos posturas contrarias hasta encontrar un punto donde caben las dos."
example_sentence: "El acuerdo concilió el plazo del cliente y las horas del equipo, y nadie salió perdiendo."
register: "neutral"
pedantry_risk: 1
usage_tip: "Sirve cuando las dos partes tienen razón en algo: en vez de elegir bando, buscas dónde caben las dos."
when_not_to_use: "No la uses cuando una parte solo quiere imponerse: entonces no hay dos posturas, hay una y un empujón."
collocations:
  - "conciliar posturas"
  - "conciliar dos intereses"
  - "conciliar horarios"
replaces:
  - before: "A ver si los ponemos de acuerdo"
    after: "A ver si conciliamos las dos posturas"
  - before: "Hay que buscar un punto medio entre los dos"
    after: "Hay que conciliar los dos intereses"
  - before: "Intenté que se entendieran"
    after: "Intenté conciliar a las dos partes"
family: ["conciliación"]
themes:
  - slug: "conflicto-desacuerdo"
