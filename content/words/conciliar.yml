readings:
  - position: 1
    scene: "familia"
    conversation_type: "practica"
    title: "El turno de noche"
    body: "Amaia pidió cambiar el turno tres veces y le dijeron que no otras tres. A la cuarta lo planteó distinto: «No pido un favor: pido conciliar el turno con el colegio, y tengo una propuesta». Llevaba un cuadro hecho. Se lo aprobaron en dos semanas."
    before_phrase: "Necesito que me cambien el turno, por favor."
    after_phrase: "Pido conciliar el turno con el colegio."
  - position: 2
    scene: "trabajo"
    conversation_type: "practica"
    title: "Los lunes cerrados"
    body: "Fabián probó horarios durante un año: abrir antes, cerrar después, contratar los sábados. Al final cerró los lunes y todo encajó. «No he renunciado a nada: lo he conciliado», contó en la reunión de comerciantes. Dos tiendas de la calle copiaron la idea."
    before_phrase: "Al final he tenido que dejar algo de lado."
    after_phrase: "No he renunciado a nada: lo he conciliado."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "La plaza a las once"
    body: "Los vecinos querían dormir y los bares querían abrir. La reunión empezó a gritos y terminó con una hoja: terrazas hasta las once y refuerzo de limpieza. «Se puede conciliar», dijo alguien al salir, y nadie se rio del verbo."
    before_phrase: "O ellos o nosotros, aquí no cabemos todos."
    after_phrase: "Se puede conciliar; hay que sentarse."
