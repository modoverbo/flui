        distractor_type: "paronym"
        why_not: "«Agraviar» es ofender a alguien, y en el coche nadie queda ofendido: se cuenta un cuento más corto."
        hint_specific: "Agraviar deja a alguien dolido. ¿Quién se ofende en ese trayecto?"
