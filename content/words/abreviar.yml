  - position: 4
    sentence: "Si te quedan tres minutos y seis puntos, {{blank}} y quédate con los dos que importan."
    hint_general: "Con poco tiempo, corta y ve a lo que cuenta."
    explanation: "Abrevia: corta el tiempo y ve a lo que cuenta. «Agravia» sería ofender a alguien, y «calla» sería no decir nada, cuando aquí sí se habla."
    options:
      - position: 1
        text: "abrevia"
        is_correct: true
      - position: 2
        text: "agravia"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Agraviar» es ofender a alguien, y el consejo no te pide ofender a nadie: te pide ganar minutos."
        hint_specific: "Agraviar deja a alguien dolido. ¿A quién ofendería este consejo?"
      - position: 3
