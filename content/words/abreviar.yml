confusions:
  - confused_with: "abrevar"
    difference: "«Abrevar» es dar de beber al ganado en un río o en un pilón; la otra palabra no tiene nada que ver con animales ni con agua."
    memory_trick: "Se abreva a las vacas; lo otro se le hace al reloj."
  - confused_with: "resumir"
    difference: "«Resumir» es quedarse con lo esencial de algo ya dicho; la otra palabra solo recorta el tiempo, aunque cuentes lo mismo."
    memory_trick: "El resumen elige; lo otro corre."
exercises:
