readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "El último bloque"
    body: "Herminia miró la sala a las dos horas: dos personas con el móvil y una mirando la puerta. «Voy a abreviar el último bloque», dijo. Contó tres cosas en cuatro minutos y terminó antes de la hora. Nadie se quejó de lo que faltó."
    before_phrase: "Ya voy acabando, que se nos ha hecho tarde."
    after_phrase: "Voy a abreviar el último bloque."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Veinte minutos de trayecto"
    body: "Ezequiel lleva a sus sobrinas al pueblo y el cuento del lobo dura cuarenta minutos. Cuando el viaje es corto, lo abrevia y lo deja justo en la mejor parte. Ellas protestan, pero después preguntan por él durante toda la semana."
    before_phrase: "Te lo cuento rapidito, que ya llegamos."
    after_phrase: "Te lo abrevio y lo dejamos en lo bueno."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "El andén"
    body: "Lucio estuvo media hora despidiéndose de su amiga en la puerta del bar, hasta que ella miró el panel: diez minutos para el tren. «Abreviamos», dijo él, y le dio un abrazo corto. Siguieron la conversación por audios hasta la parada siguiente."
    before_phrase: "Venga, que lo dejamos aquí, que no llegas."
    after_phrase: "Abreviamos, que no llegas."
