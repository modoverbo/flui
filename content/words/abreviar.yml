    sentence: "Vio que la sala llevaba dos horas sentada y decidió {{blank}} el último bloque."
    hint_general: "Recortó el tiempo del final al ver a la gente cansada."
    explanation: "Abreviar: recortar el tiempo del final. «Abrevar» es dar de beber al ganado, y «compendiar» es palabra culta de manuales antiguos."
