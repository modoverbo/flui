        is_correct: false
        distractor_type: "paronym"
        why_not: "«Abrevar» es dar de beber al ganado en un pilón, y en una sala con gente sentada no hay ganado ninguno."
        hint_specific: "Abrevar pide un río y animales. ¿Dónde ocurre esta escena?"
      - position: 2
        text: "abreviar"
        is_correct: true
      - position: 3
        text: "compendiar"
        is_correct: false
        distractor_type: "register"
        why_not: "«Compendiar» es palabra culta de manuales antiguos y significa reunir una materia entera en un tomo, no ganar minutos."
        hint_specific: "«Compendiar» huele a tomo grueso de biblioteca. ¿Qué gana quien habla aquí?"
  - position: 2
    sentence: "Cuando Rita cuenta un viaje siempre {{blank}}, porque dice que los detalles se los queda ella."
    hint_general: "Cuenta la versión corta y se guarda lo demás."
    explanation: "Abrevia: cuenta la versión corta a propósito. «Alivia» sería quitar dolor o peso, y «resume» sería quedarse con lo esencial, cuando ella se guarda cosas."
    options:
      - position: 1
        text: "abrevia"
        is_correct: true
      - position: 2
        text: "alivia"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Aliviar» es quitar dolor o peso a alguien, y aquí lo único que se reduce es la longitud del relato."
        hint_specific: "Aliviar necesita a alguien que lo pase mal. ¿Quién sufre en esta escena?"
      - position: 3
        text: "resume"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Resumir» es quedarse con lo esencial, y ella no elige lo esencial: se guarda los detalles para sí misma."
        hint_specific: "Quien resume entrega lo importante. ¿Qué hace Rita con los detalles?"
  - position: 3
    sentence: "El notario tenía otras dos citas y pidió {{blank}} la lectura sin saltarse ninguna cláusula."
    hint_general: "Pidió ganar tiempo sin dejarse nada fuera."
    explanation: "Abreviar: ganar tiempo sin dejarse nada. «Abrevar» es dar de beber al ganado, y «despachar» es coloquial y sugiere quitarse el asunto de encima."
    options:
      - position: 1
        text: "despachar"
        is_correct: false
        distractor_type: "register"
        why_not: "«Despachar» es coloquial aquí y sugiere quitarse el asunto de encima de cualquier manera, y él exige que no falte ni una cláusula."
        hint_specific: "Despachar algo es soltarlo con prisa y sin cuidado. ¿Qué exige el notario que se respete?"
