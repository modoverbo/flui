        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Callar» sería no decir nada, y el consejo pide seguir hablando de los dos puntos que importan."
        hint_specific: "Quien calla no dice nada. ¿El consejo te manda hablar o guardar silencio?"
  - position: 5
    sentence: "Herminia {{blank}} las presentaciones de su equipo y por fin la reunión terminó a la hora."
    hint_general: "Recortó el tiempo de cada turno y la reunión cuadró."
    explanation: "Abrevió: recortó el tiempo de cada turno. «Abrevó» es dar de beber al ganado, y «aceleró» sería correr al hablar, no dar menos minutos."
    options:
