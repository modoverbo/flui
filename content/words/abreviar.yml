    hint_general: "Prefiere la versión larga a una versión corta que deje huecos."
    explanation: "Abrevien: den la versión corta. «Abreven» es dar de beber al ganado, y «se salten» sería quitar partes, y aquí ya se dice que quedan huecos."
    options:
      - position: 1
        text: "abreven"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Abrevar» es dar de beber al ganado, y lo que se cuenta o se deja de contar aquí es un plan."
        hint_specific: "Abrevar pide animales sedientos. ¿Qué es lo que se cuenta en la frase?"
      - position: 2
        text: "abrevien"
        is_correct: true
      - position: 3
        text: "se salten"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Saltarse» partes es quitar contenido, y la frase ya menciona aparte el efecto de quedarse a medias."
        hint_specific: "Saltarse algo deja un agujero concreto. ¿Qué se compara aquí con el plan entero?"
  - position: 8
    sentence: "Nos quedaban veinte minutos de trayecto, así que Ezequiel {{blank}} el cuento y lo dejó en la mejor parte."
