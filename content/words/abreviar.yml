      - position: 2
        text: "abrevió"
        is_correct: true
      - position: 3
        text: "aceleró"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Acelerar» sería hablar más deprisa en el mismo tiempo, y lo que ella hace es dar menos minutos a cada turno."
        hint_specific: "Acelerar cambia la velocidad, no el reparto. ¿Qué cambió en esa reunión?"
  - position: 6
    sentence: "Al ver que el tren salía en diez minutos, Lucio {{blank}} la despedida y echó a correr."
    hint_general: "Cortó el momento del adiós porque no llegaba."
    explanation: "Abrevió: cortó el adiós por falta de tiempo. «Alivió» sería quitar un dolor, y «resumió» sería contar lo esencial de algo ya dicho."
    options:
      - position: 1
        text: "abrevió"
        is_correct: true
      - position: 2
        text: "alivió"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Aliviar» es quitar un dolor o un peso, y en la escena lo único que falta es tiempo."
        hint_specific: "Aliviar quita una carga. ¿Qué le falta a Lucio en el andén?"
      - position: 3
        text: "resumió"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Resumir» es contar lo esencial de algo ya dicho, y una despedida no se resume: se acorta o no se acorta."
        hint_specific: "Un resumen recoge contenido. ¿Qué es lo que se recorta en el andén?"
