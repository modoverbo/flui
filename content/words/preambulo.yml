readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Siete minutos de contexto"
    body: "Nieves tenía diez minutos y usó siete en contar de dónde venía la idea. Cuando llegó la propuesta, el comité ya miraba el reloj. Su jefa se lo dijo bien: «La idea es buena; el preámbulo se la comió». A la semana siguiente empezó por la propuesta."
    before_phrase: "Antes de nada, te pongo un poco en contexto."
    after_phrase: "Voy sin preámbulo: esta es la propuesta."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Primero el tiempo"
    body: "Mi tía llama y habla del calor, del vecino y de la feria. A los diez minutos aparece lo de verdad: le duele que nadie la visite. Ahora se lo digo cariñosamente: «Tía, sáltate el preámbulo, que te escucho igual». Se ríe y va directa."
    before_phrase: "Cuéntame, pero ve al grano, anda."
    after_phrase: "Sáltate el preámbulo, que te escucho igual."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "El favor de Tadeo"
    body: "Tadeo necesitaba que alguien le guardara las llaves el fin de semana. Entró, dejó la carpeta y lo soltó: «Sin preámbulos: ¿me guardas unas llaves hasta el lunes?». Su amiga dijo que sí antes de quitarse el abrigo."
    before_phrase: "Perdona, es que no sé cómo decirte esto."
    after_phrase: "Sin preámbulos: ¿me haces un favor?"
