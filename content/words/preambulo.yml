confusions:
  - confused_with: "pretexto"
    difference: "Un «pretexto» es la excusa falsa que das para librarte de algo; la otra palabra es el rodeo que haces antes de ir al asunto."
    memory_trick: "El pretexto tapa; el rodeo solo retrasa."
  - confused_with: "preludio"
    difference: "Un «preludio» es la pieza breve que abre una obra musical; la otra palabra es lo que dices de más antes del asunto."
    memory_trick: "El preludio se toca; el rodeo se sufre."
exercises:
