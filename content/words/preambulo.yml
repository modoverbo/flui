    body: "Su hermano llevaba diez minutos hablando del trabajo y del coche. Mara sonrió y le cortó con cariño: «Suelta el preámbulo y dime qué necesitas». Él se rio y lo dijo en una frase. Se lo resolvieron esa misma tarde."
    before_phrase: "Va, deja de darle vueltas y dime qué quieres."
    after_phrase: "Suelta el preámbulo y dime qué necesitas."
