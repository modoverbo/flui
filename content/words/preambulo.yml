    sentence: "Tadeo entró en la sala, dejó la carpeta y fue al asunto sin {{blank}}."
    hint_general: "Empezó por lo importante, sin ningún rodeo previo."
    explanation: "Preámbulo: el rodeo previo que él se ahorró. «Pretexto» sería una excusa falsa, y «cháchara» es coloquial y nombra la charla ociosa entre varias personas."
