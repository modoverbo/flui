    scene: "social"
    conversation_type: "social"
    title: "Turno de palabra"
    body: "En la asamblea del edificio cada intervención empezaba con tres minutos de historia. Cuando le tocó, Hernán fue otro: «Mi preámbulo es este: dos frases y ya está. Propongo arreglar el portal antes que el jardín». Le aplaudieron por lo breve."
    before_phrase: "Primero cuento un poco de dónde vengo con esto."
    after_phrase: "Mi preámbulo es este: dos frases y ya está."
