confusions:
  - confused_with: "preludio"
    difference: "Un «preludio» es la señal de algo que va a pasar, como unas nubes antes de la tormenta; la otra palabra son las frases con las que alguien abre."
    memory_trick: "El preludio avisa de lo que viene; lo otro lo dice quien habla."
  - confused_with: "prólogo"
    difference: "Un «prólogo» es el texto escrito que abre un libro, muchas veces firmado por otra persona; la otra palabra cabe en dos frases habladas."
    memory_trick: "El prólogo se imprime; lo otro se dice en voz alta."
exercises:
  - position: 1
    sentence: "Ernesto llegó, dejó la carpeta en la mesa y contó la cifra mala sin ningún {{blank}} que la preparara."
    hint_general: "Entró directo, sin decir nada antes para amortiguar la noticia."
    explanation: "Preámbulo: no dijo nada antes de la cifra. Un «preludio» sería una señal de lo que venía, y «rollo» acusa de soltar algo largo y aburrido."
    options:
      - position: 1
        text: "preludio"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Un «preludio» es una señal de algo que va a pasar, como el ruido antes de una avería; aquí se habla de lo que alguien dice al abrir."
        hint_specific: "Un «preludio» ocurre por su cuenta y avisa. ¿Aquí avisa el mundo o habla una persona?"
      - position: 2
        text: "preámbulo"
        is_correct: true
      - position: 3
        text: "rollo"
        is_correct: false
        distractor_type: "register"
        why_not: "«Rollo» es muy coloquial y acusa de soltar algo largo y aburrido, y aquí no se juzga lo que dijo: se dice que no dijo nada."
        hint_specific: "«Rollo» es un reproche por aburrir. ¿La frase reprocha algo o describe que fue directo?"
  - position: 2
    sentence: "Quince minutos de rodeos y luego dos frases con lo importante: el {{blank}} de Mireia duró más que la noticia."
    hint_general: "Lo que dijo antes del asunto ocupó más tiempo que el asunto mismo."
    explanation: "Preámbulo: lo dicho antes del asunto ocupó más que el asunto. Un «resumen» condensa lo esencial, y «calentamiento» es preparar el cuerpo antes de un esfuerzo."
    options:
      - position: 1
        text: "resumen"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Un «resumen» condensa lo esencial, y lo que duró quince minutos fue justo lo que no era esencial."
        hint_specific: "Un «resumen» es más corto que el contenido. ¿Qué duró más aquí, la parte previa o la noticia?"
      - position: 2
        text: "preámbulo"
        is_correct: true
      - position: 3
        text: "calentamiento"
        is_correct: false
        distractor_type: "register"
        why_not: "«Calentamiento» es coloquial y se dice de preparar el cuerpo antes de un esfuerzo físico, y aquí solo se habla."
        hint_specific: "«Calentamiento» es cosa de músculos. ¿Mireia mueve el cuerpo o habla?"
  - position: 3
    sentence: "Aitor abrió la reunión con un {{blank}} de dos frases y pasó directo al punto que dolía."
    hint_general: "Dos frases antes de entrar en el asunto difícil, y ya está."
    explanation: "Preámbulo: dos frases antes del asunto difícil. Un «prólogo» es un texto que abre un libro, y un «preludio» es la señal de algo que viene."
