    difference: "«Melancolía» es una tristeza que puede no tener causa concreta; la nostalgia siempre nace de recordar algo bueno del pasado."
    memory_trick: "La melancolía es difusa; la nostalgia tiene una foto detrás."
  - confused_with: "añoranza"
    difference: "«Añoranza» es extrañar algo que falta ahora mismo; la nostalgia es el sentimiento agridulce de recordarlo, esté o no presente."
