    title: "El álbum del garaje"
    body: "Buscando unas herramientas, Estela encontró un álbum de fotos de cuando su grupo de amigas se juntaba cada verano en la playa. Se sentó en el suelo del garaje a mirarlo entero. Cuando su hija la encontró ahí, le dijo: «Me dio una nostalgia tremenda, pero de las buenas»."
    before_phrase: "Me puse a recordar y se me pasó la tarde entera."
    after_phrase: "Me dio una nostalgia tremenda, pero de las buenas."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El compañero que ya no está"
    body: "Malena encontró en un cajón la taza que le regaló un excompañero de equipo antes de cambiarse de empresa. La miró un rato y siguió trabajando, pero con una sonrisa distinta el resto del día. «Me dio nostalgia de cuando trabajábamos juntos», le contó después a otra compañera."
    before_phrase: "Me acordé de los viejos tiempos con el equipo."
    after_phrase: "Me dio nostalgia de cuando trabajábamos juntos."
