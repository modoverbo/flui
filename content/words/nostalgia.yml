    title: "La lista de reproducción vieja"
    body: "En la fiesta de Gaspar, alguien puso por error la lista de música de la secundaria. Toda la mesa se quedó en silencio un segundo y después empezó a cantar a gritos. «Qué nostalgia», dijo alguien entre risas, «no hemos cambiado nada»."
