explanation: "Añadir un dato concreto a lo que ya se dijo, para que no queden dudas sobre eso."
example_sentence: "Antes de seguir, quiero puntualizar que esa cifra corresponde solo al primer trimestre."
register: "neutral"
pedantry_risk: 2
usage_tip: "Es ideal para corregir un detalle sin sonar como si contradijeras todo lo anterior."
when_not_to_use: "No la uses para dar una opinión nueva sin relación con lo dicho, ni para cambiar de tema."
collocations:
