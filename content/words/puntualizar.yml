    sentence: "Salvador {{blank}} en la entrevista que la lesión fue en el tobillo izquierdo, no en la rodilla como habían dicho algunos medios."
    hint_general: "Piensa en corregir un dato concreto sobre uno mismo, frente a una versión que circulaba distinta."
    explanation: "Puntualizó: corrigió el dato exacto sobre su lesión. «Puntuó» habla de dar puntos con números o marcar signos de un texto, y «comentó» es demasiado general para corregir un dato médico preciso."
