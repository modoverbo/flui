        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Aclarar» resuelve una confusión sobre lo que se dijo, y aquí no había confusión: solo faltaba precisar la duración exacta del retraso."
        hint_specific: "«Aclarar» resuelve una confusión. ¿Había confusión sobre lo que pasó, o solo faltaba un dato exacto?"
  - position: 4
    sentence: "Cuando su hija contó que el perro se había perdido «todo el día», Berenice {{blank}} que en realidad fueron solo cuarenta minutos."
    hint_general: "Busca el verbo para ajustar un dato exacto de algo que se contó de forma aproximada."
    explanation: "Puntualizó: ajustó el tiempo exacto que el perro estuvo perdido. «Corrigió» sonaría a que la versión de su hija estaba mal por completo, y «apostilló» es un término formal y poco usado en una conversación de mesa."
