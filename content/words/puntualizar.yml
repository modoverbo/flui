confusions:
  - confused_with: "recalcar"
    difference: "«Recalcar» insiste con fuerza en algo que ya se dijo, para que no se olvide; esta palabra añade un detalle preciso que faltaba, sin necesidad de repetir nada."
    memory_trick: "Recalcas lo que ya sabían; puntualizas lo que faltaba."
  - confused_with: "opinar"
    difference: "«Opinar» da un punto de vista personal; esta palabra corrige o precisa un dato concreto, no una opinión."
exercises:
  - position: 1
    sentence: "En la rueda de prensa, la directora quiso {{blank}} que el crecimiento del 20 % era solo de la división digital, no de toda la empresa."
    hint_general: "Busca el verbo para precisar a qué parte exacta de algo aplica un dato, sin suavizar nada."
    explanation: "Puntualizar: precisar a qué parte de la empresa aplica el dato. «Puntuar» es poner puntos a algo o marcar signos de un texto, y aquí no hay nada que puntuar así, y «matizar» suaviza una afirmación con un pero, cuando aquí solo se precisa un dato."
    options:
      - position: 1
        text: "puntuar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Puntuar» es asignar puntos a algo o poner los signos de un texto, y aquí no hay nada que puntuar de esa forma: solo un dato que precisar."
        hint_specific: "«Puntuar» pide números o signos de puntuación. ¿Qué hay que puntuar en esta rueda de prensa?"
      - position: 2
        text: "puntualizar"
        is_correct: true
      - position: 3
        text: "matizar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Matizar» suaviza una afirmación con un pero, y aquí no se suaviza nada: se precisa a qué parte de la empresa aplica el dato."
        hint_specific: "«Matizar» añade un pero a algo dicho. ¿La directora suaviza el dato o precisa a quién aplica?"
  - position: 2
    sentence: "En la reunión, Abelardo {{blank}} que el presupuesto aprobado era de 40 mil, no de 45 mil como alguien había dicho de pasada."
    hint_general: "Piensa en corregir un número exacto que alguien dijo mal, sin que el original estuviera mal del todo."
    explanation: "Puntualizó: corrigió la cifra exacta del presupuesto. «Apostilló» es un término formal y poco usado para anotar algo al margen, y aquí solo habló en voz alta, y «corrigió» sonaría a que el número anterior estaba mal por completo."
    options:
      - position: 1
        text: "apostilló"
        is_correct: false
        distractor_type: "register"
        why_not: "«Apostillar» es un término formal y algo anticuado para anotar algo al margen de un texto, y aquí Abelardo solo corrigió un número en voz alta, en una reunión normal."
        hint_specific: "«Apostillar» suena a anotación formal en un documento. ¿Dónde habló Abelardo, en un texto o en una reunión?"
      - position: 2
        text: "puntualizó"
        is_correct: true
      - position: 3
        text: "corrigió"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Corregir» sonaría a que el número anterior estaba mal por completo, y aquí solo faltaba precisar la cifra exacta que se había aprobado."
        hint_specific: "«Corregir» supone que el número estaba mal. ¿El presupuesto estaba mal o solo faltaba precisarlo?"
  - position: 3
    sentence: "Mientras Soledad contaba la anécdota del viaje, Nicanor {{blank}} que el vuelo se había retrasado dos horas, no toda la tarde como sonaba en su versión."
    hint_general: "Se trata de precisar un dato exacto dentro de una historia que ya se contaba."
    explanation: "Puntualizó: precisó cuánto duró el retraso. «Matizó» añadiría un pero sin cambiar un dato concreto, y «aclaró» resolvería una confusión sobre lo dicho, cuando aquí no había confusión, solo un dato impreciso."
    options:
      - position: 1
        text: "matizó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Matizar» añadiría un pero a la historia sin cambiar un dato concreto, y aquí Nicanor corrige exactamente cuánto duró el retraso."
        hint_specific: "«Matizó» añade un pero, sin cambiar un número. ¿Nicanor cambia un dato o solo suaviza la historia?"
      - position: 2
        text: "puntualizó"
        is_correct: true
