explanation: "Añade un motivo más de queja a algo que ya venía saliendo mal."
example_sentence: "Se estropeó el coche y, encima, tuvimos que pagar la grúa."
register: "coloquial"
pedantry_risk: 1
usage_tip: "Es la palabra exacta para el segundo golpe: una sola sílaba y se entiende el hartazgo."
when_not_to_use: "No la uses si lo segundo es una buena noticia; entonces pide una palabra que sume sin quejarse."
collocations:
  - "encima ahora"
  - "encima sin avisar"
replaces:
