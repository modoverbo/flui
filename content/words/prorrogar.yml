confusions:
  - confused_with: "prorratear"
    difference: "«Prorratear» es repartir una cantidad entre varios según lo que le toca a cada uno; lo otro solo mueve una fecha."
    memory_trick: "Prorrateas dinero; prorrogas una fecha."
  - confused_with: "posponer"
    difference: "«Posponer» aparta algo para más adelante sin decir hasta cuándo; lo otro fija cuánto tiempo más se da."
    memory_trick: "Posponer aparta; prorrogar pone otra fecha."
exercises:
  - position: 1
    sentence: "El cliente aceptó {{blank}} la entrega dos semanas a cambio de recibir un avance el viernes."
    hint_general: "Acepta dar dos semanas más a cambio de algo."
    explanation: "Prorrogar: dar dos semanas más al plazo. «Prorratear» sería repartir una cantidad entre varios, y «adelantar» movería la fecha hacia atrás."
    options:
      - position: 1
        text: "prorratear"
