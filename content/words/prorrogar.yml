        distractor_type: "near_synonym"
        why_not: "«Acortar» dejaría menos tiempo del previsto; el quince de marzo llega después, no antes."
        hint_specific: "Acortar deja menos tiempo. ¿El quince de marzo es antes o después?"
  - position: 4
    sentence: "Nadie {{blank}} nada si llegas el último día con la misma excusa del mes pasado."
    hint_general: "Sin argumentos nuevos, nadie te da más tiempo."
    explanation: "Prorroga: nadie te da más tiempo sin motivos nuevos. «Propaga» sería extender algo, y «confirma» daría por buena la fecha vieja."
