        distractor_type: "paronym"
        why_not: "«Prorratear» es repartir una cantidad entre varias personas; aquí no se reparte dinero, se mueve una fecha."
        hint_specific: "Prorratear reparte cantidades. ¿Qué se mueve en esta frase?"
      - position: 2
        text: "prorrogar"
        is_correct: true
      - position: 3
        text: "adelantar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Adelantar» movería la entrega hacia una fecha anterior; las dos semanas de la frase van en la otra dirección."
        hint_specific: "Adelantar acerca la fecha. ¿Las dos semanas acercan o alejan?"
  - position: 2
    sentence: "Mi casero {{blank}} el contrato un año más con las mismas condiciones de siempre."
    hint_general: "Dio un año más al contrato con las mismas condiciones."
    explanation: "Prorrogó: dio un año más al contrato. «Derogó» sería anular una norma, y «canceló» sería terminar el contrato, justo lo contrario."
    options:
      - position: 1
        text: "canceló"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cancelar» sería dar el contrato por terminado; la frase dice que sigue un año más igual que estaba."
        hint_specific: "Cancelar termina el contrato. ¿El contrato sigue o se acaba?"
      - position: 2
        text: "derogó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Derogar» se dice de una ley o una norma que queda sin efecto; un casero no deroga contratos, los renueva."
        hint_specific: "Derogar anula normas. ¿Qué hace un casero con un contrato?"
      - position: 3
        text: "prorrogó"
        is_correct: true
