exercises:
  - position: 1
    sentence: "La mayor {{blank}} de Cristina es que escucha hasta el final sin interrumpir a nadie."
    hint_general: "Lo mejor que tiene es dejar hablar hasta el final."
    explanation: "Virtud: lo mejor que tiene como persona. «Inquietud» sería desasosiego o ganas de saber, y «gracia» es coloquial y suena a que alguien hace reír."
    options:
      - position: 1
        text: "inquietud"
        is_correct: false
        distractor_type: "paronym"
        why_not: "La «inquietud» es desasosiego o ganas de saber, y escuchar hasta el final no es ni una cosa ni la otra."
        hint_specific: "La inquietud no deja estar quieto. ¿Qué hace Cristina mientras otro habla?"
