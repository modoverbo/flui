        is_correct: false
        distractor_type: "register"
        why_not: "«Gracia» es coloquial y suena a que alguien hace reír, y aquí se elogia su manera de escuchar."
        hint_specific: "La gracia se nota cuando alguien cuenta un chiste. ¿Qué hace ella de bueno?"
  - position: 2
    sentence: "Tiene la {{blank}} de bajar el tono justo cuando los demás lo suben."
