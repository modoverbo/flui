readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "La pregunta corta"
    body: "En el club de lectura todos hablan largo y Ester pregunta corto. «¿Y a ti qué te pasó al leerlo?». La conversación cambia de dirección cada vez. Alguien se lo dijo un jueves: «Tu virtud es que preguntas en cinco palabras». Ella dijo que nunca se lo había planteado."
    before_phrase: "Qué bien preguntas tú, siempre."
    after_phrase: "Tu virtud es que preguntas en cinco palabras."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La paciencia de Simón"
    body: "A Simón le preguntaron en la sobremesa qué creía que era lo mejor de él. Dijo «la paciencia» y se rio, como pidiendo perdón. Su mujer lo corrigió sin levantar la voz: «Esa virtud tuya nos ha sacado de tres o cuatro sitios malos». Nadie discutió."
    before_phrase: "Hombre, algo bueno tendré."
    after_phrase: "Esa virtud tuya nos ha sacado de varios líos."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El fallo a la primera"
    body: "Nicolás pierde la paciencia rápido y lo sabe. Su jefa lo dijo delante del equipo sin adornarlo: «No es paciente, pero tiene la virtud de reconocer un fallo en cuanto lo ve, y eso nos ahorra semanas». Desde entonces nadie tarda tanto en avisar de un problema."
    before_phrase: "Lo bueno que tiene es que reconoce las cosas."
    after_phrase: "Tiene la virtud de reconocer un fallo en cuanto lo ve."
