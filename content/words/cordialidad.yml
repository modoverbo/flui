schema_version: 1
slug: "cordialidad"
status: "draft"
lemma: "cordialidad"
part_of_speech: "sustantivo"
syllables: ["cor", "dia", "li", "dad"]
stressed_syllable: 4
ipa_latam: "[koɾ.ðja.liˈðad]"
ipa_es: "[koɾ.ðja.liˈðad]"
explanation: "Trato amable y cercano hacia alguien que acabas de conocer, sin ser falso ni demasiado formal."
example_sentence: "Aunque acababan de conocerse, los recibió con tanta cordialidad que se sintieron parte del grupo enseguida."
register: "neutral"
pedantry_risk: 1
usage_tip: "Funciona bien para describir cómo alguien te recibió sin conocerte, con calidez pero sin cercanía íntima."
when_not_to_use: "No la uses para una amistad profunda o de mucha confianza: ahí el trato ya pasó la cordialidad."
collocations:
  - "trato con cordialidad"
  - "recibir con cordialidad"
  - "cordialidad genuina"
replaces:
  - before: "Nos trató súper bien aunque recién nos conocíamos"
    after: "Nos trató con mucha cordialidad aunque recién nos conocíamos"
  - before: "Fue amable y cercano sin pasarse"
    after: "Nos recibió con cordialidad, sin pasarse"
family: ["cordial", "cordialmente"]
themes:
  - slug: "small-talk"
    relevance: 3
tags:
  comodin: ["buen trato"]
  funcion: ["elogiar"]
  canal: "ambos"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "cordura"
    difference: "«Cordura» es tener sensatez y buen juicio; la cordialidad es un trato amable y cercano con alguien, sin relación con la sensatez."
    memory_trick: "La cordura piensa con calma; la cordialidad trata con calidez."
exercises:
  - position: 1
    sentence: "Aunque no se conocían de nada, Martina recibió a los vecinos nuevos con una {{blank}} que los hizo sentir bienvenidos enseguida."
    hint_general: "Habla de un trato cálido y amable con alguien que acabas de conocer."
    explanation: "Cordialidad: un trato cálido con alguien recién conocido. «Cordura» es tener sensatez y buen juicio, y «generosidad» habla de dar algo de uno mismo, no solo de tratar bien."
    options:
      - position: 1
        text: "cordura"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Cordura» es tener sensatez y buen juicio, y aquí no se trata de pensar con calma, sino de un trato cálido con desconocidos."
        hint_specific: "La cordura tiene que ver con pensar con calma. ¿Aquí se habla de pensar o de tratar bien a alguien?"
      - position: 2
        text: "generosidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Generosidad» habla de dar algo de uno mismo, y aquí lo que se destaca es la forma cálida de tratarlos, no algo que les haya dado."
        hint_specific: "La generosidad es dar algo. ¿Aquí Martina dio algo o solo los trató bien?"
      - position: 3
        text: "cordialidad"
        is_correct: true
  - position: 2
    sentence: "Joaquín recibió al proveedor con una {{blank}} que hizo que la reunión, tensa al principio, terminara en buenos términos."
    hint_general: "Señala un trato amable que cambia el ambiente de una reunión algo tensa."
    explanation: "Cordialidad: el trato cálido que cambió el ambiente de la reunión. «Diplomacia» es manejar con cuidado un tema delicado, y «campechanía» es una calidez demasiado informal para este relato."
    options:
      - position: 1
        text: "diplomacia"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Diplomacia» es manejar con cuidado un tema delicado, y aquí lo que cambió el ambiente fue un trato cálido, no una estrategia para evitar el conflicto."
        hint_specific: "La diplomacia es manejar algo delicado con cuidado. ¿Aquí hubo una estrategia o solo un trato cálido?"
      - position: 2
        text: "campechanía"
        is_correct: false
        distractor_type: "register"
        why_not: "«Campechanía» es una calidez muy informal y desenfadada, y aquí se cuenta una negociación de trabajo con un tono más neutro."
        hint_specific: "Esa palabra suena muy informal y desenfadada. ¿El relato pide un tono así con un proveedor?"
      - position: 3
        text: "cordialidad"
        is_correct: true
  - position: 3
    sentence: "En su primera Navidad con los suegros, Débora sintió tanta {{blank}} de parte de ellos que se le pasaron los nervios enseguida."
    hint_general: "Apunta a un trato cercano y amable con alguien a quien recién se empieza a tratar."
    explanation: "Cordialidad: un trato amable hacia alguien a quien se empieza a tratar. «Ternura» es una calidez más íntima, y «confianza» se construye con el tiempo, algo que aún no hay en una primera Navidad."
    options:
      - position: 1
        text: "ternura"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Ternura» es una calidez muy afectiva, casi como la de la familia cercana, y aquí se trata de un trato amable con alguien a quien recién empieza a tratar."
        hint_specific: "La ternura es una calidez muy íntima. ¿Débora ya tiene esa cercanía con sus suegros?"
      - position: 2
        text: "cordialidad"
        is_correct: true
      - position: 3
        text: "confianza"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Confianza» se construye con el tiempo, y aquí es la primera Navidad juntos: lo que sintió fue un trato amable, no confianza todavía."
        hint_specific: "La confianza toma tiempo en construirse. ¿Es la primera vez que Débora los trata?"
  - position: 4
    sentence: "Felipe entró nervioso a la entrevista, pero el trato del panel fue con tanta {{blank}} que se relajó enseguida."
    hint_general: "Describe un trato cálido que ayuda a que alguien nervioso se relaje enseguida."
    explanation: "Cordialidad: el trato cálido que relajó a Felipe. «Cortesía» es cuidar las formas y ser educado, y «cercanía» supone ya conocerse un poco, algo que todavía no pasa en una primera entrevista."
    options:
      - position: 1
        text: "cortesía"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cortesía» es cuidar las formas y ser educado, y aquí lo que relajó a Felipe fue un trato cercano y cálido, más allá de la educación formal."
        hint_specific: "La cortesía es cuidar las formas. ¿Aquí lo que ayudó fue la educación formal o la calidez del trato?"
      - position: 2
        text: "cercanía"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cercanía» implica ya conocerse un poco, y aquí es la primera vez que se ven: lo que hubo fue un trato cálido, no cercanía todavía."
        hint_specific: "La cercanía supone ya conocerse algo. ¿Es la primera vez que se ven Felipe y el panel?"
      - position: 3
        text: "cordialidad"
        is_correct: true
  - position: 5
    sentence: "En la reunión de excompañeros, Celia no recordaba a la mitad, pero los trató a todos con la misma {{blank}}."
    hint_general: "Nombra un trato amable hacia gente que apenas se recuerda."
    explanation: "Cordialidad: un trato amable hacia gente que apenas se recuerda. «Simpatía» es que alguien te caiga bien a ti, y «tolerancia» es solo aceptar diferencias, no tratar con calidez."
    options:
      - position: 1
        text: "simpatía"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Simpatía» es que alguien te caiga bien, y aquí lo que se describe es cómo Celia trató a los demás, no si le cayeron bien."
        hint_specific: "La simpatía es que alguien te caiga bien a ti. ¿Aquí se habla de cómo trata Celia o de si le caen bien?"
      - position: 2
        text: "tolerancia"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Tolerancia» es aceptar diferencias sin problema, y aquí lo que se destaca es un trato cálido, no solo aceptar a la gente."
        hint_specific: "La tolerancia es aceptar diferencias. ¿Aquí se destaca aceptar o tratar con calidez?"
      - position: 3
        text: "cordialidad"
        is_correct: true
  - position: 6
    sentence: "En el stand de la feria, Rodrigo saludaba a cada visitante con tanta {{blank}} que muchos se quedaban más tiempo del planeado."
    hint_general: "Habla de un trato cálido que hace que la gente se quede charlando más tiempo."
    explanation: "Cordialidad: el trato cálido que hacía quedarse más tiempo a la gente. «Deferencia» es una actitud formal y distante, y «efusividad» es una alegría exagerada, no la calidez genuina del texto."
    options:
      - position: 1
        text: "deferencia"
        is_correct: false
        distractor_type: "register"
        why_not: "«Deferencia» es un respeto formal y algo distante, y aquí Rodrigo generaba cercanía y calidez, no una actitud protocolar."
        hint_specific: "La deferencia es una actitud más formal y distante. ¿Rodrigo buscaba cercanía o protocolo?"
      - position: 2
        text: "cordialidad"
        is_correct: true
      - position: 3
        text: "efusividad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Efusividad» es una alegría muy exagerada y ruidosa, y aquí lo que describe el texto es calidez genuina, no un entusiasmo desbordado."
        hint_specific: "La efusividad es una alegría muy exagerada. ¿El texto describe calidez o un entusiasmo desbordado?"
  - position: 7
    sentence: "Ximena llegó tarde a su primer entrenamiento con el grupo de running, pero la recibieron con tanta {{blank}} que no se sintió la nueva."
    hint_general: "Señala un trato amable que hace sentir bienvenido a alguien nuevo en un grupo."
    explanation: "Cordialidad: el trato amable que hizo sentir bienvenida a Ximena. «Solidaridad» es apoyar en una dificultad, y «camaradería» se construye con el tiempo, algo que no hubo en un primer entrenamiento."
    options:
      - position: 1
        text: "solidaridad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Solidaridad» es apoyar a alguien en una dificultad, y aquí no hay ningún problema que resolver, solo un trato cálido de bienvenida."
        hint_specific: "La solidaridad es apoyar en una dificultad. ¿Aquí hay un problema que resolver o solo una bienvenida cálida?"
      - position: 2
        text: "cordialidad"
        is_correct: true
      - position: 3
        text: "camaradería"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Camaradería» se construye entre quienes ya comparten tiempo como equipo, y esta era la primera vez que Ximena entrenaba con ellos."
        hint_specific: "La camaradería se construye con el tiempo en equipo. ¿Era la primera vez que Ximena entrenaba con ellos?"
  - position: 8
    sentence: "Cuando su hija llevó a su pareja a cenar por primera vez, Andrés lo recibió con una {{blank}} que rompió el hielo enseguida."
    hint_general: "Describe un trato cálido que ayuda a romper el hielo con alguien recién llegado."
    explanation: "Cordialidad: el trato cálido que rompió el hielo enseguida. «Benevolencia» es una buena disposición general hacia alguien, e «indulgencia» es no juzgar los errores de alguien, no un trato cálido puntual."
    options:
      - position: 1
        text: "benevolencia"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Benevolencia» es tener buena disposición hacia alguien en general, y aquí lo que rompió el hielo fue un trato cercano en el momento, no una actitud permanente."
        hint_specific: "La benevolencia es una buena disposición general. ¿Aquí se describe una actitud constante o un trato en ese momento?"
      - position: 2
        text: "cordialidad"
        is_correct: true
      - position: 3
        text: "indulgencia"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Indulgencia» es no juzgar los errores de alguien, y aquí no se trata de perdonar fallos, sino de un trato cálido desde el primer minuto."
        hint_specific: "La indulgencia es no juzgar errores. ¿Aquí se habla de perdonar algo o de tratar bien desde el inicio?"
readings:
  - position: 1
    scene: "social"
    conversation_type: "practica"
    title: "La primera carrera"
    body: "Ximena llegó quince minutos tarde a su primer entrenamiento, segura de que la mirarían mal. En cambio, alguien le pasó una botella de agua y le presentó al resto sin que ella lo pidiera. «Qué grupo tan cordial», pensó, mientras se ataba los cordones."
    before_phrase: "Qué amables todos, ni me conocían."
    after_phrase: "Qué grupo tan cordial, ni me conocían."
  - position: 2
    scene: "trabajo"
    conversation_type: "social"
    title: "El proveedor que llegó tenso"
    body: "El proveedor entró a la reunión listo para discutir el contrato palabra por palabra. Joaquín lo saludó con calma, le preguntó por el vuelo y le ofreció un café antes de hablar de números. Media hora después, firmaban sin haber peleado por nada. «Se nota la cordialidad de este equipo», dijo el proveedor al irse."
    before_phrase: "Nos trataron muy bien, la verdad, y eso ayudó."
    after_phrase: "Se nota la cordialidad de este equipo."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "La cena con el novio nuevo"
    body: "Andrés no sabía qué esperar del novio de su hija. Pero desde que llegó, le preguntó por su trabajo, le sirvió el primer plato y contó una anécdota vieja para romper el hielo. Al despedirse, su hija le susurró: «Gracias por tratarlo con tanta cordialidad»."
    before_phrase: "Gracias por portarte tan bien con él, papá."
    after_phrase: "Gracias por tratarlo con tanta cordialidad."
provenance:
