confusions:
  - confused_with: "esporádico"
    difference: "«Esporádico» dice que algo pasa de vez en cuando; «espontáneo» dice cómo sale algo en el momento, sin planearlo."
    memory_trick: "Esporádico cuenta las veces; espontáneo cuenta cómo sale."
  - confused_with: "impulsivo"
    difference: "«Impulsivo» actúa sin pensar en las consecuencias; «espontáneo» solo dice que la reacción no estaba preparada."
exercises:
  - position: 1
    sentence: "En el evento de la empresa, Nerea llevaba cinco minutos hablando con un desconocido cuando soltó un comentario tan {{blank}} sobre las corbatas del salón que los dos terminaron riendo y hablando otra hora."
    hint_general: "Habla de algo que surge de repente, sin ensayo previo, en medio de una charla cualquiera."
    explanation: "Espontáneo: el comentario surgió sin planearlo y alegró la charla. «Esporádico» describe la frecuencia con la que pasa algo, no cómo salió este comentario, y «impulsivo» supondría no medir las consecuencias, que aquí no existen."
    options:
      - position: 1
        text: "esporádico"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Esporádico» dice que algo ocurre de vez en cuando; aquí se describe cómo salió un comentario puntual, no su frecuencia."
        hint_specific: "«Esporádico» habla de cuántas veces pasa algo. ¿La frase cuenta la frecuencia o el modo en que salió el comentario?"
      - position: 2
        text: "espontáneo"
        is_correct: true
      - position: 3
        text: "impulsivo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Impulsivo» implica actuar sin medir las consecuencias; el comentario de Nerea solo hizo que la charla siguiera, sin ningún riesgo de por medio."
        hint_specific: "«Impulsivo» avisa de un riesgo que no se controla. ¿Qué se arriesga con ese comentario sobre las corbatas?"
  - position: 2
    sentence: "Antes de que empezara el curso de fotografía, todos guardaban silencio en la fila; Tobías soltó una pregunta tan {{blank}} sobre el horario del curso que la fila entera se rio y siguió hablando."
    hint_general: "Apunta a algo que nace ahí mismo, sin plan, dentro de una charla informal."
    explanation: "Espontánea: la pregunta nació ahí mismo y sin plan. «Instantánea» solo dice que algo pasa muy rápido, no que sea natural o sin preparar, y «improvisada» sugiere que hizo falta cubrir un vacío, cuando aquí solo fue una ocurrencia genuina."
    options:
      - position: 1
        text: "instantánea"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Instantánea» describe la velocidad con la que pasa algo, no si nació sin planearlo; la pregunta de Tobías no se mide en rapidez, sino en naturalidad."
        hint_specific: "«Instantánea» habla de rapidez, no de si algo estaba planeado. ¿La frase mide velocidad o naturalidad?"
      - position: 2
        text: "espontánea"
        is_correct: true
      - position: 3
        text: "improvisada"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Improvisada» sugiere que faltaba algo y hubo que rellenar el hueco; aquí Tobías no cubre ninguna falta, solo dice lo primero que se le ocurre con gracia."
        hint_specific: "«Improvisada» tapa un vacío. ¿Qué vacío cubre la pregunta de Tobías?"
  - position: 3
    sentence: "En el ascensor, lo que Norma le dijo a su vecina nueva sobre el paraguas mojado no venía preparado: fue {{blank}}, y las dos llegaron riendo al tercer piso."
    hint_general: "Señala un comentario que sale de improviso, ligero y sin ensayar, dentro de una charla breve."
    explanation: "Espontáneo: el comentario salió de improviso y fue ligero. «Alocado» es coloquial y sugiere un comentario disparatado o fuera de lugar, cuando aquí solo hizo reír sin incomodar, y «sincero» habla de decir la verdad, algo que la frase no pone en duda."
    options:
      - position: 1
        text: "alocado"
        is_correct: false
        distractor_type: "register"
        why_not: "«Alocado» es coloquial y sugiere un comentario disparatado o fuera de lugar; el de Norma solo hizo reír sin incomodar a nadie."
        hint_specific: "«Alocado» insinúa que algo se sale de tono. ¿Cómo reaccionó la vecina de Norma?"
      - position: 2
        text: "espontáneo"
        is_correct: true
      - position: 3
        text: "sincero"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sincero» dice que algo es honesto y verdadero; aquí nadie pone en duda si Norma dice la verdad, solo se nota que no lo tenía pensado."
        hint_specific: "«Sincero» habla de decir la verdad. ¿La frase pone en duda si Norma miente?"
  - position: 4
    sentence: "Ni ella sabía que iba a decir esas palabras hasta que las dijo: así de {{blank}} fue el brindis de Perla en la mesa de la boda."
    hint_general: "Se refiere a algo que aparece en el momento, sin que la persona lo tuviera pensado de antes."
    explanation: "Espontáneo: el brindis nació en el momento, sin que Perla lo tuviera pensado. «Extemporáneo» diría que llegó en mal momento, y aquí encajó perfecto, y «directo» habla de un estilo sin rodeos al hablar, no de si estaba planeado."
    options:
      - position: 1
        text: "extemporáneo"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Extemporáneo» describe algo que llega en un momento inoportuno; el brindis de Perla encajó bien y nadie lo sintió fuera de lugar."
        hint_specific: "«Extemporáneo» avisa de mal momento. ¿Cómo cayó el brindis de Perla en la mesa?"
      - position: 2
        text: "espontáneo"
        is_correct: true
      - position: 3
        text: "directo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Directo» describe un estilo de hablar sin rodeos; la frase no dice cómo hablaba Perla, solo que no tenía las palabras pensadas."
        hint_specific: "«Directo» habla de ir sin rodeos al grano. ¿La frase compara franqueza o planificación?"
  - position: 5
    sentence: "La pregunta que Malena le lanzó al señor de al lado sobre su perro, sentada en la sala de espera, fue {{blank}}: los dos siguieron hablando media hora."
    hint_general: "Habla de una pregunta que nace en el momento, sin que la persona la tuviera preparada de antes."
    explanation: "Espontánea: la pregunta nació ahí mismo, sin que Malena la llevara preparada. «Suelta» es coloquial y suena a algo dicho sin ningún interés real, cuando aquí terminaron hablando media hora, y «relajada» describe el tono con calma, no si la pregunta estaba pensada de antes."
    options:
      - position: 1
        text: "suelta"
        is_correct: false
        distractor_type: "register"
        why_not: "«Suelta» es coloquial y suena a un comentario sin interés real detrás; la pregunta de Malena llevó a media hora de charla."
        hint_specific: "«Suelta» suena a algo dicho sin ganas. ¿Cuánto duró la charla que empezó esa pregunta?"
      - position: 2
        text: "espontánea"
        is_correct: true
      - position: 3
        text: "relajada"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Relajada» describe un tono tranquilo al hablar, y la frase no dice si Malena estaba calmada, sino que la pregunta no estaba pensada de antes."
        hint_specific: "«Relajada» habla del tono de voz, no de si algo estaba pensado. ¿Qué dice la frase sobre si Malena lo llevaba preparado?"
  - position: 6
    sentence: "Jonás no llevaba el chiste preparado: le salió {{blank}} al acercarse a un grupo que no conocía en la fiesta de cumpleaños, y todos lo invitaron a quedarse a charlar."
    hint_general: "Se refiere a algo que sale sin pensarlo, en el momento justo de conocer a alguien."
    explanation: "Espontáneo: el chiste salió sin pensarlo, en el momento de conocer al grupo. «Atrevido» sugiere un riesgo de incomodar, y aquí lo invitaron a quedarse, y «abierto» describe a alguien sociable en general, no si ese chiste concreto estaba pensado."
    options:
      - position: 1
        text: "atrevido"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Atrevido» sugiere un comentario arriesgado que podría incomodar, y en la fiesta el grupo lo recibió bien e invitó a Jonás a quedarse."
        hint_specific: "«Atrevido» avisa de un riesgo. ¿Cómo reaccionó el grupo al chiste de Jonás?"
      - position: 2
        text: "espontáneo"
        is_correct: true
      - position: 3
        text: "abierto"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Abierto» describe a una persona sociable en general, y la frase no habla del carácter de Jonás, sino de si ese chiste concreto estaba pensado."
        hint_specific: "«Abierto» describe cómo es alguien siempre, no un chiste concreto. ¿La frase habla del carácter de Jonás o de ese chiste?"
  - position: 7
    sentence: "El comentario de Leandro sobre la lluvia, mientras esperaban el autobús, no estaba pensado: fue {{blank}}, y bastó para que la desconocida a su lado se riera y siguieran hablando hasta que llegó el bus."
    hint_general: "Apunta a un comentario que aparece sin ningún plan, justo en medio de la espera."
    explanation: "Espontáneo: el comentario apareció sin plan, en plena espera del autobús. «Auténtico» habla de ser fiel a uno mismo en general, no de si ese comentario estaba pensado, y «cercano» describe cercanía como rasgo de trato, no el hecho de que surgiera de repente."
    options:
      - position: 1
        text: "auténtico"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Auténtico» describe ser fiel a uno mismo como rasgo general, y la frase no juzga la personalidad de Leandro, solo que el comentario no estaba pensado."
        hint_specific: "«Auténtico» habla del carácter de alguien en general. ¿La frase describe el carácter de Leandro o ese comentario puntual?"
      - position: 2
        text: "espontáneo"
        is_correct: true
      - position: 3
        text: "cercano"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cercano» describe calidez en el trato como rasgo estable, y la frase solo dice que el comentario salió sin que Leandro lo planeara."
        hint_specific: "«Cercano» describe cómo trata alguien siempre. ¿La frase habla de un trato constante o de un comentario puntual?"
  - position: 8
    sentence: "El primer día, Bárbara le hizo una pregunta tan {{blank}} a su nuevo compañero de mesa que en dos minutos ya sabían de dónde eran los dos."
    hint_general: "Habla de una pregunta que surge sin que la persona la tuviera pensada de antes."
    explanation: "Espontánea: la pregunta surgió sin que Bárbara la llevara pensada. «Confiada» describe seguridad en una misma como rasgo, no si algo estaba planeado, y «curiosa» describe interés por saber cosas, no la falta de preparación."
    options:
      - position: 1
        text: "confiada"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Confiada» describe seguridad en una misma como forma de ser, y la frase no habla del carácter de Bárbara, sino de que no llevaba la pregunta pensada."
        hint_specific: "«Confiada» describe un rasgo estable de alguien. ¿La frase describe cómo es Bárbara siempre o esa pregunta puntual?"
      - position: 2
        text: "espontánea"
        is_correct: true
      - position: 3
        text: "curiosa"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Curiosa» describe el interés que muestra alguien por saber cosas, y la frase no mide cuánto interés tiene Bárbara, sino que la pregunta no estaba pensada de antes."
        hint_specific: "«Curiosa» habla de interés por saber. ¿La frase mide interés o planificación previa?"
readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "El centro de mesa"
    body: "En la boda de un primo lejano, Ismael se sentó junto a alguien que no conocía. En vez de guardar silencio, comentó: «Ese centro de mesa parece que va a salir volando con el viento». La chica se rio y, media hora después, seguían hablando de sus vuelos más raros. Fue un comentario espontáneo, y la mesa entera terminó riendo con ellos."
    before_phrase: "Se me ocurrió algo random y funcionó."
    after_phrase: "Fue un comentario espontáneo, y funcionó."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La pregunta en la cocina"
    body: "Fabiola no sabía cómo acercarse a su suegra nueva. Una tarde, mientras las dos lavaban platos, le preguntó de la nada: «¿Y cuál era tu plato favorito de niña?». Fue una pregunta espontánea, sin nada preparado, y su suegra se soltó a contar historias durante una hora. Desde entonces, cocinan juntas cada domingo."
    before_phrase: "No sabía qué decirle y me salió una pregunta random."
    after_phrase: "Fue una pregunta espontánea, y funcionó."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El comentario del ascensor"
    body: "Cayetano compartía ascensor cada mañana con alguien del piso de arriba, sin hablarle nunca. Un día soltó, sin pensarlo: «¿Usted también cree que este ascensor tiene su propio horario?». Los dos se rieron, y desde entonces se saludan por su nombre. Aquel comentario espontáneo abrió una relación que llevaba meses en silencio."
    before_phrase: "Le dije lo primero que se me ocurrió."
    after_phrase: "Fue un comentario espontáneo, y desde entonces nos saludamos."
