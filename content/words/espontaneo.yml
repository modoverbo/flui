ipa_latam: "[es.ponˈta.ne.o]"
ipa_es: "[es.ponˈta.ne.o]"
explanation: "Que hace o dice algo de forma natural, sin planear ni preparar nada."
example_sentence: "Le salió un comentario tan espontáneo que la mesa entera se rio sin esperarlo."
register: "neutral"
pedantry_risk: 1
usage_tip: "Funciona bien para celebrar una reacción genuina en el momento; forzarla suena a actuación."
when_not_to_use: "No la uses para quien actúa sin medir las consecuencias, ni para algo copiado o ensayado de antemano."
collocations:
  - "una reacción espontánea"
  - "un comentario espontáneo"
  - "risa espontánea"
replaces:
  - before: "Se le ocurrió así, sin pensarlo"
    after: "Tuvo una reacción espontánea"
  - before: "Habló tal cual, sin guion"
    after: "Habló de forma espontánea"
  - before: "Lo dijo tal cual le vino a la cabeza"
    after: "Lo dijo de forma espontánea"
