  variedad: "panhispanico"
confusions:
  - confused_with: "visible"
    difference: "«Visible» es lo que se ve a simple vista; esto mide si algo se puede hacer con los recursos que hay."
    memory_trick: "Lo visible se ve; lo viable se hace."
  - confused_with: "fiable"
    difference: "«Fiable» es aquello en lo que confías porque no falla; aquí se mide si la cosa se puede llevar a cabo."
    memory_trick: "En lo fiable confías; lo viable lo sacas adelante."
exercises:
  - position: 1
    sentence: "Con el equipo que queda y tres semanas por delante, la única propuesta {{blank}} es la más corta."
    hint_general: "Es la única que cabe en el tiempo y con la gente que hay."
    explanation: "Viable: es la única que cabe en el tiempo y con la gente disponible. «Visible» habla de lo que se ve, y «rentable» habla de dinero ganado, no de si se puede hacer."
    options:
      - position: 1
        text: "visible"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Visible» dice que algo se ve a simple vista; las tres propuestas se ven igual de bien, el problema es el tiempo."
        hint_specific: "«Visible» va de lo que se ve. ¿El problema aquí es verla o poder hacerla?"
      - position: 2
        text: "viable"
        is_correct: true
      - position: 3
        text: "rentable"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Rentable» mide el dinero que deja algo; la frase no habla de ganancias, sino de semanas y personas."
        hint_specific: "Rentable mide ganancias. ¿La frase habla de dinero ganado o de tiempo?"
  - position: 2
    sentence: "El plan sonaba precioso, pero con ese presupuesto no era {{blank}}."
    hint_general: "El dinero disponible no daba para llevarlo a cabo."
    explanation: "Viable: el dinero no daba para llevarlo a cabo. «Visible» no dice nada del presupuesto, y «barato» solo mide el precio, no si el plan se sostiene."
    options:
      - position: 1
        text: "barato"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Barato» mide cuánto cuesta algo; un plan puede ser caro y aun así salir adelante si hay dinero para él."
        hint_specific: "Barato compara precios. ¿La frase compara precios o mide si se puede hacer?"
      - position: 2
        text: "visible"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Visible» es lo que se ve; el presupuesto no hace que un plan se vea menos, hace que no se pueda pagar."
        hint_specific: "«Visible» va de lo que se ve. ¿Qué impide aquí el presupuesto?"
      - position: 3
        text: "viable"
        is_correct: true
  - position: 3
    sentence: "Camilo presentó tres rutas: dos {{blank}} con el equipo de ahora y una que necesitaba el doble de gente."
    hint_general: "Dos de ellas se pueden hacer con el personal actual."
    explanation: "Viables: dos rutas se pueden hacer con el equipo de ahora. «Fiables» hablaría de confianza, y «variables» describiría algo que cambia solo."
    options:
      - position: 1
        text: "viables"
        is_correct: true
      - position: 2
        text: "fiables"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Fiable» es lo que no te falla; aquí lo que separa a las rutas es cuánta gente hacen falta, no la confianza."
        hint_specific: "«Fiable» habla de confianza. ¿Qué separa a la tercera ruta de las otras dos?"
      - position: 3
        text: "variables"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Variable» describe algo que cambia de un día para otro, y estas dos rutas no cambian: se pueden hacer o no con la gente que hay."
        hint_specific: "«Variable» habla de lo que cambia. ¿Qué separa a las dos rutas de la tercera?"
  - position: 4
    sentence: "Antes de prometer una fecha, Beatriz preguntó si el calendario era {{blank}} con las personas que hay."
    hint_general: "Quiere saber si ese calendario se puede cumplir con el personal actual."
    explanation: "Viable: quiere saber si el calendario se puede cumplir. «Fiable» hablaría de confiar en él, y «flexible» diría que se puede mover, que es otra cosa."
    options:
      - position: 1
        text: "fiable"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Fiable» es aquello en lo que confías porque no falla; Beatriz no pregunta si confía, pregunta si se puede cumplir."
        hint_specific: "«Fiable» habla de confianza. ¿Qué está calculando Beatriz antes de prometer?"
      - position: 2
        text: "flexible"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Flexible» dice que las fechas se pueden mover; ella pregunta otra cosa: si se pueden cumplir tal como están."
        hint_specific: "Flexible significa que se puede mover. ¿Pregunta si se mueve o si se cumple?"
      - position: 3
        text: "viable"
        is_correct: true
  - position: 5
    sentence: "Sin dos personas más no podríamos ni empezar: abrir los sábados solo es {{blank}} con ese refuerzo."
    hint_general: "Sin esas dos personas, la idea no llega ni a arrancar."
    explanation: "Viable: sin esas dos personas la idea no arranca. «Variable» habla de algo que cambia, y «sostenible» mira si aguanta en el tiempo, no si empieza."
    options:
      - position: 1
        text: "variable"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Variable» describe algo que cambia de un día para otro, y aquí lo que decide todo son dos contrataciones."
        hint_specific: "«Variable» habla de algo que cambia. ¿La frase habla de cambios o de personal?"
      - position: 2
        text: "sostenible"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sostenible» mira si algo aguanta a lo largo del tiempo, y la frase dice que sin refuerzo no se podría ni empezar."
        hint_specific: "Sostenible mira el largo plazo. ¿Qué dice la frase que no se podría hacer?"
      - position: 3
        text: "viable"
        is_correct: true
  - position: 6
    sentence: "El taller de los martes no era {{blank}}: nadie del grupo podía llegar antes de las siete."
    hint_general: "Con esos horarios, el taller no se podía llevar a cabo."
    explanation: "Viable: con esos horarios el taller no se podía hacer. «Visible» no tiene que ver con horarios, y «cómodo» solo dice que resulta incómodo, no imposible."
    options:
      - position: 1
        text: "cómodo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cómodo» dice que algo cuesta un poco; la frase va más lejos, porque nadie podía llegar a esa hora."
        hint_specific: "Cómodo mide molestias. ¿El grupo estaba incómodo o directamente no llegaba?"
      - position: 2
        text: "viable"
        is_correct: true
      - position: 3
        text: "visible"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Visible» es lo que se ve; un horario que no le sirve a nadie no es un problema de vista."
        hint_specific: "«Visible» va de ver. ¿El problema de los martes es de vista o de horario?"
  - position: 7
    sentence: "«Con los plazos del banco, mudarnos en enero no lo veo {{blank}}: no es que vaya a ser duro, es que el dinero no llega», le dijo Martín a su hermana mientras pintaban la cocina."
    hint_general: "Los plazos del banco no dejaban espacio para hacerlo en enero."
    explanation: "Viable: los plazos del banco no dejaban hacerlo en enero. «Variable» hablaría de algo que cambia, y «llevadero» diría que se aguanta aunque incomode."
    options:
      - position: 1
        text: "variable"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Variable» describe lo que cambia de un momento a otro; los plazos del banco son fijos, y ese es justo el problema."
        hint_specific: "«Variable» va de cambios. ¿Los plazos cambian o son los que son?"
      - position: 2
        text: "llevadero"
        is_correct: false
        distractor_type: "register"
        why_not: "«Llevadero» dice que algo se aguanta aunque incomode, y Martín aclara que el problema no es lo duro que sea: es que el dinero no llega."
        hint_specific: "«Llevadero» mide lo que se aguanta. ¿Qué aclara Martín justo después de los dos puntos?"
      - position: 3
        text: "viable"
        is_correct: true
  - position: 8
    sentence: "Entre las tres propuestas, la única {{blank}} este trimestre era la que no tocaba el sistema."
    hint_general: "Solo una cabía en el trimestre sin obras mayores."
    explanation: "Viable: solo una cabía en el trimestre. «Visible» no aporta nada sobre plazos, y «potable» juzga la calidad, no si algo entra en el calendario."
    options:
      - position: 1
        text: "viable"
        is_correct: true
      - position: 2
        text: "potable"
        is_correct: false
        distractor_type: "register"
        why_not: "«Potable» es una manera coloquial de decir que algo tiene una calidad aceptable, y las tres valían: solo una cabía en el trimestre."
        hint_specific: "«Potable» juzga la calidad. ¿Lo que separa a las tres propuestas es la calidad o el calendario?"
      - position: 3
        text: "visible"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Visible» es lo que se ve; las tres propuestas estaban a la vista, y solo una cabía en el plazo."
        hint_specific: "«Visible» va de ver. ¿Alguna propuesta estaba escondida?"
readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "La idea y el calendario"
    body: "La propuesta ocupaba doce páginas y emocionó a todos. Silvia esperó a que bajara el entusiasmo: «Me gusta mucho. Con cuatro personas y hasta marzo, ¿es viable?». Nadie contestó enseguida. Al día siguiente llegó una versión más corta, y esa sí salió adelante."
    before_phrase: "Está muy bien, pero no sé si podremos."
    after_phrase: "Me gusta mucho, ¿pero es viable?"
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "El viaje de los seis"
    body: "El grupo llevaba dos semanas soñando con tres países en diez días. Hugo abrió el mapa y dijo: «Con seis personas y un coche, lo viable son dos países». Hubo protestas, y luego un acuerdo. Volvieron descansados, cosa rara."
    before_phrase: "Eso no lo vamos a poder hacer."
    after_phrase: "Con un coche, lo viable son dos países."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "La mudanza de enero"
    body: "Su madre insistía en adelantar la mudanza. Ximena la escuchó entera y luego dijo: «Te entiendo, y me gustaría. Con los plazos del banco no es viable en enero; en marzo sí». Su madre suspiró, pero no discutió: era un número, no un capricho."
    before_phrase: "Es que no se puede, mamá."
    after_phrase: "En enero no es viable; en marzo sí."
