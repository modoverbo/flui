ipa_latam: "[ˈbja.βle]"
ipa_es: "[ˈbja.βle]"
explanation: "Que se puede llevar a cabo de verdad, con el tiempo, el dinero y la gente que hay."
example_sentence: "Me encantó la idea, aunque con dos personas y un mes no la veo viable."
register: "neutral"
pedantry_risk: 1
usage_tip: "Sirve para decir que sí sin prometer de más: hablas de plazos y de gente, no de gustos."
when_not_to_use: "No la uses para decir que algo te gusta o que conviene: solo mide si se puede hacer."
collocations:
  - "una opción viable"
  - "un plan viable"
  - "hacerlo viable"
replaces:
  - before: "Eso sí se puede hacer"
    after: "Eso es viable"
  - before: "Suena bien, pero no sé si podremos"
    after: "Suena bien, pero no sé si es viable"
  - before: "Con ese presupuesto, ni de broma"
    after: "Con ese presupuesto no es viable"
family:
  - "viabilidad"
themes:
  - slug: "negociacion"
    relevance: 3
