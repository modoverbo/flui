    scene: "trabajo"
    conversation_type: "practica"
    title: "Antes de las cifras"
    body: "La reunión llevaba veinte minutos discutiendo números cuando Ariadna levantó la mano. «Un momento: estamos partiendo de una premisa que nadie ha dicho, que el equipo seguirá igual de grande». Se hizo un silencio corto. Volvieron a empezar con esa línea escrita arriba del todo."
    before_phrase: "Estamos dando por hecho una cosa, ¿no?"
    after_phrase: "Partimos de una premisa que nadie ha dicho."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "El local de marzo"
    body: "Mi hermano tenía el plan entero en una hoja: fechas, gente, comida. «¿Y el local?», le pregunté. Se quedó callado. «Toda la fiesta se apoya en una premisa: que estará libre en marzo». Llamó esa misma tarde y no lo estaba."
    before_phrase: "Todo esto se cae si eso no es verdad."
    after_phrase: "Todo se apoya en una premisa: que estará libre."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "La gente joven y los correos"
    body: "En el taller del barrio repetían que la gente joven no lee correos. Nerea lo escuchó tres veces y preguntó de dónde salía. Nadie supo decirlo. «Entonces es una premisa, no un dato», resumió, y esa semana probaron a escribir."
    before_phrase: "Eso lo damos por hecho y ya está."
    after_phrase: "Entonces es una premisa, no un dato."
