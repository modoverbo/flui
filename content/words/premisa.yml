    hint_general: "Acepta el cálculo y rechaza aquello de lo que parte el cálculo."
    explanation: "Premisa: aquello de lo que parte el cálculo. Una «conclusión» estaría al final, y él acepta los números; una «promesa» necesitaría a alguien que se comprometiera."
