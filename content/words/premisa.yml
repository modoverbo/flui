    explanation: "Premisa: lo que se dio por hecho y sostiene el plan. Una «promesa» necesita a alguien que se comprometa, y una «excusa» serviría para librarse de algo, cuando aquí nadie se libra de nada."
    options:
      - position: 1
        text: "excusa"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «excusa» sirve para librarse de algo, y aquí nadie se libra: se cuenta de qué partió el plan."
