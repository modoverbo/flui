exercises:
  - position: 1
    sentence: "Antes de discutir las cifras, Ariadna pidió aclarar la {{blank}}: todos suponían que el equipo seguiría igual de grande."
    hint_general: "Se aclara lo que todos daban por cierto antes de empezar a discutir."
    explanation: "Premisa: lo que todos daban por cierto antes de empezar. Una «promesa» la asume alguien y se puede cumplir, y una «conclusión» llegaría al final, no antes de discutir."
    options:
      - position: 1
        text: "promesa"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «promesa» es un compromiso que alguien asume, y aquí nadie se ha comprometido: todos suponían algo."
        hint_specific: "«Promesa» necesita a alguien que se comprometa. ¿Quién se comprometió en esta frase?"
      - position: 2
        text: "premisa"
        is_correct: true
      - position: 3
        text: "conclusión"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «conclusión» llega al final de un razonamiento, y aquí todavía no han empezado a discutir las cifras."
        hint_specific: "«Conclusión» cierra un razonamiento. ¿En qué momento está la reunión?"
  - position: 2
    sentence: "Toda la propuesta se apoya en una {{blank}} que nadie ha dicho en voz alta: que los clientes van a repetir."
    hint_general: "Es lo que se da por cierto en silencio y sostiene todo lo demás."
    explanation: "Premisa: lo que se da por cierto en silencio y sostiene lo demás. Una «primicia» es una noticia que se cuenta la primera, y una «norma» es una regla que hay que cumplir, no algo que se supone."
    options:
      - position: 1
        text: "primicia"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «primicia» es una noticia que alguien cuenta el primero, y aquí justo nadie ha dicho nada en voz alta."
        hint_specific: "«Primicia» se cuenta antes que nadie. ¿Se ha contado algo en esta frase?"
      - position: 2
        text: "norma"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «norma» es una regla que hay que cumplir, y esto no se cumple: se supone que pasará."
        hint_specific: "«Norma» manda lo que hay que hacer. ¿Alguien tiene que cumplir que los clientes repitan?"
      - position: 3
        text: "premisa"
        is_correct: true
  - position: 3
    sentence: "Nerea no se fía de lo que siente: quiere que la {{blank}} de la que parten quede escrita antes de mirar ningún dato."
    hint_general: "Quiere dejar escrito el punto de partida antes de mirar nada."
    explanation: "Premisa: el punto de partida que se deja escrito. Una «corazonada» es la sensación de la que ella desconfía, y una «prueba» sería algo ya comprobado, cuando aún no han mirado los datos."
    options:
      - position: 1
        text: "premisa"
        is_correct: true
      - position: 2
        text: "corazonada"
        is_correct: false
        distractor_type: "register"
        why_not: "«Corazonada» es coloquial y nombra una sensación interna, justo aquello de lo que Nerea no se fía."
