    title: "La ronda que se destrabó"
    body: "Llevaban cuatro reuniones en el mismo punto. Andrea puso las cartas boca arriba: «Hago una concesión: acepto tu fecha. A cambio, quiero el pago en dos partes». El otro lado se miró un segundo y aceptó. El contrato se firmó el jueves."
    before_phrase: "Yo pongo de mi parte, pero tú también."
    after_phrase: "Hago una concesión: acepto tu fecha."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "El turno del coche"
    body: "La discusión por el coche duraba ya tres domingos. Joaquín cambió el tono: «Voy a hacerte una concesión y no la voy a usar en tu contra: quédatelo en agosto. Pero en diciembre es mío». Su hermana se rio y dijo que sí."
    before_phrase: "Está bien, yo cedo esta vez."
    after_phrase: "Voy a hacerte una concesión, y no la usaré en tu contra."
  - position: 3
    scene: "entrevista"
    conversation_type: "social"
    title: "El horario y el sueldo"
    body: "La oferta llegó con menos dinero del esperado. Leonor respondió con calma: «Puedo hacer una concesión en el sueldo si entramos a las diez». La responsable anotó y dijo que lo consultaba. Al día siguiente había acuerdo."
    before_phrase: "Puedo ceder algo si me dan algo a cambio."
    after_phrase: "Puedo hacer una concesión en el sueldo."
