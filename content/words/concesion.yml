    difference: "Una «confesión» es contar algo que callabas; lo otro es ceder un punto dentro de un trato, y no tiene nada de secreto."
    memory_trick: "La confesión se cuenta; la concesión se entrega."
  - confused_with: "consenso"
    difference: "El «consenso» es el acuerdo al que llegan todos; una concesión es lo que cada parte pone para poder llegar ahí."
    memory_trick: "El consenso es el destino; la concesión, el peaje."
exercises:
