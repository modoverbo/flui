        distractor_type: "near_synonym"
        why_not: "Una «promesa» compromete algo para más adelante; lo que duele aquí es lo que cada lado suelta en el momento."
        hint_specific: "Una promesa mira al futuro. ¿Lo que duele es futuro o presente?"
  - position: 2
    sentence: "Bajar el precio fue la única {{blank}} que Lorenzo puso sobre la mesa; el plazo ni lo tocó."
