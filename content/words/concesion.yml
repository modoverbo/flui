        distractor_type: "register"
        why_not: "«Dádiva» suena a lenguaje antiguo y sugiere un regalo generoso; en una mesa de trabajo nadie habla así."
        hint_specific: "«Dádiva» suena a otro siglo. ¿Encaja al hablar de un precio con un proveedor?"
