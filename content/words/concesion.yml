        text: "concesión"
        is_correct: true
      - position: 3
        text: "ventaja"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «ventaja» es algo que ganas tú; bajar el precio es justo lo contrario, algo que Lorenzo pierde para avanzar."
        hint_specific: "La ventaja la ganas tú. ¿Bajar el precio le da o le quita a Lorenzo?"
  - position: 3
    sentence: "Nadie se movía, así que Mariana abrió con una {{blank}} pequeña: adelantar la primera entrega."
