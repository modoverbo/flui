        why_not: "Unas «confesiones» son secretos que alguien cuenta, y lo que se intercambia aquí son puntos cedidos dentro del trato."
        hint_specific: "Las confesiones cuentan secretos. ¿Qué cerró el acuerdo, secretos o puntos cedidos?"
      - position: 2
        text: "concesiones"
        is_correct: true
