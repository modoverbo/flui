        hint_specific: "Una disculpa repara una ofensa. ¿Hay alguien ofendido en esta mesa?"
  - position: 4
    sentence: "El acuerdo se firmó gracias a dos {{blank}}: cada parte soltó un punto a cambio de que la otra soltara el suyo."
    hint_general: "Cada parte dejó de pedir una cosa a cambio de que la otra hiciera lo mismo."
    explanation: "Concesiones: cada parte cedió un punto a cambio del otro. «Confesiones» serían secretos contados, y «renuncias» sería soltar algo sin recibir nada."
    options:
      - position: 1
        text: "confesiones"
        is_correct: false
