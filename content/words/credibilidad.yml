    difference: "«Confianza» es lo que otra persona siente hacia ti, y te la puede dar de entrada; la credibilidad se gana con hechos que coinciden con lo dicho."
    memory_trick: "La confianza te la regalan; la credibilidad te la ganas."
  - confused_with: "fama"
