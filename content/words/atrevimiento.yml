        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Osadía» suena a un acto más grande y dramático, y pedir un número de teléfono es un riesgo pequeño, cotidiano."
        hint_specific: "La osadía suena a algo más grande. ¿Qué tan grande fue lo que hizo Dante?"
      - position: 3
        text: "atrevimiento"
