  - position: 4
    sentence: "Sin que hubiera ningún peligro de por medio, Bárbara mostró {{blank}} al confesarle a su compañero de equipo, en un gesto pequeño y cotidiano, que le gustaba, justo antes de la final del torneo."
    hint_general: "Piensa en un riesgo social pequeño y cotidiano, sin peligro real ni hazaña de por medio."
    explanation: "Atrevimiento: un riesgo social pequeño y cotidiano, sin peligro real ni hazaña de por medio. «Temeridad» implica un riesgo imprudente de verdad, y la frase aclara que no había ningún peligro; «arrojo» es una palabra grande y dramática para hazañas, y la frase aclara que fue un gesto pequeño y cotidiano."
    options:
