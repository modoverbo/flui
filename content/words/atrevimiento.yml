    sentence: "Jonás tuvo tanta {{blank}} al invitar a bailar a la chica que llevaba toda la noche mirando —un gesto pequeño y de lo más normal en cualquier fiesta— que hasta sus amigos, que lo conocen tímido, se quedaron sorprendidos."
