        why_not: "«Agallas» es muy coloquial y suena a enfrentar algo duro o incluso físico, y aquí el riesgo es solo mandar un mensaje."
        hint_specific: "«Agallas» es informal y suena a algo físico. ¿Encaja con mandar un mensaje?"
      - position: 2
        text: "atrevimiento"
        is_correct: true
      - position: 3
        text: "valentía"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Valentía» se asocia a un peligro serio o a una situación de riesgo real, y mandar un mensaje no lo es."
        hint_specific: "La valentía enfrenta un peligro real. ¿Qué peligro real hay en mandar un mensaje?"
  - position: 3
    sentence: "«¿Cómo se te ocurrió pedirle el número así, sin conocerla?», le preguntó su amigo a Dante. «No sé, fue pura {{blank}}», respondió, todavía sorprendido de sí mismo."
    hint_general: "Se trata de un riesgo social pequeño, sin una actitud de superioridad."
    explanation: "Atrevimiento: un riesgo social pequeño, sin la actitud chula. «Chulería» implica una actitud de superioridad para impresionar, y Dante quedó sorprendido de sí mismo, no fanfarroneando; «osadía» suena a un acto más grande y dramático, y pedir un número no lo es."
    options:
      - position: 1
        text: "chulería"
        is_correct: false
        distractor_type: "register"
        why_not: "«Chulería» implica una actitud de superioridad para impresionar a otros, y Dante quedó sorprendido de sí mismo, no fanfarroneando."
        hint_specific: "La chulería presume delante de otros. ¿Dante presume o se sorprende de sí mismo?"
