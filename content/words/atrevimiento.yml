confusions:
  - confused_with: "descaro"
    difference: "«Descaro» cruza la línea del respeto hacia el otro; el atrevimiento se arriesga sin faltarle el respeto a nadie."
    memory_trick: "El descaro ofende; el atrevimiento solo arriesga."
  - confused_with: "aturdimiento"
    difference: "«Aturdimiento» es confusión o no saber reaccionar; el atrevimiento es justo lo contrario: actuar con decisión pese al riesgo."
exercises:
  - position: 1
    sentence: "Después de dudarlo toda la cena, Casilda por fin tuvo el {{blank}} de decirle que quería volver a verlo."
    hint_general: "Piensa en decidir hablar pese al riesgo, sin perder el respeto por el otro."
    explanation: "Atrevimiento: decidir hablar pese al riesgo, con respeto. «Aturdimiento» es confusión o no saber reaccionar, lo contrario de decidir con claridad; «descaro» cruzaría una línea de respeto, y pedir volver a verlo no ofende a nadie."
    options:
      - position: 1
        text: "aturdimiento"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Aturdimiento» es confusión o no saber reaccionar, y Casilda decidió con claridad qué decir después de pensarlo."
        hint_specific: "El aturdimiento es no saber reaccionar. ¿Casilda dudó sin saber qué hacer, o decidió algo claro?"
      - position: 2
        text: "atrevimiento"
        is_correct: true
      - position: 3
        text: "descaro"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Descaro» cruzaría una línea de respeto, y pedir volver a verlo a alguien no ofende a nadie."
        hint_specific: "El descaro falta al respeto. ¿A quién le falta el respeto Casilda al pedir esto?"
  - position: 2
    sentence: "Ulises tuvo {{blank}} para mandarle el primer mensaje después de seguir su perfil durante tres meses sin animarse."
    hint_general: "Es el paso que se da ante un riesgo social pequeño, no un peligro real."
    explanation: "Atrevimiento: el paso de dar un riesgo social pequeño, no un peligro real. «Agallas» es muy coloquial y suena a enfrentar algo duro o físico; «valentía» se asocia a un peligro serio, y mandar un mensaje no lo es."
    options:
