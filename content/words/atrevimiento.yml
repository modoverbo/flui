    explanation: "Atrevimiento: preguntar algo directo sin faltar el respeto, aunque no haya ningún peligro real. «Descaro» implicaría faltarle el respeto, y preguntar con honestidad no lo es; «valentía» exagera el riesgo, y la frase aclara que lo único en juego era sentirse un poco incómoda."
