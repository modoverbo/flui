readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "El cruce de miradas"
    body: "En la boda de un amigo en común, Ismael cruzó todo el salón para preguntarle su nombre a alguien que llevaba toda la noche mirando de lejos. «Qué atrevimiento», le dijo ella, sonriendo, «pensé que solo me ibas a saludar de lejos»."
    before_phrase: "Me animé y crucé el salón, no sé de dónde saqué el valor."
    after_phrase: "Qué atrevimiento crucé el salón para hablarte."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "El consejo del primo"
    body: "Antes de escribirle a alguien que le gustaba desde hacía meses, Renzo le pidió consejo a su primo. «Solo dile la verdad, sin rodeos», le sugirió. Renzo tuvo el atrevimiento de escribir justo eso, sin adornos, y ella respondió en cinco minutos."
    before_phrase: "Me da miedo decirle las cosas directamente."
    after_phrase: "Tuve el atrevimiento de decírselo sin rodeos."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "La invitación en la cafetería"
    body: "En la cafetería de la oficina, Selene reunió el atrevimiento para invitar a un café fuera del trabajo a un compañero de otro piso con el que apenas había hablado. Él aceptó al instante, un poco sorprendido de que se lo hubiera pedido tan directo."
    before_phrase: "No sé si debería invitarlo, me da algo de miedo."
    after_phrase: "Reuní el atrevimiento para invitarlo a un café."
