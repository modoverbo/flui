confusions:
  - confused_with: "deslumbrar"
    difference: "«Deslumbrar» es cegar con una luz fuerte o dejar a alguien impresionado; la otra palabra es ver apenas, con esfuerzo."
    memory_trick: "Deslumbrar sobra de luz; lo otro falta."
  - confused_with: "alumbrar"
    difference: "«Alumbrar» es dar luz a un sitio para que se vea; la otra palabra la usa quien mira, no quien ilumina."
    memory_trick: "La lámpara alumbra; tú apenas ves."
