readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Dos meses en rojo"
    body: "Llevaban ocho semanas sin buenas noticias y el ánimo estaba por el suelo. Blanca puso dos cifras en la pizarra: «Con esto ya se vislumbra una salida, aunque falte confirmarla». Nadie celebró nada, pero todos se sentaron a trabajar."
    before_phrase: "Creo que ya se empieza a ver algo de luz."
    after_phrase: "Ya se vislumbra una salida."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La niebla del puente"
    body: "Salieron a caminar al amanecer y el valle estaba cerrado por la niebla. Su padre señaló hacia el río: «Apenas se vislumbra el puente, pero está ahí». Media hora después el sol lo dejó entero a la vista."
    before_phrase: "Casi no se ve nada, pero algo se adivina."
    after_phrase: "Apenas se vislumbra el puente, pero está ahí."
  - position: 3
    scene: "entrevista"
    conversation_type: "practica"
    title: "Dentro de tres años"
    body: "Le preguntaron a Camila dónde se veía a medio plazo. Respondió sin inventar una carrera entera: «Vislumbro un puesto donde decida sobre el producto, aunque todavía no sé en qué área». La respuesta gustó por honesta."
    before_phrase: "Más o menos me imagino por dónde quiero ir."
    after_phrase: "Vislumbro un puesto donde decida sobre el producto."
