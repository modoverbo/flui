stressed_syllable: 3
ipa_latam: "[in.miˈnen.te]"
ipa_es: "[in.miˈnen.te]"
explanation: "Que está a punto de ocurrir, con tan poco tiempo por delante que ya no se puede evitar."
example_sentence: "El cambio de jefe parecía inminente y nadie lo decía en voz alta."
register: "neutral"
pedantry_risk: 1
usage_tip: "Habla de cuándo va a pasar algo, no de si es bueno o malo: sirve igual para una buena noticia."
when_not_to_use: "No la uses para alabar a alguien destacado en su campo; esa palabra es «eminente»."
collocations:
  - "un cambio inminente"
  - "una salida inminente"
  - "un anuncio inminente"
replaces:
  - before: "El cierre parecía eminente"
    after: "El cierre parecía inminente"
  - before: "Eso va a pasar en cualquier momento"
    after: "Eso es inminente"
  - before: "Ya casi está encima la mudanza"
    after: "La mudanza es inminente"
family:
  - "inminencia"
themes:
