  - position: 4
    sentence: "El equipo de cocina {{blank}} en los ingredientes del postre y los clientes lo notaron en la primera cucharada."
    hint_general: "Puso de menos en algo importante y se notó al probarlo."
    explanation: "Escatimó: puso de menos y se notó. «Apretó» es de charla informal y suena a presionar, y «limitó» solo diría que fijó un tope."
    options:
      - position: 1
        text: "apretó"
        is_correct: false
        distractor_type: "register"
        why_not: "«Apretó» es de conversación suelta y sugiere presionar a alguien, no poner menos ingredientes."
        hint_specific: "«Apretó» suena a exigir o a presionar. ¿Se presiona a alguien o falta ingrediente?"
      - position: 2
        text: "escatimó"
        is_correct: true
      - position: 3
        text: "limitó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Limitó» dice que se puso un tope, y la frase cuenta que el postre salió pobre, no que hubiera una regla."
        hint_specific: "«Limitó» es poner un tope. ¿Había una regla o faltaba producto?"
  - position: 5
    sentence: "Cuando por fin le dieron el proyecto, Ismael no {{blank}} horas: se quedó tres sábados seguidos."
    hint_general: "No se guardó nada de lo que hacía falta poner."
    explanation: "Escatimó: no se guardó nada de lo que hacía falta. «Estimó» sería calcular cuántas horas eran, y «guardó» hablaría de reservar algo para después."
    options:
      - position: 1
        text: "guardó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Guardó» es reservar algo para después, y la frase cuenta que puso todo lo que tenía."
        hint_specific: "«Guardó» es reservar para otro momento. ¿Ismael reservó horas o las gastó todas?"
      - position: 2
        text: "estimó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Estimó» es calcular cuántas horas harían falta, y aquí lo que hizo fue ponerlas."
        hint_specific: "«Estimó» es hacer un cálculo. ¿Calculó las horas o las trabajó?"
      - position: 3
        text: "escatimó"
