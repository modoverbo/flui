confusions:
  - confused_with: "estimar"
    difference: "«Estimar» es calcular un valor por aproximación, o apreciar a alguien; lo otro es dar de menos para gastar poco."
    memory_trick: "Estimas cuánto vale; escatimas cuánto das."
  - confused_with: "ahorrar"
    difference: "«Ahorrar» puede ser una buena decisión; esta palabra supone que el recorte estropea el resultado."
    memory_trick: "Ahorrar es guardar; escatimar es quitar de donde hacía falta."
exercises:
  - position: 1
    sentence: "El hotel prometía desayuno completo y luego {{blank}} hasta en el café: una taza por persona y nada más."
    hint_general: "Dio menos de lo prometido para gastar poco, y el resultado quedó pobre."
    explanation: "Escatimó: dio de menos justo donde había prometido. «Estimó» sería calcular un valor, y «repartió» solo diría cómo distribuyó el café."
    options:
      - position: 1
        text: "estimó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Estimó» es calcular cuánto vale o cuánto hace falta, y aquí el hotel no calculó: dio de menos."
        hint_specific: "«Estimó» va de calcular un valor. ¿El hotel hizo cuentas o recortó el desayuno?"
      - position: 2
        text: "escatimó"
        is_correct: true
      - position: 3
        text: "repartió"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Repartió» solo dice cómo se distribuye algo, sin decir que quedara corto de lo prometido."
        hint_specific: "«Repartió» habla de cómo se divide. ¿La frase critica el reparto o la cantidad?"
  - position: 2
    sentence: "Para la exposición de fin de curso, los padres no quisieron {{blank}} en marcos y pagaron los buenos."
    hint_general: "Decidieron no quedarse cortos justo en esa parte."
    explanation: "Escatimar: decidieron no quedarse cortos ahí. «Escamotear» acusa de hacer desaparecer algo a escondidas, y «ahorrar» podría ser una decisión sensata."
    options:
      - position: 1
        text: "escamotear"
        is_correct: false
        distractor_type: "register"
        why_not: "«Escamotear» es palabra de denuncia y acusa de hacer desaparecer algo a escondidas; aquí nadie esconde nada."
        hint_specific: "«Escamotear» acusa de un truco para ocultar. ¿Alguien oculta algo en esta escena?"
      - position: 2
        text: "escatimar"
        is_correct: true
      - position: 3
        text: "ahorrar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Ahorrar» puede ser una decisión buena y ordenada, y la frase habla de no dejar los marcos cojos."
        hint_specific: "«Ahorrar» no tiene por qué ser malo. ¿Aquí el recorte dejaría algo cojo?"
  - position: 3
    sentence: "Marcela contrató a un técnico caro para el arreglo: prefería no {{blank}} y dormir tranquila diez años."
    hint_general: "Prefiere no quedarse corta hoy para no pagarlo mañana."
    explanation: "Escatimar: prefiere no quedarse corta hoy. «Estimar» sería calcular el valor del arreglo, y «medir» hablaría de tomar una medida."
    options:
      - position: 1
        text: "escatimar"
        is_correct: true
      - position: 2
        text: "estimar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Estimar» es poner una cifra aproximada a algo, y Marcela no calcula: decide cuánto poner."
        hint_specific: "«Estimar» es hacer un cálculo aproximado. ¿Ella calcula o decide gastar?"
      - position: 3
        text: "medir"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Medir» es tomar una medida, y aquí no hay nada que medir: hay una decisión de cuánto poner."
