  - position: 6
    sentence: "La empresa {{blank}} en la formación del equipo nuevo y luego se sorprendió con los errores de la primera semana."
    hint_general: "Puso de menos en una parte clave y pagó las consecuencias después."
    explanation: "Escatimó: puso de menos en una parte clave. «Escamoteó» acusaría de esconder la formación, y «redujo» solo diría que la hizo más corta."
    options:
