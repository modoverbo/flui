    explanation: "Escatimaba: nunca ponía de menos con visita. «Apretaba» es coloquial y suena a presionar, y «limitaba» diría que fijaba un tope."
    options:
      - position: 1
        text: "limitaba"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Limitaba» habla de poner un tope, y la frase cuenta que cocinaba de más sin ninguna regla."
