explanation: "Dar menos de lo que hace falta para gastar poco, aunque el resultado quede peor."
example_sentence: "No quiero escatimar en el papel: el catálogo se toca antes de leerse."
register: "neutral"
pedantry_risk: 1
usage_tip: "Dicha en negativo es una promesa concreta: nombra dónde no vas a recortar y el otro te cree."
when_not_to_use: "No la uses para un ahorro bien pensado; esta palabra supone que el recorte deja el resultado cojo."
collocations:
