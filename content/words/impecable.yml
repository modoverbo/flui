confusions:
  - confused_with: "implacable"
    difference: "«Implacable» describe a quien no cede ni perdona, o a algo que no da tregua; la otra palabra dice que algo salió sin un solo fallo."
    memory_trick: "Lo implacable no perdona; lo impecable no falla."
  - confused_with: "intachable"
    difference: "«Intachable» se dice de la conducta de alguien a lo largo de los años; lo otro cabe también para un resultado de esta misma mañana."
    memory_trick: "Intachable es una vida; impecable puede ser una tarde."
