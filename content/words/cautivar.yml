    scene: "trabajo"
    conversation_type: "practica"
    title: "Doscientas personas quietas"
    body: "Marta tenía quince minutos y un tema difícil. En vez de abrir con la gráfica, contó qué le dijo su primer cliente en 2015. «Nos cautivó desde la primera frase», comentó alguien al salir. Nadie sacó el móvil en quince minutos."
    before_phrase: "Nos gustó muchísimo, la verdad."
    after_phrase: "Nos cautivó desde la primera frase."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "El cuento de la sobrina"
    body: "Mi sobrina tiene nueve años y se inventó un cuento sobre un perro que odiaba los jueves. La mesa entera se calló. Mi madre lo dijo en voz alta al final: «Nos ha cautivado». La niña pidió postre doble, con razón."
    before_phrase: "Nos ha gustado un montón a todos."
    after_phrase: "Nos ha cautivado."
  - position: 3
    scene: "entrevista"
    conversation_type: "social"
    title: "El fallo por casualidad"
    body: "Ernesto podía contar su experiencia por años y puestos, pero eligió una historia: el día que descubrió un fallo de facturación mirando su propio recibo. El tribunal no interrumpió ni una vez. Esa historia los cautivó más que la lista de puestos."
    before_phrase: "Creo que les gustó bastante lo que conté."
    after_phrase: "Esa historia los cautivó."
