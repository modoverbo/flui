    scene: "trabajo"
    conversation_type: "practica"
    title: "El primer párrafo"
    body: "Zoe escribe titulares que no prometen milagros. «Quiero intrigar, no engañar», explicó en la reunión. Su regla es sencilla: la pregunta que abre el título se contesta en el primer párrafo. Es la que menos clics pierde a mitad de texto."
    before_phrase: "Quiero que entren, pero sin engañar."
    after_phrase: "Quiero intrigar, no engañar."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "El plato de comida"
    body: "A mi abuela le intrigaba la vecina nueva del cuarto, así que subió con un plato y llamó a la puerta. Volvió dos horas después con la historia entera y una receta apuntada. Su método no ha fallado en cuarenta años."
    before_phrase: "Me daba curiosidad esa vecina."
    after_phrase: "Me intrigaba esa vecina."
  - position: 3
    scene: "entrevista"
    conversation_type: "practica"
    title: "La pregunta del principio"
    body: "Vera abrió la charla con una pregunta y no la contestó hasta el último minuto. «Si intrigo al principio, me escuchan al final», dijo luego. Nadie se levantó antes de tiempo, y eso en una sala de cien personas es una proeza."
    before_phrase: "Les dejo con la duda para que aguanten."
    after_phrase: "Si intrigo al principio, me escuchan al final."
