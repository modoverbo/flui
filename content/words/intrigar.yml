confusions:
  - confused_with: "instigar"
    difference: "«Instigar» es empujar a alguien a hacer algo, casi siempre malo; lo otro solo despierta las ganas de saber."
    memory_trick: "Instigas a actuar; intrigas a preguntar."
  - confused_with: "confundir"
    difference: "«Confundir» deja al otro sin entender; aquí se entiende todo y falta una parte a propósito."
    memory_trick: "El confundido se pierde; el intrigado sigue."
