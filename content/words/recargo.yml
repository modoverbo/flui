explanation: "Dinero de más que se suma a un precio por pagar tarde o pedir algo especial."
example_sentence: "El envío del sábado tiene un recargo de doce pesos; el del lunes, no."
register: "neutral"
pedantry_risk: 1
usage_tip: "Nómbralo tú antes que el cliente: decir el recargo por adelantado es lo que evita la discusión del final."
when_not_to_use: "No la uses para el precio normal de algo, ni para un castigo; esto se suma por una condición avisada."
collocations:
  - "un recargo del diez por ciento"
  - "sin recargo"
  - "aplicar un recargo"
replaces:
