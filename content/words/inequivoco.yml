    conversation_type: "emocional"
    title: "Un no suave"
    body: "Le pedí a mi hermana que se quedara otro fin de semana. Dijo que no con una frase corta y una sonrisa. Fue suave e inequívoca a la vez: no había manera de entenderla como un quizá. Se fue el domingo y quedamos para el mes siguiente."
    before_phrase: "Me dijo que no, creo, no sé."
    after_phrase: "Fue suave e inequívoca a la vez."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "El cartel de la puerta"
    body: "El cartel del local decía «Cerrado los lunes de agosto». Ni una palabra más. «Es inequívoco», comentó alguien en el grupo del barrio, y se acabaron las preguntas del verano. En septiembre lo cambiaron por otro igual de corto."
    before_phrase: "Pone algo de los lunes, no sé si todos."
    after_phrase: "Es inequívoco: los lunes de agosto, cerrado."
