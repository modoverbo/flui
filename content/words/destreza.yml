readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "Nueve platos"
    body: "En la terraza de siempre, el camarero salió con nueve platos y no miró ninguno. Natalia se quedó parada a media frase. «Qué destreza», dijo, y él se encogió de hombros: quince años, dos terrazas y un brazo más largo que el otro, según cuenta él."
    before_phrase: "Qué bien se le da esto, madre mía."
    after_phrase: "Qué destreza lleva ese hombre."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La mano izquierda"
    body: "Teresa se rompió la muñeca derecha en marzo y pasó cuatro meses con la izquierda. Al principio se le caía todo. En julio cortaba verdura casi igual de fino. «He ganado destreza a la fuerza», dice, y ahora usa las dos manos para todo."
    before_phrase: "Me he acostumbrado a hacerlo con la otra mano."
    after_phrase: "He ganado destreza con la izquierda."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El pliegue"
    body: "Rosalba miró al panadero doblar la masa cuarenta veces antes de entender dónde estaba el asunto. No era la receta: era el pliegue, y ese gesto no aparece escrito. «La destreza está ahí», le dijo él, «y tarda un año»."
    before_phrase: "Es que a él le sale y a mí no."
    after_phrase: "La destreza está en el pliegue, y tarda un año."
