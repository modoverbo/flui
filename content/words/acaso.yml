ipa_latam: "[aˈka.so]"
ipa_es: "[aˈka.so]"
explanation: "Abre una pregunta que ya lleva dentro la respuesta y evita señalar a nadie."
example_sentence: "¿No avisamos acaso con dos semanas de margen a todo el equipo?"
register: "neutral"
pedantry_risk: 1
usage_tip: "La pregunta hace el trabajo por ti: recuerda un hecho sin acusar a nadie de frente."
when_not_to_use: "No la uses si esperas una respuesta de verdad; para preguntar en serio, pregunta directo."
collocations:
  - "acaso alguien"
  - "acaso todavía"
replaces:
  - before: "¿O qué, no lo dijimos ya?"
    after: "¿No lo dijimos acaso ya?"
  - before: "Llévate el abrigo, tú por si las moscas"
    after: "Llévate el abrigo por si acaso"
  - before: "Es que nadie lee nada, la verdad"
    after: "¿Ha leído acaso alguien el informe?"
