explanation: "Echarle en cara a alguien algo que hizo o dejó de hacer."
example_sentence: "Cada vez que discuten, le reprocha algo que pasó hace cuatro años."
register: "neutral"
pedantry_risk: 1
usage_tip: "Nombrarlo ayuda a frenarlo: decir «no quiero reprocharte nada» abre una conversación en vez de una lista."
when_not_to_use: "No la uses para una crítica con datos y una petición clara: eso no es echar nada en cara, es pedir un cambio."
collocations:
  - "reprochar algo a alguien"
