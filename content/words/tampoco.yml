        text: "tampoco"
        is_correct: true
      - position: 2
        text: "ni hablar"
        is_correct: false
        distractor_type: "register"
        why_not: "«Ni hablar» es de conversación y expresa negarse a algo, cuando aquí nadie se niega: sencillamente no hubo explicación."
