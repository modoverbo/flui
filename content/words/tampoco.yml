confusions:
  - confused_with: "tan poco"
    difference: "«Tan poco», en dos palabras, mide una cantidad diminuta: «dormí tan poco que me dolía la cabeza». La otra encadena dos negaciones."
    memory_trick: "Una mide cantidad; la otra suma un «no» al anterior."
  - confused_with: "tan pocos"
    difference: "«Tan pocos» cuenta elementos escasos: «vinieron tan pocos que sobró comida». La otra no cuenta nada: niega por segunda vez."
    memory_trick: "Unos se cuentan con los dedos; la otra solo repite el «no»."
exercises:
  - position: 1
    sentence: "No me avisaron del cambio de fecha y {{blank}} me pidieron opinión sobre el sitio."
    hint_general: "Dos faltas seguidas del mismo grupo: la segunda se engancha a la primera."
    explanation: "Tampoco: la segunda falta se suma a la primera. «Tan poco» mediría una cantidad diminuta y «también» convertiría la frase en algo que sí ocurrió."
    options:
      - position: 1
        text: "tan poco"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Tan poco», separado, mide una cantidad muy pequeña, y aquí no se mide nada: se cuenta algo que no pasó."
        hint_specific: "«Tan poco» habla de cantidad. ¿Se mide algo o se encadena una falta con otra?"
      - position: 2
        text: "tampoco"
        is_correct: true
      - position: 3
        text: "también"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«También» sumaría algo que sí ocurrió, y la frase encadena dos cosas que no ocurrieron: ni aviso ni consulta."
        hint_specific: "«También» suma lo que sí pasa. ¿Le pidieron opinión o no se la pidieron?"
  - position: 2
    sentence: "Nadie del equipo sabía lo del cambio de horario, y quien lo firmó {{blank}} lo explicó."
    hint_general: "Al desconocimiento general se le suma un segundo silencio."
    explanation: "Tampoco: al silencio general se suma el de quien firmó. «Ni hablar» sonaría a negativa tajante y «además» presentaría una explicación que sí llegó."
