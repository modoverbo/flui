    title: "El cambio que nadie contó"
    body: "El horario cambió un lunes y el equipo se enteró por el cuadrante de la pared. Perpetua lo dijo en la reunión sin levantar la voz: «No nos avisaron y tampoco nos preguntaron». Dos frases bastaron para que el jefe de turno propusiera un aviso previo por escrito."
    before_phrase: "No nos dijeron nada y encima no nos preguntaron."
    after_phrase: "No nos avisaron y tampoco nos preguntaron."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La semana que no llamé"
    body: "Se había perdido la boda de su prima y llevaba días dándole vueltas. Leandro se lo dijo de frente, sin adornos: «No pude ir y tampoco te llamé. Lo siento». Su prima se quedó callada un segundo y luego propuso un café el jueves."
    before_phrase: "No fui, y llamarte pues no, la verdad, perdona."
    after_phrase: "No pude ir y tampoco te llamé."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "Una ciudad nueva"
    body: "Le preguntaron si se atrevía con el traslado y él contestó sin dramatizar. «No conozco a nadie allí y tampoco hablo el idioma». Lo dijo como quien lee una lista, y el grupo entendió que buscaba ayuda, no compasión. Salieron tres contactos en la misma sobremesa."
    before_phrase: "No conozco a nadie y el idioma pues igual, nada."
    after_phrase: "No conozco a nadie allí y tampoco hablo el idioma."
