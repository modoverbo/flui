register: "neutral"
pedantry_risk: 1
usage_tip: "Enlaza dos faltas con una sola palabra y evita repetir el «no» entero dos veces."
when_not_to_use: "No la uses si la segunda parte es positiva; entonces la frase pide una palabra que sume, no que reste."
