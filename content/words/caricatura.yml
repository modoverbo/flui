explanation: "Imagen de alguien o de algo en la que un detalle se hace enorme y el resto se pierde."
example_sentence: "Aquel resumen era una caricatura del proyecto: solo quedaba el presupuesto."
register: "neutral"
pedantry_risk: 1
usage_tip: "Es útil para avisar de que algo se contó a medias: «eso es una caricatura de lo que pasó» corrige sin acusar."
when_not_to_use: "No la uses para reírte de una persona presente: deformar a alguien delante de todos no es humor, es señalarlo."
collocations:
  - "una caricatura de sí mismo"
  - "hacer una caricatura de algo"
  - "quedar en una caricatura"
replaces:
