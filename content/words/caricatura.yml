confusions:
  - confused_with: "parodia"
    difference: "«Parodia» imita el estilo de una obra o persona entera, con escenas y una historia; esta palabra exagera uno o dos rasgos concretos, sin imitar nada completo."
    memory_trick: "La parodia imita la obra entera; esta palabra exagera un rasgo suelto."
  - confused_with: "retrato"
    difference: "«Retrato» busca representar a alguien tal como es, con fidelidad; esta palabra exagera un rasgo a propósito para burlarse o criticar."
    memory_trick: "El retrato busca parecerse; esta palabra busca exagerar."
exercises:
  - position: 1
    sentence: "El dibujante Saúl hizo una {{blank}} de la reunión: todos con cara de sueño y el proyector apagado por quinta vez."
    hint_general: "Es un dibujo que exagera un rasgo real de la reunión para hacer reír."
    explanation: "Caricatura: un dibujo que exagera un rasgo real para hacer reír. «Caricia» es un gesto de cariño con la mano, sin relación con un dibujo, y «retrato» buscaría fidelidad, no exageración."
    options:
      - position: 1
        text: "caricia"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Caricia» es un gesto de cariño con la mano, y aquí lo que hay es un dibujo que exagera lo aburrida que fue la reunión."
        hint_specific: "«Caricia» es un gesto, no un dibujo. ¿Qué hizo el dibujante: un gesto o una imagen?"
      - position: 2
        text: "caricatura"
        is_correct: true
      - position: 3
        text: "retrato"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Retrato» busca representar la reunión tal como fue, con fidelidad, y aquí el dibujo exagera lo aburrida que fue, sin buscar fidelidad."
        hint_specific: "«Retrato» busca fidelidad. ¿El dibujo busca parecerse exactamente o exagerar?"
  - position: 2
    sentence: "En la fiesta de fin de año, Nadia hizo una {{blank}} del jefe con un megáfono pegado a la boca, y todos se rieron sin que él se enterara."
    hint_general: "Es un dibujo gracioso que exagera un detalle concreto del jefe."
    explanation: "Caricatura: un dibujo gracioso que exagera un detalle concreto. «Efigie» es una imagen solemne, como la de un monumento, y «imitación» copiaría al jefe entero en vez de exagerar solo el megáfono."
    options:
      - position: 1
        text: "efigie"
        is_correct: false
        distractor_type: "register"
        why_not: "«Efigie» es una imagen solemne, como la de una moneda o un monumento, y aquí lo que hay es un dibujo gracioso hecho para reírse, no una imagen seria."
        hint_specific: "«Efigie» suena a monumento serio. ¿El dibujo del jefe busca ser solemne o gracioso?"
      - position: 2
        text: "caricatura"
        is_correct: true
      - position: 3
        text: "imitación"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Imitación» copia algo tal cual, y aquí el dibujo exagera un rasgo concreto del jefe, el megáfono, en vez de copiarlo entero."
        hint_specific: "«Imitación» copia entero. ¿El dibujo copia todo del jefe o exagera solo un detalle?"
