    sentence: "Vestido de villano de telenovela, con bigote exagerado y una capa ridícula, Renzo fue la {{blank}} perfecta de ese tipo de personaje en la fiesta de disfraces."
    hint_general: "Es una imagen que exagera un rasgo físico de un tipo de personaje."
    explanation: "Caricatura: una imagen que exagera un rasgo físico de un tipo de personaje. «Parodia» imitaría el guion y las escenas de una telenovela concreta, y «caricia» es un gesto de cariño, sin nada que ver con un disfraz."
    options:
