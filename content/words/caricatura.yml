    after: "Hizo una caricatura de él"
  - before: "Es una versión ridícula y exagerada de la reunión de ayer"
    after: "Es una caricatura de la reunión de ayer"
  - before: "Contó la historia exagerando cada detalle para hacer reír"
    after: "Contó una caricatura de la historia para hacer reír"
