    after: "Eso es una caricatura de lo que pasó"
  - before: "Lo dejaron en una versión muy deformada"
    after: "Lo dejaron en una caricatura"
  - before: "Se ha convertido en una copia exagerada de lo que era"
    after: "Se ha convertido en una caricatura de lo que era"
family:
