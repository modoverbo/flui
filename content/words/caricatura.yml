readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "El regalo de despedida"
    body: "Antes de irse de la empresa, sus compañeros le regalaron a Ignacio un dibujo enmarcado: él mismo con la taza de café gigante que llevaba a todas partes. «Es la caricatura perfecta», dijo entre risas, y la colgó esa misma tarde en su nueva oficina."
    before_phrase: "Le hicieron un dibujo exagerando su manía de la taza."
    after_phrase: "Le hicieron una caricatura perfecta."
  - position: 2
    scene: "trabajo"
    conversation_type: "practica"
    title: "El mural del pasillo"
    body: "Tomás terminó el mural un viernes por la tarde: todos los jefes con corbatas gigantes y cara de estrés. El lunes, la gente se paraba a mirarlo y a reírse antes de entrar a trabajar. «Es una caricatura, no una crítica», aclaró Tomás cuando alguien preguntó si se iba a meter en problemas."
    before_phrase: "Dibujé algo exagerando un poco a los jefes, para hacer reír."
    after_phrase: "Hice una caricatura de los jefes."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "El dibujo del abuelo"
    body: "Para el cumpleaños de su abuelo, Nico le regaló un dibujo: el abuelo con una lupa enorme buscando sus lentes, que siempre tenía puestos. El abuelo se rio tanto que tuvo que sentarse. «Esta caricatura la voy a enmarcar», dijo, todavía riendo."
    before_phrase: "Le hice un dibujo exagerando la manía de perder los lentes."
    after_phrase: "Le hice una caricatura y no paró de reír."
