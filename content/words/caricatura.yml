ipa_latam: "[ka.ɾi.kaˈtu.ɾa]"
ipa_es: "[ka.ɾi.kaˈtu.ɾa]"
explanation: "Dibujo que hace mucho más grande un detalle real de alguien o algo, para dar gracia o criticar."
example_sentence: "El dibujo era una caricatura del jefe: la corbata enorme y la cara siempre seria."
register: "neutral"
pedantry_risk: 1
usage_tip: "Sirve para hablar de algo que exagera un rasgo real para hacer reír o para criticar con humor."
when_not_to_use: "No la uses para una copia exacta y seria de algo; aquí el punto es la exageración."
collocations:
  - "hacer una caricatura de algo"
  - "una caricatura exagerada"
  - "convertir algo en caricatura"
replaces:
