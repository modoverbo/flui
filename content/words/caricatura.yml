confusions:
  - confused_with: "retrato"
    difference: "Un «retrato» intenta parecerse al conjunto; una caricatura agranda un solo detalle y borra todo lo demás."
    memory_trick: "El retrato se parece; la caricatura señala."
  - confused_with: "criatura"
    difference: "Una «criatura» es un ser vivo; lo otro es una versión deformada de algo o de alguien."
    memory_trick: "La criatura respira; la otra se dibuja."
exercises:
  - position: 1
    sentence: "Al contar la discusión, Mirta convirtió a su cuñado en una {{blank}}: de él solo quedó el gesto de levantar la ceja."
    hint_general: "Una versión deformada en la que sobrevive un solo detalle."
    explanation: "Caricatura: de él solo sobrevive un detalle agrandado. Una «criatura» es un ser vivo, y un «retrato» intentaría parecerse a la persona entera."
    options:
      - position: 1
        text: "criatura"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «criatura» es un ser vivo, y aquí se habla de en qué versión de sí mismo quedó convertido el cuñado."
        hint_specific: "Una «criatura» respira. ¿Mirta creó un ser o deformó una imagen?"
      - position: 2
        text: "caricatura"
        is_correct: true
      - position: 3
        text: "retrato"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Un «retrato» intenta parecerse a la persona entera, y de él solo quedó una ceja."
        hint_specific: "Un «retrato» recoge el conjunto. ¿Cuánto quedó del cuñado en ese relato?"
  - position: 2
    sentence: "Bautista hizo de su vecino una {{blank}} tan marcada que el propio vecino se rio al verse reducido a dos manías."
    hint_general: "Le agrandó dos detalles y dejó fuera todo lo demás."
    explanation: "Caricatura: agrandó dos detalles y dejó fuera lo demás. «Payasada» es coloquial y acusa de hacer el tonto, y una «imitación» copiaría tal cual, sin deformar."
    options:
      - position: 1
        text: "payasada"
        is_correct: false
        distractor_type: "register"
        why_not: "«Payasada» es coloquial y acusa de hacer el tonto, y aquí hay un trabajo deliberado de agrandar dos rasgos."
        hint_specific: "«Payasada» desprecia lo que alguien hace. ¿La frase lo desprecia o lo describe?"
      - position: 2
        text: "imitación"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «imitación» busca copiar tal cual, y lo que hace Bautista es agrandar dos manías hasta que se noten."
        hint_specific: "Una «imitación» quiere parecerse. ¿Aquí se busca parecido o exageración?"
      - position: 3
        text: "caricatura"
        is_correct: true
  - position: 3
    sentence: "De aquella tarde de tres horas, lo que se cuenta hoy es una {{blank}}: dos frases agrandadas y todo lo demás fuera."
    hint_general: "Quedó una versión deformada por dejar fuera casi todo."
    explanation: "Caricatura: quedó una versión deformada al dejar fuera casi todo. Una «exageración» agranda sin borrar el resto, y un «resumen» acorta sin deformar nada."
    options:
      - position: 1
        text: "exageración"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «exageración» agranda algo pero mantiene el resto, y aquí todo lo demás quedó fuera."
        hint_specific: "Una «exageración» conserva el conjunto. ¿Qué pasó con el resto de la tarde?"
      - position: 2
        text: "caricatura"
        is_correct: true
      - position: 3
        text: "resumen"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Un «resumen» acorta sin deformar, y lo que queda aquí son dos frases agrandadas fuera de proporción."
        hint_specific: "Un «resumen» respeta las proporciones. ¿Se respetaron aquí?"
  - position: 4
    sentence: "El monólogo no imitaba ninguna obra conocida: era una {{blank}} del trabajo de oficina, con la impresora como gran protagonista."
    hint_general: "Agranda un solo elemento de una realidad hasta que se vuelve gracioso."
    explanation: "Caricatura: agranda un elemento de la realidad hasta hacerlo gracioso. Una «parodia» imita una obra conocida, y «pantomima» suena a farsa fingida."
    options:
      - position: 1
        text: "parodia"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «parodia» imita una obra que el público reconoce, y la frase dice que no imitaba ninguna obra."
        hint_specific: "Una «parodia» necesita un original conocido. ¿Cuál sería aquí?"
      - position: 2
        text: "pantomima"
        is_correct: false
        distractor_type: "register"
        why_not: "«Pantomima» suena a farsa montada para aparentar, y esto es un retrato deformado del trabajo de oficina."
        hint_specific: "«Pantomima» acusa de fingir algo. ¿Quién finge en el monólogo?"
      - position: 3
        text: "caricatura"
        is_correct: true
  - position: 5
    sentence: "Cuando Perla vio el dibujo, se rio: la nariz ocupaba media hoja y el resto de ella cabía en un rincón; era una {{blank}} perfecta."
    hint_general: "Un detalle ocupa casi todo y lo demás desaparece."
    explanation: "Caricatura: un detalle ocupa casi todo y lo demás desaparece. Una «criatura» sería un ser vivo, y un «retrato» habría respetado las proporciones."
    options:
      - position: 1
        text: "caricatura"
        is_correct: true
      - position: 2
        text: "criatura"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «criatura» es un ser vivo, y lo que Perla está mirando es un dibujo con las proporciones cambiadas."
        hint_specific: "Una «criatura» está viva. ¿Qué tiene Perla delante?"
      - position: 3
        text: "retrato"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Un «retrato» respeta las proporciones de la persona, y aquí la nariz ocupa media hoja."
        hint_specific: "Un «retrato» guarda las proporciones. ¿Se guardan en ese dibujo?"
  - position: 6
    sentence: "Tanto repitió el mismo chiste en cada cena que acabó siendo una {{blank}} de aquel Ismael divertido que todos recordaban."
    hint_general: "Se quedó en una versión suya reducida a un único rasgo repetido."
    explanation: "Caricatura: se quedó reducido a un único rasgo repetido. «Payasada» juzgaría el chiste como una tontería, y una «imitación» copiaría a otra persona, no a sí mismo."
    options:
      - position: 1
        text: "payasada"
        is_correct: false
        distractor_type: "register"
        why_not: "«Payasada» es coloquial y juzga el chiste como una tontería, y aquí lo que se describe es en qué quedó convertido él."
        hint_specific: "«Payasada» valora un acto suelto. ¿La frase habla del chiste o de en qué se convirtió Ismael?"
      - position: 2
        text: "caricatura"
        is_correct: true
      - position: 3
        text: "imitación"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «imitación» copia a otra persona, y él se repite a sí mismo hasta quedarse en un solo rasgo."
        hint_specific: "Una «imitación» necesita a otro. ¿A quién estaría copiando Ismael?"
  - position: 7
    sentence: "Lo que le contaron a Vera del vecindario era una {{blank}}: cuatro rarezas agrandadas y ni una palabra de la gente que la ayudó al mudarse."
    hint_general: "Le pintaron el barrio con cuatro rasgos hinchados y nada más."
    explanation: "Caricatura: le pintaron el barrio con cuatro rasgos hinchados. Una «exageración» habría mantenido el resto, y una «parodia» imitaría algo que ya existe como obra."
    options:
      - position: 1
        text: "exageración"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «exageración» hincha algo sin borrar lo demás, y aquí no quedó ni una palabra de la gente que la ayudó."
        hint_specific: "Una «exageración» deja el resto en pie. ¿Qué pasó con la parte buena del barrio?"
      - position: 2
        text: "parodia"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «parodia» imita una obra conocida con humor, y esto es una descripción deformada de un barrio real."
        hint_specific: "Una «parodia» se apoya en algo ya hecho. ¿Qué obra se estaría imitando?"
      - position: 3
        text: "caricatura"
        is_correct: true
  - position: 8
    sentence: "Antes de firmar, Tadeo avisó: «Ese informe es una {{blank}} de mi trabajo; falta todo lo que salió bien»."
    hint_general: "Avisa de que el documento agranda un fallo y esconde el resto."
    explanation: "Caricatura: el informe agranda un fallo y esconde el resto. Un «retrato» recogería el conjunto, y «pantomima» acusaría a alguien de fingir."
    options:
      - position: 1
        text: "retrato"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Un «retrato» recogería el conjunto del trabajo, y él avisa de que falta todo lo que salió bien."
        hint_specific: "Un «retrato» incluye lo bueno y lo malo. ¿Qué dice Tadeo que falta?"
      - position: 2
        text: "caricatura"
        is_correct: true
      - position: 3
        text: "pantomima"
        is_correct: false
        distractor_type: "register"
        why_not: "«Pantomima» acusaría a alguien de fingir, y lo que Tadeo señala es que el informe está desproporcionado."
        hint_specific: "«Pantomima» acusa de teatro. ¿Tadeo dice que mienten o que exageran un fallo?"
readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "La nariz de media hoja"
    body: "En la feria del barrio había un puesto de dibujos rápidos. Perla se sentó y salió con una nariz que ocupaba media hoja. «Es una caricatura», le explicó el dibujante, «no un retrato». Ella lo colgó en la cocina y todavía hoy se ríe cada mañana."
    before_phrase: "Me han dibujado con la nariz enorme."
    after_phrase: "Es una caricatura, no un retrato."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Cómo se cuenta la discusión"
    body: "Mirta contaba la discusión con su cuñado y siempre acababa igual: la ceja levantada, la voz alta, nada más. Un día su hija le dijo: «Mamá, eso es una caricatura suya, no es él». Mirta se quedó callada. La siguiente vez añadió que también había traído el pan."
    before_phrase: "Siempre lo cuento exagerando lo malo."
    after_phrase: "Estaba haciendo una caricatura suya."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El informe corto"
    body: "El resumen de la temporada cabía en media página y solo hablaba del retraso. Tadeo lo leyó dos veces antes de responder. «Es una caricatura del trabajo del equipo: falta todo lo que salió bien», escribió. Le pidieron tres líneas más y se las dio."
    before_phrase: "Ese informe está muy exagerado y falta todo lo demás."
    after_phrase: "Ese informe es una caricatura de mi trabajo."
