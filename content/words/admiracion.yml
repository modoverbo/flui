confusions:
  - confused_with: "admisión"
    difference: "«Admisión» es aceptar a alguien o algo en un lugar, como una universidad; la admiración es un sentimiento hacia una cualidad o un logro de alguien."
    memory_trick: "La admisión abre una puerta; la admiración se siente por dentro."
  - confused_with: "envidia"
    difference: "«Envidia» es querer lo que tiene otra persona, con algo de rabia; la admiración es valorarlo sin ese rencor."
exercises:
