    body: "En la despedida de soltera, Selene tomó el micrófono: «Quiero brindar por la persona que dejó todo para abrir su propio negocio sin red de seguridad». Todas aplaudieron. «Le tengo una admiración enorme», dijo después, ya sin micrófono."
