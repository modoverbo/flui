    sentence: "Tobías siente una {{blank}} enorme por la forma en que su amigo volvió a estudiar a los cuarenta sin quejarse nunca."
    hint_general: "Es valorar mucho algo que alguien hace o cómo es, sin exagerar ni idealizarlo."
    explanation: "Admiración: valorar mucho algo que alguien hace, sin exagerar. «Admisión» es aceptar a alguien en un lugar, como una universidad, y aquí no hay ningún trámite de ese tipo; «adoración» es mucho más intensa, casi idealizar a la persona, y aquí Tobías solo valora un logro concreto."
