    conversation_type: "emocional"
    title: "La paciencia de siempre"
    body: "Renzo veía a su hermana lidiar con tres trabajos y nunca perder la calma con nadie. Una noche se lo dijo: «No sé cómo lo haces sin quejarte nunca». Ella se rio: «Créeme que me quejo, solo que no delante de ustedes». Aun así, la admiración de Renzo no cambió."
    before_phrase: "No sé cómo aguantas todo eso sin quejarte."
    after_phrase: "Le tengo mucha admiración por cómo aguanta todo."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "La idea que nadie más tuvo"
    body: "Cuando Perla propuso reorganizar todo el proceso del equipo, la mitad pensó que fracasaría. Funcionó mejor de lo esperado. Un compañero le escribió: «Tienes toda mi admiración, nadie más se hubiera atrevido a proponer eso»."
    before_phrase: "Qué bien se te ocurrió eso, en serio."
    after_phrase: "Tienes toda mi admiración."
