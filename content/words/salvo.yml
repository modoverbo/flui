confusions:
  - confused_with: "salva"
    difference: "«Salva» nombra una tanda de aplausos o de disparos de saludo: «una salva de aplausos». La otra solo aparta un caso de una lista."
    memory_trick: "Una suena fuerte; la otra resta en silencio."
  - confused_with: "salvedad"
    difference: "«Salvedad» es un sustantivo y pide artículo: «con una salvedad». La otra enlaza directamente la regla con el caso apartado."
    memory_trick: "Una necesita artículo; la otra va sola delante del caso."
exercises:
  - position: 1
    sentence: "Vienen todos a la cena del sábado, {{blank}} Rubén, que ya avisó de que no puede."
    hint_general: "Una persona se queda fuera de la lista, y el resto sigue en pie."
    explanation: "Salvo: aparta a quien no viene sin tocar al resto. «Incluso» lo metería en la lista y «salva» nombraría una tanda de aplausos."
    options:
      - position: 1
        text: "incluso"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Incluso» mete a alguien dentro de la lista, y él ya avisó de que no va: la frase lo deja fuera."
        hint_specific: "«Incluso» suma un caso extremo que sí cuenta. ¿Rubén cuenta o no cuenta para esa cena?"
      - position: 2
        text: "salvo"
        is_correct: true
      - position: 3
        text: "salva"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Salva» nombra una tanda de aplausos o de disparos, y en esta frase no suena nada: se ajusta una lista de invitados."
        hint_specific: "«Salva» tiene que ver con aplausos o disparos. ¿Suena algo así en esa cena?"
  - position: 2
    sentence: "La oficina abre de lunes a viernes, {{blank}} los festivos, cuando no entra nadie ni a por el correo."
    hint_general: "Unos días concretos quedan fuera del horario normal."
    explanation: "Salvo: aparta los festivos del horario general. «Quitando» es de conversación y suena a restar cosas, y «además» sumaría días en vez de apartarlos."
    options:
      - position: 1
        text: "salvo"
        is_correct: true
      - position: 2
        text: "quitando"
        is_correct: false
        distractor_type: "register"
        why_not: "«Quitando» es de conversación y suena a ir restando cosas de un montón, cuando un horario de oficina se escribe con más limpieza."
        hint_specific: "«Quitando» suena a hablar deprisa en una barra. ¿Este horario busca ese tono?"
      - position: 3
        text: "además"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Además» suma días al horario, y los festivos hacen lo contrario: son los días en que la oficina no abre."
        hint_specific: "«Además» amplía una lista. ¿Los festivos amplían el horario o lo recortan?"
  - position: 3
    sentence: "Acepto cualquier fecha para la mudanza, {{blank}} el fin de semana del puente, que ya lo tengo ocupado."
    hint_general: "Todas las fechas valen menos una, y esa ya tiene dueño."
    explanation: "Salvo: aparta el único fin de semana imposible. «Salvedad» es un sustantivo que pide artículo y «sobre todo» destacaría esa fecha en vez de descartarla."
    options:
      - position: 1
        text: "salvedad"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Salvedad» es un sustantivo y necesita artículo delante («con una salvedad»), así que no puede enlazar la frase por sí solo."
        hint_specific: "«Salvedad» funciona como nombre y pide artículo. ¿Encaja un nombre suelto en ese hueco?"
      - position: 2
        text: "sobre todo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sobre todo» destacaría ese fin de semana como el mejor, y la frase dice justo lo contrario: es el único descartado."
        hint_specific: "«Sobre todo» pone el foco en lo preferido. ¿Ese puente es la mejor fecha o la única imposible?"
      - position: 3
        text: "salvo"
        is_correct: true
  - position: 4
    sentence: "El museo permite hacer fotos en todas las plantas, {{blank}} en la del sótano, donde está prohibido."
