readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Una línea en el presupuesto"
    body: "El cliente llamaba cada semana para preguntar lo mismo. Jimena reescribió el documento con una sola frase: «El presupuesto cubre los materiales, salvo la mano de obra». Las llamadas pararon. Su jefe copió esa línea en las tres propuestas siguientes."
    before_phrase: "Cubre los materiales, quitando la mano de obra, claro."
    after_phrase: "Cubre los materiales, salvo la mano de obra."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "La cena que casi no fue"
    body: "El grupo llevaba días proponiendo fechas y descartándolas. Casilda cortó el hilo con una frase corta: «Me viene bien cualquier día, salvo el puente». En diez minutos había fecha, sitio y hora. Nadie tuvo que leer treinta mensajes."
    before_phrase: "Cualquier día, o sea, menos el puente, que no puedo."
    after_phrase: "Me viene bien cualquier día, salvo el puente."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "El teléfono del domingo"
    body: "Llevaba meses contestando mensajes a cualquier hora y en casa se notaba. Anselmo puso el límite en una sola frase, sin pedir permiso: «Contesto a cualquier hora, salvo los domingos». Su hija le preguntó si eso se podía hacer. Él dijo que sí y apagó el teléfono."
    before_phrase: "Contesto siempre, bueno, menos los domingos, si puedo."
    after_phrase: "Contesto a cualquier hora, salvo los domingos."
