        is_correct: true
readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "El cierre de la presentación"
    body: "Sus presentaciones se alargaban y la gente miraba el reloj. Segismundo aprendió a avisar de que llegaba el cierre: «Finalmente, tres cosas que decidimos hoy». Las cabezas se levantaron a la vez. Desde entonces sus reuniones terminan con la sala despierta."
    before_phrase: "Y bueno, ya para acabar, pues eso, tres cosas."
    after_phrase: "Finalmente, tres cosas que decidimos hoy."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "Ocho meses de pisos"
    body: "El grupo llevaba medio año oyendo hablar de visitas y metros cuadrados. Cuando por fin cerraron la compra, Maravillas lo contó sin rodeos: «Miramos pisos ocho meses y finalmente nos quedamos con el del segundo». Hubo brindis y ni una pregunta más."
    before_phrase: "Estuvimos ocho meses y al final cogimos el del segundo."
    after_phrase: "Miramos ocho meses y finalmente nos quedamos con el del segundo."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "La silla vacía"
    body: "Cocinaba, servía y recogía sin sentarse nunca con los demás. Un domingo, Herminio anunció su propio cierre en voz alta: «Y finalmente me siento con todos». Nadie se rio: le hicieron sitio y esperaron a que llenara el plato."
    before_phrase: "Y ya al final me siento un rato, si me da tiempo."
    after_phrase: "Y finalmente me siento con todos."
