confusions:
  - confused_with: "fatalmente"
    difference: "«Fatalmente» dice que algo salió muy mal o que era inevitable. La otra no juzga el resultado: solo marca el último paso."
    memory_trick: "Una lamenta el desenlace; la otra solo lo coloca en la fila."
  - confused_with: "formalmente"
    difference: "«Formalmente» indica que algo se hizo por la vía oficial: «quedó formalmente aprobado». La otra habla del orden, no del trámite."
    memory_trick: "Una mira el sello; la otra mira el reloj."
exercises:
  - position: 1
    sentence: "Después de tres reuniones y dos borradores, {{blank}} firmamos el contrato el jueves."
    hint_general: "La firma es el último paso de una lista larga y cierra el asunto."
    explanation: "Finalmente: la firma cierra la serie. «Fatalmente» daría por malo el desenlace e «inicialmente» devolvería la firma al principio de todo."
    options:
      - position: 1
        text: "fatalmente"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Fatalmente» daría por malo el desenlace, y firmar el contrato después de tanto trabajo es justo la buena noticia."
        hint_specific: "«Fatalmente» carga la frase de desgracia. ¿La firma es un disgusto o un logro?"
      - position: 2
        text: "finalmente"
        is_correct: true
      - position: 3
        text: "inicialmente"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Inicialmente» devolvería la firma al principio, y la frase la coloca después de tres reuniones y dos borradores."
        hint_specific: "«Inicialmente» marca el arranque. ¿La firma abre la historia o la cierra?"
  - position: 2
    sentence: "Probamos cuatro rutas distintas y {{blank}} elegimos la que pasa por el puerto."
    hint_general: "Tras probarlas todas, queda una sola decisión que cierra la búsqueda."
    explanation: "Finalmente: la elección cierra la búsqueda. «Al final» es de conversación y sugiere sorpresa, y «previamente» pondría la elección antes de las pruebas."
    options:
      - position: 1
        text: "finalmente"
        is_correct: true
      - position: 2
        text: "al final"
        is_correct: false
        distractor_type: "register"
        why_not: "«Al final» es de conversación y da a entender que la cosa salió distinta de lo previsto, y aquí solo se cierra una prueba ordenada."
        hint_specific: "«Al final» suena a giro inesperado. ¿Hubo sorpresa o hubo método?"
      - position: 3
        text: "previamente"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Previamente» pondría la elección antes de probar las rutas, y la frase la coloca después de las cuatro pruebas."
        hint_specific: "«Previamente» mira hacia atrás. ¿Se eligió antes de probar o después?"
  - position: 3
    sentence: "Pintamos el salón, cambiamos los muebles de sitio y {{blank}} colgamos las cortinas nuevas."
    hint_general: "Las cortinas son el último paso de una reforma con varias etapas."
    explanation: "Finalmente: las cortinas cierran la reforma. «Formalmente» hablaría de un trámite oficial y «entretanto» metería las cortinas en mitad del proceso."
    options:
      - position: 1
        text: "formalmente"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Formalmente» indica que algo se hizo por la vía oficial, y colgar unas cortinas no pasa por ningún registro."
        hint_specific: "«Formalmente» tiene que ver con trámites. ¿Hay papeleo o hay una reforma de casa?"
      - position: 2
        text: "finalmente"
        is_correct: true
      - position: 3
        text: "entretanto"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Entretanto» metería las cortinas en mitad del proceso, y la frase las guarda para el último paso."
        hint_specific: "«Entretanto» ocupa una espera. ¿Las cortinas van en medio o cierran la lista?"
  - position: 4
    sentence: "El proyecto pasó por tres jefes distintos y {{blank}} salió adelante con el cuarto."
    hint_general: "El cuarto jefe es el último eslabón de una historia larga."
    explanation: "Finalmente: el cuarto jefe cierra la historia. «Total, que» resume con desgana y «paralelamente» pondría a los cuatro jefes a la vez."
    options:
      - position: 1
        text: "finalmente"
        is_correct: true
      - position: 2
        text: "total, que"
        is_correct: false
        distractor_type: "register"
        why_not: "«Total, que» es de conversación y resume la historia quitándole importancia, cuando aquí el proyecto sí llegó a puerto."
        hint_specific: "«Total, que» remata una anécdota con desgana. ¿Se resta valor o se celebra el cierre?"
      - position: 3
        text: "paralelamente"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Paralelamente» pondría a los cuatro jefes trabajando a la vez, y la frase los coloca uno detrás de otro."
        hint_specific: "«Paralelamente» junta dos cosas en el mismo rato. ¿Los jefes coinciden o se suceden?"
  - position: 5
    sentence: "Miramos pisos durante ocho meses y {{blank}} nos quedamos con el del segundo."
    hint_general: "La elección cierra una búsqueda que duró casi un año."
    explanation: "Finalmente: la elección cierra la búsqueda. «Fatalmente» daría por malo el resultado y «además» sumaría el piso a otros que no se compraron."
    options:
      - position: 1
        text: "fatalmente"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Fatalmente» daría por malo el resultado, y quedarse con el piso elegido es el buen desenlace de la búsqueda."
        hint_specific: "«Fatalmente» carga la frase de desgracia. ¿Comprar ese piso es una pena o un acierto?"
      - position: 2
        text: "además"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Además» sumaría ese piso a otros comprados, y la frase cuenta que solo se quedaron con uno."
        hint_specific: "«Además» alarga la lista. ¿Compraron varios o cerraron con uno?"
      - position: 3
        text: "finalmente"
        is_correct: true
  - position: 6
    sentence: "Cocinó, puso la mesa, recibió a los invitados y {{blank}} se sentó a cenar con ellos."
    hint_general: "Sentarse es lo último que hace después de toda la faena."
    explanation: "Finalmente: sentarse cierra la faena. «Al final» es de conversación y sugiere un giro, y «en cambio» opondría sentarse a todo lo anterior."
    options:
      - position: 1
        text: "al final"
        is_correct: false
        distractor_type: "register"
        why_not: "«Al final» es de conversación y sugiere que la cosa salió distinta de lo previsto, y aquí todo fue según el plan."
        hint_specific: "«Al final» suena a giro inesperado. ¿Hubo sorpresa o siguió el plan?"
      - position: 2
        text: "finalmente"
        is_correct: true
      - position: 3
        text: "en cambio"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«En cambio» opondría el sentarse a todo lo anterior, y sentarse es el último paso de la misma lista."
        hint_specific: "«En cambio» marca contraste. ¿Sentarse choca con lo anterior o lo remata?"
  - position: 7
    sentence: "Repitió la prueba tres veces con el mismo cronómetro y {{blank}} consiguió el tiempo que buscaba."
    hint_general: "El cuarto intento es el que cierra la serie con éxito."
    explanation: "Finalmente: el último intento cierra la serie. «Formalmente» hablaría de un trámite oficial e «inicialmente» devolvería el logro al primer intento."
    options:
      - position: 1
        text: "finalmente"
        is_correct: true
      - position: 2
        text: "formalmente"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Formalmente» indica que algo se hizo por la vía oficial, y aquí no hay trámite: hay un cronómetro y cuatro intentos."
        hint_specific: "«Formalmente» tiene que ver con trámites. ¿Hay papeleo o hay carrera?"
      - position: 3
        text: "inicialmente"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Inicialmente» devolvería el logro al primer intento, y la frase cuenta que llegó después de repetir tres veces."
        hint_specific: "«Inicialmente» marca el arranque. ¿El tiempo bueno llegó al principio o al cabo?"
  - position: 8
    sentence: "Escribió el texto, lo dejó reposar una semana y {{blank}} lo envió sin releerlo más."
    hint_general: "El envío es el último movimiento, después de escribir y esperar."
    explanation: "Finalmente: el envío cierra el proceso. «Total, que» resume con desgana y «previamente» pondría el envío antes de escribir el texto."
    options:
      - position: 1
        text: "previamente"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Previamente» pondría el envío antes de escribir, y la frase lo coloca al final, después de la semana de reposo."
        hint_specific: "«Previamente» mira hacia atrás. ¿Se envía antes de escribir o al cabo?"
      - position: 2
        text: "total, que"
        is_correct: false
        distractor_type: "register"
        why_not: "«Total, que» es de conversación y resume una historia quitándole importancia, cuando aquí se describe un método cuidado."
        hint_specific: "«Total, que» remata con desgana. ¿Se resta valor al proceso o se cierra con orden?"
      - position: 3
