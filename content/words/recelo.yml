    body: "Después de que su hermano le pidiera perdón por una pelea vieja, Norma seguía tratándolo con cierta distancia. «Todavía siento recelo», le dijo a su madre, «quiero creerle, pero necesito tiempo». Su madre asintió: «Está bien, no tienes que confiar de golpe»."
    before_phrase: "Quiero creerle, pero algo en mí no termina de confiar."
    after_phrase: "Todavía siento recelo, necesito tiempo."
  - position: 3
