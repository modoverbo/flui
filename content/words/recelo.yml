    title: "El nuevo del grupo"
    body: "Cuando Jimena empezó a salir con el grupo de su pareja, notó que uno de ellos siempre cambiaba de tema cuando ella hacía preguntas. «Le tengo un poco de recelo», le confesó a su pareja, «no sé bien por qué». Con el tiempo entendió que esa persona era así con todos, no solo con ella."
