    title: "El compañero demasiado amable"
    body: "Cuando un compañero nuevo empezó a ofrecerse para todo sin que nadie se lo pidiera, Ismael comentó con otra colega: «Le tengo un poco de recelo, nadie es tan generoso sin motivo». Semanas después entendió que solo era su forma de ser."
    before_phrase: "Algo no me cuadra con tanta amabilidad de golpe."
    after_phrase: "Le tengo un poco de recelo, nadie es tan generoso sin motivo."
