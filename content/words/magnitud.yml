    title: "Dos clientes y cien"
    body: "En la asamblea del mercado se juntaron dos avisos para el mismo lunes. Alguien propuso atender el primero por orden de llegada. Olga lo frenó: «Llegan a la vez, pero no tienen la misma magnitud: dos puestos y cien». Empezaron por los cien."
    before_phrase: "Los dos son urgentes, vamos por orden."
    after_phrase: "No tienen la misma magnitud: dos y cien."
