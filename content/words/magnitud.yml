    body: "La reunión llevaba veinte minutos de «esto es gravísimo» y «esto no es nada». Olga abrió la hoja. «Nadie discute el problema; discutimos la magnitud. Son cuatro casos, no cuarenta». A partir de ahí hablaron de qué hacer con cuatro."
