confusions:
  - confused_with: "locuaz"
    difference: "«Locuaz» dice que alguien habla mucho y con facilidad; la otra palabra dice que lo que habla mueve a quien escucha."
    memory_trick: "El locuaz llena el tiempo; el otro llena la sala."
  - confused_with: "vehemente"
    difference: "«Vehemente» describe a quien habla con mucha pasión y calor; la otra palabra no promete calor, promete efecto."
    memory_trick: "El vehemente sube el tono; el otro cambia la decisión."
exercises:
  - position: 1
    sentence: "Eulalia habló dos minutos y estuvo tan {{blank}} que el comité aprobó la idea sin pedir más datos."
    hint_general: "Con muy poco tiempo consiguió que le dijeran que sí."
    explanation: "Elocuente: consiguió el sí en dos minutos. «Locuaz» diría que habla mucho, justo lo contrario, y «charlatana» es coloquial y acusa de vender humo."
    options:
      - position: 1
        text: "locuaz"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Locuaz» dice que alguien habla mucho, y lo llamativo aquí es que le bastaron dos minutos."
        hint_specific: "El locuaz no para de hablar. ¿Cuánto tiempo usó Eulalia?"
      - position: 2
        text: "elocuente"
        is_correct: true
      - position: 3
        text: "charlatana"
        is_correct: false
        distractor_type: "register"
        why_not: "«Charlatana» es coloquial y acusa de vender humo, y aquí un comité aprueba la idea después de escucharla."
        hint_specific: "A un charlatán se le ve el truco. ¿El comité se sintió engañado?"
  - position: 2
    sentence: "Bernardo no levantó la voz ni una vez y aun así resultó {{blank}}: la sala votó con él."
    hint_general: "Sin gritar, consiguió que la sala lo siguiera."
    explanation: "Elocuente: sin gritar, la sala lo siguió. «Vehemente» describe a quien habla con calor y pasión, y «correcto» solo dice que no cometió fallos."
    options:
      - position: 1
        text: "elocuente"
        is_correct: true
      - position: 2
        text: "vehemente"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Vehemente» describe a quien habla con mucho calor, y la frase dice que no levantó la voz ni una vez."
        hint_specific: "Lo vehemente sube de tono. ¿Cuántas veces levantó la voz Bernardo?"
      - position: 3
        text: "correcto"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Correcto» solo dice que no cometió fallos, y aquí lo que ocurre es que la sala cambia su voto."
        hint_specific: "Lo correcto no mueve a nadie. ¿Qué hizo la sala al final?"
  - position: 3
    sentence: "Aquella carta de dos párrafos resultó más {{blank}} que el discurso de una hora del día anterior."
    hint_general: "Dos párrafos movieron más que sesenta minutos de palabras."
    explanation: "Elocuente: dos párrafos movieron más que una hora. «Locuaz» habla de cantidad, y «pomposa» acusa de adornar para impresionar."
    options:
