  - position: 5
    sentence: "Nazaret casi nunca habla en grupo, pero el día del homenaje estuvo {{blank}} y la sala se puso de pie."
    hint_general: "Ese día sus palabras levantaron a toda la sala."
    explanation: "Elocuente: sus palabras levantaron a la sala. «Locuaz» diría que habla mucho, y ella casi nunca habla, y «sincera» solo diría que dijo la verdad."
