readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Dos minutos"
    body: "Eulalia tenía el último turno y quince diapositivas preparadas. Vio la hora, cerró el portátil y habló dos minutos: qué problema había, qué costaba y qué proponía. «Estuviste elocuente», le dijo después su jefa. «Y eso que no enseñaste ni una imagen»."
    before_phrase: "Creo que me expliqué bastante bien, ¿no?"
    after_phrase: "Estuve elocuente sin enseñar una sola imagen."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "El día del homenaje"
    body: "Nazaret nunca habla en las comidas de familia; se sienta al lado de la cocina y escucha. En el homenaje a su madre pidió un minuto y contó una escena de un verano. Cuando terminó, la sala estaba de pie. «Qué elocuente, tía», le dijo su sobrino."
    before_phrase: "Qué bien lo has contado, de verdad."
    after_phrase: "Has estado elocuente."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "La carta de dos párrafos"
    body: "La comunidad llevaba meses discutiendo lo del patio. Celia escribió dos párrafos en el grupo: lo que costaba, lo que ganaban y una fecha. «Más elocuente que la reunión de hora y media», contestó un vecino. Se votó al día siguiente."
    before_phrase: "Lo ha explicado en dos líneas y se entiende todo."
    after_phrase: "Dos párrafos más elocuentes que una reunión entera."
