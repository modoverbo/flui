        distractor_type: "paronym"
        why_not: "«Vehemente» describe a quien se acalora al hablar, y aquí lo que se cuenta es a quién termina convenciendo."
        hint_specific: "Lo vehemente se mide en temperatura. ¿Qué mide la frase: el calor o el efecto?"
      - position: 2
        text: "expresivo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Expresivo» habla de gestos y caras, y la frase cuenta que los escépticos se quedan escuchando lo que dice."
        hint_specific: "Lo expresivo se ve en la cara. ¿Qué cambia en quienes lo escuchan?"
      - position: 3
        text: "elocuente"
