stressed_syllable: 2
ipa_latam: "[konˈke]"
ipa_es: "[konˈke]"
explanation: "Une lo que acabas de saber con la decisión que sacas de ello."
example_sentence: "Ya están las tres firmas, conque cerramos el acuerdo esta misma semana."
register: "neutral"
pedantry_risk: 1
usage_tip: "Funciona en voz alta: anuncia la decisión sin que suene a orden ni a discurso."
when_not_to_use: "No la uses para dar el motivo de algo; ahí toca «porque», que mira hacia atrás."
collocations:
  - "conque adelante"
  - "conque decidido"
  - "conque nada de excusas"
replaces:
  - before: "O sea que ya podemos empezar"
    after: "Conque ya podemos empezar"
  - before: "Entonces vamos a firmarlo"
    after: "Conque vamos a firmarlo"
  - before: "Y eso, que al final salió bien"
    after: "Conque al final salió bien"
family: []
themes:
