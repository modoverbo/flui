  - position: 3
    sentence: "En vez de pedirlo, Julián lo {{blank}} tres veces durante la cena y al final nadie entendió qué quería."
    hint_general: "Lanza la idea a medias varias veces y no consigue que nadie la capte."
    explanation: "Insinuó: lanzó la idea a medias y nadie la captó. «Instruyó» es enseñar o dar órdenes, y «proclamó» sería anunciarlo en voz alta y solemne."
