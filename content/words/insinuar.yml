        text: "insinuando"
        is_correct: true
      - position: 2
        text: "intuyendo"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Intuir» es darse cuenta de algo por dentro; aquí lo que se discute es lo que la otra parte está diciendo."
        hint_specific: "«Intuir» ocurre dentro de alguien. ¿Héctor pregunta por lo que piensas o por lo que dices?"
      - position: 3
        text: "afirmando"
