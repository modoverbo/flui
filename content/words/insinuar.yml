  - position: 2
    sentence: "«¿Me estás {{blank}} que llegué tarde?», preguntó Héctor, que prefería comprobarlo antes de enfadarse."
    hint_general: "Pregunta si le están diciendo algo a medias en lugar de decírselo claro."
    explanation: "Insinuando: sospecha que se lo dicen a medias. «Intuyendo» sería que la otra parte lo nota por dentro, y «afirmando» sería decirlo con todas las letras."
