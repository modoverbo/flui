confusions:
  - confused_with: "insistir"
    difference: "«Insistir» es repetir algo hasta que se oiga; la otra palabra es dejarlo caer una vez y esperar a que lo capten."
    memory_trick: "Quien insiste repite; quien insinúa deja caer."
  - confused_with: "intuir"
    difference: "«Intuir» es darse cuenta de algo por dentro, sin pruebas; aquí alguien lanza la idea hacia fuera, a medias."
    memory_trick: "Intuyes lo que recibes; insinúas lo que lanzas."
exercises:
