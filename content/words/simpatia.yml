confusions:
  - confused_with: "carisma"
    difference: "El «carisma» arrastra y hace que la gente quiera seguirte; la simpatía solo hace que estén a gusto contigo."
    memory_trick: "El carisma atrae; la simpatía acoge."
  - confused_with: "empatía"
    difference: "La «empatía» es entender lo que siente el otro; la simpatía es un trato que lo pone cómodo, aunque no sepas nada de él."
    memory_trick: "La empatía entiende; la simpatía acompaña."
exercises:
