explanation: "Forma de tratar a la gente que hace que los demás estén a gusto muy rápido."
example_sentence: "Su simpatía puso a hablar a una mesa de desconocidos en diez minutos."
register: "neutral"
pedantry_risk: 1
usage_tip: "Es un elogio preciso para otra persona: nombra el trato, no el carácter, y no obliga a nadie a ser divertido."
when_not_to_use: "No la uses cuando quieras decir que alguien entendió lo que sentías: eso es entender, no agradar."
collocations:
