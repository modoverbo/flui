readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "La mesa nueve"
    body: "En la boda le tocó la mesa de los desconocidos. Gael preguntó de qué conocía cada uno a los novios y no volvió a hablar de sí mismo hasta el postre. A la media hora la mesa entera discutía sobre el mejor viaje en tren de su vida. «Qué simpatía tiene este chico», dijo alguien al levantarse."
    before_phrase: "Cae bien a todo el mundo."
    after_phrase: "Qué simpatía tiene."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Dos horas de anfitrión"
    body: "Mi padre llevaba dos horas siendo correcto con todos y nadie hablaba. Entonces llegó mi tía, se sentó y preguntó quién había traído el pan de la panadería de la esquina. La mesa se soltó de golpe. «No es que yo sea seco», dijo él después, «es que tu tía tiene una simpatía que yo no tengo»."
    before_phrase: "Yo soy más seco y ella cae mejor."
    after_phrase: "Tu tía tiene una simpatía que yo no tengo."
  - position: 3
    scene: "entrevista"
    conversation_type: "practica"
    title: "Los primeros noventa segundos"
    body: "Amaya llegó con diez minutos de margen y se quedó charlando con la persona de recepción sobre el ruido de las obras. Cuando la llamaron, la entrevistadora ya sabía que se reía con facilidad. «Empezamos bien», le dijo. La simpatía no le dio el puesto, pero convirtió el trámite de tres preguntas en una conversación de verdad."
    before_phrase: "Intenté caer bien desde el principio."
    after_phrase: "La simpatía me dio una conversación, no un interrogatorio."
