confusions:
  - confused_with: "consentir"
    difference: "«Consentir» es permitir lo que otro propone; la otra palabra construye la decisión entre varios desde el principio."
    memory_trick: "Consientes lo que ya trae otro; la decisión compartida se fabrica entre todos."
  - confused_with: "consultar"
    difference: "«Consultar» es pedir opinión y decidir tú; la otra palabra exige que el resultado tenga el sí de todos."
    memory_trick: "Consultas y decides tú; el acuerdo lo firman todos."
exercises:
  - position: 1
    sentence: "Después de tres correos cruzados, Lorena propuso {{blank}} la fecha en una llamada de diez minutos."
    hint_general: "Buscan una fecha que salga del acuerdo de todos, no de una orden."
    explanation: "Consensuar: la fecha sale del acuerdo de todos. «Consentir» es permitir lo que otro propone, e «imponer» sería decidir por encima."
    options:
      - position: 1
        text: "consentir"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Consentir» es permitir algo que otro propone, y aquí la fecha todavía no existe: hay que construirla."
        hint_specific: "«Consentir» llega cuando alguien ya trae la propuesta. ¿Hay propuesta sobre la mesa?"
      - position: 2
        text: "consensuar"
        is_correct: true
      - position: 3
        text: "imponer"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Imponer» es decidir por encima de los demás, y ella propone una llamada para decidirlo juntos."
        hint_specific: "«Imponer» decide una sola persona. ¿Para qué sirve entonces la llamada?"
  - position: 2
    sentence: "Álvaro no quiso {{blank}} el nuevo horario y lo anunció por correo sin preguntar a nadie."
    hint_general: "Lo que evita es decidir el horario junto con los demás."
