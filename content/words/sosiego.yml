    conversation_type: "emocional"
    title: "Media hora"
    body: "Su hermano llegó de la reunión con los puños cerrados. Antes de que nadie preguntara, dijo: «Necesito media hora de sosiego y lo cuento todo». Nadie insistió. A los treinta minutos salió a la cocina y lo contó entero, sin levantar la voz."
    before_phrase: "Necesito un rato a solas, que ahora no puedo."
    after_phrase: "Media hora de sosiego y lo cuento todo."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "El turno de palabra"
    body: "En la asamblea todos hablaban a la vez. Casandra levantó la mano y esperó. Cuando el ruido bajó, dijo: «Ahora que hay sosiego, lo digo en dos frases». Las dijo, y fue lo único que quedó anotado en el acta."
    before_phrase: "A ver si nos calmamos todos un poco."
    after_phrase: "Ahora que hay sosiego, lo digo en dos frases."
