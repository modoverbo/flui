    scene: "trabajo"
    conversation_type: "practica"
    title: "Contesto el jueves"
    body: "El correo llegó a las siete de la tarde y era injusto. Milena empezó tres respuestas y borró las tres. Al final escribió otra cosa: «Te contesto el jueves con sosiego». El jueves su respuesta cabía en seis líneas y nadie salió herido."
    before_phrase: "Ahora mismo estoy demasiado caliente para contestar."
    after_phrase: "Te contesto el jueves con sosiego."
  - position: 2
