    hint_general: "Recuperó la calma de dentro y entonces pudo leer con atención."
    explanation: "Sosiego: recuperó la calma de dentro. El «descanso» sería reponer fuerzas, y el «sigilo» es moverse sin hacer ruido para no ser notado."
