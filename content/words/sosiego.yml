confusions:
  - confused_with: "asueto"
    difference: "El «asueto» es tiempo libre en el reloj; la otra palabra es calma por dentro, que puede faltar en pleno domingo."
    memory_trick: "El asueto lo da el calendario; lo otro, la cabeza."
  - confused_with: "silencio"
    difference: "El «silencio» es la ausencia de ruido fuera; la otra palabra mira lo que pasa dentro de ti."
    memory_trick: "El silencio se mide con el oído; lo otro, con el pulso."
exercises:
  - position: 1
    sentence: "Tuvo la casa entera para ella toda la semana y aun así no encontró ni un minuto de {{blank}}."
    hint_general: "Tener la casa vacía no le dio la calma interior que buscaba."
    explanation: "Sosiego: la calma interior que no llegó pese a la casa vacía. El «silencio» sí lo tuvo, y «asueto» sería tiempo libre, que también le sobraba."
    options:
      - position: 1
        text: "silencio"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "El «silencio» es la falta de ruido fuera, y eso lo tenía de sobra con la casa vacía toda la semana."
        hint_specific: "El «silencio» se mide con el oído. ¿Le faltaba ruido o le faltaba calma?"
      - position: 2
        text: "sosiego"
        is_correct: true
      - position: 3
        text: "asueto"
        is_correct: false
        distractor_type: "paronym"
        why_not: "El «asueto» es tiempo libre, y tiempo libre tuvo una semana entera; lo que no encontró fue calma."
        hint_specific: "El «asueto» lo marca el calendario. ¿Le faltaban días o le faltaba paz?"
  - position: 2
    sentence: "Milena esperó dos días antes de contestar aquel mensaje, porque quería responder con {{blank}} y no con rabia."
    hint_general: "Esperó a estar en calma por dentro antes de escribir."
    explanation: "Sosiego: esperó a estar en calma por dentro. El «descanso» sería reponer el cuerpo, y «relax» es coloquial y suena a plan de fin de semana."
    options:
      - position: 1
        text: "descanso"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "El «descanso» repone el cuerpo después de un esfuerzo, y lo que ella necesitaba era bajar la rabia, no dormir."
        hint_specific: "El «descanso» arregla el cansancio. ¿Milena estaba cansada o enfadada?"
      - position: 2
        text: "sosiego"
        is_correct: true
      - position: 3
        text: "relax"
        is_correct: false
        distractor_type: "register"
        why_not: "«Relax» es coloquial y suena a plan de fin de semana, y responder un mensaje difícil no es un plan agradable."
        hint_specific: "«Relax» va con toalla y música suave. ¿Encaja ese tono con un mensaje que da rabia?"
  - position: 3
    sentence: "Su hermano llegó a casa alterado y solo pedía una cosa: media hora de {{blank}} antes de hablar de nada."
    hint_general: "Pide calma interior antes de ponerse a hablar del asunto."
    explanation: "Sosiego: pide calma interior antes de hablar. La «paciencia» sería aguantar a otro, y «recogimiento» suena a retirarse solemnemente del mundo."
