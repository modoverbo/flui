    hint_general: "Le preguntan qué funciones cumplía en ese empleo."
    explanation: "Desempeñaba: qué funciones cumplía allí. «Empeñaba» sería dejar cosas en garantía, y «cobraba» hablaría del dinero, no del trabajo."
    options:
      - position: 1
        text: "desempeñaba"
        is_correct: true
      - position: 2
        text: "empeñaba"
