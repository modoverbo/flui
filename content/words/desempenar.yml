readings:
  - position: 1
    scene: "entrevista"
    conversation_type: "practica"
    title: "Puesto, función y tiempo"
    body: "Ximena solía empezar por lo que sentía y perdía el hilo. Esta vez fue directa: «Desempeñé el puesto de responsable de compras durante cuatro años, con un equipo de tres personas». La entrevistadora asintió y pasó al ejemplo."
    before_phrase: "Pues hacía un poco de todo en compras."
    after_phrase: "Desempeñé el puesto de responsable de compras durante cuatro años."
  - position: 2
    scene: "trabajo"
    conversation_type: "practica"
    title: "Seis meses en medio"
    body: "El director se fue en marzo y el puesto quedó vacío hasta septiembre. Fernanda lo llevó esos meses sin cambiar de tarjeta ni de sueldo. Cuando llegó el nuevo jefe, ella escribió una nota de dos páginas con todo lo que había desempeñado."
    before_phrase: "Estuve haciendo de directora seis meses."
    after_phrase: "Todo lo que había desempeñado."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "La tesorera de la asociación"
    body: "Mi tía llevó las cuentas de la asociación del barrio durante once años sin cobrar nada. En la cena de despedida, el presidente lo dijo así: «Desempeñó el cargo mejor que muchos profesionales». Ella se puso colorada y cambió de tema."
    before_phrase: "Hizo de tesorera once años, y muy bien."
    after_phrase: "Desempeñó el cargo mejor que muchos profesionales."
