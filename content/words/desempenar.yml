        distractor_type: "near_synonym"
        why_not: "«Ejercer» se usa con profesiones, cargos y derechos, no con el papel que alguien cumple dentro de un equipo."
        hint_specific: "«Ejerció» pide una profesión o un cargo. ¿Qué tenía Gonzalo, un título o un papel?"
