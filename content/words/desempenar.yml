    explanation: "Desempeñaba: cumplía dos funciones a la vez. «Empeñaba» sería dejar cosas en garantía, y «apañaba» es coloquial y suena a salir del paso."
    options:
      - position: 1
        text: "empeñaba"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Empeñar» es dejar algo en garantía a cambio de dinero, y aquí se habla de dos trabajos a la vez."
