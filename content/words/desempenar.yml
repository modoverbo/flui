exercises:
  - position: 1
    sentence: "Durante cuatro años, Mariana {{blank}} el puesto de responsable de compras en una fábrica pequeña."
    hint_general: "Ocupó ese puesto durante cuatro años seguidos."
    explanation: "Desempeñó: ocupó ese puesto cuatro años. «Empeñó» sería dejar algo en garantía, y «pilotó» es coloquial y suena a llevar algo a ojo."
    options:
      - position: 1
        text: "empeñó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Empeñar» es dejar algo como garantía para que te presten dinero, y un puesto no se deja en garantía."
        hint_specific: "«Empeñar» pide un objeto de valor. ¿Qué se ocupa durante cuatro años?"
      - position: 2
        text: "desempeñó"
        is_correct: true
      - position: 3
        text: "pilotó"
        is_correct: false
        distractor_type: "register"
        why_not: "«Pilotar» un puesto es coloquial y sugiere llevarlo a ojo; aquí se describe un cargo con nombre y periodo."
        hint_specific: "«Pilotó» suena a llevar algo sobre la marcha. ¿Eso describe cuatro años de cargo?"
  - position: 2
    sentence: "En su primer trabajo, Samuel {{blank}} la función de atención al cliente los fines de semana."
    hint_general: "Cumplió esa función durante un periodo concreto."
    explanation: "Desempeñó: cumplió esa función un tiempo. «Empeñó» sería dejar algo en garantía, y «regentó» suena a dueño de un negocio."
    options:
      - position: 1
        text: "desempeñó"
        is_correct: true
      - position: 2
        text: "empeñó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Empeñar» es dejar algo en garantía a cambio de dinero, y una función de trabajo no se empeña."
        hint_specific: "«Empeñar» va de casas de préstamos. ¿Qué hacía Samuel los fines de semana?"
      - position: 3
        text: "regentó"
        is_correct: false
        distractor_type: "register"
        why_not: "«Regentar» suena a estar al frente de un negocio propio, y él atendía a clientes en su primer empleo."
        hint_specific: "«Regentó» apunta a quien manda en un local. ¿Ese era el puesto de Samuel?"
  - position: 3
    sentence: "Mi tía {{blank}} el cargo de tesorera de la asociación sin cobrar un euro."
    hint_general: "Ocupó ese cargo durante un tiempo, sin cobrar."
    explanation: "Desempeñó: ocupó ese cargo un tiempo. «Empeñó» sería dejar algo en garantía, y «desempolvó» es quitar el polvo a algo guardado."
    options:
      - position: 1
        text: "empeñó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Empeñar» es dejar algo en garantía a cambio de dinero, y la frase dice justo que no cobró nada."
        hint_specific: "«Empeñar» mueve dinero. Relee el final: ¿cuánto cobró tu tía?"
      - position: 2
        text: "desempolvó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Desempolvar» es quitar el polvo a algo guardado hace tiempo, y un cargo se ocupa, no se limpia."
        hint_specific: "«Desempolvó» pide un trapo. ¿Qué se hace con un cargo?"
      - position: 3
        text: "desempeñó"
