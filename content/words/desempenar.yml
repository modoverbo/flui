    sentence: "Si {{blank}} bien una función pequeña, te acaban dando una más grande."
    hint_general: "Cumplir bien una función lleva a recibir otra mayor."
    explanation: "Desempeñas: cumples bien esa función. «Empeñas» sería dejar algo en garantía, y «exageras» sugiere agrandar lo que haces."
    options:
      - position: 1
        text: "desempeñas"
        is_correct: true
      - position: 2
        text: "empeñas"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Empeñar» es dejar algo en garantía a cambio de dinero, y aquí se habla de cumplir bien un trabajo."
        hint_specific: "«Empeñas» entrega un objeto. ¿Qué se cumple bien en esta frase?"
      - position: 3
        text: "exageras"
        is_correct: false
        distractor_type: "register"
        why_not: "«Exagerar» es coloquial y sugiere agrandar lo que haces, y la frase habla de hacerlo bien de verdad."
