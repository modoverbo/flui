        text: "desempeñó"
        is_correct: true
      - position: 2
        text: "empeñó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Empeñar» es dejar algo como garantía de un préstamo, y un papel dentro de un equipo no se lleva a una casa de empeños."
