readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "El final primero"
    body: "Otilia empezaba sus informes por el contexto y los perdía a todos en la segunda línea. Cambió el orden: «Desenlace: recuperamos a los dos clientes y el proceso tarda cuatro días menos. Abajo cuento cómo». Esa semana el informe se leyó tres veces."
    before_phrase: "Bueno, te cuento desde el principio cómo fue todo."
    after_phrase: "Desenlace primero: recuperamos a los dos clientes."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La historia del abuelo"
    body: "El abuelo contaba siempre la misma historia del tren, y siempre paraba antes del final. «Sin desenlace no hay historia», protestaba Casandra. Aquel domingo lo contó entero: perdió el tren y por eso conoció a su mujer en la estación."
    before_phrase: "Y luego ya pasaron cosas, ya te contaré."
    after_phrase: "Sin desenlace no hay historia."
  - position: 3
    scene: "entrevista"
    conversation_type: "practica"
    title: "«Cuéntame un proyecto difícil»"
    body: "Ivo tenía el problema y el trabajo bien contados, pero se quedaba a medias. Esta vez cerró: «El desenlace fue que entregamos con un día de retraso y el cliente renovó por dos años». Le preguntaron cómo había conseguido esa renovación."
    before_phrase: "Y bueno, al final salió, más o menos."
    after_phrase: "El desenlace fue que renovaron por dos años."
