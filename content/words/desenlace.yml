confusions:
  - confused_with: "enlace"
    difference: "«Enlace» es lo que une dos cosas, como una dirección web o una boda; la otra palabra es cómo acaba una historia."
    memory_trick: "El enlace une dos puntos; el otro cierra el camino."
  - confused_with: "moraleja"
    difference: "«Moraleja» es lo que aprendes de una historia; la otra palabra es lo que ocurre al final, aunque no aporte nada."
    memory_trick: "La moraleja explica; el final solo ocurre."
