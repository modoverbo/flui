stressed_syllable: 3
ipa_latam: "[du.ɾaˈðe.ɾo]"
ipa_es: "[du.ɾaˈðe.ɾo]"
explanation: "Que se mantiene en el tiempo, sin gastarse rápido ni terminar de un día para otro."
example_sentence: "Sus abuelos siempre dicen que el secreto de un cariño duradero es reírse juntos cada día."
register: "neutral"
pedantry_risk: 1
usage_tip: "Úsalo para elogiar una relación que resiste el paso del tiempo, no solo un buen comienzo."
when_not_to_use: "No lo uses para algo que recién empieza: duradero se confirma con el tiempo, no desde el primer día."
collocations:
  - "un amor duradero"
  - "una relación duradera"
  - "algo duradero"
replaces:
  - before: "Es un cariño que resiste el paso del tiempo"
    after: "Es un cariño duradero"
  - before: "Llevan años juntos y todavía se quieren igual"
    after: "Tienen un amor duradero"
family: []
