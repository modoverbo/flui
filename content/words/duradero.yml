confusions:
  - confused_with: "constante"
    difference: "Constante describe algo regular y sin pausas, como llamarse todos los días; duradero describe que una relación resiste el paso del tiempo, aunque tenga pausas."
    memory_trick: "Lo constante se repite seguido; lo duradero simplemente no se acaba."
exercises:
  - position: 1
    sentence: "Sus abuelos siempre dicen que el secreto de un cariño {{blank}} es reírse juntos cada día."
    hint_general: "Que se mantiene en el tiempo, sin desgastarse ni terminar rápido."
    explanation: "Duradero: que se mantiene en el tiempo, sin desgastarse. «Constante» describe algo regular y sin pausas, y «divertido» habla de pasarla bien, sin implicar que algo resista el tiempo."
    options:
      - position: 1
        text: "duradero"
        is_correct: true
      - position: 2
        text: "constante"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Constante» describe algo regular y sin pausas, y la frase habla de resistir el paso del tiempo, no de una rutina fija de todos los días."
        hint_specific: "Constante implica regularidad sin pausas. ¿La frase habla de una rutina fija o de resistir el paso del tiempo?"
      - position: 3
        text: "divertido"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Divertido» habla de pasarla bien, y la frase se enfoca en que el cariño resista el paso del tiempo, no solo en que sea entretenido."
        hint_specific: "Divertido es pasarla bien. ¿La frase habla de entretenimiento o de resistir el tiempo?"
