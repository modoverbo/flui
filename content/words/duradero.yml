readings:
  - position: 1
    scene: "familia"
    conversation_type: "emocional"
    title: "El secreto de los abuelos"
    body: "En cada cena familiar, alguien terminaba preguntándoles el secreto. «Un cariño duradero se construye riéndose juntos cada día», repetía el abuelo, mientras su esposa asentía, cincuenta años después de la primera cita."
    before_phrase: "Lo que hace que un cariño resista el tiempo es reírse juntos."
    after_phrase: "Lo que hace que un cariño sea duradero es reírse juntos."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "Quince años después"
    body: "En la reunión de exalumnos, todos se sorprendieron al ver que Camila seguía con la misma pareja de la secundaria. «Nunca pensé que sería tan duradero», admitió ella, «pero acá seguimos, quince años después»."
    before_phrase: "Nunca pensé que iba a durar tanto tiempo."
    after_phrase: "Nunca pensé que sería tan duradero."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El artículo sobre parejas jóvenes"
    body: "Para la nota, Rubén entrevistó a varias parejas de más de diez años. «Todas coincidían en algo: lo duradero no depende de la pasión del principio, sino de la paciencia después», escribió en su columna esa semana."
    before_phrase: "Lo que hace que dure no es la pasión del principio."
    after_phrase: "Lo duradero no depende de la pasión del principio."
