    hint_general: "Que resiste el paso del tiempo, construido poco a poco."
    explanation: "Duradero: que resiste el paso del tiempo, construido poco a poco. «Durazno» es una fruta, y «perfecto» implicaría algo sin fallas; ninguno describe construir un vínculo con el tiempo."
