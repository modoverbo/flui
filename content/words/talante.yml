    body: "Cambiaron la fecha de entrega dos semanas antes y la peor parte le tocaba a Alfonso. En vez de discutir, preguntó qué se podía mover. La sala se quedó callada. Su responsable lo dijo al final: «Con ese talante se trabaja distinto», y movieron dos cosas más para aligerarle el mes."
