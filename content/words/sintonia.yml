schema_version: 1
slug: "sintonia"
status: "draft"
lemma: "sintonía"
part_of_speech: "sustantivo"
syllables: ["sin", "to", "ní", "a"]
stressed_syllable: 3
ipa_latam: "[sin.toˈni.a]"
ipa_es: "[sin.toˈni.a]"
explanation: "Sensación de entenderse con alguien de forma natural y sin esfuerzo, casi sin necesidad de hablar mucho."
example_sentence: "Apenas empezaron a hablar, sintieron tanta sintonía que perdieron la noción del tiempo."
register: "neutral"
pedantry_risk: 1
usage_tip: "Úsala para describir una conexión que se siente enseguida, sin necesidad de conocerse mucho."
when_not_to_use: "No la uses para una relación forzada o que cuesta sostener: ahí no hay sintonía, hay esfuerzo."
collocations:
  - "tener sintonía con alguien"
  - "sintonía inmediata"
  - "buena sintonía"
replaces:
  - before: "Con ella conectamos enseguida, fue raro lo bien que nos entendimos"
    after: "Con ella hubo sintonía enseguida"
  - before: "Nos entendimos perfecto desde el primer minuto"
    after: "Tuvimos sintonía desde el primer minuto"
family: ["sintonizar", "sintonizado"]
themes:
  - slug: "small-talk"
    relevance: 3
tags:
  comodin: ["conectar"]
  funcion: ["describir"]
  canal: "ambos"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "sinfonía"
    difference: "«Sinfonía» es una obra musical para orquesta; la sintonía es la sensación de entenderse bien con alguien."
    memory_trick: "La sinfonía se toca con instrumentos; la sintonía se siente con las personas."
exercises:
  - position: 1
    sentence: "En la fiesta de cumpleaños, Marcos y Lucía descubrieron tanta {{blank}} que llevaban media hora hablando sin notar que la música había cambiado tres veces."
    hint_general: "Habla de cuando dos personas se entienden casi sin esfuerzo desde el primer momento."
    explanation: "Sintonía: se entendieron casi sin esfuerzo desde el inicio. «Empatía» es comprender lo que siente el otro, y «simpatía» es caer bien, no necesariamente entenderse tan rápido."
    options:
      - position: 1
        text: "empatía"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Empatía» es entender lo que siente otra persona, y aquí lo que se destaca es lo fácil que fluyó la charla entre los dos."
        hint_specific: "La empatía va de entender emociones ajenas. ¿La escena habla de eso o de lo fácil que fluyó todo?"
      - position: 2
        text: "simpatía"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Simpatía» dice que alguien cae bien, y la frase habla de una conexión mutua, no de que uno le agrade al otro."
        hint_specific: "La simpatía es caer bien. ¿La frase habla de gustar o de que los dos se entendieran?"
      - position: 3
        text: "sintonía"
        is_correct: true
  - position: 2
    sentence: "Renato temía que la primera llamada con el cliente fuera tensa, pero hubo tanta {{blank}} que terminaron riendo antes de colgar."
    hint_general: "Señala una conexión inmediata que hace fluir la conversación sin esfuerzo."
    explanation: "Sintonía: la llamada fluyó de inmediato entre los dos. «Sinfonía» es una obra musical, y «afinidad» habla de gustos en común, no de cómo fluyó esa conversación en concreto."
    options:
      - position: 1
        text: "sinfonía"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Sinfonía» es una obra musical para orquesta, y aquí no se habla de música sino de cómo se entendieron en la llamada."
        hint_specific: "Una sinfonía se toca con instrumentos. ¿La escena habla de música o de una conversación?"
      - position: 2
        text: "sintonía"
        is_correct: true
      - position: 3
        text: "afinidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Afinidad» describe que comparten gustos o intereses parecidos, y aquí lo llamativo fue lo bien que fluyó la charla, no si tenían gustos en común."
        hint_specific: "La afinidad habla de gustos parecidos. ¿La frase dice qué gustos comparten o cómo fluyó la charla?"
  - position: 3
    sentence: "En la cena familiar, con mi cuñado hubo tanta {{blank}} que terminamos planeando un viaje juntos antes del postre."
    hint_general: "Apunta a una conexión que aparece de golpe, sin haberse tratado antes."
    explanation: "Sintonía: la conexión apareció rápido, en una sola cena. «Confianza» se construye con el tiempo, y «corazonada» es una intuición sobre algo que va a pasar, no una conexión ya sentida."
    options:
      - position: 1
        text: "confianza"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Confianza» se construye con el tiempo, y la frase describe algo que apareció de inmediato, en una sola cena."
        hint_specific: "La confianza suele tardar en formarse. ¿Aquí la conexión tardó o fue rápida?"
      - position: 2
        text: "sintonía"
        is_correct: true
      - position: 3
        text: "corazonada"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Corazonada» es una intuición sobre algo que va a pasar, y aquí lo que sintieron fue una conexión con la otra persona, no una predicción."
        hint_specific: "La corazonada anticipa un hecho futuro. ¿Aquí se anticipa algo o se siente una conexión con alguien?"
  - position: 4
    sentence: "Valentina salió de la entrevista sorprendida: sintió una {{blank}} inesperada con la persona que la evaluaba, aunque nunca se habían visto."
    hint_general: "Nombra esa sensación de entenderse con alguien recién conocido, sin ningún esfuerzo."
    explanation: "Sintonía: sintió una conexión inmediata con un desconocido. «Complicidad» necesita un secreto o una broma compartida, y «química» es una forma muy coloquial de decirlo, fuera de tono en ese relato."
    options:
      - position: 1
        text: "complicidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Complicidad» es la conexión de quienes comparten un secreto o una broma, y aquí se trata de un entendimiento inmediato con una desconocida."
        hint_specific: "La complicidad suele ir con secretos o bromas compartidas. ¿Hay algo de eso en la escena?"
      - position: 2
        text: "química"
        is_correct: false
        distractor_type: "register"
        why_not: "«Química» es una expresión muy coloquial y algo manida, y contarlo así en el relato de una entrevista suena informal para ese tono."
        hint_specific: "Esa palabra es una expresión muy informal y manida. ¿Encaja con el tono de contar una entrevista?"
      - position: 3
        text: "sintonía"
        is_correct: true
  - position: 5
    sentence: "Ignacio empezó a ir a la clase de escalada solo por hacer ejercicio, pero con su compañera de cuerda surgió una {{blank}} que ninguno de los dos esperaba."
    hint_general: "Se trata de una conexión inesperada que surge sin que nadie la busque."
    explanation: "Sintonía: surgió una conexión que ninguno esperaba. «Cercanía» es sentirse a gusto con alguien, y «curiosidad» es solo querer saber más, no haber conectado ya."
    options:
      - position: 1
        text: "cercanía"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cercanía» es sentir calidez o confianza con alguien, y aquí lo llamativo es que se entendieron sin esfuerzo, casi sin hablar."
        hint_specific: "La cercanía es sentirse a gusto con alguien. ¿La frase resalta eso o lo fácil que se entendieron?"
      - position: 2
        text: "sintonía"
        is_correct: true
      - position: 3
        text: "curiosidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Curiosidad» es querer saber más de alguien, y la frase describe algo que ya sintieron los dos, no solo ganas de conocerse."
        hint_specific: "La curiosidad es querer saber más. ¿Aquí ya sintieron algo o solo querían conocerse?"
  - position: 6
    sentence: "El primer día, Camila y su nuevo jefe encontraron tanta {{blank}} que la reunión de bienvenida se alargó una hora sin que nadie lo notara."
    hint_general: "Describe cuando una reunión fluye tan bien que el tiempo pasa sin notarse."
    explanation: "Sintonía: la reunión fluyó tan bien que se alargó sola. «Conformidad» es estar de acuerdo con algo, y «coordinación» es organizarse bien, no la conexión personal que sintieron."
    options:
      - position: 1
        text: "conformidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Conformidad» es estar de acuerdo con algo, y la frase habla de una conexión personal, no de acuerdos de trabajo."
        hint_specific: "La conformidad es estar de acuerdo. ¿La frase habla de acuerdos o de una conexión personal?"
      - position: 2
        text: "coordinación"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Coordinación» es organizarse bien para hacer algo juntos, y la reunión no habla de logística, sino de lo bien que conectaron como personas."
        hint_specific: "La coordinación es organizarse bien. ¿La frase habla de logística o de cómo conectaron?"
      - position: 3
        text: "sintonía"
        is_correct: true
  - position: 7
    sentence: "Norma solo salió a tirar la basura, pero con la vecina nueva surgió tanta {{blank}} que se quedaron charlando media hora en la puerta."
    hint_general: "Nombra la conexión que hace que una charla breve se alargue sola."
    explanation: "Sintonía: dos vecinas conectaron enseguida en la puerta. «Avenencia» es un acuerdo formal entre partes, y «cordialidad» es un trato amable general, no ese entendimiento instantáneo."
    options:
      - position: 1
        text: "avenencia"
        is_correct: false
        distractor_type: "register"
        why_not: "«Avenencia» es un acuerdo formal entre partes, típico de una negociación, y aquí dos vecinas solo charlan de forma espontánea."
        hint_specific: "Esa palabra se usa para acuerdos formales. ¿Esta escena es una negociación o una charla espontánea?"
      - position: 2
        text: "cordialidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cordialidad» es un trato amable con cualquier persona, y aquí lo llamativo es que se entendieron enseguida, no solo que fueron amables."
        hint_specific: "La cordialidad es un trato amable general. ¿La frase resalta el trato o el entendimiento instantáneo?"
      - position: 3
        text: "sintonía"
        is_correct: true
  - position: 8
    sentence: "Tomás fue al evento sin ganas, pero con uno de los organizadores hubo tanta {{blank}} que terminaron armando planes para colaborar en un proyecto juntos."
    hint_general: "Habla de conectar tan bien con alguien que surgen ganas de seguir en contacto."
    explanation: "Sintonía: conectaron tan bien que surgieron planes de trabajo juntos. «Camaradería» es compañerismo de grupo, y «disposición» es estar abierto a algo, no haber conectado ya."
    options:
      - position: 1
        text: "camaradería"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Camaradería» es el compañerismo dentro de un grupo o equipo, y aquí se destaca la conexión con una sola persona, no con todo el grupo."
        hint_specific: "La camaradería es compañerismo de equipo. ¿La frase habla de un grupo o de una sola persona?"
      - position: 2
        text: "sintonía"
        is_correct: true
      - position: 3
        text: "disposición"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Disposición» es estar dispuesto a algo, y la frase ya describe que conectaron muy bien, no solo que estaban abiertos a hablar."
        hint_specific: "La disposición es estar dispuesto. ¿Aquí solo estaban abiertos o ya conectaron?"
readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "La llamada que no debía alargarse"
    body: "Antes de la llamada, Renato repasó sus notas tres veces, seguro de que sería tensa. Pero desde el «hola» la conversación fluyó sola: terminaron hablando del proyecto, de fútbol y de un restaurante en común. Al colgar, Renato le contó a su equipo: «Hubo sintonía total, esto va a funcionar»."
    before_phrase: "Con él nos llevamos muy bien desde el principio."
    after_phrase: "Con él hubo sintonía desde el principio."
  - position: 2
    scene: "social"
    conversation_type: "emocional"
    title: "La vecina nueva"
    body: "Norma solo había salido a sacar la basura. Terminó media hora después, sentada en el escalón de su vecina, riendo de una historia sobre mudanzas fallidas. «Qué raro, siento que te conozco de toda la vida», le dijo. Su vecina asintió: «Hay gente con la que simplemente hay sintonía»."
    before_phrase: "Con ella conecté superrápido, qué raro."
    after_phrase: "Con ella hubo sintonía desde el primer minuto."
  - position: 3
    scene: "entrevista"
    conversation_type: "social"
    title: "La entrevistadora que se rió primero"
    body: "Valentina llegó nerviosa, con las respuestas ensayadas de memoria. Pero la entrevistadora hizo una broma sobre el tráfico y todo cambió de tono; hablaron con una naturalidad que ninguna esperaba. Al salir, Valentina pensó que rara vez una entrevista se sentía tan fácil. «Hubo sintonía desde la primera pregunta», le contó después a una amiga."
    before_phrase: "La entrevista fluyó facilísimo, no sé por qué."
    after_phrase: "Hubo sintonía desde la primera pregunta."
provenance:
