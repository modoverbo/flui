    body: "Amparo llamó a su hermana después de la discusión con su pareja. No hubo análisis ni consejos. «Solo necesito consuelo hoy», dijo al descolgar. Hablaron de cualquier cosa hasta la madrugada, y el lunes ya pudo pensar."
