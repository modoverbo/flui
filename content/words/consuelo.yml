    body: "Su hija llegó de la prueba de acceso con la cara larga. Ivo empezó a proponer planes y ella se cerró. Cambió de estrategia: «¿Quieres consuelo o quieres opciones?». «Consuelo», dijo ella. Estuvieron en el sofá media hora y nadie propuso nada."
