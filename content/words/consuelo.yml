    title: "El pedido perdido"
    body: "El pedido se perdió y Berta se pasó la mañana repasando cada paso. Su compañera se acercó con dos cafés: «El fallo no fue solo tuyo; si te sirve de consuelo, yo firmé el mismo papel». Berta respiró. Después revisaron el proceso juntas."
    before_phrase: "No te machaques, que no fue culpa tuya sola."
    after_phrase: "Si te sirve de consuelo, yo firmé lo mismo."
