stressed_syllable: 6
ipa_latam: "[bul.ne.ɾa.βi.liˈðad]"
ipa_es: "[bul.ne.ɾa.βi.liˈðad]"
explanation: "Mostrarte abierto a que algo te afecte o te duela, sin esconder lo que sientes."
example_sentence: "Contar en la publicación que también tuvo miedo fue un acto de vulnerabilidad que muchos agradecieron."
register: "neutral"
pedantry_risk: 1
usage_tip: "Funciona bien para explicar por qué una publicación sincera conecta más que una perfecta."
when_not_to_use: "No la uses para un fallo técnico o de seguridad; ahí la misma palabra se refiere a otra cosa."
collocations:
  - "mostrar vulnerabilidad"
  - "un momento de vulnerabilidad"
  - "hablar con vulnerabilidad"
replaces:
  - before: "Conté algo íntimo y me dio miedo publicarlo"
    after: "Publiqué con vulnerabilidad, aunque me dio miedo"
  - before: "Fue sincero sobre lo mal que lo pasó"
    after: "Habló con vulnerabilidad sobre lo mal que lo pasó"
  - before: "Dejó ver que también le cuesta"
    after: "Mostró vulnerabilidad: dejó ver que también le cuesta"
family:
  - "vulnerable"
  - "vulnerar"
themes:
