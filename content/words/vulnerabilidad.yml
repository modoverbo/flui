    body: "Antes de publicar el balance del trimestre, Camilo dudó: todos los números iban bien menos uno. Su jefa lo animó: «Cuenta también ese número, con la vulnerabilidad de admitir que ahí fallamos». Lo publicó así, y fue el post que más preguntas generó de todo el equipo."
    before_phrase: "No sé si contar la parte que salió mal."
    after_phrase: "Lo conté con vulnerabilidad, y funcionó."
  - position: 2
    scene: "social"
    conversation_type: "emocional"
    title: "La historia que casi borró"
    body: "Daniela grabó una historia contando que había llorado esa mañana, y estuvo a punto de borrarla. Su mejor amiga la vio antes: «Déjala. Esa vulnerabilidad es lo que hace que la gente confíe en ti». Daniela la dejó publicada toda la semana."
    before_phrase: "Me dio vergüenza mostrarme así de sensible."
    after_phrase: "La dejé publicada: esa vulnerabilidad es mía."
  - position: 3
    scene: "familia"
    conversation_type: "social"
    title: "La charla de sobremesa"
    body: "En la comida familiar, el sobrino de Marisol contó que había perdido varios seguidores después de hablar de su divorcio en redes. «Al principio me arrepentí», dijo, «pero esa vulnerabilidad fue la que trajo a la gente que sí me importa». Marisol brindó por eso."
    before_phrase: "Me arrepentí de contar algo tan personal."
    after_phrase: "Esa vulnerabilidad trajo a la gente que sí me importa."
