    - "confesar"
  canal: "ambos"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "invulnerabilidad"
    difference: "«Invulnerabilidad» es no poder ser herido ni afectado por nada; la vulnerabilidad es justo lo contrario: mostrar que sí te afecta."
    memory_trick: "La invulnerabilidad no deja entrar nada; la vulnerabilidad abre la puerta."
  - confused_with: "vulgaridad"
    difference: "«Vulgaridad» es decir o hacer algo de mal gusto; la vulnerabilidad es mostrar un sentimiento real, no faltar al buen gusto."
exercises:
  - position: 1
    sentence: "Sofía dudó antes de publicar el video llorando en el auto, pero decidió que mostrar {{blank}} valía más que parecer perfecta."
    hint_general: "Se trata de dejar ver, a propósito, algo que normalmente escondes."
    explanation: "Vulnerabilidad: mostrarse tal cual, sin esconder lo que se siente. «Invulnerabilidad» sería no dejar que nada te afecte, y «debilidad» apunta a un fallo, no a una decisión de abrirse."
    options:
      - position: 1
        text: "invulnerabilidad"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Invulnerabilidad» es no dejar que nada te afecte, justo lo contrario de un video donde se la ve llorar."
        hint_specific: "«Invulnerabilidad» describe a quien nada afecta. ¿Ese video muestra a alguien a quien nada le afecta?"
      - position: 2
        text: "vulnerabilidad"
        is_correct: true
      - position: 3
        text: "debilidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Debilidad» apunta a un punto flaco o una falta de fuerza; aquí no hay un fallo, sino una decisión de mostrarse tal cual."
        hint_specific: "«Debilidad» habla de un punto flaco. ¿Sofía está confesando un fallo o compartiendo cómo se siente?"
  - position: 2
    sentence: "Mateo escribió en su publicación que ese mes había sido difícil; sus seguidores no esperaban tanta {{blank}} en su cuenta, que siempre mostraba viajes."
    hint_general: "Habla de contar algo real y delicado en un lugar donde solo se veía lo bueno."
    explanation: "Vulnerabilidad: contar algo real y delicado donde antes solo había viajes. «Bajón» es coloquial y suena a una mala racha de un rato, y «fragilidad» sugiere que algo está a punto de romperse, que no es lo que describe Mateo."
    options:
      - position: 1
        text: "bajón"
        is_correct: false
        distractor_type: "register"
        why_not: "«Bajón» es una palabra muy coloquial para un mal momento pasajero; la publicación de Mateo describe algo más hondo y sostenido durante un mes."
        hint_specific: "«Bajón» suena a una mala racha de un rato. ¿Mateo habla de un momento o de todo un mes difícil?"
      - position: 2
        text: "fragilidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Fragilidad» sugiere que algo puede romperse fácilmente; Mateo no se muestra a punto de quebrarse, solo cuenta lo que sintió."
        hint_specific: "«Fragilidad» avisa de algo a punto de romperse. ¿Mateo se describe a punto de romperse, o solo sincero?"
      - position: 3
        text: "vulnerabilidad"
        is_correct: true
  - position: 3
    sentence: "Lucía revisó el comentario antes de publicarlo: no quería sonar grosera, solo mostrar la {{blank}} de admitir que se había equivocado en público."
    hint_general: "Se trata de admitir un error, en público, sin disfrazarlo."
    explanation: "Vulnerabilidad: admitir el error tal cual, en público. «Vulgaridad» es de mal gusto, y no tiene que ver con admitir algo con honestidad, e «inseguridad» sería dudar de una misma, no elegir mostrarse tal cual."
    options:
      - position: 1
        text: "vulgaridad"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Vulgaridad» es decir algo de mal gusto; admitir un error con honestidad no tiene nada que ver con eso."
        hint_specific: "«Vulgaridad» tiene que ver con el mal gusto, no con admitir un error. ¿Lucía busca sonar mal educada o sincera?"
      - position: 2
        text: "inseguridad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Inseguridad» describe duda sobre una misma; aquí Lucía sabe bien lo que quiere decir, solo elige mostrarse tal cual."
        hint_specific: "«Inseguridad» habla de duda. ¿Lucía duda de sí misma, o solo elige ser sincera?"
      - position: 3
        text: "vulnerabilidad"
        is_correct: true
  - position: 4
    sentence: "Bruno dudó si su publicación sonaría a {{blank}}, pero al final contó lo nervioso que estaba antes de su primera exposición."
    hint_general: "Apunta a contar algo tuyo y real, aunque dé vergüenza."
    explanation: "Vulnerabilidad: contar algo real, aunque dé vergüenza. «Cursilería» acusa de un sentimentalismo exagerado que no encaja con un hecho concreto, y «sensibilidad» describe un rasgo general, no esta publicación puntual."
    options:
      - position: 1
        text: "cursilería"
        is_correct: false
        distractor_type: "register"
        why_not: "«Cursilería» acusa de un sentimentalismo exagerado; contar algo real y concreto, como los nervios antes de exponer, no encaja con ese reproche."
        hint_specific: "«Cursilería» es un reproche por lo sentimental. ¿Bruno exagera sus sentimientos, o solo cuenta un hecho concreto?"
      - position: 2
        text: "sensibilidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sensibilidad» describe una capacidad general de sentir las cosas; aquí Bruno hace algo puntual: contar sus propios nervios."
        hint_specific: "«Sensibilidad» describe un rasgo general de alguien. ¿La frase habla de cómo es Bruno siempre, o de esa publicación?"
      - position: 3
        text: "vulnerabilidad"
        is_correct: true
  - position: 5
    sentence: "Elena notó que sus publicaciones más comentadas eran las que mostraban {{blank}}, no las que presumían resultados perfectos."
    hint_general: "Habla de las publicaciones que dejan ver algo que normalmente no se cuenta."
    explanation: "Vulnerabilidad: dejar ver algo que normalmente no se cuenta. «Sinceridad» solo garantiza que algo es cierto, y «apertura» tiene que ver con escuchar a otros, no con exponerse una misma."
    options:
      - position: 1
        text: "sinceridad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sinceridad» dice que algo es verdad; no dice que además exponga algo que normalmente se esconde."
        hint_specific: "«Sinceridad» solo garantiza que algo es cierto. ¿Lo que más comentan es que sea cierto, o que se atrevan a mostrar lo que ocultan?"
      - position: 2
        text: "apertura"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Apertura» describe estar dispuesto a escuchar o a cambiar de idea; no describe mostrar algo que normalmente se esconde."
        hint_specific: "«Apertura» tiene que ver con escuchar a otros. ¿Esas publicaciones hablan de escuchar, o de mostrarse?"
      - position: 3
        text: "vulnerabilidad"
        is_correct: true
  - position: 6
    sentence: "Fabián dijo que la publicación funcionó porque, en vez de dar consejos, mostró {{blank}}: contó que a él también le costaba mucho hablar en público al principio."
    hint_general: "Se trata de contar, a propósito, algo difícil propio en vez de dar consejos desde arriba."
    explanation: "Vulnerabilidad: contar algo difícil propio en vez de dar consejos desde arriba. «Confesión» es solo el hecho puntual de contarlo, y «honestidad» garantiza que algo es cierto, sin implicar que además se exponga algo incómodo."
    options:
      - position: 1
        text: "confesión"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Confesión» es contar algo puntual que se guardaba; no describe la actitud general de abrirse que muestra toda la publicación."
        hint_specific: "«Confesión» es un hecho concreto de contar algo. ¿La frase describe solo ese dato, o toda una forma de mostrarse?"
      - position: 2
        text: "honestidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Honestidad» dice que algo es verdad y no engaña; no dice que además exponga algo incómodo de una misma."
        hint_specific: "«Honestidad» garantiza que algo es cierto. ¿Contar algo difícil propio es solo decir la verdad, o además exponerse?"
      - position: 3
        text: "vulnerabilidad"
        is_correct: true
  - position: 7
    sentence: "Carmen le preguntó a su hija por qué lloraba en el video que acababa de subir; ella respondió que quería mostrar {{blank}}, no una vida perfecta."
    hint_general: "Se trata de dejar ver lo que sientes de verdad, en lugar de aparentar que todo va bien."
    explanation: "Vulnerabilidad: dejar ver lo que se siente de verdad, sin aparentar que todo va bien. «Timidez» sería no atreverse a mostrarse, y aquí sí se mostró, y «ternura» tiene que ver con cariño, no con contar algo real de una misma."
    options:
      - position: 1
        text: "timidez"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Timidez» es la dificultad para hablar o mostrarse ante otros; ella sí se mostró, solo que sin esconder cómo se sentía."
        hint_specific: "«Timidez» hablaría de no atreverse a mostrarse. ¿Ella se calló, o subió el video de todas formas?"
      - position: 2
        text: "ternura"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Ternura» describe cariño o dulzura; el video no busca dar cariño, sino contar algo real sobre cómo se siente."
        hint_specific: "«Ternura» tiene que ver con cariño. ¿El video busca dar cariño, o contar algo real?"
      - position: 3
        text: "vulnerabilidad"
        is_correct: true
  - position: 8
    sentence: "Hugo, que siempre publicaba solo logros, sorprendió a todos con un texto sobre lo difícil que fue su primer año como padre; sus amigos celebraron esa {{blank}} nueva en su perfil."
    hint_general: "Apunta a contar algo difícil que antes se guardaba, después de mostrar siempre solo lo bueno."
    explanation: "Vulnerabilidad: contar algo difícil que antes se guardaba. «Emotividad» mide cuánta emoción siente alguien, no si decide contarla, y «candor» describe inocencia natural, no la decisión de abrirse."
    options:
      - position: 1
        text: "emotividad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Emotividad» describe cuánto se emociona alguien; el texto de Hugo no se trata de cuánta emoción sintió, sino de que contó algo que antes ocultaba."
        hint_specific: "«Emotividad» mide cuánto se emociona alguien. ¿Lo nuevo en el perfil de Hugo es la emoción, o lo que decidió contar?"
      - position: 2
        text: "candor"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Candor» describe una inocencia natural, casi infantil; Hugo no habla con inocencia, sino que decide abrir algo que antes guardaba."
        hint_specific: "«Candor» describe inocencia. ¿Hugo suena ingenuo, o está decidiendo contar algo que antes callaba?"
      - position: 3
        text: "vulnerabilidad"
        is_correct: true
readings:
