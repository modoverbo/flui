slug: "diligente"
status: "draft"
lemma: "diligente"
part_of_speech: "adjetivo"
syllables: ["di", "li", "gen", "te"]
stressed_syllable: 3
ipa_latam: "[di.liˈxen.te]"
ipa_es: "[di.liˈxen.te]"
explanation: "Que hace lo suyo pronto y con cuidado, sin que haya que insistirle."
example_sentence: "El proyecto salió regular, pero Camila fue diligente: entregó a tiempo y avisó de cada problema."
register: "neutral"
pedantry_risk: 2
usage_tip: "Elogia el cómo, no el resultado: sirve incluso cuando el proyecto sale mal y la persona hizo su parte."
when_not_to_use: "No la uses para quien corre sin mirar: aquí van juntas la rapidez y el cuidado."
collocations:
  - "un trabajo diligente"
  - "una respuesta diligente"
  - "ser diligente con los plazos"
replaces:
  - before: "Responde rápido y bien"
    after: "Es muy diligente"
  - before: "Lo hizo enseguida y sin fallos"
    after: "Fue diligente con el encargo"
  - before: "Hay que estar detrás de él todo el rato"
    after: "No es nada diligente"
family: ["diligencia"]
themes:
  - slug: "liderazgo-feedback"
