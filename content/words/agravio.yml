    title: "Lo de la boda"
    body: "Veinte años después, su tío seguía sin ir a las comidas grandes. Una sobrina se lo preguntó de frente y él lo dijo por fin: «No es orgullo; es un agravio que nadie reparó». Le pidieron perdón despacio y volvió en Nochevieja."
