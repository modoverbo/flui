    title: "Dónde hice daño"
    body: "El proyecto salió bien y aun así Damián pidió una reunión. «Me disculpo por el agravio, no por el resultado: te dejé fuera delante de todos». Su compañera agradeció que nombrara la parte exacta. Volvieron a trabajar juntos al mes siguiente."
    before_phrase: "Perdona si te sentó mal lo del otro día."
    after_phrase: "Me disculpo por el agravio, no por el resultado."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "La carta de Ainhoa"
    body: "Ainhoa escribió tres folios y los dejó reposar una semana. Luego tachó media carta. «Esto no era un agravio; era una tristeza vieja mal explicada», le dijo a su amiga al entregársela. La conversación empezó por ahí y fue mucho mejor."
    before_phrase: "Tenía un montón de cosas que echarte en cara."
    after_phrase: "No era un agravio: era tristeza mal explicada."
