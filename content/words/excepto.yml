explanation: "Aparta uno o dos elementos de un grupo entero y deja el resto sin tocar."
example_sentence: "Contestaron todos los invitados excepto dos, que siguen sin abrir el mensaje."
register: "neutral"
pedantry_risk: 1
usage_tip: "Perfecta cuando la lista es larga y la parte que falla es pequeña: di el todo y luego el hueco."
when_not_to_use: "No la uses si lo apartado es la mitad del grupo; entonces cuenta las dos partes por separado."
