confusions:
  - confused_with: "exento"
    difference: "«Exento» describe a quien queda libre de una obligación: «exento de pagar». La otra no libera a nadie: resta de una lista."
    memory_trick: "Uno se libra de una carga; la otra se cae de la lista."
  - confused_with: "extracto"
    difference: "«Extracto» es un trozo sacado de un texto o el resumen de una cuenta. La otra no saca nada: aparta lo que no cuenta."
    memory_trick: "Uno se recorta y se enseña; la otra se aparta y se olvida."
exercises:
  - position: 1
    sentence: "Contestaron todos los invitados {{blank}} dos, que siguen sin abrir el mensaje."
    hint_general: "Dos personas se caen de una lista que, por lo demás, está completa."
    explanation: "Excepto: aparta a los dos que faltan del grupo completo. «Exento» hablaría de librarse de una obligación e «incluso» los metería dentro."
    options:
      - position: 1
        text: "exento"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Exento» describe a quien queda libre de una obligación, y contestar un mensaje no es ninguna obligación de la que librarse."
        hint_specific: "«Exento» libera de una carga. ¿Alguien se libra de algo o simplemente no contesta?"
      - position: 2
        text: "excepto"
        is_correct: true
      - position: 3
        text: "incluso"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Incluso» mete a esos dos dentro del grupo que contestó, y la frase dice justo lo contrario: no han abierto el mensaje."
        hint_specific: "«Incluso» amplía el grupo. ¿Esos dos contestaron o siguen callados?"
  - position: 2
    sentence: "El equipo entregó todas las piezas {{blank}} la del motor, que llega el martes."
    hint_general: "Una sola pieza se cae de una entrega que estaba completa."
    explanation: "Excepto: aparta la única pieza que falta. «Obviando» suena a papeleo y acusa de saltarse algo, y «además de» sumaría el motor a lo entregado."
    options:
      - position: 1
        text: "excepto"
        is_correct: true
      - position: 2
        text: "obviando"
        is_correct: false
        distractor_type: "register"
        why_not: "«Obviando» suena a lenguaje de oficina y da a entender que alguien pasó por alto el motor a propósito, cuando solo llega tarde."
        hint_specific: "«Obviando» acusa de saltarse algo a propósito. ¿Alguien lo dejó fuera queriendo?"
      - position: 3
        text: "además de"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Además de» sumaría el motor a lo ya entregado, y la frase explica que esa pieza todavía está en camino."
        hint_specific: "«Además de» alarga la entrega. ¿El motor llegó con las demás o llega el martes?"
  - position: 3
    sentence: "Vale cualquier color para la pared {{blank}} el negro, que oscurece mucho el salón."
    hint_general: "Un color queda descartado y el resto de la carta sigue disponible."
    explanation: "Excepto: descarta el único color imposible. «Extracto» nombra un trozo de texto o de cuenta y «sobre todo» convertiría el negro en el color preferido."
    options:
      - position: 1
        text: "extracto"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Extracto» es un trozo sacado de un texto o el resumen de una cuenta, y aquí no se saca nada: se descarta un color."
        hint_specific: "«Extracto» tiene que ver con textos y cuentas. ¿Se resume algo o se descarta algo?"
      - position: 2
        text: "sobre todo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sobre todo» señalaría el negro como el color preferido, y la frase lo descarta por oscurecer el salón."
        hint_specific: "«Sobre todo» pone el foco en el favorito. ¿El negro gana o pierde en esta frase?"
      - position: 3
        text: "excepto"
        is_correct: true
  - position: 4
    sentence: "Todas las recetas del libro salieron bien {{blank}} la del pan, que se quedó cruda por dentro."
    hint_general: "Una receta rompe una racha que, por lo demás, fue perfecta."
    explanation: "Excepto: aparta la única receta fallida. «Exento» hablaría de librarse de una obligación y «hasta» metería el pan entre los aciertos."
    options:
      - position: 1
        text: "hasta"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Hasta» incluiría el pan entre los aciertos como caso extremo, y la frase cuenta que se quedó crudo."
        hint_specific: "«Hasta» suma el caso más difícil a los aciertos. ¿El pan salió bien o salió crudo?"
      - position: 2
        text: "excepto"
        is_correct: true
      - position: 3
        text: "exento"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Exento» describe a quien queda libre de una obligación, y un pan crudo no se libra de nada: falla."
        hint_specific: "«Exento» libera de una carga. ¿El pan se libra de algo o sale mal?"
  - position: 5
    sentence: "El seguro cubre cualquier avería del tejado {{blank}} las del granizo, que van en otra póliza."
    hint_general: "Un tipo de daño se queda fuera de una cobertura amplia."
    explanation: "Excepto: aparta el daño que no entra. «Pasando de» es de conversación y suena a desprecio, e «incluidas» metería el granizo dentro."
    options:
      - position: 1
        text: "pasando de"
        is_correct: false
        distractor_type: "register"
        why_not: "«Pasando de» es de conversación y suena a desprecio hacia el granizo, cuando una póliza solo delimita lo que cubre."
        hint_specific: "«Pasando de» expresa desdén. ¿Un seguro desprecia algo o delimita su alcance?"
      - position: 2
        text: "incluidas"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Incluidas» metería las averías del granizo dentro de la cobertura, y la frase las manda a otra póliza."
        hint_specific: "«Incluidas» amplía lo cubierto. ¿El granizo entra en este seguro o en otro?"
      - position: 3
        text: "excepto"
        is_correct: true
  - position: 6
    sentence: "Abrimos todos los días del año {{blank}} el 1 de enero, que descansa el local entero."
    hint_general: "Un día se cae de un calendario que, por lo demás, no tiene huecos."
    explanation: "Excepto: aparta el único día cerrado. «Extracto» nombra un trozo de texto o de cuenta y «también» sumaría ese día a los de apertura."
    options:
      - position: 1
        text: "extracto"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Extracto» es un trozo de un texto o el resumen de una cuenta, y aquí no se resume nada: se cierra un día."
        hint_specific: "«Extracto» va de textos y cuentas. ¿Se resume algo o se cierra el local?"
      - position: 2
        text: "excepto"
        is_correct: true
      - position: 3
        text: "también"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«También» sumaría ese día a los de apertura, y la frase dice que ese día el local descansa."
        hint_specific: "«También» alarga la lista de días abiertos. ¿Ese día se abre o se cierra?"
  - position: 7
    sentence: "Le gustan todas las verduras {{blank}} el pimiento, que aparta del plato desde niño."
    hint_general: "Una verdura rompe un gusto que alcanza a todas las demás."
    explanation: "Excepto: aparta la única verdura rechazada. «Obviando» suena a papeleo y acusa de saltarse algo, e «incluso» metería el pimiento entre las que le gustan."
    options:
      - position: 1
        text: "excepto"
        is_correct: true
      - position: 2
        text: "obviando"
        is_correct: false
        distractor_type: "register"
        why_not: "«Obviando» pertenece al lenguaje de oficina y sugiere pasar algo por alto a propósito, cuando aquí solo hay un gusto de siempre."
        hint_specific: "«Obviando» suena a saltarse algo queriendo. ¿Hay un descuido o un gusto de toda la vida?"
      - position: 3
        text: "incluso"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Incluso» metería el pimiento entre las verduras que le gustan, y la frase cuenta que lo aparta del plato."
        hint_specific: "«Incluso» amplía el gusto al caso más raro. ¿El pimiento le gusta o lo aparta?"
  - position: 8
    sentence: "El grupo llegó completo a la estación {{blank}} Nicolás, que perdió el primer tren."
    hint_general: "Una persona falta en un grupo que por lo demás está entero."
    explanation: "Excepto: aparta al único que no llegó. «Exento» hablaría de librarse de una obligación y «además» lo sumaría a los que ya estaban."
    options:
      - position: 1
        text: "exento"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Exento» describe a quien queda libre de una obligación, y perder un tren no libera a nadie de nada: deja fuera."
        hint_specific: "«Exento» libera de una carga. ¿Se libró de algo o se quedó en tierra?"
      - position: 2
        text: "excepto"
        is_correct: true
      - position: 3
        text: "además"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Además» lo sumaría a los que ya estaban en la estación, y la frase cuenta que él perdió el primer tren."
        hint_specific: "«Además» alarga el grupo. ¿Nicolás llegó con los demás o se quedó atrás?"
readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "La pieza que faltaba"
    body: "El cliente entendió que la entrega había fallado entera. Nieves lo corrigió en una frase, sin excusas largas: «Entregamos todas las piezas excepto la del motor, que llega el martes». El cliente respiró y confirmó la fecha en el mismo correo."
    before_phrase: "Entregamos casi todo, o sea, menos el motor, ya sabes."
    after_phrase: "Entregamos todas las piezas excepto la del motor."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "El color del salón"
    body: "Llevaban dos fines de semana con catálogos encima de la mesa. Oriol puso el límite de una vez: «Vale cualquier color excepto el negro». En cinco minutos eligieron un verde suave. La pared se pintó el sábado siguiente."
    before_phrase: "Cualquiera, bueno, menos el negro, que no."
    after_phrase: "Vale cualquier color excepto el negro."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "El pimiento de siempre"
    body: "En casa bromeaban con que era mal comedor y él se ponía serio. Un domingo lo dijo claro: «Me gustan todas las verduras excepto el pimiento». Su abuela lo apuntó en la libreta de la cocina y desde entonces el guiso sale sin discusión."
    before_phrase: "Es que a mí las verduras, según cuáles, no sé."
    after_phrase: "Me gustan todas las verduras excepto el pimiento."
