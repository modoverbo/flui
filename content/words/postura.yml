readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Una línea antes de votar"
    body: "La reunión se alargaba y las ideas cambiaban cada diez minutos. Ximena propuso algo raro: escribir en una línea lo que cada uno iba a defender, antes de empezar. «Así tenemos una postura, no un humor». Se votó en veinte minutos."
    before_phrase: "Yo lo veo así, más o menos."
    after_phrase: "Así tenemos una postura, no un humor."
  - position: 2
    scene: "entrevista"
    conversation_type: "practica"
    title: "El trabajo a distancia"
    body: "«¿Y qué opina usted del trabajo a distancia?», preguntó el entrevistador. Emilio no dio rodeos: «Le doy una postura, no una opinión: dos días en casa y los martes todos juntos». Le pidieron que la defendiera y la defendió."
    before_phrase: "Pues hay cosas buenas y cosas malas."
    after_phrase: "Le doy una postura, no una opinión."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "El plan A y el plan B"
    body: "Marina había defendido el plan A durante semanas. Cuando vio los números nuevos, lo dijo en la misma cena: «Cambio de postura, y os cuento por qué». Nadie se lo echó en cara. Esa noche el plan B salió adelante con todos los votos."
    before_phrase: "Pues ahora ya no lo veo tan claro."
    after_phrase: "Cambio de postura, y cuento por qué."
