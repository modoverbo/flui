  - position: 7
    sentence: "Una cosa es lo que piensas por dentro y otra la {{blank}} que defiendes delante del equipo."
    hint_general: "La frase separa el pensamiento privado de lo que se defiende en público."
    explanation: "Postura: lo que se defiende en público. Una «propuesta» sería un plan concreto que se somete a votación, y la «cultura» es lo que comparte un grupo entero."
    options:
      - position: 1
        text: "cultura"
        is_correct: false
        distractor_type: "paronym"
        why_not: "La «cultura» es lo que comparte un grupo entero, y aquí se separa lo que piensa una persona de lo que defiende."
