    sentence: "En la entrevista le pidieron una {{blank}} clara sobre el trabajo a distancia y que la defendiera, no solo lo que opinaba."
    hint_general: "Le piden algo que pueda defender, no solo lo que piensa."
    explanation: "Postura: algo que hay que poder defender. Una «opinión» es solo lo que se piensa, y la frase lo descarta; una «actitud» describiría su manera de comportarse."
