confusions:
  - confused_with: "opinión"
    difference: "Una opinión es lo que piensas y puedes cambiar sin más; la otra palabra es lo que decides defender delante de los demás."
    memory_trick: "La opinión se tiene; lo otro se sostiene."
  - confused_with: "actitud"
    difference: "«Actitud» describe cómo te comportas; la otra palabra dice qué defiendes, aunque lo digas con buenos modos."
    memory_trick: "La actitud se ve; lo otro se argumenta."
exercises:
  - position: 1
    sentence: "Después de escuchar a los dos lados, Ximena fijó su {{blank}} y se comprometió a defenderla en la reunión grande."
    hint_general: "Decide qué va a defender delante de los demás y se compromete a ello."
    explanation: "Postura: lo que decide defender delante de los demás. Una «opinión» se tiene y se cambia sin comprometerse, y una «captura» es una foto de lo que aparece en una pantalla."
    options:
      - position: 1
        text: "captura"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «captura» es la foto de lo que se ve en una pantalla, y aquí Ximena decide qué defender."
        hint_specific: "«Captura» se guarda en el teléfono. ¿Qué fijó Ximena después de escuchar?"
      - position: 2
        text: "postura"
        is_correct: true
      - position: 3
        text: "opinión"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «opinión» se tiene sin comprometerse con nada, y aquí Ximena se compromete a defenderla."
        hint_specific: "«Opinión» no obliga a nada. ¿A qué se compromete Ximena?"
  - position: 2
    sentence: "En el grupo cada uno sostiene una {{blank}} distinta y todos la han explicado con argumentos."
    hint_general: "Cada persona defiende algo distinto y lo ha razonado en voz alta."
    explanation: "Postura: lo que cada uno defiende con argumentos. Una «actitud» describiría cómo se comportan, no qué defienden, y una «postal» es una tarjeta con una foto."
    options:
      - position: 1
        text: "actitud"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «actitud» describe cómo se comporta alguien, y aquí lo que se explica con argumentos es qué defiende."
        hint_specific: "«Actitud» se ve en los gestos. ¿Qué explican con argumentos en el grupo?"
      - position: 2
        text: "postal"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «postal» es una tarjeta con una foto que se envía por correo, y aquí se discute un asunto."
        hint_specific: "«Postal» se manda por correo con un sello. ¿Qué sostiene cada uno en el grupo?"
      - position: 3
        text: "postura"
        is_correct: true
  - position: 3
    sentence: "No es una {{blank}} de cara a la galería: Emilio lleva dos años diciendo lo mismo, gane o pierda."
    hint_general: "Lleva dos años defendiendo lo mismo, y no lo hace para quedar bien."
    explanation: "Postura: lo que defiende desde hace dos años. «Pose» es coloquial y acusa de fingir, justo lo que la frase niega, y una «propuesta» sería un plan concreto que se pone a votación."
    options:
      - position: 1
        text: "postura"
        is_correct: true
      - position: 2
        text: "pose"
        is_correct: false
        distractor_type: "register"
        why_not: "«Pose» es coloquial y acusa de fingir para quedar bien, y la frase dice que no es de cara a la galería."
        hint_specific: "«Pose» acusa de fingir. Relee las cuatro primeras palabras de la frase."
      - position: 3
        text: "propuesta"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «propuesta» es un plan concreto que se pone a votación, y aquí Emilio repite lo que piensa, gane o pierda."
        hint_specific: "«Propuesta» se vota y se aprueba o no. ¿Qué repite Emilio desde hace dos años?"
  - position: 4
    sentence: "Antes de votar, cada uno escribió en una línea lo que iba a defender, y esa {{blank}} ya no se cambiaba a mitad de la reunión."
    hint_general: "Lo que cada uno se compromete a defender queda escrito y no se mueve."
    explanation: "Postura: lo que queda escrito y se defiende hasta el final. Una «opinión» se puede cambiar cuando quieras, y una «captura» es la foto de una pantalla."
    options:
      - position: 1
        text: "opinión"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «opinión» se cambia cuando quieras y sin explicar nada, y aquí lo escrito ya no se movía."
        hint_specific: "«Opinión» se cambia libremente. ¿Qué pasaba con lo escrito a mitad de reunión?"
      - position: 2
        text: "postura"
        is_correct: true
      - position: 3
        text: "captura"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «captura» es la foto de una pantalla, y aquí cada uno escribió a mano lo que iba a defender."
        hint_specific: "«Captura» sale de una pantalla. ¿Cómo se guardó lo que iban a defender?"
  - position: 5
    sentence: "Su {{blank}} no es cómoda, pero la sostiene con argumentos desde hace meses y sin levantar la voz."
    hint_general: "Defiende algo incómodo con razones y de forma tranquila."
    explanation: "Postura: lo incómodo que sostiene con razones. «Tesitura» suena a lenguaje solemne y nombra la situación en que uno se encuentra, no lo que defiende; la «cultura» es lo que un grupo comparte."
    options:
