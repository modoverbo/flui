  - position: 6
    sentence: "Marina cambió de {{blank}} cuando vio los números nuevos: pasó de defender el plan A a defender el B."
    hint_general: "Pasa a defender lo contrario de lo que defendía antes."
    explanation: "Postura: lo que defiende, y ahora defiende otra cosa. Una «actitud» habla de cómo se comporta, no de qué plan defiende, y una «postal» es una tarjeta con una foto."
    options:
      - position: 1
        text: "actitud"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «actitud» es cómo se comporta alguien, y la frase aclara que lo que cambió fue el plan que defiende."
        hint_specific: "«Actitud» va de modos y gestos. ¿Qué dice la frase que cambió Marina?"
      - position: 2
        text: "postal"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «postal» es una tarjeta con una foto, y aquí se pasa de un plan a otro."
        hint_specific: "«Postal» lleva sello y se manda. ¿Entre qué dos cosas cambió Marina?"
      - position: 3
        text: "postura"
