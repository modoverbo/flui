    memory_trick: "Uno se refiere al corazón; la otra, a la báscula."
  - confused_with: "apena"
    difference: "«Apena» viene de apenar y significa dar tristeza: «me apena la noticia». La otra solo mide lo poco que hubo."
    memory_trick: "Una entristece; la otra cuenta."
