readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Dos manos en una hora"
    body: "La charla terminó y todo el mundo decía que había salido bien. Casimira prefirió medirlo: «Apenas hubo preguntas: dos manos en una hora». Nadie se ofendió, porque no había reproche, solo un dato. La siguiente charla duró la mitad y llenó el turno de dudas."
    before_phrase: "No preguntó casi nadie, la verdad."
    after_phrase: "Apenas hubo preguntas: dos manos en una hora."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La semana de la mudanza"
    body: "Su hermana le pedía que pasara por casa antes de irse. Gervasio no se escondió detrás de un «es que voy liado»: «Me queda apenas una semana y tengo la casa por empaquetar». Quedaron el jueves a desayunar y les cundió más que tres llamadas."
    before_phrase: "Es que casi no tengo tiempo, ya te contaré."
    after_phrase: "Me queda apenas una semana."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "El pueblo de la panadería"
    body: "Le preguntaron de dónde era y él sonrió antes de contestar. «Un pueblo de apenas doscientos vecinos, con una panadería que abre los sábados». La mesa entera quiso saber más. Contar el tamaño exacto resultó más interesante que decir que era pequeño."
    before_phrase: "Es un pueblo muy pequeño, no sé, poquita gente."
    after_phrase: "Un pueblo de apenas doscientos vecinos."
