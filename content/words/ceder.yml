schema_version: 1
sort_order: 9102
slug: "ceder"
status: "draft"
lemma: "ceder"
part_of_speech: "verbo"
syllables: ["ce", "der"]
stressed_syllable: 2
ipa_latam: "[seˈder]"
ipa_es: "[θeˈder]"
explanation: "Dejar de insistir en lo que quieres y aceptar lo que pide el otro, para terminar en paz."
example_sentence: "Discutieron media hora sobre el destino del viaje hasta que Bruno cedió y aceptaron ir a la playa."
register: "neutral"
pedantry_risk: 1
usage_tip: "Se usa tanto en negociaciones serias como en decisiones pequeñas del día a día."
when_not_to_use: "No la uses cuando alguien acepta algo por miedo o por una presión injusta: ahí el problema no es ceder, es la presión."
collocations:
  - "ceder ante la presión"
  - "ceder en un punto"
  - "ceder terreno"
replaces:
  - before: "Bueno, ya, hagamos como tú dices"
    after: "Bueno, cedo: hagamos como tú dices"
  - before: "Preferí dejar que se saliera con la suya para no seguir peleando"
    after: "Preferí ceder para no seguir peleando"
  - before: "Está bien, tú ganas, no vale la pena seguir discutiendo"
    after: "Está bien, cedo, no vale la pena seguir discutiendo"
family: ["cesión"]
themes:
  - slug: "pedir-disculparse"
    relevance: 3
tags:
  comodin: ["dar el brazo a torcer"]
  funcion: ["negociar"]
  canal: "ambos"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "acceder"
    difference: "«Acceder» es aceptar una petición o entrar a un lugar; «ceder» es dejar de insistir en tu postura después de resistirte. Acceder no supone que hubo una discusión antes."
    memory_trick: "Accedes a un pedido; cedes en una pelea."
exercises:
  - position: 1
    sentence: "Después de discutir diez minutos sobre el restaurante, Bruno {{blank}} y aceptó ir al que quería ella."
    hint_general: "Busca el verbo para dejar de insistir en lo tuyo y aceptar lo que pide el otro."
    explanation: "Cedió: dejó de insistir y aceptó lo que pedía ella. «Accedió» respondería a un pedido puntual, y «se rindió» sería una derrota total, demasiado para elegir un restaurante."
    options:
      - position: 1
        text: "accedió"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Acceder» es aceptar un pedido directo, y aquí no hubo ningún pedido: hubo una discusión que Bruno decidió no seguir."
        hint_specific: "«Acceder» normalmente responde a un pedido puntual. ¿Aquí hubo una discusión de por medio?"
      - position: 2
        text: "cedió"
        is_correct: true
      - position: 3
        text: "se rindió"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Rendirse» es darse por vencido del todo, como en una pelea seria, y aquí solo se trata de elegir un restaurante."
        hint_specific: "«Rendirse» suena a una derrota total. ¿Elegir un restaurante pesa tanto como eso?"
  - position: 2
    sentence: "En cada negociación, Marina nunca {{blank}} en el precio final, aunque el cliente insistiera mucho."
    hint_general: "Busca el verbo para dejar de insistir en tu precio y aceptar el del otro."
    explanation: "Cedía: dejaba de insistir en su precio. «Concedía» sería otorgar un favor desde el poder, y «se sometía» implica perder el control frente a alguien más fuerte."
    options:
      - position: 1
        text: "cedía"
        is_correct: true
      - position: 2
        text: "concedía"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Conceder» es dar algo desde una posición de poder, como un favor, y aquí Marina está regateando el precio, no otorgando un favor."
        hint_specific: "«Conceder» suena a otorgar un favor. ¿Marina está en una negociación o repartiendo favores?"
      - position: 3
        text: "se sometía"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Someterse» implica perder el control frente a alguien con más poder, y Marina mantenía el control de la negociación en todo momento."
        hint_specific: "«Someterse» habla de perder el control frente a otro. ¿Marina pierde el control de la negociación?"
  - position: 3
    sentence: "Su madre esperaba que, por una vez, Tomás {{blank}} en la discusión con su hermana sobre el cuarto."
    hint_general: "Busca el verbo para que deje de insistir en lo suyo y acepte compartir."
    explanation: "Cediera: que dejara de insistir en lo suyo y aceptara compartir. «Claudicara» sonaría demasiado solemne para una discusión de hermanos, y «transigiera» sería tolerar sin cambiar realmente de postura."
    options:
      - position: 1
        text: "claudicara"
        is_correct: false
        distractor_type: "register"
        why_not: "«Claudicar» es un verbo muy literario que suena a rendirse en una causa importante, y aquí solo se trata de compartir el cuarto con su hermana."
        hint_specific: "«Claudicar» suena grave, casi solemne. ¿Discutir por un cuarto pide una palabra tan seria?"
      - position: 2
        text: "transigiera"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Transigir» es tolerar algo sin estar de acuerdo, sin cambiar tu postura, y la madre quiere que Tomás cambie de postura, no solo que aguante."
        hint_specific: "«Transigir» es aguantar sin cambiar de opinión. ¿La madre quiere que Tomás aguante o que cambie de postura?"
      - position: 3
        text: "cediera"
        is_correct: true
  - position: 4
    sentence: "Nadie quería moverse de su destino preferido, y después de media hora alguien tuvo que {{blank}}."
    hint_general: "Busca el verbo para dejar de insistir en tu idea y aceptar la del otro."
    explanation: "Ceder: dejar de insistir en tu idea y aceptar la del otro. «Acatar» sería obedecer una norma, y «resignarse» sería aceptar algo sin que nadie más esté de por medio."
    options:
      - position: 1
        text: "ceder"
        is_correct: true
      - position: 2
        text: "acatar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Acatar» es obedecer una norma o una orden, y entre amigos que planean un viaje no hay ninguna autoridad que dé órdenes."
        hint_specific: "«Acatar» va de obedecer una norma. ¿Hay alguna autoridad dando órdenes entre estos amigos?"
      - position: 3
        text: "resignarse"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Resignarse» es aceptar algo sin que nadie te lo pida, casi por cansancio, y aquí hace falta aceptar la idea de alguien más para seguir eligiendo juntos."
        hint_specific: "«Resignarse» no necesita a otra persona enfrente. ¿Aquí hace falta aceptar la idea de alguien más?"
  - position: 5
    sentence: "«Está bien, {{blank}}: vemos la película que tú quieres», le dijo Paula a su compañero de cuarto."
    hint_general: "Busca el verbo para dejar de insistir en lo tuyo y aceptar lo que pide el otro."
    explanation: "Cedo: dejo de insistir y acepto lo que pide el otro. «Accedo» respondería a un pedido puntual, y «me someto» es una palabra demasiado fuerte para elegir una película."
    options:
      - position: 1
        text: "cedo"
        is_correct: true
      - position: 2
        text: "accedo"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Acceder» responde a un pedido directo, y aquí no hay un pedido: hay una discusión sobre qué película ver."
        hint_specific: "«Acceder» suele responder a un pedido puntual. ¿Aquí alguien pidió algo, o discutían los dos?"
      - position: 3
        text: "me someto"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Someterse» suena a perder todo el control frente al otro, y elegir una película no pesa tanto como para hablar de sometimiento."
        hint_specific: "«Someterse» es una palabra fuerte, de perder el control. ¿Elegir una película pesa tanto?"
  - position: 6
    sentence: "Poco a poco, {{blank}} en algunos puntos, el equipo logró cerrar el acuerdo antes del mediodía."
    hint_general: "Busca el verbo para dejar de insistir en algunos puntos y avanzar hacia un acuerdo."
    explanation: "Cediendo: dejando de insistir en algunos puntos para avanzar. «Concediendo» sonaría a otorgar desde el poder, y «capitulando» es una palabra muy solemne, demasiado dramática para una reunión."
    options:
      - position: 1
        text: "concediendo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Conceder» es otorgar algo desde una posición de poder, y en una reunión de equipo nadie está por encima de nadie: todos negocian por igual."
        hint_specific: "«Conceder» suena a otorgar desde arriba. ¿En esta reunión hay alguien con más poder que decide otorgar cosas?"
      - position: 2
        text: "cediendo"
        is_correct: true
      - position: 3
        text: "capitulando"
        is_correct: false
        distractor_type: "register"
        why_not: "«Capitular» es una palabra muy solemne, de derrota total, y aquí solo se trata de una reunión de trabajo que termina en acuerdo."
        hint_specific: "«Capitular» suena a una rendición total y dramática. ¿Una reunión de trabajo necesita una palabra tan fuerte?"
  - position: 7
    sentence: "Tras varias llamadas, los suegros de Renata {{blank}} y aceptaron pasar la Navidad en la otra casa."
    hint_general: "Busca el verbo para dejar de insistir en su idea y aceptar la del otro."
    explanation: "Cedieron: dejaron de insistir en su idea y aceptaron la del otro. «Concedieron» sonaría a otorgar un favor desde una posición fuerte, y «acataron» sería obedecer una orden que nadie les dio."
    options:
      - position: 1
        text: "concedieron"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Conceder» es otorgar algo como un favor desde una posición fuerte, y los suegros no tenían ninguna ventaja: simplemente dejaron de insistir en su idea."
        hint_specific: "«Conceder» suena a otorgar un favor desde una posición fuerte. ¿Los suegros tenían esa ventaja?"
      - position: 2
        text: "cedieron"
        is_correct: true
      - position: 3
        text: "acataron"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Acatar» es obedecer una regla o una decisión ajena, y aquí nadie les ordenó nada: decidieron dejar de insistir por su cuenta."
        hint_specific: "«Acatar» va de obedecer una orden. ¿Alguien les dio una orden a los suegros?"
  - position: 8
    sentence: "En veinte años de sociedad, Ignacio nunca {{blank}} en lo esencial, aunque sí en los detalles pequeños."
    hint_general: "Busca el verbo para dejar de insistir en algo, aunque sea solo en los detalles pequeños."
    explanation: "Ha cedido: ha dejado de insistir, aunque solo en detalles pequeños. «Ha claudicado» sonaría a abandonar una causa importante, y «se ha resignado» no necesita a nadie enfrente pidiendo algo."
    options:
      - position: 1
        text: "ha claudicado"
        is_correct: false
        distractor_type: "register"
        why_not: "«Claudicar» es una palabra muy solemne, casi de abandonar una causa, y aquí Ignacio solo ha cambiado de opinión en detalles pequeños, no ha abandonado nada grande."
        hint_specific: "«Claudicar» suena a abandonar una causa importante. ¿Ignacio abandonó algo grande, o cambió detalles pequeños?"
      - position: 2
        text: "se ha resignado"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Resignarse» es aceptar algo sin que haya nadie enfrente pidiéndolo, y aquí hay un socio con quien negociar cada detalle."
        hint_specific: "«Resignarse» no necesita a otra persona pidiendo algo. ¿Aquí hay un socio con quien negociar?"
      - position: 3
        text: "ha cedido"
        is_correct: true
readings:
  - position: 1
    scene: "familia"
    conversation_type: "emocional"
    title: "El cuarto compartido"
    body: "Cuando sus padres se separaron, a Tomás le tocó compartir cuarto con su hermana por primera vez. Discutieron toda la primera semana por el ropero y la luz encendida. Al final, Tomás cedió en lo del ropero, y ella cedió en apagar la luz a las diez. Encontraron un ritmo que a los dos les servía."
    before_phrase: "Bueno, ya, haz lo que quieras, no importa."
    after_phrase: "Cedo en esto, pero tú cedes en lo otro."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "El destino del viaje"
    body: "El grupo llevaba media hora sin ponerse de acuerdo: unos querían playa, otros montaña. Felipe, que había insistido toda la noche en la montaña, finalmente cedió: «Vamos a la playa, pero el próximo viaje elegimos montaña». Todos aplaudieron y por fin reservaron los boletos."
    before_phrase: "Bueno, está bien, hagan lo que quieran."
    after_phrase: "Cedo esta vez, pero la próxima elijo yo."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El punto del contrato"
    body: "En la última reunión antes de firmar, Renata insistía en un plazo más corto y el proveedor no se movía. Después de revisar los números una vez más, Renata cedió en el plazo, pero pidió una condición a cambio: revisiones mensuales. El proveedor aceptó y el contrato se firmó esa misma tarde."
    before_phrase: "Bueno, aceptamos el plazo, ya no importa insistir."
    after_phrase: "Cedo en el plazo, pero pido revisiones mensuales."
