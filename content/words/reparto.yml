readings:
  - position: 1
    scene: "familia"
    conversation_type: "emocional"
    title: "La nevera"
    body: "En casa se discutía cada domingo y siempre por lo mismo. Escribieron en la nevera quién se ocupaba de qué y lo firmaron los cuatro. «El problema no era la casa: era el reparto», dijo el pequeño. Llevan seis meses sin discutir un domingo."
    before_phrase: "Aquí lo hago todo yo y nadie mueve un dedo."
    after_phrase: "El problema no era la casa: era el reparto."
  - position: 2
    scene: "trabajo"
    conversation_type: "practica"
    title: "Cada tres meses"
    body: "Siempre había una parte del trabajo que nadie quería y que hacía la misma persona. El equipo decidió revisar quién se ocupaba de qué cada tres meses. «Con un reparto que rota, nadie se quema», resumió la responsable. Nadie ha pedido el cambio desde entonces."
    before_phrase: "Es que siempre le toca lo malo al mismo."
    after_phrase: "Con un reparto que rota, nadie se quema."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "La cena de los doce"
    body: "Doce personas y una cocina pequeña podían salir mal. Mandaron un mensaje con nombres, platos y horas de llegada. «El reparto lo resolvió todo», contó el anfitrión. Nadie trajo tres tortillas y a nadie se le olvidó el pan."
    before_phrase: "A ver cómo nos organizamos para la cena."
    after_phrase: "El reparto lo resolvió todo."
