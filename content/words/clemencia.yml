    difference: "«Elocuencia» es la habilidad de hablar de forma convincente y clara; esta palabra es la decisión de no castigar con todo el peso posible."
    memory_trick: "La elocuencia se escucha; esta palabra se concede."
  - confused_with: "indulgencia"
    difference: "«Indulgencia» es la actitud tolerante frente a errores cotidianos entre iguales; esta palabra es la decisión de no castigar con todo el peso posible, desde una posición de autoridad."
    memory_trick: "La clemencia la da quien puede castigar; la indulgencia la tiene quien decide no fijarse tanto en los errores ajenos."
