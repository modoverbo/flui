confusions:
  - confused_with: "ratificar"
    difference: "«Ratificar» es confirmar lo que ya habías dicho; lo otro es justo lo contrario, cambiarlo porque no era exacto."
    memory_trick: "Ratificas para confirmar; rectificas para corregir."
  - confused_with: "retractarse"
    difference: "«Retractarse» es retirar lo dicho por completo; corregirlo puede ser solo ajustar una parte y sostener el resto."
    memory_trick: "Retractarse borra; rectificar ajusta."
  - confused_with: "desmentir"
    difference: "«Desmentir» niega lo que dijo otra persona; esta palabra corrige algo que dijiste tú mismo."
    memory_trick: "Desmientes lo ajeno; rectificas lo tuyo."
