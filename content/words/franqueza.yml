    conversation_type: "practica"
    title: "El plazo que no salía"
    body: "Ruth vio el calendario y supo que no llegaba. En vez de esperar al viernes, llamó el lunes: «Con franqueza, ese plazo no sale; te propongo dos fechas». El cliente eligió una y al día siguiente le escribió para agradecerle el aviso temprano."
    before_phrase: "Voy a intentarlo y ya veremos qué pasa."
    after_phrase: "Con franqueza: ese plazo no sale."
