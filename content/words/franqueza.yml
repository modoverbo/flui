    body: "Lucrecia enseñó su idea de negocio a cuatro amigos y les pidió una cosa antes de empezar: franqueza, no ánimos, porque gente que le diga que sí ya tiene de sobra. Salieron tres pegas. Las apuntó, dio las gracias y cambió dos cosas esa misma semana."
