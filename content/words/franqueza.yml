    body: "A Eugenia le tiembla la voz cuando dice algo incómodo, y aun así lo dice. Aquella noche contó que no iba a poder cuidar de la casa todos los veranos. Su hermano se quedó callado un minuto y luego dijo: «Gracias por la franqueza; lo repartimos»."
    before_phrase: "No sé cómo decirte esto, de verdad."
    after_phrase: "Te lo digo con franqueza, aunque me tiemble la voz."
