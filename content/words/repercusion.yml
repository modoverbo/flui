readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "A los quince días"
    body: "En la reunión todos miraban las cifras del primer día. Casilda pidió esperar. «La repercusión se mide a los quince días, cuando el ruido se va», dijo. A los quince días, el vídeo pequeño había movido más que la campaña grande."
    before_phrase: "Ha tenido muchísimo alcance hoy."
    after_phrase: "La repercusión se mide a los quince días."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "El puente roto"
    body: "Mi hermano publicó una foto del puente roto sin esperar nada. En dos días la repercusión había llegado al pueblo de al lado y a una oficina con presupuesto. El puente se arregló en mayo. La foto seguía teniendo catorce comentarios."
    before_phrase: "Se enteró muchísima gente."
    after_phrase: "La repercusión llegó hasta el pueblo de al lado."
  - position: 3
    scene: "entrevista"
    conversation_type: "practica"
    title: "El nombre que no publicó"
    body: "Vera tenía el nombre y decidió no publicarlo esa semana. «Pensé en la repercusión sobre la familia», explicó cuando se lo preguntaron. «La noticia aguantaba siete días; ellos, no». Publicó el lunes siguiente, con una llamada hecha antes."
    before_phrase: "Pensé en cómo les iba a afectar."
    after_phrase: "Pensé en la repercusión sobre la familia."
