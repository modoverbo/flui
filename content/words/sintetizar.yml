readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Once páginas, un párrafo"
    body: "El informe llevaba dos semanas sin leerse. Otilia escribió arriba del todo: «Síntesis: subimos el precio un 4 %, perdemos dos clientes pequeños y ganamos margen en los grandes». Ese párrafo se discutió el martes; las once páginas, nunca."
    before_phrase: "Te mando el informe y ya lo miras cuando puedas."
    after_phrase: "Te lo sintetizo en un párrafo."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "¿Y tú qué haces?"
    body: "La sobrina de Amalia tenía siete años y una sola pregunta. Amalia no contó veinte años de trabajo: «Ayudo a que la gente entienda papeles difíciles». La niña asintió, satisfecha, y su hermana le dijo: «Nunca te había oído sintetizarlo tan bien»."
    before_phrase: "Uf, es complicado de explicar."
    after_phrase: "Nunca te había oído sintetizarlo tan bien."
  - position: 3
    scene: "entrevista"
    conversation_type: "practica"
    title: "Cuéntame tu carrera"
    body: "«Tienes dos minutos», le dijeron a Ivo. En vez de empezar por su primer empleo, sintetizó: «Hago que equipos que no se hablan compartan datos. Lo he hecho en tres sitios y en el último ahorramos medio año de trabajo». Le pidieron el detalle después."
    before_phrase: "Bueno, empecé en 2011 y luego, a ver…"
    after_phrase: "Te lo sintetizo: hago que equipos que no se hablan compartan datos."
