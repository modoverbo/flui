      - position: 2
        text: "sintetizar"
        is_correct: true
      - position: 3
        text: "sintonizar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Sintonizar» es entenderse bien con alguien, y lo que Delia hace es poner en una línea el contenido del debate."
        hint_specific: "«Sintonizar» habla de entenderse. ¿Qué cabe en esa única línea?"
  - position: 4
    sentence: "Si tu correo pasa de una pantalla, {{blank}} el motivo arriba y deja todo el detalle debajo."
