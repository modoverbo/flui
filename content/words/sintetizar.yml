confusions:
  - confused_with: "sintonizar"
    difference: "«Sintonizar» es ajustar una emisora o entenderse bien con alguien; la otra palabra reduce un texto a lo esencial."
    memory_trick: "Sintonizas con una persona; reduces un texto a lo que sostiene la idea."
  - confused_with: "recortar"
    difference: "«Recortar» quita trozos hasta que quepa; la otra palabra elige lo que sostiene la idea y deja fuera el resto."
    memory_trick: "Recortar mira el espacio; elegir lo esencial mira la idea."
exercises:
  - position: 1
    sentence: "El comité tenía once páginas y quince minutos, así que Ámbar tuvo que {{blank}} el informe en un solo párrafo."
    hint_general: "Un párrafo con lo esencial, sin perder lo que sostiene el informe."
    explanation: "Sintetizar: un párrafo con lo esencial. «Sintonizar» es ajustar una emisora o entenderse con alguien, y «achicar» es coloquial y solo habla de hacer algo más pequeño."
    options:
      - position: 1
        text: "sintonizar"
