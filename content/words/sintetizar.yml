        hint_specific: "«Sintonizar» va de emisoras y de entenderse con la gente. ¿Qué hay sobre la mesa en esta escena?"
      - position: 2
        text: "sintetizar"
        is_correct: true
      - position: 3
        text: "achicar"
        is_correct: false
        distractor_type: "register"
        why_not: "«Achicar» es coloquial y solo dice que algo se hace más pequeño, sin garantizar que quede lo importante."
        hint_specific: "«Achicar» habla de tamaño. ¿Basta con que el informe sea más corto?"
  - position: 2
    sentence: "Nadie iba a leer las cuarenta diapositivas, así que Gonzalo prefirió {{blank}} la idea en tres frases."
    hint_general: "Tres frases que guarden el centro de la idea."
    explanation: "Sintetizar: tres frases que guardan el centro de la idea. «Sistematizar» sería ordenarlo todo por reglas, y «recortar» quitaría diapositivas sin elegir qué sostiene la idea."
    options:
      - position: 1
        text: "sintetizar"
        is_correct: true
      - position: 2
        text: "sistematizar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Sistematizar» es ordenar algo siguiendo un método, y aquí lo que hace falta es decir menos, no ordenar más."
        hint_specific: "«Sistematizar» pone orden y método. ¿El problema son cuarenta diapositivas desordenadas o demasiadas?"
      - position: 3
        text: "recortar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Recortar» quita trozos hasta que quepa, y tres frases exigen elegir lo que sostiene la idea."
        hint_specific: "«Recortar» solo mira el espacio. ¿Con quitar diapositivas se salva la idea?"
  - position: 3
    sentence: "Tras dos horas de debate, Delia logró {{blank}} en una línea lo que todos pensaban y nadie decía."
    hint_general: "Una línea que recoge el fondo de dos horas."
    explanation: "Sintetizar: una línea recoge el fondo de dos horas. «Sintonizar» es entenderse con alguien o ajustar una emisora, y «repetir» solo devolvería lo ya dicho."
    options:
      - position: 1
        text: "repetir"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Repetir» devuelve lo que ya se dijo, y la frase destaca que nadie lo había dicho todavía."
