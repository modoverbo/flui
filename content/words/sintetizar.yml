stressed_syllable: 4
ipa_latam: "[sin.te.tiˈsaɾ]"
ipa_es: "[sin.te.tiˈθaɾ]"
explanation: "Decir en pocas palabras lo esencial de algo largo, sin perder lo que importa."
example_sentence: "Antes de mandar el informe voy a sintetizar los hallazgos en un párrafo que se lea de pie."
register: "neutral"
pedantry_risk: 1
usage_tip: "Úsala cuando quieras dejar claro que no has cortado al azar: has elegido lo que sostiene la idea."
when_not_to_use: "No la uses si solo estás quitando páginas para que entre en el espacio: eso es recortar, no elegir."
collocations:
  - "sintetizar un informe"
  - "sintetizar una idea"
  - "sintetizar el debate"
replaces:
  - before: "A ver si lo digo con menos palabras"
    after: "Déjame sintetizarlo"
  - before: "Voy a intentar acortar todo esto"
    after: "Voy a sintetizar esto"
  - before: "Resúmelo en dos líneas, por favor"
    after: "Sintetiza la idea en dos líneas"
family:
