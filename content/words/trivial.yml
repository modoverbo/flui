explanation: "Que tiene poca importancia y no cambia lo esencial de un tema o una situación."
example_sentence: "El comentario sobre el clima era trivial, pero abrió una charla que duró media hora."
register: "neutral"
pedantry_risk: 1
usage_tip: "Un tema trivial es un buen punto de partida, no un defecto: sirve para abrir charla sin comprometerte a nada."
when_not_to_use: "No la uses para menospreciar a una persona ni sus ideas; describe temas o detalles, no gente."
collocations:
