stressed_syllable: 2
ipa_latam: "[foɾˈtwi.to]"
ipa_es: "[foɾˈtwi.to]"
explanation: "Que pasa sin ningún plan de nadie detrás, como un encuentro que llega sin avisar."
example_sentence: "Fue un encuentro fortuito: los dos habían llegado tarde a la misma boda."
register: "neutral"
pedantry_risk: 1
usage_tip: "Sirve para contar un encuentro o un dato que llegó solo, sin que nadie moviera un dedo por conseguirlo."
when_not_to_use: "No la uses para decir que algo salió bien; eso es afortunado, no fortuito, que solo habla de que pasó por casualidad."
collocations:
  - "un encuentro fortuito"
  - "una coincidencia fortuita"
  - "de forma fortuita"
replaces:
  - before: "Fue pura casualidad que nos viéramos"
    after: "Fue un encuentro fortuito"
  - before: "Pasó sin que nadie lo planeara"
    after: "Pasó de forma fortuita"
  - before: "Nos cruzamos de casualidad"
    after: "Nos cruzamos de forma fortuita"
family:
  - "fortuitamente"
themes:
  - slug: "small-talk"
    relevance: 3
  - slug: "citas"
    relevance: 2
tags:
  comodin: ["casualidad"]
  funcion: ["describir", "contar"]
  canal: "hablado"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "furtivo"
    difference: "«Furtivo» describe algo hecho a escondidas, con intención de que nadie se entere; «fortuito» solo dice que algo pasó por casualidad, a la vista de todos."
    memory_trick: "Furtivo se esconde; fortuito solo sucede."
  - confused_with: "afortunado"
    difference: "«Afortunado» dice que algo salió con suerte, casi siempre bueno; «fortuito» solo describe que pasó sin planearlo, sin juzgar si fue bueno o malo."
exercises:
  - position: 1
    sentence: "El reencuentro de Mirta con su compañero de universidad en el aeropuerto fue {{blank}}: ninguno de los dos sabía que el otro viajaba ese día."
    hint_general: "Habla de algo que pasa sin que nadie lo busque ni lo planee, sin juzgar si fue bueno."
    explanation: "Fortuito: pasó sin que nadie lo planeara. «Furtivo» describe algo hecho a escondidas, y el reencuentro fue a la vista de todos, y «afortunado» dice que algo salió con suerte, cuando la frase solo cuenta que no lo planearon."
    options:
      - position: 1
        text: "furtivo"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Furtivo» describe algo hecho a escondidas, y el reencuentro de Mirta pasó a la vista de todos en el aeropuerto, sin que nadie se escondiera."
        hint_specific: "«Furtivo» implica esconderse. ¿Alguien se escondió en ese reencuentro del aeropuerto?"
      - position: 2
        text: "fortuito"
        is_correct: true
      - position: 3
        text: "afortunado"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Afortunado» dice que algo salió con suerte y fue bueno; la frase solo cuenta que ninguno de los dos lo planeó, sin decir si les gustó el reencuentro."
        hint_specific: "«Afortunado» juzga si algo fue bueno. ¿La frase dice si el reencuentro les gustó, o solo que no lo planearon?"
  - position: 2
    sentence: "Aitana terminó sentada junto a un desconocido en la cena de un amigo común por algo completamente {{blank}}: sobraba una silla justo ahí."
    hint_general: "Se refiere a algo que pasa por casualidad, sin que nadie lo tuviera planeado antes."
    explanation: "Fortuito: pasó por casualidad, sin plan de nadie. «Forzoso» dice que algo es obligatorio, y a Aitana nadie la obligó, y «previsto» dice que algo estaba planeado de antes, justo lo contrario de lo que pasó."
    options:
      - position: 1
        text: "forzoso"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Forzoso» dice que algo es obligatorio, sin otra opción; a Aitana nadie la obligó, solo sobraba una silla justo ahí."
        hint_specific: "«Forzoso» implica obligación. ¿Alguien obligó a Aitana a sentarse ahí?"
      - position: 2
        text: "fortuito"
        is_correct: true
      - position: 3
        text: "previsto"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Previsto» dice que algo estaba planeado de antes, y la frase cuenta justo lo contrario: nadie sabía que iba a sobrar esa silla."
        hint_specific: "«Previsto» habla de un plan anterior. ¿Alguien planeó que sobrara esa silla?"
  - position: 3
    sentence: "Que los dos llevaran el mismo libro bajo el brazo en el curso de fotografía fue {{blank}}, pero bastó para que Leandro y su compañera nueva hablaran una hora."
    hint_general: "Apunta a una coincidencia que nadie podía prever ni preparar de antemano."
    explanation: "Fortuito: una coincidencia que nadie preparó. «Cantado» es coloquial y dice que algo era previsible, cuando nadie podía prever los libros, e «inoportuno» diría que llegó en mal momento, cuando dejó una hora entera de buena charla."
    options:
      - position: 1
        text: "cantado"
        is_correct: false
        distractor_type: "register"
        why_not: "«Cantado» es coloquial y dice que algo era previsible; nadie podía prever que los dos llevarían el mismo libro ese día."
        hint_specific: "«Cantado» dice que algo se veía venir. ¿Alguien podía prever que llevarían el mismo libro?"
      - position: 2
        text: "fortuito"
        is_correct: true
      - position: 3
        text: "inoportuno"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Inoportuno» dice que algo llega en mal momento, y esa coincidencia dejó una hora entera de buena charla, nada mal."
        hint_specific: "«Inoportuno» avisa de mal momento. ¿Cómo terminó esa hora de charla entre Leandro y su compañera?"
  - position: 4
    sentence: "Que a Selene se le cayera el paraguas justo sobre los pies del chico de la fila fue {{blank}}, y terminaron intercambiando número por la disculpa."
    hint_general: "Habla de algo que pasa sin que nadie lo busque, sin juzgar si fue un descuido."
    explanation: "Fortuito: pasó sin que nadie lo buscara. «Suertudo» describe a una persona con suerte, no un hecho puntual, y «accidental» pone el foco en el descuido, cuando la frase no juzga eso, solo que nadie lo planeó."
    options:
      - position: 1
        text: "suertudo"
        is_correct: false
        distractor_type: "register"
        why_not: "«Suertudo» describe a una persona con suerte, no un hecho puntual; aquí lo que pasó fue que se le cayó el paraguas, no un rasgo de Selene."
        hint_specific: "«Suertudo» describe a una persona, no un hecho. ¿La frase habla de cómo es Selene o de lo que pasó con el paraguas?"
      - position: 2
        text: "fortuito"
        is_correct: true
      - position: 3
        text: "accidental"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Accidental» pone el foco en el descuido o el error, y la frase no juzga si fue un descuido, solo que nadie lo planeó."
        hint_specific: "«Accidental» acusa de descuido. ¿La frase juzga un descuido o solo dice que nadie lo planeó?"
  - position: 5
    sentence: "Nadie coordinó nada, ni siquiera a medias: Cayetano y la prima de la novia llegaron con el mismo color de corbata a la boda, algo {{blank}} que les dio tema de conversación toda la noche."
    hint_general: "Se refiere a algo que pasa sin que nadie lo haya coordinado, ni siquiera un poco."
    explanation: "Fortuito: nadie coordinó nada, ni siquiera a medias. «Coincidente» no aclara si hubo alguna coordinación detrás, e «inesperado» habla de sorpresa, no de si alguien coordinó algo."
    options:
      - position: 1
        text: "coincidente"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Coincidente» es una palabra técnica para hechos que combinan, y no aclara si detrás hubo alguna coordinación; la frase aclara que nadie coordinó nada, ni siquiera a medias."
        hint_specific: "«Coincidente» no aclara si hubo coordinación. ¿Qué aclara la frase sobre eso?"
      - position: 2
        text: "fortuito"
        is_correct: true
      - position: 3
        text: "inesperado"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Inesperado» solo dice que algo sorprendió, y no aclara si detrás hubo alguna mano organizando un poco las cosas; la frase aclara que nadie coordinó nada, ni siquiera a medias."
        hint_specific: "«Inesperado» habla de sorpresa, no de si alguien coordinó algo. ¿Qué aclara la frase?"
  - position: 6
    sentence: "A Norma le tocó, en una lista {{blank}} armada a último momento, la silla justo al lado de la única persona del curso que conocía de otra ciudad."
    hint_general: "Apunta a algo que sale así, sin ningún plan ni sistema detrás."
    explanation: "Fortuita: salió así, sin ningún sistema detrás. «Aleatoria» supone un mecanismo pensado para repartir al azar, y la lista se armó a último momento sin ningún sistema, y «providencial» sugiere que el destino intervino, cuando la frase no habla de destino."
    options:
      - position: 1
        text: "aleatoria"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Aleatoria» implica un mecanismo pensado para repartir al azar, y la lista se armó a último momento, sin ningún sistema para sortear los lugares."
        hint_specific: "«Aleatoria» supone un sistema para sortear. ¿Cómo se armó esa lista, según la frase?"
      - position: 2
        text: "fortuita"
        is_correct: true
      - position: 3
        text: "providencial"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Providencial» sugiere que el destino intervino a su favor, y la frase no habla de destino, solo de que la lista salió así, a último momento."
        hint_specific: "«Providencial» apunta al destino. ¿La frase habla de destino o de cómo se armó la lista?"
  - position: 7
    sentence: "El retraso del vuelo fue lo único {{blank}} de esa tarde, algo en lo que nadie, ni siquiera la aerolínea, tuvo parte: gracias a eso, Ismael terminó tomando un café con la persona que hoy es su pareja."
    hint_general: "Habla de un hecho puntual en el que nadie, ni siquiera la propia aerolínea, tuvo parte."
    explanation: "Fortuito: nadie, ni la aerolínea, tuvo parte en que pasara. «Imprevisible» describe una propiedad general, y aquí se cuenta un caso puntual, y «circunstancial» resta importancia al hecho, cuando la frase le da protagonismo."
    options:
      - position: 1
        text: "imprevisible"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Imprevisible» describe algo que nunca se podría prever como propiedad general, y la frase no generaliza sobre los retrasos, sino que aclara que nadie, ni la aerolínea, tuvo parte en ese en concreto."
        hint_specific: "«Imprevisible» generaliza sobre los retrasos. ¿La frase generaliza o habla de un caso puntual sin nadie detrás?"
      - position: 2
        text: "fortuito"
        is_correct: true
      - position: 3
        text: "circunstancial"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Circunstancial» resta importancia al hecho, como si solo fueran las condiciones del momento, y la frase le da protagonismo: fue lo único de esa tarde en lo que nadie tuvo parte."
        hint_specific: "«Circunstancial» resta importancia. ¿La frase resta importancia al retraso o le da protagonismo?"
  - position: 8
    sentence: "Wanda no buscaba conocer a nadie esa noche: que terminara hablando con el amigo de su amiga toda la fiesta fue {{blank}}, sin que nada ni nadie lo hubiera preparado."
    hint_general: "Se refiere a algo que pasa sin que nada ni nadie lo haya preparado de antemano."
    explanation: "Fortuito: nada ni nadie lo había preparado. «Predestinado» dice que el destino ya lo tenía preparado, y la frase aclara que nada ni nadie lo había preparado, e «involuntario» sugiere ir en contra de su voluntad, cuando ella no fue arrastrada a nada."
    options:
      - position: 1
        text: "predestinado"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Predestinado» dice que el destino ya lo tenía preparado, y la frase aclara que nada ni nadie lo había preparado."
        hint_specific: "«Predestinado» supone un plan del destino. ¿Qué aclara la frase sobre si algo lo preparó?"
      - position: 2
        text: "fortuito"
        is_correct: true
      - position: 3
        text: "involuntario"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Involuntario» sugiere que algo pasó en contra de la voluntad de alguien, y Wanda simplemente no lo tenía pensado, no fue arrastrada a hablar con él."
        hint_specific: "«Involuntario» implica ir en contra de la voluntad de alguien. ¿A Wanda la obligaron a hablar con él?"
readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "El mismo vuelo"
    body: "Fabiola y Tobías se conocieron porque a los dos les cambiaron la puerta de embarque a último momento y terminaron sentados juntos en la sala de espera. Fue un encuentro fortuito: ninguno de los dos había elegido esa fila de asientos. Hoy se siguen escribiendo cada semana."
    before_phrase: "Nos conocimos de pura casualidad."
    after_phrase: "Fue un encuentro fortuito, y seguimos hablando."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La foto encontrada"
    body: "Buscando un cargador en el cajón de la abuela, Renzo encontró una foto de ella de joven que nadie había visto. Fue un hallazgo fortuito, pero bastó para que la abuela contara historias toda la sobremesa que nunca antes había compartido."
    before_phrase: "La encontré de casualidad, buscando otra cosa."
    after_phrase: "Fue un hallazgo fortuito, y abrió una tarde entera de historias."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El café equivocado"
    body: "Bárbara tomó por error el café de otra persona en la sala común. El dueño, en vez de molestarse, se rio y se presentó. Fue un cruce fortuito, pero terminaron trabajando juntos en un proyecto meses después."
    before_phrase: "Fue pura casualidad que habláramos."
    after_phrase: "Fue un cruce fortuito, y terminamos trabajando juntos."
