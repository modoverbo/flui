confusions:
  - confused_with: "afinado"
    difference: "«Afinado» es ajustado en el tono, como un instrumento o una voz; la otra palabra dice que algo da justo en el punto."
    memory_trick: "Lo afinado suena bien; lo atinado da en el punto."
  - confused_with: "obstinado"
    difference: "«Obstinado» describe a quien no cambia de idea aunque no funcione; aquí se elogia haber acertado, no haber insistido."
    memory_trick: "El obstinado repite; lo atinado acierta."
