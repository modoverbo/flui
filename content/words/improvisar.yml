stressed_syllable: 4
ipa_latam: "[im.pɾo.βiˈsar]"
ipa_es: "[im.pɾo.βiˈsar]"
explanation: "Hacer algo en el momento, sin haberlo preparado antes."
example_sentence: "Se cayó la conexión y tuve que improvisar los últimos cinco minutos."
register: "neutral"
pedantry_risk: 1
usage_tip: "Dicho en voz alta baja la tensión: avisar de que vas sin red hace que la gente perdone los tropiezos."
when_not_to_use: "No la uses para algo hecho deprisa y mal; aquí falta preparación, no cuidado."
collocations:
  - "improvisar una respuesta"
  - "tener que improvisar"
  - "improvisar sobre la marcha"
replaces:
  - before: "Me lo inventé sobre la marcha"
    after: "Lo improvisé sobre la marcha"
