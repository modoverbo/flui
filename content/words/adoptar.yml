confusions:
  - confused_with: "adaptar"
    difference: "«Adaptar» es cambiar algo para que encaje en tu caso; la otra palabra lo toma tal como está y lo hace tuyo."
    memory_trick: "Adaptar retoca; lo otro recibe sin retocar."
  - confused_with: "optar"
    difference: "«Optar» es elegir entre varias posibilidades y pide siempre la palabra «por»; la otra palabra no elige, incorpora."
    memory_trick: "Optas por una cosa; lo otro lo haces tuyo."
