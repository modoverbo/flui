    explanation: "Sobremesa: nadie planeó nada, y todos siguieron sentados a la mesa después de comer. «Cita» supone un encuentro planeado de antemano, y aquí nadie había planeado nada, y «compañía» habla de quién está presente, no del momento en que se alargó la charla."
