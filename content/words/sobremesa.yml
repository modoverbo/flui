    title: "El tío que no hablaba"
    body: "En la comida de fin de año, el tío más callado de la familia nunca decía nada. Esa sobremesa se alargó tanto que, sin que nadie se lo pidiera, contó una historia de su juventud que nadie le había oído nunca."
    before_phrase: "Nos quedamos hablando después de comer y salió algo que nunca contaba."
    after_phrase: "La sobremesa se alargó, y contó algo que nunca había dicho."
