        hint_specific: "«Parranda» suena a salir de fiesta. ¿La escena pasa sentados a la mesa o de salida?"
      - position: 2
        text: "sobremesa"
        is_correct: true
      - position: 3
        text: "merienda"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Merienda» es una comida ligera de la tarde, y aquí no se sirvió nada nuevo: la gente solo se quedó hablando después del almuerzo."
        hint_specific: "«Merienda» es una comida en sí. ¿Se sirvió algo nuevo o solo se quedaron hablando?"
  - position: 3
    sentence: "Perla solo iba a saludar a los padres de su novio, pero la {{blank}} después de la comida del domingo terminó con ella y el padre discutiendo quién era el mejor equipo de fútbol."
    hint_general: "Apunta al rato después de comer en que la conversación en la mesa se estira sola."
    explanation: "Sobremesa: el rato después de comer en que la charla se estira sola. «Tertulia» se organiza de antemano, y esta charla surgió sola, y «charla» no dice en qué momento pasa."
    options:
      - position: 1
        text: "tertulia"
        is_correct: false
