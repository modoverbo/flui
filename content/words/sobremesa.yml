    sentence: "En la boda, ya habían comido y nadie se levantaba de la mesa: la {{blank}} duró más de lo que había durado la propia ceremonia, y Wanda terminó con el teléfono de la tía del novio, a quien acababa de conocer."
    hint_general: "Habla del rato en que la gente sigue en la mesa después de terminar de comer."
    explanation: "Sobremesa: el rato en que la gente sigue en la mesa después de comer. «Promesa» es un compromiso que alguien hace, y aquí nadie promete nada, y «antesala» pasa antes de algo, no después de la comida."
    options:
      - position: 1
        text: "promesa"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Promesa» es un compromiso que alguien hace, y en la boda no se cuenta que nadie prometiera nada, solo que ya habían comido y no se levantaban de la mesa."
        hint_specific: "«Promesa» es un compromiso de alguien. ¿Quién promete algo en esta escena?"
      - position: 2
        text: "sobremesa"
        is_correct: true
      - position: 3
        text: "antesala"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Antesala» es el rato antes de que algo empiece, y aquí la comida ya había terminado: lo que se alargó fue después."
        hint_specific: "«Antesala» pasa antes de algo. ¿La escena ocurre antes o después de la comida?"
  - position: 2
    sentence: "El novio de mi hermana terminó contando toda su infancia sin que nadie se lo pidiera: así de larga fue la {{blank}} después del almuerzo."
    hint_general: "Se refiere al rato de charla que sigue a una comida, ya sin nada más que comer."
    explanation: "Sobremesa: el rato de charla que sigue a una comida. «Parranda» es coloquial y suena a salida animada, y aquí todos seguían sentados, y «merienda» es una comida en sí, y aquí no se sirvió nada nuevo."
    options:
      - position: 1
        text: "parranda"
        is_correct: false
        distractor_type: "register"
