confusions:
  - confused_with: "antesala"
    difference: "«Antesala» es el rato antes de que algo empiece; la sobremesa es el rato después de comer, cuando ya se terminó la comida."
    memory_trick: "La antesala espera lo que viene; la sobremesa alarga lo que ya pasó."
  - confused_with: "merienda"
    difference: "«Merienda» es una comida ligera de la tarde; la sobremesa no es una comida, es el rato de charla después de cualquier comida."
exercises:
