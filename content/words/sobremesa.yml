    conversation_type: "practica"
    title: "El almuerzo que no terminaba"
    body: "Después del almuerzo con el equipo nuevo, nadie se movió de la mesa. La sobremesa siguió una hora más, y Bautista terminó sabiendo el nombre de los hijos de todos sus compañeros nuevos."
    before_phrase: "Nos quedamos hablando después de comer más de lo normal."
    after_phrase: "La sobremesa siguió una hora más, y salió ganando la relación con el equipo."
