        text: "charla"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Charla» no dice en qué momento pasa, y lo que importa aquí es que fue justo después de la comida, con todos aún en la mesa."
        hint_specific: "«Charla» no dice cuándo pasa. ¿En qué momento exacto ocurre esta escena?"
  - position: 4
    sentence: "Nadie se levantó de la mesa después de comer: la {{blank}} duró más que la comida misma, y Malena terminó con nuevos números de teléfono."
    hint_general: "Habla de un rato que arranca justo al terminar de comer, sin que nadie lo convoque."
    explanation: "Sobremesa: un rato que arranca al final de la comida, sin que nadie lo convoque. «Reunión» supone que alguien la convocó, y «comida» es el momento de comer en sí, no lo que vino después."
