    explanation: "Sobremesa: ya habían comido y nadie se levantaba de la mesa. «Velada» puede ser cualquier plan de una noche, incluso antes de comer, y «convivencia» es un concepto amplio de tiempo compartido, no un momento concreto en la mesa."
    options:
