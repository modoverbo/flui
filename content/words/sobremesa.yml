    sentence: "Terminaron de comer hace media hora, pero nadie se movió de la mesa: la {{blank}} con el cliente nuevo iba mejor que la reunión de la mañana."
    hint_general: "Se refiere al rato de charla que sigue a una comida, no a dormir ni a un descanso cualquiera."
    explanation: "Sobremesa: el rato de charla que sigue a una comida. «Pausa» es un descanso genérico de cualquier actividad, y «siesta» es dormir después de comer, justo lo contrario de seguir hablando."
    options:
      - position: 1
        text: "pausa"
        is_correct: false
