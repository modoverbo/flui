confusions:
  - confused_with: "formular"
    difference: "«Formular» es enunciar una pregunta o una propuesta; lo otro es darle carácter oficial a algo que ya se habló."
    memory_trick: "Formulas una pregunta; formalizas un acuerdo."
  - confused_with: "firmar"
    difference: "«Firmar» es solo poner tu nombre; darle carácter oficial a un trato incluye fechas, condiciones y a veces varias firmas."
    memory_trick: "Firmar es un gesto; formalizar es el proceso entero."
exercises:
  - position: 1
    sentence: "Llevaban medio año trabajando de palabra, hasta que decidieron {{blank}} el acuerdo con fecha y firma."
    hint_general: "Deciden darle carácter oficial al acuerdo, con fecha y firma."
    explanation: "Formalizar: le dan carácter oficial al acuerdo. «Formular» sería enunciarlo con palabras, y «anunciar» sería contarlo, no dejarlo firmado."
    options:
      - position: 1
        text: "formular"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Formular» es enunciar algo con palabras; el acuerdo ya estaba enunciado desde hacía medio año, lo que faltaba era la firma."
        hint_specific: "Formular enuncia con palabras. ¿Qué llevaba medio año faltando aquí?"
      - position: 2
        text: "formalizar"
        is_correct: true
      - position: 3
        text: "anunciar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Anunciar» es contarlo a los demás; se puede anunciar un trato y seguir sin nada escrito ni firmado."
        hint_specific: "Anunciar cuenta algo a otros. ¿Contarlo deja el trato por escrito?"
  - position: 2
    sentence: "Antes de empezar la obra, Héctor quiso {{blank}} el presupuesto por escrito."
    hint_general: "Quiere el presupuesto puesto en papel antes de empezar."
    explanation: "Formalizar: quiere el presupuesto en papel antes de empezar. «Formatear» tiene que ver con discos y archivos, y «protocolizar» suena a notaría."
    options:
      - position: 1
        text: "formatear"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Formatear» es borrar un disco o dar estilo a un archivo; no tiene nada que ver con dejar un precio cerrado."
        hint_specific: "Formatear vive entre discos y archivos. ¿De qué habla esta frase?"
      - position: 2
        text: "protocolizar"
        is_correct: false
        distractor_type: "register"
        why_not: "«Protocolizar» pertenece al lenguaje de las notarías; para un presupuesto de obra entre dos personas suena exagerado."
        hint_specific: "«Protocolizar» suena a notaría. ¿Hace falta tanto para un presupuesto de obra?"
      - position: 3
        text: "formalizar"
        is_correct: true
  - position: 3
    sentence: "El trato existía en el chat, pero nadie lo {{blank}} nunca, y al cambiar de jefe se cayó."
    hint_general: "El trato nunca llegó a ser oficial, y por eso se perdió."
    explanation: "Formalizó: el trato nunca llegó a ser oficial. «Formuló» sería enunciarlo, algo que ya estaba hecho en el chat, y «repitió» solo diría que se dijo dos veces."
    options:
      - position: 1
        text: "formuló"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Formular» es enunciar algo; en el chat el trato ya estaba enunciado, y aun así se cayó por no estar firmado."
        hint_specific: "Formular enuncia. ¿El trato estaba sin enunciar o sin firmar?"
      - position: 2
        text: "repitió"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Repetir» solo diría que alguien lo dijo otra vez; repetirlo en el chat no lo habría salvado del cambio de jefe."
        hint_specific: "Repetir dice lo mismo dos veces. ¿Decirlo otra vez habría salvado el trato?"
      - position: 3
        text: "formalizó"
        is_correct: true
  - position: 4
    sentence: "Si {{blank}} la propuesta esta semana, con firma y fecha, el proveedor puede empezar el lunes."
    hint_general: "Dejar la propuesta cerrada con firma para que el otro arranque."
    explanation: "Formalizamos: dejamos la propuesta cerrada con firma. «Formulamos» sería redactarla, y «comentamos» se quedaría en hablar de ella."
    options:
      - position: 1
        text: "formalizamos"
        is_correct: true
      - position: 2
        text: "formulamos"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Formular» una propuesta es redactarla; la frase dice que ya existe y que lo que falta son la firma y la fecha."
        hint_specific: "Formular redacta la propuesta. ¿Qué falta aquí, el texto o la firma?"
      - position: 3
        text: "comentamos"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Comentar» se queda en hablar de la propuesta; ningún proveedor empieza un lunes por un comentario."
        hint_specific: "Comentar se queda en la charla. ¿Con eso arranca el proveedor?"
  - position: 5
    sentence: "La colaboración funcionaba bien, así que las dos partes la {{blank}} con un contrato de un año."
    hint_general: "Pasan de la palabra al contrato porque la cosa funciona."
    explanation: "Formalizaron: pasaron de la palabra al contrato. «Formularon» sería enunciarla, y «celebraron» hablaría de una fiesta, no de un documento."
    options:
      - position: 1
        text: "celebraron"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Celebrar» sugiere brindis y alegría; lo que hicieron las dos partes fue firmar un contrato de un año."
        hint_specific: "Celebrar suena a brindis. ¿La frase habla de una fiesta o de un contrato?"
      - position: 2
        text: "formalizaron"
        is_correct: true
      - position: 3
        text: "formularon"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Formular» es enunciar algo con palabras; la colaboración ya estaba en marcha y lo que llegó fue el contrato."
        hint_specific: "Formular enuncia con palabras. ¿Qué llegó al final de la frase?"
  - position: 6
    sentence: "Nadie quería un documento enorme, pero sí {{blank}} lo básico: quién pone qué y hasta cuándo."
    hint_general: "Sin papeles enormes, quieren lo esencial escrito y firmado."
    explanation: "Formalizar: quieren lo esencial escrito y firmado. «Escriturar» es palabra de notaría, y «formular» se quedaría en enunciarlo de viva voz."
    options:
      - position: 1
        text: "escriturar"
        is_correct: false
        distractor_type: "register"
        why_not: "«Escriturar» pertenece a las notarías y a la compra de pisos; para dos líneas sobre quién pone qué resulta desmedido."
        hint_specific: "«Escriturar» suena a notaría. ¿Hace falta eso para dos líneas?"
      - position: 2
        text: "formular"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Formular» es decirlo con palabras claras; la frase pide además que quede escrito y con firma."
        hint_specific: "Formular se queda en las palabras. ¿Qué más piden aquí?"
      - position: 3
        text: "formalizar"
        is_correct: true
  - position: 7
    sentence: "Mi hermana y su socia {{blank}} el reparto de las ganancias antes de abrir la tienda."
    hint_general: "Dejan el reparto por escrito antes de abrir el negocio."
    explanation: "Formalizaron: dejaron el reparto por escrito. «Formularon» sería enunciarlo, y «discutieron» diría que hubo pelea, cuando aquí hubo acuerdo."
    options:
      - position: 1
        text: "formalizaron"
        is_correct: true
      - position: 2
        text: "formularon"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Formular» un reparto es enunciarlo en voz alta; la frase habla de dejarlo cerrado antes de abrir la tienda."
        hint_specific: "Formular lo enuncia. ¿Basta con decirlo antes de abrir una tienda?"
      - position: 3
        text: "discutieron"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Discutir» sugiere desacuerdo; la frase cuenta que el reparto quedó resuelto antes de abrir, no que hubiera pelea."
        hint_specific: "Discutir sugiere pelea. ¿Cómo llegan las dos socias a la apertura?"
  - position: 8
    sentence: "Cuando un acuerdo no se {{blank}}, cada parte recuerda una versión distinta seis meses después."
    hint_general: "Sin nada escrito ni firmado, cada parte recuerda otra versión."
    explanation: "Formaliza: sin nada escrito, cada parte recuerda otra versión. «Formula» sería enunciarlo, y «protocoliza» llevaría el trato a una notaría."
    options:
      - position: 1
        text: "formula"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Formular» es enunciar el trato; los dos lo enunciaron y aun así cada uno recuerda algo distinto medio año después."
        hint_specific: "Formular enuncia. ¿Enunciarlo evita que cada uno recuerde otra cosa?"
      - position: 2
        text: "formaliza"
        is_correct: true
      - position: 3
        text: "protocoliza"
        is_correct: false
        distractor_type: "register"
        why_not: "«Protocolizar» lleva el trato a una notaría; la frase habla de acuerdos normales, no de escrituras públicas."
        hint_specific: "«Protocolizar» pasa por notaría. ¿Todos los acuerdos llegan ahí?"
