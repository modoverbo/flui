        hint_specific: "Un «acuerdo» suena a trámite. ¿Qué tan formal es ese café entre vecinas?"
  - position: 6
    sentence: "Mariana y su excolega se encontraron en la conferencia y, después de años sin hablarse por aquel desacuerdo, empezaron ahí una {{blank}} lenta."
    hint_general: "Es un proceso que empieza poco a poco, después de años de distancia entre dos personas."
    explanation: "Reconciliación: un proceso que empieza poco a poco después de años de distancia. Un «perdón» sería solo el gesto de una persona, y una «paz» describe un estado, no el proceso que apenas comienza entre ellas."
    options:
      - position: 1
        text: "perdón"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Un «perdón» es el gesto de una sola persona, y aquí ambas, Mariana y su excolega, empiezan juntas un proceso lento en la conferencia."
        hint_specific: "Un «perdón» lo da una sola persona. ¿Cuántas personas empiezan este proceso?"
