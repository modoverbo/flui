confusions:
  - confused_with: "conciliación"
    difference: "Una «conciliación» es un acuerdo mediado, muchas veces legal o laboral, entre partes que negocian; esta palabra es volver a llevarte bien con alguien después de una pelea personal."
    memory_trick: "La conciliación la firma un mediador; esta palabra la sienten los dos otra vez."
  - confused_with: "paz"
    difference: "La «paz» es el estado general de no estar en conflicto; esta palabra es el momento concreto de volver a estar bien después de una ruptura."
    memory_trick: "La paz es un estado; esta palabra es el paso que lleva hasta ella."
exercises:
  - position: 1
    sentence: "Valentina y su socio no se hablaban desde la discusión por el contrato, hasta que lograron una {{blank}} durante el almuerzo del viernes."
    hint_general: "Es el momento en que dos personas deciden dejar atrás un conflicto y seguir la relación."
    explanation: "Reconciliación: el momento en que dos personas dejan atrás un conflicto y siguen la relación. Una «conciliación» sería un acuerdo mediado y formal, y una «tregua» sería solo una pausa, no un arreglo real entre ellos."
    options:
      - position: 1
        text: "conciliación"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «conciliación» es un acuerdo mediado, muchas veces con un tercero de por medio, y aquí Valentina y su socio arreglan las cosas solos, en un almuerzo."
        hint_specific: "Una «conciliación» suele necesitar un mediador. ¿Hay alguien más mediando en ese almuerzo?"
      - position: 2
        text: "reconciliación"
        is_correct: true
      - position: 3
        text: "tregua"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «tregua» es solo una pausa temporal en el conflicto, y aquí Valentina y su socio logran algo más duradero: seguir trabajando juntos de verdad."
        hint_specific: "Una «tregua» no siempre dura. ¿La frase describe algo temporal o algo que sigue después?"
  - position: 2
    sentence: "Emilia y su hermano no se hablaban hacía un año, y la cena de Navidad terminó siendo el inicio de una {{blank}} entre los dos."
    hint_general: "Es el inicio de volver a estar bien con alguien después de mucho tiempo sin hablarse."
    explanation: "Reconciliación: el inicio de volver a estar bien con alguien. Una «paz» describe un estado general sin conflicto, y un «acuerdo» sonaría demasiado formal para una cena de Navidad entre hermanos."
    options:
      - position: 1
        text: "paz"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «paz» describe un estado general sin conflicto, y aquí la cena marca algo más concreto: el inicio de que los dos hermanos vuelvan a hablarse."
        hint_specific: "Una «paz» es un estado, no un inicio. ¿Qué empieza esa noche entre los hermanos?"
      - position: 2
        text: "reconciliación"
        is_correct: true
      - position: 3
        text: "acuerdo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Un «acuerdo» suena a algo formal y negociado, y aquí lo que pasa entre los hermanos es más personal: vuelven a llevarse bien después de un año."
        hint_specific: "Un «acuerdo» suena a negociación. ¿Qué tan formal es esa cena entre hermanos?"
  - position: 3
    sentence: "Agustín y su mejor amigo no se hablaban desde la fiesta, hasta que se cruzaron en el gimnasio y empezaron ahí mismo una {{blank}}."
    hint_general: "Es volver a estar bien con un amigo, empezando justo en el momento en que se encuentran."
    explanation: "Reconciliación: volver a estar bien con un amigo. Un «perdón» sería solo el gesto de una de las dos partes, y una «tregua» sería apenas una pausa, no el reencuentro real entre ambos."
    options:
      - position: 1
        text: "perdón"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Un «perdón» es el gesto de una sola persona hacia la otra, y aquí ambos, Agustín y su amigo, vuelven a hablarse los dos a la vez, en el gimnasio."
        hint_specific: "Un «perdón» lo da una sola persona. ¿Cuántas personas participan aquí?"
      - position: 2
        text: "reconciliación"
        is_correct: true
      - position: 3
        text: "tregua"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «tregua» es apenas una pausa en el conflicto, y aquí Agustín y su amigo vuelven a hablarse de verdad, no solo dejan de pelear por un rato."
        hint_specific: "Una «tregua» es solo una pausa. ¿Vuelven a hablarse de verdad Agustín y su amigo?"
  - position: 4
    sentence: "Después de la pelea más fuerte de su relación, Camilo y su pareja hablaron toda la noche hasta llegar a una {{blank}} que los dejó tranquilos."
    hint_general: "Es el resultado de una conversación larga que deja tranquilos a los dos después de un conflicto."
    explanation: "Reconciliación: el resultado de una conversación larga que deja tranquilos a los dos. Una «amnistía» perdona una falta desde una posición de poder, y un «arreglo» suena demasiado casual para una noche entera de conversación."
    options:
      - position: 1
        text: "amnistía"
        is_correct: false
        distractor_type: "register"
        why_not: "Una «amnistía» la concede quien tiene poder sobre otro, como un gobierno, y aquí Camilo y su pareja hablan como iguales, toda la noche, hasta entenderse."
        hint_specific: "Una «amnistía» viene desde una posición de poder. ¿Camilo y su pareja hablan como iguales?"
      - position: 2
        text: "reconciliación"
        is_correct: true
      - position: 3
        text: "arreglo"
        is_correct: false
        distractor_type: "register"
        why_not: "Un «arreglo» suena casual y rápido, y aquí la conversación duró toda la noche, algo mucho más profundo que un simple arreglo."
        hint_specific: "Un «arreglo» suena rápido y casual. ¿Cuánto duró la conversación de Camilo y su pareja?"
  - position: 5
    sentence: "Rocío y su vecina llevaban meses sin dirigirse la palabra por el ruido, hasta que un café en el patio terminó en una {{blank}}."
    hint_general: "Es volver a llevarte bien con alguien con quien no te hablabas por un problema concreto."
    explanation: "Reconciliación: volver a llevarte bien con alguien después de un problema concreto. Una «conciliación» necesitaría un mediador formal, y un «acuerdo» sonaría más a un trámite que a un café entre vecinas."
    options:
      - position: 1
        text: "conciliación"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «conciliación» suele necesitar un mediador o un trámite formal, y aquí Rocío y su vecina lo resuelven solas, tomando un café en el patio."
        hint_specific: "Una «conciliación» suele llevar un mediador. ¿Hay alguien más en ese café?"
