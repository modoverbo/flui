readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "El almuerzo del viernes"
    body: "Desde la discusión por el contrato, Valentina y su socio solo se escribían lo necesario. El viernes, sin planearlo, terminaron almorzando juntos. «Creo que esto es una reconciliación», dijo él, medio en broma. Volvieron a trabajar en el mismo proyecto la semana siguiente."
    before_phrase: "Ya no estamos peleados, supongo, aunque no lo hablamos."
    after_phrase: "Creo que esto es una reconciliación de verdad."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La cena de Navidad"
    body: "Emilia y su hermano no se hablaban hacía un año. En la cena, él le pasó el pan sin decir nada, y ella se lo agradeció mirándolo a los ojos. Más tarde, ella le escribió: «Esta cena fue el inicio de una reconciliación, ¿no crees?». Él respondió con un simple «sí»."
    before_phrase: "Ya no estamos peleados, creo, pero seguimos raros."
    after_phrase: "Esta cena fue el inicio de una reconciliación."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "El café a solas"
    body: "La discusión en redes había sido pública, pero la reconciliación de Martina y su amiga fue privada: un café, sin celulares, hablando despacio. «Necesitábamos una reconciliación real, no un comentario más en internet», le dijo Martina. Las dos salieron del café más livianas."
    before_phrase: "Ya está, ya quedamos bien, creo."
    after_phrase: "Necesitábamos una reconciliación real, cara a cara."
