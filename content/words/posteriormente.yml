confusions:
  - confused_with: "posiblemente"
    difference: "«Posiblemente» habla de lo que puede llegar a ocurrir: «posiblemente llueva». La otra sitúa algo que ya ocurrió más tarde."
    memory_trick: "Una calcula probabilidades; la otra ordena fechas."
  - confused_with: "postergado"
    difference: "«Postergado» describe algo que se ha dejado para más adelante y sigue pendiente. La otra cuenta algo que sí llegó a pasar."
    memory_trick: "Uno sigue esperando turno; la otra ya sucedió."
exercises:
  - position: 1
    sentence: "Firmamos el acuerdo en marzo y {{blank}} ajustamos dos cláusulas del anexo."
    hint_general: "El ajuste llegó más tarde que la firma, no antes."
    explanation: "Posteriormente: el ajuste llegó después de la firma. «Posiblemente» hablaría de algo que quizá pase y «previamente» lo colocaría antes de firmar."
    options:
      - position: 1
        text: "posiblemente"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Posiblemente» habla de algo que quizá llegue a pasar, y aquí los ajustes ya se hicieron: son un hecho cerrado."
        hint_specific: "«Posiblemente» calcula probabilidades. ¿Los ajustes ya se hicieron o están en el aire?"
      - position: 2
        text: "posteriormente"
        is_correct: true
      - position: 3
        text: "previamente"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Previamente» colocaría los ajustes antes de la firma, y la frase los sitúa después, ya con el acuerdo cerrado."
        hint_specific: "«Previamente» mira hacia atrás. ¿Los ajustes van antes o después de firmar?"
  - position: 2
    sentence: "La avería se detectó en la revisión de mayo y {{blank}} se arregló sin coste para nadie."
    hint_general: "El arreglo vino después de encontrar el problema, no a la vez."
    explanation: "Posteriormente: el arreglo vino tras la detección. «A posteriori» suena a lenguaje académico y «a la vez» juntaría los dos momentos en uno."
    options:
      - position: 1
        text: "posteriormente"
        is_correct: true
      - position: 2
        text: "a posteriori"
        is_correct: false
        distractor_type: "register"
        why_not: "«A posteriori» pertenece al lenguaje académico y habla de juzgar algo con lo que se sabe luego, no de arreglar una avería."
        hint_specific: "«A posteriori» valora algo desde el futuro. ¿Se juzga algo o se cuenta un arreglo?"
      - position: 3
        text: "a la vez"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«A la vez» juntaría la detección y el arreglo en el mismo momento, y primero se encontró la avería y luego se reparó."
        hint_specific: "«A la vez» pone dos cosas en el mismo rato. ¿Se arregló mientras se detectaba?"
  - position: 3
    sentence: "Le dieron el puesto en enero y {{blank}} le ampliaron el equipo a seis personas."
    hint_general: "La ampliación llegó más tarde que el nombramiento."
    explanation: "Posteriormente: la ampliación vino tras el puesto. «Postergado» describiría algo aún pendiente e «inicialmente» lo colocaría en el punto de partida."
    options:
      - position: 1
        text: "postergado"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Postergado» describe algo que sigue esperando turno, y aquí la ampliación sí ocurrió: el equipo llegó a seis personas."
        hint_specific: "«Postergado» deja algo pendiente. ¿El equipo creció o sigue esperando?"
      - position: 2
        text: "posteriormente"
        is_correct: true
      - position: 3
        text: "inicialmente"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Inicialmente» situaría la ampliación en el punto de partida, y en enero solo hubo el nombramiento."
        hint_specific: "«Inicialmente» marca el arranque. ¿El equipo creció al principio o más tarde?"
  - position: 4
    sentence: "El pueblo vivió del olivo durante siglos y {{blank}} se llenó de casas de verano."
    hint_general: "El cambio del pueblo ocurrió después de aquella época larga."
    explanation: "Posteriormente: el cambio llegó tras aquellos siglos. «Andando el tiempo» suena a cuento antiguo y «entretanto» juntaría las dos épocas en una."
    options:
      - position: 1
        text: "andando el tiempo"
        is_correct: false
        distractor_type: "register"
        why_not: "«Andando el tiempo» suena a cuento antiguo y adorna la frase, cuando aquí se describe un cambio con fechas claras."
        hint_specific: "«Andando el tiempo» suena a relato de otra época. ¿Esto es un cuento o una descripción?"
      - position: 2
        text: "posteriormente"
        is_correct: true
      - position: 3
        text: "entretanto"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Entretanto» metería las casas de verano dentro de los siglos del olivo, y el pueblo cambió cuando aquello ya había pasado."
        hint_specific: "«Entretanto» ocupa un mismo rato. ¿Las casas llegaron durante esos siglos o después?"
  - position: 5
    sentence: "Nos mudamos en septiembre y {{blank}} descubrimos que el ascensor fallaba cada lunes."
    hint_general: "El descubrimiento llegó después de instalarse, no antes de firmar."
    explanation: "Posteriormente: el descubrimiento llegó tras la mudanza. «Posiblemente» hablaría de algo que quizá pase y «anteriormente» lo colocaría antes de mudarse."
    options:
      - position: 1
        text: "posiblemente"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Posiblemente» habla de algo que quizá ocurra, y aquí el fallo del ascensor es un hecho comprobado cada lunes."
        hint_specific: "«Posiblemente» deja la cosa en duda. ¿El fallo está comprobado o es una sospecha?"
      - position: 2
        text: "posteriormente"
        is_correct: true
      - position: 3
        text: "anteriormente"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Anteriormente» colocaría el descubrimiento antes de la mudanza, y quien firma sabiendo el fallo no se lleva sorpresa."
        hint_specific: "«Anteriormente» mira hacia atrás. ¿Lo supieron antes de mudarse o después?"
  - position: 6
    sentence: "La receta se publicó primero en un blog y {{blank}} salió en el libro de la asociación."
    hint_general: "El libro llegó más tarde que la publicación en internet."
    explanation: "Posteriormente: el libro llegó tras el blog. «A la postre» resume un resultado con aire literario y «de momento» dejaría el libro sin confirmar."
    options:
      - position: 1
        text: "a la postre"
        is_correct: false
        distractor_type: "register"
        why_not: "«A la postre» suena a crónica literaria y resume un resultado final, cuando aquí solo se ordenan dos publicaciones."
        hint_specific: "«A la postre» cierra con aire de crónica. ¿Se cierra una historia o se ordenan dos fechas?"
      - position: 2
        text: "de momento"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«De momento» dejaría el libro como algo provisional, y la frase cuenta que la receta salió en él de verdad."
        hint_specific: "«De momento» deja las cosas en el aire. ¿El libro salió o está pendiente?"
      - position: 3
        text: "posteriormente"
        is_correct: true
  - position: 7
    sentence: "El plano se aprobó en junio y {{blank}} cambió dos veces por culpa del presupuesto."
    hint_general: "Los cambios vinieron después de la aprobación, no antes."
    explanation: "Posteriormente: los cambios llegaron tras la aprobación. «Postergado» describiría algo aún pendiente y «previamente» los colocaría antes de aprobar."
    options:
      - position: 1
        text: "posteriormente"
        is_correct: true
      - position: 2
        text: "postergado"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Postergado» describe algo que sigue esperando turno, y aquí los cambios sí se hicieron: dos veces, además."
        hint_specific: "«Postergado» deja algo pendiente. ¿Los cambios se hicieron o siguen esperando?"
      - position: 3
        text: "previamente"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Previamente» colocaría los cambios antes de aprobar el plano, y la frase cuenta que llegaron cuando ya estaba aprobado."
        hint_specific: "«Previamente» mira hacia atrás. ¿Los cambios van antes o después del sello?"
  - position: 8
    sentence: "Empezó tocando en bares pequeños y {{blank}} llenó la sala grande del centro."
    hint_general: "El salto a la sala grande vino más tarde que los bares."
    explanation: "Posteriormente: el salto llegó tras los bares. «A posteriori» suena a lenguaje académico e «inicialmente» devolvería la sala grande al principio de todo."
    options:
      - position: 1
        text: "inicialmente"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Inicialmente» pondría la sala grande al principio de su carrera, y la frase cuenta que empezó en bares pequeños."
        hint_specific: "«Inicialmente» marca el arranque. ¿La sala grande fue el principio o el salto?"
      - position: 2
        text: "a posteriori"
        is_correct: false
        distractor_type: "register"
        why_not: "«A posteriori» pertenece al lenguaje académico y sirve para juzgar con lo que se sabe luego, no para contar una carrera."
        hint_specific: "«A posteriori» valora algo desde el futuro. ¿Se juzga algo o se cuenta una trayectoria?"
      - position: 3
        text: "posteriormente"
        is_correct: true
readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Marzo y lo que vino después"
    body: "El cliente pedía por teléfono que le contaran la historia del contrato cada dos semanas. Fructuoso la dejó escrita en tres líneas: «Firmamos en marzo y posteriormente ajustamos dos cláusulas». El documento se entendía a la primera y las llamadas se acabaron."
    before_phrase: "Firmamos en marzo y luego, pues eso, cambiamos cosas."
    after_phrase: "Firmamos en marzo y posteriormente ajustamos dos cláusulas."
  - position: 2
    scene: "entrevista"
    conversation_type: "practica"
    title: "La historia del puesto"
    body: "Le pidieron que contara su recorrido en la empresa sin saltos. Amaranta ordenó cinco años en dos frases: «Entré en atención al cliente y posteriormente llevé el equipo de soporte». Quien la escuchaba tomó nota de las fechas sin pedirle que repitiera ninguna."
    before_phrase: "Entré en atención y luego, o sea, pasé a soporte."
    after_phrase: "Entré en atención y posteriormente llevé el equipo de soporte."
  - position: 3
    scene: "familia"
    conversation_type: "social"
    title: "El pueblo del olivo"
    body: "Su abuela contaba siempre la misma historia y los nietos se perdían a la mitad. Un día la contó con orden: «El pueblo vivió del olivo durante siglos y posteriormente se llenó de casas de verano». Esa vez nadie preguntó cuándo pasaba cada cosa."
    before_phrase: "Antes era todo olivo y luego ya se llenó de casas."
    after_phrase: "Vivió del olivo durante siglos y posteriormente se llenó de casas."
