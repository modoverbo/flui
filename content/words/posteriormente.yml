explanation: "Sitúa algo en un momento más tarde que el hecho del que venías hablando."
example_sentence: "El vídeo se grabó en abril y posteriormente se editó en dos versiones."
register: "neutral"
pedantry_risk: 2
usage_tip: "Ordena una historia larga sin repetir «y luego» cinco veces seguidas."
when_not_to_use: "No la uses para el último paso de una serie; para cerrar hay palabras que suenan a punto y final."
collocations:
  - "posteriormente revisado"
  - "confirmado posteriormente"
replaces:
