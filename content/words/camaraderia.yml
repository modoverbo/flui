confusions:
  - confused_with: "cofradía"
    difference: "Una cofradía es un grupo organizado con normas y actos propios; lo otro es el trato entre iguales que trabajan juntos."
    memory_trick: "La cofradía tiene reglamento; la camaradería, turnos."
  - confused_with: "amistad"
    difference: "La amistad se elige y sigue fuera del trabajo; esta palabra nace de compartir un esfuerzo y a veces termina con él."
    memory_trick: "La amistad te acompaña a casa; la camaradería se queda en el turno."
exercises:
  - position: 1
    sentence: "Del turno de noche en el almacén, Efraín recuerda la {{blank}}: nadie se iba hasta que el último terminaba de cargar."
    hint_general: "Recuerda cómo se cuidaban entre quienes hacían el mismo esfuerzo."
    explanation: "Camaradería: se cuidaban entre quienes hacían el mismo esfuerzo. «Cofradía» sería un grupo con normas y actos propios, y «amistad» seguiría fuera del almacén."
    options:
      - position: 1
        text: "cofradía"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Cofradía» es un grupo organizado con reglas y actos propios, y aquí solo hay gente esperando a que el último acabe."
        hint_specific: "«Cofradía» supone reglamento y actos. ¿Hay reglas o hay turnos?"
      - position: 2
        text: "camaradería"
        is_correct: true
      - position: 3
        text: "amistad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Amistad» sigue fuera del trabajo, y lo que Efraín recuerda pasaba dentro del almacén, al terminar de cargar."
        hint_specific: "«Amistad» continúa fuera. ¿Dónde ocurría lo que recuerda?"
  - position: 2
    sentence: "Al cambiar los turnos, el equipo perdió la {{blank}} que había tardado dos años en formarse."
    hint_general: "Se perdió el trato construido por trabajar juntos mucho tiempo."
    explanation: "Camaradería: el trato construido trabajando juntos. «Hermandad» es palabra solemne de grupos con juramento, y «simpatía» sería caer bien, algo más ligero."
    options:
      - position: 1
        text: "hermandad"
        is_correct: false
        distractor_type: "register"
        why_not: "«Hermandad» es palabra solemne, propia de grupos con juramento y ceremonia, y esto es un cuadrante de turnos."
        hint_specific: "«Hermandad» suena a juramento y ceremonia. ¿Encaja con un cambio de turnos?"
      - position: 2
        text: "camaradería"
        is_correct: true
      - position: 3
        text: "simpatía"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Simpatía» es caer bien, y eso no tarda dos años en formarse ni se pierde al mover un cuadrante."
        hint_specific: "«Simpatía» aparece rápido. ¿Cuánto tardó en formarse lo que se perdió?"
  - position: 3
    sentence: "En la cuadrilla del monte hay una {{blank}} sencilla: se comparte el agua sin preguntar quién la trajo."
    hint_general: "Se ayudan sin llevar la cuenta de quién puso qué."
    explanation: "Camaradería: se ayudan sin llevar la cuenta. «Compadreo» acusa de hacerse favores por interés, y «confianza» sería creer en alguien, no cuidarse a diario."
    options:
      - position: 1
        text: "compadreo"
        is_correct: false
        distractor_type: "register"
        why_not: "«Compadreo» es de charla informal y acusa de hacerse favores entre conocidos, y aquí solo se comparte el agua."
        hint_specific: "«Compadreo» insinúa favores turbios, en tono de calle. ¿Hay favores o hay agua compartida?"
      - position: 2
        text: "camaradería"
        is_correct: true
      - position: 3
        text: "confianza"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Confianza» es creer en alguien, y lo que describe la frase es cómo se tratan cada día en el monte."
        hint_specific: "«Confianza» habla de creer en alguien. ¿La frase cuenta creencias o gestos diarios?"
  - position: 4
    sentence: "Lo que más echa de menos mi madre de la fábrica no es el sueldo, sino la {{blank}} de aquellas mujeres."
    hint_general: "Echa de menos cómo se trataban quienes trabajaban a su lado."
    explanation: "Camaradería: cómo se trataban quienes trabajaban a su lado. «Cofradía» sería un grupo con reglas propias, y «solidaridad» apuntaría a ayudar en una causa."
    options:
      - position: 1
        text: "camaradería"
        is_correct: true
      - position: 2
        text: "cofradía"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Cofradía» nombra un grupo organizado con normas y actos, y esas mujeres solo compartían la cadena de montaje."
        hint_specific: "«Cofradía» pide organización y reglas. ¿Qué compartían esas mujeres?"
      - position: 3
        text: "solidaridad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Solidaridad» es ponerse del lado de alguien en una causa, y aquí se habla del trato de todos los días."
        hint_specific: "«Solidaridad» aparece ante una causa. ¿Hubo una causa o hubo años de trabajo?"
  - position: 5
    sentence: "El entrenador cuida la {{blank}} del grupo más que la técnica: dice que lo segundo se aprende y lo primero no."
    hint_general: "Cuida cómo se tratan entre quienes entrenan juntos."
    explanation: "Camaradería: cómo se tratan quienes entrenan juntos. «Hermandad» sería palabra solemne de juramento, y «amistad» seguiría fuera del campo."
    options:
      - position: 1
        text: "hermandad"
        is_correct: false
        distractor_type: "register"
        why_not: "«Hermandad» es solemne y sugiere un vínculo jurado de por vida, y esto es un grupo que entrena tres tardes por semana."
        hint_specific: "«Hermandad» suena a vínculo jurado. ¿Va con tres entrenamientos por semana?"
      - position: 2
        text: "camaradería"
        is_correct: true
      - position: 3
        text: "amistad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Amistad» se elige y continúa fuera, y el entrenador cuida lo que ocurre dentro del grupo."
        hint_specific: "«Amistad» se elige libremente. ¿Los jugadores se eligen entre ellos?"
  - position: 6
    sentence: "Dos años después, Gael sigue llamando a los del taller: aquella {{blank}} le duró más que el contrato."
    hint_general: "Ese trato nacido del trabajo siguió cuando el trabajo acabó."
    explanation: "Camaradería: el trato nacido del trabajo. «Compadreo» acusaría de favores interesados, y «simpatía» sería solo caerse bien."
    options:
      - position: 1
        text: "simpatía"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Simpatía» es caer bien sin más, y aquí hay dos años de llamadas después de terminar el contrato."
        hint_specific: "«Simpatía» es ligera. ¿Cuánto ha durado esto?"
      - position: 2
        text: "compadreo"
        is_correct: false
        distractor_type: "register"
        why_not: "«Compadreo» es informal y sugiere favores entre conocidos, y lo que hay aquí son llamadas sin pedir nada."
        hint_specific: "«Compadreo» huele a favores, en tono suelto. ¿Gael pide algo en esas llamadas?"
      - position: 3
        text: "camaradería"
        is_correct: true
  - position: 7
    sentence: "En la cocina del restaurante, la {{blank}} se ve a las once de la noche: nadie se sienta hasta que está todo limpio."
    hint_general: "Se nota en el gesto de no dejar solo a quien queda trabajando."
    explanation: "Camaradería: nadie deja solo al que queda trabajando. «Cofradía» sería un grupo con normas propias, y «confianza» hablaría de creer en alguien."
    options:
      - position: 1
        text: "camaradería"
        is_correct: true
      - position: 2
        text: "cofradía"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Cofradía» nombra un grupo con reglas y actos propios, y en esa cocina solo hay un turno que acaba tarde."
        hint_specific: "«Cofradía» supone normas escritas. ¿Qué rige en esa cocina a las once?"
      - position: 3
        text: "confianza"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Confianza» es contar con alguien, y lo que se ve a las once es cómo se cuidan al terminar."
        hint_specific: "«Confianza» se tiene, no se ve. ¿Qué se ve a las once de la noche?"
  - position: 8
    sentence: "La obra terminó y con ella se deshizo una {{blank}} de ocho meses que nadie había planeado."
    hint_general: "Ese trato nació del trabajo compartido y se acabó con él."
    explanation: "Camaradería: nació del trabajo compartido y terminó con él. «Hermandad» sería un vínculo solemne para siempre, y «solidaridad» apuntaría a una causa común."
    options:
      - position: 1
        text: "solidaridad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Solidaridad» se despierta ante una causa o una injusticia, y aquí lo que hubo fueron ocho meses de obra."
        hint_specific: "«Solidaridad» necesita una causa. ¿Qué causa unía a esa gente?"
      - position: 2
        text: "camaradería"
        is_correct: true
      - position: 3
        text: "hermandad"
        is_correct: false
        distractor_type: "register"
        why_not: "«Hermandad» es palabra solemne y promete un vínculo que no se deshace, y este duró lo que la obra."
        hint_specific: "«Hermandad» promete para siempre, con tono grave. ¿Cuánto duró esto?"
readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "emocional"
    title: "Las once de la noche"
    body: "En la cocina nadie se sienta hasta que está todo limpio. El nuevo lo preguntó el primer día y Gael se lo explicó sin solemnidad: «Aquí hay camaradería; no es una regla, es que nadie se va solo». A la semana el nuevo también se quedaba."
    before_phrase: "Aquí nos llevamos bien, ya verás."
    after_phrase: "Aquí hay camaradería."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La fábrica de mi madre"
    body: "Mi madre habla poco de la fábrica y mucho de aquellas mujeres. Una tarde lo dijo con precisión: «No echo de menos el sueldo; echo de menos la camaradería». Luego sacó una foto de un cajón que yo no había visto nunca."
    before_phrase: "Nos llevábamos muy bien todas."
    after_phrase: "Echo de menos la camaradería."
  - position: 3
    scene: "entrevista"
    conversation_type: "practica"
    title: "Lo que se aprende y lo que no"
    body: "Le preguntaron al entrenador qué miraba al formar un grupo. «La técnica se aprende», contestó. «La camaradería, si no aparece en tres semanas, no aparece». Le pidieron ejemplos y dio cuatro seguidos."
    before_phrase: "Miro que se lleven bien entre ellos."
    after_phrase: "Miro la camaradería del grupo."
