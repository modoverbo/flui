schema_version: 1
slug: "camaraderia"
status: "approved"
lemma: "camaradería"
part_of_speech: "sustantivo"
syllables:
  - "ca"
  - "ma"
  - "ra"
  - "de"
  - "rí"
  - "a"
stressed_syllable: 5
ipa_latam: "[ka.ma.ɾa.ðeˈɾi.a]"
ipa_es: "[ka.ma.ɾa.ðeˈɾi.a]"
explanation: "Buen ánimo y cercanía que surgen rápido entre personas que comparten un momento sin conocerse de antes."
example_sentence: "En el curso de fotografía surgió una camaradería inmediata entre quienes ni se conocían el primer día."
register: "neutral"
pedantry_risk: 1
usage_tip: "Funciona bien para el buen ánimo instantáneo entre desconocidos que comparten un curso, una fila o un viaje."
when_not_to_use: "No la uses para una amistad ya consolidada ni para un vínculo que llevó años construirse."
collocations:
  - "camaradería inmediata"
  - "un ambiente de camaradería"
  - "esa camaradería espontánea"
replaces:
  - before: "Nos llevamos superbién desde el primer día del curso"
    after: "Hubo camaradería desde el primer día del curso"
  - before: "Se generó buen ambiente enseguida entre los que estábamos en la fila"
    after: "Se generó camaradería enseguida entre los que estábamos en la fila"
  - before: "En el viaje de trabajo todos se llevaron bien aunque no se conocían"
    after: "En el viaje de trabajo hubo camaradería aunque no se conocían"
family:
  - "camarada"
themes:
  - slug: "small-talk"
    relevance: 3
tags:
  comodin:
    - "nos llevamos bien"
  funcion:
    - "describir"
  canal: "ambos"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "compañerismo"
    difference: "«Compañerismo» es el trato leal y constante entre quienes ya comparten equipo o rutina; «camaradería» aparece de golpe entre quienes acaban de coincidir."
    memory_trick: "El compañerismo se construye con los días; la camaradería nace en un rato."
  - confused_with: "camarilla"
    difference: "«Camarilla» es un grupo cerrado que maniobra en privado para su propio interés; «camaradería» no busca nada a cambio, solo el buen trato del momento."
    memory_trick: "La camarilla conspira a puerta cerrada; la camaradería se nota a simple vista."
exercises:
  - position: 1
    sentence: "Apenas empezó la capacitación de nuevos empleados, Mateo sintió {{blank}} con dos personas que acababa de conocer esa misma mañana."
    hint_general: "Habla del buen trato que aparece de repente entre quienes comparten una actividad, aunque no se conocían."
    explanation: "Camaradería: el buen trato que surge de golpe entre quienes comparten una actividad sin conocerse. «Camarilla» es un grupo que maniobra en secreto para su propio interés, y «afinidad» supone gustos o carácter parecidos, algo que la frase no menciona."
    options:
      - position: 1
        text: "camarilla"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Camarilla» es un grupo que actúa en secreto para beneficio propio, y aquí no hay ningún interés oculto, solo buen trato entre desconocidos."
        hint_specific: "«Camarilla» implica maniobras a puerta cerrada. ¿Hay algún interés escondido en esta escena?"
      - position: 2
        text: "camaradería"
        is_correct: true
      - position: 3
        text: "afinidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Afinidad» habla de gustos o forma de ser parecidos, y la frase no dice que compartan nada de eso, solo que se llevaron bien de inmediato."
        hint_specific: "«Afinidad» supone parecerse en gustos o carácter. ¿La frase menciona algo en común entre ellos?"
  - position: 2
    sentence: "En la fila del banco, que avanzaba lentísimo, Renata notó {{blank}} entre los que llevaban ya una hora esperando juntos."
    hint_general: "Se refiere al buen ánimo compartido que nace entre desconocidos que pasan un rato incómodo juntos."
    explanation: "Camaradería: el buen ánimo que nace entre desconocidos que comparten un rato, como esa fila. «Compañerismo» supone un vínculo previo entre quienes ya trabajan o conviven juntos, y «solidaridad» se reserva para apoyar ante una dificultad seria, no para una espera incómoda."
    options:
      - position: 1
        text: "compañerismo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Compañerismo» describe el trato leal entre quienes ya comparten un equipo o una rutina, y estas personas se acababan de conocer en la fila."
        hint_specific: "«Compañerismo» supone un vínculo que ya existía antes. ¿Estas personas se conocían de antes?"
      - position: 2
        text: "camaradería"
        is_correct: true
      - position: 3
        text: "solidaridad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Solidaridad» se usa para apoyar a alguien ante una dificultad seria, y esperar en una fila no es eso, solo resultó un buen rato compartido."
        hint_specific: "«Solidaridad» suena a ayuda ante un problema grave. ¿Esperar en una fila es una dificultad seria?"
  - position: 3
    sentence: "Al segundo día del viaje de trabajo, ya había {{blank}} entre los colegas de distintas oficinas que compartían el hotel."
    hint_general: "Nombra el clima de buen trato que se instala rápido entre quienes coinciden por unos días."
    explanation: "Camaradería: el clima de buen trato que se instala rápido entre un grupo que convive unos días. «Fraternidad» suena demasiado solemne para un viaje de trabajo, y «cordialidad» solo describe trato amable, sin el ambiente compartido que describe la frase."
    options:
      - position: 1
        text: "fraternidad"
        is_correct: false
        distractor_type: "register"
        why_not: "«Fraternidad» suena solemne, casi de discurso o de causa compartida, y aquí solo es un grupo de colegas pasándola bien un par de días."
        hint_specific: "«Fraternidad» tiene un tono muy solemne. ¿Este viaje de trabajo pide ese tono tan elevado?"
      - position: 2
        text: "camaradería"
        is_correct: true
      - position: 3
        text: "cordialidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cordialidad» solo describe un trato amable, y la frase habla de algo más: un ambiente de buen ánimo compartido entre el grupo."
        hint_specific: "«Cordialidad» es solo ser amable. ¿La frase describe algo más, un ambiente compartido?"
  - position: 4
    sentence: "Después de la primera clase de cerámica, Lucía salió sintiendo {{blank}} con las compañeras de mesa que acababa de conocer esa tarde."
    hint_general: "Se trata del buen ánimo que se genera entre quienes comparten una actividad divertida por primera vez."
    explanation: "Camaradería: el buen ánimo que se genera en un grupo que comparte una actividad por primera vez. «Simpatía» describe lo agradable de una sola persona, y «complicidad» sugiere un entendimiento casi privado entre dos, no el ambiente de toda la mesa."
    options:
      - position: 1
        text: "simpatía"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Simpatía» describe lo agradable que resulta una sola persona, y la frase habla del ambiente entre todo el grupo de mesa, no de una persona en particular."
        hint_specific: "«Simpatía» habla de una persona en concreto. ¿La frase se refiere a una sola persona o a todo el grupo?"
      - position: 2
        text: "complicidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Complicidad» implica un entendimiento casi secreto entre dos personas, y aquí se trata del buen ambiente de todo un grupo recién conocido."
        hint_specific: "«Complicidad» sugiere un entendimiento casi privado. ¿La frase habla de dos personas o de un grupo entero?"
      - position: 3
        text: "camaradería"
        is_correct: true
  - position: 5
    sentence: "Con el vuelo retrasado seis horas, Bruno terminó charlando con dos desconocidos y sintiendo {{blank}} que nadie esperaba encontrar en una sala de espera."
    hint_general: "Habla del buen rato compartido que surge entre extraños atrapados en la misma situación."
    explanation: "Camaradería: el buen rato que surge entre extraños atrapados en la misma situación. «Compadreo» es coloquial y sugiere un trato ya interesado entre conocidos, y «empatía» es comprender los sentimientos de alguien, no el buen ambiente compartido."
    options:
      - position: 1
        text: "compadreo"
        is_correct: false
        distractor_type: "register"
        why_not: "«Compadreo» es coloquial y suena a un trato interesado entre conocidos de siempre, y aquí son extraños que recién se cruzaron por el retraso."
        hint_specific: "«Compadreo» suena informal y hasta interesado. ¿Estas personas ya se conocían de antes?"
      - position: 2
        text: "empatía"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Empatía» es entender lo que siente otra persona, y la frase describe algo distinto: pasarla bien juntos, no solo comprenderse."
        hint_specific: "«Empatía» es comprender los sentimientos de alguien. ¿La frase habla de comprender o de pasarla bien juntos?"
      - position: 3
        text: "camaradería"
        is_correct: true
  - position: 6
    sentence: "En la línea de salida de la carrera, Valentina notó enseguida {{blank}} con quienes corrían junto a ella por primera vez."
    hint_general: "Nombra el buen ánimo espontáneo entre quienes hacen algo juntos aunque acaban de coincidir."
    explanation: "Camaradería: el buen ánimo espontáneo entre quienes comparten una actividad sin conocerse de antes. «Sintonía» habla de coincidir en ideas, no del ambiente de correr juntos, y «hermandad» implica un lazo mucho más profundo del que puede darse en una sola carrera."
    options:
      - position: 1
        text: "sintonía"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sintonía» habla de estar de acuerdo o pensar parecido, y la frase describe otra cosa: el buen ánimo de correr juntos, no coincidir en ideas."
        hint_specific: "«Sintonía» es coincidir en ideas o sentimientos. ¿La frase habla de eso o del ambiente de correr juntos?"
      - position: 2
        text: "camaradería"
        is_correct: true
      - position: 3
        text: "hermandad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Hermandad» implica un vínculo profundo y casi familiar, y aquí se trata de un grupo que recién se conoció en la línea de salida."
        hint_specific: "«Hermandad» supone un lazo muy profundo. ¿Este grupo lleva tiempo junto o recién se conoció?"
  - position: 7
    sentence: "Cuando los vecinos bajaron a ayudar con las cajas, Teo sintió {{blank}} entre gente que hasta ese sábado ni se saludaba."
    hint_general: "Se refiere al buen trato que aparece de pronto entre quienes se ayudan en un momento puntual."
    explanation: "Camaradería: el buen trato que aparece de pronto entre quienes se ayudan en un momento puntual. «Cercanía» sugiere un trato ya frecuente, y «confianza» se construye con el tiempo, algo que un solo sábado no alcanza a dar."
    options:
      - position: 1
        text: "cercanía"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cercanía» solo dice que hay proximidad o trato frecuente, y la frase describe algo más puntual: el buen ánimo de ese sábado en particular."
        hint_specific: "«Cercanía» sugiere un trato ya frecuente. ¿La frase habla de algo que ya venía de antes?"
      - position: 2
        text: "confianza"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Confianza» se construye con el tiempo, y aquí los vecinos ni se saludaban hasta ese mismo sábado."
        hint_specific: "«Confianza» se gana con el tiempo. ¿Estos vecinos ya se trataban de antes?"
      - position: 3
        text: "camaradería"
        is_correct: true
  - position: 8
    sentence: "En la feria, entre los puestos vecinos surgió {{blank}} que duró toda la tarde, aunque ninguno había visto antes a los demás."
    hint_general: "Habla del buen ánimo colectivo entre quienes comparten un espacio por unas horas."
    explanation: "Camaradería: el buen ánimo colectivo entre quienes comparten un espacio por unas horas sin conocerse. «Calidez» describe el trato afectuoso de una sola persona, y «familiaridad» puede sonar a un trato demasiado confianzudo para gente que recién se cruza."
    options:
      - position: 1
        text: "calidez"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Calidez» describe el trato afectuoso de una sola persona, y la frase habla del ambiente entre varios puestos, no del carácter de alguien en particular."
        hint_specific: "«Calidez» describe el trato de una persona. ¿La frase habla de una persona o de un ambiente entre varios?"
      - position: 2
        text: "familiaridad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Familiaridad» puede sonar a un trato demasiado confianzudo, y la frase describe algo más simple: pasarla bien entre desconocidos por una tarde."
        hint_specific: "«Familiaridad» puede sonar excesiva o forzada. ¿La frase describe eso o un buen ambiente sencillo?"
      - position: 3
        text: "camaradería"
        is_correct: true
readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "El taller de la mañana"
    body: "El primer día del taller de ventas, a Sara le tocó trabajar con dos personas de otra sucursal que no conocía. Para la hora del almuerzo ya se reían de las mismas anécdotas y se pasaban apuntes sin pedirlos. «Qué rápido conectamos», le dijo su jefe al verlos juntos. Sara pensó que ese tipo de cosas no se podían planear, solo aparecían."
    before_phrase: "Nos llevamos superbién desde el primer momento."
    after_phrase: "Hubo camaradería desde el primer momento."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "La cola del concierto"
    body: "Llovía y la fila para entrar al concierto no avanzaba, así que Diego empezó a hablar con los que tenía cerca. Terminaron compartiendo un paraguas y cantando la primera canción todos juntos, como si se conocieran de siempre. «Nunca voy a saber sus nombres», le contó después a su hermana, «pero fue una tarde increíble»."
    before_phrase: "Nos hicimos amigos de la nada esa tarde."
    after_phrase: "Se armó una camaradería increíble esa tarde."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "El campamento de mi sobrino"
    body: "Mi sobrino volvió del campamento de verano hablando sin parar de un grupo de chicos que apenas conocía antes del viaje. «Nos ayudábamos con todo, hasta con las carpas», contó en la cena. Mi hermana lo escuchaba sorprendida: nunca lo había visto tan entusiasmado por gente nueva. Le dije que eso, justamente, es lo que un buen campamento debería dejar."
    before_phrase: "Se llevaron increíble desde el primer día, sin conocerse de nada."
    after_phrase: "Se armó una camaradería preciosa desde el primer día."
