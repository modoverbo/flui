schema_version: 1
slug: "conquistar"
status: "approved"
lemma: "conquistar"
part_of_speech: "verbo"
syllables:
  - "con"
  - "quis"
  - "tar"
stressed_syllable: 3
ipa_latam: "[koŋ.kisˈtaɾ]"
ipa_es: "[koŋ.kisˈtaɾ]"
explanation: "Ganar el cariño de alguien poco a poco, con detalles y tiempo, hasta que esa persona se enamore."
example_sentence: "Con una carta y su postre favorito, Rubén esperaba conquistar de nuevo a quien había sido su pareja."
register: "neutral"
pedantry_risk: 1
usage_tip: "Úsalo para el proceso completo de ganarte a alguien, no para un solo gesto aislado."
when_not_to_use: "No lo uses para describir el momento en que ya son pareja: conquistar es el camino, no el resultado."
collocations:
  - "conquistar a alguien"
  - "lograr conquistarla"
  - "el arte de conquistar"
replaces:
  - before: "Quiere que su vecina se fije en él poco a poco"
    after: "Quiere conquistar a su vecina poco a poco"
  - before: "Se ganó el cariño de esa persona con paciencia"
    after: "Logró conquistarla con paciencia"
family:
  - "conquista"
themes:
  - slug: "citas"
    relevance: 3
tags:
  comodin:
    - "ligar"
    - "enamorar"
  funcion:
    - "seducir"
  canal: "hablado"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "convencer"
    difference: "Convencer es lograr que alguien acepte una idea o un argumento; conquistar es ganarte el cariño de alguien con gestos y tiempo."
    memory_trick: "Convences con razones; conquistas con gestos."
exercises:
  - position: 1
    sentence: "Nico no tenía un plan claro, pero sabía que quería {{blank}} a su vecina antes de fin de año."
    hint_general: "Ganarte el cariño de alguien poco a poco, con gestos y tiempo."
    explanation: "Conquistar: ganarte el cariño de alguien poco a poco. «Convencer» es lograr que alguien acepte una idea, y «invadir» implica entrar por la fuerza, sin relación con ganarse el cariño de alguien."
    options:
      - position: 1
        text: "conquistar"
        is_correct: true
      - position: 2
        text: "convencer"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Convencer» es lograr que alguien acepte una idea o un argumento, y aquí Nico busca ganarse el cariño de su vecina, no discutir con ella."
        hint_specific: "Convencer es ganar un argumento. ¿Nico quiere ganar una discusión o el cariño de su vecina?"
      - position: 3
        text: "invadir"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Invadir» implica entrar por la fuerza, y aquí Nico busca acercarse con gestos, sin forzar nada."
        hint_specific: "Invadir implica forzar la entrada a algo. ¿Nico fuerza algo o se acerca con gestos?"
  - position: 2
    sentence: "Después de meses de detalles pequeños, Camila por fin logró {{blank}} a su compañero de laboratorio."
    hint_general: "Ganarte el cariño de alguien con constancia y gestos a lo largo del tiempo."
    explanation: "Conquistar: ganarse el cariño de alguien con constancia. «Contratar» implica un acuerdo laboral, sin relación con ganarse el cariño de alguien, y «asustar» describe justo lo contrario de un acercamiento con gestos."
    options:
      - position: 1
        text: "conquistar"
        is_correct: true
      - position: 2
        text: "contratar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Contratar» implica un acuerdo laboral, y la frase describe meses de detalles pequeños, sin relación con un contrato de trabajo."
        hint_specific: "Contratar es un acuerdo de trabajo. ¿Camila firmó un contrato o hizo gestos con el tiempo?"
      - position: 3
        text: "asustar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Asustar» describe justo lo contrario de un acercamiento con gestos pequeños durante meses."
        hint_specific: "Asustar aleja a alguien. ¿Camila alejó a su compañero o se acercó con gestos?"
  - position: 3
    sentence: "En la serie, el protagonista pasa toda la temporada intentando {{blank}} a su mejor amiga de la infancia."
    hint_general: "Buscar ganarte el cariño de alguien a lo largo de una historia completa."
    explanation: "Conquistar: buscar ganarte el cariño de alguien a lo largo del tiempo. «Convencer» es lograr que alguien acepte una idea, y «contratar» implica un acuerdo laboral, sin relación con una historia de amor."
    options:
      - position: 1
        text: "convencer"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Convencer» es lograr que alguien acepte una idea o un argumento, y aquí el protagonista busca ganarse el cariño de su amiga, no discutir con ella."
        hint_specific: "Convencer es ganar un argumento. ¿El protagonista busca ganar una discusión o el cariño de su amiga?"
      - position: 2
        text: "conquistar"
        is_correct: true
      - position: 3
        text: "contratar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Contratar» implica un acuerdo laboral, sin relación con ganarse el cariño de una amiga de la infancia."
        hint_specific: "Contratar es un acuerdo de trabajo. ¿La serie habla de un contrato o de una historia de amor?"
  - position: 4
    sentence: "Bruno se pasó el verano tratando de {{blank}} a la salvavidas de la playa, sin ningún éxito."
    hint_general: "Intentar ganarte el cariño de alguien, aunque no siempre funcione."
    explanation: "Conquistar: intentar ganarte el cariño de alguien. «Levantar» es coloquial y suena a un intento rápido, y «contratar» implica un acuerdo laboral; ninguno describe un verano entero de intentos."
    options:
      - position: 1
        text: "conquistar"
        is_correct: true
      - position: 2
        text: "levantar"
        is_correct: false
        distractor_type: "register"
        why_not: "«Levantar» es coloquial y suena a un intento rápido y superficial, y la frase describe un verano entero de intentos, no un momento aislado."
        hint_specific: "«Levantar» suena a algo rápido y sin esfuerzo. ¿Bruno lo intentó todo un verano o solo un momento?"
      - position: 3
        text: "contratar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Contratar» implica un acuerdo laboral, sin relación con ganarse el cariño de la salvavidas de la playa."
        hint_specific: "Contratar es un acuerdo de trabajo. ¿Bruno buscaba un contrato o el cariño de la salvavidas?"
  - position: 5
    sentence: "Con solo dos preguntas bien pensadas, Elena logró {{blank}} a toda la mesa en la primera cena familiar."
    hint_general: "Ganarte el cariño de un grupo entero, no solo de una persona."
    explanation: "Conquistar: ganarte el cariño de un grupo entero. «Intimidar» describe generar miedo, justo lo contrario de ganar cariño, y «contratar» implica un acuerdo laboral, sin relación con una cena familiar."
    options:
      - position: 1
        text: "conquistar"
        is_correct: true
      - position: 2
        text: "intimidar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Intimidar» describe generar miedo, justo lo contrario de ganarse el cariño de toda la mesa en una cena familiar."
        hint_specific: "Intimidar genera miedo. ¿Elena generó miedo o cariño en la mesa?"
      - position: 3
        text: "contratar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Contratar» implica un acuerdo laboral, sin relación con ganarse el cariño de una familia en una cena."
        hint_specific: "Contratar es un acuerdo de trabajo. ¿Elena firmó algo o ganó el cariño de la mesa?"
  - position: 6
    sentence: "Diego admitió que nunca supo bien cómo {{blank}} a alguien sin sentirse ridículo en el intento."
    hint_general: "La forma de ganarte el cariño de alguien, aunque a veces dé vergüenza intentarlo."
    explanation: "Conquistar: la forma de ganarte el cariño de alguien. «Contratar» implica un acuerdo laboral, y «amenazar» describe generar miedo, ninguno de los dos describe ganarse el cariño de alguien."
    options:
      - position: 1
        text: "conquistar"
        is_correct: true
      - position: 2
        text: "amenazar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Amenazar» describe generar miedo, y la frase habla de la vergüenza al intentar ganarse el cariño de alguien, no de generar miedo."
        hint_specific: "Amenazar genera miedo. ¿Diego busca generar miedo o ganarse el cariño de alguien?"
      - position: 3
        text: "contratar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Contratar» implica un acuerdo laboral, sin relación con ganarse el cariño de alguien sin sentirse ridículo."
        hint_specific: "Contratar es un acuerdo de trabajo. ¿Diego habla de un contrato o de ganarse el cariño de alguien?"
  - position: 7
    sentence: "El plan de Marina para {{blank}} a su ex otra vez incluía una carta y su postre favorito."
    hint_general: "Intentar volver a ganarte el cariño de alguien que ya conociste antes."
    explanation: "Conquistar: intentar volver a ganarte el cariño de alguien. «Contratar» implica un acuerdo laboral, y «asustar» describe justo lo contrario de una carta y un postre favorito."
    options:
      - position: 1
        text: "conquistar"
        is_correct: true
      - position: 2
        text: "contratar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Contratar» implica un acuerdo laboral, sin relación con una carta y un postre para volver a ganarse el cariño de alguien."
        hint_specific: "Contratar es un acuerdo de trabajo. ¿Marina prepara un contrato o una carta con postre?"
      - position: 3
        text: "asustar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Asustar» describe justo lo contrario de una carta y un postre favorito pensados para agradar."
        hint_specific: "Asustar aleja a alguien. ¿La carta y el postre buscan asustar o agradar?"
  - position: 8
    sentence: "Con su forma de contar historias, Rubén termina {{blank}} a cualquiera que se siente a escucharlo diez minutos."
    hint_general: "Ganarte el cariño de cualquiera, casi sin proponértelo."
    explanation: "Conquistando: ganándote el cariño de cualquiera, casi sin proponértelo. «Aburriendo» describe justo lo contrario, y «contratando» implica un acuerdo laboral, sin relación con contar historias."
    options:
      - position: 1
        text: "conquistando"
        is_correct: true
      - position: 2
        text: "aburriendo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Aburrir» describe justo lo contrario, y la frase dice que cualquiera termina encantado después de escucharlo diez minutos."
        hint_specific: "Aburrir aleja el interés de alguien. ¿Rubén aburre a la gente o se gana su cariño?"
      - position: 3
        text: "contratando"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Contratar» implica un acuerdo laboral, sin relación con contar historias que ganan el cariño de quien escucha."
        hint_specific: "Contratar es un acuerdo de trabajo. ¿Rubén firma contratos o cuenta historias que ganan cariño?"
readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "El plan sin plan"
    body: "Nico no tenía ninguna estrategia armada, solo ganas de hablar más seguido con su vecina. «Quiero conquistarla antes de fin de año», le confesó a un amigo, «aunque todavía no sé bien cómo empezar»."
    before_phrase: "Quiero que se fije en mí antes de fin de año."
    after_phrase: "Quiero conquistarla antes de fin de año."
  - position: 2
    scene: "trabajo"
    conversation_type: "practica"
    title: "El compañero de laboratorio"
    body: "Después de meses de café compartido y bromas internas, Camila por fin se animó a invitarlo a cenar. «Me tomó meses conquistarlo», le contó a una amiga, «pero valió cada detalle pequeño»."
    before_phrase: "Me tomó meses que se fijara en mí."
    after_phrase: "Me tomó meses conquistarlo."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "La cena familiar"
    body: "Elena llegó nerviosa a la primera cena con la familia de su pareja. Al final de la noche, su suegra le dijo: «Nos conquistaste a todos con esas preguntas», y Elena por fin pudo relajarse."
    before_phrase: "Le caíste bien a toda la familia con esas preguntas."
    after_phrase: "Nos conquistaste a todos con esas preguntas."
