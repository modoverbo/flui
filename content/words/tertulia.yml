schema_version: 1
slug: "tertulia"
status: "approved"
lemma: "tertulia"
part_of_speech: "sustantivo"
syllables:
  - "ter"
  - "tu"
  - "lia"
stressed_syllable: 2
ipa_latam: "[teɾˈtu.lja]"
ipa_es: "[teɾˈtu.lja]"
explanation: "Reunión informal de varias personas para hablar de un tema con calma, sin agenda fija."
example_sentence: "Cada viernes, un grupo de diseñadores se junta en el café para su tertulia sobre tendencias."
register: "neutral"
pedantry_risk: 1
usage_tip: "Úsalo para una charla en grupo, relajada y sin objetivo comercial inmediato, aunque el tema sea de trabajo."
when_not_to_use: "No lo uses para una junta con objetivos y horario fijo: eso es una reunión, no una tertulia."
collocations:
  - "una tertulia sobre"
  - "organizar una tertulia"
  - "tertulia literaria"
replaces:
  - before: "La juntada semanal para hablar de temas del sector"
    after: "La tertulia semanal sobre temas del sector"
  - before: "Nos reunimos a charlar sin agenda fija"
    after: "Armamos una tertulia sin agenda fija"
family: []
themes:
  - slug: "networking"
    relevance: 3
  - slug: "small-talk"
    relevance: 1
tags:
  comodin:
    - "juntada para hablar"
    - "charla de grupo"
  funcion:
    - "conversar"
    - "vincular"
  canal: "hablado"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "conferencia"
    difference: "La conferencia es una exposición formal de una persona hacia un público; la tertulia es una charla entre varios, sin un único orador."
    memory_trick: "En la conferencia uno habla; en la tertulia todos hablan."
exercises:
  - position: 1
    sentence: "Cada viernes, un grupo de diseñadores organiza una {{blank}} en el café para hablar de tendencias, sin presentaciones ni horario cerrado."
    hint_general: "Una charla en grupo, relajada y sin agenda fija."
    explanation: "Tertulia: una charla en grupo, relajada y sin agenda fija. «Conferencia» es una exposición formal de una sola persona, y «cita» describe un encuentro entre dos, no un grupo hablando entre sí."
    options:
      - position: 1
        text: "tertulia"
        is_correct: true
      - position: 2
        text: "conferencia"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «conferencia» es una exposición formal de una sola persona, y aquí varios diseñadores conversan entre ellos sin un único orador."
        hint_specific: "En una conferencia habla una sola persona. ¿Aquí habla uno o hablan todos?"
      - position: 3
        text: "cita"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «cita» describe un encuentro entre dos personas, y aquí se reúne un grupo entero de diseñadores."
        hint_specific: "Una cita suele ser entre dos. ¿Aquí se junta una pareja o un grupo?"
  - position: 2
    sentence: "Sin ningún tema fijado, la {{blank}} del sábado terminó hablando de política, cine y del último libro que nadie había leído."
    hint_general: "Una charla de grupo que puede saltar de un tema a otro sin agenda."
    explanation: "Tertulia: una charla de grupo que puede saltar de tema sin agenda. «Auditoría» revisa cuentas o procesos, y «tortilla» es un plato de comida, sin relación con una charla."
    options:
      - position: 1
        text: "auditoría"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «auditoría» revisa cuentas o procesos con un objetivo fijo, y aquí el grupo salta de tema sin ningún propósito concreto."
        hint_specific: "Una auditoría tiene un objetivo claro. ¿Aquí hay un objetivo o solo charla libre?"
      - position: 2
        text: "tertulia"
        is_correct: true
      - position: 3
        text: "tortilla"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «tortilla» es un plato de comida, sin relación con una charla de grupo sobre varios temas."
        hint_specific: "Una tortilla se come, no se conversa. ¿La frase habla de comida o de una charla?"
  - position: 3
    sentence: "En la radio local, la {{blank}} de los sábados reúne cada semana a tres invitados distintos para comentar la actualidad."
    hint_general: "Un espacio donde varias personas conversan juntas sobre un tema."
    explanation: "Tertulia: un espacio donde varias personas conversan juntas. «Entrevista» tiene a una sola persona respondiendo preguntas, y «tortilla» es un plato de comida, sin relación con un programa de radio."
    options:
      - position: 1
        text: "entrevista"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "En una «entrevista» una sola persona responde preguntas, y aquí tres invitados conversan entre sí cada semana."
        hint_specific: "En una entrevista responde una sola persona. ¿Aquí responden tres o solo uno?"
      - position: 2
        text: "tertulia"
        is_correct: true
      - position: 3
        text: "tortilla"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «tortilla» es un plato de comida, sin relación con un programa de radio con invitados."
        hint_specific: "Una tortilla no comenta la actualidad. ¿La frase habla de comida o de un programa?"
  - position: 4
    sentence: "Después del cierre del trimestre, el equipo armó una {{blank}} informal para hablar de lo aprendido, sin diapositivas ni acta."
    hint_general: "Una charla relajada de grupo, sin materiales formales ni registro escrito."
    explanation: "Tertulia: una charla relajada de grupo, sin materiales formales. «Junta» suena a reunión con agenda cerrada, y «chamba» es coloquial y regional, sin relación con nombrar este tipo de charla."
    options:
      - position: 1
        text: "tertulia"
        is_correct: true
      - position: 2
        text: "junta"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Junta» suena a reunión con agenda cerrada, y la frase aclara que el encuentro fue informal, sin diapositivas ni acta."
        hint_specific: "Una junta suele tener acta. ¿La frase dice que hubo acta?"
      - position: 3
        text: "chamba"
        is_correct: false
        distractor_type: "register"
        why_not: "«Chamba» es coloquial y regional, y aquí se busca nombrar con precisión un tipo de charla de grupo, no el trabajo en sí."
        hint_specific: "«Chamba» es muy informal y regional. ¿La frase describe el trabajo o un tipo de charla?"
  - position: 5
    sentence: "Los vecinos del quinto piso mantienen una {{blank}} improvisada cada vez que se cruzan en el ascensor con tiempo de sobra."
    hint_general: "Una charla que surge sin planearse, entre varias personas."
    explanation: "Tertulia: una charla que surge sin planearse, entre varias personas. «Discusión» sugiere desacuerdo, y «tortilla» es un plato de comida, sin relación con hablar en el ascensor."
    options:
      - position: 1
        text: "tertulia"
        is_correct: true
      - position: 2
        text: "discusión"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Discusión» sugiere un desacuerdo, y la frase no menciona ningún conflicto entre los vecinos del ascensor."
        hint_specific: "Una discusión implica tensión. ¿La frase menciona algún conflicto?"
      - position: 3
        text: "tortilla"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «tortilla» es un plato de comida, sin relación con hablar en el ascensor."
        hint_specific: "Una tortilla no se improvisa en un ascensor. ¿La frase habla de comida o de una charla?"
  - position: 6
    sentence: "Tras la proyección, el cineclub organizó una {{blank}} abierta para que el público comentara la película con el director."
    hint_general: "Un espacio de charla abierta entre varias personas después de un evento."
    explanation: "Tertulia: un espacio de charla abierta entre varias personas. «Encuesta» recoge respuestas cerradas y por escrito, y «tortilla» es un plato de comida, sin relación con comentar una película."
    options:
      - position: 1
        text: "tertulia"
        is_correct: true
      - position: 2
        text: "encuesta"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Una «encuesta» recoge respuestas cerradas y por escrito, y aquí el público conversa en voz alta con el director."
        hint_specific: "Una encuesta se responde por escrito. ¿Aquí se conversa en voz alta o se llena un formulario?"
      - position: 3
        text: "tortilla"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Una «tortilla» es un plato de comida, sin relación con comentar una película con el director."
        hint_specific: "Una tortilla no comenta películas. ¿La frase habla de comida o de una charla?"
  - position: 7
    sentence: "Rubén extrañaba las {{blank}} de sobremesa de su abuela, donde tres generaciones hablaban de todo hasta tarde."
    hint_general: "Momentos de charla larga entre varias personas, sin prisa ni tema fijo."
    explanation: "Tertulias: momentos de charla larga entre varias personas, sin prisa. «Siestas» son momentos de descanso, no de conversación, y «tortillas» son un plato de comida, sin relación con hablar hasta tarde."
    options:
      - position: 1
        text: "siestas"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Las «siestas» son momentos de descanso, y la frase habla de conversaciones entre tres generaciones, no de dormir."
        hint_specific: "Una siesta es para dormir. ¿La frase habla de dormir o de conversar?"
      - position: 2
        text: "tertulias"
        is_correct: true
      - position: 3
        text: "tortillas"
        is_correct: false
        distractor_type: "paronym"
        why_not: "Las «tortillas» son un plato de comida, y la frase habla de conversaciones largas entre generaciones."
        hint_specific: "Una tortilla no habla hasta tarde. ¿La frase describe comida o conversación?"
readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "El café de los viernes"
    body: "Cada viernes, sin invitación formal, un grupo de diseñadores se juntaba en el café de la esquina. «Es nuestra tertulia semanal», le explicó Nico a la nueva del equipo. «Sin diapositivas, solo hablamos de lo que nos gustó y lo que nos irritó esta semana»."
    before_phrase: "Es la juntada semanal para hablar de lo que sea."
    after_phrase: "Es nuestra tertulia semanal."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "La mesa del bar"
    body: "El bar del barrio tenía fama por una mesa fija cada tarde. «Ahí se arma la tertulia de los jubilados», contó el dueño, «llevan treinta años debatiendo de fútbol sin que ninguno cambie de opinión»."
    before_phrase: "Siempre se juntan a hablar en esa mesa."
    after_phrase: "Ahí se arma la tertulia de siempre."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "La sobremesa de la abuela"
    body: "Rubén contó que extrañaba las tertulias de sobremesa en casa de su abuela, donde abuelos, padres e hijos hablaban de todo hasta tarde. Su pareja lo escuchó y dijo: «Hagamos una así el domingo, sin prisa por levantarnos de la mesa»."
    before_phrase: "Extraño esas charlas largas de sobremesa."
    after_phrase: "Extraño esas tertulias de sobremesa."
