confusions:
  - confused_with: "incidir"
    difference: "«Incidir» es influir en algo o insistir en un punto; la otra palabra es estar en el mismo sitio que alguien sin haberlo buscado."
    memory_trick: "Incides cuando influyes; coincides cuando te cruzas."
  - confused_with: "quedar"
    difference: "«Quedar» con alguien es acordar antes la hora y el sitio; aquí el encuentro ocurre sin que nadie lo haya preparado."
    memory_trick: "Quedas porque lo decides; coincides porque pasa."
exercises:
  - position: 1
    sentence: "Ayer Cecilia {{blank}} con su vecina en la cola del pan y las dos se rieron de la sorpresa."
    hint_general: "Se encontraron sin buscarse y les hizo gracia el azar."
    explanation: "Coincidió: se encontraron sin buscarse. «Incidió» es influir o insistir en algo, y «quedó» significa que lo habrían acordado antes."
    options:
      - position: 1
        text: "incidió"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Incidir» es influir en algo o insistir en un punto, y aquí solo se cruzan dos vecinas en una cola."
        hint_specific: "«Incidir» influye o insiste. ¿Cecilia influye en algo o se cruza con alguien?"
      - position: 2
        text: "coincidió"
        is_correct: true
      - position: 3
        text: "quedó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Quedar» con alguien es acordarlo antes, y la frase dice que las dos se sorprendieron."
        hint_specific: "«Quedar» se acuerda por adelantado. ¿Por qué se sorprenden si estaba pactado?"
  - position: 2
    sentence: "Álvaro y su hermano llevaban años sin verse y {{blank}} por casualidad en un aeropuerto pequeño."
    hint_general: "Se encontraron sin plan después de mucho tiempo sin saber el uno del otro."
    explanation: "Coincidieron: se encontraron sin plan. «Decidieron» habla de tomar una decisión, y «buscaron» sería que uno fue a por el otro."
    options:
      - position: 1
        text: "coincidieron"
        is_correct: true
      - position: 2
        text: "decidieron"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Decidir» es tomar una decisión, y aquí nadie decide nada: el encuentro ocurre solo."
        hint_specific: "«Decidir» elige entre opciones. ¿Qué eligieron los hermanos?"
      - position: 3
        text: "buscaron"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Buscar» implica ir a por alguien, y la frase dice que fue pura casualidad."
        hint_specific: "«Buscar» va a propósito. Relee el final: ¿fue casualidad o intención?"
  - position: 3
    sentence: "«Si {{blank}} con Paula en el pasillo, dile que la llamo esta tarde», le pidió Simón a Blanca."
    hint_general: "Si te la encuentras sin buscarla, dale ese recado."
    explanation: "Coincides: si te la encuentras sin buscarla. «Incides» es influir o insistir en algo, y «quedas» supondría una cita acordada de antemano."
    options:
      - position: 1
        text: "incides"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Incidir» es influir en algo o insistir en un punto, y aquí solo se habla de cruzarse en un pasillo."
