        hint_specific: "«Quedar» exige una cita acordada. ¿Simón le pide que la busque o que se la encuentre?"
  - position: 4
    sentence: "Ramón y Silvia {{blank}} en la misma clase de cocina sin saber que vivían en el mismo edificio."
    hint_general: "Acabaron en el mismo sitio sin conocerse de antes."
    explanation: "Coincidieron: acabaron en el mismo sitio sin conocerse. «Residieron» es vivir en un lugar, y «quedaron» implica un acuerdo previo entre ellos."
