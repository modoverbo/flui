  - position: 8
    sentence: "Volvieron a {{blank}} diez años después, en la boda de una amiga común, cuenta Susana."
    hint_general: "Se encontraron otra vez sin haberlo buscado, una década más tarde."
    explanation: "Coincidir: se encontraron otra vez sin buscarlo. «Residir» es vivir en un lugar, y «visitar» sería que uno fuera a ver al otro a propósito."
    options:
      - position: 1
        text: "residir"
