ipa_latam: "[ri.ði.ku.liˈsar]"
ipa_es: "[ri.ði.ku.liˈθar]"
explanation: "Hacer una versión muy grande de las fallas de una idea, para mostrar lo débil que es ante el público."
example_sentence: "El columnista ridiculizó la propuesta de ley exagerando cada uno de sus puntos más débiles."
register: "neutral"
pedantry_risk: 2
usage_tip: "Funciona mejor con ideas, argumentos o decisiones públicas; usarla sobre una persona en concreto suena agresivo."
when_not_to_use: "No la uses para el físico, el origen o la forma de hablar de alguien; ahí deja de ser crítica y se vuelve un ataque."
collocations:
  - "ridiculizar una idea"
  - "ridiculizar un argumento"
