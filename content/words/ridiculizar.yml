confusions:
  - confused_with: "criticar"
    difference: "«Criticar» es evaluar algo señalando lo bueno y lo malo; «ridiculizar» exagera solo lo malo hasta que parezca absurdo."
    memory_trick: "Criticar pesa los dos lados; ridiculizar solo se queda con el peor."
  - confused_with: "parodiar"
    difference: "«Parodiar» imita el estilo de algo para divertir, sin necesariamente atacarlo; «ridiculizar» busca dejarlo mal, no solo imitarlo."
    memory_trick: "Parodiar copia el estilo; ridiculizar apunta al fallo."
