    hint_general: "Busca el verbo para exagerar los puntos débiles de algo hasta que suene absurdo."
    explanation: "Ridiculizó: el cómico exageró los puntos débiles de la ley hasta que sonara absurda. «Radicalizó» es volver algo más extremo, y «explicó» es aclarar con información, ninguna encaja con exagerar para hacer reír."
