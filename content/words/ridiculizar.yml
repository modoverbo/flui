    body: "Nicolás dibujaba una tira cómica cada mes para la revista interna de la empresa. Cuando llegó la nueva política de «cero correos después de las seis», ridiculizó el tema con un personaje escondido bajo el escritorio revisando el celular. El área de recursos humanos terminó pidiéndole la tira enmarcada."
