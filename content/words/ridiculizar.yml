    body: "El grupo de teatro de barrio buscaba un tema para su próxima función y alguien propuso las dietas milagro que circulaban en redes. Ridiculizaron la moda con una escena sobre una mujer que solo comía humo de incienso, y la función se llenó tres fines de semana seguidos."
    before_phrase: "Nos burlamos tanto de la moda que quedó como un chiste."
    after_phrase: "Ridiculizamos la moda con una escena de teatro."
