    sentence: "La película {{blank}} a Casandra hasta el punto de que llamó a su madre nada más salir del cine."
    hint_general: "La película le tocó el ánimo y la empujó a llamar a casa."
    explanation: "Conmovió: le toca el ánimo y llama a casa. «Entretuvo» solo haría pasar dos horas, y «estremeció» apunta al escalofrío del miedo o del asombro."
