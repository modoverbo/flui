readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Un nombre propio"
    body: "Llevaban dos años presentando el proyecto con cifras y nadie se movía. Ivonne cambió la primera diapositiva por una historia con un nombre y un apellido. «Las cifras convencen; esto conmueve», dijo. Aquella vez aprobaron el presupuesto."
    before_phrase: "Hay que hacerlo más emotivo, que llegue más."
    after_phrase: "Las cifras convencen; esto conmueve."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La llamada del cine"
    body: "Casandra salió del cine y llamó a su madre sin pensarlo. Estuvieron veinte minutos hablando de una película que su madre no había visto. «Me ha conmovido y necesitaba oírte», le dijo antes de colgar. Su madre lo contó durante semanas."
    before_phrase: "Me ha dado un bajón raro y te he llamado."
    after_phrase: "Me ha conmovido y necesitaba oírte."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "El sitio de los domingos"
    body: "Cada domingo, el vecino de Berta le guardaba el sitio en la primera fila del auditorio. Ella nunca dijo nada hasta el último concierto. «Esto me conmueve más de lo que parece», le soltó al final. Él se encogió de hombros y siguió guardándoselo."
    before_phrase: "Me hace mucha ilusión, de verdad."
    after_phrase: "Esto me conmueve más de lo que parece."
