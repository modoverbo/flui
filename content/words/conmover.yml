      - position: 2
        text: "conmovió"
        is_correct: true
      - position: 3
        text: "impresionó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Impresionar» habla del asombro ante algo grande o raro, y aquí lo que llega es una carta corriente que toca el ánimo."
        hint_specific: "«Impresionar» va de tamaño y de asombro. ¿Era espectacular esa carta?"
  - position: 2
    sentence: "Le contaron el caso con cifras y no {{blank}} a nadie; se lo contaron con un nombre propio y lloró media oficina."
    hint_general: "Las cifras no tocaron el ánimo de nadie; el nombre propio sí."
    explanation: "Conmovió: las cifras no tocan el ánimo y el nombre propio sí. «Convenció» cambiaría lo que piensan, cosa que las cifras sí hacen, y «sorprendió» apunta a lo inesperado."
    options:
      - position: 1
        text: "convenció"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Convencer» cambia lo que alguien piensa, y las cifras sirven justo para eso: lo que no lograron fue tocar el ánimo."
        hint_specific: "«Convencer» trabaja con razones. ¿Qué es lo que las cifras sí hacían bien?"
      - position: 2
        text: "conmovió"
        is_correct: true
      - position: 3
        text: "sorprendió"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sorprender» es pillar a alguien desprevenido, y aquí nadie se asombra: la gente se emociona con un nombre."
        hint_specific: "«Sorprender» va de lo inesperado. ¿Lo que pasa es asombro o emoción?"
  - position: 3
    sentence: "A Berta la {{blank}} que su vecino le guardara el sitio cada domingo, y nunca llegó a decírselo."
    hint_general: "Ese gesto pequeño le llegó por dentro."
    explanation: "Conmovió: ese gesto pequeño le llegó por dentro. «Derritió» es coloquial y se usa con bebés o cachorros, y «entretuvo» solo haría pasar el rato."
