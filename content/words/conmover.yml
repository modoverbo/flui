exercises:
  - position: 1
    sentence: "El montaje no era gran cosa, pero la carta que leyeron al final {{blank}} a toda la sala."
    hint_general: "La carta tocó el ánimo de todos los presentes."
    explanation: "Conmovió: la carta tocó el ánimo de todos. «Removió» sacaría a flote asuntos viejos e incómodos, e «impresionó» apunta al asombro, no al ánimo."
    options:
      - position: 1
        text: "removió"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Remover» saca a flote asuntos viejos y suele dejar incómodo, y lo que se describe es un momento compartido y limpio."
