      - position: 2
        text: "entretuvo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Entretener» hace pasar el rato, y a Berta no se le pasa el rato con eso: se le queda dentro y no sabe cómo decirlo."
        hint_specific: "«Entretener» llena un hueco de tiempo. ¿Qué le ocupa a Berta, el tiempo o el ánimo?"
      - position: 3
        text: "conmovió"
        is_correct: true
