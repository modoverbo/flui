confusions:
  - confused_with: "acondicionar"
    difference: "«Acondicionar» es preparar un espacio o una cosa para que sirva; lo otro es hacer que algo dependa de un requisito."
    memory_trick: "Acondicionas una sala; condicionas un sí."
  - confused_with: "obligar"
    difference: "«Obligar» no deja salida al otro; poner un requisito sí la deja, porque la otra parte puede aceptarlo o marcharse."
    memory_trick: "Quien obliga cierra la puerta; quien condiciona la deja entornada."
exercises:
  - position: 1
    sentence: "Marta aceptó el encargo, pero {{blank}} la entrega a que le pasaran las fotos esa misma semana."
    hint_general: "Acepta, aunque deja su entrega atada a que lleguen las fotos."
    explanation: "Condicionó: dejó la entrega atada a las fotos. «Acondicionó» sería preparar un espacio, y «aplazó» significaría retrasarla sin pedir nada a cambio."
    options:
      - position: 1
        text: "acondicionó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Acondicionar» es preparar un lugar o una cosa para que sirva; una entrega no se prepara así, se ata a un requisito."
        hint_specific: "Acondicionar prepara un espacio. ¿Marta prepara algo o pide algo?"
      - position: 2
        text: "condicionó"
        is_correct: true
      - position: 3
        text: "aplazó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Aplazar» es retrasar sin más; Marta no retrasa nada, dice de qué depende que llegue a tiempo."
        hint_specific: "Aplazar retrasa sin pedir nada. ¿Marta retrasa o pide algo a cambio?"
  - position: 2
    sentence: "El banco {{blank}} el préstamo a que la empresa presentara las cuentas del año pasado."
    hint_general: "El préstamo solo sale adelante si antes llegan esas cuentas."
    explanation: "Condicionó: el préstamo depende de esas cuentas. «Acondicionó» sería adecuar un espacio, y «prometió» daría el dinero por hecho, cuando todavía no lo está."
    options:
      - position: 1
        text: "prometió"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Prometer» daría el préstamo por hecho; la frase dice lo contrario, que primero hay que entregar las cuentas."
        hint_specific: "Prometer da algo por seguro. ¿El dinero está seguro o depende de algo?"
      - position: 2
        text: "acondicionó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Acondicionar» es preparar un local o un equipo; un préstamo no se prepara así, se ata a un requisito."
        hint_specific: "Acondicionar prepara locales. ¿Aquí se prepara un local?"
      - position: 3
        text: "condicionó"
        is_correct: true
  - position: 3
    sentence: "El equipo de Iván {{blank}} su parte del trabajo a que llegaran antes los permisos del ayuntamiento."
    hint_general: "Su parte depende de que lleguen primero esos permisos."
    explanation: "Condicionó: su parte depende de los permisos. «Acondicionó» sería preparar un espacio, y «limitó» diría que hizo menos trabajo, no que puso un requisito."
    options:
      - position: 1
        text: "limitó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Limitar» diría que el equipo hizo menos trabajo del previsto; aquí el trabajo es el mismo, pero depende de un papel."
        hint_specific: "Limitar reduce la cantidad. ¿El equipo hace menos o espera algo?"
      - position: 2
        text: "condicionó"
        is_correct: true
      - position: 3
        text: "acondicionó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Acondicionar» es preparar un local para que funcione; el equipo no prepara ningún local, pone un requisito."
        hint_specific: "Acondicionar prepara locales. ¿Qué pone el equipo, un local o un requisito?"
  - position: 4
    sentence: "Mi padre {{blank}} el préstamo del coche a que volviéramos antes de la una."
    hint_general: "El coche solo sale si se cumple la hora de vuelta."
    explanation: "Condicionó: el coche depende de la hora de vuelta. «Condonó» sería perdonar una deuda, y «acondicionó» sería dejar el coche a punto."
    options:
      - position: 1
        text: "condonó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Condonar» un préstamo es perdonarlo y dar la deuda por saldada, y aquí el padre no perdona nada: pone una hora."
        hint_specific: "«Condonar» perdona una deuda. ¿El padre perdona algo o pone una condición?"
      - position: 2
        text: "acondicionó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Acondicionar» el coche sería dejarlo a punto para el viaje; aquí lo que hace el padre es poner una hora."
        hint_specific: "Acondicionar deja algo a punto. ¿El padre arregla el coche o pone una hora?"
      - position: 3
        text: "condicionó"
        is_correct: true
  - position: 5
    sentence: "En la oferta, la subida de sueldo quedaba {{blank}} a los resultados del primer trimestre."
    hint_general: "La subida depende de lo que pase en esos tres meses."
    explanation: "Condicionada: la subida depende de esos tres meses. «Acondicionada» hablaría de un espacio preparado, y «asegurada» diría lo contrario, que ya está garantizada."
    options:
      - position: 1
        text: "acondicionada"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Acondicionar» se dice de una sala o de un local que se deja listo; una subida de sueldo no se deja lista así."
        hint_specific: "Acondicionada se dice de un local. ¿La subida es un local?"
      - position: 2
        text: "condicionada"
        is_correct: true
      - position: 3
        text: "asegurada"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Asegurada» diría que la subida está garantizada pase lo que pase; la frase dice justo lo contrario."
        hint_specific: "Asegurada significa garantizada. ¿La subida está garantizada?"
  - position: 6
    sentence: "Nadie quiere trabajar con quien {{blank}} cada favor a recibir otro a cambio."
    hint_general: "Hace que cada favor dependa de recibir otro de vuelta."
    explanation: "Condiciona: hace que cada favor dependa de otro. «Acondiciona» sería preparar un espacio, y «exige» diría que reclama sin más, sin poner nada de su parte."
    options:
      - position: 1
        text: "acondiciona"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Acondicionar» es preparar un sitio para que sirva; un favor no se prepara, se hace o se cobra."
        hint_specific: "Acondicionar prepara sitios. ¿Un favor es un sitio?"
      - position: 2
        text: "exige"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Exigir» es reclamar algo sin dar nada; en la frase esta persona sí hace el favor, pero espera otro de vuelta."
        hint_specific: "Exigir reclama sin dar. ¿Esta persona da algo o solo reclama?"
      - position: 3
        text: "condiciona"
        is_correct: true
  - position: 7
    sentence: "La respuesta de Natalia fue un sí {{blank}}: le encantaba el puesto y lo aceptaba en cuanto le cambiaran el horario."
    hint_general: "Dice que sí, aunque su sí depende de una cosa concreta."
    explanation: "Condicionado: su sí depende del horario. «Acondicionado» se dice de un local preparado, y «tibio» diría que el puesto no le entusiasmaba."
    options:
      - position: 1
        text: "condicionado"
        is_correct: true
      - position: 2
        text: "acondicionado"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Acondicionado» se dice de un local que ya está listo para usarse; una respuesta no se prepara de esa manera."
        hint_specific: "Acondicionado se dice de un local. ¿Una respuesta es un local?"
      - position: 3
        text: "tibio"
        is_correct: false
        distractor_type: "register"
        why_not: "«Tibio» diría que el puesto le daba un poco igual, y la frase cuenta que le encantaba."
        hint_specific: "«Tibio» va de poco entusiasmo. ¿Qué le parecía a Natalia ese puesto?"
readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "El sí con letra pequeña"
    body: "Le pedían la web para el día quince. Alicia no dijo que no: «Acepto, y condiciono la fecha a recibir los textos el lunes. Si llegan el miércoles, entrego el diecisiete». Llegaron el martes, y nadie discutió el diecisiete."
    before_phrase: "Sí, pero es que depende de cuándo me pasen los textos."
    after_phrase: "Acepto, y condiciono la fecha a recibir los textos el lunes."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "El coche del sábado"
    body: "Su hijo pedía el coche otra vez. Esteban no quiso repetir la pelea de siempre: «Te lo dejo, y condiciono el préstamo a una cosa: me escribes al llegar». Su hijo puso los ojos en blanco, pero escribió."
    before_phrase: "Te lo dejo, pero solo si me avisas al llegar."
    after_phrase: "Te lo dejo, y condiciono el préstamo a una cosa."
  - position: 3
    scene: "entrevista"
    conversation_type: "social"
    title: "Dos preguntas antes del sí"
    body: "La oferta le gustaba, aunque el horario no. Cristina lo dijo sin rodeos: «Me encantaría aceptar. Condiciono mi respuesta a poder entrar a las diez dos días por semana». La empresa lo miró y volvió con un sí."
    before_phrase: "Me interesa, aunque depende del horario."
    after_phrase: "Condiciono mi respuesta al horario de entrada."
