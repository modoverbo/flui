stressed_syllable: 4
ipa_latam: "[kon.di.sjoˈnaɾ]"
ipa_es: "[kon.di.θjoˈnaɾ]"
explanation: "Hacer que una cosa dependa de otra: solo pasa si antes ocurre lo que pides."
example_sentence: "Acepté el encargo, aunque condicioné la entrega a que me pasaran las fotos el lunes."
register: "neutral"
pedantry_risk: 1
usage_tip: "Sirve para decir que sí a medias sin sonar duro: aceptas y dejas claro de qué depende tu parte."
when_not_to_use: "No la uses como amenaza disfrazada: si lo que pides a cambio no es razonable, la palabra no lo arregla."
collocations:
  - "condicionar un sí"
  - "condicionar la entrega"
  - "quedar condicionado"
replaces:
  - before: "Te digo que sí, pero solo si me dan más tiempo"
    after: "Condiciono mi sí a que me den más tiempo"
  - before: "Lo hacemos si antes llega el material"
    after: "Condicionamos el trabajo a que llegue el material"
  - before: "Dependemos de que ellos aprueben"
    after: "Nuestra parte queda condicionada a que ellos aprueben"
family:
  - "condición"
themes:
