    title: "Dos minutos al final"
    body: "Vicente cerraba cada reunión igual: «Quedan dos minutos. ¿Alguien quiere objetar algo?». Casi nunca salía nada, pero el día del presupuesto salió una cifra mal puesta. Esos dos minutos ahorraron una semana de trabajo."
    before_phrase: "¿Nadie tiene nada en contra?"
    after_phrase: "¿Alguien quiere objetar algo?"
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "El precio del billete"
    body: "Silvia contó el plan del viaje de fin de curso de su hijo con todo detalle. Su madre escuchó hasta el final y luego dijo una sola cosa: «Solo objeto el precio del billete; lo demás me parece muy bien». Buscaron otro vuelo juntas."
    before_phrase: "A ver, lo único que le veo mal es el precio."
    after_phrase: "Solo objeto el precio del billete."
  - position: 3
    scene: "entrevista"
    conversation_type: "social"
    title: "Decirlo a tiempo"
    body: "Le preguntaron a Ernesto cómo reaccionaba ante una decisión que no compartía. Contestó sin adornos: «Prefiero objetar en el momento, con un dato en la mano, antes que callarme y quejarme un mes después»."
    before_phrase: "Pues digo lo que pienso, supongo."
    after_phrase: "Prefiero objetar en el momento, con un dato en la mano."
