    difference: "«Vislumbrar» es empezar a ver algo que todavía está lejos; lo otro impresiona tanto que impide mirar."
    memory_trick: "Vislumbras lo que apenas se ve; deslumbras hasta que no se ve nada."
  - confused_with: "convencer"
    difference: "«Convencer» deja al otro con razones; esta palabra lo deja con asombro, que dura menos."
    memory_trick: "El convencido argumenta; el deslumbrado aplaude."
