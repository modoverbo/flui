    title: "Quien habla rápido"
    body: "Valentina revisó sus notas de doce entrevistas antes de decidir. Siempre puntuaba más alto a quien hablaba rápido. «Tengo un sesgo propio», reconoció, «y se me repite». Desde entonces puntúa dos días después, con las notas delante y la voz olvidada."
    before_phrase: "Creo que me dejo llevar por cómo hablan."
    after_phrase: "Tengo un sesgo propio y se me repite."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "Repartir las lecturas"
    body: "Para elegir el libro del mes, el grupo se repartió las lecturas en lugar de dejárselas a quien proponía. «Así el resumen no sale con el sesgo de una sola persona», dijo Alberto. Ese mes ganó un libro que nadie esperaba."
