    title: "Solo los que siguen"
    body: "El estudio decía que la satisfacción subía cada año. Nadia leyó la letra del método y levantó la vista: «Solo preguntamos a quienes siguen comprando. Eso es un sesgo, y lleva tres ediciones». Nadie se puso a la defensiva. Añadieron una segunda muestra."
