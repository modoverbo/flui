    body: "El informe parecía un muro de números. Nicolás lo llevó a la pizarra y fue cifra por cifra: «Esto sube por esto, esto baja por esto otro». Al final, hasta el director más distraído del directorio pudo seguir la historia completa."
    before_phrase: "Te lo explico por partes."
    after_phrase: "Te lo voy a desmenuzar."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La receta de la abuela"
    body: "Mi hermano nunca había cocinado nada. Mi papá se sentó con él y fue paso por paso: «Primero esto, después esperas, recién ahí lo otro». Esa noche, mi hermano sirvió su primer plato solo, orgulloso."
    before_phrase: "Vamos despacito con esto."
    after_phrase: "Vamos a desmenuzar la receta paso a paso."
  - position: 3
    scene: "entrevista"
    conversation_type: "practica"
    title: "El problema real"
    body: "«Cuénteme un problema que resolvió», pidió el entrevistador. Valentina no se apuró: fue explicando cada paso que había seguido, desde el primer síntoma hasta la solución final. «Me gusta cómo lo desmenuzó», dijo él al terminar."
    before_phrase: "Te lo explico por partes."
    after_phrase: "Voy a desmenuzar el problema paso a paso."
