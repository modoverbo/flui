    title: "El ruido de la máquina"
    body: "La máquina nueva zumbaba desde el lunes. Nadie se quejaba, pero todos lo habían notado. «Es un zumbido leve», dijo Nacho en la reunión, «no molesta, pero antes no estaba». Vino el técnico el jueves y era una pieza suelta."
