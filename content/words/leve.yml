    conversation_type: "social"
    title: "Otra puntuación"
    body: "Dos versiones del cartel del barrio parecían idénticas. Una editora del grupo señaló la diferencia: el mismo texto con otra puntuación. «Es leve», reconoció, «y aun así una se lee y la otra no». Imprimieron la suya."
    before_phrase: "Yo las veo iguales, cambia un poquito."
    after_phrase: "Es leve, y aun así una se lee y la otra no."
