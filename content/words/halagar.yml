    difference: "«Alegar» es dar una razón para defenderse o justificarse; la otra palabra es decirle a alguien algo bueno que le gusta oír."
    memory_trick: "Alegas para defenderte; halagas para reconocer."
  - confused_with: "adular"
    difference: "«Adular» es elogiar de más para conseguir algo a cambio; lo otro es reconocer de verdad y sin segunda intención."
    memory_trick: "Quien adula busca algo; quien halaga reconoce."
