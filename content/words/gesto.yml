readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "Dos horas de cola"
    body: "Eladio llegaba tarde al ayuntamiento y la cola daba la vuelta a la manzana. Una mujer a la que apenas conocía le guardó el sitio dos horas bajo la lluvia. Fue hace seis años y todavía lo cuenta: «Aquel gesto me ahorró una mañana entera y no me dejó ni invitarla a un café»."
    before_phrase: "Qué detalle tuvo conmigo, madre mía."
    after_phrase: "Aquel gesto no se me ha olvidado."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La llamada del aniversario"
    body: "Fermín y su hermana llevaban dos años sin hablarse por una herencia. El día del aniversario de su madre, él llamó sin avisar y solo dijo «me he acordado». Ella no contestó gran cosa, pero al mes siguiente lo invitó a comer. «Fue el gesto», dice ahora, «no la conversación»."
    before_phrase: "Llamé y ya está, tampoco es para tanto."
    after_phrase: "Fue el gesto, no la conversación."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "Dos líneas de gracias"
    body: "Alguien del turno de noche dejó el material preparado para que el de la mañana no empezara a ciegas. Nicolasa lo vio y escribió dos líneas en el grupo, con nombre y apellido: «Gracias por el gesto; hoy hemos empezado media hora antes». Desde entonces el material aparece preparado casi todos los días."
    before_phrase: "Gracias a quien haya dejado esto listo."
    after_phrase: "Gracias por el gesto; hoy empezamos media hora antes."
