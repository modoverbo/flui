    hint_general: "Algo que va a durar poco tiempo, por diseño, aunque tenga mucho valor mientras dura."
    explanation: "Efímera: algo que va a durar poco tiempo, por diseño. «Permanente» describiría justo lo contrario, y «eficiente» describe funcionar bien, sin relación con cuánto tiempo estaría montada."
