    title: "El primer amor de la secundaria"
    body: "En la cena, su primo se rió al recordar a su primera novia de la secundaria. «Fue efímero, duramos un mes», dijo, «pero todavía me acuerdo de cada detalle de esas semanas»."
    before_phrase: "Duró muy poco, pero todavía me acuerdo de todo."
    after_phrase: "Fue efímero, pero todavía me acuerdo de todo."
