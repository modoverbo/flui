    memory_trick: "Lo fugaz pasa rápido; lo efímero dura poco, aunque lo sientas despacio."
exercises:
  - position: 1
    sentence: "El brillo de esa amistad de verano fue {{blank}}, pero los dos siguen sonriendo cuando la recuerdan."
    hint_general: "Algo que no duró mucho, aunque haya dejado un buen recuerdo."
    explanation: "Efímera: algo que no duró mucho, aunque haya dejado un buen recuerdo. «Eficiente» describe funcionar bien, sin relación con la duración, y «falsa» implicaría que no fue real, y la frase dice que ambos la recuerdan con gusto."
    options:
      - position: 1
        text: "eficiente"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Eficiente» describe que algo funciona bien con poco esfuerzo, sin relación con la duración de una amistad de verano."
        hint_specific: "Eficiente describe funcionar bien. ¿La frase habla de funcionar bien o de duración?"
      - position: 2
        text: "efímera"
        is_correct: true
      - position: 3
        text: "falsa"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Falsa» implicaría que la amistad no fue real, y la frase dice que ambos siguen sonriendo al recordarla, señal de que sí fue real."
        hint_specific: "Falsa implica que algo no era real. ¿La frase dice que fue real o inventada?"
