    body: "Marina contó que apenas duró tres semanas, pero que lo recordaba como si hubiera sido mucho más. «Fue efímero, pero de los buenos», le dijo a su amiga, «de esos que te dejan una sonrisa cada vez que los piensas»."
    before_phrase: "Duró poco, pero fue de los buenos."
    after_phrase: "Fue efímero, pero de los buenos."
