    title: "La instalación de un fin de semana"
    body: "La curadora explicó al equipo por qué esa pieza solo estaría montada dos días. «Es efímera por diseño», dijo, «parte de su valor está justamente en que no se puede volver a ver»."
    before_phrase: "Solo va a estar un rato, y eso es parte de su gracia."
    after_phrase: "Es efímera por diseño."
  - position: 3
    scene: "familia"
