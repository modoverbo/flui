        text: "notición"
        is_correct: false
        distractor_type: "register"
        why_not: "«Notición» es de conversación suelta y exagera el tamaño de la noticia, y aquí lo que importa es el momento de contarla."
        hint_specific: "«Notición» agranda la noticia, en tono informal. ¿Lo que importa aquí es el tamaño o el momento?"
