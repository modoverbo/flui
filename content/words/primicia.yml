confusions:
  - confused_with: "premisa"
    difference: "Una premisa es el punto de partida de un razonamiento; lo otro es una noticia que nadie ha contado aún."
    memory_trick: "La premisa abre el argumento; la primicia abre el periódico."
  - confused_with: "novedad"
    difference: "Una novedad es cualquier cosa nueva; esta palabra exige además ser el primero en contarla."
    memory_trick: "La novedad es nueva; la primicia es primera."
exercises:
  - position: 1
    sentence: "Zoe anunció una {{blank}} en su publicación y resultó que el dato llevaba dos semanas en la web del ayuntamiento."
    hint_general: "Prometió ser la primera en contarlo y no lo era."
    explanation: "Primicia: prometió contarlo antes que nadie. «Premisa» sería el punto de partida de un razonamiento, y «novedad» solo exigiría que fuera reciente."
    options:
      - position: 1
        text: "premisa"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Premisa» es el punto de partida de un razonamiento, y aquí lo que se anuncia es un dato que se publica."
        hint_specific: "«Premisa» pertenece a un razonamiento. ¿Zoe razona algo o publica algo?"
      - position: 2
        text: "primicia"
        is_correct: true
      - position: 3
        text: "novedad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Novedad» solo pide que sea reciente, y un dato de hace dos semanas puede seguir siendo nuevo para mucha gente."
        hint_specific: "«Novedad» no exige ser el primero. ¿Qué es lo que falló en el anuncio de Zoe?"
  - position: 2
    sentence: "El periódico local dio la {{blank}} del cierre del puente y los grandes la copiaron al día siguiente."
    hint_general: "Lo contaron antes que nadie y los demás llegaron después."
    explanation: "Primicia: lo contaron antes que nadie. «Bombazo» es de charla informal y promete escándalo, y «resumen» recogería algo ya publicado."
    options:
      - position: 1
        text: "bombazo"
        is_correct: false
        distractor_type: "register"
        why_not: "«Bombazo» es de conversación muy suelta y promete escándalo, y el cierre de un puente es una noticia de servicio."
        hint_specific: "«Bombazo» promete escándalo, en tono de calle. ¿Hay escándalo en el cierre de un puente?"
      - position: 2
        text: "primicia"
        is_correct: true
      - position: 3
        text: "resumen"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Resumen» recoge en corto algo ya publicado, y aquí fueron los primeros en contarlo."
        hint_specific: "«Resumen» llega después. ¿Quién llegó primero?"
  - position: 3
    sentence: "Mi tía nos contó como {{blank}} que el bar de la esquina cambiaba de dueño, y llevaba el cartel puesto desde el lunes."
    hint_general: "Lo contó como si fuera la primera y estaba a la vista."
    explanation: "Primicia: como si fuera la primera en contarlo. «Premisa» sería el arranque de un razonamiento, y «broma» supondría que no hablaba en serio."
    options:
      - position: 1
        text: "primicia"
        is_correct: true
      - position: 2
        text: "premisa"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Premisa» es el punto de partida de un razonamiento, y tu tía no razona: da una noticia del barrio."
        hint_specific: "«Premisa» abre un razonamiento. ¿Tu tía razona o cuenta?"
      - position: 3
