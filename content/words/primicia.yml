readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Dos días de espera"
    body: "Casilda podía publicar el jueves y esperó al sábado, con los dos nombres confirmados. «Tenía la primicia y no tenía la mitad de los datos», explicó. Publicó dos días tarde y fue la única versión que nadie tuvo que corregir."
    before_phrase: "Lo tengo antes que nadie, lo saco ya."
    after_phrase: "Tenía la primicia y me faltaban datos."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "El cartel del lunes"
    body: "Mi tía nos reunió en la cocina para contarnos que el bar de la esquina cambiaba de dueño. Lo contó como una primicia. El cartel llevaba puesto desde el lunes y lo habíamos visto todos. Nadie se lo dijo: la escuchamos hasta el final."
    before_phrase: "Les cuento algo que nadie sabe."
    after_phrase: "Nos lo contó como una primicia."
  - position: 3
    scene: "entrevista"
    conversation_type: "practica"
    title: "Dejar de correr"
    body: "Le preguntaron a Vera por qué su cuenta había crecido justo cuando publicaba menos. «Dejé de perseguir la primicia», contestó. «Ahora explico lo que ya se sabe y la gente se queda». Se lo pidieron por escrito para el boletín."
    before_phrase: "Antes quería contarlo todo el primero."
    after_phrase: "Dejé de perseguir la primicia."
