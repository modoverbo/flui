        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Broma» supondría que no hablaba en serio, y ella lo contaba convencida de ser la primera."
        hint_specific: "«Broma» no va en serio. ¿Tu tía bromeaba?"
  - position: 4
    sentence: "En el grupo del equipo, Efraín pidió no soltar la {{blank}} hasta que el contrato estuviera firmado."
    hint_general: "Pide no ser los primeros en contarlo todavía."
    explanation: "Primicia: ser los primeros en contarlo. «Notición» es de charla informal y exagera el tamaño, y «promesa» sería un compromiso, no una noticia."
