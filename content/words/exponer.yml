    body: "Mi hermana llevaba un mes con el proyecto del huerto del barrio y le tocaba defenderlo en el ayuntamiento. Ensayó tres veces con nosotros de público. «Si lo expongo en orden, no me van a poder decir que no se entiende», repetía."
    before_phrase: "Si lo cuento bien, no tendrán excusa."
    after_phrase: "Si lo expongo en orden, no me podrán decir que no se entiende."
  - position: 3
    scene: "entrevista"
    conversation_type: "practica"
    title: "De principio a fin"
    body: "«Cuéntenos un proyecto difícil», pidieron a Virginia. Ella respiró y avisó: «Lo expongo de principio a fin: qué pasó, qué hicimos y qué cambiaría hoy». Nadie la interrumpió en seis minutos."
