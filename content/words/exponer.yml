    body: "Camila tenía diez minutos para el plan de ahorro y doce diapositivas preparadas. Quitó nueve. «Voy a exponer primero el problema y luego dos opciones», anunció al empezar. Terminó en ocho minutos y le sobraron dos para preguntas."
