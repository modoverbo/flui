confusions:
  - confused_with: "condicional"
    difference: "«Condicional» es un apoyo que depende de algo; incondicional es apoyar a alguien pase lo que pase, sin condiciones de por medio."
    memory_trick: "Lo condicional pone peros; lo incondicional no pone ninguno."
  - confused_with: "fiel"
    difference: "«Fiel» es no traicionar la confianza de alguien; incondicional además apoya activamente, incluso en decisiones con las que no está de acuerdo."
exercises:
