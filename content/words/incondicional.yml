    sentence: "Bautista es un amigo {{blank}}: te apoya aunque tomes la decisión que él no habría tomado."
    hint_general: "Es apoyar a alguien siempre, sin que ese apoyo dependa de estar de acuerdo."
    explanation: "Incondicional: apoyar a alguien siempre, sin que dependa de estar de acuerdo. «Condicional» es justo lo contrario: un apoyo que depende de algo, y aquí Bautista apoya aunque no esté de acuerdo; «fiel» es no traicionar la confianza de alguien, pero no dice que apoye decisiones con las que no está de acuerdo."
