schema_version: 1
slug: "incondicional"
status: "approved"
lemma: "incondicional"
part_of_speech: "adjetivo"
syllables:
  - "in"
  - "con"
  - "di"
  - "cio"
  - "nal"
stressed_syllable: 5
ipa_latam: "[in.kon.di.sjoˈnal]"
ipa_es: "[in.kon.di.θjoˈnal]"
explanation: "Que apoya y quiere a alguien pase lo que pase, sin poner condiciones ni juzgarlo."
example_sentence: "Cuando todo salió mal, tuvo el apoyo incondicional de su mejor amiga, sin un solo reproche."
register: "neutral"
pedantry_risk: 1
usage_tip: "Funciona bien para describir el apoyo de un amigo, una pareja o un familiar que nunca pone condiciones."
when_not_to_use: "No la uses para un favor puntual, por grande que sea: describe un apoyo que se sostiene con el tiempo, no un solo gesto."
collocations:
  - "amigo incondicional"
  - "apoyo incondicional"
  - "amor incondicional"
replaces:
  - before: "Es un amigo que siempre está ahí pase lo que pase"
    after: "Es un amigo incondicional"
  - before: "Me apoya sin importar lo que haga"
    after: "Me apoya de forma incondicional"
family:
  - "incondicionalidad"
  - "incondicionalmente"
themes:
  - slug: "amistad"
    relevance: 3
tags:
  comodin:
    - "fiel"
  funcion:
    - "elogiar"
  canal: "ambos"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "condicional"
    difference: "«Condicional» describe algo que depende de que se cumpla un requisito; lo incondicional no depende de nada para sostenerse."
    memory_trick: "Lo condicional pone un «si»; lo incondicional no pone ninguno."
  - confused_with: "leal"
    difference: "«Leal» es quien no traiciona ni cambia de bando; lo incondicional además apoya sin límite ni reproche, pase lo que pase."
    memory_trick: "La lealtad no traiciona; el apoyo incondicional tampoco pone condiciones."
exercises:
  - position: 1
    sentence: "Cuando Marina perdió su trabajo, su amiga Renata fue {{blank}}: la llamó todos los días sin juzgarla ni una sola vez."
    hint_general: "Piensa en un apoyo que no cambia pase lo que pase, sin límites ni reproches."
    explanation: "Incondicional: el apoyo se sostiene pase lo que pase. «Condicional» diría que depende de un requisito, y aquí no se puso ninguno. «Desinteresada» dice que no busca nada a cambio, pero no explica por qué la llamó todos los días sin fallar."
    options:
      - position: 1
        text: "condicional"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Condicional» describe algo que depende de un requisito, y en la frase Renata no puso ninguna condición para llamarla."
        hint_specific: "«Condicional» necesita un requisito que se cumpla. ¿Renata pone alguno para llamarla?"
      - position: 2
        text: "incondicional"
        is_correct: true
      - position: 3
        text: "desinteresada"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Desinteresada» dice que no busca nada a cambio, pero no explica por qué la llamó todos los días sin fallar ni una vez."
        hint_specific: "«Desinteresada» habla de no esperar nada a cambio. ¿Eso explica por qué llamó todos los días?"
  - position: 2
    sentence: "Cuando su padre se quedó sin trabajo, sus hijos le dieron un apoyo {{blank}}, sin un solo reproche por las decisiones que había tomado."
    hint_general: "Busca la idea de una ayuda que no pide ningún requisito ni espera nada a cambio."
    explanation: "Incondicional: el apoyo no puso ningún requisito. «Irrestricto» suena a comunicado oficial, y aquí se habla de una familia, no de un discurso. «Condicional» diría justo lo contrario de lo que describe la frase."
    options:
      - position: 1
        text: "incondicional"
        is_correct: true
      - position: 2
        text: "irrestricto"
        is_correct: false
        distractor_type: "register"
        why_not: "«Irrestricto» es un término de comunicados y contratos, y esta frase describe el gesto sencillo de unos hijos con su padre."
        hint_specific: "«Irrestricto» suena a discurso oficial. ¿Esta escena habla de una familia o de un comunicado?"
      - position: 3
        text: "condicional"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Condicional» diría que el apoyo depende de algo, y la frase dice justo lo contrario: ni un reproche."
        hint_specific: "«Condicional» pone un requisito de por medio. ¿Hay alguno en esta frase?"
  - position: 3
    sentence: "Aunque discutan cada semana por política, el cariño entre Lucía y su hermana es {{blank}}: nada logra que dejen de hablarse."
    hint_general: "La palabra describe un vínculo que ninguna pelea logra romper, sin condición alguna."
    explanation: "Incondicional: ninguna pelea logra romper el vínculo. «Acérrimo» suena a crónica o discurso, y aquí se habla del cariño cotidiano de dos hermanas. «Generoso» habla de dar sin medida, no de resistir cualquier pelea."
    options:
      - position: 1
        text: "acérrimo"
        is_correct: false
        distractor_type: "register"
        why_not: "«Acérrimo» se usa en crónicas o discursos, como «rival acérrimo», y aquí se habla del cariño cotidiano entre dos hermanas."
        hint_specific: "«Acérrimo» suena a crónica deportiva o política. ¿Esta frase habla de una rivalidad o de un cariño de todos los días?"
      - position: 2
        text: "incondicional"
        is_correct: true
      - position: 3
        text: "generoso"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Generoso» habla de dar con largueza, y aquí lo que se destaca es que el cariño resiste cualquier pelea, no un regalo."
        hint_specific: "«Generoso» va de dar sin medida. ¿La frase habla de dar algo o de resistir las peleas?"
  - position: 4
    sentence: "Sara empezó en la empresa sin contactos ni palancas, pero su mentora la ayudó a crecer sin pedir nunca nada a cambio: fue un apoyo {{blank}} desde el primer día."
    hint_general: "Piensa en un apoyo que no pide nada a cambio ni pone ningún requisito."
    explanation: "Incondicional: el apoyo no pidió nada a cambio desde el primer día. «Condicional» diría que depende de un requisito, y la frase dice justo lo contrario. «Solidario» describe ayuda en un momento puntual, y aquí el apoyo duró desde el principio."
    options:
      - position: 1
        text: "incondicional"
        is_correct: true
      - position: 2
        text: "condicional"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Condicional» diría que el apoyo depende de un requisito, y la frase dice que su mentora no pidió nunca nada a cambio."
        hint_specific: "«Condicional» exige que se cumpla algo primero. ¿La mentora pidió algo a cambio?"
      - position: 3
        text: "solidario"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Solidario» describe una ayuda en un momento difícil puntual, y aquí el apoyo duró desde el primer día, no fue un gesto aislado."
        hint_specific: "«Solidario» suele ser un gesto puntual. ¿Esta frase habla de un momento o de todo el tiempo?"
  - position: 5
    sentence: "Después del divorcio, Camila descubrió quiénes eran sus amigas {{blank}}: las que se quedaron sin hacer preguntas."
    hint_general: "Busca la palabra para quien se queda sin poner ninguna condición, aunque las cosas se compliquen."
    explanation: "Incondicionales: se quedaron sin poner ninguna condición. «Confiables» dice que se puede contar con ellas, pero no que su apoyo no tenga límites. «Desinteresadas» dice que no buscan nada a cambio, sin explicar por qué no hicieron preguntas."
    options:
      - position: 1
        text: "incondicionales"
        is_correct: true
      - position: 2
        text: "confiables"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Confiables» dice que se puede contar con ellas, pero no dice que se hayan quedado sin poner ninguna condición."
        hint_specific: "«Confiable» habla de poder contar con alguien. ¿Eso explica por qué no hicieron preguntas?"
      - position: 3
        text: "desinteresadas"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Desinteresadas» dice que no buscan nada a cambio, y la frase destaca que se quedaron sin condiciones, no sin interés."
        hint_specific: "«Desinteresada» habla de no esperar nada a cambio. ¿Eso es lo que describe la frase?"
  - position: 6
    sentence: "Ana perdió la paciencia con su madre mil veces, pero el cariño que le tiene sigue siendo {{blank}}."
    hint_general: "Piensa en un sentimiento que no depende de nada para seguir ahí."
    explanation: "Incondicional: el cariño no depende de nada para seguir ahí. «Condicional» diría que depende de algo, y la frase dice justo lo contrario. «Entregado» dice que se dedica con intensidad, sin explicar por qué ese cariño resiste las peleas."
    options:
      - position: 1
        text: "condicional"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Condicional» diría que ese cariño depende de algo, y la frase describe justo lo contrario: sigue igual pase lo que pase."
        hint_specific: "«Condicional» exige que algo se cumpla. ¿Ese cariño depende de algo para seguir ahí?"
      - position: 2
        text: "incondicional"
        is_correct: true
      - position: 3
        text: "entregado"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Entregado» dice que se dedica con intensidad, pero no explica por qué ese cariño resiste tantas peleas."
        hint_specific: "«Entregado» habla de dedicación intensa. ¿Eso explica por qué el cariño resiste las peleas?"
  - position: 7
    sentence: "Bruno pasó tres semanas en el hospital y su mejor amigo Iván fue {{blank}}: durmió ahí casi todas las noches sin que nadie se lo pidiera."
    hint_general: "Busca la idea de estar presente sin que nadie lo pida y sin poner ningún límite."
    explanation: "Incondicional: estuvo presente sin que nadie se lo pidiera y sin poner límites. «Desinteresado» dice que no espera nada a cambio, sin explicar por qué durmió ahí tantas noches. «Acérrimo» suena a discurso o crónica, no a un gesto íntimo entre dos amigos."
    options:
      - position: 1
        text: "incondicional"
        is_correct: true
      - position: 2
        text: "desinteresado"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Desinteresado» dice que no espera nada a cambio, pero no explica por qué durmió ahí casi todas las noches, semana tras semana."
        hint_specific: "«Desinteresado» habla de no esperar nada a cambio. ¿Eso explica por qué durmió ahí tantas noches?"
      - position: 3
        text: "acérrimo"
        is_correct: false
        distractor_type: "register"
        why_not: "«Acérrimo» suena a discurso o crónica, y aquí se cuenta algo íntimo entre dos amigos en un hospital."
        hint_specific: "«Acérrimo» suena a crónica o discurso. ¿Esta escena es íntima o pública?"
readings:
  - position: 1
    scene: "social"
    conversation_type: "emocional"
    title: "La que se apareció"
    body: "Cuando a Marta la despidieron, no quiso contárselo a nadie. Pero Elisa se apareció esa noche con comida y una película, sin que se lo pidiera. «No tienes que hablar si no quieres», le dijo. Marta pensó que pocas amigas eran tan incondicionales."
    before_phrase: "Sé que puedo contar contigo pase lo que pase."
    after_phrase: "Eres una amiga incondicional."
  - position: 2
    scene: "familia"
    conversation_type: "social"
    title: "La decisión de Julián"
    body: "Julián reunió a la familia para contarles que dejaba su carrera de abogado por la música. Su madre lo escuchó en silencio y, al final, dijo: «No entiendo mucho de música, pero mi apoyo es incondicional». Sus hermanos se quedaron callados, pero ella ya había decidido."
    before_phrase: "Te voy a apoyar decidas lo que decidas."
    after_phrase: "Mi apoyo es incondicional."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "La segunda semana"
    body: "En su segunda semana en el equipo, Rodrigo cometió un error que retrasó la entrega. Su jefa no lo regañó: revisó el problema con él hasta las nueve de la noche. «Así trabajamos aquí», le dijo. «Cuando alguien nuevo entra, el respaldo es incondicional»."
    before_phrase: "Aquí nadie te deja solo con un problema."
    after_phrase: "El respaldo es incondicional."
