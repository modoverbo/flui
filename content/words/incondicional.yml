    title: "El que siempre contesta"
    body: "A las dos de la madrugada, con el auto varado en la ruta, Perla solo tuvo que llamar una vez. Su amiga llegó en pijama, sin preguntas, con café para las dos. «Eres incondicional», le dijo Perla mientras esperaban la grúa."
    before_phrase: "Siempre estás ahí pase lo que pase, gracias por eso."
    after_phrase: "Eres incondicional, de verdad."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La decisión que nadie apoyaba"
    body: "Cuando Selene decidió dejar la carrera de derecho para estudiar cocina, casi toda la familia se lo cuestionó. Solo su hermano la apoyó desde el primer día, sin peros. «Eres incondicional», le dijo ella, «y eso no lo voy a olvidar»."
    before_phrase: "Me apoyaste sin poner ninguna condición, y eso vale mucho."
    after_phrase: "Eres incondicional, y eso no lo voy a olvidar."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El que no se fue"
    body: "Cuando el proyecto de Otilia fracasó frente a todo el directorio, un solo compañero se quedó a ayudarla a rearmar la presentación esa misma noche. «No tenías por qué quedarte», le dijo ella. Él solo respondió: «Para eso están los amigos incondicionales»."
    before_phrase: "No tenías por qué ayudarme después de eso, pero te quedaste."
    after_phrase: "Para eso están los amigos incondicionales."
