    title: "El primer turno"
    body: "Los tres nuevos llegaron un lunes y nadie se levantó de la silla. Vera lo cambió al mes siguiente: preparó una hoja con nombres y los presentó uno a uno. «Aceptarlos no basta; hay que acogerlos», dijo. El siguiente equipo se integró en una semana."
