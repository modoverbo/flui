    conversation_type: "emocional"
    title: "Dos maletas"
    body: "Su prima apareció un domingo con dos maletas y sin explicación. Nadie preguntó nada esa noche. «En esta casa primero se acoge y luego, si quieres, cuentas», le dijo su tía. Contó la historia entera tres días después."
    before_phrase: "Pasa, pasa, ya nos contarás qué ha pasado."
    after_phrase: "Primero se acoge y luego, si quieres, cuentas."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "La biblioteca nueva"
    body: "Abrieron la biblioteca en marzo y en junio ya era el punto de encuentro del barrio. Nadie organizó nada: la gente entró, se sentó y volvió. «El barrio la ha acogido», resumió la bibliotecaria, y siguió colocando libros."
    before_phrase: "A la gente le ha gustado mucho, se ve."
    after_phrase: "El barrio la ha acogido."
