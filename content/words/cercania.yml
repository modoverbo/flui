ipa_latam: "[seɾ.kaˈni.a]"
ipa_es: "[θeɾ.kaˈni.a]"
explanation: "Sensación de confianza y trato natural que hace que alguien te sienta accesible, como a alguien conocido."
example_sentence: "Responder los comentarios uno por uno le da mucha cercanía a la cuenta, aunque lleve tiempo."
register: "neutral"
pedantry_risk: 1
usage_tip: "Sirve para explicar por qué una cuenta o una persona se siente accesible, casi como alguien conocido."
when_not_to_use: "No la uses para la distancia física entre dos lugares; ahí es solo una cuestión de metros o minutos."
collocations:
  - "generar cercanía"
  - "esa cercanía con los seguidores"
  - "perder la cercanía"
replaces:
  - before: "Esa cuenta se siente muy accesible, como si la conocieras"
    after: "Esa cuenta tiene mucha cercanía"
  - before: "Habla como si fuera un amigo, no una marca"
    after: "Le da cercanía a la marca; habla como un amigo"
  - before: "Se nota que le importa responder a la gente"
    after: "Esa cercanía se nota en que responde a la gente"
family:
