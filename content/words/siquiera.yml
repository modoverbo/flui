    body: "Quedaron cinco y hablaron cuatro. Tamara lo comentó al día siguiente, sin dramatizar: «Estuvo tres horas y no levantó la vista siquiera para pedir el café». No hizo falta añadir nada más; el grupo decidió hablar con él de frente."
