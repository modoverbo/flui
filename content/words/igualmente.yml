    conversation_type: "emocional"
    title: "El buen año"
    body: "Se cruzaron en el portal el 2 de enero, después de un año raro para los dos. Él le deseó un buen año con la mano en el bolsillo. Ella contestó despacio: «Igualmente, y de verdad». No hizo falta añadir nada más."
    before_phrase: "Ah, pues lo mismo digo, ¿eh?"
    after_phrase: "Igualmente, y de verdad."
