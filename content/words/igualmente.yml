    body: "En la asamblea del club preguntaron si los que acababan de entrar pagarían menos. Nicanor contestó sin rodeos y sin sonar antipático: «A los veteranos se les cobra la cuota entera; a los nuevos, igualmente». Se aprobó en dos minutos."
    before_phrase: "A los nuevos igual, o sea, lo mismo que a los demás."
    after_phrase: "A los veteranos la cuota entera; a los nuevos, igualmente."
