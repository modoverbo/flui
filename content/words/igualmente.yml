    title: "Dos pedidos, una regla"
    body: "El cliente preguntaba cada mes si el pedido pequeño tenía las mismas condiciones. Hortensia lo dejó escrito de una vez: «El pedido grande entra en el plazo de 48 horas, y el pequeño igualmente». Nadie volvió a preguntarlo en todo el año."
