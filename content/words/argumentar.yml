    after: "Argumenta por qué piensas eso"
  - before: "Lo dijo sin dar ni una razón"
    after: "Lo dijo sin argumentar nada"
  - before: "Voy a explicar mis motivos uno por uno"
    after: "Voy a argumentar mis motivos uno por uno"
