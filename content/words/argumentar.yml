ipa_latam: "[aɾ.ɣu.menˈtar]"
ipa_es: "[aɾ.ɣu.menˈtar]"
explanation: "Dar razones claras para sostener lo que piensas delante de otros."
example_sentence: "No basta con decir que no te convence: hay que argumentar por qué."
register: "neutral"
pedantry_risk: 1
usage_tip: "Anunciarlo ordena la sala: «Voy a argumentarlo en dos puntos» promete un final y lo cumple."
when_not_to_use: "No la uses para insistir en lo mismo más alto; sin razones nuevas no hay razones."
collocations:
  - "argumentar una postura"
  - "argumentar con datos"
  - "saber argumentar"
replaces:
