readings:
  - position: 1
    scene: "familia"
    conversation_type: "emocional"
    title: "Hasta el lunes"
    body: "Llevaban tres días discutiendo por el préstamo y la casa estaba insoportable. Damián propuso algo concreto: «Tregua hasta el lunes: nadie menciona el tema y el lunes lo hablamos con papeles». Cenaron tranquilos y el lunes tardaron veinte minutos."
    before_phrase: "¿Podemos dejarlo, por favor? No puedo más."
    after_phrase: "Tregua hasta el lunes y luego lo hablamos."
  - position: 2
    scene: "trabajo"
    conversation_type: "practica"
    title: "Dos semanas para leer"
    body: "Las dos áreas defendían números distintos y cada reunión terminaba peor. La jefa de proyecto cortó por lo sano: «Tregua de dos semanas; cada uno lee los datos del otro y volvemos». Al volver, la mitad de las diferencias habían desaparecido."
    before_phrase: "Vamos a parar esto antes de que sea peor."
    after_phrase: "Tregua de dos semanas y volvemos con datos."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "La comida del sábado"
    body: "Dos amigos del grupo llevaban meses sin dirigirse la palabra. Antes de la comida, alguien lo dijo en voz alta: «Hoy hay tregua; el sábado que viene, lo que haga falta». Se sentaron lejos, pero se sentaron. Un mes después hablaron."
    before_phrase: "Por favor, hoy que no salte nadie."
    after_phrase: "Hoy hay tregua; mañana ya veremos."
