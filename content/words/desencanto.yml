    scene: "familia"
    conversation_type: "emocional"
    title: "Un año sin citas"
    body: "Su hermana le preguntó por qué llevaba tanto tiempo sin salir con nadie. «Esa relación me dejó un desencanto grande», respondió, «necesitaba tiempo antes de volver a intentarlo con alguien más»."
    before_phrase: "Esa relación me bajó mucho las ganas de intentarlo de nuevo."
    after_phrase: "Esa relación me dejó un desencanto grande."
