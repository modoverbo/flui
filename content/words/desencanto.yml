    title: "El mismo puesto de siempre"
    body: "Después de cinco años en el mismo puesto, Marta se dio cuenta de que ya no le entusiasmaba lo que antes la emocionaba. «Es un desencanto silencioso», le confesó a un colega, «nadie lo nota, pero yo sí»."
    before_phrase: "Ya no me entusiasma como antes, aunque nadie lo note."
    after_phrase: "Es un desencanto silencioso."
