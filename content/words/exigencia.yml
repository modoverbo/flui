    title: "Con «por favor»"
    body: "El correo terminaba con un «por favor» y aun así nadie se atrevió a contestar. Vera lo nombró en la reunión: «Esto es una exigencia disfrazada; si de verdad es negociable, que se diga». Reescribieron el correo y dos personas propusieron otra fecha."
    before_phrase: "Nos lo pidieron de muy malas maneras."
    after_phrase: "Esto es una exigencia, aunque lleve «por favor»."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Antes de las dos"
    body: "La comida de los domingos empezaba siempre con la misma frase de su suegra. Un día, Tomás lo dijo con calma: «Para nosotros es una exigencia, y nos gustaría que fuera una petición». Comieron a las dos y cuarto y no pasó nada."
    before_phrase: "Es que siempre nos obliga a llegar pronto."
    after_phrase: "Para nosotros es una exigencia, no una petición."
  - position: 3
    scene: "entrevista"
    conversation_type: "practica"
    title: "Las del puesto"
    body: "Le preguntaron si podía estar disponible los fines de semana. Vera no dijo que sí sin más: «¿Es una exigencia del puesto o algo excepcional? Según la respuesta, mi respuesta cambia». Se lo aclararon, y firmó sabiendo dónde entraba."
    before_phrase: "¿Eso es obligatorio o cómo va?"
    after_phrase: "¿Es una exigencia del puesto o algo excepcional?"
