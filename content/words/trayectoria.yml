readings:
  - position: 1
    scene: "entrevista"
    conversation_type: "practica"
    title: "Quince minutos sin papel"
    body: "Adriana había llevado el currículo impreso por costumbre, pero lo dejó bocabajo. «Le cuento mi trayectoria en tres pasos: almacén, compras y ahora proveedores». Tardó quince minutos y no leyó ni una línea."
    before_phrase: "Le cuento un poco lo que he ido haciendo."
    after_phrase: "Le cuento mi trayectoria en tres pasos."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "De aprendiz a encargado"
    body: "Mi abuelo resume cuarenta años en once palabras: entró de aprendiz con catorce y salió de encargado con cincuenta y cuatro. «Toda mi trayectoria cabe en una frase», dice, y se ríe. Luego cuenta la parte larga, que dura dos cafés."
    before_phrase: "Todo lo que hice cabe en una frase."
    after_phrase: "Toda mi trayectoria cabe en una frase."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "El premio de la librera"
    body: "La asociación del barrio premió a la librera de la esquina, que abrió en 1985 y sigue abriendo a las nueve. En la placa pusieron una sola línea: «Por una trayectoria de cuarenta años». Ella dijo gracias y volvió al mostrador."
    before_phrase: "Por todos estos años de trabajo."
    after_phrase: "Por una trayectoria de cuarenta años."
