  - confused_with: "trayecto"
    difference: "«Trayecto» es el camino entre dos puntos, como el del autobús; la otra palabra habla de años de trabajo."
    memory_trick: "El trayecto dura una hora; el recorrido profesional dura años."
  - confused_with: "currículo"
    difference: "«Currículo» es el papel donde se escribe todo; la otra palabra es el recorrido en sí, lo hayas escrito o no."
    memory_trick: "El currículo se imprime; el recorrido se vive."
