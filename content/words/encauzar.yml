ipa_latam: "[en.kawˈsaɾ]"
ipa_es: "[en.kawˈθaɾ]"
explanation: "Llevar de vuelta al buen camino algo que se estaba perdiendo, como una charla o un proyecto."
example_sentence: "La reunión se iba en quejas hasta que Julia la encauzó hacia una sola decisión."
register: "neutral"
pedantry_risk: 1
usage_tip: "Sirve para corregir sin regañar: dices hacia dónde va la cosa en vez de señalar quién la desvió."
when_not_to_use: "No la uses para cortar a quien todavía no ha terminado: llevar la charla a su sitio no es quitarle el turno."
collocations:
  - "encauzar una conversación"
  - "encauzar un proyecto"
  - "encauzar al equipo"
replaces:
