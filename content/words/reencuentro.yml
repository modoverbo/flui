readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "La mesa de la boda"
    body: "En la boda de un primo, Perla se sentó por casualidad junto a Selene, su mejor amiga del colegio, a quien no veía desde la graduación. Se miraron un segundo antes de gritar al mismo tiempo. «Qué reencuentro», dijo el novio al verlas abrazadas llorando de risa."
    before_phrase: "No puedo creer que nos volvamos a ver después de tanto tiempo."
    after_phrase: "Qué reencuentro tan bueno."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La videollamada de domingo"
    body: "Renzo llevaba tres años viviendo en otro país y casi no hablaba con su primo, con quien se había criado. Un domingo por fin coordinaron una videollamada larga. «Este reencuentro me hacía falta», le dijo su primo, «aunque sea por pantalla»."
    before_phrase: "Necesitaba volver a hablar contigo después de tanto tiempo."
    after_phrase: "Este reencuentro me hacía falta, aunque sea por pantalla."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El excompañero en la conferencia"
    body: "En una conferencia del sector, Wanda se cruzó con un excompañero de su primer trabajo, al que no veía desde hacía ocho años. Se quedaron charlando en el pasillo hasta que cerraron el evento. «Qué reencuentro más raro y más lindo a la vez», le escribió después a otra amiga."
    before_phrase: "No puedo creer con quién me crucé después de tantos años."
    after_phrase: "Qué reencuentro más raro y más lindo a la vez."
