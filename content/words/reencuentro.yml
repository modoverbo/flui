confusions:
  - confused_with: "desencuentro"
    difference: "«Desencuentro» es cuando dos personas no logran coincidir o terminan mal; el reencuentro es justo lo contrario, volver a verse después de tiempo separados."
    memory_trick: "El desencuentro separa; el reencuentro junta de nuevo."
  - confused_with: "encuentro"
    difference: "«Encuentro» no dice nada sobre el tiempo separados y podría ser la primera vez que se ven; el reencuentro siempre implica que ya se conocían de antes."
exercises:
  - position: 1
    sentence: "Norma se quedó mirando fijo a la mujer de la fila del supermercado hasta que la reconoció: era su compañera de banco de la primaria, y el {{blank}} la dejó sin palabras."
    hint_general: "Es volver a ver en persona a alguien de hace muchos años, sin haberlo planeado."
    explanation: "Reencuentro: volver a ver en persona a alguien de hace muchos años. «Recuerdo» es solo pensar en algo del pasado, sin que la persona esté ahí de verdad, y aquí su compañera está en la misma fila; «convocatoria» es un llamado formal a un evento, y aquí nadie organizó nada, fue pura casualidad."
    options:
      - position: 1
        text: "recuerdo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Recuerdo» es solo pensar en algo del pasado, y aquí su compañera de primaria está ahí, en persona, en la misma fila."
        hint_specific: "«Recuerdo» pasa solo en tu cabeza. ¿La compañera de Norma está presente o solo en su memoria?"
      - position: 2
        text: "convocatoria"
        is_correct: false
        distractor_type: "register"
        why_not: "«Convocatoria» es un llamado formal a un evento organizado, y aquí nadie planeó nada: fue pura casualidad en el supermercado."
        hint_specific: "«Convocatoria» es algo organizado. ¿Alguien organizó este momento en el supermercado?"
