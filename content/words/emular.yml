stressed_syllable: 3
ipa_latam: "[e.muˈlaɾ]"
ipa_es: "[e.muˈlaɾ]"
explanation: "Tomar a alguien como ejemplo y tratar de hacerlo igual de bien o mejor."
example_sentence: "Diego quiere emular la calma de su primer jefe, no su forma de vestir."
register: "neutral"
pedantry_risk: 1
usage_tip: "Es un elogio hacia quien te sirve de ejemplo: reconoce el mérito ajeno sin rebajar el tuyo."
when_not_to_use: "No la uses para fingir algo que no es real; eso es «simular»."
collocations:
  - "emular a alguien"
  - "emular un método"
  - "difícil de emular"
replaces:
  - before: "Quiere simular la calma de su jefe"
    after: "Quiere emular la calma de su jefe"
  - before: "Intenta hacerlo como ella, y a ser posible mejor"
    after: "Intenta emularla"
  - before: "Ese resultado no lo iguala nadie"
    after: "Ese resultado es difícil de emular"
family:
  - "emulación"
themes:
