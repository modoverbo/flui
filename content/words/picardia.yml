    difference: "«Descaro» cruza la línea del respeto y deja al otro incómodo; la picardía juega con lo que no se dice y hace sonreír."
    memory_trick: "El descaro empuja; la picardía roza."
  - confused_with: "cobardía"
    difference: "«Cobardía» es callarse por miedo; la picardía sí habla, solo que a medias y con gracia."
    memory_trick: "La cobardía calla; la picardía insinúa."
exercises:
