readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "El brindis de los dos sentidos"
    body: "Vidal se levantó con la copa y dijo tres frases cortas. Cada una podía leerse de dos maneras, y las dos hacían gracia. La pareja se rio, los suegros también, y nadie tuvo que explicar nada. «Menuda picardía tiene este hombre», dijo alguien al fondo."
    before_phrase: "Lo dijo con una sonrisilla, medio en broma."
    after_phrase: "Lo dijo con picardía."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Los ochenta de la abuela"
    body: "En su cumpleaños le preguntaron cuál era el secreto. Ella miró la tarta, contó las velas y contestó: «Contar despacio». Toda la mesa se rio a la vez. Su nieta lo anotó esa noche: la picardía de su abuela seguía intacta."
    before_phrase: "Qué respuesta tan traviesa."
    after_phrase: "Qué picardía la de mi abuela."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "La cena de empresa"
    body: "A Estela le preguntaron delante de todos cuánto pensaba quedarse en el puesto. Sonrió y dijo: «Lo suficiente para que me echen de menos». Se rieron, la pregunta se disolvió y la cena siguió. Con un poco de picardía había esquivado el momento sin faltar a nadie."
    before_phrase: "No supe qué contestar y me quedé callada."
    after_phrase: "Contesté con picardía y seguimos cenando."
