stressed_syllable: 3
ipa_latam: "[in.xeˈnjo.so]"
ipa_es: "[in.xeˈnjo.so]"
explanation: "Que responde o resuelve con una idea rápida y original, a menudo con gracia."
example_sentence: "Su brindis fue tan ingenioso que la mesa entera se rio y nadie quedó mal."
register: "neutral"
pedantry_risk: 1
usage_tip: "Es un elogio preciso para una idea o una salida rápida; dicho de ti mismo suena a presumir."
when_not_to_use: "No la uses para quien repite chistes ajenos, ni para quien maniobra con astucia para sacar ventaja."
collocations:
  - "una salida ingeniosa"
  - "un comentario ingenioso"
  - "una forma ingeniosa de resolverlo"
replaces:
  - before: "Qué bueno lo que dijiste"
    after: "Qué ingenioso lo que dijiste"
  - before: "Tiene ideas muy buenas y divertidas"
    after: "Tiene ideas muy ingeniosas"
  - before: "Lo arregló de una manera rara y buenísima"
    after: "Lo arregló de una forma muy ingeniosa"
