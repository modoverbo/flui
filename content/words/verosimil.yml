confusions:
  - confused_with: "veraz"
    difference: "«Veraz» dice que algo es verdad; la otra palabra solo dice que se sostiene y encaja, sin garantizarlo."
    memory_trick: "Lo veraz está probado; lo otro solo se sostiene de pie."
  - confused_with: "verídico"
    difference: "«Verídico» afirma que los hechos ocurrieron de verdad; la otra palabra habla de cómo suena, no de lo que pasó."
    memory_trick: "Verídico mira los hechos; la otra palabra mira cómo encaja el relato."
  - confused_with: "verificable"
    difference: "«Verificable» dice que hay dónde comprobar un dato; esta palabra solo dice que algo parece cierto y encaja, sin garantizar que lo sea."
    memory_trick: "Lo verificable se comprueba; lo verosímil convence."
exercises:
