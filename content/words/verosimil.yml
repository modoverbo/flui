readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Dos detalles bastaron"
    body: "La previsión de Otilia sonaba a deseo hasta que añadió dos datos: el mes en que empezó a subir y el nombre del cliente que lo pidió. «Ahora sí es verosímil», dijo su jefa. Con la misma cifra y dos detalles, la reunión cambió de tono."
    before_phrase: "Yo creo que va a subir, sinceramente."
    after_phrase: "Ahora sí es verosímil."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "La historia del gato"
    body: "En la cena, alguien contó cómo su gato había cruzado media ciudad para volver a casa. «Suena a película», dijo uno. «Es verosímil», contestó Nadia: «pasó en tres días y por calles que conocía». La sobremesa se alargó otra hora."
    before_phrase: "Eso no se lo cree nadie."
    after_phrase: "Es verosímil, y te digo por qué."
  - position: 3
    scene: "entrevista"
    conversation_type: "practica"
    title: "La cifra del currículo"
    body: "«Duplicamos las ventas» sonaba enorme y vacío. Ivo lo contó con suelo: «Pasamos de once a veintitrés clientes en catorce meses, y dos de ellos vinieron de la misma feria». La entrevistadora asintió: era verosímil y, además, comprobable."
    before_phrase: "Duplicamos las ventas, así, en general."
    after_phrase: "Te lo cuento para que sea verosímil."
