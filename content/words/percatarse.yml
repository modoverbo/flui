exercises:
  - position: 1
    sentence: "Fue Marina quien se {{blank}} de que su compañero llevaba días sin hablar en las reuniones."
    hint_general: "Notar algo que estaba ahí, aunque nadie te lo haya señalado antes."
    explanation: "Percató: notó algo que estaba ahí, sin que nadie se lo señalara. «Recató» es de recatarse (actuar con modestia), y «avisó» implica informar a otros; ninguno describe notar algo por cuenta propia."
    options:
      - position: 1
        text: "percató"
        is_correct: true
      - position: 2
        text: "recató"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Recatarse» es actuar con modestia o reserva, sin relación con notar algo por cuenta propia."
        hint_specific: "Recatarse es actuar con modestia. ¿La frase habla de modestia o de notar algo?"
      - position: 3
        text: "avisó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Avisar» implica informar a otra persona, y la frase habla de que Marina notó algo por su cuenta, no de que se lo contara a alguien."
        hint_specific: "Avisar es informar a otro. ¿Marina informó a alguien o notó algo por su cuenta?"
