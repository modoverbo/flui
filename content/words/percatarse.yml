    difference: "Un percance es un problema o contratiempo imprevisto; percatarse es notar algo que estaba ahí, sin que nadie te lo haya señalado."
    memory_trick: "El percance te pasa a ti; percatarte es lo que tú notas en otra persona."
replaces:
