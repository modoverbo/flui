explanation: "Subir el precio de algo por un cambio que nadie pidió."
example_sentence: "Cambiar el material a última hora encarece la obra y retrasa la entrega."
register: "neutral"
pedantry_risk: 1
usage_tip: "Nombra la causa y el efecto en una sola palabra: dice qué subió el coste sin señalar a nadie."
when_not_to_use: "No la uses para un precio que alguien decide subir a propósito; esto describe lo que un cambio provoca."
collocations:
  - "encarecer la obra"
  - "encarecer el proyecto"
  - "encarecer el transporte"
replaces:
