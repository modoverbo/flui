readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "El mensaje que no llega"
    body: "Después de la primera cita, Ezequiel no dejaba de mirar el teléfono, aunque sin ansiedad. «Tengo un anhelo tranquilo de que me escriba», le contó a un amigo, «sé que lo va a hacer, solo estoy esperando con ganas»."
    before_phrase: "Tengo muchas ganas de que me escriba, aunque sin desesperarme."
    after_phrase: "Tengo un anhelo tranquilo de que me escriba."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La conversación con mi madre"
    body: "Malena le contó a su madre que, desde que había conocido a alguien especial, sentía unas ganas constantes de compartir su día a día con esa persona. «Eso es un anhelo bonito», le dijo su madre, «disfrútalo, no hace falta que corras»."
    before_phrase: "Tengo ganas de compartir mi vida con esa persona, sin prisa."
    after_phrase: "Eso es un anhelo bonito, dice mi madre."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El comentario en el almuerzo"
    body: "En el almuerzo, Aitana le contó a una compañera que llevaba semanas con ganas de volver a ver a alguien que había conocido en un viaje, sin ninguna prisa por que pasara pronto. «Eso es puro anhelo», comentó su compañera, sonriendo, «qué bonito sentirlo así de tranquilo»."
    before_phrase: "Tengo ganas de volver a verlo, sin ninguna prisa."
    after_phrase: "Eso es puro anhelo, tan tranquilo."
