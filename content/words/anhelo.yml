        hint_specific: "El antojo pasa rápido. ¿Cuánto tiempo lleva Ezequiel sintiendo esto?"
  - position: 2
    sentence: "Malena sentía {{blank}} por volver a ver a su cita, aunque sin ninguna desesperación: sabía que se verían pronto de todas formas."
    hint_general: "Es un sentimiento profundo pero tranquilo, sin desesperación ni un capricho trivial."
