  - position: 5
    sentence: "Bruno pensó al principio que se le pasaría en un par de días, como sus antojos de siempre, pero no era un capricho egoísta: reconoció que lo que sentía desde su última relación no era otra cosa que {{blank}}, algo que llevaba meses sin desaparecer."
    hint_general: "Piensa en unas ganas que duran meses, distintas de un antojo que se pasa rápido o un capricho egoísta."
    explanation: "Anhelo: unas ganas profundas que no se parecen a un antojo ni a un capricho. «Antojo» se pasa rápido, y la frase contrasta esto con sus antojos de siempre, que sí se le pasan; «capricho» es egoísta y trivial, y la frase aclara que no lo era."
    options:
      - position: 1
        text: "antojo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Antojo» se pasa rápido, como los de siempre de Bruno, y la frase aclara que esto llevaba meses sin desaparecer."
        hint_specific: "El antojo pasa rápido. ¿Cuánto tiempo llevaba sintiendo esto Bruno?"
      - position: 2
