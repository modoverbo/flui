  - position: 4
    sentence: "Norma, que estaba bien sola y no le faltaba nada, sentía {{blank}} de compartir su rutina diaria con alguien, más que unas ganas de una cita en particular esta semana."
    hint_general: "Es algo amplio y duradero, sin que falte nada en tu vida actual, no algo inmediato."
    explanation: "Anhelo: unas ganas amplias y duraderas, no una carencia ni algo inmediato. «Necesidad» implicaría que algo le falta, y la frase aclara que estaba bien sola y no le faltaba nada; «deseo» es más general y puede sonar a algo inmediato, como una cita concreta esta semana, y aquí no se habla de eso."
    options:
      - position: 1
        text: "necesidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Necesidad» implicaría que algo le falta, y la frase aclara que Norma estaba bien sola y no le faltaba nada."
