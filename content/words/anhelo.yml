        why_not: "«Capricho» es un antojo trivial, y lo que siente Malena por volver a ver a su cita es más profundo que eso."
        hint_specific: "El capricho es trivial. ¿Lo que siente Malena es trivial o profundo?"
  - position: 3
    sentence: "«¿Estás obsesionada con él o qué?», le preguntaron a Aitana. «Para nada, es solo {{blank}}: ganas tranquilas de volver a verlo, sin volverme loca», respondió ella."
    hint_general: "Piensa en ganas tranquilas de volver a ver a alguien, ya descartada la idea de obsesión."
    explanation: "Anhelo: unas ganas tranquilas, ya aclarado que no es obsesión. Aitana misma descarta la obsesión con «para nada»; «esperanza» implicaría duda sobre si volverán a verse, y aquí lo que describe es solo el sentimiento de espera, tranquilo."
    options:
      - position: 1
        text: "obsesión"
        is_correct: false
        distractor_type: "register"
        why_not: "Aitana misma descarta esta opción con «para nada» al inicio de su respuesta."
