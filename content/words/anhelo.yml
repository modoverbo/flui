    memory_trick: "El antojo se pasa pronto; el anhelo se queda."
  - confused_with: "ansia"
    difference: "«Ansia» suena urgente y casi desesperado; el anhelo es más tranquilo, aunque sea profundo."
exercises:
  - position: 1
    sentence: "Ezequiel llevaba días sintiendo un {{blank}} tranquilo de volver a verla, sin ninguna prisa por escribirle esa misma noche."
    hint_general: "Piensa en ganas tranquilas que se sostienen en el tiempo, no en un engaño ni en algo pasajero."
    explanation: "Anhelo: unas ganas tranquilas que se sostienen en el tiempo. «Anzuelo» es un gancho para pescar o para atrapar a alguien con engaño, y no tiene que ver con un sentimiento; «antojo» es un capricho que pasa rápido, y aquí Ezequiel lleva días sintiéndolo."
