    conversation_type: "social"
    title: "La cola del banco"
    body: "Mi abuelo convierte cualquier espera en algo que merece la pena. En la cola del banco cuenta cómo se conocieron sus padres, y la señora de delante se gira para escuchar. Hace amena hasta la espera más larga."
    before_phrase: "Con él se hace corta hasta la cola."
    after_phrase: "Hace amena hasta la espera más larga."
  - position: 3
    scene: "entrevista"
    conversation_type: "social"
    title: "Clara y amena"
    body: "Hugo explicó su último proyecto con un ejemplo de su barrio en vez de con un diagrama. Al final, la entrevistadora anotó dos palabras: «clara y amena». Le llamaron dos días después."
    before_phrase: "Se entendió bien y además no se hizo largo."
    after_phrase: "Clara y amena."
