readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Dos colores y una foto"
    body: "El equipo llevaba una semana discutiendo el folleto del taller. Beatriz llegó con una versión de dos colores, una foto y seis líneas. «Es demasiado sobrio», dijo alguien. Se imprimieron las dos y la gente cogió la suya: la otra se quedó en la caja."
    before_phrase: "Este está muy simple, ¿no?"
    after_phrase: "Este es sobrio, y por eso se lee."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "El traje de la boda"
    body: "Anselmo se probó siete trajes y volvió al primero. Su hermana le insistía con uno más llamativo. «Prefiero ir sobrio y que la gente mire a los novios», contestó. En las fotos de aquel día nadie se acordó de su traje, y él lo cuenta como una victoria."
    before_phrase: "Yo voy sencillito, sin nada raro."
    after_phrase: "Prefiero ir sobrio."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "La mesa de Olalla"
    body: "Olalla puso mantel blanco, una vela y nada más. Su vecina esperaba flores, servilletas dobladas y tres copas por persona. A media cena lo dijo en voz alta: «Qué bien se está aquí; es todo muy sobrio y se habla mejor». La conversación duró hasta la una."
    before_phrase: "No he puesto nada del otro mundo."
    after_phrase: "Lo he puesto todo muy sobrio."
