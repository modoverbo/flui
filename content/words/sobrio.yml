confusions:
  - confused_with: "sombrío"
    difference: "«Sombrío» describe algo oscuro o triste; la otra palabra describe algo sin adornos, que puede ser luminoso y alegre."
    memory_trick: "Lo sombrío da pena; lo demás solo quita adornos."
  - confused_with: "soberbio"
    difference: "«Soberbio» acusa de orgullo, o exagera hasta lo enorme; la otra palabra elogia justo la falta de exageración."
    memory_trick: "El soberbio se hincha; lo contrario se recorta."
exercises:
