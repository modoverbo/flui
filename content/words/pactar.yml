explanation: "Cerrar un acuerdo en el que cada parte cede algo y se compromete a cumplirlo."
example_sentence: "Antes de empezar la obra pactamos el precio y la fecha, y no hubo sorpresas."
register: "neutral"
pedantry_risk: 1
usage_tip: "Suena bien cuando el acuerdo tiene números o fechas: sirve igual para un contrato que para un reparto en casa."
when_not_to_use: "No la uses cuando una parte decide y la otra obedece: ahí no hay dos voluntades, hay una orden."
collocations:
  - "pactar un plazo"
  - "pactar una salida"
  - "pactar las reglas"
replaces:
  - before: "Hicimos un trato con el cliente"
