confusions:
  - confused_with: "acatar"
    difference: "«Acatar» es cumplir una decisión que viene de otro; aquí las dos partes deciden juntas y las dos ceden algo."
    memory_trick: "Quien acata obedece; quien pacta negocia."
  - confused_with: "captar"
    difference: "«Captar» es entender una idea o atraer a alguien; no tiene nada que ver con cerrar un acuerdo."
    memory_trick: "Captas una idea; pactas una condición."
exercises:
  - position: 1
    sentence: "Después de tres llamadas, Lorena y su cliente {{blank}} una tarifa por hora y un límite de cambios."
    hint_general: "Las dos partes cerraron juntas un acuerdo con números claros."
    explanation: "Pactaron: las dos partes cerraron juntas el acuerdo. «Acataron» sería obedecer una orden ajena, y «discutieron» solo cuenta que hablaron del asunto."
    options:
      - position: 1
        text: "acataron"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Acatar» es cumplir una decisión que viene de otro; aquí la tarifa la fijan los dos juntos."
        hint_specific: "Acatar supone una orden de arriba. ¿Quién fija aquí la tarifa?"
      - position: 2
        text: "pactaron"
        is_correct: true
      - position: 3
        text: "discutieron"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Discutir» dice que hablaron del asunto; la frase cuenta que salieron con una tarifa y un límite cerrados."
        hint_specific: "Discutir se queda en la charla. ¿La frase se queda ahí o llega a un acuerdo?"
  - position: 2
    sentence: "Antes de firmar, Ignacio quiso {{blank}} con la constructora qué pasaba con los gastos extra: los dos se comprometieron por escrito."
    hint_general: "Quiere dejar cerrado de antemano un compromiso sobre esos gastos."
    explanation: "Pactar: cerrar un compromiso de las dos partes antes de firmar. «Captar» sería entenderlo él solo, y «aclarar» solo despejaría la duda, sin comprometer a nadie."
    options:
      - position: 1
        text: "captar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Captar» es darte cuenta de algo por tu cuenta, y aquí hacen falta dos partes que se comprometan por escrito."
        hint_specific: "«Captar» lo hace una sola persona. ¿Cuántas firman ese compromiso?"
      - position: 2
        text: "aclarar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Aclarar» es entender algo que estaba borroso, y entender no obliga a nadie a nada por escrito."
        hint_specific: "Aclarar solo despeja una duda. ¿Basta con entenderlo o hay que comprometerse?"
      - position: 3
        text: "pactar"
        is_correct: true
  - position: 3
    sentence: "Mi hermana y yo nos sentamos a {{blank}} el reparto de la mudanza, y lo dejamos por escrito esa misma noche."
    hint_general: "Buscan un acuerdo que las dos aceptan y que luego ponen en papel."
    explanation: "Pactar: buscan un acuerdo que las dos aceptan. «Captar» es entender o atraer algo, y «amarrar» es muy coloquial y suena a sujetar por la fuerza."
    options:
      - position: 1
        text: "pactar"
        is_correct: true
      - position: 2
        text: "captar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Captar» es entender una idea o atraer a alguien; aquí dos personas reparten un trabajo entre ellas."
        hint_specific: "«Captar» va de entender o atraer. ¿Qué hacen las dos hermanas en esa mesa?"
      - position: 3
        text: "amarrar"
        is_correct: false
        distractor_type: "register"
        why_not: "«Amarrar» es muy coloquial y sugiere sujetar algo para que no se escape; este reparto se decide hablando."
        hint_specific: "«Amarrar» suena a atar con fuerza. ¿El reparto se sujeta o se conversa?"
  - position: 4
    sentence: "En el chat del equipo, Rodrigo y Pilar {{blank}} una fecha intermedia y la pusieron esa tarde en el calendario compartido."
    hint_general: "Los dos cierran una fecha que les sirve a ambos."
    explanation: "Pactaron: cerraron una fecha que servía a ambos. «Acataron» supondría que alguien la impuso, y «propusieron» dejaría la fecha todavía en el aire."
    options:
      - position: 1
        text: "acataron"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Acatar» es cumplir lo que otro decide, y en el chat no hay nadie por encima: la fecha la eligen ellos dos."
        hint_specific: "Acatar supone una orden de arriba. ¿Quién decide la fecha en ese chat?"
      - position: 2
        text: "propusieron"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Proponer» deja la fecha a la espera de un sí, y esa misma tarde ya estaba en el calendario."
        hint_specific: "Proponer deja la decisión pendiente. ¿Dónde acabó la fecha esa tarde?"
      - position: 3
        text: "pactaron"
        is_correct: true
  - position: 5
    sentence: "Mientras duró la obra, los vecinos del cuarto y los del quinto usaron el ascensor por turnos que {{blank}} entre todos, cediendo cada uno alguna hora buena."
    hint_general: "Se pusieron de acuerdo entre ellos y cada uno cedió algo."
    explanation: "Pactaron: se pusieron de acuerdo cediendo cada uno algo. «Sortearon» sería dejarlo al azar, y «acataron» supondría que alguien decidió por ellos."
    options:
      - position: 1
        text: "sortearon"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Sortear» es dejarlo al azar, y en un sorteo nadie cede nada: te toca lo que te toca."
        hint_specific: "Sortear reparte por suerte. ¿Qué hace cada vecino con su hora buena?"
      - position: 2
        text: "pactaron"
        is_correct: true
      - position: 3
        text: "acataron"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Acatar» es cumplir lo que otro decide; en la frase nadie impone los turnos, los arreglan entre ellos."
        hint_specific: "Acatar supone una orden de arriba. ¿Alguien manda aquí sobre el ascensor?"
  - position: 6
    sentence: "Antes de aceptar el encargo, Valentina {{blank}} con su jefa veinte horas semanales, ni una más."
    hint_general: "Deja cerrado con su jefa un compromiso sobre las horas."
    explanation: "Pactó: dejó cerrado un compromiso sobre las horas. «Captó» sería entenderlo por su cuenta, y «consultó» sería preguntar, sin fijar ningún número."
    options:
      - position: 1
        text: "captó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Captar» es darse cuenta de algo por tu cuenta; aquí las dos fijan juntas un número de horas."
        hint_specific: "«Captar» lo hace una sola persona. ¿Cuántas deciden estas horas?"
      - position: 2
        text: "consultó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Consultar» es preguntar y esperar respuesta, y preguntar no deja veinte horas cerradas, ni una más."
        hint_specific: "Consultar solo busca una respuesta. ¿Qué queda fijado al final de la frase?"
      - position: 3
        text: "pactó"
        is_correct: true
  - position: 7
    sentence: "Si {{blank}} hoy las reglas del grupo, en diciembre nadie tendrá que improvisar."
    hint_general: "Cerrar hoy, entre todos, unas reglas que valgan para diciembre."
    explanation: "Pactamos: cerramos hoy unas reglas entre todos. «Acatamos» sería obedecer reglas que ya vienen dadas, y «proponemos» las dejaría sin aprobar."
    options:
      - position: 1
        text: "proponemos"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Proponer» deja las reglas sobre la mesa a la espera de un sí; para evitar la improvisación hay que cerrarlas."
        hint_specific: "Proponer deja las reglas pendientes. ¿Qué hace falta para no improvisar en diciembre?"
      - position: 2
        text: "acatamos"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Acatar» es cumplir unas reglas que ya existen; la frase habla de crearlas ahora entre todos."
        hint_specific: "Acatar supone reglas escritas por otro. ¿Aquí ya existen o nacen hoy?"
      - position: 3
        text: "pactamos"
        is_correct: true
  - position: 8
    sentence: "Tras dos meses de tira y afloja, ambas partes {{blank}} una salida que nadie celebró pero que todos firmaron."
    hint_general: "Cada lado cedió algo y el acuerdo salió adelante sin entusiasmo."
    explanation: "Pactaron: cada lado cedió algo y el acuerdo salió adelante. «Impusieron» diría que un lado mandó sobre el otro, y «captaron» que solo la entendieron."
    options:
      - position: 1
        text: "pactaron"
        is_correct: true
      - position: 2
        text: "impusieron"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Imponer» significa que un lado obliga al otro, y aquí las dos partes firman la misma salida."
        hint_specific: "Imponer supone un lado más fuerte. ¿La frase habla de un ganador?"
      - position: 3
        text: "captaron"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Captar» es entender algo por tu cuenta, y entender una salida no la deja firmada por nadie."
        hint_specific: "«Captar» se queda en la cabeza. ¿Qué hicieron las dos partes al final?"
