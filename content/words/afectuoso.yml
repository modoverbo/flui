schema_version: 1
status: "draft"
slug: "afectuoso"
lemma: "afectuoso"
part_of_speech: "adjetivo"
syllables: ["a", "fec", "tuo", "so"]
stressed_syllable: 3
ipa_latam: "[a.fekˈtwo.so]"
ipa_es: "[a.fekˈtwo.so]"
explanation: "Que demuestra cariño de manera clara y abierta, con palabras y cuidado, sin esconder lo que siente."
example_sentence: "Es un abuelo muy afectuoso: siempre abraza fuerte y dice lo orgulloso que está de sus nietos."
register: "neutral"
pedantry_risk: 1
usage_tip: "Sirve para alguien que muestra su cariño hacia afuera, con palabras o abrazos, no solo lo siente por dentro."
when_not_to_use: "No la uses para quien es correcto y educado sin más: eso es cortesía, no un cariño que se muestra."
collocations:
  - "trato afectuoso"
  - "mensaje afectuoso"
  - "abrazo afectuoso"
replaces:
  - before: "Es muy cariñoso, te lo hace saber siempre"
    after: "Es muy afectuoso"
  - before: "Me escribió algo muy tierno y cercano"
    after: "Me escribió un mensaje afectuoso"
family: ["afecto", "afectuosamente"]
themes:
  - slug: "amistad"
    relevance: 3
tags:
  comodin: ["cariñoso"]
  funcion: ["elogiar"]
  canal: "ambos"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "afectado"
    difference: "«Afectado» describe a quien actúa de forma artificial o exagerada; lo afectuoso muestra un cariño genuino, no una actuación."
    memory_trick: "Lo afectado se finge; lo afectuoso se siente."
  - confused_with: "empalagoso"
    difference: "«Empalagoso» es un cariño exagerado que cansa o incomoda; lo afectuoso es cálido pero natural, sin pasarse."
    memory_trick: "Lo empalagoso cansa; lo afectuoso simplemente abraza."
exercises:
  - position: 1
    sentence: "Valentina siempre termina sus mensajes con un «te quiero, cuídate mucho»: es una persona muy {{blank}}."
    hint_general: "Piensa en alguien que dice y muestra su cariño con claridad, sin esconder lo que siente."
    explanation: "Afectuosa: muestra su cariño con palabras claras en cada mensaje. «Afectada» describe a quien actúa de forma artificial, y esos mensajes suenan sinceros. «Atenta» habla de fijarse en detalles, no de palabras de cariño."
    options:
      - position: 1
        text: "afectada"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Afectada» describe a quien actúa de forma artificial o exagerada, y esos mensajes de Valentina suenan sinceros, no actuados."
        hint_specific: "«Afectada» habla de fingir o exagerar. ¿Esos mensajes suenan actuados o sinceros?"
      - position: 2
        text: "afectuosa"
        is_correct: true
      - position: 3
        text: "atenta"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Atenta» describe a quien se fija en los detalles y las necesidades de otros; aquí lo que se nota es que expresa cariño con palabras claras."
        hint_specific: "«Atenta» habla de fijarse en detalles y necesidades. ¿Esta frase habla de eso o de palabras de cariño?"
  - position: 2
    sentence: "En su despedida de la oficina, Camilo abrazó a cada compañero y le dijo algo lindo: fue un gesto muy {{blank}}, no solo un trámite de cortesía."
    hint_general: "Busca la palabra para un gesto que muestra cariño real, más allá de la cortesía esperada."
    explanation: "Afectuoso: mostró cariño real, no solo cortesía. «Cordial» describe un trato correcto y educado de oficina, y la frase dice justo lo contrario. «Cercano» habla de una relación de confianza, pero no de los abrazos y las palabras."
    options:
      - position: 1
        text: "cordial"
        is_correct: false
        distractor_type: "register"
        why_not: "«Cordial» describe un trato correcto y educado, típico de una despedida formal; aquí Camilo mostró cariño real, no solo cortesía."
        hint_specific: "«Cordial» suena a trato educado de oficina. ¿La frase describe cortesía o cariño de verdad?"
      - position: 2
        text: "afectuoso"
        is_correct: true
      - position: 3
        text: "cercano"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cercano» dice que la relación es próxima y de confianza, pero no que lo haya mostrado con un abrazo y palabras."
        hint_specific: "«Cercano» habla de una relación de confianza. ¿Eso explica el abrazo y las palabras que dijo?"
  - position: 3
    sentence: "Cada vez que su nieto se despide, don Ernesto lo abraza fuerte y le dice cuánto lo quiere: es un abuelo muy {{blank}}."
    hint_general: "La palabra describe a quien muestra su cariño con gestos y palabras claras, sin esconderlo."
    explanation: "Afectuoso: muestra su cariño con abrazos y palabras claras. «Afectado» describe a quien actúa de forma artificial, y aquí el cariño es genuino. «Compasivo» responde al sufrimiento de otro, y en esta escena no hay ningún dolor."
    options:
      - position: 1
        text: "afectado"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Afectado» describe a quien actúa de manera artificial; el cariño de don Ernesto por su nieto es genuino, no una actuación."
        hint_specific: "«Afectado» habla de actuar de forma artificial. ¿El cariño de don Ernesto parece fingido?"
      - position: 2
        text: "afectuoso"
        is_correct: true
      - position: 3
        text: "compasivo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Compasivo» describe a quien se conmueve ante el sufrimiento de otra persona; aquí no hay ningún dolor de por medio, solo cariño que se expresa con abrazos y palabras."
        hint_specific: "«Compasivo» responde al sufrimiento de alguien. ¿Hay algún dolor en esta escena?"
  - position: 4
    sentence: "A Tomás no se le dan bien los regalos ni recuerda fechas, pero cuando está contigo te abraza fuerte y te repite lo importante que eres para él: es {{blank}}, aunque nunca lo demuestre con cosas."
    hint_general: "Piensa en alguien que expresa su cariño con palabras y abrazos, aunque no se le den bien otras cosas."
    explanation: "Afectuoso: expresa cariño con abrazos y palabras, aunque no con regalos. «Mimoso» es un término casi infantil, para mascotas o bebés. «Detallista» dice que acierta con regalos y fechas, y la frase dice justo lo contrario."
    options:
      - position: 1
        text: "mimoso"
        is_correct: false
        distractor_type: "register"
        why_not: "«Mimoso» es un término casi infantil, para mascotas o bebés, y aquí se describe a un adulto que expresa cariño con palabras y abrazos."
        hint_specific: "«Mimoso» se usa para bebés o mascotas. ¿Encaja para describir a un adulto que habla así?"
      - position: 2
        text: "afectuoso"
        is_correct: true
      - position: 3
        text: "detallista"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Detallista» dice que alguien recuerda fechas y acierta con los regalos, y la frase aclara justo lo contrario: no se le dan bien esas cosas."
        hint_specific: "«Detallista» habla de acertar con regalos y fechas. ¿La frase dice que a Tomás se le dan bien esas cosas?"
  - position: 5
    sentence: "A Nadia le encanta dejar notas de «buenos días» y abrazar a sus compañeros cuando llegan: todos coinciden en que es muy {{blank}}, nunca resulta pesada."
    hint_general: "Busca la palabra para quien muestra cariño de forma natural, sin resultar excesiva."
    explanation: "Afectuosa: muestra cariño de forma natural, sin resultar pesada. «Empalagosa» describe un cariño que cansa, y la frase aclara que nunca resulta pesada. «Cercana» habla de confianza, pero no explica las notas y los abrazos."
    options:
      - position: 1
        text: "empalagosa"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Empalagosa» describe un cariño exagerado que cansa o incomoda, y la frase aclara que nunca resulta pesada."
        hint_specific: "«Empalagosa» es un cariño que cansa. ¿La frase dice que resulta pesada o todo lo contrario?"
      - position: 2
        text: "afectuosa"
        is_correct: true
      - position: 3
        text: "cercana"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cercana» dice que la relación es próxima y de confianza, pero no explica las notas y los abrazos que reparte cada mañana."
        hint_specific: "«Cercana» habla de una relación de confianza. ¿Eso explica las notas y los abrazos de cada mañana?"
  - position: 6
    sentence: "Aunque Emilio es muy reservado en el trabajo, con sus amigos de siempre es completamente distinto: los abraza, les escribe mensajes largos y les dice lo mucho que los quiere. Es {{blank}} con quienes de verdad conoce."
    hint_general: "La palabra describe a quien muestra abiertamente el cariño que siente por la gente cercana."
    explanation: "Afectuoso: muestra abiertamente el cariño con abrazos y mensajes. «Afectado» describe a quien actúa con artificialidad, y aquí Emilio se muestra genuino. «Atento» habla de fijarse en necesidades, no de abrazos y palabras de cariño."
    options:
      - position: 1
        text: "afectado"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Afectado» describe a alguien que actúa con artificialidad, y aquí Emilio se muestra genuino con la gente que conoce bien."
        hint_specific: "«Afectado» habla de actuar de forma artificial. ¿Emilio actúa o se muestra genuino con sus amigos?"
      - position: 2
        text: "afectuoso"
        is_correct: true
      - position: 3
        text: "atento"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Atento» describe a quien se fija en los detalles y necesidades de otros, y aquí lo que se cuenta son abrazos, mensajes y palabras de cariño."
        hint_specific: "«Atento» va de fijarse en necesidades ajenas. ¿La frase habla de eso o de abrazos y palabras?"
  - position: 7
    sentence: "Julieta cumplió años y sus amigas llenaron su casa de fotos juntas, notas escritas a mano y un video con mensajes de cada una: fueron muy {{blank}} con ella."
    hint_general: "Piensa en la palabra para quien expresa su cariño con gestos como fotos, notas o mensajes."
    explanation: "Afectuosas: expresaron su cariño con fotos, notas y mensajes. «Compasivas» responde al sufrimiento de alguien, y aquí no hay ningún dolor. «Cercanas» habla de confianza, pero no explica ese despliegue de cariño."
    options:
      - position: 1
        text: "compasivas"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Compasivas» describe a quien se conmueve ante el sufrimiento de otra persona, y aquí no hay ningún dolor: es un cumpleaños que quisieron celebrar con cariño."
        hint_specific: "«Compasiva» responde al sufrimiento de alguien. ¿Hay algún dolor en esta escena de cumpleaños?"
      - position: 2
        text: "afectuosas"
        is_correct: true
      - position: 3
        text: "cercanas"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cercanas» dice que la relación es próxima y de confianza, pero no explica por qué llenaron la casa de fotos, notas y mensajes."
        hint_specific: "«Cercana» habla de una relación de confianza. ¿Eso explica las fotos, las notas y los mensajes?"
  - position: 8
    sentence: "Nunca dudes de lo que siente Gonzalo por su familia: los llama todos los domingos solo para decirles que los extraña, sin ningún motivo especial. Es tan {{blank}} que sus amigos bromean con eso, aunque en el fondo lo adoran así."
    hint_general: "Busca la palabra para quien expresa su cariño con palabras, de forma constante y genuina."
    explanation: "Afectuoso: expresa su cariño con palabras, de forma constante y genuina. «Afectado» describe a quien actúa con artificialidad, y esas llamadas nacen de un cariño real. «Empalagoso» describe un cariño que cansa, y aquí sus amigos lo adoran así."
    options:
      - position: 1
        text: "afectado"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Afectado» describe a quien actúa con artificialidad, y las llamadas de Gonzalo nacen de un cariño genuino, no de una actuación."
        hint_specific: "«Afectado» habla de actuar de forma artificial. ¿Esas llamadas de Gonzalo suenan actuadas?"
      - position: 2
        text: "afectuoso"
        is_correct: true
      - position: 3
        text: "empalagoso"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Empalagoso» describe un cariño que cansa o incomoda, y la frase dice que sus amigos, en el fondo, lo adoran así."
        hint_specific: "«Empalagoso» es un cariño que incomoda. ¿La frase dice que sus amigos se cansan de él o que lo adoran así?"
readings:
  - position: 1
    scene: "familia"
    conversation_type: "emocional"
    title: "El abrazo de siempre"
    body: "Cada noche, antes de dormir, el papá de Bruno le repite lo orgulloso que está de él, aunque el día haya sido normal. «No necesitas lograr nada para que te quiera así», le dice. Bruno creció pensando que todos los padres eran igual de afectuosos, hasta que entendió que no."
    before_phrase: "Mi papá siempre me dice cosas lindas, así, porque sí."
    after_phrase: "Mi papá es muy afectuoso conmigo."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "El grupo del domingo"
    body: "Cada domingo, el mismo grupo de amigas se reúne a desayunar. Antes de irse, se abrazan una por una y se dicen algo bonito, sin que nadie se sienta raro por eso. «Somos así de afectuosas desde la universidad», dice Pilar, «y no pensamos cambiar»."
    before_phrase: "Somos un grupo bien unido, nos decimos las cosas."
    after_phrase: "Somos un grupo muy afectuoso."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "La bienvenida"
    body: "El primer día de Mateo en el equipo, su jefa lo presentó a todos por su nombre, le preguntó por su mudanza y, al final del día, le dijo: «Cualquier cosa que necesites, aquí estamos». Mateo salió pensando que pocas veces había sentido un trato tan afectuoso en un trabajo nuevo."
    before_phrase: "Aquí la gente es súper amable contigo desde el primer día."
    after_phrase: "Aquí el trato es muy afectuoso."
