    title: "El comentario que dolió"
    body: "Rubén supo apenas lo dijo que había ido demasiado lejos. Esa noche llamó a su hermana: «Me disculpo por el comentario, no tenía derecho a decir eso», le dijo, sin agregar ningún pero. Ella se quedó callada un momento, y después le agradeció la llamada."
    before_phrase: "Perdón por lo que dije, no tenía derecho."
    after_phrase: "Me disculpo por lo que dije, no tenía derecho."
