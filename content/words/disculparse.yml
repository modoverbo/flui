  - "par"
  - "se"
stressed_syllable: 3
ipa_latam: "[dis.kulˈpaɾ.se]"
ipa_es: "[dis.kulˈpaɾ.se]"
explanation: "Reconocer ante alguien un error propio, sin buscar razones para defender lo que pasó."
example_sentence: "Rubén se disculpó con su hermana por el comentario, sin agregar ningún pero."
register: "neutral"
pedantry_risk: 1
usage_tip: "Úsalo cuando alguien reconoce un error sin justificarlo, no cuando solo explica lo que pasó."
when_not_to_use: "No lo uses para quien explica su versión sin reconocer nada: disculparse implica reconocer el error, no solo contarlo."
collocations:
  - "disculparse con alguien"
  - "disculparse sin peros"
  - "nunca pidió disculpas"
replaces:
  - before: "Reconoció el error sin poner ninguna excusa"
    after: "Se disculpó sin poner ninguna excusa"
  - before: "Le pidió perdón por lo que había dicho"
    after: "Se disculpó por lo que había dicho"
family:
  - "disculpa"
themes:
  - slug: "empatia-escucha"
    relevance: 3
tags:
