    - "pedir perdón"
    - "reconocer el error"
  funcion:
    - "reparar"
  canal: "ambos"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "justificarse"
    difference: "Justificarse es explicar razones para defender lo que hiciste; disculparse es reconocer que hiciste algo mal, sin buscar excusas."
    memory_trick: "Te justificas para defenderte; te disculpas para reconocer el error."
  - confused_with: "aclaración"
    difference: "Una «aclaración» solo agrega información para evitar un malentendido, sin pedir perdón por nada; disculparse es reconocer que hiciste algo mal."
    memory_trick: "La aclaración informa; disculparse repara."
exercises:
  - position: 1
    sentence: "Rubén se {{blank}} con su hermana por el comentario, sin agregar ningún pero."
    hint_general: "Reconocer ante alguien que le hiciste algo mal, sin buscar excusas para lo que pasó."
    explanation: "Disculpó: reconoció ante alguien que le hizo algo mal, sin excusas. «Justificó» implica dar razones para defenderse, y «descalificó» quita valor a algo; ninguno describe ese gesto."
    options:
      - position: 1
        text: "disculpó"
        is_correct: true
      - position: 2
        text: "justificó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Justificar» implica dar razones para defender lo que hizo, y la frase dice que Rubén no agregó ningún pero, solo reconoció el error."
        hint_specific: "Justificar es dar razones para defenderse. ¿Rubén dio razones o reconoció el error sin peros?"
      - position: 3
        text: "descalificó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Descalificar» implica quitarle valor a algo o a alguien, sin relación con reconocer un error propio ante su hermana."
        hint_specific: "Descalificar quita valor a algo. ¿Rubén quitó valor a algo o reconoció su error?"
