    title: "El retraso de la entrega"
    body: "En vez de armar una lista de razones, la gerenta fue directa en el correo: «Nos disculpamos por el retraso, la responsabilidad es nuestra». El cliente respondió en minutos, sorprendido de no tener que insistir para escuchar eso."
    before_phrase: "Reconocemos que la responsabilidad es nuestra."
    after_phrase: "Nos disculpamos, la responsabilidad es nuestra."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "Los dos días de silencio"
    body: "Ninguno quería dar el primer paso después de la discusión. Al tercer día, Camila lo llamó: «Me quiero disculpar, dije cosas que no pensaba de verdad». Su amigo respiró aliviado: llevaba dos días esperando esa llamada."
    before_phrase: "Quiero pedirte perdón, dije cosas que no pensaba."
    after_phrase: "Me quiero disculpar, dije cosas que no pensaba."
