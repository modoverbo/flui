schema_version: 1
slug: "aclaracion"
status: "approved"
lemma: "aclaración"
part_of_speech: "sustantivo"
syllables:
  - "a"
  - "cla"
  - "ra"
  - "ción"
stressed_syllable: 4
ipa_latam: "[a.kla.ɾaˈsjon]"
ipa_es: "[a.kla.ɾaˈθjon]"
explanation: "Explicación breve que se añade para que no quede duda sobre algo que se dijo o se hizo."
example_sentence: "Antes de responder, quiero hacer una aclaración sobre la cifra que salió en el titular."
register: "neutral"
pedantry_risk: 1
usage_tip: "Úsala para prevenir un malentendido antes de que crezca, no para justificarte después de quedar mal."
when_not_to_use: "No la uses para negar del todo lo que dijiste, ni para pedir perdón por algo distinto."
collocations:
  - "hacer una aclaración"
  - "una pequeña aclaración"
  - "pedir una aclaración"
replaces:
  - before: "Quiero explicar un poco mejor lo que dije"
    after: "Quiero hacer una aclaración sobre lo que dije"
  - before: "Déjame decir algo para que no se entienda mal"
    after: "Déjame hacer una aclaración"
  - before: "Solo para que quede claro"
    after: "Solo una aclaración"
family:
  - "aclarar"
  - "aclaratorio"
themes:
  - slug: "medios-entrevistas"
    relevance: 3
  - slug: "conversaciones-dificiles"
    relevance: 2
tags:
  comodin:
    - "explicar un poco"
  funcion:
    - "precisar"
  canal: "ambos"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "disculpa"
    difference: "«Disculpa» pide perdón por algo que hiciste mal; una aclaración solo añade información para que no haya malentendido, sin asumir ninguna culpa."
    memory_trick: "La disculpa pide perdón; la aclaración solo informa."
  - confused_with: "corrección"
    difference: "«Corrección» dice que algo estaba mal y lo cambia del todo; una aclaración completa lo dicho para que se entienda mejor, sin que estuviera mal."
exercises:
  - position: 1
    sentence: "Antes de seguir con la siguiente pregunta, el candidato pidió hacer una {{blank}}: la cifra del reporte era de todo el sector, no solo de su empresa."
    hint_general: "Busca la palabra para cuando alguien corrige, en pocas palabras, cómo se entendió algo que ya dijo."
    explanation: "Aclaración: corrige cómo se entendió un dato ya dicho. «Declaración» sería anunciar algo nuevo, y aquí solo se precisa un dato, y «explicación» sugiere algo más largo, cuando basta con precisar un punto."
    options:
      - position: 1
        text: "declaración"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Declaración» sería anunciar algo nuevo, y aquí solo está corrigiendo cómo se entendió un dato que ya había dicho."
        hint_specific: "«Declaración» anuncia algo nuevo. ¿El candidato anuncia algo nuevo o corrige un dato que ya dijo?"
      - position: 2
        text: "aclaración"
        is_correct: true
      - position: 3
        text: "explicación"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Explicación» puede ser mucho más larga y general, y aquí solo hace falta precisar un dato puntual que se prestó a confusión."
        hint_specific: "«Explicación» puede alargarse bastante. ¿El candidato necesita contar todo o solo precisar un dato?"
  - position: 2
    sentence: "En el chat del equipo, Octavio escribió una {{blank}} rápida: el correo anterior hablaba del viernes 10, no del jueves 9."
    hint_general: "Piensa en un mensaje corto para corregir un malentendido puntual, sin que sea un aviso oficial."
    explanation: "Aclaración: un mensaje corto para corregir la fecha. «Comunicado» es un aviso oficial y formal, y esto fue un mensaje rápido en el chat, y «confirmación» diría que la fecha anterior era correcta, cuando en realidad estaba mal entendida."
    options:
      - position: 1
        text: "comunicado"
        is_correct: false
        distractor_type: "register"
        why_not: "«Comunicado» es un anuncio oficial y formal, y esto fue solo un mensaje rápido en el chat del equipo para evitar una confusión de fechas."
        hint_specific: "«Comunicado» suena a aviso oficial de una institución. ¿Dónde escribió Octavio su mensaje?"
      - position: 2
        text: "aclaración"
        is_correct: true
      - position: 3
        text: "confirmación"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Confirmación» diría que el dato anterior era correcto, y aquí la fecha estaba mal entendida y había que corregirla."
        hint_specific: "«Confirmación» dice que algo ya estaba bien. ¿La fecha del correo anterior estaba bien o mal entendida?"
  - position: 3
    sentence: "En la sobremesa, Paloma hizo una {{blank}} sobre el chisme que corría: ella nunca dijo que se mudaba, solo que lo estaba pensando."
    hint_general: "Se trata de corregir, en tono relajado, algo que se entendió mal entre amigos."
    explanation: "Aclaración: corrige en tono relajado un malentendido. «Rectificación» suena a un trámite formal, y aquí es una charla de sobremesa, y «disculpa» pide perdón, cuando Paloma no hizo nada malo."
    options:
      - position: 1
        text: "rectificación"
        is_correct: false
        distractor_type: "register"
        why_not: "«Rectificación» suena a un trámite formal o legal, y aquí Paloma solo quiso corregir, entre amigos y en tono relajado, un malentendido de sobremesa."
        hint_specific: "«Rectificación» suena a trámite formal. ¿En qué tono habla Paloma con sus amigos?"
      - position: 2
        text: "disculpa"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Disculpa» pide perdón por algo que hiciste mal, y Paloma no hizo nada malo: solo quiso que quedara claro lo que había dicho en realidad."
        hint_specific: "«Disculpa» pide perdón por un error. ¿Paloma se equivocó en algo?"
      - position: 3
        text: "aclaración"
        is_correct: true
  - position: 4
    sentence: "Cuando su hijo entendió que estaba castigado todo el fin de semana, Emiliano hizo una {{blank}}: el castigo era solo por esa tarde."
    hint_general: "Busca la palabra para cuando alguien corrige cuánto dura algo, sin pedir perdón por nada."
    explanation: "Aclaración: corrige cuánto duraba el castigo. «Disculpa» pide perdón, y Emiliano no se equivocó al ponerlo, y «declaración» anunciaría algo desde cero, cuando solo corrige un malentendido."
    options:
      - position: 1
        text: "disculpa"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Disculpa» pide perdón por algo, y Emiliano no se equivocó al poner el castigo: solo quiso corregir cuánto tiempo iba a durar."
        hint_specific: "«Disculpa» pide perdón por un error. ¿Emiliano se equivocó al castigarlo?"
      - position: 2
        text: "aclaración"
        is_correct: true
      - position: 3
        text: "declaración"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Declaración» sería anunciar algo nuevo desde cero, y aquí Emiliano solo está corrigiendo cómo su hijo entendió el castigo."
        hint_specific: "«Declaración» anuncia algo desde cero. ¿Emiliano anuncia un castigo nuevo o corrige uno que ya existía?"
  - position: 5
    sentence: "El área legal envió una {{blank}} al cliente: la cláusula 4 no aplicaba a los pagos ya realizados."
    hint_general: "Se refiere a explicar, en pocas líneas, a qué parte de un texto aplica una regla."
    explanation: "Aclaración: explica a qué pagos aplicaba la cláusula. «Declaración» sería un anuncio nuevo y formal, y aquí solo se precisa una cláusula existente, y «corrección» diría que el texto estaba mal redactado, cuando el texto era correcto."
    options:
      - position: 1
        text: "declaración"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Declaración» sería un anuncio nuevo y formal, y aquí solo se corrige cómo se debía leer una cláusula que ya existía."
        hint_specific: "«Declaración» anuncia algo nuevo. ¿El área legal anuncia algo nuevo o precisa una cláusula existente?"
      - position: 2
        text: "aclaración"
        is_correct: true
      - position: 3
        text: "corrección"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Corrección» diría que la cláusula estaba mal escrita, y en realidad el texto era correcto: solo hacía falta explicar a qué pagos aplicaba."
        hint_specific: "«Corrección» supone que el texto estaba mal. ¿La cláusula estaba mal escrita?"
  - position: 6
    sentence: "Tras la ola de comentarios, el chef subió un video con una {{blank}}: nunca dijo que la receta llevara mantequilla, sino aceite."
    hint_general: "Busca la palabra para corregir un dato puntual que la gente entendió mal, sin pedir perdón por nada."
    explanation: "Aclaración: corrige el ingrediente que se entendió mal. «Disculpa» pide perdón por un error, y el chef no se equivocó, y «explicación» sugeriría contar todo el proceso, cuando basta con corregir un ingrediente."
    options:
      - position: 1
        text: "disculpa"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Disculpa» pide perdón por un error, y el chef no se equivocó: solo quiso corregir lo que la gente entendió mal de sus palabras."
        hint_specific: "«Disculpa» pide perdón por un error. ¿El chef se equivocó en la receta?"
      - position: 2
        text: "aclaración"
        is_correct: true
      - position: 3
        text: "explicación"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Explicación» podría alargarse contando todo el proceso de la receta, y aquí solo hacía falta corregir un ingrediente mal entendido."
        hint_specific: "«Explicación» puede alargarse mucho. ¿El chef necesita contar todo el proceso o corregir un ingrediente?"
  - position: 7
    sentence: "Antes de que el comentario de la abuela se malinterpretara más, su nieta hizo una {{blank}} en el grupo familiar: no se refería a nadie en particular."
    hint_general: "Piensa en un mensaje corto para que un comentario no se malinterprete más de la cuenta."
    explanation: "Aclaración: corrige a quién se refería el comentario. «Comunicado» suena a un aviso oficial de una institución, y esto es un mensaje familiar, y «corrección» sonaría a que lo que dijo la abuela estaba mal y había que enmendarlo."
    options:
      - position: 1
        text: "comunicado"
        is_correct: false
        distractor_type: "register"
        why_not: "«Comunicado» suena a un aviso oficial de una institución, y aquí es solo un mensaje entre familiares para evitar un malentendido."
        hint_specific: "«Comunicado» suena a aviso institucional. ¿En qué grupo escribió la nieta su mensaje?"
      - position: 2
        text: "aclaración"
        is_correct: true
      - position: 3
        text: "corrección"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Corrección» sonaría a que lo que dijo la abuela estaba mal y había que enmendarlo, y en realidad solo hacía falta explicar a quién no se refería."
        hint_specific: "«Corrección» supone que algo estaba mal dicho. ¿Lo que dijo la abuela estaba mal?"
readings:
  - position: 1
    scene: "entrevista"
    conversation_type: "practica"
    title: "El titular que no era"
    body: "En la rueda de prensa, un periodista leyó una cifra fuera de contexto. El candidato no se alteró: «Antes de seguir, quiero hacer una aclaración: ese número es de todo el sector, no solo de mi empresa». La sala tomó nota y la siguiente pregunta fue distinta."
    before_phrase: "Espera, eso no es exactamente así."
    after_phrase: "Quiero hacer una aclaración antes de seguir."
  - position: 2
    scene: "trabajo"
    conversation_type: "practica"
    title: "Viernes 10, no jueves 9"
    body: "El chat del equipo se llenó de mensajes confundidos sobre la fecha de entrega. Octavio escribió una línea corta: «Una aclaración rápida: el correo hablaba del viernes 10, no del jueves 9». En dos minutos todos volvieron a estar de acuerdo."
    before_phrase: "Ojo, creo que se entendió mal la fecha."
    after_phrase: "Una aclaración rápida antes de que cunda el pánico."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "No era por ti"
    body: "El comentario de la abuela en la cena dejó incómoda a una prima. Antes de que el grupo familiar se llenara de mensajes, su nieta escribió: «Una aclaración: la abuela no se refería a nadie en particular, solo pensaba en voz alta». La prima respondió con un corazón."
    before_phrase: "No creo que lo dijera por ti, en serio."
    after_phrase: "Una aclaración: no se refería a nadie en particular."
