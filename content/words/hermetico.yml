        why_not: "Quien es «reservado» deja adivinar algo aunque hable poco, y de Elías no se adivinó nada en toda la tarde."
        hint_specific: "Del «reservado» se saca algo. ¿Qué se sacó de Elías esa tarde?"
      - position: 2
        text: "hermético"
        is_correct: true
      - position: 3
        text: "distante"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Distante» significaría apartarse del grupo, y él se quedó toda la tarde: lo que no hizo fue enseñar nada suyo."
        hint_specific: "El «distante» se va o se aleja. ¿Elías se fue del grupo?"
  - position: 8
    sentence: "No es antipático: es {{blank}}, y eso da mucho más trabajo de entender que un mal carácter."
    hint_general: "No trata mal a nadie; simplemente no deja ver lo que le pasa."
    explanation: "Hermético: no trata mal, no deja ver nada. «Esotérico» se dice de un saber para iniciados, y «callado» sería solo hablar poco."
    options:
      - position: 1
        text: "esotérico"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Esotérico» se dice de lo que solo entienden unos iniciados, como una doctrina cerrada, y aquí se habla del carácter de alguien."
        hint_specific: "«Esotérico» pertenece a textos y doctrinas. ¿De qué trata esta frase?"
