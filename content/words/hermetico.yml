confusions:
  - confused_with: "reservado"
    difference: "Quien es «reservado» habla poco por discreción, pero se le nota cómo está; la otra palabra dice que no se le nota nada."
    memory_trick: "Al reservado se le adivina; al otro, no."
  - confused_with: "distante"
    difference: "Quien es «distante» pone espacio con los demás; la otra palabra puede estar muy al lado y aun así no dejar ver nada."
    memory_trick: "El distante se aleja; el otro se queda y se cierra."
exercises:
  - position: 1
    sentence: "Damián le cuenta su vida entera a quien pregunte; su hermano, en cambio, es {{blank}} hasta con su madre."
    hint_general: "Con nadie, ni con su madre, deja ver lo que piensa o lo que siente."
    explanation: "Hermético: no deja ver nada ni con su madre. «Esotérico» se dice de lo que solo entienden unos iniciados, y «reservado» aún deja adivinar el ánimo."
    options:
      - position: 1
        text: "esotérico"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Esotérico» se dice de lo que solo entienden unos pocos iniciados, como un texto oscuro, y aquí se habla de una persona que no se abre."
        hint_specific: "«Esotérico» supone un saber secreto para unos pocos. ¿Hay algún grupo que sí lo entienda a él?"
      - position: 2
        text: "hermético"
        is_correct: true
      - position: 3
        text: "reservado"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Quien es «reservado» habla poco por discreción y aun así se le nota cómo está, y de este hermano no se nota absolutamente nada."
        hint_specific: "Al «reservado» se le adivina el ánimo. ¿Se le adivina algo a este hermano?"
  - position: 2
    sentence: "La cara de Iker se volvió {{blank}} en cuanto salió el tema del dinero, y nadie supo qué estaba pensando."
    hint_general: "Su cara dejó de mostrar cualquier cosa de lo que le pasaba por dentro."
    explanation: "Hermética: su cara deja de mostrar nada. «Seca» acusaría de contestar con brusquedad, y «distante» pondría espacio, y él sigue sentado ahí."
    options:
      - position: 1
        text: "seca"
        is_correct: false
        distractor_type: "register"
        why_not: "«Seca» es coloquial y acusa de contestar con brusquedad, y él ni siquiera contesta mal: simplemente no deja ver nada."
        hint_specific: "«Seca» supone una respuesta cortante. ¿Iker responde mal o no responde nada?"
      - position: 2
        text: "hermética"
        is_correct: true
      - position: 3
        text: "distante"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Distante» pone espacio con los demás, y él sigue en la mesa con todos: lo que desaparece es lo que se le leía en la cara."
        hint_specific: "El «distante» se aparta. ¿Iker se aparta o se queda?"
  - position: 3
    sentence: "Aurelio es cariñoso y está siempre, pero con lo suyo es {{blank}}: nadie ha sabido nunca si duerme por las noches."
    hint_general: "Está presente y es afectuoso, y aun así no deja ver nada de lo suyo."
    explanation: "Hermético: está presente y no deja ver nada suyo. «Distante» pondría espacio, y él está siempre, y «esotérico» se dice de un saber para iniciados."
    options:
      - position: 1
        text: "distante"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Distante» pondría espacio con la gente, y la frase dice justo lo contrario: es cariñoso y está siempre."
        hint_specific: "El «distante» se mantiene lejos. Relee el principio: ¿está lejos Aurelio?"
      - position: 2
        text: "hermético"
        is_correct: true
      - position: 3
        text: "esotérico"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Esotérico» se dice de un saber reservado a iniciados, y aquí no hay ningún saber: hay una persona que no cuenta cómo está."
        hint_specific: "«Esotérico» habla de doctrinas y textos. ¿De qué habla esta frase, de un texto o de alguien?"
  - position: 4
    sentence: "La empresa se puso {{blank}} con el traslado y la plantilla acabó enterándose por un correo de tres líneas."
    hint_general: "La empresa no dejó ver nada de lo que estaba decidiendo."
    explanation: "Hermética: no deja ver nada de lo que decide. «Impenetrable» es una palabra grande, de fortaleza o de selva, y «callada» diría que no habló, y sí hubo correo."
    options:
      - position: 1
        text: "impenetrable"
        is_correct: false
        distractor_type: "register"
        why_not: "«Impenetrable» es una palabra grande, propia de una fortaleza o de una selva, y aquí se habla de una empresa que no cuenta un traslado."
        hint_specific: "«Impenetrable» suena a muralla. ¿Encaja ese tamaño con un correo de tres líneas?"
      - position: 2
        text: "hermética"
        is_correct: true
      - position: 3
        text: "callada"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Callada» diría que no dijo nada, y la empresa sí habló: mandó un correo que no dejaba ver nada de lo importante."
        hint_specific: "«Callada» es no decir ni una palabra. ¿Hubo comunicación o silencio total?"
  - position: 5
    sentence: "Su padre fue {{blank}} toda la vida, y solo a los ochenta empezó a contar cosas de cuando era niño."
    hint_general: "Durante décadas no dejó ver nada de lo suyo, hasta muy mayor."
    explanation: "Hermético: durante décadas no dejó ver nada. «Seco» acusaría de trato brusco, y «reservado» deja ver el ánimo aunque hable poco."
    options:
      - position: 1
        text: "hermético"
        is_correct: true
      - position: 2
        text: "seco"
        is_correct: false
        distractor_type: "register"
        why_not: "«Seco» es coloquial y acusa de un trato brusco, y de este padre no se dice que tratara mal a nadie: se dice que no contaba nada."
        hint_specific: "«Seco» describe malos modos. ¿La frase habla de modos o de lo que no se sabía de él?"
      - position: 3
        text: "reservado"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "Quien es «reservado» habla poco y aun así se le nota cómo está, y de él no se supo nada durante ochenta años."
        hint_specific: "Del «reservado» se intuye el estado de ánimo. ¿Se intuía algo de este padre?"
  - position: 6
    sentence: "Rebeca tiene cara de piedra: en la negociación se puso {{blank}} y la otra parte acabó hablando de más."
    hint_general: "No dejó leer nada en su cara y el otro llenó el vacío hablando."
    explanation: "Hermética: no deja leer nada y el otro habla de más. «Callada» diría que no habló, y sí habló, e «impenetrable» es una palabra de fortaleza."
    options:
      - position: 1
        text: "callada"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Callada» diría que no abrió la boca, y ella negocia y habla: lo que no enseña es qué piensa de cada oferta."
        hint_specific: "«Callada» es no hablar nada. ¿Rebeca está muda en esa mesa?"
      - position: 2
        text: "impenetrable"
        is_correct: false
        distractor_type: "register"
        why_not: "«Impenetrable» es una palabra de muralla y de selva cerrada, y aquí se describe a alguien sentado en una mesa de reuniones."
        hint_specific: "«Impenetrable» pide un tamaño enorme. ¿De qué tamaño es lo que se describe?"
      - position: 3
        text: "hermética"
        is_correct: true
  - position: 7
    sentence: "El grupo entero se abrió aquella tarde menos Elías, que siguió tan {{blank}} como el primer día."
    hint_general: "Todos dejaron ver algo suyo; él siguió sin mostrar nada."
    explanation: "Hermético: sigue sin mostrar nada mientras el resto se abre. «Reservado» aún dejaría adivinar algo, y «distante» significaría apartarse del grupo."
    options:
      - position: 1
        text: "reservado"
        is_correct: false
