readings:
  - position: 1
    scene: "familia"
    conversation_type: "emocional"
    title: "A los ochenta"
    body: "Su padre nunca contó nada de cuando era niño. A los ochenta empezó, de pronto, una tarde cualquiera. «Toda la vida fue hermético y ahora no para», le dijo Vera a su hermana. Escucharon tres horas y apuntaron nombres para no perderlos."
    before_phrase: "Papá nunca ha contado nada de nada."
    after_phrase: "Toda la vida fue hermético, y ahora habla."
  - position: 2
    scene: "trabajo"
    conversation_type: "practica"
    title: "El correo de tres líneas"
    body: "El traslado se anunció un viernes en tres líneas. En el café, alguien lo dijo en voz alta: «No es que nos oculten algo malo; es que la empresa se ha vuelto hermética». El lunes pidieron una reunión y la tuvieron."
    before_phrase: "Aquí nunca se entera nadie de nada."
    after_phrase: "La empresa se ha vuelto hermética."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "La tarde del grupo"
    body: "Aquella tarde todos contaron algo difícil, menos Elías. Nadie lo forzó. Al despedirse, una amiga le dijo bajito: «Eres hermético y aquí nadie te va a obligar; cuando quieras, estamos». Él asintió y volvió el mes siguiente."
    before_phrase: "Tú nunca cuentas nada, ¿eh?"
    after_phrase: "Eres hermético, y aquí nadie te obliga."
