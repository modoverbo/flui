explanation: "Que acepta ideas o costumbres distintas a las suyas, sin pelear ni querer cambiar a nadie."
example_sentence: "Aunque no comparte esa forma de criar a los hijos, es lo bastante tolerante como para no opinar sin que se lo pidan."
register: "neutral"
pedantry_risk: 1
usage_tip: "Sirve tanto para diferencias de opinión como para costumbres distintas, sin sonar a que finges estar de acuerdo."
when_not_to_use: "No la uses para quien acepta cualquier cosa sin límites: ser tolerante no es dejar que te falten el respeto."
collocations:
