    difference: "«Tolerable» describe algo que se puede soportar, como un dolor o una espera; «tolerante» describe a una persona que acepta diferencias sin pelear. Uno califica una cosa, el otro a alguien."
    memory_trick: "Algo es tolerable; alguien es tolerante."
