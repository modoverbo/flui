  - before: "Ella deja que cada uno piense diferente sin pelear por eso"
    after: "Ella es tolerante con las diferencias de opinión"
  - before: "No le importa que hagan las cosas distinto a como las haría él"
    after: "Es tolerante con que hagan las cosas distinto"
family: ["tolerancia", "tolerar"]
themes:
