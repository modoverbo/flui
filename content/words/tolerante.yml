    body: "En el equipo de Renato convivían dos formas muy distintas de trabajar: unos preferían planear todo, otros improvisaban sobre la marcha. En vez de imponer un solo método, Renato dejó que cada quien encontrara su ritmo, siempre que se cumplieran los plazos. El equipo terminó el proyecto antes de tiempo."
