    conversation_type: "practica"
    title: "Qué sabes hacer"
    body: "Le preguntaron qué aportaba, además de la parte técnica. Greta no dudó: «Hago divulgación: lo mío lo entiende quien entra hoy por esa puerta». Le pidieron un ejemplo y lo dio en dos minutos, sin una sola fórmula."
    before_phrase: "Se me da bien explicar cosas difíciles."
    after_phrase: "Hago divulgación: lo entiende quien entra hoy."
