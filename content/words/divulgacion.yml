    body: "Su sobrino estudia biología y contesta con palabras que nadie sigue. Aquel domingo probó otra cosa: explicó su trabajo con una caja de fruta. «Esto es divulgación, tía». Su tía le dijo que ahora sí sabía a qué se dedicaba."
    before_phrase: "Te lo cuento fácil para que te enteres."
    after_phrase: "Esto es divulgación: lo mismo, contado para ti."
