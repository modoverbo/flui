confusions:
  - confused_with: "divagación"
    difference: "Una «divagación» es irse por las ramas y perder el hilo; la otra palabra nombra el trabajo de ordenar lo difícil para que llegue."
    memory_trick: "Quien divaga se pierde; el otro te guía."
  - confused_with: "difusión"
    difference: "La «difusión» es hacer que algo llegue a mucha gente tal como está; la otra cambia cómo se cuenta para que se entienda."
    memory_trick: "La difusión reparte; la otra traduce."
exercises:
  - position: 1
    sentence: "Omar dejó el laboratorio para dedicarse a la {{blank}}, y hoy cuenta en la radio lo que antes leían diez personas."
    hint_general: "Cambió de trabajo: ahora traduce lo difícil para quien no está dentro del campo."
    explanation: "Divulgación: traduce lo difícil para quien está fuera. Una «divagación» sería irse por las ramas, y la «difusión» solo reparte lo mismo sin cambiar el modo."
