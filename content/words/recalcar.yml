confusions:
  - confused_with: "recargar"
    difference: "«Recargar» es volver a llenar algo o ponerle demasiado encima; la otra palabra le da relieve a una idea, no peso."
    memory_trick: "Recargas una batería; destacas una idea."
  - confused_with: "reprochar"
    difference: "«Reprochar» echa algo en cara a una persona; la otra palabra solo insiste en una idea."
    memory_trick: "El reproche mira a la persona; la insistencia mira a la idea."
  - confused_with: "puntualizar"
    difference: "«Puntualizar» añade un detalle preciso que faltaba en lo dicho; esta palabra insiste con fuerza en algo que ya se dijo, para que no se olvide."
    memory_trick: "Puntualizas lo que faltaba; destacas lo que ya sabían."
