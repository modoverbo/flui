  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "fama"
    difference: "«Fama» implica que la gente admira o sigue con gusto a alguien; la notoriedad solo dice que muchos lo conocen, sin juzgar si les gusta."
    memory_trick: "La fama se disfruta; la notoriedad solo se nota."
  - confused_with: "reputación"
    difference: "«Reputación» es la opinión, buena o mala, que la gente forma de alguien con el tiempo; esta palabra solo dice que mucha gente lo conoce, sea cual sea esa opinión."
exercises:
  - position: 1
    sentence: "Renata llevaba años como abogada discreta, pero el caso que ganó le dio una {{blank}} que no esperaba, aunque no todos hablaban bien de su forma de litigar."
    hint_general: "Piensa en la palabra para cuando mucha gente empieza a conocerte de golpe, sin que eso signifique que hablan bien de ti."
    explanation: "Notoriedad: mucha gente empezó a conocerla, aunque no todos opinaran bien. «Notaría» nombra una oficina, no un efecto sobre una persona, y «fama» suele implicar que la gente habla bien de alguien, justo lo contrario de lo que dice la frase."
    options:
      - position: 1
        text: "notaría"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Notaría» nombra la oficina donde trabaja un notario, y aquí no se habla de un lugar, sino de que mucha gente empezó a conocerla."
        hint_specific: "«Notaría» es un lugar de trámites. ¿La frase habla de un sitio o de cómo la empezaron a conocer?"
      - position: 2
        text: "notoriedad"
        is_correct: true
      - position: 3
        text: "fama"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Fama» suele implicar que la gente habla bien de alguien, y la frase aclara que no todos hablaban bien de su forma de litigar."
        hint_specific: "«Fama» suena a elogio general. ¿La frase dice que todos hablaban bien de Renata?"
  - position: 2
    sentence: "Ezequiel subió un video sin mayor plan y, de un día para otro, tenía tanta {{blank}} que hasta gente que nunca lo había escuchado opinaba de él en los comentarios."
    hint_general: "Busca la palabra para cuando muchos empiezan a hablar de alguien de repente, sin que lo hayan promocionado a propósito."
    explanation: "Notoriedad: de repente mucha gente hablaba de él. «Popularidad» implica que le tienen cariño, y aquí solo opinan de él, y «bombo» es coloquial y supone una promoción a propósito que nadie hizo."
    options:
      - position: 1
        text: "popularidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Popularidad» implica que la gente lo quiere o lo sigue con gusto, y aquí muchos solo opinaban de él sin que eso significara que les cayera bien."
        hint_specific: "«Popularidad» suena a que le tienen cariño. ¿La frase dice que le caía bien a todos?"
      - position: 2
        text: "notoriedad"
        is_correct: true
      - position: 3
        text: "bombo"
        is_correct: false
        distractor_type: "register"
        why_not: "«Bombo» es coloquial y describe una promoción activa que alguien hace a propósito, y el video de Ezequiel se hizo conocido sin que nadie lo empujara."
        hint_specific: "«Bombo» supone que alguien promociona algo a propósito. ¿Quién empujó ese video?"
  - position: 3
    sentence: "Cuando la tormenta dejó a la familia varada, Marisol salió con su camioneta a rescatarlos, y de la noche a la mañana el barrio entero hablaba de su {{blank}}."
    hint_general: "Se trata de que mucha gente conozca a alguien de un día para otro, después de algo que hizo."
    explanation: "Notoriedad: de un día para otro todo el barrio la conocía. «Renombre» se gana con años, y esto pasó en una noche, y «reputación» es la opinión que ya tenían de ella, no que ahora la conozcan más."
    options:
      - position: 1
        text: "renombre"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Renombre» se gana con años de trayectoria reconocida, y lo de Marisol pasó en una sola noche."
        hint_specific: "«Renombre» toma años en construirse. ¿Cuánto tiempo pasó desde la tormenta hasta que todos hablaban de ella?"
      - position: 2
        text: "reputación"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Reputación» es la opinión acumulada sobre alguien con el tiempo, y lo que cambió de golpe fue que todo el barrio empezó a conocerla, no la opinión que ya tenían de ella."
        hint_specific: "«Reputación» habla de una opinión que ya existía. ¿Qué es lo nuevo que pasó esa noche?"
      - position: 3
        text: "notoriedad"
        is_correct: true
  - position: 4
    sentence: "Ignacio prefería el anonimato de su taller, pero una entrevista mal editada le dio una {{blank}} que tardó meses en manejar frente a sus clientes."
    hint_general: "Apunta a lo que le pasa a alguien cuando, de repente, mucha gente empieza a hablar de él."
    explanation: "Notoriedad: de repente mucha gente hablaba de él y le costó manejarlo. «Fama» sonaría a un reconocimiento que él disfrutaba, y aquí prefería el anonimato, y «visibilidad» solo diría que lo veían más, sin explicar por qué le costó tanto."
    options:
      - position: 1
        text: "fama"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Fama» sonaría a un reconocimiento que él buscó o disfrutó, y la frase dice que prefería el anonimato y que le costó manejar lo que pasó."
        hint_specific: "«Fama» suena a algo que se disfruta. ¿Ignacio disfrutaba lo que le pasó?"
      - position: 2
        text: "notoriedad"
        is_correct: true
      - position: 3
        text: "visibilidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Visibilidad» es solo que la gente lo encuentre o lo vea, y aquí el problema no fue que lo vieran, sino cómo hablaban de él tras la entrevista mal editada."
        hint_specific: "«Visibilidad» solo habla de que te encuentren. ¿El problema de Ignacio era que lo vieran o cómo hablaban de él?"
  - position: 5
    sentence: "Dalia no buscaba destacar en el gremio, pero ganó tanta {{blank}} tras el escándalo del contrato que hasta proveedores que nunca la habían llamado empezaron a preguntar por ella."
    hint_general: "Busca la palabra para cuando algo hace que mucha más gente sepa quién eres, sin que se hable de si les cae bien."
    explanation: "Notoriedad: más gente supo quién era ella. «Reputación» sería la opinión que se formaron, y la frase no dice si piensan bien o mal, y «cartel» es coloquial y suena a rumor informal, cuando aquí se enteró el gremio entero."
    options:
      - position: 1
        text: "reputación"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Reputación» sería la opinión que se formaron de ella, y la frase solo cuenta que ahora más gente sabe quién es, sin decir si piensan bien o mal."
        hint_specific: "«Reputación» juzga si piensan bien o mal de ti. ¿La frase dice qué opinan de Dalia?"
      - position: 2
        text: "notoriedad"
        is_correct: true
      - position: 3
        text: "cartel"
        is_correct: false
        distractor_type: "register"
        why_not: "«Cartel» es una expresión coloquial para la fama que corre de boca en boca en un ambiente cerrado, y aquí se habla de un escándalo que llegó a todo el gremio, en un tono más serio."
        hint_specific: "«Cartel» suena a rumor entre pocos. ¿A cuánta gente del gremio llegó lo de Dalia?"
  - position: 6
    sentence: "Rubén jamás pensó que su receta familiar de tamales fuera a darle tanta {{blank}} en el pueblo, con filas de gente que ni conocía tocando su puerta cada domingo."
    hint_general: "Piensa en que, de pronto, mucha gente sabe de ti por algo puntual que hiciste."
    explanation: "Notoriedad: de pronto mucha gente sabía de sus tamales. «Renombre» se construye con años, y esto pasó de un domingo a otro, y «reputación» habla de si opinan bien o mal, no de que ahora lo conozcan más."
    options:
      - position: 1
        text: "renombre"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Renombre» se construye con años de trayectoria conocida, y la receta de Rubén se hizo conocida de un domingo a otro."
        hint_specific: "«Renombre» necesita años para construirse. ¿Cuánto tardó Rubén en tener filas en la puerta?"
      - position: 2
        text: "notoriedad"
        is_correct: true
      - position: 3
        text: "reputación"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Reputación» habla de si la gente opina bien o mal, y la frase solo cuenta que ahora más gente sabe de sus tamales, sin juzgar si le gustan a todos."
        hint_specific: "«Reputación» juzga si algo gusta o no. ¿La frase dice si a la gente le gustan los tamales?"
  - position: 7
    sentence: "Constanza ganó la medalla y, al bajar del podio, tuvo que aprender a manejar una {{blank}} que la seguía hasta en el supermercado."
    hint_general: "Se refiere a que la gente te reconozca en cualquier lado después de un logro puntual."
    explanation: "Notoriedad: la reconocían en cualquier lado después de la medalla. «Popularidad» diría que la gente la sigue con gusto, y aquí solo se habla de que la reconocen, y «visibilidad» describe que algo se encuentra fácil, no que la reconozcan en persona."
    options:
      - position: 1
        text: "popularidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Popularidad» diría que la gente la quiere seguir por gusto, y la frase solo cuenta que la reconocen hasta en el supermercado, sin hablar de simpatía."
        hint_specific: "«Popularidad» suena a que la siguen con cariño. ¿La frase habla de cariño o de que la reconocen?"
      - position: 2
        text: "notoriedad"
        is_correct: true
      - position: 3
        text: "visibilidad"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Visibilidad» describe que algo se puede encontrar o ver fácilmente, y aquí el problema de Constanza es que la reconocen en persona, en la calle, no que su perfil aparezca más."
        hint_specific: "«Visibilidad» habla de encontrar algo en línea. ¿Dónde la reconocen a Constanza?"
  - position: 8
    sentence: "Bruno diseñó el edificio pensando solo en resolver el problema del terreno, pero la fachada llamó tanto la atención que le trajo una {{blank}} que ni sus socios esperaban."
    hint_general: "Busca la palabra para cuando algo hace que muchos más se fijen en ti, sin que eso diga si les gustó."
    explanation: "Notoriedad: muchos más se fijaron en el estudio de Bruno. «Fama» sonaría a que todos elogian el edificio, y la frase no dice si les gustó, y «reputación» es la opinión ya formada sobre el estudio, no que ahora los conozcan más."
    options:
      - position: 1
        text: "fama"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Fama» sonaría a que todos elogian el edificio, y la frase no dice si les gustó, solo que llamó mucho la atención."
        hint_specific: "«Fama» suena a elogio. ¿La frase dice si el edificio gustó?"
      - position: 2
        text: "notoriedad"
        is_correct: true
      - position: 3
        text: "reputación"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Reputación» sería la opinión ya formada sobre el estudio de Bruno, y lo nuevo aquí es que de pronto muchos más los conocen, no que cambiara la opinión sobre ellos."
        hint_specific: "«Reputación» es una opinión que ya existía. ¿Qué es lo nuevo que pasó con la fachada?"
readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "El caso que la puso en el mapa"
    body: "Después de ganar el caso, Renata empezó a recibir llamadas de clientes que jamás había conocido. «No busqué esto», le dijo a su socio, «pero ahora toca aprender a manejar la notoriedad sin que se me suba a la cabeza»."
    before_phrase: "De golpe todo el mundo sabe quién soy."
    after_phrase: "Toca aprender a manejar la notoriedad."
  - position: 2
    scene: "entrevista"
    conversation_type: "social"
    title: "La medalla y el supermercado"
    body: "En la entrevista tras los juegos, le preguntaron a Constanza cómo llevaba que la reconocieran en la calle. «La notoriedad llegó más rápido que la medalla», contestó riendo, «todavía me sorprende que alguien me pida una foto en la fila del pan»."
    before_phrase: "Ahora todo el mundo me reconoce por la calle."
    after_phrase: "La notoriedad llegó más rápido que la medalla."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "La receta que se volvió noticia"
    body: "Cuando la fila de gente llegó hasta la esquina, la hermana de Rubén se preocupó: «¿Y si esto te complica la vida?». Él se encogió de hombros: «La notoriedad se me fue de las manos, pero al menos es por algo que hago con cariño»."
    before_phrase: "Ahora todo el barrio sabe quién soy por los tamales."
    after_phrase: "La notoriedad se me fue de las manos, pero es por algo que hago con cariño."
