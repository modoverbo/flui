    after: "Ganó mucha notoriedad de golpe"
  - before: "Ahora todo el mundo sabe quién es"
    after: "Ahora tiene bastante notoriedad"
  - before: "Eso lo puso en el radar de todos"
    after: "Eso le dio notoriedad"
family:
  - "notorio"
  - "notoriamente"
themes:
