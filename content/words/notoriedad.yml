  - "dad"
stressed_syllable: 4
ipa_latam: "[no.to.ɾjeˈðad]"
ipa_es: "[no.to.ɾjeˈðad]"
explanation: "Ser conocido por mucha gente, para bien o para mal, después de algo que llamó la atención."
example_sentence: "Después de la entrevista que se compartió tanto, su notoriedad creció más de lo que esperaba."
register: "neutral"
pedantry_risk: 1
usage_tip: "Sirve para hablar del efecto de hacerse conocido, no de un elogio: puede llegar rápido y también desvanecerse igual de rápido."
when_not_to_use: "No la uses para elogiar el talento de alguien, ni como si fuera lo mismo que una buena reputación ganada con años."
collocations:
  - "ganar notoriedad"
  - "la notoriedad de alguien"
  - "notoriedad pública"
replaces:
