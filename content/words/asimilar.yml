    body: "El responsable preguntó si ya manejaba la herramienta nueva. Renzo no dijo que sí por quedar bien. «La entiendo, todavía no la asimilo. Dame dos semanas y te la explico yo a ti». Las tuvo, y al final del mes formaba a los que entraban."
    before_phrase: "Sí, sí, más o menos ya me hago con ello."
    after_phrase: "La entiendo, todavía no la asimilo."
