confusions:
  - confused_with: "disimular"
    difference: "«Disimular» es esconder lo que sientes o lo que sabes; la otra palabra es hacer propio lo aprendido."
    memory_trick: "Quien disimula tapa; el otro incorpora."
  - confused_with: "retener"
    difference: "«Retener» es guardar algo en la memoria tal cual llegó; la otra palabra supone que ya lo usas a tu manera."
    memory_trick: "Retienes lo que recuerdas; lo otro ya te sale solo."
exercises:
  - position: 1
    sentence: "Le cambiaron el sistema entero un viernes, y Selena todavía no {{blank}} que el papel desapareció del proceso."
    hint_general: "Le falta hacer suyo el cambio, no esconderlo ni recordarlo."
    explanation: "Asimila: todavía no ha hecho suyo el cambio. «Disimula» sería esconderlo, y «retiene» sería recordarlo, que no es el problema aquí."
    options:
      - position: 1
        text: "disimula"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Disimular» es esconder algo delante de los demás, y a Selena no le pasa eso: le pasa que el cambio aún no le sale solo."
        hint_specific: "«Disimular» supone ocultar algo a propósito. ¿Selena esconde el cambio o todavía se le resiste?"
      - position: 2
        text: "asimila"
        is_correct: true
      - position: 3
        text: "retiene"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Retener» es guardar un dato en la memoria, y el problema no es que lo olvide: es que todavía no lo maneja."
        hint_specific: "«Retener» va de memoria. ¿Se le olvida el cambio o aún no le sale natural?"
  - position: 2
    sentence: "Después de tres semanas, Ismael ya {{blank}} el horario nuevo y ni lo piensa al salir de casa."
    hint_general: "El horario nuevo ya es suyo: le sale sin darle vueltas."
    explanation: "Asimiló: el horario ya le sale sin pensar. «Tragó» sería aguantarlo a disgusto, y «disimuló» sería ocultarlo a los demás."
    options:
      - position: 1
        text: "tragó"
        is_correct: false
        distractor_type: "register"
        why_not: "«Tragar» es muy coloquial y acusa de aguantar algo a disgusto, y a Ismael el horario ya ni le pesa."
        hint_specific: "«Tragar» supone resignación. ¿La frase lo muestra resignado o cómodo?"
      - position: 2
        text: "asimiló"
        is_correct: true
      - position: 3
        text: "disimuló"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Disimular» sería fingir delante de otros, y aquí no hay nadie a quien ocultarle nada: sale de casa sin pensarlo."
        hint_specific: "«Disimular» necesita público. ¿Delante de quién estaría fingiendo Ismael?"
  - position: 3
    sentence: "Tras el primer mes, Leandro {{blank}} la forma de trabajar del equipo y empezó a proponer mejoras propias."
    hint_general: "La forma de trabajar ya es suya, tanto que la mueve y la mejora."
    explanation: "Asimiló: la forma de trabajar ya es suya y la mejora. «Copió» sería repetirla igual, y «disimuló» sería esconder algo delante del equipo."
    options:
      - position: 1
        text: "copió"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Copiar» es repetir algo tal cual, y Leandro no repite: propone mejoras que antes no existían."
        hint_specific: "«Copiar» deja las cosas igual. ¿Leandro deja el método igual o lo mueve?"
      - position: 2
        text: "asimiló"
        is_correct: true
      - position: 3
        text: "disimuló"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Disimular» sería ocultarle algo al equipo, y aquí no oculta nada: propone cambios en voz alta."
        hint_specific: "«Disimular» es tapar. ¿Leandro tapa algo o pone ideas sobre la mesa?"
  - position: 4
    sentence: "Mi hermana tardó un año en {{blank}} que la casa del pueblo ya no es nuestra, y ahora habla de ella sin que le pese."
    hint_general: "Un año le costó hacer suya esa idea hasta poder hablar de ella con calma."
    explanation: "Asimilar: hizo suya la idea hasta hablar de ella con calma. «Repetir» sería decirlo una y otra vez, y «disimular» sería fingir que no ha pasado."
    options:
      - position: 1
        text: "repetir"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Repetir» es decir lo mismo una y otra vez, y lo que le costó un año no fue decirlo: fue que dejara de doler."
        hint_specific: "«Repetir» se hace con la boca. ¿Lo que tardó un año fue decirlo o aceptarlo?"
      - position: 2
        text: "asimilar"
        is_correct: true
      - position: 3
        text: "disimular"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Disimular» sería fingir que la casa sigue siendo nuestra, y ella habla del tema abiertamente."
        hint_specific: "«Disimular» es aparentar. ¿Ella aparenta algo o habla del tema sin rodeos?"
  - position: 5
    sentence: "Las críticas Hugo las apunta y las repite en voz alta, pero no {{blank}} ninguna: sigue trabajando exactamente igual."
    hint_general: "Las tiene anotadas y las dice, pero ninguna ha pasado a formar parte de su manera de trabajar."
    explanation: "Asimila: ninguna crítica ha pasado a su manera de trabajar. «Traga» acusa de aguantarlas a disgusto, y «retiene» falla porque las tiene anotadas."
    options:
      - position: 1
        text: "traga"
        is_correct: false
        distractor_type: "register"
        why_not: "«Tragar» es muy coloquial y significa aguantar algo a disgusto, y Hugo las escucha y las repite sin protestar."
        hint_specific: "«Tragar» supone que algo le sienta mal. ¿Hugo protesta o simplemente sigue igual?"
      - position: 2
        text: "asimila"
        is_correct: true
      - position: 3
        text: "retiene"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Retener» es guardarlas en la memoria, y las tiene anotadas y las repite: recordarlas no es su problema."
        hint_specific: "«Retener» es acordarse. Relee: ¿se le olvidan las críticas a Hugo?"
  - position: 6
    sentence: "Cuando por fin {{blank}} el motivo del cambio, Berta pudo explicárselo a su equipo mejor que nadie."
    hint_general: "Lo hizo tan suyo que pudo contarlo con sus propias palabras a otras personas."
    explanation: "Asimiló: lo hizo tan suyo que puede explicarlo mejor que nadie. «Tragó» sería aceptarlo a regañadientes, y «repitió» sería soltarlo tal cual se lo dijeron."
    options:
      - position: 1
        text: "asimiló"
        is_correct: true
      - position: 2
        text: "tragó"
        is_correct: false
        distractor_type: "register"
        why_not: "«Tragar» es coloquial y significa aceptar algo a regañadientes, y quien acepta a regañadientes no lo explica mejor que nadie."
        hint_specific: "«Tragar» deja a alguien conforme, no convencido. ¿Berta se resigna o domina el motivo?"
      - position: 3
        text: "repitió"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Repetir» es soltar el motivo tal cual se lo dijeron, y ella lo cuenta con palabras propias y mejor que la fuente."
        hint_specific: "«Repetir» no añade nada. ¿Berta devuelve lo mismo o lo mejora al contarlo?"
