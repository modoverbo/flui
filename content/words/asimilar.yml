    title: "La casa del pueblo"
    body: "Vendieron la casa en marzo y su hermana no volvió a nombrarla. En agosto, de pronto, contó una historia de aquel verano y se rio. «Creo que por fin lo asimilé», dijo. Nadie añadió nada; la conversación siguió sola."
    before_phrase: "Ya me voy haciendo a la idea, supongo."
    after_phrase: "Creo que por fin lo asimilé."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "Café de los jueves"
    body: "Cintia llevaba un mes en el club de lectura y hablaba poco. El jueves interrumpió dos veces. «Perdón, es que ya asimilé cómo funciona esto y quiero discutirlo todo». El grupo se rio y le guardaron el turno."
    before_phrase: "Ya me voy enterando de cómo va esto."
    after_phrase: "Ya asimilé cómo funciona esto."
