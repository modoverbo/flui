confusions:
  - confused_with: "ambivalente"
    difference: "«Ambivalente» describe a quien siente dos cosas a la vez; la otra palabra describe un texto que admite dos lecturas."
    memory_trick: "Lo ambivalente pasa dentro de una persona; las dos lecturas pasan dentro de la frase."
  - confused_with: "impreciso"
    difference: "«Impreciso» es que falta detalle; la otra palabra es que hay dos caminos igual de válidos."
    memory_trick: "Lo impreciso se queda corto; lo otro se abre en dos."
exercises:
  - position: 1
    sentence: "El «lo miramos pronto» de la respuesta era tan {{blank}} que medio equipo lo entendió como un sí."
    hint_general: "La misma frase deja dos lecturas posibles y cada uno elige una."
    explanation: "Ambiguo: la frase deja dos lecturas. «Ambicioso» describe a quien quiere llegar lejos, y «rarísimo» es coloquial y solo dice que suena extraño."
    options:
      - position: 1
        text: "ambicioso"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Ambicioso» describe a quien quiere llegar muy lejos, y aquí el problema es que la respuesta admitía dos lecturas."
        hint_specific: "«Ambicioso» habla de querer mucho. ¿Qué pasó con la mitad del equipo?"
      - position: 2
        text: "ambiguo"
        is_correct: true
      - position: 3
        text: "rarísimo"
        is_correct: false
        distractor_type: "register"
        why_not: "«Rarísimo» es coloquial y solo dice que algo suena extraño, sin explicar que había dos lecturas."
        hint_specific: "«Rarísimo» se queda en la extrañeza. ¿Por qué se dividió el equipo?"
  - position: 2
