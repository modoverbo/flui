readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "El viernes de quién"
    body: "«Lo tenemos para final de semana», decía el correo. El cliente entendió viernes; el equipo, domingo. Cuando estalló, Otilia lo dijo sin culpar a nadie: «El plazo era ambiguo». Desde entonces escriben la fecha y la hora, y no ha vuelto a pasar."
    before_phrase: "Es que cada uno entendió una cosa."
    after_phrase: "El plazo era ambiguo."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "«Como quieras»"
    body: "Casandra llevaba años respondiendo «como quieras» y enfadándose después. Su pareja se lo dijo con cariño: «Tu respuesta es ambigua, y yo elijo mal la mitad de las veces». Ahora dice lo que prefiere, y discuten mucho menos."
    before_phrase: "Yo dije que como quisieras, no me entendiste."
    after_phrase: "Mi respuesta fue ambigua."
  - position: 3
    scene: "entrevista"
    conversation_type: "practica"
    title: "«Habrá flexibilidad»"
    body: "Al hablar del horario le dijeron que habría flexibilidad. Ámbar sonrió y preguntó: «Eso puede ser ambiguo; ¿significa entrar más tarde o trabajar desde casa?». Le contestaron lo segundo, y evitó una sorpresa en su primer mes."
    before_phrase: "No sé muy bien a qué se refieren con eso."
    after_phrase: "Eso puede ser ambiguo: ¿a qué se refiere?"
