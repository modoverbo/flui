    sentence: "Un «depende» sin explicación suena {{blank}} y obliga al otro a adivinar de qué depende."
    hint_general: "Permite dos lecturas y deja el trabajo al que lee."
    explanation: "Ambiguo: permite dos lecturas y deja el trabajo al lector. «Ambiental» se refiere al entorno, y «seco» describe el tono, no el número de lecturas posibles."
