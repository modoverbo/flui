    title: "Vengo de la hostelería"
    body: "A Diego le preguntaron por qué debía contratarle una empresa de logística si venía de una cocina. Contestó sin disculparse: «Traigo un bagaje raro aquí: doce años sirviendo cien comidas en dos horas». Le preguntaron cómo se organizaba un servicio y estuvieron media hora en ese punto."
    before_phrase: "Ya sé que no tengo experiencia en esto."
    after_phrase: "Traigo un bagaje distinto y aquí hace falta."
  - position: 2
    scene: "trabajo"
    conversation_type: "practica"
    title: "Tres meses, no tres años"
    body: "Raquel cambió de sector a los cuarenta y todos le avisaron de que tardaría años en ponerse al día. Tardó tres meses. «No empecé de cero», explicó luego, «empecé con el bagaje de lo anterior, que era casi todo lo importante»."
    before_phrase: "Es que yo empiezo de cero otra vez."
    after_phrase: "No empiezo de cero: empiezo con mi bagaje."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "Una cocinera y un electricista"
    body: "El grupo que organiza las fiestas del barrio lo forman una cocinera, un electricista y dos maestras. Ese bagaje mezclado es la razón de que todo salga: una calcula raciones, otro monta el escenario y las otras dos ordenan a doscientos niños en diez minutos."
    before_phrase: "Cada uno sabe de una cosa y eso ayuda."
    after_phrase: "El bagaje mezclado es lo que hace que salga."
