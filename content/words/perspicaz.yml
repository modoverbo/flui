  - confused_with: "suspicaz"
    difference: "«Suspicaz» describe a quien tiende a desconfiar y sospechar de los demás. «Perspicaz» describe a quien capta lo que no es evidente."
    memory_trick: "El suspicaz sospecha; el perspicaz descubre."
  - confused_with: "perspicuo"
    difference: "«Perspicuo» se dice de lo que se entiende con claridad, como un texto o una explicación. Comparte raíz con «perspicaz», pero no describe a quien observa."
    memory_trick: "El perspicaz ve; lo perspicuo se ve."
