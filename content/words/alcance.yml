    title: "Qué entra y qué no"
    body: "El encargo se había aprobado en dos minutos y en dos meses valía el doble de trabajo. La vez siguiente, Nicolás pidió otra cosa: «Escribamos el alcance antes de aprobar: qué entra y qué queda fuera». Media hora de más, tres semanas de menos."
    before_phrase: "Ya iremos viendo hasta dónde llega."
    after_phrase: "Escribamos el alcance antes de aprobar."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Pintar una habitación"
    body: "Mi padre dijo que pintaría una habitación y acabó con la casa entera a medias. Este año lo dijimos claro desde el principio: «El alcance es el pasillo, nada más». Lo terminó un sábado y se sentó a leer, contento."
    before_phrase: "Ya que estoy, sigo con lo demás."
    after_phrase: "El alcance es el pasillo, nada más."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "Cuatro delegaciones"
    body: "El cambio parecía una tontería: mover una firma de sitio en un formulario. Isabel lo miró dos veces. «Parece pequeño, pero su alcance toca a las cuatro delegaciones». Avisaron a todas antes de tocar nada y no hubo ni una llamada de vuelta."
    before_phrase: "Es un cambio de nada, ¿no?"
    after_phrase: "Parece pequeño, pero su alcance toca a las cuatro."
