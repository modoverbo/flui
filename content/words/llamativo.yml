    title: "Una sola palabra"
    body: "El cartel anterior tenía cinco colores y nadie lo miraba. Efraín lo cambió por una palabra negra sobre fondo blanco. «Llamativo no es ruidoso», explicó. Aquella semana entró el doble de gente al taller."
