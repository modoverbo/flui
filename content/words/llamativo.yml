    conversation_type: "practica"
    title: "La página en blanco"
    body: "Le pidieron a Nerea un detalle que le hubiera cambiado una reunión. Contó el del informe: nadie comentó las cifras y todos mencionaron una página en blanco entre dos capítulos. «Era lo más llamativo del documento y no decía nada», explicó. «Ahora reviso la maqueta antes que los números»."
    before_phrase: "Lo que más se ve es esa página vacía."
    after_phrase: "Es lo más llamativo del documento."
  - position: 3
    scene: "familia"
    conversation_type: "social"
    title: "La camisa de la boda"
    body: "Mi tío apareció en la boda con una camisa que se veía desde el aparcamiento. Salió en todas las fotos, y en la mitad se estaba riendo. «Era llamativa y lo sabía», dijo al día siguiente. Nadie discutió ninguna de las dos cosas."
    before_phrase: "Esa camisa se veía un montón."
    after_phrase: "Era llamativa y él lo sabía."
