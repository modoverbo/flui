stressed_syllable: 4
ipa_latam: "[in.tɾan.siˈxen.te]"
ipa_es: "[in.tɾan.siˈxen.te]"
explanation: "Que no cede ni un poco, aunque le den razones buenas para hacerlo."
example_sentence: "Se puso intransigente con el precio, y la reunión terminó sin ningún acuerdo."
register: "neutral"
pedantry_risk: 2
usage_tip: "Describe la postura, no a la persona: «se puso intransigente con el plazo» deja abierta la puerta de mañana."
when_not_to_use: "No la uses para quien defiende algo importante con firmeza: sostener una postura no es lo mismo que no escuchar."
collocations:
  - "ponerse intransigente"
  - "una postura intransigente"
  - "ser intransigente con algo"
replaces:
  - before: "No cede ni un milímetro"
    after: "Está intransigente"
  - before: "Con él no se puede negociar nada"
    after: "Es intransigente en todo"
  - before: "No hubo manera de que se moviera del precio"
    after: "Se puso intransigente con el precio"
family:
  - "intransigencia"
themes:
