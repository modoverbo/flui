confusions:
  - confused_with: "basto"
    difference: "«Basto» se dice de lo tosco, lo poco fino o lo mal acabado; la otra palabra habla de una extensión enorme."
    memory_trick: "Lo basto se toca y raspa; lo otro se recorre y no se acaba."
  - confused_with: "amplio"
    difference: "«Amplio» dice que algo tiene sitio de sobra; la otra palabra añade que la extensión es tan grande que cuesta abarcarla."
    memory_trick: "Lo amplio cabe todo; lo otro no se termina de recorrer."
