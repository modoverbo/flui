schema_version: 1
slug: "aplaudir"
status: "draft"
lemma: "aplaudir"
part_of_speech: "verbo"
syllables: ["a", "plau", "dir"]
stressed_syllable: 3
ipa_latam: "[a.plawˈðiɾ]"
ipa_es: "[a.plawˈðiɾ]"
explanation: "Reconocer en voz alta algo bueno que hizo alguien, con ganas y sin quedarse callado."
example_sentence: "Sus compañeros aplaudieron la decisión de Rocío de decir la verdad, aunque le costara el puesto."
register: "neutral"
pedantry_risk: 1
usage_tip: "Úsalo también en sentido figurado, para apoyar una decisión valiente de alguien, no solo para el gesto físico."
when_not_to_use: "No lo uses para un acuerdo silencioso: aplaudir implica mostrar el apoyo de forma clara, no guardártelo."
collocations:
  - "aplaudir la decisión"
  - "aplaudir el gesto"
  - "todos aplaudieron"
family: ["aplauso"]
themes:
  - slug: "empatia-escucha"
    relevance: 3
tags:
  comodin: ["apoyar con ganas", "reconocer en voz alta"]
  funcion: ["reconocer"]
  canal: "ambos"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "aplacar"
    difference: "Aplacar es calmar algo, como un enojo o un conflicto; aplaudir es reconocer en voz alta algo bueno que hizo alguien."
    memory_trick: "Aplacas una pelea; aplaudes una decisión valiente."
replaces:
  - before: "Le dio la razón con ganas por haber dicho la verdad"
    after: "Aplaudió que dijera la verdad"
  - before: "Apoyaron en voz alta esa decisión difícil"
    after: "Aplaudieron esa decisión difícil"
exercises:
  - position: 1
    sentence: "Sus compañeros {{blank}} la decisión de Rocío de decir la verdad, aunque le costara el puesto."
    hint_general: "Reconocer en voz alta algo bueno que hizo alguien, con ganas."
    explanation: "Aplaudieron: reconocieron en voz alta algo bueno con ganas. «Aplacaron» es calmar algo, y «cuestionaron» implicaría dudar de la decisión, justo lo contrario de apoyarla."
    options:
      - position: 1
        text: "aplaudieron"
        is_correct: true
      - position: 2
        text: "aplacaron"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Aplacar» es calmar algo, como un enojo o un conflicto, sin relación con reconocer una decisión valiente de decir la verdad."
        hint_specific: "Aplacar calma un enojo. ¿Los compañeros calmaron algo o reconocieron la decisión de Rocío?"
      - position: 3
        text: "cuestionaron"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cuestionar» implicaría dudar de la decisión, y la frase dice que sus compañeros la apoyaron, justo lo contrario de dudar."
        hint_specific: "Cuestionar es dudar de algo. ¿Sus compañeros dudaron de la decisión o la apoyaron?"
  - position: 2
    sentence: "El crítico {{blank}} el gesto del director de cambiar el final de la película en el último momento."
    hint_general: "Reconocer en voz alta un gesto arriesgado que hizo alguien."
    explanation: "Aplaudió: reconoció en voz alta un gesto arriesgado. «Aplacó» es calmar algo, y «lamentó» expresaría pesar por algo, justo lo contrario de reconocer un buen gesto."
    options:
      - position: 1
        text: "aplaudió"
        is_correct: true
      - position: 2
        text: "lamentó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Lamentar» expresaría pesar por algo, y la frase dice que el crítico reconoció con ganas el gesto arriesgado del director."
        hint_specific: "Lamentar expresa pesar. ¿El crítico lamentó el cambio o lo reconoció con ganas?"
      - position: 3
        text: "aplacó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Aplacar» es calmar algo, como un enojo o un conflicto, sin relación con reconocer el gesto de cambiar un final de película."
        hint_specific: "Aplacar calma un enojo. ¿El crítico calmó algo o reconoció el gesto del director?"
  - position: 3
    sentence: "Toda la sala se puso de pie para {{blank}} el discurso más sincero que habían escuchado en años."
    hint_general: "Reconocer en voz alta, de pie, algo especialmente bueno que se dijo."
    explanation: "Aplaudir: reconocer en voz alta algo especialmente bueno. «Aplacar» es calmar algo, y «grabar» es registrar el sonido, ninguno describe ese reconocimiento de pie."
    options:
      - position: 1
        text: "aplaudir"
        is_correct: true
      - position: 2
        text: "grabar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Grabar» es registrar el sonido tal cual, y la frase describe a la sala reconociendo el discurso de pie, no grabándolo."
        hint_specific: "Grabar registra el sonido exacto. ¿La sala grabó el discurso o lo reconoció de pie?"
      - position: 3
        text: "aplacar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Aplacar» es calmar algo, como un enojo o un conflicto, sin relación con reconocer un discurso sincero."
        hint_specific: "Aplacar calma un enojo. ¿La sala calmó algo o reconoció el discurso?"
  - position: 4
    sentence: "Su padre nunca {{blank}} en voz alta, pero esta vez le dijo que estaba orgulloso de la decisión."
    hint_general: "Reconocer en voz alta algo bueno, algo que en esta frase casi nunca hace esa persona."
    explanation: "Aplaudía: reconocía en voz alta algo bueno. «Aplacaba» es calmar algo, y «regañaba» implica reprocharle algo, justo lo contrario de reconocer con orgullo una decisión."
    options:
      - position: 1
        text: "aplaudía"
        is_correct: true
      - position: 2
        text: "regañaba"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Regañar» implica reprocharle algo a alguien, y la frase dice que su padre le dijo que estaba orgulloso, justo lo contrario de reprocharle."
        hint_specific: "Regañar es reprochar algo. ¿Su padre reprochaba o reconocía con orgullo?"
      - position: 3
        text: "aplacaba"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Aplacar» es calmar algo, como un enojo o un conflicto, sin relación con reconocer con orgullo una decisión de su hijo."
        hint_specific: "Aplacar calma un enojo. ¿Su padre calmaba algo o reconocía con orgullo?"
  - position: 5
    sentence: "La crítica gastronómica {{blank}} que el restaurante se animara a sacar el plato más caro de la carta."
    hint_general: "Reconocer en voz alta que alguien tomó una decisión valiente o arriesgada."
    explanation: "Aplaudió: reconoció en voz alta una decisión valiente. «Copió» implica imitar algo, y «aplacó» es calmar algo, ninguno describe reconocer el riesgo de sacar un plato de la carta."
