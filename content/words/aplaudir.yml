readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "La verdad que costó caro"
    body: "Rocío sabía que decir la verdad en esa reunión podía costarle el puesto, pero la dijo igual. Al salir, un compañero le tocó el hombro: «Quiero aplaudir lo que hiciste ahí adentro, no todos se animan», le dijo, y eso le alcanzó para no arrepentirse."
    before_phrase: "Quiero decirte que estuvo muy bien lo que hiciste ahí adentro."
    after_phrase: "Quiero aplaudir lo que hiciste ahí adentro."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "El orgullo que casi nunca decía"
    body: "Su padre nunca fue de grandes palabras, pero esta vez lo miró distinto. «Aplaudo que hayas tomado esa decisión sola, no fue fácil», le dijo, y esas pocas palabras pesaron más que cualquier discurso largo."
    before_phrase: "Estoy orgulloso de que hayas tomado esa decisión sola."
    after_phrase: "Aplaudo que hayas tomado esa decisión sola."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "La pregunta que nadie hacía"
    body: "En el chat del curso, nadie se animaba a preguntar lo obvio hasta que Bruno lo hizo. «Aplaudo que hayas preguntado eso, todos lo estábamos pensando», escribió alguien, y en minutos el chat se llenó de mensajes parecidos."
    before_phrase: "Qué bueno que hayas preguntado eso, todos lo pensábamos."
    after_phrase: "Aplaudo que hayas preguntado eso, todos lo pensábamos."
