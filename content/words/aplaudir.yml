        text: "se coparon"
        is_correct: false
        distractor_type: "register"
        why_not: "«Se coparon» es coloquial y regional, y aquí el chat busca nombrar con precisión que reconocieron el valor de Bruno."
        hint_specific: "«Se coparon» es muy regional e informal. ¿El chat busca una palabra precisa o una muy coloquial?"
      - position: 3
        text: "aplacaron"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Aplacar» es calmar algo, como un enojo o un conflicto, sin relación con reconocer que alguien se animó a preguntar."
        hint_specific: "Aplacar calma un enojo. ¿Varios calmaron algo o reconocieron la valentía de Bruno?"
