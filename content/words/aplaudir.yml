        hint_specific: "Copiar es imitar algo. ¿La crítica copió algo o reconoció la decisión con aprobación?"
      - position: 3
        text: "aplacó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Aplacar» es calmar algo, como un enojo o un conflicto, sin relación con reconocer la decisión de sacar un plato caro de la carta."
        hint_specific: "Aplacar calma un enojo. ¿La crítica calmó algo o reconoció la decisión del restaurante?"
  - position: 6
    sentence: "El público {{blank}} de pie cuando el actor mayor terminó su último monólogo en el escenario."
    hint_general: "Reconocer en voz alta y de pie un momento especialmente emotivo."
    explanation: "Aplaudió: reconoció en voz alta y de pie un momento emotivo. «Chifló» describe una reacción de rechazo, justo lo contrario, y «aplacó» es calmar algo, sin relación con ese momento."
    options:
      - position: 1
        text: "aplaudió"
        is_correct: true
