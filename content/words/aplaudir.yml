        text: "chifló"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Chiflar» describe una reacción de rechazo o burla, y la frase describe un reconocimiento emotivo, justo lo contrario de un rechazo."
        hint_specific: "Chiflar es una reacción de rechazo. ¿El público rechazó el monólogo o lo reconoció con emoción?"
      - position: 3
        text: "aplacó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Aplacar» es calmar algo, como un enojo o un conflicto, sin relación con reconocer un monólogo emotivo."
        hint_specific: "Aplacar calma un enojo. ¿El público calmó algo o reconoció el monólogo?"
  - position: 7
    sentence: "En el chat del curso, varios {{blank}} que Bruno se animara a preguntar lo que nadie más se animaba a preguntar."
    hint_general: "Reconocer en un chat que alguien tuvo el valor de hacer algo que otros evitaban."
    explanation: "Aplaudieron: reconocieron que alguien tuvo el valor de hacer algo que otros evitaban. «Se coparon» es coloquial y regional, y «aplacaron» es calmar algo, ninguno nombra esa valentía con precisión."
    options:
      - position: 1
        text: "aplaudieron"
        is_correct: true
