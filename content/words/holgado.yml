    sentence: "Aitana calculó las raciones de la cena familiar y salió un número {{blank}}, por si aparecían dos invitados más."
    hint_general: "Habla de calcular por encima de lo justo para que no falte."
    explanation: "Holgado: calculó por encima de lo justo. «Prolongado» habla de duración, y «escaso» diría que no alcanza para nadie más."
    options:
      - position: 1
        text: "holgado"
        is_correct: true
      - position: 2
        text: "prolongado"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Prolongado» dice que algo dura mucho tiempo, y aquí se cuentan raciones, no minutos."
        hint_specific: "«Prolongado» mide duración. ¿La cena dura mucho o alcanza para más gente?"
      - position: 3
        text: "escaso"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Escaso» diría que no alcanza, y la frase cuenta que preparó de más por si llega gente."
        hint_specific: "«Escaso» es quedarse corto. Relee: ¿preparó de menos o de más?"
  - position: 5
    sentence: "Mientras los demás corrían, Lorenzo terminó su parte {{blank}} y se ofreció a revisar la de otro."
    hint_general: "Dice que a alguien le quedó tiempo libre porque acabó antes de lo previsto."
    explanation: "Holgado: le quedó tiempo libre y lo ofreció. «Holgazán» acusa de no trabajar, y «flexible» hablaría de adaptarse, no de ir sobrado de tiempo."
