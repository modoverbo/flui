  - position: 7
    sentence: "Al revisar la propuesta, Gaspar pidió un calendario más {{blank}}: dos semanas extra por si el proveedor tardaba."
    hint_general: "Pide una medida con sitio de más para absorber un retraso."
    explanation: "Holgado: pide dos semanas por encima para absorber un retraso. «Sobrado» es de conversación muy suelta y suena a fanfarronear, y «abundante» contaría cosas, no semanas de margen."
    options:
      - position: 1
        text: "holgado"
