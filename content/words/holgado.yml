confusions:
  - confused_with: "halagado"
    difference: "«Halagado» es quien acaba de recibir un elogio; la otra palabra mide una cantidad que sobra."
    memory_trick: "Te halagan con palabras; vas holgado con números."
  - confused_with: "apretado"
    difference: "«Apretado» dice que no cabe nada más; «holgado» dice justo lo contrario, que todavía cabe."
    memory_trick: "Apretado es ir al filo; holgado es ir con aire."
exercises:
  - position: 1
    sentence: "Sebastián entregó el informe el martes y la fecha límite era el viernes, así que cerró con un margen {{blank}}."
    hint_general: "Mide una cantidad que quedó por encima de lo que hacía falta."
    explanation: "Holgado: entre el martes y el viernes quedaron días por encima de lo necesario. «Halagado» describe a quien recibe un elogio, y «apretado» diría que llegó al filo."
    options:
      - position: 1
        text: "halagado"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Halagado» describe a alguien a quien acaban de elogiar, y aquí se mide una distancia entre dos fechas."
        hint_specific: "«Halagado» habla de recibir un elogio. ¿Alguien elogia a Sebastián o se comparan dos fechas?"
      - position: 2
        text: "holgado"
        is_correct: true
      - position: 3
        text: "apretado"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Apretado» diría que llegó al filo, y la frase cuenta que entregó tres días antes."
        hint_specific: "«Apretado» es llegar sin un minuto de sobra. ¿Entregó antes o justo a tiempo?"
  - position: 2
    sentence: "Con la mudanza ya pagada, a Noelia le quedó un presupuesto {{blank}} para los muebles que faltaban."
    hint_general: "Describe una cantidad que alcanza y todavía deja un poco libre."
    explanation: "Holgado: el dinero alcanza y aún queda algo. «Sobrado» dice lo mismo en tono de calle y suena a presumir, y «flexible» diría que el presupuesto se puede cambiar."
    options:
      - position: 1
        text: "sobrado"
        is_correct: false
        distractor_type: "register"
        why_not: "«Sobrado» es de conversación muy suelta y además se usa para quien va de listo, no para una cifra escrita."
        hint_specific: "«Sobrado» suena a jactancia de calle. ¿Encaja en una cuenta de la mudanza?"
      - position: 2
        text: "flexible"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Flexible» diría que la cifra se puede mover, y aquí lo que ocurre es que alcanza con algo de más."
        hint_specific: "«Flexible» va de poder cambiar algo. ¿El presupuesto cambia o simplemente alcanza?"
      - position: 3
        text: "holgado"
        is_correct: true
  - position: 3
    sentence: "El equipo de Damián ganó el concurso por una diferencia {{blank}}: sacó doce puntos al segundo."
    hint_general: "Dice que la distancia fue clara y quedó espacio de más entre los dos."
    explanation: "Holgada: doce puntos dejan mucha distancia por encima. «Abundante» cuenta cosas, no mide una diferencia, y «estirada» sugiere que algo se forzó."
    options:
      - position: 1
        text: "abundante"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Abundante» sirve para decir que hay muchas cosas, no para medir la distancia entre dos resultados."
        hint_specific: "«Abundante» cuenta cantidad de cosas. ¿Aquí se cuentan cosas o se mide una distancia?"
      - position: 2
        text: "estirada"
        is_correct: false
        distractor_type: "register"
        why_not: "«Estirada» es coloquial y sugiere que algo se forzó para que diera de sí, o que alguien es distante."
        hint_specific: "«Estirada» insinúa que algo se forzó. ¿Los doce puntos son reales o inflados?"
      - position: 3
        text: "holgada"
        is_correct: true
