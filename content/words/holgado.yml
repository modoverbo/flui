        hint_specific: "«Flexible» va de adaptarse. ¿Esa persona se adaptó a algo o terminó antes?"
  - position: 6
    sentence: "La sala que reservó Mireia era {{blank}} para catorce personas, aunque al final fuimos nueve."
    hint_general: "Describe un espacio con sitio de más para la gente que entra."
    explanation: "Holgada: el sitio daba para más gente de la que fue. «Halagada» hablaría de un elogio recibido, y «apretada» diría que no cabía nadie más."
    options:
      - position: 1
        text: "apretada"
        is_correct: false
