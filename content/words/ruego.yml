readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "La nota a mano"
    body: "El departamento recibía veinte correos automáticos al día. Aquella mañana llegó un sobre con una nota escrita a mano. «Es un ruego, no una reclamación», empezaba. Tres personas la leyeron en voz alta y la petición se atendió esa semana."
    before_phrase: "Pido por favor, si es posible, que…"
    after_phrase: "Es un ruego, no una reclamación."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "Un ruego, no una orden"
    body: "Su hijo mayor ya no vive en casa y viene cuando puede. Su madre dejó de insistir y cambió la forma: «Esto es un ruego, no una orden: avísame si no vienes». Él empezó a avisar, y las comidas dejaron de enfriarse."
    before_phrase: "Podrías avisar, ¿no te parece?"
    after_phrase: "Esto es un ruego, no una orden."
  - position: 3
    scene: "social"
    conversation_type: "social"
    title: "El buzón del vecino"
    body: "El coche del segundo bloqueaba la salida cada mañana. Yago no llamó al timbre ni escribió al grupo del edificio. Dejó una nota corta en el buzón, firmada. «Era un ruego y funcionó», contó luego. El coche apareció aparcado al otro lado."
    before_phrase: "Le puse una nota pidiéndole el favor."
    after_phrase: "Era un ruego, y funcionó."
