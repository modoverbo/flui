schema_version: 1
sort_order: 8101
slug: "carisma"
status: "draft"
lemma: "carisma"
part_of_speech: "sustantivo"
syllables:
  - "ca"
  - "ris"
  - "ma"
stressed_syllable: 2
ipa_latam: "[kaˈɾis.ma]"
ipa_es: "[kaˈɾis.ma]"
explanation: "Manera de ser que atrae a los demás y hace que quieran escuchar y seguir cerca."
example_sentence: "Antes de decir nada, Tobías ya había conquistado a la mesa con su carisma."
register: "neutral"
pedantry_risk: 1
usage_tip: "Dilo de otra persona, nunca de ti mismo: así suena a elogio y no a presunción."
when_not_to_use: "No la confundas con la fama ni con caer bien sin más: el carisma se nota incluso en silencio."
collocations:
  - "tener carisma"
  - "un carisma natural"
  - "irradiar carisma"
replaces:
  - before: "Tiene algo que hace que todos quieran hablar con él"
    after: "Tiene un carisma que hace que todos quieran hablar con él"
  - before: "Cae bien a cualquiera sin esforzarse"
    after: "Tiene carisma sin esforzarse"
  - before: "Sabe cómo caerle bien a la gente"
    after: "Tiene carisma con la gente"
family:
  - "carismático"
themes:
  - slug: "citas"
    relevance: 3
  - slug: "elogio-reconocimiento"
    relevance: 2
tags:
  comodin: ["algo"]
  funcion: ["elogiar"]
  canal: "ambos"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "cariño"
    difference: "«Cariño» es el afecto que sientes por alguien cercano; el carisma es lo que atrae incluso a quien acaba de conocerte."
    memory_trick: "El cariño se da con el tiempo; el carisma se nota desde el primer minuto."
  - confused_with: "simpatía"
    difference: "«Simpatía» es caer bien y resultar agradable; el carisma además hace que la gente quiera seguirte y escucharte."
exercises:
  - position: 1
    sentence: "Nadie en la fiesta conocía a Leandro, pero su {{blank}} hizo que el grupo entero dejara de hablar entre sí para escucharlo a él."
    hint_general: "Piensa en la cualidad que hace que la gente quiera escuchar a alguien recién llegado."
    explanation: "Carisma: atrae incluso a quien no lo conoce. «Cariño» necesita cercanía previa, y aquí nadie lo conocía; «simpatía» es solo caer bien, y aquí el grupo entero se queda escuchando."
    options:
      - position: 1
        text: "cariño"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Cariño» es el afecto que se siente por alguien cercano, y la frase dice que nadie lo conocía todavía."
        hint_specific: "El cariño nace de la cercanía. ¿Hace cuánto se conocen en esta fiesta?"
      - position: 2
        text: "carisma"
        is_correct: true
      - position: 3
        text: "simpatía"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Simpatía» es solo caer bien; aquí el grupo entero deja de hablar para escucharlo, que es más que caer bien."
        hint_specific: "La simpatía hace que caigas bien. ¿Aquí solo cae bien, o además todos se callan por él?"
  - position: 2
    sentence: "En la boda de su primo, la anécdota de Selene generó {{blank}} en su mesa: todos quisieron sentarse cerca de ella en el baile."
    hint_general: "Busca la palabra para la cualidad que hace que la gente quiera quedarse cerca después de una buena anécdota."
    explanation: "Carisma: generó un acercamiento real. «Cisma» sería una división entre los invitados, y aquí todos quieren acercarse a ella; «fama» implica conocerla fuera de esa boda, y el efecto solo dura esa noche."
    options:
      - position: 1
        text: "cisma"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Cisma» es una división o pelea entre las personas, y en la mesa pasó justo lo contrario: todos quisieron acercarse a ella."
        hint_specific: "Un cisma separa a la gente. ¿La mesa se separó o se acercó a Selene?"
      - position: 2
        text: "carisma"
        is_correct: true
      - position: 3
        text: "fama"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Fama» significa que la conocen fuera de ese grupo, y aquí el efecto no sale de esa boda."
        hint_specific: "La fama se nota fuera del lugar donde estás. ¿Selene es conocida fuera de esa boda?"
  - position: 3
    sentence: "«¿Por qué se calla toda la mesa en cuanto habla Tobías?», preguntó una invitada nueva. Alguien se lo explicó con una sola palabra: {{blank}}."
    hint_general: "Piensa en la palabra que explica por qué la mesa se calla justo cuando él empieza a hablar."
    explanation: "Carisma: explica por qué hablar hace callar a la mesa. «Caradura» acusa de imponerse sin respeto, y aquí nadie interrumpe a nadie; «presencia» se nota aunque no hable, y aquí el efecto llega justo cuando habla."
    options:
      - position: 1
        text: "caradura"
        is_correct: false
        distractor_type: "register"
        why_not: "«Caradura» acusa a alguien de imponerse sin respeto por los demás, y la frase dice que Tobías no interrumpe ni se impone."
        hint_specific: "«Caradura» es un reproche por pasarse de la raya. ¿Tobías interrumpe a alguien?"
      - position: 2
        text: "presencia"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Presencia» se nota aunque la persona no diga nada, y aquí el efecto llega justo cuando Tobías empieza a hablar."
        hint_specific: "La presencia no necesita palabras. ¿Cuándo se nota el efecto de Tobías?"
      - position: 3
        text: "carisma"
        is_correct: true
  - position: 4
    sentence: "Malena no prepara ninguna frase antes de una cita: su {{blank}} hace que la conversación fluya sola, sin trucos."
    hint_general: "Es la cualidad que sostiene una charla completa, sin nada preparado de antemano."
    explanation: "Carisma: sostiene una conversación entera sin preparar nada. «Gancho» suena a un truco pensado de antemano, y ella no prepara nada; «chispa» es un destello puntual, y aquí lo que sostiene es la charla completa."
    options:
      - position: 1
        text: "gancho"
        is_correct: false
        distractor_type: "register"
        why_not: "«Gancho» es un truco pensado para atrapar a alguien, y la frase dice que Malena no prepara ninguna frase."
        hint_specific: "Un gancho se piensa antes. ¿Malena prepara algo antes de la cita?"
      - position: 2
        text: "carisma"
        is_correct: true
      - position: 3
        text: "chispa"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Chispa» es un destello de gracia en un momento puntual, y aquí lo que sostiene es la conversación completa."
        hint_specific: "La chispa dura un instante. ¿Qué sostiene la charla entera de Malena?"
  - position: 5
    sentence: "Jonás convenció al portero de dejarlo entrar sin invitación con puro {{blank}}: no prometió nada ni contó ningún chiste, solo habló con naturalidad y el portero terminó riendo."
    hint_general: "Piensa en la cualidad que convence sin prometer nada ni recurrir a un chiste."
    explanation: "Carisma: convence sin prometer ni hacer un chiste. «Labia» sugiere palabras calculadas para conseguir algo, y aquí no promete nada; «gracia» remite a un chiste concreto, y aquí no cuenta ninguno."
    options:
      - position: 1
        text: "labia"
        is_correct: false
        distractor_type: "register"
        why_not: "«Labia» sugiere palabras calculadas para sacar un favor, y la frase dice que no prometió nada ni buscó una excusa."
        hint_specific: "La labia promete o inventa algo. ¿Jonás promete algo al portero?"
      - position: 2
        text: "carisma"
        is_correct: true
      - position: 3
        text: "gracia"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Gracia» remite a un chiste concreto, y la frase aclara que no contó ninguno, solo habló con naturalidad."
        hint_specific: "La gracia necesita un chiste. ¿Jonás cuenta alguno?"
  - position: 6
    sentence: "Lo que hace que Aitana termine siendo el centro de cualquier cena sin buscarlo no es su ropa ni sus palabras ensayadas: es {{blank}}."
    hint_general: "Piensa en lo que la vuelve el centro de la mesa, más allá de cómo viste o de lo que prepara de antemano."
    explanation: "Carisma: lo que la vuelve centro de la charla, no su ropa ni un guion preparado. «Estilo» habla de su forma de vestir, y la frase ya aclara que no es eso; «aura» es una sensación pasiva, y aquí ella participa activamente en la conversación hasta volverse el centro."
    options:
      - position: 1
        text: "estilo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Estilo» describe una forma personal de hacer o vestir, y la frase ya aclara que no se trata de su ropa."
        hint_specific: "El estilo va de forma, de ropa o de gestos. ¿Qué descarta ya la frase?"
      - position: 2
        text: "aura"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Aura» es una sensación que se percibe sin que la persona haga nada, y aquí ella participa activamente hasta volverse el centro."
        hint_specific: "El aura no necesita acción. ¿Aitana participa o solo está presente?"
      - position: 3
        text: "carisma"
        is_correct: true
  - position: 7
    sentence: "Cayetano tiene tal {{blank}} que hace que hasta los más callados terminen contando anécdotas después de diez minutos de charla."
    hint_general: "Se trata de lo que logra que hasta los más callados se pongan a contar historias."
    explanation: "Carisma: logra que hasta los callados se abran a contar historias. «Temple» es mantener la calma en un aprieto, y aquí no hay ningún aprieto; «encanto» se queda en agradar, y aquí además consigue que los demás hablen."
    options:
      - position: 1
        text: "temple"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Temple» es la calma que se mantiene en un momento difícil, y en esta charla no hay ningún aprieto que enfrentar."
        hint_specific: "El temple se prueba en los apuros. ¿Qué aprieto hay en esta charla?"
      - position: 2
        text: "carisma"
        is_correct: true
      - position: 3
        text: "encanto"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Encanto» es agradar o resultar atractivo, y aquí el efecto va más allá: logra que los callados se pongan a contar historias."
        hint_specific: "El encanto se queda en agradar. ¿Qué logra además Cayetano con los callados?"
  - position: 8
    sentence: "Norma nunca busca ser el centro de nada, pero tiene tal {{blank}} que sus compañeros arrastran las sillas hasta su mesa a la hora del café, sin que ella invite a nadie."
    hint_general: "Piensa en lo que hace que los demás se acerquen solos, sin que nadie los llame."
    explanation: "Carisma: la buscan activamente sin que los llame. «Tirón» se usa para hablar de multitudes o público, y aquí solo se acercan sus compañeros de mesa; «simpatía» es solo caer bien, y aquí además la buscan sin que ella invite a nadie."
    options:
      - position: 1
        text: "tirón"
        is_correct: false
        distractor_type: "register"
        why_not: "«Tirón» se usa para hablar de arrastrar multitudes o público, y aquí solo se acercan unos compañeros de mesa."
        hint_specific: "El tirón mueve multitudes. ¿Cuánta gente se acerca a Norma en este café?"
      - position: 2
        text: "simpatía"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Simpatía» es solo caer bien, y aquí además la buscan activamente sin que ella invite a nadie."
        hint_specific: "La simpatía hace que caigas bien. ¿Qué hacen además los compañeros de Norma?"
      - position: 3
        text: "carisma"
        is_correct: true
readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "El bar sin nombre"
    body: "Bruno llevaba diez minutos hablando con Renata en la barra cuando ella se dio cuenta de que ya no miraba el teléfono. No había dicho nada especialmente inteligente, pero cada frase suya hacía que quisiera escuchar la siguiente. «Tienes un carisma que no se aprende», le dijo al final, y le pidió el número antes de irse."
    before_phrase: "Tiene algo que atrapa, no sé qué es."
    after_phrase: "Tienes un carisma que no se aprende."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "El consejo de mi hermana"
    body: "Antes de la primera cita con Ezequiel, Paola le preguntó a su hermana cómo debía comportarse. «No prepares un discurso», le dijo. «Tu carisma no está en lo que dices, está en cómo escuchas». Paola llegó sin ningún plan y la cita duró tres horas."
    before_phrase: "No sé qué decir para caerle bien."
    after_phrase: "Mi carisma está en cómo escucho, no en lo que digo."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El mensaje antes de la cita"
    body: "Antes de salir a comer, Ismael le mostró a su compañera de oficina el mensaje que pensaba mandarle a su cita: tres párrafos explicando por qué le gustaba el cine. Ella lo borró casi entero. «Tu carisma no cabe en un mensaje largo; escribe algo corto y sé tú cuando la veas»."
    before_phrase: "Quiero escribirle algo que la impresione."
    after_phrase: "Mi carisma se nota mejor en persona que en un mensaje largo."
