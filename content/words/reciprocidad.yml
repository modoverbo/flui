    scene: "social"
    conversation_type: "social"
    title: "El segundo café"
    body: "Después de la primera cita, Emilio invitó a un segundo café sin esperar señales raras. Cuando llegó el momento de pagar, ella insistió en cubrir la mitad. «Me gusta que haya reciprocidad», le dijo él, sonriendo, «que los dos pongamos algo»."
    before_phrase: "Me gusta que los dos pongamos algo, que sea parejo."
    after_phrase: "Me gusta que haya reciprocidad entre los dos."
  - position: 2
