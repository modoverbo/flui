    explanation: "Reciprocidad: el mismo esfuerzo de los dos lados. «Receptividad» es solo estar abierto a recibir, no un intercambio igual de los dos; «simetría» es un término más técnico para formas o patrones, raro para describir mensajes y llamadas."
