    sentence: "«¿Por qué sigues viéndolo si sientes que pones más que él?», le preguntó su amiga a Adriana. «Justo por eso», respondió, «porque no hay {{blank}}: yo llamo, yo propongo los planes, y él nunca hace lo mismo por mí»."
