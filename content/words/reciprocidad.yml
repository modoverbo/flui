confusions:
  - confused_with: "receptividad"
    difference: "«Receptividad» es estar abierto a recibir algo, sin que tú también lo devuelvas; la reciprocidad exige que las dos partes den por igual."
    memory_trick: "La receptividad recibe; la reciprocidad devuelve."
  - confused_with: "correspondencia"
    difference: "«Correspondencia» suele ser una respuesta puntual a un sentimiento; la reciprocidad es un patrón sostenido de dar y recibir por igual."
