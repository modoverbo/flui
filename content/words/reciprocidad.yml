    conversation_type: "emocional"
    title: "El consejo de mi tía"
    body: "Herminia le contó a su tía que sentía que ponía más esfuerzo que su pareja en la relación. «Eso no es sano», le dijo su tía, «una relación necesita reciprocidad, que los dos den lo mismo, no que uno cargue con todo»."
    before_phrase: "Siento que pongo más que él, no es parejo."
    after_phrase: "Una relación necesita reciprocidad, que los dos den lo mismo."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "La comparación con la compañera"
    body: "En la pausa del almuerzo, Adriana le contó a una compañera que su cita siempre respondía sus mensajes al instante y le preguntaba por su día sin que ella lo pidiera. «Eso es reciprocidad de verdad», comentó la compañera, «no todos la tienen»."
    before_phrase: "Me responde siempre y me pregunta por mi día, es parejo."
    after_phrase: "Eso es reciprocidad de verdad, no todos la tienen."
