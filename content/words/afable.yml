        text: "locuaz"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Locuaz» describe a quien habla mucho, y la frase no cuenta cuánto habla el novio, sino que en media hora ya conocía el apodo de cada primo."
        hint_specific: "«Locuaz» mide cuánto habla alguien. ¿La frase mide cuánto habla o qué tan rápido conoció a la familia?"
      - position: 2
        text: "afable"
        is_correct: true
      - position: 3
        text: "cariñoso"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cariñoso» supone una cercanía afectiva propia de alguien querido desde hace tiempo, y el novio acaba de llegar a la familia esa misma noche."
        hint_specific: "«Cariñoso» pide cercanía de tiempo. ¿Cuánto tiempo lleva el novio en la familia?"
readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "El que suma sillas"
    body: "En el cumpleaños de Mirta, alguien preguntó quién había traído sillas de más. Fue Renzo, que llevaba diez minutos hablando con los vecinos de la mesa de al lado y ya los había invitado a quedarse. «Es que es tan afable que no puede evitar sumar gente», dijo Mirta riendo."
    before_phrase: "Es buena gente y cae bien a todos."
    after_phrase: "Es tan afable que suma gente sin querer."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "El yerno nuevo"
    body: "A la abuela le preocupaba conocer al novio de su nieta. Bastaron diez minutos de sobremesa para que le preguntara por su receta de flan y se ofreciera a probarla. «Qué afable», le dijo después a su nieta, «hasta a mí me hizo sentir escuchada»."
    before_phrase: "Qué buena persona parece, cae superbién."
    after_phrase: "Qué afable, hasta a mí me hizo sentir escuchada."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El proveedor serio"
    body: "El proveedor tenía fama de serio y cortante. En la primera reunión, Jimena bromeó sobre el retraso del tren y consiguió que él contara una anécdota propia. Su jefe se lo comentó luego: «Eres tan afable que hasta él se relajó»."
    before_phrase: "Le caí bien y se relajó un poco."
    after_phrase: "Fui afable con él y se relajó."
