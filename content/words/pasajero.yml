    title: "El pico que no duró"
    body: "El equipo de marketing celebró cuando las visitas se triplicaron en un día. Antes de brindar, la analista pidió calma: «Vienen del mismo enlace de la campaña, así que probablemente sea pasajero. Vamos a ver si se sostiene la próxima semana». Tuvo razón: el lunes las cifras volvieron a lo normal."
    before_phrase: "Esto seguro que no dura, ya se va a bajar."
    after_phrase: "Probablemente sea pasajero; hay que ver si se sostiene."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "La nueva obsesión"
    body: "Renata le contó a su amigo que ya no podía dejar de escuchar cierta canción. Un mes después, ni la recordaba. «Te dije que era pasajero», se rio su amigo, «a la semana siguiente ya tenías otra canción pegada»."
    before_phrase: "Seguro se me va a pasar en dos días."
    after_phrase: "Fue pasajero: a la semana ya tenía otra canción pegada."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "El portazo"
    body: "Después de la discusión, su hijo se encerró en el cuarto y dijo que no quería volver a hablarle. Esa noche, el padre le dijo a su esposa: «Este enojo es pasajero, ya lo conocemos». Al día siguiente, el chico salió a desayunar como si nada."
    before_phrase: "Seguro se le pasa en un rato, ya lo conocemos."
    after_phrase: "Este enojo es pasajero, ya lo conocemos."
