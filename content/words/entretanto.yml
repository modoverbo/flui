explanation: "Nombra lo que ocurre durante la espera, mientras se resuelve otra cosa."
example_sentence: "El técnico llega el jueves; entretanto, seguimos con el equipo de repuesto."
register: "neutral"
pedantry_risk: 2
usage_tip: "Ordena una espera: primero lo que falta, después lo que sí puedes hacer ya."
when_not_to_use: "No la uses para una sucesión de pasos; solo vale cuando las dos cosas ocupan el mismo rato."
collocations:
  - "entretanto conviene"
  - "entretanto seguimos"
replaces:
