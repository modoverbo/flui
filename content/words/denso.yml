confusions:
  - confused_with: "espeso"
    difference: "«Espeso» se dice de un líquido que cuesta remover, como una salsa; la otra palabra se dice de un texto o una charla con mucho contenido."
    memory_trick: "Lo espeso se toca; lo otro se lee."
  - confused_with: "tenso"
    difference: "«Tenso» describe un ambiente a punto de romperse; la otra palabra describe un contenido muy apretado."
    memory_trick: "Lo tenso se nota en el cuerpo; lo otro, en la cabeza."
