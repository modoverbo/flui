    title: "Una respuesta muy llena"
    body: "Le preguntaron por su último proyecto y Aitor contestó tres minutos seguidos. La entrevistadora levantó la mano: «Muy denso; vamos por partes». Él respiró y empezó otra vez, esta vez por el principio."
    before_phrase: "Perdón, me he liado y he metido de todo."
    after_phrase: "Me ha salido muy denso; voy por partes."
  - position: 3
    scene: "familia"
    conversation_type: "emocional"
    title: "La conversación del domingo"
    body: "Hablaron de la mudanza, del dinero y de la abuela en una hora. Al colgar, Lorena le escribió a su hermano: «Ha sido una llamada densa, ¿lo seguimos mañana?». Él contestó con un sí y las dos partes durmieron mejor."
    before_phrase: "Uf, ha sido una llamada muy fuerte."
    after_phrase: "Ha sido una llamada densa, lo seguimos mañana."
