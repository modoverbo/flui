    title: "Dos páginas, tres lecturas"
    body: "El equipo recibió un documento de dos páginas y nadie opinaba. Al día siguiente, Berta lo dijo en voz alta: «Es denso, no es largo; necesito hasta el jueves». Nadie se ofendió y el jueves hubo debate de verdad."
