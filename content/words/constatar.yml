readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Hechos arriba, propuesta abajo"
    body: "Otilia dividió su correo en dos bloques. Arriba: «Constato tres cosas: los plazos se cumplen, las quejas bajaron a la mitad y seguimos sin manual». Abajo, una propuesta de tres líneas. Nadie discutió la primera parte y el debate fue corto."
    before_phrase: "Yo creo que va mejor, ¿no?"
    after_phrase: "Constato tres cosas."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La casa del pueblo"
    body: "Su madre temía encontrarse el tejado hundido tras el invierno. Ivo subió con una escalera, miró despacio y la llamó: «Constato que aguantó; solo faltan dos tejas». Ella respiró por primera vez en tres meses."
    before_phrase: "Yo lo veo bien, pero vete a saber."
    after_phrase: "Constato que aguantó."
  - position: 3
    scene: "entrevista"
    conversation_type: "practica"
    title: "Antes de opinar"
    body: "Le preguntaron qué mejoraría del equipo al que iba a entrar. Amalia no repartió juicios: «Desde fuera solo puedo constatar dos cosas: el equipo publica muy rápido y responde poco en redes. Lo demás tendría que verlo por dentro». Le ofrecieron el puesto."
    before_phrase: "Pues yo cambiaría un montón de cosas."
    after_phrase: "Desde fuera solo puedo constatar dos cosas."
