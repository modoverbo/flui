explanation: "Comprobar con tus propios ojos que algo es cierto y dejarlo dicho, sin opinar."
example_sentence: "Después de dos meses con el método nuevo, puedo constatar que los correos se contestan el mismo día."
register: "neutral"
pedantry_risk: 2
usage_tip: "Separa el hecho de la opinión: primero dices lo que se puede comprobar y después lo que propones."
when_not_to_use: "No la uses para algo que solo intuyes o que te contaron: si no lo has comprobado, es una suposición."
collocations:
