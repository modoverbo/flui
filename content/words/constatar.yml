confusions:
  - confused_with: "contrastar"
    difference: "«Contrastar» compara dos versiones para ver en qué se diferencian; la otra palabra solo confirma que algo ocurrió."
    memory_trick: "Contrastas dos datos entre sí; confirmas uno con tus ojos."
  - confused_with: "opinar"
    difference: "«Opinar» añade tu juicio; la otra palabra se queda en lo que cualquiera podría comprobar igual que tú."
    memory_trick: "La opinión es tuya; el hecho lo puede repetir cualquiera."
exercises:
