pedantry_risk: 1
usage_tip: "Funciona bien para describir un ataque directo a la reputación de alguien, no una simple crítica puntual."
when_not_to_use: "No la uses para un desacuerdo educado ni para señalar un solo error menor; implica un ataque más amplio a la confianza en esa persona."
