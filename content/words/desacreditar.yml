    difference: "«Desmentir» corrige un dato concreto que es falso; esta palabra ataca la reputación general de la persona, más allá de un solo dato."
    memory_trick: "Desmientes un dato; desacreditas a una persona."
  - confused_with: "denigrar"
    difference: "«Denigrar» insulta o humilla directamente; esta palabra busca minar la confianza con argumentos o hechos, no con insultos."
