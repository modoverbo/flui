    title: "La casa de las afueras"
    body: "Todo el grupo insistía en que se había ido a vivir demasiado lejos. Anacleto no se puso a la defensiva: «Está ciertamente lejos, y pago la mitad». Nadie discutió el dato y dos amigos le pidieron el teléfono de la inmobiliaria."
    before_phrase: "La verdad que está lejos, pero es que pago la mitad."
    after_phrase: "Está ciertamente lejos, y pago la mitad."
