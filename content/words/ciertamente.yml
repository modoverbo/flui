confusions:
  - confused_with: "certeramente"
    difference: "«Certeramente» dice que algo dio en el blanco: «respondió certeramente». La otra no valora la puntería: concede razón."
    memory_trick: "Una acierta el tiro; la otra baja la guardia."
  - confused_with: "ciegamente"
    difference: "«Ciegamente» describe a quien se fía sin mirar: «obedeció ciegamente». La otra mira muy bien y aun así concede."
    memory_trick: "Una no mira; la otra mira y admite."
