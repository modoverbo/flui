    body: "Su hermano llegó con cuarenta minutos de retraso y la mesa entera lo miró. Antes de que nadie hablara, Nicasia puso las dos cosas en la misma frase: «Llegó tarde, ciertamente, pero trajo el postre que faltaba». La comida siguió sin reproches."
    before_phrase: "Hombre, tarde ha llegado, pero bueno, trae postre."
    after_phrase: "Llegó tarde, ciertamente, pero trajo el postre."
