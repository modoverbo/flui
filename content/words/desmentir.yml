    sentence: "Al preguntarle por la foto, el portavoz no {{blank}} nada: se limitó a decir que no iba a hablar del tema."
    hint_general: "No llegó a decir que lo que se contaba fuera falso."
    explanation: "Desmintió: no llegó a decir que fuera falso. «Desautorizó» sería retirarle el respaldo a alguien, y «aclaró» supondría que explicó algo."
    options:
      - position: 1
        text: "desautorizó"
        is_correct: false
        distractor_type: "register"
        why_not: "«Desautorizó» es lenguaje oficial sobre quitar respaldo o permiso a una persona, y aquí se hablaba de una foto."
