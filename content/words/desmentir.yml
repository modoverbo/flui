confusions:
  - confused_with: "desmontar"
    difference: "«Desmontar» un argumento es enseñar por qué no se sostiene; lo otro dice simplemente que el hecho no ocurrió."
    memory_trick: "Desmontas un razonamiento; desmientes un hecho."
  - confused_with: "rectificar"
    difference: "«Rectificar» es corregir lo que tú mismo dijiste; esta palabra tumba lo que dicen otros."
    memory_trick: "Rectificas lo tuyo; desmientes lo ajeno."
exercises:
  - position: 1
    sentence: "Antes de que el rumor llegara a los clientes, Zulema salió a {{blank}} el cierre de la fábrica con el calendario en la mano."
    hint_general: "Dice en voz alta que el hecho que se cuenta no es cierto."
    explanation: "Desmentir: dice que el hecho no es cierto. «Desmontar» sería mostrar por qué falla un razonamiento, y «rectificar» corregiría sus propias palabras."
    options:
      - position: 1
        text: "desmontar"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Desmontar» se usa con razonamientos que se enseñan por dentro, y aquí el rumor solo dice un hecho: que cierran."
        hint_specific: "«Desmontar» pide un razonamiento con piezas. ¿El rumor razona algo o afirma un hecho?"
      - position: 2
        text: "desmentir"
        is_correct: true
      - position: 3
        text: "rectificar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Rectificar» es corregir algo que dijiste tú, y Zulema no dijo nada: lo dijeron otros."
        hint_specific: "«Rectificar» mira hacia tus propias palabras. ¿Quién puso a correr el rumor?"
  - position: 2
    sentence: "El club tardó tres días en {{blank}} la lista de fichajes que circulaba por los grupos del barrio."
    hint_general: "Tardó en decir públicamente que la lista no era cierta."
    explanation: "Desmentir: decir que la lista no era cierta. «Refutar» pertenece al debate de ideas, y «ignorar» sería no decir nada."
    options:
      - position: 1
        text: "refutar"
        is_correct: false
        distractor_type: "register"
        why_not: "«Refutar» es palabra de debate académico y se usa con argumentos, no con una lista que corre por los grupos."
        hint_specific: "«Refutar» suena a discusión de ideas con argumentos. ¿Qué circulaba por el barrio?"
      - position: 2
        text: "desmentir"
        is_correct: true
      - position: 3
        text: "ignorar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Ignorar» sería callarse, y la frase cuenta que al tercer día el club acabó hablando."
        hint_specific: "«Ignorar» es no hacer nada. ¿El club se calló o habló?"
  - position: 3
    sentence: "En plena entrevista, Ismael {{blank}} la cifra que le atribuían y ofreció el informe donde aparecía la real."
    hint_general: "Dijo que esa cifra no era la suya y enseñó la verdadera."
    explanation: "Desmintió: dijo que esa cifra no era la suya. «Desmontó» sería enseñar por qué falla un argumento, y «matizó» aceptaría la cifra y le pondría bordes."
    options:
      - position: 1
        text: "desmintió"
        is_correct: true
      - position: 2
        text: "desmontó"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Desmontó» se dice de un argumento al que se le enseñan las costuras, y aquí se corrige un número."
        hint_specific: "«Desmontó» necesita un razonamiento. ¿Qué le atribuían, un razonamiento o un número?"
      - position: 3
        text: "matizó"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Matizó» aceptaría la cifra y le añadiría precisiones, y él dice que esa cifra no es suya."
        hint_specific: "«Matizó» acepta el fondo. ¿Ismael acepta esa cifra?"
  - position: 4
    sentence: "Mi abuela {{blank}} cada historia que se contaba de ella en el pueblo, y siempre con la misma frase corta."
    hint_general: "Decía que lo que contaban de ella no había pasado."
    explanation: "Desmentía: decía que lo contado no había pasado. «Desautorizaba» suena a orden administrativa que retira permisos, y «negaba» no dice que fuera en público ni sobre un relato ajeno."
    options:
      - position: 1
        text: "desautorizaba"
        is_correct: false
        distractor_type: "register"
        why_not: "«Desautorizaba» es lenguaje administrativo sobre quitarle el permiso o el respaldo a alguien, y ella solo decía que aquello no pasó."
        hint_specific: "«Desautorizaba» suena a retirar permisos, en tono oficial. ¿Tu abuela retiraba permisos?"
      - position: 2
        text: "desmentía"
        is_correct: true
      - position: 3
        text: "negaba"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Negaba» puede hacerse en privado y sobre cualquier cosa, y aquí se responde en el pueblo a un relato que ya circulaba."
        hint_specific: "«Negaba» puede ser a solas. ¿Dónde ocurría esto y frente a qué?"
  - position: 5
    sentence: "La asociación pidió al periódico que {{blank}} el dato del número de socios, que estaba multiplicado por diez."
    hint_general: "Piden que se diga públicamente que ese número no es cierto."
    explanation: "Desmienta: que se diga en público que el número no es cierto. «Desmonte» hablaría de un argumento con piezas, y «publique» solo pediría que saliera impreso algo, sin decir qué."
    options:
      - position: 1
        text: "desmonte"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Desmonte» se dice de un razonamiento que se enseña por dentro, y aquí lo que falla es una cifra suelta."
        hint_specific: "«Desmonte» necesita piezas que enseñar. ¿Hay razonamiento o hay número?"
      - position: 2
        text: "desmienta"
        is_correct: true
      - position: 3
        text: "publique"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Publique» solo pide que salga algo impreso, y lo que se pide es que se diga que ese dato no es cierto."
        hint_specific: "«Publique» no dice qué sale. ¿Qué contenido exige la asociación?"
  - position: 6
    sentence: "Tuvo que salir a {{blank}} lo del traslado antes de que medio equipo empezara a buscar trabajo."
    hint_general: "Tenía que decir a tiempo que ese traslado no iba a pasar."
    explanation: "Desmentir: decir a tiempo que el traslado no iba a pasar. «Refutar» pertenece al debate con argumentos, y «confirmar» diría justo lo contrario."
