readings:
  - position: 1
    scene: "trabajo"
    conversation_type: "practica"
    title: "Antes del lunes"
    body: "El rumor del cierre empezó el viernes y para el domingo lo creía media plantilla. Zulema no esperó al comunicado oficial: escribió al grupo con el calendario de pedidos adjunto. «Lo desmiento con datos, no con promesas», puso. El lunes nadie faltó."
    before_phrase: "Eso que dicen no es verdad, en serio."
    after_phrase: "Lo desmiento con datos, no con promesas."
  - position: 2
    scene: "entrevista"
    conversation_type: "practica"
    title: "La cifra que no era"
    body: "En plena entrevista le atribuyeron a Ismael una cifra que no había dado nunca. No se enfadó ni pidió cortar. «Eso lo desmiento», dijo, «y aquí está el informe con el número real». El periodista lo agradeció en voz alta."
    before_phrase: "Yo eso no lo he dicho nunca."
    after_phrase: "Eso lo desmiento, y aquí está el número real."
  - position: 3
    scene: "familia"
    conversation_type: "social"
    title: "La frase de mi abuela"
    body: "En el pueblo se contaban tres versiones de cada cosa y dos eran sobre mi abuela. Ella desmentía cada una con la misma frase corta y luego cambiaba de tema. Nunca discutió con nadie y nunca dejó correr una historia falsa."
    before_phrase: "Eso que cuentan de mí no pasó."
    after_phrase: "Eso lo desmiento y seguimos."
