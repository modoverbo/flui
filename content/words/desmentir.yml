  - position: 7
    sentence: "Berta {{blank}} el rumor sobre su renuncia con una sola línea en el tablón del portal."
    hint_general: "Con una línea dijo que lo que se contaba no era cierto."
    explanation: "Desmintió: con una línea dijo que no era cierto. «Desmontó» pediría un razonamiento al que enseñar las costuras, y «rectificó» corregiría sus propias palabras."
    options:
      - position: 1
        text: "rectificó"
        is_correct: false
