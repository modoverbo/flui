readings:
  - position: 1
    scene: "familia"
    conversation_type: "emocional"
    title: "Tres noches"
    body: "El piso de Aitor se quedó sin luz un martes de enero. Su prima no preguntó nada: «Tienes cobijo aquí hasta que lo arreglen». Durmió en el sofá tres noches y cenaron juntos las tres. Cuando volvió la luz, siguieron cenando los martes."
    before_phrase: "Si necesitas, te puedes quedar en casa unos días."
    after_phrase: "Tienes cobijo aquí hasta que lo arreglen."
  - position: 2
    scene: "social"
    conversation_type: "social"
    title: "El bar del invierno"
    body: "Cuando cerró la fábrica, el bar de la esquina se llenó a media tarde. Nadie hablaba del asunto, pero todos estaban. «Esto fue el cobijo de aquel invierno», dice ahora el dueño, y se le nota que lo sabe."
    before_phrase: "Aquí veníamos todos a no estar solos."
    after_phrase: "Esto fue el cobijo de aquel invierno."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "La puerta abierta"
    body: "Su despacho tenía dos sillas y nunca hizo falta pedir cita. Quien entraba salía sin soluciones, pero salía entero. Al jubilarse, alguien lo resumió en la despedida: «Has sido el cobijo de mucha gente y ninguno lo puso por escrito»."
    before_phrase: "Siempre has estado ahí para todos."
    after_phrase: "Has sido el cobijo de mucha gente."
