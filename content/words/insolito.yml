confusions:
  - confused_with: "insolente"
    difference: "«Insolente» describe a quien falta al respeto; lo otro describe un hecho que casi nunca ocurre."
    memory_trick: "El insolente ofende; lo que casi nunca pasa asombra."
  - confused_with: "raro"
    difference: "«Raro» dice que algo se sale de lo normal, aunque pase a menudo; esta palabra exige que ocurra poquísimas veces."
    memory_trick: "Raro hay mucho; de esto hay poquísimo."
