readings:
  - position: 1
    scene: "social"
    conversation_type: "social"
    title: "Dos veces el mismo día"
    body: "Wanda conoció a su pareja por la mañana en una librería y, por la tarde, en la cola de un cine al otro lado de la ciudad. Ninguno de los dos sabía que el otro vivía allí. «Es insólito», dijo él, «pero pasó». Lo cuentan en cada cena y nadie se cansa de oírlo."
    before_phrase: "Fue rarísimo, no me lo podía creer."
    after_phrase: "Fue insólito, pero pasó."
  - position: 2
    scene: "familia"
    conversation_type: "emocional"
    title: "La noche de la tormenta"
    body: "El grifo de la cocina llevaba meses goteando y nadie lo arreglaba. La noche de la tormenta paró solo. Mi padre se levantó, miró el fregadero y dijo: «Esto es insólito; no toques nada». A la mañana siguiente seguía seco, y esa historia ya lleva diez años contándose."
    before_phrase: "Pasó una cosa que no pasa nunca."
    after_phrase: "Esto es insólito; no toques nada."
  - position: 3
    scene: "trabajo"
    conversation_type: "practica"
    title: "El mensaje perdido"
    body: "El enredo con los billetes parecía imposible de deshacer. Jimena revisó la bandeja de correo una última vez y encontró un mensaje de hacía tres semanas. «Es insólito que aparezca justo hoy», escribió al equipo, «pero está todo aquí». El asunto se cerró antes de las siete."
    before_phrase: "Es increíble que haya aparecido hoy."
    after_phrase: "Es insólito que aparezca justo hoy."
