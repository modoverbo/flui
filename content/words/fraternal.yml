schema_version: 1
slug: "fraternal"
status: "draft"
lemma: "fraternal"
part_of_speech: "adjetivo"
syllables: ["fra", "ter", "nal"]
stressed_syllable: 3
ipa_latam: "[fɾa.terˈnal]"
ipa_es: "[fɾa.terˈnal]"
explanation: "Cariño cercano y de confianza entre amigos, parecido al que existe entre hermanos."
example_sentence: "Entre Camila y Renata hay un cariño fraternal que se nota hasta en cómo se cuidan en el trabajo."
register: "neutral"
pedantry_risk: 1
usage_tip: "Sirve para describir un cariño profundo entre amigos, parecido al de hermanos, sin serlo."
when_not_to_use: "No la uses para un trato apenas amable, ni para una relación con jerarquía, como la de un jefe."
collocations:
  - "cariño fraternal"
  - "abrazo fraternal"
  - "relación fraternal"
replaces:
  - before: "Nos llevamos como hermanos"
    after: "Tenemos una relación fraternal"
  - before: "Le tengo un cariño como de familia"
    after: "Le tengo un cariño fraternal"
family: ["fraternidad", "fraternizar"]
themes:
  - slug: "amistad"
    relevance: 3
tags:
  comodin: ["como hermanos"]
  funcion: ["elogiar"]
  canal: "ambos"
  formalidad: "neutral"
  variedad: "panhispanico"
confusions:
  - confused_with: "paternal"
    difference: "«Paternal» es el cariño protector de un padre hacia alguien, con una jerarquía; «fraternal» es el cariño entre iguales, como el de hermanos."
    memory_trick: "El cariño paternal protege desde arriba; el fraternal acompaña de igual a igual."
  - confused_with: "familiar"
    difference: "«Familiar» solo dice que algo pertenece a la familia o resulta conocido; «fraternal» describe específicamente el cariño cercano de hermanos."
    memory_trick: "Lo familiar es de la familia; lo fraternal es como entre hermanos, aunque no lo sean."
exercises:
  - position: 1
    sentence: "Cuando el hijo de Marta se quedó sin trabajo, su mejor amigo Iván lo llamó todos los días para saber cómo estaba: se trataban con un cariño {{blank}}, casi de hermanos."
    hint_general: "Busca la palabra para el cariño que se parece al que hay entre hermanos, aunque no lo sean."
    explanation: "Fraternal: un cariño parecido al de hermanos. «Paternal» supone una jerarquía de padre a hijo, y «cordial» describe un trato amable, más superficial que este vínculo."
    options:
      - position: 1
        text: "paternal"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Paternal» es el cariño protector de un padre, con una jerarquía; aquí se trata de dos amigos, no de una relación entre padre e hijo."
        hint_specific: "«Paternal» supone una jerarquía. ¿Iván y su amigo son iguales o uno protege al otro desde arriba?"
      - position: 2
        text: "fraternal"
        is_correct: true
      - position: 3
        text: "cordial"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cordial» describe un trato amable y cortés, más superficial que el vínculo cercano que describe la frase."
        hint_specific: "«Cordial» es solo amabilidad. ¿Llamar todos los días es solo amabilidad?"
  - position: 2
    sentence: "—Cuídate, hermano, aquí estoy para lo que sea —le escribió Tomás a su amigo Julio, con quien tenía un trato {{blank}} desde la universidad."
    hint_general: "Es la palabra para un trato tan próximo que parece el de dos hermanos."
    explanation: "Fraternal: un trato tan cercano como el de hermanos. «Fraterno» significa lo mismo, pero suena demasiado literario para un mensaje entre amigos, y «cercano» no tiene ese matiz de hermanos."
    options:
      - position: 1
        text: "fraterno"
        is_correct: false
        distractor_type: "register"
        why_not: "«Fraterno» significa lo mismo, pero es una forma poco usada en un mensaje de texto entre amigos."
        hint_specific: "Piensa en un mensaje de texto entre amigos. ¿«Fraterno» suena a ese tipo de mensaje?"
      - position: 2
        text: "cercano"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cercano» solo dice que hay poca distancia entre ellos, sin el matiz de cariño de hermanos que tiene la frase."
        hint_specific: "«Cercano» solo habla de distancia. ¿La frase habla solo de distancia o de un cariño como de hermanos?"
      - position: 3
        text: "fraternal"
        is_correct: true
  - position: 3
    sentence: "En su discurso de despedida, Gabriel dijo que su socio de veinte años había sido para él un amigo {{blank}}."
    hint_general: "Busca la palabra precisa para un cariño parecido al de hermanos, apropiada para un discurso."
    explanation: "Fraternal: un amigo tan cercano como un hermano. «Como un hermano más» es una frase de charla informal, y «entrañable» no señala el matiz específico de hermanos."
    options:
      - position: 1
        text: "como un hermano más"
        is_correct: false
        distractor_type: "register"
        why_not: "«Como un hermano más» es una frase de charla informal; un discurso formal pide una sola palabra más cuidada."
        hint_specific: "Piensa en el tono de un discurso formal. ¿«Como un hermano más» encaja ahí?"
      - position: 2
        text: "entrañable"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Entrañable» dice que alguien es muy querido, pero no señala específicamente el parecido con el cariño de hermanos."
        hint_specific: "«Entrañable» solo dice muy querido. ¿La frase pide algo más específico, como el cariño de hermanos?"
      - position: 3
        text: "fraternal"
        is_correct: true
  - position: 4
    sentence: "Después de diez años trabajando codo a codo, Camila y Renata se llevaban como si fueran hermanas: una amistad {{blank}}, sin jerarquías de por medio."
    hint_general: "Es la palabra para una amistad que se siente igual que la de dos hermanas."
    explanation: "Fraternal: una amistad sin jerarquías, como la de hermanas. «Paternal» supone justo una jerarquía, y «cercana» no tiene el matiz de hermanas que pide la frase."
    options:
      - position: 1
        text: "paternal"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Paternal» implica una relación de protección, como la de un padre; aquí ambas son iguales, sin jerarquías."
        hint_specific: "«Paternal» supone jerarquía. ¿La frase dice que hay jerarquía entre ellas?"
      - position: 2
        text: "cercana"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cercana» solo indica poca distancia entre ellas, sin el matiz de hermanas que pide la frase."
        hint_specific: "«Cercana» solo habla de distancia. ¿La frase pide solo distancia o el matiz de hermanas?"
      - position: 3
        text: "fraternal"
        is_correct: true
  - position: 5
    sentence: "Diego conoció a su compañero de cuarto en la universidad y, veinte años después, siguen teniendo una relación {{blank}}, como si fueran de la misma sangre."
    hint_general: "Busca la palabra para un vínculo que se siente como el de un hermano, aunque no haya parentesco."
    explanation: "Fraternal: un vínculo que se siente como el de hermanos. «Familiar» solo habla de parentesco o de algo conocido, y «entrañable» no señala ese matiz de hermanos."
    options:
      - position: 1
        text: "familiar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Familiar» dice que algo pertenece a la familia o resulta conocido; aquí ellos no son familia, se sienten como hermanos."
        hint_specific: "«Familiar» habla de parentesco real. ¿Diego y su compañero son parientes?"
      - position: 2
        text: "entrañable"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Entrañable» dice que alguien es muy querido, pero no que el vínculo se sienta como el de un hermano."
        hint_specific: "«Entrañable» solo dice muy querido. ¿La frase pide algo más específico?"
      - position: 3
        text: "fraternal"
        is_correct: true
  - position: 6
    sentence: "Los vecinos de toda la vida se trataban con un cariño {{blank}}, de esos que se construyen después de treinta años puerta con puerta."
    hint_general: "Busca la palabra para el cariño hondo que se siente casi como entre hermanos."
    explanation: "Fraternal: un cariño hondo, casi de hermanos. «Afectuoso» describe cariño en general, y «cordial» describe solo un trato amable, más ligero que este vínculo."
    options:
      - position: 1
        text: "afectuoso"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Afectuoso» describe cariño en general, pero no el matiz de sentirse casi como hermanos que trae la frase."
        hint_specific: "«Afectuoso» es cariño en general. ¿La frase pide un cariño general o uno como de hermanos?"
      - position: 2
        text: "cordial"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cordial» describe un trato amable, más ligero que el cariño profundo del que habla la frase."
        hint_specific: "«Cordial» es solo amabilidad. ¿Treinta años puerta con puerta construyen solo amabilidad?"
      - position: 3
        text: "fraternal"
        is_correct: true
  - position: 7
    sentence: "El director de la obra trataba a los actores del elenco con una complicidad {{blank}}, de igual a igual, después de meses ensayando juntos."
    hint_general: "Es la palabra para un vínculo de igual a igual, tan próximo como el de hermanos."
    explanation: "Fraternal: un vínculo de igual a igual, como el de hermanos. «Paternal» supone justo lo contrario, una jerarquía, y «cordial» solo describe amabilidad."
    options:
      - position: 1
        text: "paternal"
        is_correct: false
        distractor_type: "paronym"
        why_not: "«Paternal» supone una relación de arriba hacia abajo, y aquí el director los trata de igual a igual."
        hint_specific: "«Paternal» supone jerarquía. ¿La frase dice «de igual a igual» o «de arriba abajo»?"
      - position: 2
        text: "cordial"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Cordial» solo describe amabilidad en el trato, y aquí hay una complicidad mucho más profunda."
        hint_specific: "«Cordial» es solo amabilidad. ¿Dirigir una obra juntos durante meses construye solo amabilidad?"
      - position: 3
        text: "fraternal"
        is_correct: true
  - position: 8
    sentence: "Después del viaje que hicieron juntos por Sudamérica, Bruno y Esteban quedaron unidos por un lazo {{blank}} que ninguno de los dos esperaba."
    hint_general: "Busca la palabra para un lazo que, sin ser parientes de sangre, se siente igual al de hermanos."
    explanation: "Fraternal: un lazo que se siente igual al de hermanos. «Íntimo» dice que es muy personal, y «familiar» habla de parentesco, sin el matiz de hermanos que pide la frase."
    options:
      - position: 1
        text: "íntimo"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Íntimo» dice que el vínculo es muy personal y privado, pero no que se sienta como el de dos hermanos."
        hint_specific: "«Íntimo» es solo privado. ¿La frase pide algo privado o algo como de hermanos?"
      - position: 2
        text: "familiar"
        is_correct: false
        distractor_type: "near_synonym"
        why_not: "«Familiar» habla de parentesco o de algo conocido, y aquí no son parientes: se sienten como hermanos por elección."
        hint_specific: "«Familiar» habla de parentesco real. ¿Bruno y Esteban son parientes de sangre?"
      - position: 3
        text: "fraternal"
        is_correct: true
readings:
  - position: 1
    scene: "social"
    conversation_type: "emocional"
    title: "Veinte años después"
    body: "Cuando Bruno y Nicolás se reencontraron después de veinte años, fue como si no hubiera pasado el tiempo. Se abrazaron largo, se contaron todo y, al despedirse, Nicolás le dijo: «Para mí siempre vas a ser como un hermano»."
    before_phrase: "Nos llevamos como hermanos, aunque no lo seamos."
    after_phrase: "Tenemos una relación fraternal."
  - position: 2
    scene: "trabajo"
    conversation_type: "practica"
    title: "El equipo de siempre"
    body: "Después de ocho años trabajando en el mismo equipo, Camila y Renata se cuidaban como hermanas: se avisaban los errores antes de que nadie más los viera y se cubrían sin pedirlo. «Con ella no hace falta explicar nada», decía Camila."
    before_phrase: "Nos tratamos como familia en el trabajo."
    after_phrase: "Tenemos un vínculo fraternal en el equipo."
  - position: 3
    scene: "familia"
    conversation_type: "social"
    title: "Los primos que crecieron juntos"
    body: "Aunque son primos y no hermanos, Julio y Esteban crecieron juntos en la misma casa durante la infancia de sus padres, y esa cercanía nunca cambió. En cada cumpleaños, alguno de los dos repite lo mismo: «Para mí, eres mi hermano»."
    before_phrase: "Es como mi hermano, aunque seamos primos."
    after_phrase: "Tenemos un cariño fraternal desde niños."
