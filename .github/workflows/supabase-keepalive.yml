name: supabase-keepalive

# Supabase pauses Free-plan projects after a week without activity. A tiny read
# through the REST API twice a week keeps the production project awake.
# Remove this workflow once the project is on a paid plan.

on:
  schedule:
    - cron: "17 9 * * 1,4" # Mondays and Thursdays, 09:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Lightweight REST request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Secrets live in the "production" environment, not at repository level.
    environment: production
    steps:
      - name: Read one active plan with the anon key
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY secrets are required"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/subscription_plans?select=id&limit=1" > /dev/null
          echo "Supabase responded."
