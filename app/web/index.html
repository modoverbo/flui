<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="flui te ayuda a encontrar la palabra que encaja y a usarla con naturalidad. Unos minutos al día, a tu ritmo. 7 días gratis.">
  <meta name="theme-color" content="#0B3D34">
  <meta name="color-scheme" content="light">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="flui">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon: SVG first, PNG fallback -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

  <title>flui — Habla como quieres sonar.</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { height: 100%; margin: 0; background: #0B3D34; }
    #flui-splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #0B3D34;
    }
    #flui-splash svg { width: 88px; height: 88px; animation: flui-breathe 1.6s ease-in-out infinite; }
    @keyframes flui-breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #flui-splash svg { animation: none; } }
  </style>
</head>
<body>
  <div id="flui-splash" role="progressbar" aria-label="Cargando flui">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#F8F8F6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 14c5.33 -4.4 10.67 -4.4 16 0s10.67 4.4 16 0"/><path d="M8 24.5c5.33 -3.6 10.67 -3.6 16 0s10.67 3.6 16 0"/><path d="M10 35c5.33 -2.8 10.67 -2.8 16 0s10.67 2.8 16 0"/></svg>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('flui-splash');
      if (splash) splash.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
