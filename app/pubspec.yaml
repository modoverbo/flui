name: flui
description: "flui: habla como quieres sonar. Spanish communication trainer for adults."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  animations: ^3.0.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_lucide: ^1.45.0
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  http: ^1.6.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.2.0
  meta: ^1.19.0
  record: ^7.1.1
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/brand/flui_symbol.svg
    - assets/brand/flui_symbol_green.svg
    - assets/brand/LICENSE-tabler-icons.txt
    # The ten custom glyphs (tool/generate_glyphs.mjs).
    - assets/icons/
    # The green plate, pre-baked at 1x / 2x / 3x
    # (tool/generate_texture_plates.mjs).
    - assets/textures/
    - assets/fonts/plus_jakarta_sans/OFL.txt
    - assets/fonts/inter/OFL.txt

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600

# dart run flutter_launcher_icons (Android and iOS only; web icons come from tool/generate_brand_assets.mjs)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/brand/launcher/flui_launcher_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0B3D34"
  adaptive_icon_foreground: "assets/brand/launcher/flui_launcher_foreground.png"
  min_sdk_android: 21
