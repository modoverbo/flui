include: package:very_good_analysis/analysis_options.yaml

analyzer:
  errors:
    # freezed documents @JsonSerializable on factory constructors.
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/core/l10n/gen/**
    - build/**
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    # This is an application, not a published package: API docs on every public member add noise.
    public_member_api_docs: false

plugins:
  riverpod_lint: ^3.1.9
